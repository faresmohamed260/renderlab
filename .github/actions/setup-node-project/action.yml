name: Set up RenderLab Node project
description: Set up the supported Node runtime and install deterministic project dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package.json

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

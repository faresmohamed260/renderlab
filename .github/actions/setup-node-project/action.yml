name: Set up RenderLab Node project
description: Set up the supported Node runtime and install deterministic project dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package.json

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

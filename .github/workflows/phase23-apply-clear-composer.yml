name: Phase 23 Apply Clear Composer

on:
  push:
    branches:
      - work/phase-23-create-clear-composer
    paths:
      - .github/workflows/phase23-apply-clear-composer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          python3 scripts/phase23-apply-clear-composer.py
          sed -i '5s/[[:space:]]*$//' docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md

      - name: Commit implementation
        run: |
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git rm .github/workflows/phase23-apply-clear-composer.yml scripts/phase23-apply-clear-composer.py
          git add src/features/create/create-workspace.tsx src/app/globals.css scripts/verify-create-lifecycle.mjs docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md
          git diff --cached --check
          git commit -m "Phase 23: implement Clear Composer production composition"
          git push origin HEAD:work/phase-23-create-clear-composer

name: Android M0 One-Time Scaffold Bootstrap

# Temporary owner-initiated, feature-branch-only bootstrap. Must be REMOVED
# after a validated mobile package lockfile and CLI-sourced UI are committed.
# The GITHUB_TOKEN is exposed only to the final commit step (not npm postinstall).
on:
  push:
    branches: [feature/android-m0-foundation]
    paths:
      - .github/workflows/android-m0-bootstrap.yml
      - apps/mobile/**
permissions:
  contents: write
jobs:
  scaffold:
    if: "!contains(github.event.head_commit.message, '[mobile scaffold bootstrap]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Generate locked SDK 58 and maintained native component sources
        shell: bash
        run: |
          set -euo pipefail
          # One follow-up SDK-aligned install to make the Android OS chrome dark,
          # matching the already approved RenderLab theme. The package and lockfile
          # are committed together; this temporary workflow will then be removed.
          if test -f apps/mobile/package-lock.json; then
            cd apps/mobile
            npm ci --no-audit --no-fund
            npx expo install expo-system-ui
            node - <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          cfg.expo.userInterfaceStyle = 'dark';
          cfg.expo.backgroundColor = '#090A0C';
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.backgroundColor = '#090A0C';
          if (cfg.expo.android.adaptiveIcon) cfg.expo.android.adaptiveIcon.backgroundColor = '#090A0C';
          cfg.expo.plugins = [...new Set([...(cfg.expo.plugins || []),'expo-system-ui'])];
          fs.writeFileSync('app.json',JSON.stringify(cfg,null,2)+String.fromCharCode(10));
          NODE
            npm ci --no-audit --no-fund
            npx expo install --check
            npx --yes expo-doctor@latest
            npm run typecheck
            npm test
            npm run lint
            npm run export:android
            echo "SDK58 dark system-UI dependency and app config: PASS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes create-expo@5.1.5 "$RUNNER_TEMP/renderlab-m0-template" --template blank-typescript@sdk-58 --no-agents-md --yes
          for file in package.json package-lock.json app.json tsconfig.json; do
            cp "$RUNNER_TEMP/renderlab-m0-template/$file" apps/mobile/"$file"
          done
          if test -d "$RUNNER_TEMP/renderlab-m0-template/assets"; then
            cp -R "$RUNNER_TEMP/renderlab-m0-template/assets" apps/mobile/assets
          fi
          cd apps/mobile
          npm ci --no-audit --no-fund
          npm pkg set devDependencies.react-dom=19.3.0
          npx expo install expo-router react-native-safe-area-context react-native-screens expo-linking expo-constants expo-status-bar
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (!/^~?58\./.test(pkg.dependencies.expo) ||
              !/^0\.88\./.test(pkg.dependencies['react-native']) ||
              !/^19\.3\./.test(pkg.dependencies.react)) {
            throw new Error('SDK 58 React/RN matrix drift; manual review required');
          }
          pkg.name = '@renderlab/mobile';
          pkg.private = true;
          pkg.version = '0.0.0';
          pkg.main = 'expo-router/entry';
          pkg.scripts = {
            start: 'expo start',
            android: 'expo start --android',
            typecheck: 'tsc --noEmit',
            test: 'node --experimental-strip-types --test tests/*.test.mjs',
            lint: 'eslint src/app src/features src/services src/state src/theme',
            'export:android': 'expo export --platform android --output-dir dist-android',
          };
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const cfg = JSON.parse(fs.readFileSync('app.json','utf8'));
          cfg.expo.name = 'RenderLab M0 Dev';
          cfg.expo.slug = 'renderlab-mobile-m0';
          cfg.expo.scheme = 'renderlab-m0-dev';
          cfg.expo.plugins = ['expo-router'];
          cfg.expo.experiments = { typedRoutes: true };
          delete cfg.expo.android?.package;
          delete cfg.expo.extra?.eas;
          fs.writeFileSync('app.json',JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx --yes gluestack-ui@5.0.3 init --path src/components/ui --uniwind --use-npm --yes
          npx --yes gluestack-ui@5.0.3 add button --path src/components/ui --use-npm --yes
          npm pkg set overrides.zod=4.6.7
          npx expo install react-native-web react-native-gesture-handler @expo/vector-icons expo-font expo-dev-client expo-secure-store
          npx expo install babel-preset-expo -- --save-dev
          npm install --save-exact @tanstack/react-query@5 zustand@5 --no-audit --no-fund
          npm install --save-dev eslint@9 eslint-config-expo --no-audit --no-fund
          cat > eslint.config.js <<'EOF'
          const { defineConfig } = require('eslint/config');
          const expoConfig = require('eslint-config-expo/flat');
          module.exports = defineConfig([
            expoConfig,
            { ignores: ['dist/**', 'dist-android/**', '.expo/**', 'node_modules/**'] },
          ]);
          EOF
          rm -f App.tsx index.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const ts = JSON.parse(fs.readFileSync('tsconfig.json','utf8'));
          ts.compilerOptions = { ...ts.compilerOptions, strict: true, paths: { '@/*': ['./src/*'] } };
          fs.writeFileSync('tsconfig.json',JSON.stringify(ts,null,2)+'\n');
          const babel = fs.readFileSync('babel.config.js','utf8');
          if (!babel.includes("'module-resolver'") || !babel.includes("'@': './'") ||
              !babel.includes("'react-native-worklets/plugin'")) {
            throw new Error('Gluestack Babel output changed; review instead of overriding');
          }
          fs.writeFileSync('babel.config.js', [
            'module.exports = function (api) {',
            '  api.cache(true);',
            '  return {',
            "    presets: ['babel-preset-expo'],",
            "    plugins: ['react-native-worklets/plugin'],",
            '  };',
            '};',
            ''
          ].join('\n'));
          NODE
          test -d src/components/ui/gluestack-ui-provider
          test -d src/components/ui/button
          test -f global.css
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx expo install --check
          npx --yes expo-doctor@latest
          npm run typecheck
          npm test
          npm run lint
          npm run export:android
          echo "M0 scaffold dependencies, TS, unit tests, lint and Metro Android export: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit generated lockfile and maintained UI only to implementation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f apps/mobile/package-lock.json
          test -f apps/mobile/babel.config.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile
          git diff --cached --check
          git diff --cached --quiet && { echo "No generated changes"; exit 0; }
          git commit -m 'build(mobile): pin verified Expo M0 scaffold [mobile scaffold bootstrap]'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/feature/android-m0-foundation
          echo "Generated files committed only to feature/android-m0-foundation" >> "$GITHUB_STEP_SUMMARY"

name: Prepare Phase 25 Viewer implementation contract

on:
  push:
    branches:
      - plan/phase-25-media-viewer-register-fold
    paths:
      - .github/workflows/tmp-phase25-viewer-contract.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: plan/phase-25-media-viewer-register-fold
          fetch-depth: 0
      - name: Append UI-076 and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^### UI-076 — Media Viewer uses an attached Media Register and Result-primary Source Fold$' docs/ui/UI_DECISIONS.md; then
            printf '\n' >> docs/ui/UI_DECISIONS.md
            cat docs/ui/.tmp-ui076.md >> docs/ui/UI_DECISIONS.md
          fi
          rm docs/ui/.tmp-ui076.md
          rm .github/workflows/tmp-phase25-viewer-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/UI_DECISIONS.md docs/ui/.tmp-ui076.md .github/workflows/tmp-phase25-viewer-contract.yml
          git commit -m "Record UI-076 Viewer design decision"
          git push origin HEAD:plan/phase-25-media-viewer-register-fold

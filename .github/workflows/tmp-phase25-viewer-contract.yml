name: Prepare Phase 25 Viewer implementation contract

on:
  push:
    branches:
      - plan/phase-25-media-viewer-register-fold
    paths:
      - .github/workflows/tmp-phase25-viewer-contract.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: plan/phase-25-media-viewer-register-fold
          fetch-depth: 0
      - name: Write UI-076 and Phase 25 contract
        shell: bash
        env:
          UI076_B64: 
          CONTRACT_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          decisions = Path("docs/ui/UI_DECISIONS.md")
          decision = base64.b64decode(os.environ["UI076_B64"]).decode("utf-8").rstrip() + "\n"
          current = decisions.read_text()
          if "### UI-076 — Media Viewer uses an attached Media Register and Result-primary Source Fold" not in current:
              decisions.write_text(current.rstrip() + "\n\n" + decision)

          contract = base64.b64decode(os.environ["CONTRACT_B64"]).decode("utf-8")
          Path("docs/ui/MEDIA_VIEWER_REGISTER_FOLD_IMPLEMENTATION_CONTRACT.md").write_text(contract)
          PY

          rm .github/workflows/tmp-phase25-viewer-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/UI_DECISIONS.md docs/ui/MEDIA_VIEWER_REGISTER_FOLD_IMPLEMENTATION_CONTRACT.md .github/workflows/tmp-phase25-viewer-contract.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Plan Phase 25 Media Viewer implementation"
          git push origin HEAD:plan/phase-25-media-viewer-register-fold

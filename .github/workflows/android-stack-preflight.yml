name: Android Stack Preflight

# Discovery-only: a disposable Expo app is generated in the runner temporary dir.
# No RenderLab product code, credentials, native distribution or EAS project is created.
on:
  pull_request:
    paths:
      - .github/workflows/android-stack-preflight.yml
      - docs/architecture/MOBILE_APP_PHASE_M0_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-android-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimal-expo58-gluestack-uniwind:
    name: Minimal Expo 58 / Router / gluestack v5 / UniWind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      npm_config_fund: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository for traceability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use RenderLab Node.js standard
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Create temporary minimal SDK 58 TypeScript starter
        run: |
          set -euo pipefail
          node --version
          npm --version
          mkdir -p "$RUNNER_TEMP/renderlab-mobile-probe"
          cd "$RUNNER_TEMP/renderlab-mobile-probe"
          npx --yes create-expo@5.1.5 probe --template blank-typescript@sdk-58 --no-agents-md --yes
          test -f probe/package-lock.json
          test -f probe/tsconfig.json

      - name: Configure temporary Expo Router with SDK-matched dependencies
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # Keep optional Expo Router web peers on the same React patch even though
          # this preflight targets Android; never bypass npm peer resolution.
          npm pkg set devDependencies.react-dom=19.3.0
          npx expo install expo-router react-native-safe-area-context react-native-screens expo-linking expo-constants expo-status-bar
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.match(pkg.dependencies.expo, /58\./);
          assert.match(pkg.dependencies['react-native'], /0\.88\./);
          assert.match(pkg.dependencies.react, /19\.3\./);
          assert.ok(pkg.dependencies['expo-router']);
          pkg.main = 'expo-router/entry';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.scheme = 'renderlab-preflight-only';
          config.expo.plugins = ['expo-router'];
          config.expo.experiments = { typedRoutes: true };
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          const ts = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          ts.compilerOptions = { ...ts.compilerOptions, strict: true, paths: { '@/*': ['./src/*'] } };
          fs.writeFileSync('tsconfig.json', JSON.stringify(ts, null, 2) + '\n');
          NODE
          mkdir -p src/app
          cat > src/app/_layout.tsx <<'EOF'
          import { Slot } from 'expo-router';
          export default function RootLayout() { return <Slot />; }
          EOF
          cat > src/app/index.tsx <<'EOF'
          import { Text, View } from 'react-native';
          export default function Index() { return <View><Text>Temporary SDK verification only</Text></View>; }
          EOF
          npm ci --no-audit --no-fund

      - name: Validate clean minimal Expo Router baseline
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npx expo install --check
          npx tsc --noEmit
          npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-minimal-baseline-export"

      - name: CLI-install gluestack v5 and UniWind in disposable starter
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npx --yes gluestack-ui@5.0.3 init --uniwind --use-npm --yes
          npx --yes gluestack-ui@5.0.3 add button --use-npm --yes
          # Required by gluestack v5 as an explicit peer, even for Android export.
          # Install the Expo-SDK-matched version rather than suppressing the doctor gate.
          npx expo install react-native-web
          test -f package-lock.json
          npm ci --no-audit --no-fund

      - name: Exercise generated Button in throwaway Android route
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          cat > src/app/index.tsx <<'EOF'
          import { View } from 'react-native';
          import { Button, ButtonText } from '@/components/ui/button';
          export default function Index() {
            return <View><Button><ButtonText>SDK integration smoke</ButtonText></Button></View>;
          }
          EOF

      - name: Validate combined dependency tree, TypeScript and Android export
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npx expo install --check
          npx --yes expo-doctor@latest
          npx tsc --noEmit
          npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-minimal-gluestack-export"
          npm ls expo react react-native expo-router uniwind --depth=0
          echo "Minimal SDK 58 Expo Router / gluestack v5 / UniWind TypeScript and Android JS export: PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "No native APK build, device rendering, EAS project or OTA delivery was tested." >> "$GITHUB_STEP_SUMMARY"

name: Android Stack Preflight

# Discovery-only: a disposable Expo app is generated in the runner temporary dir.
# No RenderLab product code, credentials, native distribution or EAS project is created.
on:
  pull_request:
    paths:
      - .github/workflows/android-stack-preflight.yml
      - docs/architecture/MOBILE_APP_PHASE_M0_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-android-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimal-expo58-gluestack-uniwind:
    name: Minimal Expo 58 / Router / gluestack v5 / UniWind
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      npm_config_fund: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository for traceability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use RenderLab Node.js standard
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Create temporary minimal SDK 58 TypeScript starter
        run: |
          set -euo pipefail
          node --version
          npm --version
          mkdir -p "$RUNNER_TEMP/renderlab-mobile-probe"
          cd "$RUNNER_TEMP/renderlab-mobile-probe"
          npx --yes create-expo@5.1.5 probe --template blank-typescript@sdk-58 --no-agents-md --yes
          test -f probe/package-lock.json
          test -f probe/tsconfig.json

      - name: Configure temporary Expo Router with SDK-matched dependencies
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # Keep optional Expo Router web peers on the same React patch even though
          # this preflight targets Android; never bypass npm peer resolution.
          npm pkg set devDependencies.react-dom=19.3.0
          npx expo install expo-router react-native-safe-area-context react-native-screens expo-linking expo-constants expo-status-bar
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.match(pkg.dependencies.expo, /58\./);
          assert.match(pkg.dependencies['react-native'], /0\.88\./);
          assert.match(pkg.dependencies.react, /19\.3\./);
          assert.ok(pkg.dependencies['expo-router']);
          pkg.main = 'expo-router/entry';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.scheme = 'renderlab-preflight-only';
          config.expo.plugins = ['expo-router'];
          config.expo.experiments = { typedRoutes: true };
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          const ts = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          ts.compilerOptions = { ...ts.compilerOptions, strict: true, paths: { '@/*': ['./src/*'] } };
          fs.writeFileSync('tsconfig.json', JSON.stringify(ts, null, 2) + '\n');
          NODE
          mkdir -p src/app
          cat > src/app/_layout.tsx <<'EOF'
          import { Slot } from 'expo-router';
          export default function RootLayout() { return <Slot />; }
          EOF
          cat > src/app/index.tsx <<'EOF'
          import { Text, View } from 'react-native';
          export default function Index() { return <View><Text>Temporary SDK verification only</Text></View>; }
          EOF
          npm ci --no-audit --no-fund

      - name: Validate clean minimal Expo Router baseline
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npx expo install --check
          npx tsc --noEmit
          npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-minimal-baseline-export"

      - name: CLI-install gluestack v5 and UniWind in disposable starter
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npx --yes gluestack-ui@5.0.3 init --path src/components/ui --uniwind --use-npm --yes
          npx --yes gluestack-ui@5.0.3 add button --path src/components/ui --use-npm --yes
          # Temporary non-production mitigation candidate for GHSA-mrhx-c7xc-m3w5:
          # the fixed Zod patch is evaluated against Expo's dependency tree, not
          # accepted into RenderLab's app until API/peer compatibility is proven.
          npm pkg set overrides.zod=4.6.7
          # Required by gluestack v5 as an explicit peer, even for Android export.
          # Install the Expo-SDK-matched version rather than suppressing the doctor gate.
          npx expo install react-native-web react-native-gesture-handler
          # Blank Expo starter has no Babel config; gluestack CLI adds a config
          # requiring this SDK-owned preset without adding it automatically.
          npx expo install babel-preset-expo -- --save-dev
          test -f package-lock.json
          npm ci --no-audit --no-fund

      - name: Normalize CLI output into an Expo Router src layout
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          test -f global.css
          test -d src/components/ui/gluestack-ui-provider
          test -d src/components/ui/button
          # Gluestack's CLI writes a legacy App.tsx even when Expo Router is the
          # configured entry. Keep only the true Router root in this probe.
          rm -f App.tsx index.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const ts = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          ts.compilerOptions = { ...ts.compilerOptions, strict: true, paths: { '@/*': ['./src/*'] } };
          fs.writeFileSync('tsconfig.json', JSON.stringify(ts, null, 2) + '\n');
          NODE
          cat > src/global-css.d.ts <<'EOF'
          declare module '*.css';
          EOF
          cat > src/app/_layout.tsx <<'EOF'
          import '../../global.css';
          import { Slot } from 'expo-router';
          import { GluestackUIProvider } from '@/components/ui/gluestack-ui-provider';
          export default function RootLayout() {
            return <GluestackUIProvider mode="dark"><Slot /></GluestackUIProvider>;
          }
          EOF

      - name: Normalize CLI Babel resolver to the Expo Router alias authority
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const babel = fs.readFileSync('babel.config.js','utf8');
          if (!babel.includes("'module-resolver'") || !babel.includes("'@': './'") || !babel.includes("'react-native-worklets/plugin'")) {
            throw new Error('Unexpected gluestack CLI Babel output; review before normalizing');
          }
          // gluestack's generic Babel alias maps @ to project root, conflicting
          // with Expo Router's canonical src/ path alias. Expo Metro natively
          // resolves compilerOptions.paths: no duplicate Babel alias is needed.
          fs.writeFileSync('babel.config.js', [
            'module.exports = function (api) {',
            '  api.cache(true);',
            '  return {',
            "    presets: ['babel-preset-expo'],",
            "    plugins: ['react-native-worklets/plugin'],",
            '  };',
            '};',
            ''
          ].join('\n'));
          NODE

      - name: Inspect generated Metro, Babel and alias configuration
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          echo '--- Babel (no secrets in disposable project) ---'
          cat babel.config.js
          echo '--- Metro ---'
          cat metro.config.js
          echo '--- TypeScript ---'
          cat tsconfig.json
          echo '--- gluestack config ---'
          cat gluestack-ui.config.json || true
          node - <<'NODE'
          const p = require('node:path');
          const fs = require('node:fs');
          for (const modulePath of ['src/components/ui/button', 'src/components/ui/gluestack-ui-provider']) {
            if (!fs.existsSync(modulePath)) throw new Error('Missing generated local component ' + modulePath);
            console.log('Physical alias target: ' + p.resolve(modulePath));
          }
          NODE

      - name: Exercise generated Button in throwaway Android route
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          cat > src/app/index.tsx <<'EOF'
          import { View } from 'react-native';
          import { Button, ButtonText } from '@/components/ui/button';
          export default function Index() {
            return <View><Button><ButtonText>SDK integration smoke</ButtonText></Button></View>;
          }
          EOF

      - name: Validate combined dependency tree, TypeScript and Android export
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npx expo install --check
          npx --yes expo-doctor@latest
          npx tsc --noEmit
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const ts = require('./tsconfig.json');
          if ('baseUrl' in ts.compilerOptions || ts.compilerOptions.paths['@/*'][0] !== './src/*') {
            throw new Error('Expo native import aliases must map to src without deprecated TypeScript baseUrl');
          }
          for (const p of ['src/components/ui/button', 'src/components/ui/gluestack-ui-provider']) {
            if (!fs.existsSync(path.join(process.cwd(), p))) throw new Error('Generated component directory is missing: ' + p);
          }
          console.log('Expo Router aliases use canonical ./src/* mapping; duplicate Babel root aliases are removed');
          NODE
          # Compile true Hermes output as the compatibility gate; don't change
          # the accepted Android JS test while adding source-map diagnostics.
          npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-minimal-gluestack-export"
          npm ls expo react react-native expo-router uniwind --depth=0
          npm ls zod node-forge --all
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const zod = Object.entries(lock.packages || {}).filter(([path]) => path.endsWith('node_modules/zod'))
            .map(([path,pkg]) => ({path,version:pkg.version}));
          if (!zod.length || zod.some(({version}) => !version.startsWith('4.6.7'))) {
            throw new Error('Zod patch override failed to converge to the tested 4.6.7 release: ' + JSON.stringify(zod));
          }
          console.log('Resolved Zod lockfile versions: ' + JSON.stringify(zod));
          NODE
          echo "Minimal SDK 58 Expo Router / gluestack v5 / UniWind TypeScript and Android JS export: PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "No native APK build, device rendering, EAS project or OTA delivery was tested." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Metro live development edit without Android rebuild
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Scope: prove the live Android JS bundler sees an edited route.
          # No connected phone, dev-client APK, Expo account or EAS update.
          export EXPO_OFFLINE=1
          port=18081
          log="$RUNNER_TEMP/renderlab-metro-dev-server.log"
          # CI=1 intentionally disables Metro file watching; opt out only for
          # this disposable development-mode process to validate live edits.
          CI=0 npx expo start --localhost --port "$port" --go > "$log" 2>&1 &
          metro_pid=$!
          cleanup() {
            kill "$metro_pid" 2>/dev/null || true
            wait "$metro_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 45); do
            # Expo's root handler and /status vary by SDK; the Android bundle
            # fetch below is the authoritative Metro compilation assertion.
            # An HTTP 404 on / can still mean Metro is listening. The
            # source bundle response below must return HTTP 200 and include
            # the actual generated route.
            status="$(curl --silent --max-time 3 --output /dev/null --write-out '%{http_code}' "http://localhost:$port/" || true)"
            if [[ "$status" =~ ^(2[0-9][0-9]|3[0-9][0-9]|404)$ ]]; then
              ready=1
              break
            fi
            if ! kill -0 "$metro_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if test "$ready" -ne 1; then
            tail -n 100 "$log" || true
            echo "Local Metro dev server did not become ready." >&2
            exit 1
          fi
          bundle_url="http://localhost:$port/.expo/.virtual-metro-entry.bundle?platform=android&dev=true&minify=false"
          before="$RUNNER_TEMP/renderlab-before-edit.bundle"
          after="$RUNNER_TEMP/renderlab-after-edit.bundle"
          if ! curl --fail --show-error --silent --max-time 120 "$bundle_url" -o "$before"; then
            tail -n 120 "$log" || true
            exit 1
          fi
          grep -Fq 'SDK integration smoke' "$before" || {
            tail -n 120 "$log" || true
            echo "Android dev bundle did not include the generated UI component label." >&2
            exit 1
          }
          # Modify only the temporary test route while Metro remains running.
          sed -i 's/SDK integration smoke/SDK live edit smoke/' src/app/index.tsx
          grep -Fq 'SDK live edit smoke' src/app/index.tsx
          updated=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --max-time 40 "$bundle_url" -o "$after" && grep -Fq 'SDK live edit smoke' "$after"; then
              updated=1
              break
            fi
            sleep 2
          done
          if test "$updated" -ne 1; then
            tail -n 120 "$log" || true
            echo "Metro did not reflect the temporary TypeScript edit in Android dev bundle." >&2
            exit 1
          fi
          # Restore fixture for subsequent bundle/security/native validation.
          sed -i 's/SDK live edit smoke/SDK integration smoke/' src/app/index.tsx
          echo "Metro localhost Android development bundle and live TypeScript edit: PASS (no APK rebuild)." >> "$GITHUB_STEP_SUMMARY"
          echo "Not a connected-device Fast Refresh, EAS Update, or native installation test." >> "$GITHUB_STEP_SUMMARY"

      - name: Trace signing dependency and disposable Android source-map modules
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npm explain node-forge
          npm explain @expo/code-signing-certificates
          # Built-in SDK 58 exporter, no duplicate Expo Atlas / expo-server peer.
          # Source maps stay inside runner temp and are never uploaded.
          npx expo export --source-maps --no-bytecode --platform android --output-dir "$RUNNER_TEMP/expo-android-security-map"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'expo-android-security-map');
          const maps = [];
          function scan(dir) {
            for (const item of fs.readdirSync(dir, {withFileTypes:true})) {
              const file = path.join(dir, item.name);
              if (item.isDirectory()) scan(file);
              else if (item.name.endsWith('.map')) maps.push(file);
            }
          }
          scan(root);
          if (!maps.length) throw new Error('Android analysis export did not produce source-map files');
          const sources = new Set();
          const shapes = [];
          function collect(record) {
            if (!record || typeof record !== 'object') return;
            for (const p of record.sources || []) sources.add(p.replace(/\\/g, '/'));
            for (const section of record.sections || []) collect(section.map);
          }
          for (const file of maps) {
            const record = JSON.parse(fs.readFileSync(file,'utf8'));
            shapes.push({name:path.basename(file),keys:Object.keys(record),sections:(record.sections||[]).length});
            collect(record);
          }
          console.log('Android source-map schema: ' + JSON.stringify(shapes));
          if (!sources.size) throw new Error('Android source maps contain neither flat nor indexed module sources');
          const risky = [...sources].filter(p => p.includes('node_modules/node-forge/') ||
              p.includes('node_modules/@expo/code-signing-certificates/'));
          const cli = [...sources].filter(p => p.includes('node_modules/@expo/cli/'));
          console.log('Android source maps found: ' + maps.length);
          console.log('Android mapped module source count: ' + sources.size);
          console.log('node-forge / Expo certificate signer Android mapped source count: ' + risky.length);
          console.log('Expo CLI Android mapped modules (expected Metro runtime helper): ' + JSON.stringify(cli.slice(0, 20)));
          console.log('Mapped vulnerable signing package modules: ' + JSON.stringify(risky.slice(0, 20)));
          if (risky.length) throw new Error('Vulnerable cryptography or certificate signer package enters the temporary Android JS bundle; review before native build');
          // Negative evidence applies to this minimum route only, and cannot
          // clear npm audit or prove signing tooling itself safe.
          NODE

      - name: Generate disposable Android native project without credentials
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          # This identity is a throwaway probe name, NOT a proposed RenderLab
          # package ID. No EAS project, login, Auth callback or update channel.
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json','utf8'));
          config.expo.android = {package:'dev.renderlab.temporaryprobe'};
          if (config.expo.extra?.eas?.projectId || config.expo.updates?.url) {
            throw new Error('Disallowed EAS/update project binding in temporary native probe');
          }
          fs.writeFileSync('app.json',JSON.stringify(config,null,2));
          NODE
          npx expo prebuild --platform android --no-install --non-interactive
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          if test -e eas.json || test -e ios; then
            echo "Forbidden EAS configuration or iOS native output in Android-only probe" >&2
            exit 1
          fi
          echo "Disposable Expo SDK 58 Android Gradle project generated without Expo/EAS credentials." >> "$GITHUB_STEP_SUMMARY"

      - name: Compile temporary Android debug APK without distribution
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe/android
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?GitHub runner needs supported JDK 17}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_USER_HOME="$RUNNER_TEMP/renderlab-gradle-home"
          export ANDROID_USER_HOME="$RUNNER_TEMP/renderlab-android-debug-home"
          mkdir -p "$GRADLE_USER_HOME" "$ANDROID_USER_HOME"
          java -version
          # Linux runner images may expose ANDROID_SDK_ROOT without ANDROID_HOME.
          # Detect the preinstalled public Android toolchain, never assume a
          # credentialed EAS worker or install custom system-wide dependencies.
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          command -v sdkmanager
          printf 'Android SDK root: %s\\n' "$ANDROID_HOME"
          df -h .
          # SDK 58 / RN 0.88 targets compile API 37 and NDK r27.
          # Public Android SDK packages only; no signing or Expo credentials.
          # Android's official SDK manager uses the 37.0 minor-version package
          # identifier, not "platforms;android-37". Require it on the STABLE
          # package channel; do not silently consume a canary SDK or link/copy
          # platforms in the host OS as a workaround.
          timeout 60s sdkmanager --channel=0 --list | grep -F "platforms;android-37.0"
          timeout 300s sdkmanager --channel=0 --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          chmod +x ./gradlew
          # Smoke-test one supported modern Android ABI rather than all four.
          # Prior run 40164786247 spent 20 minutes compiling 4 ABIs and timed out
          # at app:x86_64 without a compiler error. This DOES NOT qualify x86
          # emulators, 32-bit ARM, universal/multi-ABI builds or app delivery.
          timeout 1200s ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain --max-workers=2
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "Isolated Android assembleDebug: PASS (ephemeral debug key only)." >> "$GITHUB_STEP_SUMMARY"
          echo "No APK was uploaded, retained, installed, EAS-signed or published." >> "$GITHUB_STEP_SUMMARY"
          # Prevent later steps from treating this disposable binary as a release.
          rm -f "$apk"

      - name: Inspect production dependency advisories for Android probe
        if: always()
        working-directory: ${{ runner.temp }}/renderlab-mobile-probe/probe
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > "$RUNNER_TEMP/renderlab-mobile-audit.json" || true
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/renderlab-mobile-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          const rows = Object.entries(report.vulnerabilities || {}).filter(([,v])=>v.severity==='high'||v.severity==='critical')
            .map(([name,v])=>({
              name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,
              nodes:v.nodes,
              advisories:(v.via||[]).filter(x=>typeof x==='object').map(x=>({
                title:x.title,url:x.url,range:x.range,source:x.source
              }))
            }));
          console.log('PRODUCTION npm audit counts: ' + JSON.stringify(counts));
          console.log('PRODUCTION high/critical affected packages: ' + JSON.stringify(rows));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\\nProduction dependency audit (throwaway lockfile): ' +
            JSON.stringify(counts) + '\\n');
          // A finding is a setup blocker even when the Android export succeeds.
          if ((counts.high||0) + (counts.critical||0) > 0) {
            console.error('Dependency security review: BLOCKED by high/critical production findings.');
            process.exitCode = 1;
          }
          NODE

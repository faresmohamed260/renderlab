name: Phase 25 Fix Details Locator

on:
  push:
    branches:
      - work/phase-25-media-viewer-register-fold
    paths:
      - .github/workflows/phase25-fix-details-locator.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-25-media-viewer-register-fold
          fetch-depth: 0

      - name: Scope Details evidence locator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-media-viewer-register-fold.mjs")
          text = path.read_text()
          old = '  await page.getByText("1200 × 800", { exact: true }).waitFor({ state: "visible" });'
          new = '  await page.getByLabel("DETAILS", { exact: true }).getByText("1200 × 800", { exact: true }).waitFor({ state: "visible" });'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one ambiguous Details geometry locator, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          node --check scripts/verify-media-viewer-register-fold.mjs
          git diff --check

      - name: Commit verifier-only correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-media-viewer-register-fold.mjs
          git diff --cached --check
          git commit -m "Scope Phase 25 Details evidence locator"
          git push origin HEAD:work/phase-25-media-viewer-register-fold

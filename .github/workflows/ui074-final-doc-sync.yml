name: UI-074 Final Documentation Sync

on:
  push:
    branches:
      - work/phase-23-create-fidelity-correction
    paths:
      - .github/workflows/ui074-final-doc-sync.yml
      - scripts/ui074-final-doc-sync.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/phase-23-create-fidelity-correction
          fetch-depth: 0

      - name: Synchronize approved correction evidence
        run: python3 scripts/ui074-final-doc-sync.py

      - name: Commit synchronized documentation and remove helpers
        run: |
          rm .github/workflows/ui074-final-doc-sync.yml
          rm scripts/ui074-final-doc-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md docs/ui/COMPONENT_CATALOG.md docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md .github/workflows/ui074-final-doc-sync.yml scripts/ui074-final-doc-sync.py
          git diff --cached --check
          git commit -m "Document approved UI-074 correction"
          git push origin HEAD:work/phase-23-create-fidelity-correction

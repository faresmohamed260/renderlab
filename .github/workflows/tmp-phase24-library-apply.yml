name: Apply Phase 24 Library Gallery Rail

on:
  push:
    branches:
      - work/phase-24-library-gallery-rail
    paths:
      - .github/workflows/tmp-phase24-library-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-24-library-gallery-rail
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Apply Gallery Rail implementation
        run: |
          python scripts/tmp_phase24_library_apply.py
          sed -i 's/toggleSelection(asset.id, checked === true)/toggleAsset(asset.id, checked === true)/' src/features/library/library-batch-selection.tsx
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify UI purity
        run: npm run verify:ui-purity

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/library/library-view.tsx src/features/library/library-batch-selection.tsx src/features/library/library-sort-toggle.tsx scripts/verify-library-history.mjs
          git commit -m "Implement Library Gallery Rail v0.3"
          git push origin HEAD:work/phase-24-library-gallery-rail

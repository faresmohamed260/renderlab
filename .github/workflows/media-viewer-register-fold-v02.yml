name: Media Viewer Register + Source Fold R&D v0.2

on:
  push:
    branches:
      - rd/media-viewer-register-fold-v02
    paths:
      - '.github/workflows/media-viewer-register-fold-v02.yml'
      - 'design/rd/media-viewer-register-fold-v02.md'
      - 'design/prototypes/media-viewer-register-fold-v02/**'
      - 'scripts/verify-media-viewer-register-fold-v02.mjs'
  workflow_dispatch:

concurrency:
  group: media-viewer-register-fold-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify focused Media Viewer candidate and evidence
        run: node scripts/verify-media-viewer-register-fold-v02.mjs

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-media-viewer-register-fold-v02
          path: artifacts/media-viewer-register-fold-v02
          if-no-files-found: ignore
          retention-days: 30

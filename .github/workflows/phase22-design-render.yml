name: Phase 22 design render review

on:
  push:
    branches:
      - design/phase-22-system-cohesion
    paths:
      - ".github/workflows/phase22-design-render.yml"
      - "design/penpot/phase22-activity-kinetic-v0.1.svg"
      - "design/penpot/phase22-settings-trust-v0.1.svg"
      - "design/penpot/phase22-landing-kinetic-v0.1.svg"
      - "design/penpot/phase22-system-cohesion-v0.1.svg"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/phase-22-system-cohesion

      - name: Install SVG validation and render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils librsvg2-bin imagemagick

      - name: Validate checkpoint SVG source
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout \
            design/penpot/phase22-activity-kinetic-v0.1.svg \
            design/penpot/phase22-settings-trust-v0.1.svg \
            design/penpot/phase22-landing-kinetic-v0.1.svg \
            design/penpot/phase22-system-cohesion-v0.1.svg

      - name: Render checkpoint pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase22-render
          rsvg-convert -w 950 design/penpot/phase22-activity-kinetic-v0.1.svg -o /tmp/phase22-render/activity.png
          rsvg-convert -w 950 design/penpot/phase22-settings-trust-v0.1.svg -o /tmp/phase22-render/settings.png
          rsvg-convert -w 950 design/penpot/phase22-landing-kinetic-v0.1.svg -o /tmp/phase22-render/landing.png
          rsvg-convert -w 950 design/penpot/phase22-system-cohesion-v0.1.svg -o /tmp/phase22-render/cohesion.png
          convert /tmp/phase22-render/activity.png /tmp/phase22-render/settings.png /tmp/phase22-render/landing.png /tmp/phase22-render/cohesion.png -append -resize 1000x -quality 60 design/penpot/phase22-system-cohesion-v0.1-review.jpg
          identify /tmp/phase22-render/*.png design/penpot/phase22-system-cohesion-v0.1-review.jpg

      - name: Upload exact review pixels
        uses: actions/upload-artifact@v4
        with:
          name: phase22-system-cohesion-review
          path: |
            /tmp/phase22-render/activity.png
            /tmp/phase22-render/settings.png
            /tmp/phase22-render/landing.png
            /tmp/phase22-render/cohesion.png
            design/penpot/phase22-system-cohesion-v0.1-review.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Commit review sheet and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase22-design-render.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: render Phase 22 system cohesion review evidence"
          git push origin HEAD:design/phase-22-system-cohesion

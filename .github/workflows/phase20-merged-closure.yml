name: Phase 20 merged-main closure

on:
  push:
    branches:
      - docs/phase-20-merged-closure
    paths:
      - .github/workflows/phase20-merged-closure.yml
      - .github/scripts/phase20-merged-closure.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-20-merged-closure
          fetch-depth: 0
      - name: Guard exact merged-main parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "09ea91f753be5279428ccf25a7b043300678c3f3"
      - name: Update Phase 20 merged-main source of truth
        run: python .github/scripts/phase20-merged-closure.py
      - name: Commit closure and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/phase20-merged-closure.yml .github/scripts/phase20-merged-closure.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/INFRASTRUCTURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close Phase 20 merged-main handoff"
          git push origin HEAD:docs/phase-20-merged-closure

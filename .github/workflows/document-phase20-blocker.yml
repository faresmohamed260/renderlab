name: Document Phase 20 blocker

on:
  push:
    branches:
      - docs/phase20-blocked-20260907
    paths:
      - .github/workflows/document-phase20-blocker.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase20-blocked-20260907
          fetch-depth: 0
      - name: Apply Phase 20 blocked-state documentation
        run: python .github/scripts/document-phase20-blocker.py
      - name: Commit docs and remove helper
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/document-phase20-blocker.yml .github/scripts/document-phase20-blocker.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record Phase 20 blocked acceptance state"
          git push origin HEAD:docs/phase20-blocked-20260907

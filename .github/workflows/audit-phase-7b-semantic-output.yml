name: Phase 7B Semantic Output Audit

on:
  push:
    branches:
      - audit/phase-7b-semantic-output
    paths:
      - scripts/audit-phase-7b-semantic-output.mjs
      - .github/workflows/audit-phase-7b-semantic-output.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-phase-7b-semantic-output
  cancel-in-progress: false

jobs:
  semantic-output:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_SEMANTIC_ARTIFACT_DIR: artifacts/phase-7b-semantic
      RENDERLAB_AUDITED_PRODUCT_SHA: 7afe257b069e74d322d8f83c1a0868a30acd3686

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build audited application tree
        run: npm run build

      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1

      - name: Run bounded semantic output audit
        run: |
          # The audit branch adds only this verifier/workflow; application code is the pinned merged main tree.
          sed -i 's/process.env.GITHUB_SHA || null/process.env.RENDERLAB_AUDITED_PRODUCT_SHA || process.env.GITHUB_SHA || null/' scripts/audit-phase-7b-semantic-output.mjs
          node scripts/audit-phase-7b-semantic-output.mjs

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload semantic review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-phase-7b-semantic-output
          path: artifacts/phase-7b-semantic/**
          if-no-files-found: warn
          retention-days: 14

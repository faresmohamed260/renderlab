name: Apply Phase 7A geometry docs

on:
  push:
    branches: [docs/phase-7a-geometry-handoff]
    paths:
      - "scripts/apply-phase-7a-geometry-docs.py"
      - ".github/workflows/apply-phase-7a-geometry-docs.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/phase-7a-geometry-handoff
          fetch-depth: 0

      - name: Apply authoritative documentation updates
        run: python scripts/apply-phase-7a-geometry-docs.py

      - name: Remove documentation helper
        run: rm scripts/apply-phase-7a-geometry-docs.py .github/workflows/apply-phase-7a-geometry-docs.yml

      - name: Validate documentation diff
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git status --short

      - name: Commit documentation handoff
        run: |
          git config user.name "RenderLab Phase 7A Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git commit -m "Document verified Phase 7A geometry"
          git push origin HEAD:docs/phase-7a-geometry-handoff

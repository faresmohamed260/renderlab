name: Phase 13A Read-only Email Audit

on:
  push:
    branches: [work/phase-13a-email-audit]
    paths:
      - ".github/workflows/phase-13a-readonly-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PROJECT_REF: rashyleshocuvpgcooxy
    steps:
      - name: Audit hosted Supabase Auth config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN_PRESENT=false"
            exit 2
          fi
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=true"
          curl --fail-with-body --silent --show-error \
            --user-agent 'RenderLab-Phase13A-Audit/1.0' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -o /tmp/auth-config.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('/tmp/auth-config.json').read_text())

          def val(key):
              return cfg.get(key)

          def present(key):
              v = cfg.get(key)
              return v is not None and v != '' and v != [] and v != {}

          print('SITE_URL=' + str(val('site_url')))
          print('URI_ALLOW_LIST=' + json.dumps(val('uri_allow_list'), ensure_ascii=False))
          print('EXTERNAL_EMAIL_ENABLED=' + str(val('external_email_enabled')))
          print('MAILER_AUTOCONFIRM=' + str(val('mailer_autoconfirm')))
          print('SMTP_CONFIGURED=' + str(present('smtp_host')))
          print('SMTP_ADMIN_EMAIL=' + str(val('smtp_admin_email')))
          print('SMTP_PORT=' + str(val('smtp_port')))
          print('SMTP_SENDER_NAME=' + str(val('smtp_sender_name')))
          print('RATE_LIMIT_EMAIL_SENT=' + str(val('rate_limit_email_sent')))
          print('MAILER_SUBJECT_INVITE=' + str(val('mailer_subjects_invite')))
          print('MAILER_SUBJECT_RECOVERY=' + str(val('mailer_subjects_recovery')))
          print('MAILER_TEMPLATE_INVITE=' + json.dumps(val('mailer_templates_invite_content'), ensure_ascii=False))
          print('MAILER_TEMPLATE_RECOVERY=' + json.dumps(val('mailer_templates_recovery_content'), ensure_ascii=False))

          hook_keys = sorted(k for k in cfg if 'hook' in k.lower() and 'secret' not in k.lower() and 'token' not in k.lower())
          print('HOOK_KEYS=' + json.dumps({k: cfg[k] for k in hook_keys}, ensure_ascii=False))

          safe_mail_keys = sorted(
              k for k in cfg
              if (k.startswith('smtp_') or k.startswith('mailer_') or k.startswith('rate_limit_email'))
              and not any(x in k.lower() for x in ('pass', 'secret', 'token', 'user'))
          )
          print('SAFE_MAIL_KEYS=' + json.dumps({k: cfg[k] for k in safe_mail_keys}, ensure_ascii=False))
          PY

      - name: Audit public sender DNS
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          for q in \
            "TXT faresuniform.uk" \
            "MX faresuniform.uk" \
            "TXT _dmarc.faresuniform.uk" \
            "TXT auth.faresuniform.uk" \
            "MX auth.faresuniform.uk" \
            "TXT _dmarc.auth.faresuniform.uk" \
            "CNAME renderlab.faresuniform.uk"; do
            type="${q%% *}"
            name="${q#* }"
            echo "--- ${type} ${name}"
            dig +short "${type}" "${name}" || true
          done

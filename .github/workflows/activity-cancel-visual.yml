name: Activity Cancel Visual

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/mock-native-generation-worker.mjs"
      - "scripts/verify-activity-cancel.mjs"
      - "src/components/ui/**"
      - "src/lib/capabilities/generation.ts"
      - "src/lib/api/generation-activity-contract.ts"
      - "src/lib/api/generation-cancel-contract.ts"
      - "src/features/activity/**"
      - "src/app/(app)/activity/**"
      - "src/app/api/generation/jobs/**"
      - "src/server/generation/**"
      - ".github/workflows/activity-cancel-visual.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/mock-native-generation-worker.mjs"
      - "scripts/verify-activity-cancel.mjs"
      - "src/components/ui/**"
      - "src/lib/capabilities/generation.ts"
      - "src/lib/api/generation-activity-contract.ts"
      - "src/lib/api/generation-cancel-contract.ts"
      - "src/features/activity/**"
      - "src/app/(app)/activity/**"
      - "src/app/api/generation/jobs/**"
      - "src/server/generation/**"
      - ".github/workflows/activity-cancel-visual.yml"

permissions:
  contents: read

concurrency:
  group: renderlab-activity-cancel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  activity-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
      RENDERLAB_GENERATION_RECONCILER_SECRET: phase15-activity-cancel-reconciler-secret
      RENDERLAB_TEST_NATIVE_WORKER_OVERRIDE: "true"
      RENDERLAB_TEST_NATIVE_WORKER_GATEWAY_URL: http://127.0.0.1:4312
      RENDERLAB_TEST_NATIVE_WORKER_PORT: "4312"
      RENDERLAB_TEST_RECONCILER_OWNER_SCOPE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve isolated Activity Cancel owner
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { configuredTestAccountIdentity } from "./scripts/lib/configured-test-account.mjs";
          console.log(`RENDERLAB_TEST_RECONCILER_OWNER_ID=${configuredTestAccountIdentity("activity-cancel-owner").id}`);
          NODE

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start run-owned native worker mock
        shell: bash
        run: |
          node scripts/mock-native-generation-worker.mjs > /tmp/renderlab-activity-cancel-worker.log 2>&1 &
          echo $! > /tmp/renderlab-activity-cancel-worker.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4312/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-activity-cancel-worker.log
          exit 1

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-activity-cancel-next.log 2>&1 &
          echo $! > /tmp/renderlab-activity-cancel-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/activity > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-activity-cancel-next.log
          exit 1

      - name: Verify Activity Cancel interaction and responsive states
        run: node scripts/verify-activity-cancel.mjs

      - name: Print logs on failure
        if: failure()
        run: |
          echo "--- RenderLab ---"
          cat /tmp/renderlab-activity-cancel-next.log || true
          echo "--- Native worker ---"
          cat /tmp/renderlab-activity-cancel-worker.log || true

      - name: Upload Activity Cancel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-activity-cancel-screenshots
          path: artifacts/activity-cancel*.png
          if-no-files-found: warn
          retention-days: 14

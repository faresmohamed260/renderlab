name: Account Identity Visual

on:
  pull_request:
    paths:
      - "package.json"
      - "next.config.ts"
      - "proxy.ts"
      - "src/lib/supabase/**"
      - "src/server/account/**"
      - "src/app/globals.css"
      - "src/features/account/**"
      - "src/app/auth/**"
      - "src/app/(app)/settings/**"
      - "supabase/migrations/0010_renderlab_account_admission.sql"
      - "supabase/migrations/0011_renderlab_admin_access_control.sql"
      - "supabase/migrations/0012_renderlab_generation_admission.sql"
      - "scripts/verify-account-identity.mjs"
      - ".github/workflows/account-identity-visual.yml"
      - ".github/actions/setup-node-project/action.yml"
      - "scripts/start-ci-app.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required auth fixture secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured for RenderLab."
            exit 1
          fi

      - name: Set up Node project
        uses: ./.github/actions/setup-node-project

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: >-
          node scripts/start-ci-app.mjs
          --port 3000
          --health-url http://127.0.0.1:3000/settings
          --log-file "$RUNNER_TEMP/renderlab-next.log"
          --pid-file "$RUNNER_TEMP/renderlab-next.pid"
          --timeout-ms 60000

      - name: Verify configured account identity
        run: node scripts/verify-account-identity.mjs

      - name: Cleanup account fixture
        if: always()
        run: node scripts/verify-account-identity.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/renderlab-next.log" || true

      - name: Upload account screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderlab-account-identity-screenshots
          path: artifacts/account-identity-*.png
          if-no-files-found: warn
          retention-days: 14

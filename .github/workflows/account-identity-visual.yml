name: Account Identity Visual

on:
  pull_request:
    paths:
      - "scripts/account-auth-hardening-215a-legacy-fixture.mjs"
      - ".github/workflows/account-identity-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout exact fixture branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate required auth fixture secret
        shell: bash
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured for RenderLab."; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare owned sub-15-character legacy fixture
        run: node scripts/account-auth-hardening-215a-legacy-fixture.mjs prepare

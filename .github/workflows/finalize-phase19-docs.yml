name: Finalize Phase 19 docs

on:
  push:
    branches:
      - work/phase-19-kinetic-shell
    paths:
      - .github/workflows/finalize-phase19-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-19-kinetic-shell
      - name: Apply documentation closure
        run: python .github/scripts/finalize-phase19-docs.py
      - name: Commit documentation closure
        run: |
          git diff --check
          git rm .github/workflows/finalize-phase19-docs.yml .github/scripts/finalize-phase19-docs.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/UI_SYSTEM.md docs/ui/COMPONENT_CATALOG.md docs/ui/SCREEN_REGISTRY.md docs/architecture/FRONTEND_ARCHITECTURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Phase 19 kinetic shell documentation"
          git push origin HEAD:work/phase-19-kinetic-shell

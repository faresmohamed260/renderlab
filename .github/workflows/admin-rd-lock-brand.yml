name: Admin R&D locked brand correction

on:
  push:
    branches:
      - rd/phase-28-admin-operations-register-v01
    paths:
      - '.github/workflows/admin-rd-lock-brand.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rd/phase-28-admin-operations-register-v01
      - name: Replace approximate mark with locked production asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('design/prototypes/admin-operations-register-v01/index.html')
          text = p.read_text()
          markup_old = '<span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'
          markup_new = '<img class="brand-mark" src="../../../public/renderlab-mark-white.svg" alt="" aria-hidden="true" />'
          if text.count(markup_old) != 1:
              raise SystemExit('expected one approximate brand mark instance')
          text = text.replace(markup_old, markup_new)

          pattern = r'''    \.brand-mark \{\n.*?    \.brand-mark i:nth-child\(4\) \{[^\n]*\}\n'''
          replacement = '''    .brand-mark {\n      width: 25px;\n      height: 25px;\n      display: block;\n      object-fit: contain;\n      flex: 0 0 auto;\n    }\n'''
          text, count = re.subn(pattern, replacement, text, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one brand CSS block, found {count}')
          p.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/admin-rd-lock-brand.yml
          git config user.name 'Fares Mohamed'
          git config user.email '121525183+faresmohamed260@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'design: reuse locked RenderLab mark in Admin R&D'
          git push origin HEAD:rd/phase-28-admin-operations-register-v01

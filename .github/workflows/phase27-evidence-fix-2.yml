name: Phase 27 Evidence Fix 2

on:
  push:
    branches:
      - work/phase-27-settings-trust-register
    paths:
      - ".github/workflows/phase27-evidence-fix-2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-27-settings-trust-register
          fetch-depth: 0
      - name: Patch verifier evidence
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/phase27_fix.py
          python /tmp/phase27_fix.py
          git rm .github/workflows/phase27-evidence-fix.yml .github/workflows/phase27-evidence-fix-2.yml
          git config user.name 'RenderLab Implementation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test: strengthen Phase 27 Settings evidence'
          git push origin HEAD:${GITHUB_REF_NAME}

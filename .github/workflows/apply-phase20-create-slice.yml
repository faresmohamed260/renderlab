name: Apply Phase 20 Create slice

on:
  push:
    branches:
      - work/phase-20-create-instrument
    paths:
      - .github/workflows/apply-phase20-create-slice.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-20-create-instrument
          fetch-depth: 0
      - name: Apply first Create instrument slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{path}: expected text not found: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "src/features/create/create-workspace.tsx"
          replace_once(
              path,
              'import { ChevronDown, MoreHorizontal, Plus, Volume2, X } from "lucide-react";',
              'import { ChevronDown, MoreHorizontal, Plus, Sparkles, Volume2, X } from "lucide-react";',
          )

          replace_once(
              path,
              '''          <motion.div
            key={createContextKey}
            data-create-motion="context"
            className="mb-12 sm:mb-24"
            initial={reduceMotion ? false : { opacity: 0, y: 6 }}
            animate={{ opacity: 1, y: 0 }}
            exit={reduceMotion ? undefined : { opacity: 0, y: -4 }}
            transition={contextTransition}
          >
            <h2 className="text-[28px] font-semibold tracking-[-0.02em] text-text sm:text-[30px]">{heading}</h2>
            <p className="mt-1 text-[15px] text-text-muted">{supportingText}</p>
          </motion.div>''',
              '''          <motion.div
            key={createContextKey}
            data-create-motion="context"
            className="mb-8 sm:mb-12"
            initial={reduceMotion ? false : { opacity: 0, y: 6 }}
            animate={{ opacity: 1, y: 0 }}
            exit={reduceMotion ? undefined : { opacity: 0, y: -4 }}
            transition={contextTransition}
          >
            <div className="mb-3 flex items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.18em] text-accent-bright/80">
              <span aria-hidden="true" className="size-1.5 rounded-full bg-accent-bright shadow-[0_0_14px_rgba(178,167,255,0.8)]" />
              <span>
                {outputKind === "image"
                  ? hasReference ? "Image edit" : "Image synthesis"
                  : hasReference ? "Image animation" : "Video synthesis"}
              </span>
            </div>
            <h2 className="text-[30px] font-semibold tracking-[-0.035em] text-text sm:text-[34px]">{heading}</h2>
            <p className="mt-2 max-w-2xl text-[15px] leading-6 text-text-muted">{supportingText}</p>
          </motion.div>''',
          )

          replace_once(
              path,
              '<form onSubmit={submit} noValidate className="rounded-xl border border-border bg-surface-1 p-3 sm:p-4">',
              '<form onSubmit={submit} noValidate className="kinetic-composer relative isolate overflow-hidden rounded-[24px] border p-3 sm:p-4" data-create-instrument="true" data-create-mode={outputKind}>',
          )
          replace_once(
              path,
              'className="min-h-32 px-1 py-1 text-[16px] leading-6 sm:min-h-28"',
              'className="min-h-36 px-2 py-2 text-[17px] leading-7 placeholder:text-text-muted/55 sm:min-h-32 sm:text-[18px]"',
          )
          replace_once(
              path,
              'className="flex flex-wrap items-center gap-2 rounded-lg border border-border bg-surface-2 p-2 sm:flex-nowrap sm:gap-3"',
              'className="kinetic-reference flex flex-wrap items-center gap-2 rounded-xl border p-2 sm:flex-nowrap sm:gap-3"',
          )
          replace_once(
              path,
              '<div className="size-14 shrink-0 overflow-hidden rounded-lg bg-surface-3">',
              '<div className="size-14 shrink-0 overflow-hidden rounded-[10px] border border-white/[0.08] bg-surface-3 shadow-[0_8px_24px_rgba(0,0,0,0.24)]">',
          )

          for old in [
              'className="relative shrink-0 gap-0 !pl-1.5 !pr-4"',
          ]:
              text = Path(path).read_text()
              count = text.count(old)
              if count != 3:
                  raise SystemExit(f"{path}: expected 3 compact menu trigger classes, found {count}")
              Path(path).write_text(text.replace(old, 'className="kinetic-control relative shrink-0 gap-0 !pl-1.5 !pr-4"'))

          replace_once(
              path,
              'className="size-8 !px-0"\n                  disabled={',
              'className="kinetic-control size-8 !px-0"\n                  disabled={',
          )
          replace_once(
              path,
              '<div className="mt-3 flex flex-col gap-2 sm:flex-row sm:items-center">',
              '<div className="kinetic-control-deck mt-3 flex flex-col gap-2 rounded-2xl border p-1.5 sm:flex-row sm:items-center">',
          )

          replace_once(
              path,
              '''                  size="sm"
                  className="shrink-0 p-0.5"
                >
                  <ToggleGroupItem value="image" className="!px-1">Image</ToggleGroupItem>
                  <ToggleGroupItem value="video" className="!px-1">Video</ToggleGroupItem>
                </ToggleGroup>''',
              '''                  size="sm"
                  className="relative isolate shrink-0 overflow-hidden rounded-lg border border-white/[0.06] bg-black/20 p-0.5"
                >
                  <ToggleGroupItem
                    value="image"
                    className="relative isolate overflow-hidden !px-1.5 data-[state=on]:bg-transparent data-[state=on]:text-text"
                  >
                    {outputKind === "image" ? (
                      <motion.span
                        layoutId="create-output-mode-highlight"
                        aria-hidden="true"
                        className="absolute inset-0 z-0 rounded-[7px] bg-[linear-gradient(135deg,rgba(129,114,246,0.32),rgba(115,215,255,0.12))] shadow-[inset_0_1px_0_rgba(255,255,255,0.12),0_0_18px_rgba(129,114,246,0.14)]"
                        transition={reduceMotion ? { duration: 0 } : createMotionSpring}
                      />
                    ) : null}
                    <span className="relative z-10">Image</span>
                  </ToggleGroupItem>
                  <ToggleGroupItem
                    value="video"
                    className="relative isolate overflow-hidden !px-1.5 data-[state=on]:bg-transparent data-[state=on]:text-text"
                  >
                    {outputKind === "video" ? (
                      <motion.span
                        layoutId="create-output-mode-highlight"
                        aria-hidden="true"
                        className="absolute inset-0 z-0 rounded-[7px] bg-[linear-gradient(135deg,rgba(115,215,255,0.2),rgba(129,114,246,0.28))] shadow-[inset_0_1px_0_rgba(255,255,255,0.12),0_0_18px_rgba(115,215,255,0.12)]"
                        transition={reduceMotion ? { duration: 0 } : createMotionSpring}
                      />
                    ) : null}
                    <span className="relative z-10">Video</span>
                  </ToggleGroupItem>
                </ToggleGroup>''',
          )

          replace_once(
              path,
              'className={`size-8 !px-0${advancedOpen ? " bg-surface-3" : ""}`}',
              'className={`kinetic-control kinetic-advanced-trigger size-8 !px-0${advancedOpen ? " bg-surface-3" : ""}`}',
          )

          replace_once(
              path,
              '''              <Button type="submit" size="lg" disabled={!canSubmit} className="w-full sm:w-auto">
                {submitting || jobActive ? <Spinner data-icon="inline-start" /> : null}
                {submitting ? "Submitting" : jobActive ? "Generating" : "Generate"}
              </Button>''',
              '''              <motion.div
                className="w-full sm:w-auto"
                whileHover={!reduceMotion && canSubmit ? { scale: 1.012, y: -1 } : undefined}
                whileTap={!reduceMotion && canSubmit ? { scale: 0.985 } : undefined}
                transition={createMotionSpring}
              >
                <Button
                  type="submit"
                  size="lg"
                  disabled={!canSubmit}
                  className="kinetic-generate relative w-full overflow-hidden sm:min-w-32 sm:w-auto"
                  data-active={submitting || jobActive ? "true" : "false"}
                >
                  {submitting || jobActive ? <Spinner data-icon="inline-start" /> : <Sparkles aria-hidden="true" data-icon="inline-start" />}
                  {submitting ? "Submitting" : jobActive ? "Generating" : "Generate"}
                </Button>
              </motion.div>''',
          )

          replace_once(
              path,
              'className="mt-8 flex min-h-64 items-center justify-center rounded-xl border border-border bg-surface-1 text-sm text-text-muted"',
              'className="kinetic-result mt-8 flex min-h-64 items-center justify-center rounded-[20px] border text-sm text-text-muted"',
          )
          replace_once(
              path,
              '''              className="mt-8 overflow-hidden rounded-xl border border-border bg-surface-1"
              aria-label="Generated result"
              initial={reduceMotion ? false : { opacity: 0, y: 14, scale: 0.995 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              exit={reduceMotion ? undefined : { opacity: 0, y: -8 }}
              transition={contextTransition}''',
              '''              className="kinetic-result mt-8 overflow-hidden rounded-[20px] border"
              aria-label="Generated result"
              initial={reduceMotion ? false : { opacity: 0, y: 18, scale: 0.985, filter: "blur(8px)" }}
              animate={{ opacity: 1, y: 0, scale: 1, filter: "blur(0px)" }}
              exit={reduceMotion ? undefined : { opacity: 0, y: -8, scale: 0.992, filter: "blur(4px)" }}
              transition={reduceMotion ? { duration: 0 } : createMotionSpring}''',
          )

          css = Path("src/app/globals.css")
          text = css.read_text()
          marker = "@keyframes kinetic-drift {"
          if marker not in text:
              raise SystemExit("globals.css: kinetic-drift marker not found")
          if ".kinetic-composer {" in text:
              raise SystemExit("globals.css: Phase 20 composer styles already exist")
          addition = r'''
          .kinetic-composer {
            border-color: rgb(255 255 255 / 9%);
            background:
              linear-gradient(180deg, rgb(255 255 255 / 3.5%), transparent 24%),
              radial-gradient(circle at 12% -12%, rgb(129 114 246 / 13%), transparent 36%),
              rgb(10 12 18 / 78%);
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 9%),
              inset 0 -1px 0 rgb(129 114 246 / 4%),
              0 28px 90px rgb(0 0 0 / 28%),
              0 0 0 1px rgb(129 114 246 / 3%);
            backdrop-filter: blur(26px) saturate(136%);
            -webkit-backdrop-filter: blur(26px) saturate(136%);
            transition: border-color 220ms ease, box-shadow 220ms ease, background 220ms ease;
          }

          .kinetic-composer::before {
            position: absolute;
            inset: -35% 32% 48% -20%;
            z-index: 0;
            border-radius: 999px;
            background: radial-gradient(circle, rgb(129 114 246 / 24%), rgb(115 215 255 / 7%) 42%, transparent 72%);
            filter: blur(20px);
            opacity: 0.48;
            transform: scale(0.96) translate3d(-2%, -2%, 0);
            transition: opacity 260ms ease, transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
            content: "";
            pointer-events: none;
          }

          .kinetic-composer[data-create-mode="video"]::before {
            inset: -32% -12% 52% 42%;
            background: radial-gradient(circle, rgb(115 215 255 / 19%), rgb(129 114 246 / 10%) 44%, transparent 72%);
          }

          .kinetic-composer::after {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            background:
              linear-gradient(120deg, rgb(255 255 255 / 5%), transparent 16% 72%, rgb(115 215 255 / 2.5%)),
              linear-gradient(90deg, transparent, rgb(178 167 255 / 8%), transparent) top / 70% 1px no-repeat;
            content: "";
            pointer-events: none;
          }

          .kinetic-composer > * {
            position: relative;
            z-index: 1;
          }

          .kinetic-composer:focus-within {
            border-color: rgb(178 167 255 / 22%);
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 11%),
              0 30px 96px rgb(0 0 0 / 30%),
              0 0 0 1px rgb(129 114 246 / 7%),
              0 0 44px rgb(129 114 246 / 9%);
          }

          .kinetic-composer:focus-within::before {
            opacity: 0.72;
            transform: scale(1.06) translate3d(1%, 1%, 0);
          }

          .kinetic-control-deck {
            border-color: rgb(255 255 255 / 7%);
            background:
              linear-gradient(180deg, rgb(255 255 255 / 2.8%), transparent 55%),
              rgb(0 0 0 / 20%);
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 5%),
              0 10px 32px rgb(0 0 0 / 12%);
            backdrop-filter: blur(18px) saturate(124%);
            -webkit-backdrop-filter: blur(18px) saturate(124%);
          }

          .kinetic-control {
            border-color: rgb(255 255 255 / 7%);
            background: rgb(255 255 255 / 4.5%);
            box-shadow: inset 0 1px 0 rgb(255 255 255 / 5%);
          }

          .kinetic-control:hover {
            border-color: rgb(178 167 255 / 14%);
            background: rgb(255 255 255 / 7%);
          }

          .kinetic-advanced-trigger[aria-pressed="true"] {
            border-color: rgb(178 167 255 / 19%);
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 7%),
              0 0 18px rgb(129 114 246 / 10%);
          }

          .kinetic-reference {
            border-color: rgb(255 255 255 / 8%);
            background:
              linear-gradient(100deg, rgb(129 114 246 / 7%), transparent 38%),
              rgb(255 255 255 / 3.5%);
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 5%),
              0 12px 34px rgb(0 0 0 / 13%);
          }

          .kinetic-generate {
            border: 1px solid rgb(255 255 255 / 10%);
            background: linear-gradient(135deg, #7567ed 0%, #8d7cf7 56%, #6eaed3 118%);
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 18%),
              0 12px 34px rgb(91 78 210 / 23%),
              0 0 26px rgb(129 114 246 / 12%);
          }

          .kinetic-generate:not(:disabled):hover {
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 22%),
              0 14px 38px rgb(91 78 210 / 27%),
              0 0 34px rgb(129 114 246 / 16%);
          }

          .kinetic-generate:disabled {
            border-color: rgb(255 255 255 / 6%);
            background: linear-gradient(135deg, rgb(75 68 132 / 58%), rgb(70 74 112 / 52%));
            box-shadow: inset 0 1px 0 rgb(255 255 255 / 5%);
          }

          .kinetic-generate[data-active="true"]::before {
            position: absolute;
            inset-block: 0;
            left: -42%;
            width: 38%;
            transform: skewX(-18deg);
            background: linear-gradient(90deg, transparent, rgb(255 255 255 / 24%), transparent);
            animation: kinetic-generate-scan 1.65s ease-in-out infinite;
            content: "";
            pointer-events: none;
          }

          .kinetic-result {
            border-color: rgb(255 255 255 / 9%);
            background:
              linear-gradient(180deg, rgb(255 255 255 / 3%), transparent 20%),
              rgb(10 12 18 / 76%);
            box-shadow:
              inset 0 1px 0 rgb(255 255 255 / 7%),
              0 28px 80px rgb(0 0 0 / 28%),
              0 0 34px rgb(129 114 246 / 6%);
            backdrop-filter: blur(22px) saturate(128%);
            -webkit-backdrop-filter: blur(22px) saturate(128%);
          }

          @keyframes kinetic-generate-scan {
            0%, 18% {
              left: -42%;
              opacity: 0;
            }

            42% {
              opacity: 1;
            }

            72%, 100% {
              left: 112%;
              opacity: 0;
            }
          }

          '''
          css.write_text(text.replace(marker, addition.strip() + "\n\n" + marker, 1))

          # Extend the existing reduced-motion block with Phase 20 static equivalents.
          replace_once(
              "src/app/globals.css",
              '''@media (prefers-reduced-motion: reduce) {
  .kinetic-app::before {
    animation: none;
    transform: none;
  }
}''',
              '''@media (prefers-reduced-motion: reduce) {
  .kinetic-app::before {
    animation: none;
    transform: none;
  }

  .kinetic-composer,
  .kinetic-composer::before {
    transition: none;
  }

  .kinetic-composer:focus-within::before {
    transform: none;
  }

  .kinetic-generate[data-active="true"]::before {
    animation: none;
    left: 30%;
    opacity: 0.14;
  }
}''',
          )
          PY

          git diff --check
          git rm .github/workflows/apply-phase20-create-slice.yml
          git add src/features/create/create-workspace.tsx src/app/globals.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement Phase 20 Create instrument foundation"
          git push origin HEAD:work/phase-20-create-instrument

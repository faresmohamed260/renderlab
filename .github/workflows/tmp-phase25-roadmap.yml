name: Apply Phase 25 redesign roadmap

on:
  push:
    branches:
      - docs/ui-redesign-roadmap-phase25
    paths:
      - scripts/tmp-phase25-roadmap.mjs
      - .github/workflows/tmp-phase25-roadmap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@v4
        with:
          ref: docs/ui-redesign-roadmap-phase25
          fetch-depth: 0
      - name: Apply roadmap reconciliation
        run: |
          node scripts/tmp-phase25-roadmap.mjs
          git diff --check
      - name: Verify bounded documentation scope
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          expected=$(printf '%s\n' PROJECT.md docs/ui/UI_MIGRATION.md | sort)
          actual=$(git diff --name-only | grep -E '^(PROJECT.md|docs/ui/UI_MIGRATION\.md)$' | sort)
          test "$actual" = "$expected"
          unexpected=$(git diff --name-only | grep -Ev '^(PROJECT.md|docs/ui/UI_MIGRATION\.md)$' || true)
          test -z "$unexpected"
      - name: Commit roadmap and remove helpers
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-phase25-roadmap.yml scripts/tmp-phase25-roadmap.mjs
          git add PROJECT.md docs/ui/UI_MIGRATION.md
          git diff --cached --check
          git commit -m "Continue full-product UI redesign roadmap"
          git push origin HEAD:docs/ui-redesign-roadmap-phase25

name: Polish Phase 6 baseline handoff

on:
  push:
    branches: [docs/phase-6-baseline-results]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct stale handoff lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          once(
              'docs/ui/UI_MIGRATION.md',
              '**Phase 6 gate:** this expanded contract may be merged as planning, but Phase 6 execution does not begin until the user explicitly authorizes the audit.',
              '**Phase 6 gate:** audit execution is complete and evidence is documented; Phase 6 remains `IN PROGRESS` only until the user selects and the repository records the Cycle 2 operating boundary.',
              'Phase 6 stale gate',
          )

          once(
              'docs/architecture/INFRASTRUCTURE.md',
              '- Keep RLS enabled on the four core tables. No browser RLS policy is required while browser roles have no direct grants; if the access architecture changes later, define owner policies deliberately before granting table access.',
              '- Keep RLS enabled on all six current RenderLab tables. No browser RLS policy is required while browser roles have no direct grants; if the access architecture changes later, define owner policies deliberately before granting table access.',
              'RLS table count',
          )
          once(
              'docs/architecture/INFRASTRUCTURE.md',
              '- UI-030 is merged and GitHub-verified, but the ownership rollout is not complete until owner-aware code is actually live, a final no-unowned-row audit passes, and corrected `0005` is applied/verified. Do not approve Favorites/Collections or other personal organization before that rollout completes.',
              '- UI-030 ownership rollout is complete: owner-aware code is live, the no-unowned-row gate passed and corrected `0005` is applied/verified. Preserve that boundary for all current and future private product state; do not weaken owner scope or browser-grant isolation when adding Cycle 2 features.',
              'ownership rollout state',
          )
          once(
              'docs/architecture/INFRASTRUCTURE.md',
              'No infrastructure rollout is currently queued by the repository. UI-030 ownership enforcement is complete, Favorites/Collections are approved, and the currently defined Phase 5 backlog is complete.',
              'No infrastructure rollout is currently queued by the repository. Cycle 2 Phase 6 baseline evidence is complete pending the user-approved operating boundary; no Phase 7 implementation or production rollout is authorized by that audit.',
              'infrastructure operating state',
          )

          p = Path('docs/architecture/PRODUCT_CAPABILITIES.md')
          text = p.read_text()
          anchor = 'The Phase 5 capability-surface audit found no current user goal that justifies dedicated Models or Workflows screens. Qwen and registered workflow/model/ecosystem identities remain execution choices behind the capability boundary, while all currently approved creative operations are already reachable through Create/Viewer. Likewise, none of the extensibility categories above is a current product commitment, so there is no additional capability-specific screen to implement now. Future capability work must start from a verified user need and an explicit product slice rather than pre-populating navigation or controls from backend possibilities.\n'
          addition = anchor + '\nPhase 6 has now verified the next capability handoff rather than implementing it: deployed two-reference FLUX editing works, REDGraft enables 480p/720p/1080p/2K while RenderLab remains fixed at 480p, and current request parsing needs a stricter input-slot/media-kind/multiplicity/count contract before Multi-reference Image Edit becomes a product feature. Phase 7 must be expanded from this evidence only after Phase 6 closes.\n'
          if text.count(anchor) != 1:
              raise SystemExit('PRODUCT_CAPABILITIES current-work anchor mismatch')
          p.write_text(text.replace(anchor, addition, 1))
          PY
          git diff --check
          git config user.name 'RenderLab Docs Bot'
          git config user.email '121525183+faresmohamed260@users.noreply.github.com'
          git add docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md docs/architecture/PRODUCT_CAPABILITIES.md
          git commit -m 'Align Phase 6 handoff with verified state'
          git rm .github/workflows/polish-phase-6-baseline-results.yml
          git commit -m 'Remove Phase 6 polish helper'
          git push origin HEAD:docs/phase-6-baseline-results

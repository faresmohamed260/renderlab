name: One-shot #218 closure docs

on:
  push:
    branches:
      - docs/218-merge-closure

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/218-merge-closure
          fetch-depth: 0

      - name: Patch authoritative #218 closure records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md')
          text = roadmap.read_text()
          old_status = '**Status:** ACCEPTED ACTIVE ROADMAP / #215 PRODUCTION-LIVE / #216 + #217 IMPLEMENTED + VERIFIED + MERGED + NOT DEPLOYED / NEXT CONTRACT PLANNING: #218'
          new_status = '**Status:** ACCEPTED ACTIVE ROADMAP / #215 PRODUCTION-LIVE / #216 + #217 + #218 IMPLEMENTED + VERIFIED + MERGED / #216 + #217 + #218 NOT DEPLOYED / NEXT DEFAULT: #219'
          if old_status not in text:
              raise SystemExit('roadmap status anchor missing')
          text = text.replace(old_status, new_status, 1)

          old_execution = '**Current execution:** #215 is complete, verified and production-live. #217 MFA/privileged step-up and #216 Session Controls v0.1 are complete, verified and merged to `main`; neither was deployed as part of its implementation/closure work. #216 added privacy-safe live session inventory, local/others/global sign-out and live-session-aware private authorization. Security Activity remains deliberately deferred because the approved hosted project\'s database-backed Auth audit source was empty and no new audit-retention/PII policy was authorized. The next default contract-planning slice is #218 Identity and sign-in method management unless explicitly reprioritized. #223 remains an independent P1 profile/credential-UX lane.'
          new_execution = '**Current execution:** #215 is complete, verified and production-live. #217 MFA/privileged step-up, #216 Session Controls v0.1, and #218 secure sign-in-email change v0.1 are complete, verified and merged to `main`; #216, #217 and #218 were not deployed as part of their implementation/closure work. #218 merged through PR #262 as `bd84e2e993399a35922bf2d3c0ea6aa817b73d97` after configured two-mailbox acceptance proved immutable account identity/ownership, live Admin email resolution, delivered security notification, preserved TOTP/AAL2 assurance, and both observed pre-existing sessions remaining live and refreshable. Linked OAuth/social identity management remains deferred. The next default contract-planning slice is #219 Data export, retention and account deletion unless explicitly reprioritized. #223 remains an independent P1 profile/credential-UX lane.'
          if old_execution not in text:
              raise SystemExit('roadmap execution anchor missing')
          text = text.replace(old_execution, new_execution, 1)

          session_anchor = '- Session presentation exposes coarse browser/platform labels and timestamps only; raw user agent, IP/geolocation, tokens and provider Auth internals remain server-owned.\n'
          identity_lines = (
              '- Secure sign-in-email change now uses Supabase Secure Email Change with scanner-safe RenderLab token-hash confirmation links and requires both current/new owned mailbox confirmations before the canonical Auth email changes.\n'
              '- #218 configured acceptance proved both confirmation orders, immutable `auth.users.id`, unchanged RenderLab access/ownership/invitation state, live Admin email resolution, delivered `email_changed` notification, both observed pre-existing sessions remaining live and refreshable, and preserved verified TOTP with post-confirm `aal2` assurance.\n'
          )
          if session_anchor not in text:
              raise SystemExit('roadmap baseline anchor missing')
          text = text.replace(session_anchor, session_anchor + identity_lines, 1)
          text = text.replace('- secure sign-in-email change;\n', '', 1)
          roadmap.write_text(text)

          project = Path('PROJECT.md')
          text = project.read_text()
          old_next = '- The next default Account & Settings contract-planning slice is #218 Identity and sign-in method management unless explicitly reprioritized. #223 remains an independent P1 profile/credential-UX lane.\n'
          new_lines = (
              '- Workstream #218 secure sign-in-email change v0.1 is **COMPLETE / VERIFIED / MERGED / NOT DEPLOYED by that workstream** as PR #262 / `bd84e2e993399a35922bf2d3c0ea6aa817b73d97`. Exact implementation head `0b8eed598fd9f4fa5cfc4b257ddf6d3d947c8162` passed all required gates, including configured two-mailbox Email Identity Change run `34962080182` attempt 3. Hosted email-change confirmation now uses the scanner-safe RenderLab token-hash route (template SHA-256 `fab9b6fe7c9698a2cc88cf9e0e77c20023d579f5bf96dc2c838099e2e84d6519`); the 30/hour Auth mail limit, SMTP/provider, TOTP, redirects and one-factor cap were unchanged. Acceptance proved both confirmation orders, immutable UUID/ownership/access/invitation state, live Admin email resolution, delivered `email_changed` notification, both observed pre-existing sessions remaining live and refreshable, preserved TOTP factor, and post-confirm `aal2 → aal2` assurance. Linked OAuth/social identities remain deferred.\n'
              '- Merged-main #218 checks passed on `bd84e2e993399a35922bf2d3c0ea6aa817b73d97`: Engineering Quality `34966670551` and UI Shell Validation `34966670528`. Production deployment remains a separate explicit operation and was not performed by #218 closure.\n'
              '- The next default Account & Settings contract-planning slice is #219 Data export, retention and account deletion unless explicitly reprioritized. #223 remains an independent P1 profile/credential-UX lane.\n'
          )
          if old_next not in text:
              raise SystemExit('PROJECT account-roadmap anchor missing')
          text = text.replace(old_next, new_lines, 1)
          project.write_text(text)
          PY

      - name: Commit closure records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md
          git diff --cached --check
          git commit -m 'docs: record #218 merge closure'
          git push origin HEAD:docs/218-merge-closure

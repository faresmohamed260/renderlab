name: Phase 21 design render review

on:
  push:
    branches:
      - design/phase-21-spatial-media
    paths:
      - ".github/workflows/phase21-design-render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick

      - name: Render checkpoint contact sheet
        shell: bash
        run: |
          mkdir -p /tmp/phase21-render
          rsvg-convert -w 950 design/penpot/phase21-library-spatial-v0.1.svg -o /tmp/phase21-render/library.png
          rsvg-convert -w 950 design/penpot/phase21-viewer-spatial-v0.1.svg -o /tmp/phase21-render/viewer.png
          rsvg-convert -w 950 design/penpot/phase21-compare-spatial-v0.1.svg -o /tmp/phase21-render/compare.png
          convert /tmp/phase21-render/library.png /tmp/phase21-render/viewer.png /tmp/phase21-render/compare.png -append -resize 900x -quality 48 design/penpot/phase21-spatial-media-v0.1-review.jpg
          identify design/penpot/phase21-spatial-media-v0.1-review.jpg

      - name: Commit rendered evidence and remove helper
        shell: bash
        run: |
          rm .github/workflows/phase21-design-render.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: render Phase 21 spatial media review evidence"
          git push origin HEAD:design/phase-21-spatial-media

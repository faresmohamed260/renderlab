name: Phase 7D Implementation Stager

on:
  push:
    branches:
      - work/phase-7d-video-resolution-v0-2

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Apply Phase 7D implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          # Central capability contract.
          replace_once(
              "src/lib/capabilities/generation.ts",
              "export const defaultVideoAudioEnabled = true;\n\nexport const generationAdvancedCapabilities = {",
              "export const defaultVideoAudioEnabled = true;\nexport const videoResolutions = [\"480p\", \"720p\", \"1080p\", \"2K\"] as const;\nexport type VideoResolution = (typeof videoResolutions)[number];\nexport const defaultVideoResolution: VideoResolution = \"480p\";\n\nexport const generationAdvancedCapabilities = {",
              "generation video resolution constants",
          )
          replace_once(
              "src/lib/capabilities/generation.ts",
              '''  video: {\n    defaults: {\n      seed: 42,\n      steps: 11,\n      guidance: 1,\n      frameRate: 24 as const,\n    },\n    frameRates: [24, 25, 30] as const,\n  },''',
              '''  video: {\n    defaults: {\n      seed: 42,\n      frameRate: 24 as const,\n    },\n    frameRates: [24, 25, 30] as const,\n  },''',
              "remove inactive video advanced defaults",
          )
          replace_once(
              "src/lib/capabilities/generation.ts",
              '''    durationSeconds?: number;\n    audioEnabled?: boolean;''',
              '''    durationSeconds?: number;\n    audioEnabled?: boolean;\n    resolution?: VideoResolution;''',
              "generation request resolution field",
          )

          # Advanced UI: Image keeps Steps/Guidance; Video keeps seed/frame rate only.
          advanced = Path("src/features/create/create-advanced-panel.tsx")
          text = advanced.read_text()
          old = '''export function createAdvancedDraft(kind: OutputKind): AdvancedDraft {\n  const defaults = advancedDefaultsForOutput(kind);\n  return {\n    negativePrompt: \"\",\n    seed: String(defaults.seed),\n    steps: String(defaults.steps),\n    guidance: String(defaults.guidance),\n    frameRate: generationAdvancedCapabilities.video.defaults.frameRate,\n  };\n}\n\nexport function advancedParametersFromDraft(\n  draft: AdvancedDraft,\n  kind: OutputKind,\n): GenerationAdvancedParameters | null {\n  if (!draft.seed.trim() || !draft.steps.trim() || !draft.guidance.trim()) return null;\n\n  const seed = Number(draft.seed);\n  const steps = Number(draft.steps);\n  const guidance = Number(draft.guidance);\n\n  if (!Number.isSafeInteger(seed)) return null;\n  if (\n    !Number.isInteger(steps)\n    || steps < generationAdvancedCapabilities.steps.min\n    || steps > generationAdvancedCapabilities.steps.max\n  ) return null;\n  if (\n    !Number.isFinite(guidance)\n    || guidance < generationAdvancedCapabilities.guidance.min\n    || guidance > generationAdvancedCapabilities.guidance.max\n  ) return null;\n\n  return {\n    ...(draft.negativePrompt.trim() ? { negativePrompt: draft.negativePrompt.trim() } : {}),\n    seed,\n    steps,\n    guidance,\n    ...(kind === \"video\" ? { frameRate: draft.frameRate } : {}),\n  };\n}'''
          new = '''export function createAdvancedDraft(kind: OutputKind): AdvancedDraft {\n  const defaults = advancedDefaultsForOutput(kind);\n  return {\n    negativePrompt: \"\",\n    seed: String(defaults.seed),\n    steps: kind === \"image\" ? String(generationAdvancedCapabilities.image.defaults.steps) : \"\",\n    guidance: kind === \"image\" ? String(generationAdvancedCapabilities.image.defaults.guidance) : \"\",\n    frameRate: generationAdvancedCapabilities.video.defaults.frameRate,\n  };\n}\n\nexport function advancedParametersFromDraft(\n  draft: AdvancedDraft,\n  kind: OutputKind,\n): GenerationAdvancedParameters | null {\n  if (!draft.seed.trim()) return null;\n\n  const seed = Number(draft.seed);\n  if (!Number.isSafeInteger(seed)) return null;\n\n  const common = {\n    ...(draft.negativePrompt.trim() ? { negativePrompt: draft.negativePrompt.trim() } : {}),\n    seed,\n  };\n\n  if (kind === \"video\") {\n    return { ...common, frameRate: draft.frameRate };\n  }\n\n  if (!draft.steps.trim() || !draft.guidance.trim()) return null;\n  const steps = Number(draft.steps);\n  const guidance = Number(draft.guidance);\n  if (\n    !Number.isInteger(steps)\n    || steps < generationAdvancedCapabilities.steps.min\n    || steps > generationAdvancedCapabilities.steps.max\n  ) return null;\n  if (\n    !Number.isFinite(guidance)\n    || guidance < generationAdvancedCapabilities.guidance.min\n    || guidance > generationAdvancedCapabilities.guidance.max\n  ) return null;\n\n  return { ...common, steps, guidance };\n}'''
          if text.count(old) != 1:
              raise SystemExit("advanced draft parser marker changed")
          text = text.replace(old, new)
          old_fields = '''          <Field>\n            <FieldLabel htmlFor=\"advanced-steps\">{generationAdvancedCapabilities.steps.label}</FieldLabel>\n            <Input\n              id=\"advanced-steps\"\n              type=\"number\"\n              min={generationAdvancedCapabilities.steps.min}\n              max={generationAdvancedCapabilities.steps.max}\n              step=\"1\"\n              value={draft.steps}\n              onChange={(event) => onDraftChange({ ...draft, steps: event.target.value })}\n            />\n          </Field>\n\n          <Field>\n            <FieldLabel htmlFor=\"advanced-guidance\">{generationAdvancedCapabilities.guidance.label}</FieldLabel>\n            <Input\n              id=\"advanced-guidance\"\n              type=\"number\"\n              min={generationAdvancedCapabilities.guidance.min}\n              max={generationAdvancedCapabilities.guidance.max}\n              step={generationAdvancedCapabilities.guidance.step}\n              value={draft.guidance}\n              onChange={(event) => onDraftChange({ ...draft, guidance: event.target.value })}\n            />\n          </Field>'''
          new_fields = '''          {outputKind === \"image\" ? (\n            <>\n              <Field>\n                <FieldLabel htmlFor=\"advanced-steps\">{generationAdvancedCapabilities.steps.label}</FieldLabel>\n                <Input\n                  id=\"advanced-steps\"\n                  type=\"number\"\n                  min={generationAdvancedCapabilities.steps.min}\n                  max={generationAdvancedCapabilities.steps.max}\n                  step=\"1\"\n                  value={draft.steps}\n                  onChange={(event) => onDraftChange({ ...draft, steps: event.target.value })}\n                />\n              </Field>\n\n              <Field>\n                <FieldLabel htmlFor=\"advanced-guidance\">{generationAdvancedCapabilities.guidance.label}</FieldLabel>\n                <Input\n                  id=\"advanced-guidance\"\n                  type=\"number\"\n                  min={generationAdvancedCapabilities.guidance.min}\n                  max={generationAdvancedCapabilities.guidance.max}\n                  step={generationAdvancedCapabilities.guidance.step}\n                  value={draft.guidance}\n                  onChange={(event) => onDraftChange({ ...draft, guidance: event.target.value })}\n                />\n              </Field>\n            </>\n          ) : null}'''
          if text.count(old_fields) != 1:
              raise SystemExit("advanced fields marker changed")
          text = text.replace(old_fields, new_fields)
          text = text.replace(
              "Reproducibility and tuning. Defaults stay safe unless you change them.",
              "Reproducibility and contextual output controls. Defaults stay safe unless you change them.",
          )
          advanced.write_text(text)

          # Server-authoritative parser.
          contract = Path("src/lib/api/generation-contract.ts")
          text = contract.read_text()
          text = text.replace(
              '''  defaultVideoAudioEnabled,\n  generationAdvancedCapabilities,''',
              '''  defaultVideoAudioEnabled,\n  defaultVideoResolution,\n  generationAdvancedCapabilities,''',
          )
          text = text.replace(
              '''  unresolvedGenerationPromptReferenceAliases,\n  videoAspectRatios,\n} from \"@/lib/capabilities/generation\";''',
              '''  unresolvedGenerationPromptReferenceAliases,\n  videoAspectRatios,\n  videoDurations,\n  videoResolutions,\n  type VideoResolution,\n} from \"@/lib/capabilities/generation\";''',
          )
          text = text.replace(
              '''const frameRates = new Set<number>(generationAdvancedCapabilities.video.frameRates);''',
              '''const frameRates = new Set<number>(generationAdvancedCapabilities.video.frameRates);\nconst videoDurationSet = new Set<number>(videoDurations);\nconst videoResolutionSet = new Set<string>(videoResolutions);''',
          )
          start = text.index("function parseAdvanced(")
          end = text.index("\n\nexport function parseGenerationRequest", start)
          text = text[:start] + '''function parseAdvanced(\n  value: unknown,\n  kind: OutputKind,\n): GenerationAdvancedParameters | null | undefined {\n  if (value === undefined) return undefined;\n  if (!isRecord(value)) return null;\n\n  const advanced: GenerationAdvancedParameters = {};\n\n  if (value.negativePrompt !== undefined) {\n    if (typeof value.negativePrompt !== \"string\") return null;\n    advanced.negativePrompt = value.negativePrompt;\n  }\n  if (value.seed !== undefined) {\n    if (!Number.isSafeInteger(value.seed)) return null;\n    advanced.seed = value.seed as number;\n  }\n  if (value.steps !== undefined) {\n    if (kind !== \"image\") return null;\n    if (\n      !Number.isInteger(value.steps)\n      || (value.steps as number) < generationAdvancedCapabilities.steps.min\n      || (value.steps as number) > generationAdvancedCapabilities.steps.max\n    ) return null;\n    advanced.steps = value.steps as number;\n  }\n  if (value.guidance !== undefined) {\n    if (kind !== \"image\") return null;\n    if (\n      typeof value.guidance !== \"number\"\n      || !Number.isFinite(value.guidance)\n      || value.guidance < generationAdvancedCapabilities.guidance.min\n      || value.guidance > generationAdvancedCapabilities.guidance.max\n    ) return null;\n    advanced.guidance = value.guidance;\n  }\n  if (value.frameRate !== undefined) {\n    if (kind !== \"video\") return null;\n    if (typeof value.frameRate !== \"number\" || !frameRates.has(value.frameRate)) return null;\n    advanced.frameRate = value.frameRate as GenerationFrameRate;\n  }\n\n  return advanced;\n}''' + text[end:]
          text = text.replace(
              '''  const durationSeconds = value.output.durationSeconds;\n  const audioEnabled = value.output.audioEnabled;''',
              '''  const durationSeconds = value.output.durationSeconds;\n  const audioEnabled = value.output.audioEnabled;\n  const resolution = value.output.resolution;''',
          )
          old_video_validation = '''  if (kind === \"video\") {\n    if (!Number.isInteger(durationSeconds) || (durationSeconds as number) < 5 || (durationSeconds as number) > 30) {\n      return { ok: false, error: { code: \"invalid_request\", message: \"Video duration must be between 5 and 30 seconds.\" } };\n    }\n    if (audioEnabled !== undefined && typeof audioEnabled !== \"boolean\") {\n      return { ok: false, error: { code: \"invalid_request\", message: \"Video audio setting must be on or off.\" } };\n    }\n  } else if (durationSeconds !== undefined || audioEnabled !== undefined) {\n    return { ok: false, error: { code: \"invalid_request\", message: \"Image requests cannot include video-only settings.\" } };\n  }\n\n  const advanced = parseAdvanced(value.advanced);'''
          new_video_validation = '''  let normalizedVideoResolution: VideoResolution | undefined;\n  if (kind === \"video\") {\n    if (resolution === undefined) {\n      normalizedVideoResolution = defaultVideoResolution;\n    } else if (typeof resolution === \"string\" && videoResolutionSet.has(resolution)) {\n      normalizedVideoResolution = resolution as VideoResolution;\n    } else {\n      return { ok: false, error: { code: \"invalid_request\", message: \"Unsupported video resolution.\" } };\n    }\n    if (typeof durationSeconds !== \"number\" || !videoDurationSet.has(durationSeconds)) {\n      return { ok: false, error: { code: \"invalid_request\", message: \"Unsupported video duration.\" } };\n    }\n    if (audioEnabled !== undefined && typeof audioEnabled !== \"boolean\") {\n      return { ok: false, error: { code: \"invalid_request\", message: \"Video audio setting must be on or off.\" } };\n    }\n  } else if (durationSeconds !== undefined || audioEnabled !== undefined || resolution !== undefined) {\n    return { ok: false, error: { code: \"invalid_request\", message: \"Image requests cannot include video-only settings.\" } };\n  }\n\n  const advanced = parseAdvanced(value.advanced, outputKind);'''
          if text.count(old_video_validation) != 1:
              raise SystemExit("video validation marker changed")
          text = text.replace(old_video_validation, new_video_validation)
          text = text.replace(
              '''          ? { durationSeconds: durationSeconds as number, audioEnabled: audioEnabled === undefined ? defaultVideoAudioEnabled : audioEnabled }''',
              '''          ? {\n              durationSeconds: durationSeconds as number,\n              audioEnabled: audioEnabled === undefined ? defaultVideoAudioEnabled : audioEnabled,\n              resolution: normalizedVideoResolution!,\n            }''',
          )
          contract.write_text(text)

          # Create Video settings composition and serialization.
          workspace = Path("src/features/create/create-workspace.tsx")
          text = workspace.read_text()
          text = text.replace(
              '''  OutputKind,\n  PresetAspectRatio,''',
              '''  OutputKind,\n  PresetAspectRatio,\n  VideoResolution,''',
          )
          text = text.replace(
              '''  continuationActionsForMedia,\n  defaultVideoAudioEnabled,''',
              '''  continuationActionsForMedia,\n  defaultVideoAudioEnabled,\n  defaultVideoResolution,''',
          )
          text = text.replace(
              '''  videoAspectRatios,\n  videoDurations,''',
              '''  videoAspectRatios,\n  videoDurations,\n  videoResolutions,''',
          )
          old_menu_start = text.index("function VideoSettingsMenu({")
          old_menu_end = text.index("\n\nfunction pollRetryDelay", old_menu_start)
          menu = '''function VideoSettingsMenu({\n  resolution,\n  durationSeconds,\n  audioEnabled,\n  advancedOpen,\n  onResolutionChange,\n  onDurationChange,\n  onAudioChange,\n  onAdvancedToggle,\n}: {\n  resolution: VideoResolution;\n  durationSeconds: (typeof videoDurations)[number];\n  audioEnabled: boolean;\n  advancedOpen: boolean;\n  onResolutionChange: (value: VideoResolution) => void;\n  onDurationChange: (value: (typeof videoDurations)[number]) => void;\n  onAudioChange: (value: boolean) => void;\n  onAdvancedToggle: () => void;\n}) {\n  return (\n    <DropdownMenu>\n      <DropdownMenuTrigger asChild>\n        <Button\n          type=\"button\"\n          variant=\"secondary\"\n          aria-label={`Video settings. Resolution ${resolution}. Duration ${durationSeconds} seconds. Audio ${audioEnabled ? \"on\" : \"off\"}`}\n          className=\"shrink-0 gap-1.5\"\n        >\n          <span>{resolution} · {durationSeconds} s</span>\n          <ChevronDown aria-hidden=\"true\" className=\"size-3.5 opacity-70\" />\n        </Button>\n      </DropdownMenuTrigger>\n      <DropdownMenuContent align=\"start\" className=\"min-w-48\">\n        <DropdownMenuLabel>Resolution</DropdownMenuLabel>\n        <DropdownMenuRadioGroup\n          value={resolution}\n          onValueChange={(next) => onResolutionChange(next as VideoResolution)}\n        >\n          {videoResolutions.map((option) => (\n            <DropdownMenuRadioItem key={option} value={option}>\n              {option}\n            </DropdownMenuRadioItem>\n          ))}\n        </DropdownMenuRadioGroup>\n        <DropdownMenuSeparator />\n        <DropdownMenuLabel>Duration</DropdownMenuLabel>\n        <DropdownMenuRadioGroup\n          value={String(durationSeconds)}\n          onValueChange={(next) => onDurationChange(Number(next) as (typeof videoDurations)[number])}\n        >\n          {videoDurations.map((duration) => (\n            <DropdownMenuRadioItem key={duration} value={String(duration)}>\n              {duration} seconds\n            </DropdownMenuRadioItem>\n          ))}\n        </DropdownMenuRadioGroup>\n        <DropdownMenuSeparator />\n        <DropdownMenuCheckboxItem\n          checked={audioEnabled}\n          onCheckedChange={(checked) => onAudioChange(checked === true)}\n        >\n          <Volume2 aria-hidden=\"true\" />\n          Audio\n        </DropdownMenuCheckboxItem>\n        <DropdownMenuSeparator />\n        <DropdownMenuItem onSelect={onAdvancedToggle}>\n          <MoreHorizontal aria-hidden=\"true\" />\n          {advancedOpen ? \"Hide Advanced controls\" : \"Advanced controls\"}\n        </DropdownMenuItem>\n      </DropdownMenuContent>\n    </DropdownMenu>\n  );\n}'''
          text = text[:old_menu_start] + menu + text[old_menu_end:]
          text = text.replace(
              '''  const [durationSeconds, setDurationSeconds] = useState<(typeof videoDurations)[number]>(5);\n  const [audioEnabled, setAudioEnabled] = useState(defaultVideoAudioEnabled);''',
              '''  const [videoResolution, setVideoResolution] = useState<VideoResolution>(defaultVideoResolution);\n  const [durationSeconds, setDurationSeconds] = useState<(typeof videoDurations)[number]>(5);\n  const [audioEnabled, setAudioEnabled] = useState(defaultVideoAudioEnabled);''',
          )
          text = text.replace(
              '''      setError(\"Check the Advanced values before generating. Seed must be an integer, steps must be 1–200, and guidance must be 0–100.\");''',
              '''      setError(\n        outputKind === \"video\"\n          ? \"Check the Advanced values before generating. Seed must be an integer.\"\n          : \"Check the Advanced values before generating. Seed must be an integer, steps must be 1–200, and guidance must be 0–100.\",\n      );''',
          )
          text = text.replace(
              '''            ...(outputKind === \"video\" ? { durationSeconds, audioEnabled } : {}),''',
              '''            ...(outputKind === \"video\" ? { resolution: videoResolution, durationSeconds, audioEnabled } : {}),''',
          )
          text = text.replace(
              '''                  <VideoSettingsMenu\n                    durationSeconds={durationSeconds}\n                    audioEnabled={audioEnabled}\n                    advancedOpen={advancedOpen}\n                    onDurationChange={(value) => {''',
              '''                  <VideoSettingsMenu\n                    resolution={videoResolution}\n                    durationSeconds={durationSeconds}\n                    audioEnabled={audioEnabled}\n                    advancedOpen={advancedOpen}\n                    onResolutionChange={(value) => {\n                      setVideoResolution(value);\n                      setError(null);\n                    }}\n                    onDurationChange={(value) => {''',
          )
          workspace.write_text(text)

          # Native REDGraft multipart: normalized resolution; no Video steps/cfg.
          native = Path("src/server/generation/native-generation.ts")
          text = native.read_text()
          text = text.replace(
              '''import { defaultVideoAudioEnabled, generationInputAlias, resolveCreativeOperation } from \"@/lib/capabilities/generation\";''',
              '''import {\n  defaultVideoAudioEnabled,\n  defaultVideoResolution,\n  generationInputAlias,\n  resolveCreativeOperation,\n  type VideoResolution,\n} from \"@/lib/capabilities/generation\";''',
          )
          text = text.replace(
              '''    steps: number;\n    guidance: number;''',
              '''    steps?: number;\n    guidance?: number;''',
          )
          text = text.replace(
              '''    resolution?: string;''',
              '''    resolution?: VideoResolution;''',
          )
          text = text.replace(
              '''      seed: 42,\n      steps: 11,\n      guidance: 1,\n      megapixels: 1,\n      resolution: \"480p\",''',
              '''      seed: 42,\n      megapixels: 1,\n      resolution: defaultVideoResolution,''',
          )
          text = text.replace(
              '''    form.append(\"steps\", String(request.advanced?.steps ?? workflow.defaults.steps));\n    form.append(\"cfg\", String(request.advanced?.guidance ?? workflow.defaults.guidance));''',
              '''    form.append(\"steps\", String(request.advanced?.steps ?? workflow.defaults.steps!));\n    form.append(\"cfg\", String(request.advanced?.guidance ?? workflow.defaults.guidance!));''',
              1,
          )
          video_old = '''  form.append(\"seed\", String(request.advanced?.seed ?? workflow.defaults.seed));\n  form.append(\"steps\", String(request.advanced?.steps ?? workflow.defaults.steps));\n  form.append(\"cfg\", String(request.advanced?.guidance ?? workflow.defaults.guidance));\n  form.append(\"resolution\", workflow.defaults.resolution!);'''
          video_new = '''  form.append(\"seed\", String(request.advanced?.seed ?? workflow.defaults.seed));\n  form.append(\"resolution\", request.output.resolution ?? workflow.defaults.resolution ?? defaultVideoResolution);'''
          if text.count(video_old) != 1:
              raise SystemExit("native video multipart marker changed")
          text = text.replace(video_old, video_new)
          native.write_text(text)

          # Pure Phase 7D contract verification (1320 fixed combinations + rejection/static form checks).
          Path("scripts/verify-video-contract.ts").write_text(r'''import { readFile } from "node:fs/promises";
          import {
            defaultVideoResolution,
            generationAdvancedCapabilities,
            imageAspectRatios,
            videoAspectRatios,
            videoDurations,
            videoResolutions,
          } from "../src/lib/capabilities/generation";
          import { parseGenerationRequest } from "../src/lib/api/generation-contract";

          function assert(condition: unknown, message: string): asserts condition {
            if (!condition) throw new Error(message);
          }

          function parse(value: unknown) {
            return parseGenerationRequest(value);
          }

          const omitted = parse({
            prompt: "phase 7d omitted resolution",
            output: { kind: "video", aspectRatio: "16:9", durationSeconds: 5, audioEnabled: true },
            inputs: [],
            advanced: { seed: 42, frameRate: 24 },
          });
          assert(omitted.ok, "Omitted Video resolution must remain backward-compatible.");
          assert(omitted.request.output.resolution === defaultVideoResolution, "Omitted Video resolution must normalize to 480p.");

          let accepted = 0;
          for (const resolution of videoResolutions) {
            for (const aspectRatio of videoAspectRatios) {
              for (const durationSeconds of videoDurations) {
                for (const frameRate of generationAdvancedCapabilities.video.frameRates) {
                  for (const audioEnabled of [false, true] as const) {
                    const result = parse({
                      prompt: "phase 7d cartesian contract",
                      output: { kind: "video", aspectRatio, durationSeconds, audioEnabled, resolution },
                      inputs: [],
                      advanced: { seed: 123, frameRate },
                    });
                    assert(result.ok, `Supported Video combination rejected: ${JSON.stringify({ resolution, aspectRatio, durationSeconds, frameRate, audioEnabled })}`);
                    assert(result.request.output.resolution === resolution, "Resolution did not round-trip through normalization.");
                    accepted += 1;
                  }
                }
              }
            }
          }
          assert(accepted === 1320, `Expected 1320 supported fixed Video combinations, verified ${accepted}.`);

          for (const invalidResolution of ["4K", "480P", "1440p", 480, null, true]) {
            const result = parse({
              prompt: "invalid resolution",
              output: { kind: "video", aspectRatio: "16:9", durationSeconds: 5, audioEnabled: false, resolution: invalidResolution },
              inputs: [],
              advanced: { seed: 1, frameRate: 24 },
            });
            assert(!result.ok, `Invalid Video resolution was accepted: ${String(invalidResolution)}`);
          }

          const imageWithResolution = parse({
            prompt: "image cannot carry video resolution",
            output: { kind: "image", aspectRatio: "1:1", resolution: "480p" },
            inputs: [],
            advanced: { seed: 1, steps: 4, guidance: 1 },
          });
          assert(!imageWithResolution.ok, "Image request accepted output.resolution.");

          for (const staleAdvanced of [{ steps: 11 }, { guidance: 1 }, { steps: 11, guidance: 1 }]) {
            const result = parse({
              prompt: "stale video tuning",
              output: { kind: "video", aspectRatio: "16:9", durationSeconds: 5, audioEnabled: false, resolution: "480p" },
              inputs: [],
              advanced: { seed: 1, frameRate: 24, ...staleAdvanced },
            });
            assert(!result.ok, `Video accepted inactive tuning: ${JSON.stringify(staleAdvanced)}`);
          }

          const imageTuning = parse({
            prompt: "image tuning stays active",
            output: { kind: "image", aspectRatio: "1:1" },
            inputs: [],
            advanced: { seed: 1, steps: 4, guidance: 1 },
          });
          assert(imageTuning.ok, "Image Steps/Guidance regression: verified Image tuning was rejected.");

          const imageFrameRate = parse({
            prompt: "image cannot carry frame rate",
            output: { kind: "image", aspectRatio: "1:1" },
            inputs: [],
            advanced: { seed: 1, steps: 4, guidance: 1, frameRate: 24 },
          });
          assert(!imageFrameRate.ok, "Image request accepted Video-only frameRate.");

          for (const invalidDuration of [4, 6, 29, 31]) {
            const result = parse({
              prompt: "invalid duration",
              output: { kind: "video", aspectRatio: "16:9", durationSeconds: invalidDuration, audioEnabled: false, resolution: "480p" },
              inputs: [],
              advanced: { seed: 1, frameRate: 24 },
            });
            assert(!result.ok, `Non-curated Video duration was accepted: ${invalidDuration}`);
          }

          const originalWithoutSource = parse({
            prompt: "original without source",
            output: { kind: "video", aspectRatio: "original", durationSeconds: 5, audioEnabled: false, resolution: "2K" },
            inputs: [],
            advanced: { seed: 1, frameRate: 30 },
          });
          assert(!originalWithoutSource.ok, "Animate Original was accepted without a source image.");

          const originalWithSource = parse({
            prompt: "original with source",
            output: { kind: "video", aspectRatio: "original", durationSeconds: 5, audioEnabled: false, resolution: "2K" },
            inputs: [{ alias: "image1", source: { type: "media-asset", id: "00000000-0000-0000-0000-000000000001" }, role: "first-frame" }],
            advanced: { seed: 1, frameRate: 30 },
          });
          assert(originalWithSource.ok, "Source-backed Animate Original did not pass product-contract parsing.");

          const nativeSource = await readFile(new URL("../src/server/generation/native-generation.ts", import.meta.url), "utf8");
          const buildStart = nativeSource.indexOf("function buildForm(");
          const buildEnd = nativeSource.indexOf("async function errorBody", buildStart);
          assert(buildStart >= 0 && buildEnd > buildStart, "Could not inspect native buildForm implementation.");
          const buildForm = nativeSource.slice(buildStart, buildEnd);
          const videoStart = buildForm.indexOf("const source = prepared.sources[0]");
          assert(videoStart >= 0, "Could not locate native Video multipart branch.");
          const videoBranch = buildForm.slice(videoStart);
          assert(!videoBranch.includes('form.append("steps"'), "Native Video multipart still sends steps.");
          assert(!videoBranch.includes('form.append("cfg"'), "Native Video multipart still sends cfg.");
          assert(videoBranch.includes('request.output.resolution'), "Native Video multipart does not forward normalized resolution.");

          assert(imageAspectRatios.length === 11 && videoAspectRatios.length === 11, "Curated aspect-ratio contract drifted unexpectedly.");
          console.log(`Phase 7D pure contract verified: ${accepted} fixed Video combinations; 480p omission default; invalid resolution/duration/tuning rejection; native multipart reconciliation.`);
          '''.replace("          ", ""))

          # Configured live REDGraft verifier: four bounded cases + ffprobe/contact-sheet evidence.
          Path("scripts/verify-video-generation.mjs").write_text(r'''import { execFile } from "node:child_process";
          import { mkdir, mkdtemp, rm, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { promisify } from "node:util";
          import { DeleteObjectCommand, S3Client } from "@aws-sdk/client-s3";
          import sharp from "sharp";
          import {
            configuredTestAccountIdentity,
            createConfiguredTestAccount,
            deleteConfiguredTestAccount,
            withAccountAuthorization,
          } from "./lib/configured-test-account.mjs";

          const execFileAsync = promisify(execFile);
          const baseUrl = (process.env.RENDERLAB_TEST_BASE_URL || "http://127.0.0.1:3000").replace(/\/$/, "");
          const supabaseUrl = process.env.SUPABASE_URL?.replace(/\/$/, "");
          const supabaseKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const bucket = process.env.R2_BUCKET_NAME;
          const artifactDir = process.env.RENDERLAB_PHASE7D_ARTIFACT_DIR || "artifacts";
          const cleanupOnly = process.argv.includes("--cleanup-only");
          const fixtureAccount = configuredTestAccountIdentity("video-generation");
          const fixtureJobIds = new Set();
          const fixtureSourceIds = new Set();
          const referenceFilename = "renderlab-video-reference.png";
          const reference = await sharp({
            create: { width: 256, height: 128, channels: 3, background: { r: 78, g: 104, b: 146 } },
          }).png().toBuffer();

          for (const [name, value] of Object.entries({
            SUPABASE_URL: supabaseUrl,
            SUPABASE_SERVICE_ROLE_KEY: supabaseKey,
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
            R2_ACCOUNT_ID: process.env.R2_ACCOUNT_ID,
            R2_ACCESS_KEY_ID: process.env.R2_ACCESS_KEY_ID,
            R2_SECRET_ACCESS_KEY: process.env.R2_SECRET_ACCESS_KEY,
            R2_BUCKET_NAME: bucket,
          })) {
            if (!value) throw new Error(`${name} is required for configured video generation verification.`);
          }

          const r2 = new S3Client({
            region: "auto",
            endpoint: `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
            credentials: {
              accessKeyId: process.env.R2_ACCESS_KEY_ID,
              secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
            },
            requestChecksumCalculation: "WHEN_REQUIRED",
            responseChecksumValidation: "WHEN_REQUIRED",
          });

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function req(url, account, init = {}) {
            const response = await fetch(url, withAccountAuthorization(account, init));
            const text = await response.text();
            let payload = null;
            try { payload = text ? JSON.parse(text) : null; } catch { payload = text; }
            return { response, payload };
          }

          async function sb(path, init = {}) {
            const headers = new Headers(init.headers);
            headers.set("apikey", supabaseKey);
            headers.set("authorization", `Bearer ${supabaseKey}`);
            if (init.body != null && !headers.has("content-type")) headers.set("content-type", "application/json");
            return fetch(`${supabaseUrl}/rest/v1/${path}`, { ...init, headers });
          }

          async function rows(path) {
            const response = await sb(path);
            if (!response.ok) throw new Error(`Supabase video integration query failed (${response.status}): ${await response.text()}`);
            return response.json();
          }

          async function assets(jobId) {
            return rows(`media_assets?generation_job_id=eq.${encodeURIComponent(jobId)}&select=id,storage_key,thumbnail_storage_key,mime_type,owner_id`);
          }

          async function cleanupJob(jobId) {
            if (!jobId) return;
            const list = await assets(jobId).catch(() => []);
            for (const asset of list) {
              for (const key of [asset.storage_key, asset.thumbnail_storage_key]) {
                if (key) await r2.send(new DeleteObjectCommand({ Bucket: bucket, Key: key })).catch(() => {});
              }
            }
            await sb(`media_assets?generation_job_id=eq.${encodeURIComponent(jobId)}`, { method: "DELETE" }).catch(() => {});
            await sb(`generation_jobs?id=eq.${encodeURIComponent(jobId)}`, { method: "DELETE" }).catch(() => {});
            console.log(`Cleaned video generation job=${jobId}`);
          }

          async function cleanupSource(id) {
            if (!id) return;
            const row = (await rows(`generation_sources?id=eq.${encodeURIComponent(id)}&select=storage_key&limit=1`).catch(() => []))[0];
            if (row?.storage_key) await r2.send(new DeleteObjectCommand({ Bucket: bucket, Key: row.storage_key })).catch(() => {});
            await sb(`generation_sources?id=eq.${encodeURIComponent(id)}`, { method: "DELETE" }).catch(() => {});
            console.log(`Cleaned video reference=${id}`);
          }

          async function cleanupFixtureAccount() {
            const jobs = await rows(`generation_jobs?owner_id=eq.${encodeURIComponent(fixtureAccount.id)}&select=id`).catch(() => []);
            for (const row of jobs) fixtureJobIds.add(row.id);
            const sources = await rows(`generation_sources?owner_id=eq.${encodeURIComponent(fixtureAccount.id)}&select=id`).catch(() => []);
            for (const row of sources) fixtureSourceIds.add(row.id);
            for (const jobId of fixtureJobIds) await cleanupJob(jobId);
            for (const sourceId of fixtureSourceIds) await cleanupSource(sourceId);
            fixtureJobIds.clear();
            fixtureSourceIds.clear();
            await deleteConfiguredTestAccount(fixtureAccount);
          }

          async function uploadReference(account) {
            const ticket = await req(`${baseUrl}/api/assets/reference/upload-tickets`, account, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ filename: referenceFilename, mimeType: "image/png", sizeBytes: reference.length }),
            });
            if (!ticket.response.ok || !ticket.payload?.ok) throw new Error(`Reference ticket failed (${ticket.response.status}): ${JSON.stringify(ticket.payload)}`);
            const uploadTicket = ticket.payload.ticket;
            fixtureSourceIds.add(uploadTicket.sourceId);
            const put = await fetch(uploadTicket.uploadUrl, { method: uploadTicket.method, headers: uploadTicket.headers, body: reference });
            if (!put.ok) throw new Error(`Reference upload failed (${put.status}): ${await put.text()}`);
            const done = await req(`${baseUrl}/api/assets/reference/upload-completions`, account, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ sourceId: uploadTicket.sourceId, width: 256, height: 128 }),
            });
            if (!done.response.ok || !done.payload?.ok) throw new Error(`Reference completion failed (${done.response.status}): ${JSON.stringify(done.payload)}`);
            const source = (await rows(`generation_sources?id=eq.${encodeURIComponent(uploadTicket.sourceId)}&select=id,status,filename,owner_id&limit=1`))[0];
            assert(source?.owner_id === account.id && source.status === "ready" && source.filename === referenceFilename, `Temporary video reference did not persist authenticated ownership: ${JSON.stringify(source)}`);
            return uploadTicket.sourceId;
          }

          function parseRate(value) {
            const [num, den = "1"] = String(value || "0").split("/").map(Number);
            return den ? num / den : 0;
          }

          const resolutionMinLongEdge = { "480p": 800, "720p": 1200, "1080p": 1800, "2K": 2000 };

          async function verifyAsset(account, assetId, expectation) {
            const meta = await req(`${baseUrl}/api/media/assets/${encodeURIComponent(assetId)}`, account, { headers: { accept: "application/json" } });
            assert(meta.response.ok && meta.payload?.ok && meta.payload.asset?.kind === "video", `Video metadata invalid (${meta.response.status}): ${JSON.stringify(meta.payload)}`);
            const content = await fetch(`${baseUrl}${meta.payload.asset.contentUrl}`, withAccountAuthorization(account, { redirect: "follow" }));
            assert(content.ok && String(content.headers.get("content-type") || "").startsWith("video/"), `Video content invalid (${content.status}, ${content.headers.get("content-type")})`);
            const bytes = Buffer.from(await content.arrayBuffer());
            const directory = await mkdtemp(join(tmpdir(), "renderlab-video-"));
            const filename = join(directory, "output.mp4");
            await mkdir(artifactDir, { recursive: true });
            const artifactVideo = join(artifactDir, `phase7d-video-${expectation.slug}.mp4`);
            const artifactSheet = join(artifactDir, `phase7d-video-${expectation.slug}-contact.png`);
            try {
              await writeFile(filename, bytes);
              await writeFile(artifactVideo, bytes);
              const { stdout } = await execFileAsync("ffprobe", [
                "-v", "error",
                "-show_entries", "stream=codec_type,width,height,avg_frame_rate:format=duration",
                "-of", "json",
                filename,
              ]);
              const probe = JSON.parse(stdout);
              const video = probe.streams?.find((stream) => stream.codec_type === "video");
              const hasAudio = Boolean(probe.streams?.some((stream) => stream.codec_type === "audio"));
              const width = Number(video?.width || 0);
              const height = Number(video?.height || 0);
              const duration = Number(probe.format?.duration || 0);
              const frameRate = parseRate(video?.avg_frame_rate);
              const [expectedWidth, expectedHeight] = expectation.aspect.split(":").map(Number);
              assert(width > 0 && height > 0, `${expectation.label} has invalid encoded dimensions ${width}x${height}.`);
              assert(Math.abs(width / height - expectedWidth / expectedHeight) <= 0.05, `${expectation.label} geometry mismatch: got ${width}x${height}, expected ${expectation.aspect}.`);
              assert(Math.max(width, height) >= resolutionMinLongEdge[expectation.resolution], `${expectation.label} did not reach the requested ${expectation.resolution} class: ${width}x${height}.`);
              assert(Math.abs(duration - expectation.durationSeconds) <= 1.5, `${expectation.label} duration mismatch: got ${duration}s, expected ${expectation.durationSeconds}s.`);
              assert(Math.abs(frameRate - expectation.frameRate) <= 0.6, `${expectation.label} frame-rate mismatch: got ${frameRate}, expected ${expectation.frameRate}.`);
              assert(hasAudio === expectation.audioEnabled, `${expectation.label} audio-stream mismatch: got ${hasAudio}, expected ${expectation.audioEnabled}.`);
              await execFileAsync("ffmpeg", [
                "-y", "-i", filename,
                "-vf", `fps=4/${expectation.durationSeconds},scale=480:-2,tile=2x2`,
                "-frames:v", "1",
                artifactSheet,
              ]);
              console.log(`${expectation.label} media ${width}x${height} duration=${duration.toFixed(2)}s fps=${frameRate.toFixed(2)} audio=${hasAudio} artifact=${artifactSheet}`);
              return { width, height, duration, frameRate, hasAudio };
            } finally {
              await rm(directory, { recursive: true, force: true });
            }
          }

          async function generate(account, request, expectation) {
            const startedAt = Date.now();
            const submit = await req(`${baseUrl}/api/generation/jobs`, account, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(request),
            });
            assert(submit.response.status === 202 && submit.payload?.ok && submit.payload?.job?.id, `${expectation.label} submit failed (${submit.response.status}): ${JSON.stringify(submit.payload)}`);
            const id = submit.payload.job.id;
            fixtureJobIds.add(id);
            console.log(`${expectation.label} accepted job=${id}`);
            const deadline = Date.now() + 25 * 60 * 1000;
            let last = "";
            while (Date.now() < deadline) {
              const poll = await req(`${baseUrl}/api/generation/jobs/${encodeURIComponent(id)}`, account, { headers: { accept: "application/json" } });
              assert(poll.response.ok && poll.payload?.ok && poll.payload?.job, `${expectation.label} poll failed (${poll.response.status}): ${JSON.stringify(poll.payload)}`);
              const job = poll.payload.job;
              if (job.status !== last) { last = job.status; console.log(`${expectation.label} status=${last}`); }
              assert(job.operation === expectation.operation, `${expectation.label} resolved ${job.operation}, expected ${expectation.operation}`);
              if (job.status === "failed") throw new Error(`${expectation.label} failed: ${job.error?.message || "unknown error"}`);
              if (job.status === "succeeded") {
                assert(job.outputAssetIds?.length === 1, `${expectation.label} missing persisted output`);
                const persistedJob = (await rows(`generation_jobs?id=eq.${encodeURIComponent(id)}&select=id,status,operation,owner_id,parameters&limit=1`))[0];
                const list = await assets(id);
                assert(
                  persistedJob?.owner_id === account.id
                    && persistedJob.status === "succeeded"
                    && persistedJob.operation === expectation.operation
                    && persistedJob.parameters?.output?.resolution === expectation.resolution
                    && persistedJob.parameters?.output?.audioEnabled === expectation.audioEnabled
                    && persistedJob.parameters?.output?.aspectRatio === request.output.aspectRatio
                    && persistedJob.parameters?.output?.durationSeconds === expectation.durationSeconds
                    && persistedJob.parameters?.advanced?.frameRate === expectation.frameRate
                    && !("steps" in (persistedJob.parameters?.advanced || {}))
                    && !("guidance" in (persistedJob.parameters?.advanced || {}))
                    && list.length === 1
                    && list[0].owner_id === account.id
                    && list[0].mime_type.startsWith("video/"),
                  `${expectation.label} persisted owner/product state is invalid: ${JSON.stringify({ persistedJob, assets: list })}`,
                );
                assert(job.outputAssetIds.includes(list[0].id), `${expectation.label} output IDs do not match persisted media.`);
                const media = await verifyAsset(account, list[0].id, expectation);
                console.log(`${expectation.label} verified owner=${account.id} asset=${list[0].id} elapsed=${((Date.now() - startedAt) / 1000).toFixed(1)}s`);
                return { jobId: id, assetId: list[0].id, media };
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`${expectation.label} timed out`);
          }

          if (cleanupOnly) {
            await cleanupFixtureAccount();
            process.exit(0);
          }

          const completed = [];
          let sourceId = "";
          try {
            await cleanupFixtureAccount();
            const account = await createConfiguredTestAccount("video-generation");
            const matchedPrompt = "A cobalt-blue glass sphere rotates slowly on a neutral studio background, steady camera, soft even light, no text";

            completed.push(await generate(account, {
              prompt: matchedPrompt,
              output: { kind: "video", aspectRatio: "16:9", resolution: "480p", durationSeconds: 5, audioEnabled: false },
              inputs: [],
              advanced: { seed: 31415, frameRate: 24 },
            }, { slug: "a-480p", label: "Case A 480p Create Video", operation: "create-video", resolution: "480p", aspect: "16:9", durationSeconds: 5, frameRate: 24, audioEnabled: false }));

            completed.push(await generate(account, {
              prompt: matchedPrompt,
              output: { kind: "video", aspectRatio: "16:9", resolution: "1080p", durationSeconds: 5, audioEnabled: false },
              inputs: [],
              advanced: { seed: 31415, frameRate: 24 },
            }, { slug: "b-1080p", label: "Case B 1080p Create Video", operation: "create-video", resolution: "1080p", aspect: "16:9", durationSeconds: 5, frameRate: 24, audioEnabled: false }));

            assert(
              completed[1].media.width * completed[1].media.height > completed[0].media.width * completed[0].media.height * 2,
              `Matched 1080p output did not materially exceed 480p encoded area: 480p=${completed[0].media.width}x${completed[0].media.height}, 1080p=${completed[1].media.width}x${completed[1].media.height}`,
            );

            completed.push(await generate(account, {
              prompt: "A vertical night city scene with rain reflections and gentle ambient street sound, slow forward camera move",
              output: { kind: "video", aspectRatio: "9:16", resolution: "720p", durationSeconds: 10, audioEnabled: true },
              inputs: [],
              advanced: { seed: 27182, frameRate: 25 },
            }, { slug: "c-720p-portrait-audio", label: "Case C 720p portrait audio Create Video", operation: "create-video", resolution: "720p", aspect: "9:16", durationSeconds: 10, frameRate: 25, audioEnabled: true }));

            sourceId = await uploadReference(account);
            completed.push(await generate(account, {
              prompt: "Preserve the first-frame composition while adding a slow parallax drift and subtle light movement",
              output: { kind: "video", aspectRatio: "original", resolution: "2K", durationSeconds: 5, audioEnabled: false },
              inputs: [{ alias: "image1", source: { type: "temporary-source", id: sourceId }, role: "first-frame" }],
              advanced: { seed: 16180, frameRate: 30 },
            }, { slug: "d-2k-animate-original", label: "Case D 2K Animate Original", operation: "animate-image", resolution: "2K", aspect: "2:1", durationSeconds: 5, frameRate: 30, audioEnabled: false }));

            console.log(`Phase 7D configured live matrix verified successfully for owner=${account.id}. Review artifacts are in ${artifactDir}.`);
          } finally {
            for (const result of completed) if (result?.jobId) fixtureJobIds.add(result.jobId);
            if (sourceId) fixtureSourceIds.add(sourceId);
            await cleanupFixtureAccount();
          }
          '''.replace("          ", ""))

          # Video integration workflow: run pure matrix and upload contextual review media.
          workflow = Path(".github/workflows/video-generation-integration.yml")
          text = workflow.read_text()
          text = text.replace(
              '      - "scripts/verify-video-generation.mjs"\n',
              '      - "scripts/verify-video-generation.mjs"\n      - "scripts/verify-video-contract.ts"\n',
              1,
          )
          text = text.replace(
              '''      - name: Install media inspection tools\n        run: sudo apt-get update && sudo apt-get install -y ffmpeg\n\n      - name: Build''',
              '''      - name: Install media inspection tools\n        run: sudo apt-get update && sudo apt-get install -y ffmpeg\n\n      - name: Verify Phase 7D product contract\n        run: npx --yes tsx@4.20.6 scripts/verify-video-contract.ts\n\n      - name: Build''',
          )
          text = text.replace(
              '''      - name: Print server log on failure\n        if: failure()\n        run: cat /tmp/renderlab-next.log || true\n''',
              '''      - name: Print server log on failure\n        if: failure()\n        run: cat /tmp/renderlab-next.log || true\n\n      - name: Upload Phase 7D contextual review artifacts\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: renderlab-phase7d-video-review\n          path: artifacts/phase7d-video-*\n          if-no-files-found: warn\n          retention-days: 14\n''',
          )
          workflow.write_text(text)

          # Configured Create lifecycle: inspect desktop/narrow/reduced-motion Video settings and browser serialization without worker spend.
          lifecycle = Path("scripts/verify-create-lifecycle.mjs")
          text = lifecycle.read_text()
          marker = '''  await prompt.fill(\"A clean studio photograph of a matte cobalt-blue sphere centered on a warm gray background, soft even light, no text\");\n\n  const generate = page.getByRole(\"button\", { name: \"Generate\", exact: true });\n  assert(await generate.isEnabled(), \"Configured Create did not enable Generate with a valid prompt for an authenticated account.\");\n'''
          injection = '''  await prompt.fill(\"A clean studio photograph of a matte cobalt-blue sphere centered on a warm gray background, soft even light, no text\");\n\n  const generate = page.getByRole(\"button\", { name: \"Generate\", exact: true });\n  assert(await generate.isEnabled(), \"Configured Create did not enable Generate with a valid prompt for an authenticated account.\");\n\n  const videoMode = page.getByRole(\"radio\", { name: \"Video\", exact: true });\n  await videoMode.click();\n  const videoSettings = page.getByRole(\"button\", { name: /^Video settings\\./ });\n  assert(\n    (await videoSettings.getAttribute(\"aria-label\")) === \"Video settings. Resolution 480p. Duration 5 seconds. Audio on\",\n    `Video settings did not initialize to the Phase 7D defaults: ${await videoSettings.getAttribute(\"aria-label\")}`,\n  );\n  await videoSettings.click();\n  const defaultResolution = page.getByRole(\"menuitemradio\", { name: \"480p\", exact: true });\n  assert((await defaultResolution.getAttribute(\"data-state\")) === \"checked\", \"480p was not the selected Video resolution default.\");\n  assert(await page.getByRole(\"menuitemradio\", { name: \"2K\", exact: true }).isVisible(), \"2K resolution is not reachable in Video settings.\");\n  assert(await page.getByRole(\"menuitemradio\", { name: \"4K\", exact: true }).count() === 0, \"Disabled 4K leaked into Video settings.\");\n  await page.screenshot({ path: `${artifactDir}/create-lifecycle-desktop-video-settings.png`, fullPage: true });\n  await page.getByRole(\"menuitemradio\", { name: \"1080p\", exact: true }).click();\n  assert((await videoSettings.textContent())?.includes(\"1080p · 5 s\"), \"Video settings trigger did not summarize resolution and duration.\");\n\n  await videoSettings.click();\n  await page.getByRole(\"menuitem\", { name: \"Advanced controls\", exact: true }).click();\n  await page.getByLabel(\"Frame rate\").waitFor({ state: \"visible\", timeout: 10_000 });\n  assert(await page.getByLabel(\"Steps\").count() === 0, \"Inactive Video Steps control is still rendered.\");\n  assert(await page.getByLabel(\"Guidance\").count() === 0, \"Inactive Video Guidance control is still rendered.\");\n  await page.screenshot({ path: `${artifactDir}/create-lifecycle-desktop-video-advanced.png`, fullPage: true });\n\n  await page.setViewportSize(mobileViewport);\n  await page.emulateMedia({ reducedMotion: \"reduce\" });\n  await videoSettings.click();\n  await page.getByText(\"Resolution\", { exact: true }).waitFor({ state: \"visible\", timeout: 10_000 });\n  await page.screenshot({ path: `${artifactDir}/create-lifecycle-mobile-video-settings-reduced.png`, fullPage: true });\n  await page.keyboard.press(\"Escape\");\n  await page.emulateMedia({ reducedMotion: \"no-preference\" });\n  await page.setViewportSize(desktopViewport);\n\n  let capturedVideoRequest = null;\n  await page.route(\"**/api/generation/jobs\", async (route) => {\n    if (route.request().method() !== \"POST\") {\n      await route.fallback();\n      return;\n    }\n    capturedVideoRequest = route.request().postDataJSON();\n    await route.fulfill({\n      status: 400,\n      contentType: \"application/json\",\n      body: JSON.stringify({ ok: false, error: { code: \"invalid_request\", message: \"Intentional Phase 7D browser serialization probe.\" } }),\n    });\n  }, { times: 1 });\n  await generate.click();\n  await page.waitForTimeout(250);\n  assert(capturedVideoRequest?.output?.resolution === \"1080p\", `Create did not serialize the selected Video resolution: ${JSON.stringify(capturedVideoRequest)}`);\n  assert(capturedVideoRequest?.advanced?.frameRate === 24, \"Create did not serialize the Video frame rate.\");\n  assert(!(\"steps\" in (capturedVideoRequest?.advanced || {})), \"Create still serialized inactive Video Steps.\");\n  assert(!(\"guidance\" in (capturedVideoRequest?.advanced || {})), \"Create still serialized inactive Video Guidance.\");\n  await page.unroute(\"**/api/generation/jobs\");\n\n  await page.getByRole(\"radio\", { name: \"Image\", exact: true }).click();\n  const closeAdvanced = page.getByRole(\"button\", { name: \"Close Advanced controls\" });\n  if (await closeAdvanced.isVisible()) await closeAdvanced.click();\n  assert(await page.getByLabel(\"Steps\").count() === 0, \"Closed Image Advanced controls unexpectedly remained visible.\");\n  assert(await generate.isEnabled(), \"Configured Create did not restore Image Generate after the Video serialization probe.\");\n'''
          if text.count(marker) != 1:
              raise SystemExit("Create lifecycle prompt marker changed")
          text = text.replace(marker, injection)
          lifecycle.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify pure Phase 7D contract
        run: npx --yes tsx@4.20.6 scripts/verify-video-contract.ts

      - name: Verify UI primitive policy
        run: npm run verify:ui-purity

      - name: Type-check staged implementation
        run: npx tsc --noEmit

      - name: Commit staged implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "renderlab-phase7d-bot"
          git config user.email "renderlab-phase7d-bot@users.noreply.github.com"
          git rm .github/workflows/phase-7d-implementation-stager.yml
          git add \
            src/lib/capabilities/generation.ts \
            src/lib/api/generation-contract.ts \
            src/features/create/create-advanced-panel.tsx \
            src/features/create/create-workspace.tsx \
            src/server/generation/native-generation.ts \
            scripts/verify-video-contract.ts \
            scripts/verify-video-generation.mjs \
            scripts/verify-create-lifecycle.mjs \
            .github/workflows/video-generation-integration.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Implement Phase 7D video resolution"
          git push origin HEAD:work/phase-7d-video-resolution-v0-2

name: Patch 223 Lifecycle Verifier

on:
  push:
    branches:
      - account/223-profile-credential-implementation
    paths:
      - .github/workflows/patch-223-lifecycle-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-implementation
          fetch-depth: 1
      - run: python scripts/patch-223-lifecycle-verifier.py
      - name: Commit acceptance extension
        run: |
          set -euo pipefail
          git rm scripts/patch-223-lifecycle-verifier.py .github/workflows/patch-223-lifecycle-verifier.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-account-data-lifecycle.mjs .github/workflows/account-data-lifecycle.yml
          git commit -m "test: extend account lifecycle for profiles"
          git push origin HEAD:account/223-profile-credential-implementation

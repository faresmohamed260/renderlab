name: Production Cutover Stage Receipt

# Read-only, before promotion. This workflow has no fixture or provider mutation steps.
on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Exact qualified frozen main SHA
        required: true
        type: string
      cutover_deployment_id:
        description: READY staged production deployment ID (not yet promoted)
        required: true
        type: string
      readiness_run_id:
        description: Successful Deployment Readiness run ID for this SHA
        required: true
        type: string
      release_authorization_ref:
        description: Non-secret release approval reference
        required: true
        type: string
      worker_evidence_ref:
        description: Non-secret compatible worker pair evidence reference
        required: true
        type: string
      confirm_exclusive_release_window:
        description: Confirm single releaser, merge freeze and no concurrent promotion
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: renderlab-production-cutover-stage
  cancel-in-progress: false

jobs:
  receipt:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_exclusive_release_window }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected main harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Capture qualified staged release while previous alias remains live
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RENDERLAB_EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          RENDERLAB_CUTOVER_DEPLOYMENT_ID: ${{ inputs.cutover_deployment_id }}
          RENDERLAB_READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
          RENDERLAB_RELEASE_AUTHORIZATION_REF: ${{ inputs.release_authorization_ref }}
          RENDERLAB_WORKER_EVIDENCE_REF: ${{ inputs.worker_evidence_ref }}
          RENDERLAB_CONFIRM_EXCLUSIVE_RELEASE_WINDOW: ${{ inputs.confirm_exclusive_release_window }}
        run: node scripts/verify-modal-cutover-smoke-release.mjs --stage
      - name: Retain immutable non-secret stage receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cutover-stage-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cutover-stage/receipt.json
          if-no-files-found: error
          retention-days: 30

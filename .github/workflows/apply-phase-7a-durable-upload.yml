name: Apply Phase 7A durable Create upload

on:
  push:
    branches:
      - work/phase-7a-create-foundation
    paths:
      - .github/workflows/apply-phase-7a-durable-upload.yml
      - .github/scripts/apply-phase-7a-durable-upload.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-7a-create-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Apply durable Create upload patch
        run: python .github/scripts/apply-phase-7a-durable-upload.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm install --no-audit --no-fund
          npm run verify:ui-purity
          npx tsc --noEmit
          npm run build
          git config user.name "RenderLab Phase 7A Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add src/app/page.tsx src/features/create/create-workspace.tsx src/server/media/media-uploads.ts tests/ui/create.spec.ts src/features/library/library-upload-client.ts src/lib/browser/media-upload-client.ts
          git commit -m "Make Create uploads durable media"
          git rm .github/workflows/apply-phase-7a-durable-upload.yml .github/scripts/apply-phase-7a-durable-upload.py
          git commit -m "Remove Phase 7A patch helpers"
          git push origin HEAD:work/phase-7a-create-foundation

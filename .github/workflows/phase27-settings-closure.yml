          )

          # UI_DECISIONS.md
          replace_one(
              "docs/ui/UI_DECISIONS.md",
              "**Status:** Accepted / implemented / exact-head verified / fidelity reviewed / merge pending / not deployed",
              "**Status:** Accepted / implemented / exact-head verified / fidelity reviewed / merged / merged-main verified / not deployed",
          )
          replace_one(
              "docs/ui/UI_DECISIONS.md",
              "**Decision:** Phase 27 chooses the bounded visual/account-information-architecture path rather than expanding RenderLab account capability. `/settings` and `/settings/password` will adopt the low-expressiveness **Trust Register** grammar for the behavior RenderLab already has: read-only Sign-in email, server-derived Closed Beta Access, Change password, truthful password-session consequences, verified-recovery context, global **Sign out everywhere**, and conditional fresh-Admin continuation. Phase 27 does not make the broader Account & Settings roadmap complete.",
              "**Decision:** Phase 27 chooses the bounded visual/account-information-architecture path rather than expanding RenderLab account capability. `/settings` and `/settings/password` now use the low-expressiveness **Trust Register** grammar for the behavior RenderLab already has: read-only Sign-in email, server-derived Closed Beta Access, Change password, truthful password-session consequences, verified-recovery context, global **Sign out everywhere**, and conditional fresh-Admin continuation. Phase 27 does not make the broader Account & Settings roadmap complete.",
          )
          replace_one(
              "docs/ui/UI_DECISIONS.md",
              "**Implementation verification:** planning PR #226 merged the contract/UI-078 first as `673983b08f1e7f5d2156122607d9773fdca363eb`. PR #227 exact implementation head `719b68501c2ceccd1fa91e12910ea7aa9bb04636` passed all six attached workflows: Account Identity `34768544863`, Account/Admin Operations `34768544852`, Engineering Quality `34768544858`, UI Shell `34768544856`, Brand / Launch `34768544862`, and Integrated Release `34768544855`. Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) was human-reviewed faithful across desktop/390px signed-out, Active, Suspended, ordinary password-change and verified-recovery states. The verifier preserves the existing global sign-out revocation, password replacement and recovery-security assertions; evidence captures occur before secrets are entered. Merge and merged-main verification are still pending, and production remains unchanged.",
              "**Implementation verification:** planning PR #226 merged the contract/UI-078 first as `673983b08f1e7f5d2156122607d9773fdca363eb`. Implementation code was stable at `719b68501c2ceccd1fa91e12910ea7aa9bb04636`; final docs-inclusive PR #227 head `d48084fef1255ee672936f6da8905ba95bc678ea` passed all six attached workflows: Account Identity `34768896748`, Account/Admin Operations `34768896750`, Engineering Quality `34768896758`, UI Shell `34768896773`, Brand / Launch `34768896753`, and Integrated Release `34768896737`. Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) was human-reviewed faithful across desktop/390px signed-out, Active, Suspended, ordinary password-change and verified-recovery states; final-head artifact `10321540973` (`sha256:490236398632e5a6c68ee4fca7591da68682b2c13343766f7c6d4903545e62f8`) confirmed the configured flow again. The verifier preserves the existing global sign-out revocation, password replacement and recovery-security assertions; evidence captures occur before secrets are entered. PR #227 squash-merged as `383def35fdf77566696a0c41f88349613029a37a`; merged-main Engineering Quality `34769204247` and UI Shell Validation `34769204150` passed. Production remains unchanged.",
          )


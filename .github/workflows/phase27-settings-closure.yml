              "**Status:** APPROVED — UI-078 Trust Register implemented / exact-head verified / fidelity reviewed / merged / merged-main verified / not deployed; existing account/admin security contracts preserved",
          )
          replace_one(
              "docs/ui/SCREEN_REGISTRY.md",
              "**Phase 27 / UI-078 verified candidate:** `/settings` and `/settings/password` now use the bounded Trust Register grammar: state-specific intro copy; read-only Sign-in email; server-derived Access; Change password with truthful session consequences; verified recovery context; global **Sign out everywhere**; and conditional fresh-Admin continuation. Signed-out state remains invitation-only Email/Password plus enumeration-safe recovery. The current 8-character floor, Current/New/Confirm semantics, recovery marker validation, global sign-out behavior, canonical `auth.users.id`, admission/role ownership and Admin gate are unchanged. Profile/avatar/username, reusable Show/Hide/password-policy UX, hosted Auth hardening, session inventory, MFA, email editing, export/deletion, preferences/notifications and passkeys remain out of scope. Exact head `719b68501c2ceccd1fa91e12910ea7aa9bb04636` passed all six attached workflows; reviewed Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) covers desktop/390px signed-out, Active, Suspended, ordinary password and verified-recovery states. PR #227 merge and merged-main verification remain pending; production remains unchanged.",
              "**Phase 27 / UI-078 closure:** `/settings` and `/settings/password` use the bounded Trust Register grammar: state-specific intro copy; read-only Sign-in email; server-derived Access; Change password with truthful session consequences; verified recovery context; global **Sign out everywhere**; and conditional fresh-Admin continuation. Signed-out state remains invitation-only Email/Password plus enumeration-safe recovery. The current 8-character floor, Current/New/Confirm semantics, recovery marker validation, global sign-out behavior, canonical `auth.users.id`, admission/role ownership and Admin gate are unchanged. Profile/avatar/username, reusable Show/Hide/password-policy UX, hosted Auth hardening, session inventory, MFA, email editing, export/deletion, preferences/notifications and passkeys remain out of scope. Final PR head `d48084fef1255ee672936f6da8905ba95bc678ea` passed all six attached workflows; reviewed Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) covers desktop/390px signed-out, Active, Suspended, ordinary password and verified-recovery states, while final-head artifact `10321540973` (`sha256:490236398632e5a6c68ee4fca7591da68682b2c13343766f7c6d4903545e62f8`) confirmed the configured flow. PR #227 merged as `383def35fdf77566696a0c41f88349613029a37a`; merged-main Engineering Quality `34769204247` and UI Shell Validation `34769204150` passed. Production remains unchanged.",
          )
          replace_one(
              "docs/ui/SCREEN_REGISTRY.md",
              "- compact email/password Sign in + Forgot password when signed out, and access-status / Change password / Sign out when signed in; public self-service Create account is absent under the Closed-Beta admission contract;",
              "- compact email/password Sign in + Forgot password when signed out, and access-status / Change password / Sign out everywhere when signed in; public self-service Create account is absent under the Closed-Beta admission contract;",
          )
          PY
      - name: Remove temporary closure workflow
        run: git rm .github/workflows/phase27-settings-closure.yml
      - name: Commit closure documentation
        shell: bash
        run: |
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md .github/workflows/phase27-settings-closure.yml

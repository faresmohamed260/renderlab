name: Phase 27 closure docs

on:
  push:
    branches:
      - docs/phase-27-settings-closure
    paths:
      - .github/workflows/phase27-settings-closure.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-27-settings-closure
      - name: Record verified Phase 27 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          # PROJECT.md
          replace_one(
              "PROJECT.md",
              "**Status: ACTIVE — Landing, Create, Library, Media Viewer and Activity completed; Settings, Admin and final cohesion remain.**",
              "**Status: ACTIVE — Landing, Create, Library, Media Viewer, Activity and Settings completed; Admin and final cohesion remain.**",
          )
          replace_one(
              "PROJECT.md",
              "- **Activity:** approved Job Matrix + History Register v0.2 / UI-077, merged and merged-main verified, not yet deployed.\n- **Application shell:** UI-074 compact horizontal header is the current shared shell geometry and should be maintained/cohered rather than restarted as a competing navigation system.",
              "- **Activity:** approved Job Matrix + History Register v0.2 / UI-077, merged and merged-main verified, not yet deployed.\n- **Settings:** approved Trust Register / UI-078, merged and merged-main verified, not yet deployed.\n- **Application shell:** UI-074 compact horizontal header is the current shared shell geometry and should be maintained/cohered rather than restarted as a competing navigation system.",
          )
          replace_one(
              "PROJECT.md",
              "3. **Phase 27 — Settings / account-security flows:** IMPLEMENTED / EXACT-HEAD VERIFIED / FIDELITY REVIEWED / MERGE PENDING / NOT DEPLOYED. UI-078 and `docs/ui/SETTINGS_TRUST_REGISTER_IMPLEMENTATION_CONTRACT.md` govern the bounded Trust Register production slice. PR #227 exact head `719b68501c2ceccd1fa91e12910ea7aa9bb04636` passed all six attached workflows and the Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) was human-reviewed across desktop/390px signed-out, Active, Suspended, ordinary password-change and verified-recovery states. The broader Account & Settings capability program remains independently governed by `docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md` and workstreams #215–#221/#223.",
              "3. **Phase 27 — Settings / account-security flows:** IMPLEMENTED / EXACT-HEAD VERIFIED / FIDELITY REVIEWED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED. UI-078 and `docs/ui/SETTINGS_TRUST_REGISTER_IMPLEMENTATION_CONTRACT.md` govern the bounded Trust Register production slice. Final PR #227 head `d48084fef1255ee672936f6da8905ba95bc678ea` passed all six attached workflows; the accepted fidelity review remains Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) from the unchanged implementation code, and final-head Account Identity artifact `10321540973` (`sha256:490236398632e5a6c68ee4fca7591da68682b2c13343766f7c6d4903545e62f8`) confirmed the configured flow. PR #227 squash-merged as `383def35fdf77566696a0c41f88349613029a37a`; merged-main Engineering Quality `34769204247` and UI Shell Validation `34769204150` both passed. The broader Account & Settings capability program remains independently governed by `docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md` and workstreams #215–#221/#223.",
          )
          replace_one(
              "PROJECT.md",
              "Phase 26 is closed. Phase 27 Settings / account-security has completed implementation and exact-head/fidelity verification at `719b68501c2ceccd1fa91e12910ea7aa9bb04636` and is awaiting merge through PR #227. This closes only the UI-078 production slice after merge; it does not close the broader Account & Settings capability roadmap or its independent security/profile/privacy workstreams. Phase 28 Admin remains the next redesign slice only after Phase 27 merge/merged-main verification, and Phase 29 remains roadmap-level. Every remaining surface must reuse the established RenderLab visual/interaction family rather than inventing a new theme. Production deployment remains separate and explicit; current production is still source `0173c4c5ba08360b6352331118abc81978cfa774` at READY deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`, with automatic Git → Vercel deployment disabled.",
              "Phases 26 and 27 are closed. Phase 27 Settings / account-security is implemented, exact-head/fidelity verified, merged as `383def35fdf77566696a0c41f88349613029a37a`, and merged-main verified. This closes only the UI-078 production slice; it does not close the broader Account & Settings capability roadmap or its independent security/profile/privacy workstreams. Phase 28 Admin is now the next redesign-planning slice, while Phase 29 remains roadmap-level. Every remaining surface must reuse the established RenderLab visual/interaction family rather than inventing a new theme. Production deployment remains separate and explicit; current production is still source `0173c4c5ba08360b6352331118abc81978cfa774` at READY deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`, with automatic Git → Vercel deployment disabled.",
          )
          replace_one(
              "PROJECT.md",
              "- Exact implementation head `719b68501c2ceccd1fa91e12910ea7aa9bb04636` passed all six workflows GitHub attached: Account Identity `34768544863`, Account/Admin Operations `34768544852`, Engineering Quality `34768544858`, UI Shell `34768544856`, Brand / Launch `34768544862`, and Integrated Release `34768544855`.",
              "- Implementation code was stable at `719b68501c2ceccd1fa91e12910ea7aa9bb04636`; final docs-inclusive PR head `d48084fef1255ee672936f6da8905ba95bc678ea` passed all six workflows GitHub attached: Account Identity `34768896748`, Account/Admin Operations `34768896750`, Engineering Quality `34768896758`, UI Shell `34768896773`, Brand / Launch `34768896753`, and Integrated Release `34768896737`.",
          )
          replace_one(
              "PROJECT.md",
              "- Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) was human-reviewed clean across desktop and 390px signed-out, Active, Suspended, ordinary Change password and verified recovery. The corrected verifier resets scroll before full-page narrow captures, adds password/recovery evidence before secrets are entered, preserves global-session revocation/password-change/recovery assertions, and exposes no credential values in screenshots.",
              "- Account Identity artifact `10320219197` (`sha256:8217b1bfcb314825f17b37dbf3c3e51861a6f61b5e2ac772ccbbda6b21cdccac`) was human-reviewed clean across desktop and 390px signed-out, Active, Suspended, ordinary Change password and verified recovery. The corrected verifier resets scroll before full-page narrow captures, adds password/recovery evidence before secrets are entered, preserves global-session revocation/password-change/recovery assertions, and exposes no credential values in screenshots. The same configured verifier passed again at final PR head and produced artifact `10321540973` (`sha256:490236398632e5a6c68ee4fca7591da68682b2c13343766f7c6d4903545e62f8`).",
          )
          replace_one(
              "PROJECT.md",
              "- The implementation remains pending PR #227 merge and merged-main verification. Production is unchanged and deployment remains separately explicit.",
              "- PR #227 squash-merged to `main` as `383def35fdf77566696a0c41f88349613029a37a`. GitHub attached exactly two push workflows to that merge SHA and both passed: Engineering Quality `34769204247` and UI Shell Validation `34769204150`. Production is unchanged and deployment remains separately explicit.",
          )

          # UI_MIGRATION.md
          replace_one(

name: Phase 27 closure docs

on:
  push:
    branches:
      - docs/phase-27-settings-closure
    paths:
      - .github/workflows/phase27-settings-closure.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-27-settings-closure
          fetch-depth: 2
      - name: Apply verified closure patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = ".github/workflows/phase27-settings-closure.yml"
          old = subprocess.check_output(["git", "show", f"HEAD^:{workflow}"], text=True)
          marker = "          python - <<'PY'\n"
          start = old.index(marker) + len(marker)
          end = old.index("\n          PY\n", start)
          block = old[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          Path("/tmp/phase27-close.py").write_text(code + "\n")
          PY
          python /tmp/phase27-close.py
      - name: Commit closure documentation
        shell: bash
        run: |
          git rm .github/workflows/phase27-settings-closure.yml
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close Phase 27 Settings Trust Register"
          git push origin HEAD:docs/phase-27-settings-closure

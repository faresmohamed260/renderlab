name: ENT-007 Provider Bootstrap

on:
  push:
    branches:
      - work/ent-007-free-recovery
    paths:
      - ".github/workflows/ent007-provider-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: renderlab-ent007-provider-bootstrap
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: rashyleshocuvpgcooxy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN CLOUDFLARE_API_TOKEN R2_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Prove Supabase Management API logical-export access
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          ro_api="$api/read-only"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json')

          public_payload="$(jq -cn '{query:"select count(*)::bigint as row_count from public.media_assets"}')"
          public_out="$(mktemp)"
          public_code="$(curl --silent --show-error -o "$public_out" -w '%{http_code}' -X POST "${auth[@]}" -d "$public_payload" "$ro_api")"
          if [ "$public_code" != 201 ]; then
            echo "::error::Supabase read-only query endpoint rejected public-table access (HTTP $public_code)."
            jq -c '{error:(.message // .error // "unknown")}' "$public_out" 2>/dev/null || true
            exit 1
          fi
          echo 'supabase_public_readonly_query=verified'

          auth_payload="$(jq -cn '{query:"select count(*)::bigint as row_count from auth.users",read_only:true}')"
          auth_out="$(mktemp)"
          auth_code="$(curl --silent --show-error -o "$auth_out" -w '%{http_code}' -X POST "${auth[@]}" -d "$auth_payload" "$api")"
          if [ "$auth_code" = 201 ]; then
            echo 'supabase_auth_readonly_query=verified'
          else
            echo "supabase_auth_readonly_query=unavailable_http_$auth_code"
          fi

          migration_payload="$(jq -cn '{query:"select count(*)::bigint as row_count from supabase_migrations.schema_migrations"}')"
          migration_out="$(mktemp)"
          migration_code="$(curl --silent --show-error -o "$migration_out" -w '%{http_code}' -X POST "${auth[@]}" -d "$migration_payload" "$ro_api")"
          if [ "$migration_code" = 201 ]; then
            echo 'supabase_migration_history_query=verified'
          else
            echo "supabase_migration_history_query=unavailable_http_$migration_code"
          fi

      - name: Probe Cloudflare token-provisioning authority
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account_url="https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT_ID/tokens/permission_groups?name=Workers%20R2%20Storage%20Write"
          user_url="https://api.cloudflare.com/client/v4/user/tokens/permission_groups?name=Workers%20R2%20Storage%20Write"

          account_out="$(mktemp)"
          account_code="$(curl --silent --show-error -o "$account_out" -w '%{http_code}' "${auth[@]}" "$account_url")"
          user_out="$(mktemp)"
          user_code="$(curl --silent --show-error -o "$user_out" -w '%{http_code}' "${auth[@]}" "$user_url")"

          echo "cloudflare_account_token_permission_groups_http=$account_code"
          echo "cloudflare_user_token_permission_groups_http=$user_code"

          if [ "$account_code" = 200 ]; then
            jq -c '{account_r2_groups:[.result[]? | {id,name,is_selectable,scopes}]}' "$account_out"
          fi
          if [ "$user_code" = 200 ]; then
            jq -c '{user_r2_groups:[.result[]? | {id,name,is_selectable,scopes}]}' "$user_out"
          fi

          if [ "$account_code" != 200 ] && [ "$user_code" != 200 ]; then
            echo '::error::Current Cloudflare token cannot enumerate account-owned or user-owned token permission groups.'
            exit 1
          fi

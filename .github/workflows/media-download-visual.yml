name: Media Download Visual

on:
  pull_request:
    paths:
      - "scripts/verify-media-download.mjs"
      - ".github/workflows/media-download-visual.yml"
      - "src/app/api/media/assets/**"
      - "src/features/library/media-viewer.tsx"
      - "src/server/media/media-assets.ts"
      - "src/server/storage/r2.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/library > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log || true
          exit 1

      - name: Render configured media download lifecycle
        run: node scripts/verify-media-download.mjs

      - name: Cleanup media download fixtures
        if: always()
        run: node scripts/verify-media-download.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload media download screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-media-download-screenshots
          path: artifacts/media-download-*.png
          if-no-files-found: warn
          retention-days: 14

name: UI-034 Post-Merge Handoff

on:
  pull_request:
    paths:
      - ".github/workflows/ui034-post-merge-handoff.yml"
      - "scripts/ui034-post-merge-handoff.mjs"

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'tmp/ui034-post-merge-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/ui034-post-merge-handoff
          fetch-depth: 0

      - name: Patch authoritative UI-034 completion docs
        run: node scripts/ui034-post-merge-handoff.mjs .

      - name: Validate and remove helper files
        shell: bash
        run: |
          git diff --check
          rm scripts/ui034-post-merge-handoff.mjs .github/workflows/ui034-post-merge-handoff.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize UI-034 post-merge handoff"
          git push origin HEAD:tmp/ui034-post-merge-handoff

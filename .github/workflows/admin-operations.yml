name: Account/Admin Operations

on:
  pull_request:
    paths:
      - "package.json"
      - "tsconfig.json"
      - "src/app/admin/**"
      - "src/app/api/admin/**"
      - "src/app/settings/**"
      - "src/components/shell/**"
      - "src/features/admin/**"
      - "src/lib/api/admin-contract.ts"
      - "src/lib/supabase/**"
      - "src/server/account/**"
      - "src/server/admin/**"
      - "supabase/migrations/0010_renderlab_account_admission.sql"
      - "supabase/migrations/0011_renderlab_admin_access_control.sql"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-admin-operations.mjs"
      - ".github/workflows/admin-operations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-admin-operations-shared
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required Admin fixture secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured for RenderLab."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit exact changed files and whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git diff --check "$base"...HEAD
          git diff --name-only "$base"...HEAD | tee /tmp/renderlab-admin-changed-files.txt

      - name: Enforce Phase 10B scope boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if grep -Eq '^src/(app/api/generation/|server/generation/(submit-generation|retry-generation)\.ts$)' /tmp/renderlab-admin-changed-files.txt; then
            echo "::error::Phase 10B must not change Create/Retry generation admission paths."
            exit 1
          fi
          if grep -Eq 'renderlab_beta_settings|generation_admission_reservations' supabase/migrations/0011_renderlab_admin_access_control.sql; then
            echo "::error::Phase 10C schema is out of scope for Phase 10B."
            exit 1
          fi
          if grep -RInE 'auth\.admin\.listUsers|from[[:space:]]+auth\.users|join[[:space:]]+auth\.users' src/server/admin supabase/migrations/0011_renderlab_admin_access_control.sql; then
            echo "::error::Phase 10B must not enumerate the shared Supabase Auth directory."
            exit 1
          fi

      - name: Verify maintained UI primitive usage
        run: npm run verify:ui-purity

      - name: Type-check
        run: npx tsc --noEmit

      - name: Verify Admin verifier syntax
        run: node --check scripts/verify-admin-operations.mjs

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/settings > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log || true
          exit 1

      - name: Verify configured Admin Operations
        run: node scripts/verify-admin-operations.mjs

      - name: Cleanup Admin Operations fixtures
        if: always()
        run: node scripts/verify-admin-operations.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload Admin Operations screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-admin-operations-screenshots
          path: artifacts/admin-operations-*.png
          if-no-files-found: warn
          retention-days: 14

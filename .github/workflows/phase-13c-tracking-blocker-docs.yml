name: Phase 13C Tracking Blocker Documentation

on:
  push:
    branches: [docs/phase-13c-tracking-blocker]
    paths:
      - ".github/workflows/phase-13c-tracking-blocker-docs.yml"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-13c-tracking-blocker
          fetch-depth: 0

      - name: Apply verified blocker documentation
        run: python .github/phase13c_blocker_patch.py

      - name: Remove temporary helpers and commit docs only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/phase13c_blocker_patch.py .github/workflows/phase-13c-tracking-blocker-docs.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'PROJECT.md\ndocs/architecture/INFRASTRUCTURE.md\ndocs/ui/UI_MIGRATION.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_MIGRATION.md .github/phase13c_blocker_patch.py .github/workflows/phase-13c-tracking-blocker-docs.yml
          git commit -m 'docs: record Phase 13C tracking blocker'
          git push origin HEAD:docs/phase-13c-tracking-blocker

name: Patch 223 Configured Account Cleanup

on:
  push:
    branches:
      - account/223-profile-credential-implementation
    paths:
      - .github/workflows/patch-223-configured-account-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-implementation
          fetch-depth: 1
      - run: python scripts/patch-223-configured-account-cleanup.py
      - name: Commit cleanup extension
        run: |
          set -euo pipefail
          git rm scripts/patch-223-configured-account-cleanup.py .github/workflows/patch-223-configured-account-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/configured-test-account.mjs
          git commit -m "test: clean profile state from configured fixtures"
          git push origin HEAD:account/223-profile-credential-implementation

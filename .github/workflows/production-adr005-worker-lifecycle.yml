name: Production ADR-005 Worker Lifecycle

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Bounded worker behavior to verify
        type: choice
        options:
          - warm-queue
          - cancel-recovery
          - process-exit-recovery
        required: true
      expected_production_sha:
        description: Exact 40-character Git SHA independently verified as production-live
        required: true
        type: string
      confirm_two_disposable_provider_calls:
        description: Confirm this run may start at most two disposable FIBO provider calls
        required: true
        type: boolean
        default: false
      confirm_external_process_termination:
        description: Confirm the process-exit scenario may terminate its one run-owned ComfyUI subprocess
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: renderlab-production-adr005-worker-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_two_disposable_provider_calls && (inputs.scenario != 'process-exit-recovery' || inputs.confirm_external_process_termination) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RENDERLAB_ADR005_LIFECYCLE_SCENARIO: ${{ inputs.scenario }}
      RENDERLAB_CONFIRM_ADR005_PROVIDER_WORK: ${{ inputs.confirm_two_disposable_provider_calls }}
      RENDERLAB_CONFIRM_ADR005_PROCESS_TERMINATION: ${{ inputs.confirm_external_process_termination }}
      RENDERLAB_EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      RENDERLAB_TEST_BASE_URL: https://renderlab.faresuniform.uk
      RENDERLAB_TEST_ACCOUNT_SCOPE: production-adr005-${{ github.run_id }}
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
      RENDERLAB_ADR005_ARTIFACT_DIR: artifacts/production-adr005-worker-lifecycle
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout protected main harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate bounded manual dispatch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "$RENDERLAB_CONFIRM_ADR005_PROVIDER_WORK" != "true" ]; then
            echo "::error::ADR-005 worker lifecycle verification is manual and requires exact provider-work confirmation."
            exit 1
          fi
          if [ "$RENDERLAB_ADR005_LIFECYCLE_SCENARIO" = "process-exit-recovery" ] && [ "$RENDERLAB_CONFIRM_ADR005_PROCESS_TERMINATION" != "true" ]; then
            echo "::error::The process-exit scenario requires explicit external ComfyUI-subprocess termination confirmation."
            exit 1
          fi
          if ! printf "%s" "$RENDERLAB_EXPECTED_PRODUCTION_SHA" | grep -Eq "^[0-9a-fA-F]{40}$"; then
            echo "::error::expected_production_sha must be an exact 40-character Git SHA."
            exit 1
          fi

      - name: Verify exact live release before fixture work
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-production-documentation-sync.mjs
          node scripts/verify-production-live-state.mjs

      - name: Validate fixture secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate lifecycle harness
        run: |
          node --check scripts/verify-production-adr005-worker-lifecycle.mjs
          node --test tests/unit/production-adr005-worker-lifecycle-contract.test.mjs

      - name: Run bounded lifecycle verification
        run: node scripts/verify-production-adr005-worker-lifecycle.mjs

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-adr005-${{ inputs.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-adr005-worker-lifecycle
          if-no-files-found: error
          retention-days: 30

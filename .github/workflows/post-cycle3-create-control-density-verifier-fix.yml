name: Fix compact Create row verifier

on:
  push:
    branches:
      - work/post-cycle3-create-control-density
    paths:
      - .github/workflows/post-cycle3-create-control-density-verifier-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/post-cycle3-create-control-density
          fetch-depth: 0
      - name: Correct row-fit assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-create-lifecycle.mjs')
          text = path.read_text()
          old = '''    const tops = controls.map((rect) => rect.top);\n    return {\n      count: controls.length,\n      topSpread: tops.length ? Math.max(...tops) - Math.min(...tops) : 0,\n      overflow: row.scrollWidth - row.clientWidth,\n    };\n  });\n  assert(metrics.count >= 5, `${label} did not expose the expected compact primary controls: ${JSON.stringify(metrics)}`);\n  assert(metrics.topSpread <= 2, `${label} primary controls wrapped onto multiple rows: ${JSON.stringify(metrics)}`);\n  assert(metrics.overflow <= 2, `${label} primary controls overflowed horizontally: ${JSON.stringify(metrics)}`);'''
          new = '''    return {\n      count: controls.length,\n      flexWrap: getComputedStyle(row).flexWrap,\n      overflow: row.scrollWidth - row.clientWidth,\n    };\n  });\n  assert(metrics.count >= 5, `${label} did not expose the expected compact primary controls: ${JSON.stringify(metrics)}`);\n  assert(metrics.flexWrap === "nowrap", `${label} primary controls are not constrained to one row: ${JSON.stringify(metrics)}`);\n  assert(metrics.overflow <= 2, `${label} primary controls overflowed horizontally: ${JSON.stringify(metrics)}`);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one verifier block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/verify-create-lifecycle.mjs
          git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-cycle3-create-control-density-verifier-fix.yml
          git add scripts/verify-create-lifecycle.mjs
          git diff --cached --check
          git commit -m "Fix compact Create row assertion"
          git push origin HEAD:work/post-cycle3-create-control-density

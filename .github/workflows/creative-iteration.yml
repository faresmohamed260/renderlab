name: Creative Iteration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/creative-iteration.yml"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-creative-iteration.mjs"
      - "package.json"
      - "components.json"
      - "src/app/(app)/create/**"
      - "src/app/(app)/activity/**"
      - "src/app/(app)/library/[assetId]/**"
      - "src/app/api/assets/reference/**"
      - "src/app/api/generation/jobs/**"
      - "src/features/activity/**"
      - "src/features/create/**"
      - "src/features/library/media-viewer*.tsx"
      - "src/lib/api/generation-activity-contract.ts"
      - "src/lib/api/generation-contract.ts"
      - "src/lib/api/generation-recipe-contract.ts"
      - "src/lib/api/generation-retry-contract.ts"
      - "src/lib/api/generation-run-again-contract.ts"
      - "src/lib/api/media-assets-contract.ts"
      - "src/lib/capabilities/generation.ts"
      - "src/lib/supabase/**"
      - "src/server/data/**"
      - "src/server/generation/generation-activity.ts"
      - "src/server/generation/generation-admission.ts"
      - "src/server/generation/generation-recipe.ts"
      - "src/server/generation/retry-generation.ts"
      - "src/server/generation/run-again-generation.ts"
      - "src/server/generation/submit-generation.ts"
      - "src/server/media/media-assets.ts"
      - "src/server/media/reference-uploads.ts"
      - "src/server/storage/**"
      - "supabase/migrations/0001_generation_sources.sql"
      - "supabase/migrations/0002_generation_jobs_media_assets.sql"
      - "supabase/migrations/0004_core_account_ownership_prepare.sql"
      - "supabase/migrations/0005_core_account_ownership_enforce.sql"
      - "supabase/migrations/0009_media_asset_deletion.sql"
      - "supabase/migrations/0012_renderlab_generation_admission.sql"
      - "supabase/migrations/0013_generation_reconciliation.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/creative-iteration.yml"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-creative-iteration.mjs"
      - "package.json"
      - "components.json"
      - "src/app/(app)/create/**"
      - "src/app/(app)/activity/**"
      - "src/app/(app)/library/[assetId]/**"
      - "src/app/api/assets/reference/**"
      - "src/app/api/generation/jobs/**"
      - "src/features/activity/**"
      - "src/features/create/**"
      - "src/features/library/media-viewer*.tsx"
      - "src/lib/api/generation-activity-contract.ts"
      - "src/lib/api/generation-contract.ts"
      - "src/lib/api/generation-recipe-contract.ts"
      - "src/lib/api/generation-retry-contract.ts"
      - "src/lib/api/generation-run-again-contract.ts"
      - "src/lib/api/media-assets-contract.ts"
      - "src/lib/capabilities/generation.ts"
      - "src/lib/supabase/**"
      - "src/server/data/**"
      - "src/server/generation/generation-activity.ts"
      - "src/server/generation/generation-admission.ts"
      - "src/server/generation/generation-recipe.ts"
      - "src/server/generation/retry-generation.ts"
      - "src/server/generation/run-again-generation.ts"
      - "src/server/generation/submit-generation.ts"
      - "src/server/media/media-assets.ts"
      - "src/server/media/reference-uploads.ts"
      - "src/server/storage/**"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: renderlab-creative-iteration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  creative-iteration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_GENERATION_BACKEND_URL: http://127.0.0.1:3011
      RENDERLAB_GENERATION_BACKEND_TOKEN: renderlab-phase16-ci-token
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the RenderLab repository/environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify UI primitive purity
        run: npm run verify:ui-purity

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/create > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log || true
          exit 1

      - name: Verify creative iteration contract
        run: node scripts/verify-creative-iteration.mjs

      - name: Cleanup creative iteration fixtures
        if: always()
        run: node scripts/verify-creative-iteration.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload creative iteration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-phase16-creative-iteration-screenshots
          path: artifacts/phase16-*.png
          if-no-files-found: warn
          retention-days: 14

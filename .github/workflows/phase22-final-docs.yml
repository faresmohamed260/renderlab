name: Phase 22 exact-head Admin acceptance

on:
  push:
    branches:
      - tmp/phase22-final-docs-20260908
    paths:
      - ".github/workflows/phase22-final-docs.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: renderlab-phase22-admin-acceptance-executor
  cancel-in-progress: false

jobs:
  admin-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REF: work/phase-22-system-cohesion
      TARGET_SHA: d16c3c826bca3e977fe70c05d13ed0187437d1bd
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify target head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "/repos/$GITHUB_REPOSITORY/branches/$TARGET_REF" --jq '.commit.sha')"
          test "$actual" = "$TARGET_SHA"
          echo "Verified target $TARGET_REF at $TARGET_SHA"

      - name: Dispatch Admin Operations only
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "STARTED_AT=$started_at" >> "$GITHUB_ENV"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/admin-operations.yml/dispatches" \
            -f "ref=$TARGET_REF"

      - name: Require exact-SHA Admin success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            run_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/admin-operations.yml/runs?event=workflow_dispatch&branch=$TARGET_REF&per_page=20" \
              --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .created_at >= \"$STARTED_AT\")) | sort_by(.created_at) | last // empty")"
            if [ -z "$run_json" ]; then
              sleep 10
              continue
            fi
            run_id="$(jq -r '.id' <<<"$run_json")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            echo "Admin run $run_id: $status ${conclusion:-}"
            if [ "$status" != "completed" ]; then
              sleep 10
              continue
            fi
            test "$conclusion" = "success"
            jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs")"
            job_count="$(jq '.jobs | length' <<<"$jobs")"
            test "$job_count" -gt 0
            jq -e '.jobs | all(.conclusion == "success")' <<<"$jobs" >/dev/null
            echo "Exact-SHA Admin Operations succeeded: $run_id"
            exit 0
          done
          echo "::error::Timed out waiting for exact-SHA Admin Operations."
          exit 1

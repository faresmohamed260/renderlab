name: Phase 22 final documentation

on:
  push:
    branches:
      - tmp/phase22-final-docs-20260908
    paths:
      - ".github/workflows/phase22-final-docs.yml"

permissions:
  contents: write

concurrency:
  group: renderlab-phase22-final-docs
  cancel-in-progress: false

jobs:
  close-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated executor
        uses: actions/checkout@v4
        with:
          ref: tmp/phase22-final-docs-20260908
          path: executor
          fetch-depth: 1

      - name: Checkout exact Phase 22 candidate
        uses: actions/checkout@v4
        with:
          ref: work/phase-22-system-cohesion
          path: target
          fetch-depth: 0

      - name: Verify starting head
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "c081d53afecdd76f8c687cfc950d8f4bb0454a8a"

      - name: Apply guarded Phase 22 closure documentation
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python ../executor/scripts/phase22-final-docs.py
          python ../executor/scripts/phase22-normalize-final-docs.py

      - name: Validate documentation-only closure diff
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' PROJECT.md docs/ui/SCREEN_REGISTRY.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected Phase 22 closure paths"
            printf 'Actual:\n%s\nExpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          grep -Fq 'VERIFIED ON IMPLEMENTATION HEAD / MERGE PENDING' PROJECT.md
          grep -Fq '### UI-065 — Activity, Settings and Landing complete Kinetic Precision system cohesion' docs/ui/UI_DECISIONS.md
          grep -Fq 'Phase 22 pre-merge verified closure — 2026-09-08' docs/ui/UI_MIGRATION.md
          grep -Fq 'Cycle 4 Phase 22 screen extensions — VERIFIED ON IMPLEMENTATION HEAD / MERGE PENDING' docs/ui/SCREEN_REGISTRY.md

      - name: Commit and push one Phase 22 closure update
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md
          git commit -m "Document Phase 22 pre-merge verification"
          git push origin HEAD:work/phase-22-system-cohesion

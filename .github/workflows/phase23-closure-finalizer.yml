name: Phase 23 Closure Finalizer

on:
  push:
    branches:
      - docs/phase-23-closure
    paths:
      - .github/workflows/phase23-closure-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/phase-23-closure
          fetch-depth: 0

      - name: Synchronize verified Phase 23 closure records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          MERGE = "d360f60afeca0b6c417ff1c12dec3c7e922c20f7"
          FINAL = "428cbd025d9f314f5b8d1582fd6911f1abd5094b"
          MAIN_MATRIX = "34645636285"
          MAIN_ARTIFACT = "10281164476"
          MAIN_DIGEST = "sha256:243bb49e61df0a1f491b0a1fd6b1710bc3045c1afb656e000fb7b0094e252890"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "PROJECT.md",
              "- Authoritative repository source currently deployed is `0173c4c5ba08360b6352331118abc81978cfa774`. It contains the approved four-section Lab Matrix Landing plus the previously verified application corrections through UI-071; commits after the Landing implementation merge are documentation-only.",
              f"- Current repository `main` is `{MERGE}`, the squash merge of PR #185 / Phase 23 Clear Composer v0.5. Exact merged-main Release Candidate Matrix `{MAIN_MATRIX}` passed all 23 exact-SHA child workflows; manifest artifact `{MAIN_ARTIFACT}` has digest `{MAIN_DIGEST}`. Production has **not** been redeployed for Phase 23 and remains on source `0173c4c5ba08360b6352331118abc81978cfa774` until a separately authorized rollout."
          )

          replace_once(
              "docs/ui/UI_MIGRATION.md",
              "## Phase 23 — Create Clear Composer v0.5 candidate — 2026-09-11",
              "## Phase 23 — Create Clear Composer v0.5 closure — 2026-09-11"
          )
          replace_once(
              "docs/ui/UI_MIGRATION.md",
              "- [x] Production implementation is tracked by issue #184 and draft PR #185 on `work/phase-23-create-clear-composer`; no schema, provider/worker, routing, auth/admission, ownership, storage or deployment contract is changed.",
              f"- [x] Production implementation was tracked by issue #184 and PR #185; PR #185 squash-merged to `main` as `{MERGE}`. No schema, provider/worker, routing, auth/admission, ownership, storage or deployment contract changed."
          )
          replace_once(
              "docs/ui/UI_MIGRATION.md",
              "- Merge acceptance on any later documentation-finalized branch head remains conditioned on that exact head passing Release Candidate Matrix; record that self-referential final-head evidence on issue #184 / PR #185 rather than creating another documentation-only verification head.\n- [ ] Merge to `main` remains separately explicit. Production deployment remains separately explicit and automatic Git → Vercel deployment stays disabled.\n\n**Phase 23 status: `IMPLEMENTATION VERIFIED / MERGE ACCEPTANCE PENDING / NOT MERGED / NOT DEPLOYED`.**",
              f"- [x] Final documentation-complete PR head `{FINAL}` passed all 18 attached workflows, including Release Candidate Matrix `34641160654`; issue #184 / PR #185 record the non-self-referential final-head evidence.\n- [x] PR #185 squash-merged to `main` as `{MERGE}`. Exact merged-main Release Candidate Matrix `{MAIN_MATRIX}` passed all 23 exact-SHA child workflows and uploaded manifest artifact `{MAIN_ARTIFACT}` (`{MAIN_DIGEST}`).\n- [ ] Production deployment remains separately explicit and automatic Git → Vercel deployment stays disabled.\n\n**Phase 23 status: `IMPLEMENTATION VERIFIED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED`.**"
          )

          replace_once(
              "docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md",
              "**Status:** IMPLEMENTATION VERIFIED / MERGE ACCEPTANCE PENDING / MERGE NOT AUTHORIZED",
              "**Status:** COMPLETE / VERIFIED / MERGED / NOT DEPLOYED"
          )
          replace_once(
              "docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md",
              "Implementation is therefore verified; merge and deployment remain separately unauthorized. The documentation-finalized branch head must itself pass the Release Candidate Matrix before merge acceptance, with that final-head run recorded on issue #184 / PR #185 rather than forcing an infinite documentation-only verification loop.",
              f"Final documentation-complete PR head `{FINAL}` passed all 18 attached workflows, including Release Candidate Matrix `34641160654`. PR #185 then squash-merged to `main` as `{MERGE}`. Exact merged-main Release Candidate Matrix `{MAIN_MATRIX}` passed all 23 exact-SHA child workflows and uploaded manifest artifact `{MAIN_ARTIFACT}` (`{MAIN_DIGEST}`). Phase 23 is therefore complete, verified and merged. Production deployment remains separately unauthorized and automatic Git → Vercel deployment remains disabled."
          )

          replace_once(
              "docs/ui/UI_DECISIONS.md",
              "Merge to `main` and production deployment remain separately explicit.",
              f"PR #185 squash-merged to `main` as `{MERGE}` after final exact PR head `{FINAL}` passed all attached workflows; exact merged-main Release Candidate Matrix `{MAIN_MATRIX}` then passed all 23 child workflows with manifest artifact `{MAIN_ARTIFACT}` (`{MAIN_DIGEST}`). Production deployment remains separately explicit."
          )

          replace_once(
              "docs/ui/SCREEN_REGISTRY.md",
              "**Phase 23 design authority:** `design/rd/create-usability-first-v05.md`, `docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md`; draft PR #185 is a verified pre-merge production candidate and is not yet the `main`/production surface.",
              f"**Phase 23 design authority:** `design/rd/create-usability-first-v05.md`, `docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md`; PR #185 is merged to `main` as `{MERGE}` and Clear Composer is now the repository-authoritative Create surface. Production remains on the prior deployed source until a separately authorized rollout."
          )
          replace_once(
              "docs/ui/SCREEN_REGISTRY.md",
              "Draft PR #185 remains pre-merge; current `main` Create remains production authority until an explicitly authorized merge.",
              f"PR #185 squash-merged as `{MERGE}` from final exact head `{FINAL}`; merged-main Release Candidate Matrix `{MAIN_MATRIX}` passed all 23 exact-SHA children. Repository `main` now carries Clear Composer, while production remains on the prior deployed source until an explicitly authorized rollout."
          )

          replace_once(
              "docs/ui/COMPONENT_CATALOG.md",
              "No new reusable primitive, architecture boundary or animation runtime was introduced; merge remains separately explicit.",
              f"No new reusable primitive, architecture boundary or animation runtime was introduced. PR #185 squash-merged to `main` as `{MERGE}` from final exact head `{FINAL}`, and merged-main Release Candidate Matrix `{MAIN_MATRIX}` passed all 23 exact-SHA children; production deployment remains separately explicit."
          )
          PY

          rm .github/workflows/phase23-closure-finalizer.yml
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              "PROJECT.md",
              "docs/ui/UI_MIGRATION.md",
              "docs/ui/UI_DECISIONS.md",
              "docs/ui/SCREEN_REGISTRY.md",
              "docs/ui/COMPONENT_CATALOG.md",
              "docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md",
              ".github/workflows/phase23-closure-finalizer.yml",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          unexpected = changed - allowed
          required = allowed - {".github/workflows/phase23-closure-finalizer.yml"}
          missing = required - changed
          if unexpected or missing:
              raise SystemExit(f"unexpected={sorted(unexpected)} missing={sorted(missing)} changed={sorted(changed)}")
          PY

      - name: Commit closure documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md docs/ui/COMPONENT_CATALOG.md docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md .github/workflows/phase23-closure-finalizer.yml
          git commit -m "docs: close Phase 23 after verified merge"
          git push origin HEAD:docs/phase-23-closure

name: Phase 12 contract finalizer

on:
  push:
    branches: [plan/phase-12-release-validation]
    paths:
      - .github/workflows/tmp-phase12-contract.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/phase-12-release-validation
          fetch-depth: 0
      - name: Apply contract patch
        run: python scripts/tmp-phase12-contract.py
      - name: Validate and commit
        shell: bash
        run: |
          rm scripts/tmp-phase12-contract.py
          rm .github/workflows/tmp-phase12-contract.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-phase12-contract.yml PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_MIGRATION.md scripts/tmp-phase12-contract.py | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: expand Phase 12 release validation contract"
          git push origin HEAD:plan/phase-12-release-validation

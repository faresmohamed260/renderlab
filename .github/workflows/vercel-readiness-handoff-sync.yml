name: Vercel Readiness Handoff Sync

on:
  push:
    branches:
      - work/deployment-readiness-v0-1

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Apply Vercel readiness handoff sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deployment-readiness-v0-1
          fetch-depth: 0
      - run: node scripts/sync-vercel-readiness-handoff.mjs
      - run: git diff --check
      - name: Commit handoff and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md docs/architecture/FRONTEND_ARCHITECTURE.md
          git rm scripts/sync-vercel-readiness-handoff.mjs .github/workflows/vercel-readiness-handoff-sync.yml
          git commit -m "Document Vercel environment preflight"
          git push origin HEAD:work/deployment-readiness-v0-1

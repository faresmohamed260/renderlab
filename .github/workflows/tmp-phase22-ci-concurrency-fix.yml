name: Temporary Phase 22 Handoff Docs

on:
  push:
    branches:
      - tmp/phase22-ci-concurrency-fix-20260909

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout executor
        uses: actions/checkout@v4
        with:
          path: executor
          fetch-depth: 0

      - name: Checkout exact Phase 22 head
        uses: actions/checkout@v4
        with:
          ref: 287a3e26eda039cb034492cd8dc872e7731fcd01
          path: target
          fetch-depth: 0

      - name: Patch authoritative handoff docs
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "287a3e26eda039cb034492cd8dc872e7731fcd01"
          python ../executor/scripts/tmp-phase22-handoff-docs.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'PROJECT.md' 'docs/ui/UI_MIGRATION.md' 'docs/ui/UI_DECISIONS.md' 'docs/architecture/INFRASTRUCTURE.md' | sort)"
          test "$changed" = "$expected"

      - name: Commit handoff docs
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RenderLab Handoff Docs"
          git config user.email "renderlab-handoff@users.noreply.github.com"
          git checkout -B work/phase-22-system-cohesion
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/INFRASTRUCTURE.md
          git commit -m "Document Phase 22 exact-head handoff"
          git push origin HEAD:refs/heads/work/phase-22-system-cohesion

name: Temporary Phase 22 CI Concurrency Fix

on:
  push:
    branches:
      - tmp/phase22-ci-concurrency-fix-20260909

permissions:
  contents: write

jobs:
  stage-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REF: work/phase-22-system-cohesion
      EXPECTED_SHA: c522cdc57ebbfcb41f542a10da401ec2317a7f71
      RESULT_REF: tmp/phase22-ci-concurrency-fix-result
    steps:
      - name: Checkout executor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage jq quoting correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_REF"
          actual="$(git rev-parse "origin/$TARGET_REF")"
          test "$actual" = "$EXPECTED_SHA"
          git checkout --detach "$actual"

          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/generation-admission.yml'),
              Path('.github/workflows/release-candidate-matrix.yml'),
          ]
          old = "'.conclusion // \\\"\\\"'"
          new = "'.conclusion // \"\"'"
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one over-escaped jq filter, found {count}')
              path.write_text(text.replace(old, new, 1))
              total += count
          if total != 2:
              raise SystemExit(f'expected two corrections, found {total}')
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/generation-admission.yml' '.github/workflows/release-candidate-matrix.yml' | sort)"
          test "$changed" = "$expected"

          git config user.name "RenderLab CI Stager"
          git config user.email "renderlab-ci-stager@users.noreply.github.com"
          git add .github/workflows/generation-admission.yml .github/workflows/release-candidate-matrix.yml
          git commit -m "Fix admission wait jq quoting"
          git push --force origin "HEAD:refs/heads/$RESULT_REF"

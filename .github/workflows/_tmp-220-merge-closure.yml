name: "Temporary #220 merge closure docs"

on:
  push:
    branches:
      - docs/220-merge-closure
    paths:
      - .github/workflows/_tmp-220-merge-closure.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/220-merge-closure
      - name: Synchronize authoritative #220 closure docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          MERGE = "ec29fd160d7ce7a90beb3025da32ec4cc18f0898"
          FINAL = "e6045a28462ed40859a656c49f73b1772e9e4700"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "PROJECT.md",
              "- Workstream #220 Product preferences initial Create-default slice is **IMPLEMENTED / EXACT-HEAD VERIFIED / RENDERED-EVIDENCE REVIEWED / MERGE PENDING / NOT DEPLOYED** in PR #275 at implementation-verification head `f01399bac0a50fef82ac55cf2c9a088c18443415`. It adds owner-scoped durable defaults for Create mode, Image aspect ratio, Video resolution, Video duration and Video audio; clean new drafts consume them server-side while saved recipes and media continuations keep precedence, stale values fail soft to current capability truth, and Reset removes the row so future product defaults remain authoritative.",
              "- Workstream #220 Product preferences initial Create-default slice is **COMPLETE / VERIFIED / MERGED / MERGED-MAIN VERIFIED / RENDERED-EVIDENCE REVIEWED / NOT DEPLOYED**. PR #275 squash-merged to `main` as `" + MERGE + "` after documentation-complete head `" + FINAL + "` passed all 16 attached exact-head workflows. It adds owner-scoped durable defaults for Create mode, Image aspect ratio, Video resolution, Video duration and Video audio; clean new drafts consume them server-side while saved recipes and media continuations keep precedence, stale values fail soft to current capability truth, and Reset removes the row so future product defaults remain authoritative. All 10 workflows GitHub attached to merged `main` `" + MERGE + "` passed, including Account Data Lifecycle `35148209427` and Video Generation Integration `35148209254`; issue #220 is closed as completed."
          )
          replace_once(
              "PROJECT.md",
              "- Shared-project migration `0023_renderlab_account_preferences.sql` is applied as `20260916150243 renderlab_account_preferences`; the table is RLS-enabled with no `anon`/`authenticated` DML and service-role application access only. Account export is schema v3 and preference state joins #219 deletion/residue/non-interference. All 16 workflows attached to `f01399bac0a50fef82ac55cf2c9a088c18443415` passed, including Account Profile Credential `35138292468`, Account Data Lifecycle `35138293298`, and Email Identity Change `35138292829` after the hosted Supabase email-change cooldown cleared. Dedicated #220 artifact `10463549435` (`sha256:8751ce800695841d94668653fa3c02eb065fa56c52ba8161d18771c7e107954e`) was reviewed clean across desktop Settings, 390px reduced-motion Settings and mobile Create evidence. Optional product notifications and an app-level accessibility override remain deliberately deferred; production is unchanged.",
              "- Shared-project migration `0023_renderlab_account_preferences.sql` is applied as `20260916150243 renderlab_account_preferences`; the table is RLS-enabled with no `anon`/`authenticated` DML and service-role application access only. Account export is schema v3 and preference state joins #219 deletion/residue/non-interference. Implementation-verification head `f01399bac0a50fef82ac55cf2c9a088c18443415` passed all 16 attached workflows, including Account Profile Credential `35138292468`, Account Data Lifecycle `35138293298`, and Email Identity Change `35138292829` after the hosted Supabase email-change cooldown cleared. Dedicated #220 artifact `10463549435` (`sha256:8751ce800695841d94668653fa3c02eb065fa56c52ba8161d18771c7e107954e`) was reviewed clean across desktop Settings, 390px reduced-motion Settings and mobile Create evidence. Optional product notifications and an app-level accessibility override remain deliberately deferred; production remains unchanged on exact source `d18ef8833d46c812dac6b43572b3f4f7069990f8`."
          )

          replace_once(
              "docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md",
              "**Status:** ACCEPTED ACTIVE ROADMAP / #215 + #216 + #217 + #218 + #219 PRODUCTION-LIVE / #223 COMPLETE + VERIFIED + MERGED + MERGED-MAIN VERIFIED / NOT DEPLOYED / #220 INITIAL CREATE-DEFAULT SLICE IMPLEMENTED + EXACT-HEAD VERIFIED / MERGE PENDING / NOT DEPLOYED / #220 FOLLOW-ONS DEFERRED / #221 RESEARCH",
              "**Status:** ACCEPTED ACTIVE ROADMAP / #215 + #216 + #217 + #218 + #219 PRODUCTION-LIVE / #223 COMPLETE + VERIFIED + MERGED + MERGED-MAIN VERIFIED / NOT DEPLOYED / #220 INITIAL CREATE-DEFAULT SLICE COMPLETE + VERIFIED + MERGED + MERGED-MAIN VERIFIED / NOT DEPLOYED / #220 FOLLOW-ONS DEFERRED / #221 RESEARCH"
          )
          replace_once(
              "docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md",
              "**Current execution:** #216 Session Controls, #217 MFA/privileged step-up, #218 secure sign-in-email change, and #219 Data & Privacy lifecycle are production-live from exact source `d18ef8833d46c812dac6b43572b3f4f7069990f8`. #223 is complete/merged/merged-main verified through PR #271 / `7519eb1a6367633bf244a9ed7474f374b9ffc6ca` and remains not production-deployed. #220's initial durable Create-default slice is implemented in PR #275 at implementation-verification head `f01399bac0a50fef82ac55cf2c9a088c18443415`; migration `0023_renderlab_account_preferences.sql` is applied as `20260916150243 renderlab_account_preferences`, all 16 attached workflows passed, and dedicated rendered evidence was reviewed clean. Product-notification controls and an app-level accessibility override remain deferred until their backing product systems exist and a separate amendment is merged. #221 remains research. Production remains on the 2026-09-15 release.",
              "**Current execution:** #216 Session Controls, #217 MFA/privileged step-up, #218 secure sign-in-email change, and #219 Data & Privacy lifecycle are production-live from exact source `d18ef8833d46c812dac6b43572b3f4f7069990f8`. #223 is complete/merged/merged-main verified through PR #271 / `7519eb1a6367633bf244a9ed7474f374b9ffc6ca` and remains not production-deployed. #220's initial durable Create-default slice is complete/merged/merged-main verified through PR #275 / `" + MERGE + "`; final PR head `" + FINAL + "` passed all 16 attached workflows and all 10 merged-main workflows passed, while dedicated rendered evidence was reviewed clean. Migration `0023_renderlab_account_preferences.sql` remains applied as `20260916150243 renderlab_account_preferences`. Issue #220 is closed as completed. Product-notification controls and an app-level accessibility override remain deferred until their backing product systems exist and a separate amendment is merged. #221 remains research. Production remains on the 2026-09-15 release."
          )

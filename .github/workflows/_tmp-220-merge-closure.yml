          )
          PY
          git diff --check
          rm .github/workflows/_tmp-220-merge-closure.yml
          git add PROJECT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md docs/ui/UI_MIGRATION.md docs/architecture/PRODUCT_PREFERENCES_NOTIFICATIONS_IMPLEMENTATION_CONTRACT.md .github/workflows/_tmp-220-merge-closure.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

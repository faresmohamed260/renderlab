name: Governance Checkpoint 1 Apply v3

on:
  push:
    branches:
      - docs/governance-hardening-checkpoint-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Apply indentation-safe corrected patch
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/governance-checkpoint-1-apply.yml').read_text()
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          raw_script = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw_script.splitlines()) + '\n'

          target = '"At Phase 28 closure, production remained unchanged pending separate authorization; the current production state is recorded above."'
          if script.count(target) != 1:
              raise SystemExit(f"expected one Phase 28 replacement target, found {script.count(target)}")
          target_pos = script.index(target)
          tuple_start = script.rfind('    (\n', 0, target_pos)
          tuple_end = script.find('    ),\n', target_pos)
          if tuple_start < 0 or tuple_end < 0:
              raise SystemExit('could not locate Phase 28 replacement tuple boundaries')
          tuple_end += len('    ),\n')
          script = script[:tuple_start] + script[tuple_end:]

          exec(compile(script, 'checkpoint-1-patch.py', 'exec'), {})
          PY

      - name: Review diff and remove temporary helpers
        run: |
          set -euo pipefail
          cd repo
          git diff --check
          git diff --stat
          rm .github/workflows/governance-checkpoint-1-apply.yml
          rm .github/workflows/governance-checkpoint-1-apply-v2.yml
          rm .github/workflows/governance-checkpoint-1-apply-v3.yml
          git status --short

      - name: Commit checkpoint changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/UI_MIGRATION.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md docs/ui/DESIGN_WORKFLOW.md docs/ui/VISUAL_NORTH_STAR.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md .github/workflows/governance-checkpoint-1-apply.yml .github/workflows/governance-checkpoint-1-apply-v2.yml .github/workflows/governance-checkpoint-1-apply-v3.yml
          git commit -m "docs: stop stale current-state contradictions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

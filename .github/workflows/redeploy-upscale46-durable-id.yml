name: Redeploy RenderLab Upscale 46 Durable Identity

on:
  push:
    branches:
      - ops/modal-credential-readiness-20260913
    paths:
      - ".github/workflows/redeploy-upscale46-durable-id.yml"

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - name: Checkout authorization manifest
        uses: actions/checkout@v4
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: ops/flux-primary-recovery-20260913
          path: recovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify worker source contract
        run: python recovery/workers/image-upscale/verify_worker.py
      - name: Install exact Modal CLI
        run: python -m pip install --quiet "modal==1.4.2"
      - name: Redeploy current Upscale app on owned modal-46
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads(Path('config/modal-project-ownership.json').read_text(encoding='utf-8'))
          label = 'modal-46'
          expected = ['modal-01','modal-02','modal-42','modal-43','modal-44','modal-45','modal-46','modal-47']
          if manifest.get('project') != 'renderlab' or manifest.get('ownedAccountLabels') != expected or label not in manifest.get('ownedAccountLabels', []):
              raise SystemExit('modal-46 is not authorized by the exact RenderLab ownership manifest')
          source = Path('recovery/workers/image-upscale/modal_app.py').read_text(encoding='utf-8')
          if 'WORKER_ID = os.environ.get("RENDERLAB_UPSCALE_WORKER_ID", "renderlab-upscale-01")' not in source:
              raise SystemExit('durable Upscale worker identity is not present in deployment source')
          payload = json.loads(os.environ['SAGA_MODAL_TOKENS_JSON'])
          rows = payload.get('accounts') if isinstance(payload, dict) else payload
          row = next((r for r in rows if isinstance(r, dict) and str(r.get('label') or r.get('name') or r.get('account') or '').strip() == label), None)
          if not row:
              raise SystemExit('modal-46 credential is unavailable')
          token_id = str(row.get('token_id') or '').strip()
          token_secret = str(row.get('token_secret') or '').strip()
          combined = str(row.get('api_key') or row.get('token') or '').strip()
          if (not token_id or not token_secret) and '.' in combined:
              token_id, token_secret = combined.split('.', 1)
          if not token_id or not token_secret:
              raise SystemExit('modal-46 credential is incomplete')
          print(f'::add-mask::{token_id}')
          print(f'::add-mask::{token_secret}')
          env = dict(os.environ, MODAL_TOKEN_ID=token_id, MODAL_TOKEN_SECRET=token_secret)
          subprocess.run(['modal','deploy','recovery/workers/image-upscale/modal_app.py'], env=env, check=True, timeout=1500)
          PY
      - name: Verify durable identity at public endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://dreadcipher67--renderlab-image-upscale-web.modal.run'
          for i in {1..36}; do
            code=$(curl --silent --show-error --max-time 20 -o /tmp/health.json -w '%{http_code}' "$url/health" || true)
            if [ "$code" = "200" ]; then
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if (health.ready !== true || health.worker_id !== 'renderlab-upscale-01' || health.ecosystem !== 'image-upscale-v1') {
            throw new Error(`Recovered Upscale identity mismatch: ${JSON.stringify({ready:health.ready,worker_id:health.worker_id,ecosystem:health.ecosystem})}`);
          }
          console.log(JSON.stringify({ready:health.ready,worker_id:health.worker_id,ecosystem:health.ecosystem}));
          NODE
              exit 0
            fi
            sleep 5
          done
          echo '::error::Recovered Upscale endpoint did not expose the durable worker identity.'
          exit 1

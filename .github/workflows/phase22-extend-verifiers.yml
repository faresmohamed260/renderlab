name: Phase 22 verifier coverage apply

on:
  push:
    branches:
      - work/phase-22-system-cohesion
    paths:
      - ".github/workflows/phase22-extend-verifiers.yml"

permissions:
  contents: write

concurrency:
  group: renderlab-phase22-verifier-coverage
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 22 branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-22-system-cohesion
          fetch-depth: 0

      - name: Validate and apply guarded verifier patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/phase22-extend-verifiers.py
          rm -rf scripts/__pycache__
          python scripts/phase22-extend-verifiers.py

      - name: Restore staging files
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- scripts/phase22-extend-verifiers.py .github/workflows/phase22-extend-verifiers.yml
          rm -rf scripts/__pycache__

      - name: Validate verifier-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check scripts/verify-activity.mjs
          node --check scripts/verify-account-identity.mjs
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/verify-account-identity.mjs scripts/verify-activity.mjs | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected Phase 22 verifier patch paths"
            printf 'Actual:\n%s\nExpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi

      - name: Commit and push verifier coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-activity.mjs scripts/verify-account-identity.mjs
          git commit -m "Extend Phase 22 responsive verifier evidence"
          git push origin HEAD:work/phase-22-system-cohesion

name: Phase 12 Retry verifier formatting fix

on:
  push:
    branches: [work/phase-12-release-validation]
    paths:
      - ".github/workflows/tmp-phase12-retry-format-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-12-release-validation
          fetch-depth: 0
      - name: Normalize Retry assertion indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-release-integrated.mjs')
          text = path.read_text()
          old = '''  const retryActivityRows = page.getByText(retryPrompt, { exact: true });
          await retryActivityRows.first().waitFor({ state: "visible", timeout: 30_000 });
          assert(
            await retryActivityRows.count() === 2,
            "Activity did not preserve the failed history alongside the succeeded Retry.",
          );'''
          old_misaligned = '''  const retryActivityRows = page.getByText(retryPrompt, { exact: true });
          await retryActivityRows.first().waitFor({ state: "visible", timeout: 30_000 });
          assert(
            await retryActivityRows.count() === 2,
            "Activity did not preserve the failed history alongside the succeeded Retry.",
          );'''
          # The YAML block removes its own common indentation; normalize by locating the semantic block line-by-line.
          lines = text.splitlines()
          start = lines.index('  const retryActivityRows = page.getByText(retryPrompt, { exact: true });')
          replacement = [
              '  const retryActivityRows = page.getByText(retryPrompt, { exact: true });',
              '  await retryActivityRows.first().waitFor({ state: "visible", timeout: 30_000 });',
              '  assert(',
              '    await retryActivityRows.count() === 2,',
              '    "Activity did not preserve the failed history alongside the succeeded Retry.",',
              '  );',
          ]
          lines[start:start + 6] = replacement
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit formatting correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-phase12-retry-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-release-integrated.mjs .github/workflows/tmp-phase12-retry-format-fix.yml
          git diff --cached --check
          git commit -m 'test: normalize Phase 12 Retry history assertion'
          git push origin HEAD:work/phase-12-release-validation

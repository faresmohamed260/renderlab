name: Create Lifecycle Visual

on:
  pull_request:
    paths:
      - "src/features/create/**"
      - "src/app/(app)/create/**"
      - "src/app/(app)/layout.tsx"
      - "src/components/shell/**"
      - "src/components/brand/**"
      - "src/components/ui/**"
      - "src/lib/utils.ts"
      - "src/lib/supabase/**"
      - "src/app/api/generation/**"
      - "src/server/generation/**"
      - "src/server/media/**"
      - "supabase/migrations/0004_core_account_ownership_prepare.sql"
      - "supabase/migrations/0005_core_account_ownership_enforce.sql"
      - "supabase/migrations/0012_renderlab_generation_admission.sql"
      - "components.json"
      - "package.json"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-create-lifecycle.mjs"
      - ".github/workflows/create-lifecycle-visual.yml"
      - ".github/actions/setup-node-project/action.yml"
      - "scripts/start-ci-app.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node project
        uses: ./.github/actions/setup-node-project

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: >-
          node scripts/start-ci-app.mjs
          --port 3000
          --health-url http://127.0.0.1:3000/
          --log-file "$RUNNER_TEMP/renderlab-next.log"
          --pid-file "$RUNNER_TEMP/renderlab-next.pid"
          --timeout-ms 60000

      - name: Render configured Create lifecycle
        run: node scripts/verify-create-lifecycle.mjs

      - name: Cleanup lifecycle fixture
        if: always()
        run: node scripts/verify-create-lifecycle.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/renderlab-next.log" || true

      - name: Upload lifecycle screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderlab-create-lifecycle-screenshots
          path: artifacts/create-lifecycle-*.png
          if-no-files-found: warn
          retention-days: 14

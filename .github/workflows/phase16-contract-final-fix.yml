name: Phase 16 Contract Final Fix

on:
  push:
    branches: [noop]
    paths:
      - ".github/workflows/phase16-contract-final-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0

      - name: Correct Project handoff
        shell: bash
        env:
          EXPECTED_HEAD: e42a6257b89825495293e61cb5e24b2c382fe0c8
          TARGET_BRANCH: plan/phase-16-creative-iteration-contract
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python <<'PY'
          from pathlib import Path
          path = Path('PROJECT.md')
          text = path.read_text()
          old = 'Phase 16 remains roadmap-only. The next substantial product-planning task is to expand Creative Iteration into an execution-ready contract from current `main` before implementation begins.'
          new = 'Phase 16 planning is now captured by the accepted execution contract below. Implementation has not started, and the contract itself does not authorize production deployment or scheduler activation.'
          if text.count(old) != 1:
              raise SystemExit('Expected pre-contract Phase 16 handoff sentence not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md
          git commit -m "Clarify Phase 16 project handoff"
          git push origin HEAD:"$TARGET_BRANCH"

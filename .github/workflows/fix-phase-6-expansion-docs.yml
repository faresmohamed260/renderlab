name: Fix Phase 6 expansion docs

on:
  push:
    branches:
      - docs/phase-6-expansion

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Fix Phase 6 expansion docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-6-expansion
          fetch-depth: 0
      - name: Fix documentation review findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ui/UI_MIGRATION.md')
          text = path.read_text()
          text = text.replace('docs/architecture/PRODUCT_CAPABILIES.md', 'docs/architecture/PRODUCT_CAPABILITIES.md')
          text = text.replace('explicitly authorizes the audit.\n### Phase 7', 'explicitly authorizes the audit.\n\n### Phase 7')
          path.write_text(text)
          PY
          git config user.name "RenderLab Docs Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git rm .github/workflows/fix-phase-6-expansion-docs.yml
          git add docs/ui/UI_MIGRATION.md
          git diff --cached --check
          git commit -m "Polish Phase 6 planning contract"
          git push origin HEAD:docs/phase-6-expansion

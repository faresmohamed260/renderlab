name: ENT-009 Branch Preflight

on:
  push:
    branches: [work/ent-009-coverage-visibility]
    paths:
      - ".github/workflows/ent009-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Coverage command
        run: npm run test:unit:coverage

      - name: Coverage integrity verifier
        run: npm run verify:unit-coverage

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Engineering Quality
        run: npm run verify:engineering-quality

      - name: Production build
        run: npm run build

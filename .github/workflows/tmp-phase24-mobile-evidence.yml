name: Apply settled mobile Gallery Rail evidence

on:
  push:
    branches:
      - work/phase-24-library-gallery-rail
    paths:
      - .github/workflows/tmp-phase24-mobile-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-24-library-gallery-rail
          fetch-depth: 0

      - name: Tighten mobile settled-state evidence
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const p="scripts/verify-library-history.mjs"; let t=fs.readFileSync(p,"utf8"); const old="  await mobileSelect.click();\n  const mobileCheckbox = page.getByRole(\"checkbox\").first();\n"; const neu="  await mobileSelect.click();\n  await page.waitForTimeout(360);\n  const mobileRailSettled = await page.evaluate(() => {\n    const rail = document.querySelector(\"[data-library-gallery-rail=\\\"true\\\"]\");\n    const defaults = rail?.querySelector(\"[data-library-default-controls=\\\"true\\\"]\");\n    const selection = rail?.querySelector(\"[data-library-selection-mode=\\\"true\\\"]\");\n    if (!defaults || !selection) return null;\n    const defaultStyle = getComputedStyle(defaults);\n    const selectionStyle = getComputedStyle(selection);\n    return {\n      defaultVisibility: defaultStyle.visibility,\n      defaultOpacity: Number.parseFloat(defaultStyle.opacity),\n      selectionVisibility: selectionStyle.visibility,\n      selectionOpacity: Number.parseFloat(selectionStyle.opacity),\n    };\n  });\n  assert(\n    mobileRailSettled\n      && mobileRailSettled.defaultVisibility === `hidden`\n      && mobileRailSettled.defaultOpacity < 0.01\n      && mobileRailSettled.selectionVisibility === `visible`\n      && mobileRailSettled.selectionOpacity > 0.99,\n    `Library mobile selection rail did not settle cleanly: ${JSON.stringify(mobileRailSettled)}`,\n  );\n  const mobileCheckbox = page.getByRole(\"checkbox\").first();\n"; if(t.split(old).length!==2) throw new Error("mobile selection evidence marker missing or ambiguous"); fs.writeFileSync(p,t.replace(old,neu));'
          node --check scripts/verify-library-history.mjs
          git diff --check

      - name: Commit verifier correction and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase24-mobile-evidence.yml
          git add scripts/verify-library-history.mjs
          git commit -m "Verify settled mobile Gallery Rail selection"
          git push origin HEAD:work/phase-24-library-gallery-rail

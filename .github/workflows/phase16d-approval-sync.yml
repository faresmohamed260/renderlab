name: Phase 16D Approval Sync

on:
  push:
    branches: [noop]
    paths:
      - ".github/phase16d-approval.py"
      - ".github/workflows/phase16d-approval-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: work/phase-16-creative-iteration
      EXPECTED_HEAD: 6dadc9e1976b976ab4584ce830286ba3a8baead1
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0
      - name: Preserve patch helper
        run: cp .github/phase16d-approval.py /tmp/phase16d-approval.py
      - name: Record approved Phase 16D checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python /tmp/phase16d-approval.py
          git diff --check
          grep -Fq 'PHASE 16A/16B/16C IMPLEMENTED / VERIFIED; PHASE 16D DESIGN APPROVED / IMPLEMENTATION PENDING' PROJECT.md
          grep -Fq '16D visual design checkpoint' docs/ui/UI_MIGRATION.md
          grep -Fq 'Compare source design approved / implementation pending' docs/ui/SCREEN_REGISTRY.md
          grep -Fq 'Phase 16D desktop+narrow comparison checkpoint was user-approved' docs/ui/UI_DECISIONS.md
          grep -Fq 'REVIEWED DESIGN CANDIDATE / APPROVED DIRECTION / IMPLEMENTATION PENDING' design/penpot/media-viewer-v0.2-compare-source.md
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md design/penpot/README.md design/penpot/media-viewer-v0.2-compare-source.md
          git commit -m "Record approved Phase 16D Viewer compare direction"
          git push origin HEAD:"$TARGET_BRANCH"

name: Documentation Governance

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/governance/**"
      - "docs/production/current.json"
      - "package.json"
      - "scripts/lib/docs-governance.mjs"
      - "scripts/lib/production-documentation-sync.mjs"
      - "scripts/verify-docs-governance.mjs"
      - ".github/workflows/docs-governance.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "docs/governance/**"
      - "docs/production/current.json"
      - "package.json"
      - "scripts/lib/docs-governance.mjs"
      - "scripts/lib/production-documentation-sync.mjs"
      - "scripts/verify-docs-governance.mjs"
      - ".github/workflows/docs-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-docs-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify documentation governance
        run: npm run verify:docs-governance

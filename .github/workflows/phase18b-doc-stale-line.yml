name: Phase 18B Project Status Fix

on:
  push:
    branches:
      - work/phase-18-image-upscale
    paths:
      - .github/workflows/phase18b-doc-stale-line.yml

permissions:
  contents: write

jobs:
  patch-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-18-image-upscale
          fetch-depth: 0
      - name: Fix stale Phase 18 transition and self-remove
        shell: python
        run: |
          from pathlib import Path
          p = Path('PROJECT.md')
          text = p.read_text()
          old = 'That governance step is now complete: read-only worker audit `33995223659` selected the accepted Phase 18 Image Upscale v0.1 contract below. Phase 18 implementation remains not started; contract acceptance does not authorize deployment.'
          new = 'That governance step is now complete: read-only worker audit `33995223659` selected the accepted Phase 18 Image Upscale v0.1 contract below. Phase 18 implementation is now in progress: 18A is complete/live-verified, 18B is complete/verified, and 18C is next. These milestones do not authorize production application deployment or later Phase 18 slices.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Phase 18 transition, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/phase18b-doc-stale-line.yml').unlink()
      - name: Commit status correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct Phase 18 project status"
          git push origin HEAD:work/phase-18-image-upscale

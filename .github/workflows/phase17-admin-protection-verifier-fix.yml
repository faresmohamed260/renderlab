name: Phase 17 Admin protection verifier fix

on:
  push:
    branches: [work/phase-17-observability-quality]
    paths:
      - ".github/workflows/phase17-admin-protection-verifier-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-17-observability-quality
          fetch-depth: 0

      - name: Patch deterministic Admin protection expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/verify-admin-operations.mjs")
          text = path.read_text()
          old_snapshot = '''  assert(!accountJson.includes(outsider.email), "Admin account list leaked an Auth-only email without RenderLab access.");\n\n  const healthResponse ='''
          new_snapshot = '''  assert(!accountJson.includes(outsider.email), "Admin account list leaked an Auth-only email without RenderLab access.");\n  const activeAdminCountBeforePromote = Array.isArray(adminAccountsPayload?.accounts)\n    ? adminAccountsPayload.accounts.filter((account) => account?.role === "admin" && account?.status === "active").length\n    : 0;\n  assert(activeAdminCountBeforePromote >= 1, "Admin account list did not include the active fixture admin.");\n\n  const healthResponse ='''
          old_protection = '''  const lastAdminPayload = await json(lastAdmin);\n  assert(lastAdminPayload?.error?.code === "last_active_admin", "Last-active-admin protection returned the wrong sanitized code.");'''
          new_protection = '''  const lastAdminPayload = await json(lastAdmin);\n  const expectedProtectionCode = activeAdminCountBeforePromote === 1 ? "last_active_admin" : "self_lockout";\n  assert(\n    lastAdminPayload?.error?.code === expectedProtectionCode,\n    `Admin self-suspension protection expected ${expectedProtectionCode}, got ${JSON.stringify(lastAdminPayload?.error?.code)}.`,\n  );'''
          if text.count(old_snapshot) != 1:
              raise SystemExit(f"expected one Admin account snapshot insertion point, found {text.count(old_snapshot)}")
          if text.count(old_protection) != 1:
              raise SystemExit(f"expected one last-admin assertion, found {text.count(old_protection)}")
          text = text.replace(old_snapshot, new_snapshot, 1).replace(old_protection, new_protection, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify corrected source
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          node --check scripts/verify-admin-operations.mjs

      - name: Commit verifier fix only
        shell: bash
        run: |
          git add scripts/verify-admin-operations.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "scripts/verify-admin-operations.mjs"
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git commit -m "Make Admin protection verifier shared-state aware"
          git push origin HEAD:work/phase-17-observability-quality

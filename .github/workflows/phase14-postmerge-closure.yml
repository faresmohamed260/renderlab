name: Phase 14 Postmerge Documentation Closure

on:
  push:
    branches:
      - docs/phase14-postmerge-closure
    paths:
      - .github/workflows/phase14-postmerge-closure.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/phase14-postmerge-closure
          fetch-depth: 0

      - name: Record verified Phase 14 merge closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path('PROJECT.md')
          text = project.read_text()
          marker = '## Phase 14 Post-Merge Closure — 2026-09-04'
          block = '''## Phase 14 Post-Merge Closure — 2026-09-04
          PR #93 merged Phase 14 to `main` as `abdadf36c52e37756dcb62dd696b97a72448f94b` from exact final PR head `3df73ff212abb6fbf8dd0cd7a85232804dc5e4dd`.

          Merged-main push validation passed all five path-triggered gates: Generation Reconciliation `33904575007`, Reference Upload Integration `33904574913`, Video Generation Integration `33904574912`, Generation Integration `33904575065`, and UI Shell Validation `33904574999`. The configured Image and REDGraft Video/Animate suites completed against real provider infrastructure and their cleanup completed successfully.

          Final shared-resource audit after those runs found zero RenderLab fixture Auth users, jobs, media assets, or generation-admission reservations; zero active reconciliation claims; zero duplicate indexed generation output slots; and generation defaults restored to enabled / 1 active / 12 hourly / `updated_by=null`. The two historical succeeded jobs with one noncanonical extra linked media row each remain deliberately preserved, with exactly two historical `generation_output_index = NULL` extras.

          Production state did not change: `pg_cron` and `pg_net` remain disabled, Vercel recorded zero RenderLab deployments created since the Phase 14 merge, and no production reconciliation schedule/secret was activated. Phase 15 remains the next roadmap phase and must receive its own execution-ready contract before implementation.'''
          if marker not in text:
              project.write_text(text.rstrip() + '\n\n' + block + '\n')

          infra = Path('docs/architecture/INFRASTRUCTURE.md')
          text = infra.read_text()
          marker = '### Phase 14 post-merge closure — 2026-09-04'
          block = '''### Phase 14 post-merge closure — 2026-09-04
          PR #93 merged to `main` as `abdadf36c52e37756dcb62dd696b97a72448f94b` after exact final PR head `3df73ff212abb6fbf8dd0cd7a85232804dc5e4dd` passed its complete ten-workflow pull-request matrix. Merged-main Generation Reconciliation `33904575007`, Reference Upload Integration `33904574913`, Video Generation Integration `33904574912`, Generation Integration `33904575065`, and UI Shell Validation `33904574999` all passed.

          Post-merge shared-state audit returned generation defaults to enabled / 1 active / 12 hourly / no updater, with zero RenderLab fixture Auth users/jobs/assets/admission reservations, zero active reconciliation claims and zero duplicate indexed output slots. The two historical multi-linked succeeded jobs and their two null-index noncanonical extras remain unchanged by design.

          Scheduler/deployment boundary is unchanged: `pg_cron` and `pg_net` are still not enabled, no reconciliation schedule or production scheduler secret was activated, and Vercel reported zero RenderLab deployments created since the merge. Phase 14 therefore remains merged and verified but not deployed/production-scheduled; any scheduler activation or application rollout requires separate explicit authorization.'''
          if marker not in text:
              infra.write_text(text.rstrip() + '\n\n' + block + '\n')
          PY

          git diff --check

      - name: Commit source-of-truth closure
        shell: bash
        run: |
          git rm .github/workflows/phase14-postmerge-closure.yml
          git add PROJECT.md docs/architecture/INFRASTRUCTURE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Phase 14 post-merge closure'
          git push origin HEAD:docs/phase14-postmerge-closure

name: Phase 12A Documentation Update

on:
  push:
    branches:
      - work/phase-12a-release-evidence
    paths:
      - ".github/workflows/phase-12a-docs-update.yml"
      - ".github/phase12_docs_update.py"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-12a-release-evidence
          fetch-depth: 0

      - name: Record verified Phase 12A evidence
        run: python .github/phase12_docs_update.py

      - name: Commit authoritative evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git commit -m "docs: record verified Phase 12A release candidate"
          git push origin HEAD:work/phase-12a-release-evidence

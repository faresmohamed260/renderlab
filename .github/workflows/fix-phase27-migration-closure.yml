name: Fix Phase 27 migration closure

on:
  push:
    branches:
      - docs/fix-phase27-migration-closure
    paths:
      - .github/workflows/fix-phase27-migration-closure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-phase27-migration-closure
      - name: Correct stale Phase 27 evidence paragraph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ui/UI_MIGRATION.md')
          text = p.read_text()
          old = "**Phase 27 exact-head verification:** `719b68501c2ceccd1fa91e12910ea7aa9bb04636` passed Account Identity `34768544863`, Account/Admin Operations `34768544852`, Engineering Quality `34768544858`, UI Shell `34768544856`, Brand / Launch `34768544862`, and Integrated Release `34768544855`. Human review accepted the real desktop/390px Trust Register, signed-out form, Active/Suspended access presentation, ordinary password form and verified-recovery form. No horizontal overflow or fixed-header capture contamination remains; reduced-motion narrow captures are complete and screenshots are taken before credential entry. PR #227 is not yet merged, so this is verified-candidate evidence rather than merged closure."
          new = "**Phase 27 closure evidence:** final PR #227 head `d48084fef1255ee672936f6da8905ba95bc678ea` passed Account Identity `34768896748`, Account/Admin Operations `34768896750`, Engineering Quality `34768896758`, UI Shell `34768896773`, Brand / Launch `34768896753`, and Integrated Release `34768896737`. Human review accepted the real desktop/390px Trust Register, signed-out form, Active/Suspended access presentation, ordinary password form and verified-recovery form from unchanged implementation code; final-head Account Identity artifact `10321540973` confirmed the configured flow again. PR #227 merged as `383def35fdf77566696a0c41f88349613029a37a`, and merged-main Engineering Quality `34769204247` plus UI Shell Validation `34769204150` passed."
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale paragraph, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit correction and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-phase27-migration-closure.yml
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: correct Phase 27 migration closure evidence"
          git push origin HEAD:docs/fix-phase27-migration-closure

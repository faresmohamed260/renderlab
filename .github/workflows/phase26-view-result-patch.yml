name: Phase 26 View Result Contrast Patch

on:
  push:
    branches:
      - work/phase-26-activity-job-matrix
    paths:
      - .github/workflows/phase26-view-result-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-26-activity-job-matrix
          fetch-depth: 0
      - name: Fix View result foreground contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/activity/activity-view.tsx')
          text = path.read_text()
          old = 'className="min-h-11 bg-text px-4 text-canvas hover:bg-white hover:text-canvas"'
          new = 'className="min-h-11 bg-[#f1f4f6] px-4 !text-[#070a0e] hover:bg-white hover:!text-[#070a0e]"'
          if old not in text:
              raise SystemExit('View result class target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit contrast fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/activity/activity-view.tsx
          git commit -m 'Fix Activity View result contrast'
          git push origin HEAD:work/phase-26-activity-job-matrix

name: Phase 25 Closure Docs

on:
  push:
    branches:
      - work/phase-25-media-viewer-closure
    paths:
      - .github/workflows/phase25-closure-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-25-media-viewer-closure
          fetch-depth: 0
      - name: Apply verified closure docs
        run: python scripts/phase25-closure-docs.py
      - name: Validate documentation diff
        run: |
          git diff --check
          git diff -- PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/ui/COMPONENT_CATALOG.md docs/ui/UI_DECISIONS.md
      - name: Commit verified closure docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/ui/COMPONENT_CATALOG.md docs/ui/UI_DECISIONS.md
          git commit -m "Record verified Phase 25 closure"
          git push origin HEAD:work/phase-25-media-viewer-closure

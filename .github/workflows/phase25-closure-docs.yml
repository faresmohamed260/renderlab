name: Phase 25 Closure Docs

on:
  push:
    branches:
      - docs/phase-25-handoff-2026-09-13
    paths:
      - .github/workflows/phase25-closure-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-25-handoff-2026-09-13
          fetch-depth: 0
      - name: Update authoritative Phase 25 closure state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path('PROJECT.md')
          text = project.read_text()
          old = '1. **Phase 25 — Media Viewer:** ACTIVE R&D in issue #196. Extend Gallery Rail media-object continuity into a cinematic inspection/continuation workspace while preserving all current Viewer product/security/capability contracts. Viewer remains a 3/4-expressiveness surface.'
          new = '1. **Phase 25 — Media Viewer:** USER-APPROVED / EXACT-HEAD VERIFIED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED. Media Register + Source Fold v0.2 is now the repository-authoritative Viewer composition under UI-076. Viewer remains a 3/4-expressiveness surface.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          marker = '## Current Verified Baseline — 2026-09-12\n'
          checkpoint = '''## Phase 25 Media Viewer Register + Source Fold closure — 2026-09-13\n- User approved **Media Register + Source Fold v0.2** from R&D head `639aef25e57e166be8d8b3d226b3e83930e05a25`; design run `34703774288`, artifact `10300577421`, digest `sha256:06cade2dc2e9ce51dc871971530fa9641a7c1ef0cc0271e19763fcebfa8ca2b0`.\n- UI-076 plus `docs/ui/MEDIA_VIEWER_REGISTER_FOLD_IMPLEMENTATION_CONTRACT.md` were merged before production work in PR #199 as `a5db944acdefad7b9fcbbedd9d6b521b5a28c576`.\n- PR #200 implemented the approved registered media-first Viewer, attached continuation register, local Prompt/Details/Manage disclosures, singular quick/manage action ownership, Result-primary Source Fold, narrow Result→Source stacking, bounded image-only fine-pointer depth, static touch and reduced-motion equivalence while retaining native video and existing continuation/Upscale/security contracts.\n- Definitive exact implementation head `3e468ad0abd4f7b6645e86e298ce53a3a8ecf034` passed the complete affected acceptance set. Dedicated Viewer run `34717466185` produced artifact `10304951419`, digest `sha256:d551006acffa260e8bbd83e25c2b156204a4391f1f9b1abcfc4e58aa0cc28e04`; human review accepted desktop, 390px, disclosures, native video, Result-primary Compare, temporal Source Fold, reversal and reduced-motion fidelity against v0.2.\n- Successful exact-head coverage included Engineering `34717466149`, Ownership `34717466209`, UI Shell `34717466157`, Search `34717466145`, History `34717466189`, Favorites `34717466126`, Collections `34717466254`, Download `34717466273`, Rename `34717466210`, Media Delete `34717466203`, Library Lifecycle `34717466215`, Batch Delete `34717466200`, Creative Iteration `34717466236`, Upscale Viewer `34717466198`, Image Upscale `34717466222`, Brand / Launch unchanged retry `34717466191`, Integrated Release unchanged retry `34717466228`, and Library Drag Drop fresh same-head run `34718085004`.\n- PR #200 merged to `main` as `b672c711f885092c5e92c42824078e7bd5bc691e`. GitHub attached exactly six push workflows to that merge SHA and all six passed: Engineering Quality `34718303036`, UI Shell Validation `34718302987`, Upscale Viewer Visual `34718303044`, Media Viewer Register Fold Visual `34718302986`, Image Upscale Integration `34718302998`, and Creative Iteration `34718303019`.\n- Presentation-only verifier migrations were bounded to UI-076 reality; substantive product/security assertions were preserved. No schema/API/provider/worker/R2/auth/admission/ownership/routing/deployment contract changed.\n- Production remains unchanged at source `0173c4c5ba08360b6352331118abc81978cfa774` / READY deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`; automatic Git → Vercel deployment remains disabled.\n\n**Phase 25 status: `USER-APPROVED / EXACT-HEAD VERIFIED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED`.**\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, checkpoint + marker, 1)
          old_base = '- The verified repository application baseline is Phase 24 / PR #194 merge `af88b93dcb4fcbca502b42f9ea1186192af48a6a`; Gallery Rail v0.3 is user-approved, exact-head verified and merged-main verified. Production remains the separately approved source `0173c4c5ba08360b6352331118abc81978cfa774`; no production deployment followed the Phase 24 repository merge.'
          new_base = '- The verified repository application baseline is Phase 25 / PR #200 merge `b672c711f885092c5e92c42824078e7bd5bc691e`; Media Register + Source Fold v0.2 is user-approved, exact-head verified and merged-main verified. Production remains the separately approved source `0173c4c5ba08360b6352331118abc81978cfa774`; no production deployment followed the Phase 25 repository merge.'
          assert text.count(old_base) == 1
          project.write_text(text.replace(old_base, new_base, 1))

          migration = Path('docs/ui/UI_MIGRATION.md')
          text = migration.read_text()
          old = '- [ ] **Phase 25 Media Viewer redesign — ACTIVE R&D (#196).** Audit current desktop/390px image/video/Compare/Upscale/action states; build interaction references; explore 3+ same-family compositions; prototype signature Library→Viewer / Compare / Viewer→Create continuity; obtain explicit user approval before a production implementation contract.'
          new = '- [x] **Phase 25 Media Viewer redesign — COMPLETE / VERIFIED / MERGED / NOT DEPLOYED.** Media Register + Source Fold v0.2 is user-approved, exact-head verified, merged as `b672c711f885092c5e92c42824078e7bd5bc691e`, and all six workflows attached to merged `main` passed.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          marker = '## Active full-product redesign roadmap — after Phase 24\n'
          checkpoint = '''## Phase 25 — Media Viewer Register + Source Fold closure — 2026-09-13\n**Status: `USER-APPROVED / EXACT-HEAD VERIFIED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED`.**\n\n- [x] R&D issue #196 converged on **Media Register + Source Fold v0.2**; user approval is recorded against exact R&D head `639aef25e57e166be8d8b3d226b3e83930e05a25`, run `34703774288`, artifact `10300577421`, digest `sha256:06cade2dc2e9ce51dc871971530fa9641a7c1ef0cc0271e19763fcebfa8ca2b0`.\n- [x] UI-076 and `docs/ui/MEDIA_VIEWER_REGISTER_FOLD_IMPLEMENTATION_CONTRACT.md` merged first through PR #199 / `a5db944acdefad7b9fcbbedd9d6b521b5a28c576`.\n- [x] Exact implementation head `3e468ad0abd4f7b6645e86e298ce53a3a8ecf034` passed the complete affected acceptance set. Dedicated Viewer evidence run `34717466185` produced artifact `10304951419` (`sha256:d551006acffa260e8bbd83e25c2b156204a4391f1f9b1abcfc4e58aa0cc28e04`) and was human-reviewed faithful to v0.2 across desktop, 390px, image/video, disclosures, temporal Compare, reversal and reduced motion.\n- [x] Presentation verifier corrections remained bounded to UI-076 locators/disclosures/timing evidence; behavior/security assertions were not weakened.\n- [x] PR #200 merged to `main` as `b672c711f885092c5e92c42824078e7bd5bc691e`.\n- [x] All six workflows GitHub actually attached to the merge SHA passed: Engineering `34718303036`, UI Shell `34718302987`, Upscale Viewer `34718303044`, Viewer Register Fold `34718302986`, Image Upscale `34718302998`, Creative Iteration `34718303019`.\n- [x] Production remains unchanged; deployment remains separately explicit and automatic Git → Vercel deployment stays disabled.\n\n'''
          assert text.count(marker) == 1
          migration.write_text(text.replace(marker, checkpoint + marker, 1))

          registry = Path('docs/ui/SCREEN_REGISTRY.md')
          text = registry.read_text()
          old = '**Status:** APPROVED — Media Viewer base + Download + Rename + Favorites + Collections v0.1 / UI-032 + Delete v0.1 / UI-033 + Reuse Settings / Compare source / UI-056 + Image Upscale 2× / UI-058'
          new = '**Status:** APPROVED — UI-076 Media Register + Source Fold v0.2 / Phase 25 merged and merged-main verified, plus existing Viewer behavior contracts'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old_impl = '**Implementation:** `src/features/library/media-viewer.tsx`, `src/features/library/media-viewer-comparison.tsx`, `src/features/library/media-viewer-upscale-action.tsx`'
          new_impl = '**Implementation:** `src/features/library/media-viewer.tsx`, `src/features/library/media-viewer-comparison.tsx`, `src/features/library/media-viewer-register.tsx`, `src/features/library/media-viewer.module.css`, `src/features/library/media-viewer-upscale-action.tsx`'
          assert text.count(old_impl) == 1
          text = text.replace(old_impl, new_impl, 1)
          old_art = '**Design artifacts:** `design/penpot/media-viewer-v0.1.svg`, `design/penpot/media-viewer-v0.2-compare-source.md`'
          new_art = '**Design authority:** historical `design/penpot/media-viewer-v0.1.svg`, `design/penpot/media-viewer-v0.2-compare-source.md`; current UI-076 authority is approved R&D `design/rd/media-viewer-register-fold-v02.md` at `639aef25e57e166be8d8b3d226b3e83930e05a25` plus `docs/ui/MEDIA_VIEWER_REGISTER_FOLD_IMPLEMENTATION_CONTRACT.md`'
          assert text.count(old_art) == 1
          text = text.replace(old_art, new_art, 1)
          marker = '**Approved behavior:**\n'
          checkpoint = '''**UI-076 / Phase 25 closure — 2026-09-13:** The old permanent Viewer sidebar is replaced by the approved Media Register + Source Fold v0.2 system. Quick actions own Favorite/Download; Manage owns Collections/Rename/Delete; Prompt/Details/Manage/Compare stay attached to the local register; Source Fold keeps Result primary, reveals Source horizontally on wide layouts and stacks Result→Source on narrow layouts; native video, continuation, Reuse Settings, Upscale, ownership and durable-media contracts remain intact. Exact implementation head `3e468ad0abd4f7b6645e86e298ce53a3a8ecf034` passed the full affected acceptance set; dedicated Viewer run `34717466185` / artifact `10304951419` (`sha256:d551006acffa260e8bbd83e25c2b156204a4391f1f9b1abcfc4e58aa0cc28e04`) was human-reviewed faithful. PR #200 merged as `b672c711f885092c5e92c42824078e7bd5bc691e`; all six merged-main workflows passed. Production remains unchanged pending separately authorized deployment.\n\n'''
          idx = text.find(marker, text.find('### Media Viewer'))
          assert idx != -1
          text = text[:idx] + checkpoint + text[idx:]
          registry.write_text(text)
          PY
          git diff --check
          git diff -- PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md
      - name: Commit docs and remove helper
        shell: bash
        run: |
          rm .github/workflows/phase25-closure-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md .github/workflows/phase25-closure-docs.yml
          git commit -m "Record Phase 25 Viewer closure"
          git push origin HEAD:docs/phase-25-handoff-2026-09-13

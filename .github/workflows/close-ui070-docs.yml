name: Close UI-070 documentation

on:
  push:
    branches:
      - docs/ui-070-closure

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact merged baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "152e00f5b805bef0299b14635743d6978160700e"
          git merge-base --is-ancestor 152e00f5b805bef0299b14635743d6978160700e HEAD
          test "$(git diff --name-only origin/main...HEAD)" = ".github/workflows/close-ui070-docs.yml"

      - name: Close UI-070 authoritative docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          exec(base64.b64decode(""))
          PY

          rm .github/workflows/close-ui070-docs.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/close-ui070-docs.yml\nPROJECT.md\ndocs/ui/UI_DECISIONS.md\ndocs/ui/UI_MIGRATION.md'

      - name: Commit documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close UI-070 verification"
          git push origin HEAD:docs/ui-070-closure

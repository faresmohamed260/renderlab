name: Close UI-070 documentation

on:
  push:
    branches:
      - docs/ui-070-closure

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact merged baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "152e00f5b805bef0299b14635743d6978160700e"
          test "$(git rev-parse HEAD^)" = "152e00f5b805bef0299b14635743d6978160700e"

      - name: Close UI-070 authoritative docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          repo_merge = "152e00f5b805bef0299b14635743d6978160700e"
          pr_head = "171dd384bd9b18ff82ab0e1dc40d1890e2cd33c1"
          live_source = "0d584c5dab288ad1e99a7b7c1aac2a2ec12bf814"
          live_deploy = "dpl_BpMCWYggKkzf8FuWpb2vLun46r3M"
          artifact_digest = "9d603f1fddbb76f2e25e68fcaf6ae991e700ac0703848d279b72c0c3a7947e06"

          project_path = Path("PROJECT.md")
          project = project_path.read_text()
          old_heading = "## Current Verified Baseline — 2026-09-09"
          if project.count(old_heading) != 1:
              raise SystemExit(f"PROJECT baseline heading count={project.count(old_heading)}")
          project = project.replace(old_heading, "## Current Verified Baseline — 2026-09-10", 1)
          project_pattern = re.compile(
              r"- Repository `main` additionally includes two verified post-production UI corrections not yet deployed:.*?\n"
              r"- UI-070 is a user-authorized post-production Library visual correction currently implemented on the work branch and awaiting exact-head rendered verification:.*?\n"
              r"(?=- UI-054)",
              re.S,
          )
          project_replacement = (
              f"- Repository `main` additionally includes three verified post-production UI corrections not yet deployed: UI-068 / PR #138 merge `c33539ae682d1d1d32cc4c0eb410ec94fd556666` (desktop Create shell/composer focus cleanup); UI-069 / PR #140 merge `c71554b692864c84cd1bc9f796255fdde71eae43` (Create reference drag/drop, Viewer narrow/intermediate containment, Library action alignment and explicit prefetch/pending feedback); and UI-070 / PR #142 merge `{repo_merge}` (compact 22×22 visible Library selection chrome over the maintained 44×44 interaction target plus media-first full-card tiles with a floating metadata shelf). UI-070 exact PR head `{pr_head}` passed all 16 attached workflows, and all three workflows GitHub attached to the merged `main` push passed: Engineering Quality `34418649510`, UI Shell Validation `34418649507`, and Activity Cancel Visual `34418649511`. Live production remains source `{live_source}` at READY deployment `{live_deploy}`.\n"
              f"- UI-070 rendered review accepted desktop and 390px selected-card states from tree-identical Library History artifact `10129703554` (`sha256:{artifact_digest}`); configured History also proved the 44×44 maintained checkbox root, 22×22 visual box and metadata integrated inside the media frame. No Library data, route, selection, media, schema or deployment contract changed.\n"
          )
          project, count = project_pattern.subn(project_replacement, project, count=1)
          if count != 1:
              raise SystemExit(f"PROJECT UI-070 block replacement count={count}")
          project_path.write_text(project)

          migration_path = Path("docs/ui/UI_MIGRATION.md")
          migration = migration_path.read_text()
          migration_pattern = re.compile(r"## Post-production UI-070 Library card polish — 2026-09-10\n\*\*Status:.*\Z", re.S)
          migration_replacement = f'''## Post-production UI-070 Library card polish — 2026-09-10
**Status: `COMPLETE / VERIFIED / MERGED`.**

This is a user-directed post-production Library presentation correction, not Phase 23 / Cycle 5.

- [x] Replace the visually oversized card selection control with a centered 22×22 visible checkbox while retaining the maintained 44×44 Checkbox interaction/focus root and unchanged page-scoped selection semantics.
- [x] Refine Library media cards from a plain media-plus-opaque-footer stack into a media-first full-card tile with a compact floating glass title/kind/date shelf, restrained selected-state accent, and non-overlapping top-right Video identity.
- [x] Preserve the same card Viewer link, media geometry, grid, title/kind/date data, selection lifecycle, server/URL ownership and reduced-motion behavior; add no card quick actions or new dependency.
- [x] Exact final PR head `{pr_head}` passed all 16 workflows GitHub attached, including Library History `34417882145`, Engineering Quality `34417882154`, UI Shell `34417882108`, Library Lifecycle `34417882119` and Library Drag Drop `34417882079`.
- [x] Configured Library History proved the maintained 44×44 checkbox interaction root, 22×22 visible checkbox, integrated metadata geometry and desktop + 390px selected-card states.
- [x] Human rendered review accepted the desktop and 390px selected-card treatment from tree-identical Library History artifact `10129703554` (`sha256:{artifact_digest}`).
- [x] PR #142 guarded squash-merged as `{repo_merge}`. Every workflow GitHub attached to merged `main` passed: Engineering Quality `34418649510`, UI Shell Validation `34418649507` and Activity Cancel Visual `34418649511`.

Live production remains exact source `{live_source}` at READY deployment `{live_deploy}`. UI-068, UI-069 and UI-070 are verified repository changes outside production until a separate explicit rollout is authorized. No Phase 23 / Cycle 5 work is implied.
'''
          migration, count = migration_pattern.subn(migration_replacement, migration, count=1)
          if count != 1:
              raise SystemExit(f"UI_MIGRATION UI-070 replacement count={count}")
          migration_path.write_text(migration)

          decisions_path = Path("docs/ui/UI_DECISIONS.md")
          decisions = decisions_path.read_text()
          decisions_pattern = re.compile(r"### UI-070 — Library media cards are media-first and selection chrome is visually compact\n\*\*Status:.*\Z", re.S)
          decisions_replacement = f'''### UI-070 — Library media cards are media-first and selection chrome is visually compact
**Status:** Accepted / Implemented / Verified / Merged
**Date:** 2026-09-10

**Decision:** User-directed post-production review refines only the Library card presentation and card-level selection chrome. The maintained Radix Checkbox remains the selection mechanic, keyboard/focus semantics remain unchanged, and its interactive root stays 44×44px; the visible box is reduced to 22×22px and uses restrained checked-state accent treatment instead of the previous 36×36px filled square inside a second styled shell. Library media cards remain links to the same Viewer and keep the same title/kind/date information, but the visual composition becomes media-first: the 4:3 media frame is the full card surface and metadata sits in a compact floating glass shelf over the lower media edge rather than a separate opaque footer. Video identity moves to the top-right so it cannot compete with the top-left selection control.

**Guardrails:** No card quick actions, Favorite/Collection controls, client-owned media/filter state, selection persistence, route, grid-count, durable media identity or server contract changes. The card remains fully understandable without hover; hover only adds restrained lift/saturation using the existing reduced-motion-safe Kinetic Precision system. No new primitive, animation runtime or dependency is introduced.

**Verification:** Exact final PR head `{pr_head}` passed all 16 workflows GitHub attached, including Library History `34417882145`, Engineering Quality `34417882154`, UI Shell `34417882108`, Library Lifecycle `34417882119` and Library Drag Drop `34417882079`. Configured Library History proved the maintained 44×44 checkbox root, 22×22 visual box and metadata integrated inside the media frame. Tree-identical render artifact `10129703554` (`sha256:{artifact_digest}`) was human-reviewed clean at desktop and 390px. PR #142 guarded squash-merged as `{repo_merge}`; all three workflows GitHub attached to merged `main` passed: Engineering Quality `34418649510`, UI Shell Validation `34418649507` and Activity Cancel Visual `34418649511`.

**Consequences:** No schema, account/authorization, generation/provider/worker, R2/storage, route hierarchy or deployment contract changed. Automatic Git → Vercel deployment remains disabled. UI-070 is verified/merged but not production-deployed; live production remains exact source `{live_source}` at READY deployment `{live_deploy}`. UI-070 does not authorize or imply Phase 23 / Cycle 5.
'''
          decisions, count = decisions_pattern.subn(decisions_replacement, decisions, count=1)
          if count != 1:
              raise SystemExit(f"UI_DECISIONS UI-070 replacement count={count}")
          decisions_path.write_text(decisions)
          PY

          rm .github/workflows/close-ui070-docs.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/close-ui070-docs.yml\nPROJECT.md\ndocs/ui/UI_DECISIONS.md\ndocs/ui/UI_MIGRATION.md'

      - name: Commit documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close UI-070 verification"
          git push origin HEAD:docs/ui-070-closure

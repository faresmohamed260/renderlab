name: Phase 12B Exact Production Deploy CLI

on:
  push:
    branches: [work/phase-12b-rollout-execution]
    paths:
      - ".github/workflows/phase-12b-cli-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: d6b8f386db3893e583c99b23fc3397b0eb377d42
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_r09C6RLmb2acHapENECQIn9T
      VERCEL_PROJECT_ID: prj_UGFbrAJ0fg2H0cZOznBoCZ8RCsJU
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout exact verified candidate
        uses: actions/checkout@v4
        with:
          ref: d6b8f386db3893e583c99b23fc3397b0eb377d42
          fetch-depth: 1

      - name: Verify candidate, bootstrap and enforcement metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$VERCEL_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python <<'PY'
          import json, os, urllib.request
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          req=urllib.request.Request(base + '/rest/v1/renderlab_account_access?select=role,status,generation_enabled,max_active_jobs,max_jobs_per_hour', headers={'apikey':key,'Authorization':f'Bearer {key}'})
          with urllib.request.urlopen(req, timeout=30) as response: rows=json.load(response)
          active=[r for r in rows if r.get('status')=='active']
          admins=[r for r in active if r.get('role')=='admin']
          overrides=[r for r in rows if any(r.get(k) is not None for k in ('generation_enabled','max_active_jobs','max_jobs_per_hour'))]
          if len(rows)!=1 or len(active)!=1 or len(admins)!=1 or overrides: raise SystemExit('Closed-beta bootstrap mismatch')
          print('BOOTSTRAP_VERIFIED=true')
          PY
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" > /tmp/env.json
          python <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/env.json').read_text())
          envs=p.get('envs') or p.get('env') or []
          m=[x for x in envs if x.get('key')=='RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED' and 'production' in (x.get('target') or [])]
          if len(m)!=1: raise SystemExit(f'Expected one production enforcement key, got {len(m)}')
          print('CLOSED_BETA_ENFORCEMENT_METADATA_VERIFIED=true')
          PY

      - name: Link exact checkout to RenderLab project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          git diff --exit-code

      - name: Deploy exact checkout to production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          url="$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.log | tail -1)"
          test -n "$url"
          echo "VERCEL_DEPLOYMENT_URL=$url"
          printf '%s' "$url" > /tmp/vercel-deployment-url

      - name: Verify deployed application SHA metadata
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/vercel-deployment-url)"
          host="${url#https://}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}" > /tmp/deployment.json
          python <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/deployment.json').read_text())
          state=p.get('readyState') or p.get('status') or p.get('state')
          meta=p.get('meta') or {}
          sha=meta.get('githubCommitSha') or meta.get('gitCommitSha') or (p.get('gitMetadata') or {}).get('commitSha')
          print(f'VERCEL_DEPLOYMENT_ID={p.get("id")}')
          print(f'VERCEL_DEPLOYMENT_URL=https://{p.get("url")}')
          print(f'VERCEL_FINAL_STATUS={state}')
          print(f'VERCEL_REPORTED_GIT_SHA={sha}')
          if state != 'READY': raise SystemExit(f'Deployment is not READY: {state}')
          if sha and sha != os.environ['CANDIDATE_SHA']: raise SystemExit(f'Unexpected deployment Git SHA: {sha}')
          PY

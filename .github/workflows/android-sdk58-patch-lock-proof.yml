name: Android SDK58 Patch Lockfile Proof (temporary)

# Credential-free, read-only test harness. Generates a reproducible diff in job logs
# for review; does not push, upload a binary, deploy, or change protected main.
on:
  pull_request:
    paths:
      - .github/workflows/android-sdk58-patch-lock-proof.yml

permissions:
  contents: read

jobs:
  lock-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout draft candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Generate bounded Expo SDK 58 patch and lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save --save-prefix='~' 'expo@~58.0.20' 'expo-dev-client@~58.0.16' 'expo-router@~58.0.27'
          git diff --check -- package.json package-lock.json
          test "$(git diff --name-only -- package.json package-lock.json | wc -l)" -eq 2
          echo 'RENDERLAB_SDK58_DIFF_GZIP_BASE64_BEGIN'
          git diff -- package.json package-lock.json | gzip -9 | base64 -w0
          echo
          echo 'RENDERLAB_SDK58_DIFF_GZIP_BASE64_END'
      - name: Verify regenerated dependency graph from clean install
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx expo install --check
          npx --yes expo-doctor@latest
          npm run typecheck
          npm test
          npm run lint
          npm run export:android

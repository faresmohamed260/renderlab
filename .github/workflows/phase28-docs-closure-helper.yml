name: Phase 28 Docs Closure Helper

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase28-docs-closure-helper.yml

permissions:
  contents: write

jobs:
  close_phase_28_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch docs
        run: python .github/scripts/phase28-docs-closure.py

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md
          git diff --cached --check
          git commit -m "docs: close Phase 28 Admin System Continuity"
          git push origin HEAD:main

name: Apply Phase 7C Audit Documentation

on:
  push:
    branches:
      - audit/phase-7c-director
    paths:
      - .github/workflows/apply-phase-7c-audit-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply documentation reconciliation
        run: python scripts/apply-phase-7c-audit-docs.py

      - name: Finalize documentation commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase-7c-director-audit.yml
          rm -f .github/workflows/apply-phase-7c-audit-docs.yml
          rm -f scripts/apply-phase-7c-audit-docs.py
          git diff --check
          git status --short
          git config user.name 'RenderLab Phase 7C Docs Bot'
          git config user.email '121525183+faresmohamed260@users.noreply.github.com'
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/PRODUCT_CAPABILITIES.md docs/architecture/INFRASTRUCTURE.md .github/workflows scripts
          git diff --cached --check
          git commit -m 'Record Phase 7C Director audit'
          git push origin HEAD:audit/phase-7c-director

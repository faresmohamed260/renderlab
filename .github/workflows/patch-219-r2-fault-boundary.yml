name: Patch #219 R2 fault boundary

on:
  push:
    branches:
      - account/219-data-lifecycle
    paths:
      - .github/workflows/patch-219-r2-fault-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/219-data-lifecycle
          fetch-depth: 0
      - name: Move R2 test fault to account deletion boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path("src/server/account/account-data-lifecycle.ts")
          text = lifecycle.read_text()
          old = '''async function purgeAndProveStorage(keys: string[]) {
            for (const key of keys) await deleteR2Object(key);
            for (const key of keys) {
              if (await r2ObjectExists(key)) throw new Error("account_storage_residue");
            }
          }'''
          new = '''async function purgeAndProveStorage(keys: string[]) {
            injectAccountDataLifecycleTestFault("r2-delete");
            for (const key of keys) await deleteR2Object(key);
            for (const key of keys) {
              if (await r2ObjectExists(key)) throw new Error("account_storage_residue");
            }
          }'''
          if old not in text:
              raise SystemExit("account deletion storage boundary pattern not found")
          lifecycle.write_text(text.replace(old, new, 1))

          r2 = Path("src/server/storage/r2.ts")
          text = r2.read_text()
          import_line = 'import { injectAccountDataLifecycleTestFault } from "@/server/account/account-data-lifecycle-test-faults";\n'
          if import_line not in text:
              raise SystemExit("R2 lifecycle fault import not found")
          text = text.replace(import_line, "", 1)
          old = '''export async function deleteR2Object(key: string) {
            if (!key.startsWith("renderlab/account-exports/")) {
              injectAccountDataLifecycleTestFault("r2-delete");
            }
            await getClient().send(new DeleteObjectCommand({ Bucket: bucketName!, Key: key }));
          }'''
          new = '''export async function deleteR2Object(key: string) {
            await getClient().send(new DeleteObjectCommand({ Bucket: bucketName!, Key: key }));
          }'''
          if old not in text:
              raise SystemExit("global R2 deletion fault pattern not found")
          r2.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-219-r2-fault-boundary.yml
          git add src/server/account/account-data-lifecycle.ts src/server/storage/r2.ts
          git commit -m "fix: scope #219 R2 fault to deletion boundary"
          git push origin HEAD:account/219-data-lifecycle

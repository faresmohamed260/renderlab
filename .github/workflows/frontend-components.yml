name: Frontend Component Interactions (optional)

on:
  pull_request:
    paths:
      - "tests/components/**"
      - "tests/component-app/**"
      - "src/features/create/**"
      - "src/features/library/**"
      - "src/components/ui/**"
      - "src/lib/capabilities/**"
      - "src/lib/api/**"
      - "src/app/*.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-components.yml"
  workflow_dispatch:

permissions:
  contents: read

# Disposable localhost app and browser only; no shared resources or credentials.
concurrency:
  group: renderlab-frontend-components-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mounted-components:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium only
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify primitive boundary
        run: npm run verify:ui-purity
      - name: Run mounted production-component interactions
        run: npx --no-install playwright test --config tests/components/playwright.config.ts

name: Frontend Component Interactions (optional)

on:
  pull_request:
    paths:
      - "tests/components/**"
      - "tests/component-app/**"
      - "src/features/create/**"
      - "src/features/library/**"
      - "src/components/ui/**"
      - "src/components/shell/**"
      - "src/app/layout.tsx"
      - "src/app/(app)/layout.tsx"
      - "src/lib/capabilities/**"
      - "src/lib/api/**"
      - "src/app/*.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-components.yml"
  workflow_dispatch:

permissions:
  contents: read

# Disposable localhost app and browser only; no shared resources or credentials.
concurrency:
  group: renderlab-frontend-components-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mounted-components:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read prior overflow baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .overflow-baseline-base
          sparse-checkout: tests/components/create-overflow-baseline.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Enforce shrink-only overflow debt (PR only)
        if: github.event_name == 'pull_request'
        env:
          OVERFLOW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const path = "tests/components/create-overflow-baseline.json";
          const prior = ".overflow-baseline-base/" + path;
          const current = JSON.parse(readFileSync(path, "utf8"));
          if (!existsSync(prior)) {
            console.log("Initial baseline introduction; exact browser calibration required.");
          } else {
            const previous = JSON.parse(readFileSync(prior, "utf8"));
            const gitBlob = file => {
              const bytes = readFileSync(file);
              return createHash("sha1").update("blob " + bytes.length + "\0").update(bytes).digest("hex");
            };
            // Owner-approved one-time measured re-baseline, not a reusable bypass.
            // Bound to this PR AND exact old/new file contents. All future PRs ratchet.
            if (process.env.OVERFLOW_PR_NUMBER === "731"
              && gitBlob(prior) === "f6377a92fee4c990abbf0babcb30636e93a8f295"
              && gitBlob(path) === "074daad949749ba4cdbcd8b6e0703d7fc6dc6f4e") {
              console.log("PR 731 exact owner-approved faithful-mount re-baseline; browser equality still mandatory.");
              process.exit(0);
            }
            for (const [width, states] of Object.entries(current)) {
              for (const [state, entries] of Object.entries(states)) {
                for (const entry of entries) {
                  const old = previous[width]?.[state]?.find(x => x.selector === entry.selector && x.kind === entry.kind);
                  if (!old || !Number.isInteger(entry.pixels) || entry.pixels <= 0 || entry.pixels > old.pixels) {
                    throw new Error("Overflow baseline cannot grow: " + JSON.stringify({ width, state, entry, old }));
                  }
                }
              }
            }
            console.log("Overflow baseline is unchanged or reduced relative to PR base.");
          }
          NODE
          rm -rf .overflow-baseline-base
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium only
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify primitive boundary
        run: npm run verify:ui-purity
      - name: Run mounted production-component interactions
        run: npx --no-install playwright test --config tests/components/playwright.config.ts

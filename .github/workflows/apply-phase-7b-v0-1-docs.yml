name: Apply Phase 7B v0.1 Documentation

on:
  push:
    branches:
      - docs/phase-7b-v0-1-boundary
    paths:
      - .github/workflows/apply-phase-7b-v0-1-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply documentation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-phase-7b-v0-1-docs.py
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/ui/COMPONENT_CATALOG.md")
          text = path.read_text()
          start = text.index("### CreateReferenceMentionMenu")
          end = text.index("### CreateAdvancedPanel", start)
          block = "\n".join(line.rstrip() for line in text[start:end].splitlines()) + "\n\n"
          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Validate and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-phase-7b-v0-1-docs.yml
          rm .github/scripts/apply-phase-7b-v0-1-docs.py
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "RenderLab Phase 7B Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git commit -m "Record Phase 7B v0.1 boundary and evidence"
          git push

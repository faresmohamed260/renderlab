name: Temporary Product Capabilities Status Normalization

on:
  push:
    branches:
      - docs/governance-remediation-status-product-capabilities

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded product-capability status normalization
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const file = 'docs/architecture/PRODUCT_CAPABILITIES.md';
          let body = fs.readFileSync(file, 'utf8');

          const replacements = [
            [
              'The shared schema is ahead of the still-deployed Cycle 2/Phase 13 application. Old-production generations may continue creating nullable `generation_output_index` rows until Phase 14/15 is explicitly rolled out; those rows are product history, not maintenance garbage.',
              'At Phase 15 closure, the shared schema was ahead of the then-deployed Cycle 2/Phase 13 application. Generations from that older application could still create nullable `generation_output_index` rows until the later application rollout; those rows remained product history, not maintenance garbage. Present application deployment truth is owned by `docs/production/current.json`.',
            ],
            [
              'Production deployment/scheduling remains separate: no Phase 14/15 app deployment, reconciler/maintenance secret, `pg_cron` or `pg_net` schedule is active from this verified implementation.',
              '**Closure-time deployment note:** at this Phase 14/15 checkpoint, no application rollout, reconciler/maintenance secret, `pg_cron`, or `pg_net` schedule had been activated by the verified implementation. Present deployment and scheduling truth must be read from the current production and infrastructure authorities rather than this closure record.',
            ],
            [
              '### Phase 16 Creative Iteration — COMPLETE / VERIFIED in RenderLab',
              '### Phase 16 Creative Iteration',
            ],
            [
              'Phase 16 is `COMPLETE / VERIFIED`. Variations remains deferred because current product/worker execution still has one-output semantics.',
              '**Closure-time status:** `COMPLETE / VERIFIED`. Variations remains deferred because current product/worker execution still has one-output semantics.',
            ],
            [
              '## Phase 18 Image Upscale v0.1 — COMPLETE / VERIFIED / MERGED',
              '## Phase 18 Image Upscale v0.1\n**Closure-time status:** `COMPLETE / VERIFIED / MERGED`.',
            ],
            [
              'Phase 18 is complete/verified/merged; production rollout remains separate.',
              'At Phase 18 closure, the work was complete/verified/merged and the application rollout remained separate. The Phase 18 merge is an ancestor of the current production source, so the application capability is now `PRODUCTION-LIVE`; current production identity remains canonical in `docs/production/current.json`.',
            ],
            [
              '## Post-Cycle 3 Productization — User-selectable Image model\n**Status:** COMPLETE / VERIFIED / MERGED',
              '## Post-Cycle 3 Productization — User-selectable Image model\n**Execution:** `COMPLETE`. **Repository:** `MERGED`. **Verification:** `EXACT-HEAD VERIFIED`. **Deployment:** `PRODUCTION-LIVE`.',
            ],
            [
              '## Post-Cycle 3 Library browsing — Creatives / Uploads\n**Status:** COMPLETE / VERIFIED / MERGED',
              '## Post-Cycle 3 Library browsing — Creatives / Uploads\n**Execution:** `COMPLETE`. **Repository:** `MERGED`. **Verification:** `EXACT-HEAD VERIFIED`, `MERGED-MAIN VERIFIED`. **Deployment:** `PRODUCTION-LIVE`.',
            ],
          ];

          for (const [from, to] of replacements) {
            const count = body.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`Expected exactly one replacement for ${JSON.stringify(from)}, found ${count}`);
            }
            body = body.replace(from, to);
          }

          fs.writeFileSync(file, body);

          const testBody = [
            'import assert from "node:assert/strict";',
            'import { readFile } from "node:fs/promises";',
            'import path from "node:path";',
            'import test from "node:test";',
            '',
            'const rootDir = process.cwd();',
            '',
            'test("product capability lifecycle state separates current dimensions from closure evidence", async () => {',
            '  const body = await readFile(',
            '    path.join(rootDir, "docs/architecture/PRODUCT_CAPABILITIES.md"),',
            '    "utf8",',
            '  );',
            '',
            '  const genericStatusLines = body',
            '    .split(/\\r?\\n/)',
            '    .filter((line) => /^\\*\\*Status:/i.test(line));',
            '  assert.deepEqual(',
            '    genericStatusLines,',
            '    [],',
            '    "PRODUCT_CAPABILITIES.md must not use generic Status fields for current capability lifecycle state.",',
            '  );',
            '',
            '  assert.equal(',
            '    body.includes("still-deployed Cycle 2/Phase 13 application"),',
            '    false,',
            '    "Historical deployment claims must not read as present production truth.",',
            '  );',
            '  assert.equal(',
            '    body.includes("Phase 18 is complete/verified/merged; production rollout remains separate"),',
            '    false,',
            '    "Superseded Phase 18 rollout wording must not remain current-state prose.",',
            '  );',
            '  assert.equal(',
            '    body.includes("### Phase 16 Creative Iteration — COMPLETE / VERIFIED in RenderLab"),',
            '    false,',
            '    "Historical phase headings must not chain execution and verification into a current-looking title.",',
            '  );',
            '  assert.equal(',
            '    body.includes("## Phase 18 Image Upscale v0.1 — COMPLETE / VERIFIED / MERGED"),',
            '    false,',
            '    "Historical phase headings must not chain execution, verification, and repository state.",',
            '  );',
            '',
            '  assert.ok(',
            '    body.includes("**Execution:** `COMPLETE`. **Repository:** `MERGED`. **Verification:** `EXACT-HEAD VERIFIED`. **Deployment:** `PRODUCTION-LIVE`."),',
            '    "Current Image-model productization status must use canonical lifecycle dimensions.",',
            '  );',
            '  assert.ok(',
            '    body.includes("**Execution:** `COMPLETE`. **Repository:** `MERGED`. **Verification:** `EXACT-HEAD VERIFIED`, `MERGED-MAIN VERIFIED`. **Deployment:** `PRODUCTION-LIVE`."),',
            '    "Current Library-origin browsing status must use canonical lifecycle dimensions.",',
            '  );',
            '',
            '  const closureLabels = body.match(/\\*\\*Closure-time (?:status|deployment note):\\*\\*/g) ?? [];',
            '  assert.ok(',
            '    closureLabels.length >= 3,',
            '    "Historical capability status must remain explicitly labeled as closure-time evidence.",',
            '  );',
            '});',
            '',
          ].join("\n");
          fs.writeFileSync('tests/unit/product-capabilities-status.test.mjs', testBody);
          NODE

          node --test tests/unit/product-capabilities-status.test.mjs
          npm run verify:docs-governance
          npm run verify:text-policy
          git diff --check
          git rm -- .github/workflows/tmp-product-capabilities-status-normalization.yml
          git status --short

      - name: Commit normalized status slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/PRODUCT_CAPABILITIES.md tests/unit/product-capabilities-status.test.mjs
          git commit -m "docs: normalize product capability lifecycle status"
          git push origin "HEAD:${GITHUB_REF_NAME}"

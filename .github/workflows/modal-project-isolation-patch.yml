name: Apply RenderLab Modal Project Isolation Patch

on:
  push:
    branches:
      - work/modal-project-isolation
    paths:
      - .github/workflows/modal-project-isolation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/modal-project-isolation
          fetch-depth: 0
      - name: Apply bounded non-workflow isolation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          renderlab = ['modal-01', 'modal-02'] + [f'modal-{n:02d}' for n in range(42, 48)]
          saga = [f'modal-{n:02d}' for n in range(3, 42)]
          manifest = {
              'project': 'renderlab',
              'ownedAccountLabels': renderlab,
              'reservedForOtherProjects': {'saga': saga},
          }
          (root / 'config').mkdir(exist_ok=True)
          (root / 'config/modal-project-ownership.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          helper = '''import fs from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const here = path.dirname(fileURLToPath(import.meta.url));
          const root = path.resolve(here, "../..");
          const manifestPath = path.join(root, "config", "modal-project-ownership.json");
          const expectedRenderLabLabels = ["modal-01", "modal-02", ...Array.from({ length: 6 }, (_, index) => `modal-${index + 42}`)];
          const expectedSagaLabels = Array.from({ length: 39 }, (_, index) => `modal-${String(index + 3).padStart(2, "0")}`);

          export function readModalOwnershipManifest() {
            const payload = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (payload.project !== "renderlab") throw new Error("Modal ownership manifest is not owned by RenderLab.");
            if (JSON.stringify(payload.ownedAccountLabels) !== JSON.stringify(expectedRenderLabLabels)) {
              throw new Error("RenderLab Modal ownership must be exactly modal-01, modal-02, and modal-42 through modal-47.");
            }
            if (JSON.stringify(payload.reservedForOtherProjects?.saga) !== JSON.stringify(expectedSagaLabels)) {
              throw new Error("Saga Modal reservation must be exactly modal-03 through modal-41.");
            }
            return payload;
          }

          export function assertRenderLabModalAccount(label) {
            const manifest = readModalOwnershipManifest();
            if (!manifest.ownedAccountLabels.includes(label)) {
              throw new Error(`Modal account ${label} is not owned by RenderLab; refusing credential selection.`);
            }
            return label;
          }

          export function filterRenderLabModalRoster(rows) {
            if (!Array.isArray(rows)) throw new Error("Modal roster must be an array.");
            const manifest = readModalOwnershipManifest();
            const byLabel = new Map();
            rows.forEach((row, index) => {
              if (!row || typeof row !== "object") return;
              const label = String(row.label || row.name || row.account || `modal-${String(index + 1).padStart(2, "0")}`).trim();
              if (byLabel.has(label)) throw new Error(`Duplicate Modal account label in roster: ${label}`);
              byLabel.set(label, row);
            });
            const missing = manifest.ownedAccountLabels.filter((label) => !byLabel.has(label));
            if (missing.length) throw new Error(`RenderLab Modal roster is missing owned accounts: ${missing.join(", ")}`);
            return manifest.ownedAccountLabels.map((label) => byLabel.get(label));
          }

          export const RENDERLAB_MODAL_ACCOUNT_LABELS = Object.freeze([...expectedRenderLabLabels]);
          export const SAGA_MODAL_ACCOUNT_LABELS = Object.freeze([...expectedSagaLabels]);
          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          (root / 'scripts/lib').mkdir(parents=True, exist_ok=True)
          (root / 'scripts/lib/modal-project-ownership.mjs').write_text(helper, encoding='utf-8')

          verifier = '''import fs from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";
          import { RENDERLAB_MODAL_ACCOUNT_LABELS, SAGA_MODAL_ACCOUNT_LABELS, readModalOwnershipManifest } from "./lib/modal-project-ownership.mjs";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const manifest = readModalOwnershipManifest();
          if (manifest.ownedAccountLabels.length !== 8) throw new Error("RenderLab must own exactly eight Modal accounts.");
          if (SAGA_MODAL_ACCOUNT_LABELS.some((label) => RENDERLAB_MODAL_ACCOUNT_LABELS.includes(label))) throw new Error("Modal project allocations overlap.");

          const workflowRoot = path.join(root, ".github", "workflows");
          for (const name of fs.readdirSync(workflowRoot)) {
            if (!name.endsWith(".yml") && !name.endsWith(".yaml")) continue;
            if (name === "modal-project-isolation-patch.yml") continue;
            const text = fs.readFileSync(path.join(workflowRoot, name), "utf8");
            if (/MODAL_TOKEN_ID|MODAL_TOKEN_SECRET|RENDERLAB_MODAL_TOKENS_JSON/.test(text)) {
              throw new Error(`Modal credential use requires an ownership-reviewed workflow; unexpected reference in ${name}.`);
            }
          }
          console.log("RenderLab Modal project ownership boundary verified.");
          '''
          verifier = '\n'.join(line[10:] if line.startswith('          ') else line for line in verifier.splitlines()) + '\n'
          (root / 'scripts/verify-modal-project-ownership.mjs').write_text(verifier, encoding='utf-8')

          tests = '''import test from "node:test";
          import assert from "node:assert/strict";
          import { assertRenderLabModalAccount, filterRenderLabModalRoster, RENDERLAB_MODAL_ACCOUNT_LABELS, SAGA_MODAL_ACCOUNT_LABELS } from "../../scripts/lib/modal-project-ownership.mjs";

          test("Modal ownership sets are exact and non-overlapping", () => {
            assert.deepEqual(RENDERLAB_MODAL_ACCOUNT_LABELS, ["modal-01", "modal-02", "modal-42", "modal-43", "modal-44", "modal-45", "modal-46", "modal-47"]);
            assert.equal(SAGA_MODAL_ACCOUNT_LABELS.length, 39);
            assert.equal(RENDERLAB_MODAL_ACCOUNT_LABELS.some((label) => SAGA_MODAL_ACCOUNT_LABELS.includes(label)), false);
          });

          test("omnibus roster is filtered to RenderLab-owned accounts", () => {
            const roster = Array.from({ length: 47 }, (_, index) => ({ label: `modal-${String(index + 1).padStart(2, "0")}`, marker: index + 1 }));
            assert.deepEqual(filterRenderLabModalRoster(roster).map((row) => row.label), RENDERLAB_MODAL_ACCOUNT_LABELS);
          });

          test("Saga-owned Modal accounts fail closed", () => {
            for (const label of ["modal-03", "modal-17", "modal-41"]) {
              assert.throws(() => assertRenderLabModalAccount(label), /not owned by RenderLab/);
            }
          });

          test("missing RenderLab-owned credential fails closed", () => {
            const roster = RENDERLAB_MODAL_ACCOUNT_LABELS.filter((label) => label !== "modal-45").map((label) => ({ label }));
            assert.throws(() => filterRenderLabModalRoster(roster), /modal-45/);
          });
          '''
          tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in tests.splitlines()) + '\n'
          (root / 'tests/unit/modal-project-ownership.test.mjs').write_text(tests, encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['verify:modal-project-ownership'] = 'node scripts/verify-modal-project-ownership.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          agents_path = root / 'AGENTS.md'
          agents = agents_path.read_text(encoding='utf-8')
          if '## Modal Project Ownership Rule' not in agents:
              agents_path.write_text(agents.rstrip() + '''\n\n## Modal Project Ownership Rule\n\nModal account ownership is a locked cross-project infrastructure boundary. RenderLab owns only `modal-01`, `modal-02`, and `modal-42` through `modal-47`. S.A.G.A. owns `modal-03` through `modal-41`.\n\nPossession of an omnibus credential roster does not authorize use of every Modal credential. Any RenderLab script or workflow that selects Modal credentials must pass the checked-in ownership helper before exporting or using them and must fail closed for S.A.G.A.-owned labels. Do not change this partition unless the owner explicitly changes the decision in both repositories.\n\nPublic gateway names may retain historical `saga-` resource names; naming does not transfer ownership. Worker redeployment, reset, token rotation and secret-store changes remain separately authorized infrastructure operations.\n''', encoding='utf-8')

          infra_path = root / 'docs/architecture/INFRASTRUCTURE.md'
          infra = infra_path.read_text(encoding='utf-8')
          if '## Modal Project Ownership Isolation' not in infra:
              infra_path.write_text(infra.rstrip() + '''\n\n## Modal Project Ownership Isolation\n\nRenderLab and S.A.G.A. use a locked, non-overlapping Modal account allocation. RenderLab owns `modal-01`, `modal-02`, and `modal-42` through `modal-47`; S.A.G.A. owns `modal-03` through `modal-41`. The checked-in authority is `config/modal-project-ownership.json`, with reusable fail-closed selection in `scripts/lib/modal-project-ownership.mjs`.\n\nThe verified RenderLab mapping is: `modal-01` → active `ltx-primary-02` (`faresmohamed260` gateway); `modal-02` → active `ltx-standby-02` (`bplay2086` gateway); `modal-42` / `modal-43` → Qwen primary/standby; `modal-44` / `modal-45` → historical FLUX primary / active FLUX standby; `modal-46` / `modal-47` → historical LTX primary/standby. `modal-45` also hosts the RenderLab-owned `renderlab-image-upscale` app. Disabled historical identities remain reserved because durable generation jobs retain worker identity.\n\nRenderLab normal generation requests call configured gateway URLs and do not authenticate to Modal. Modal credentials are deployment/maintenance authority only. A future RenderLab Modal mutation workflow must use project-scoped secret material where possible and must apply the ownership helper before credential selection. Public gateway names that contain the historical `saga-` prefix are resource identities and are not renamed solely for project branding.\n\nRepository guards prevent accidental cross-project credential use even if an omnibus secret is temporarily present. They are not a cryptographic substitute for least privilege: the strongest operational state is a RenderLab secret/environment containing only the eight RenderLab credentials and a S.A.G.A. secret/environment containing only its 39 credentials. Secret rotation/splitting, worker redeployment/reset and production deployment are not performed by the isolation implementation itself.\n''', encoding='utf-8')
          PY
          node scripts/verify-modal-project-ownership.mjs
          node --test tests/unit/modal-project-ownership.test.mjs
          git diff --check
      - name: Commit bounded non-workflow implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/architecture/INFRASTRUCTURE.md config/modal-project-ownership.json scripts/lib/modal-project-ownership.mjs scripts/verify-modal-project-ownership.mjs tests/unit/modal-project-ownership.test.mjs package.json
          git commit -m "Enforce RenderLab Modal credential ownership"
          git push origin HEAD:work/modal-project-isolation

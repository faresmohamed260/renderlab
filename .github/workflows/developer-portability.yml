name: Developer Portability

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: renderlab-developer-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    name: clean-room (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify developer toolchain
        run: npm run doctor

      - name: Verify repository text policy
        run: npm run verify:text-policy

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify Engineering Quality
        run: npm run verify:engineering-quality

      - name: Verify Modal project ownership boundary
        run: npm run verify:modal-project-ownership

      - name: Verify maintained UI primitive usage
        run: npm run verify:ui-purity

      - name: Production build
        run: npm run build

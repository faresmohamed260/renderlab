name: Developer Portability

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: renderlab-developer-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    name: clean-room (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify developer toolchain
        run: npm run doctor

      - name: Verify repository text policy
        run: npm run verify:text-policy

      - name: Classify exact-commit change scope (fail closed)
        id: ci-scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-classify-changes.mjs

      - name: Verify evidence-only Markdown without npm install
        if: steps.ci-scope.outputs.docs_only == 'true'
        run: npm run verify:docs-governance
      - name: Install dependencies
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run test:unit

      - name: Verify Engineering Quality
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run verify:engineering-quality

      - name: Verify Modal project ownership boundary
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run verify:modal-project-ownership

      - name: Production build
        if: steps.ci-scope.outputs.docs_only != 'true' && matrix.os == 'windows-latest'
        run: npm run build

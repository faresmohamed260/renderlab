name: Phase 22 Contract Documentation

on:
  push:
    branches:
      - work/phase-22-system-cohesion-contract
    paths:
      - .github/workflows/phase22-contract-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-22-system-cohesion-contract
          fetch-depth: 0
      - name: Guard baseline and update authoritative docs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c17abfef07fbc580c51f458496e4e53502816229 HEAD
          python scripts/.phase22-contract-patch.py
          sed -i 's#`src/app/(app)/activity/page.tsx`  $#`src/app/(app)/activity/page.tsx`#' docs/ui/SCREEN_REGISTRY.md
          sed -i 's#`src/app/(app)/settings/page.tsx`  $#`src/app/(app)/settings/page.tsx`#' docs/ui/SCREEN_REGISTRY.md
          python -c 'from pathlib import Path; paths=["PROJECT.md","docs/ui/UI_MIGRATION.md","docs/ui/UI_SYSTEM.md","docs/ui/SCREEN_REGISTRY.md"]; [Path(p).write_text(Path(p).read_text().rstrip()+"\n") for p in paths]'
          rm scripts/.phase22-contract-patch.py
          rm .github/workflows/phase22-contract-docs.yml
          git diff --check
      - name: Commit Phase 22 contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_SYSTEM.md docs/ui/SCREEN_REGISTRY.md scripts/.phase22-contract-patch.py .github/workflows/phase22-contract-docs.yml
          git commit -m "docs: expand Phase 22 system cohesion contract"
          git push origin HEAD:work/phase-22-system-cohesion-contract

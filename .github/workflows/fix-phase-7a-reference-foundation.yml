name: Fix Phase 7A continuation alias semantics

on:
  push:
    branches:
      - stage/phase-7a-reference-foundation
    paths:
      - .github/workflows/fix-phase-7a-reference-foundation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Fix continuation alias semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/create/create-workspace.tsx')
          text = path.read_text()
          old = "\n".join([
              "  function startContinuation(action: ContinuationAction) {",
              "    if (!resultAsset) return;",
              "    revokePreviewUrl(referencePreviewUrl);",
              "    if (!referenceAlias) {",
              "      setReferenceAlias(generationInputAlias(nextReferenceNumber));",
              "      setNextReferenceNumber((current) => current + 1);",
              "    }",
              "    setReference(null);",
              "    setContinuationSource({ id: resultAsset.id, inputRole: action.inputRole });",
          ])
          new = "\n".join([
              "  function startContinuation(action: ContinuationAction) {",
              "    if (!resultAsset) return;",
              "    revokePreviewUrl(referencePreviewUrl);",
              "    const nextAlias = generationInputAlias(nextReferenceNumber);",
              "    setReferenceAlias(nextAlias);",
              "    setNextReferenceNumber((current) => current + 1);",
              "    setReference(null);",
              "    setContinuationSource({ id: resultAsset.id, inputRole: action.inputRole });",
          ])
          if old not in text:
              raise SystemExit('Expected startContinuation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate product tree
        run: |
          npm install --no-audit --no-fund
          npm run verify:ui-purity
          npm run build
          git diff --check
      - name: Remove helper and commit exact tree
        run: |
          rm .github/workflows/fix-phase-7a-reference-foundation.yml
          git config user.name 'RenderLab Phase 7A Bot'
          git config user.email '121525183+faresmohamed260@users.noreply.github.com'
          git add src/features/create/create-workspace.tsx .github/workflows/fix-phase-7a-reference-foundation.yml
          git diff --cached --check
          git commit -m 'Preserve reference alias identity across continuation'
          git push origin HEAD:stage/phase-7a-reference-foundation

name: Phase 12B Authorization Record

on:
  push:
    branches: [work/phase-12b-rollout-authorized]
    paths:
      - ".github/workflows/phase-12b-authorize-docs.yml"
      - ".github/phase12b_authorize_patch.py"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorization branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-12b-rollout-authorized
          fetch-depth: 0

      - name: Record rollout authorization
        run: python .github/phase12b_authorize_patch.py

      - name: Commit authorization state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md
          git diff --cached --check
          git commit -m "docs: record Phase 12B rollout authorization"
          git push origin HEAD:work/phase-12b-rollout-authorized

name: Create Usability-First R&D v0.5

on:
  push:
    branches:
      - rd/create-usability-first-v05
    paths:
      - '.github/workflows/create-usability-first-v05.yml'
      - 'design/rd/create-usability-first-v05.md'
      - 'design/prototypes/create-usability-first-v05/**'
      - 'scripts/verify-create-usability-first-v05.mjs'
  workflow_dispatch:

concurrency:
  group: create-usability-first-v05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify v0.5 interaction and evidence
        run: node scripts/verify-create-usability-first-v05.mjs

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderlab-create-usability-first-v05
          path: artifacts/create-usability-first-v05
          if-no-files-found: ignore
          retention-days: 30

name: Landing Hero R&D

on:
  pull_request:
    paths:
      - "design/brand/landing-hero-rd-v0.1.md"
      - "design/prototypes/landing-hero-rd-v0.1/**"
      - "scripts/verify-landing-hero-rd.mjs"
      - ".github/workflows/landing-hero-rd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-landing-hero-rd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify script syntax
        run: node --check scripts/verify-landing-hero-rd.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated static prototype
        run: |
          python3 -m http.server 4173 --directory design/prototypes/landing-hero-rd-v0.1 > /tmp/renderlab-hero-rd.log 2>&1 &
          echo $! > /tmp/renderlab-hero-rd.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-hero-rd.log
          exit 1
      - name: Verify A/B/C browser directions
        run: node scripts/verify-landing-hero-rd.mjs
      - name: Print static-server log on failure
        if: failure()
        run: cat /tmp/renderlab-hero-rd.log || true
      - name: Upload hero R&D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-landing-hero-rd-v0.1
          path: artifacts/landing-hero-rd-v0.1/*.png
          if-no-files-found: warn
          retention-days: 14

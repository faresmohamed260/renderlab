name: Apply Cycle 2 feedback replan

on:
  push:
    branches:
      - docs/replan-cycle-2-create-v2
    paths:
      - .github/workflows/apply-cycle-2-replan.yml
      - .github/scripts/apply-cycle-2-replan.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/replan-cycle-2-create-v2
      - name: Apply documentation replan
        run: python .github/scripts/apply-cycle-2-replan.py
      - name: Normalize newly added markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def normalize_range(path, start, end=None):
              p = Path(path)
              text = p.read_text()
              a = text.index(start)
              b = text.index(end, a) if end else len(text)
              middle = "\n".join(line.rstrip() for line in text[a:b].splitlines())
              if end:
                  p.write_text(text[:a] + middle.rstrip() + "\n\n" + text[b:].lstrip("\n"))
              else:
                  p.write_text(text[:a] + middle.rstrip() + "\n")

          normalize_range("docs/ui/UI_DECISIONS.md", "### UI-037 —")
          normalize_range("docs/ui/SCREEN_REGISTRY.md", "### Admin — planned Cycle 2 privileged surface", "## Creation Experience Resolution")
          normalize_range("docs/ui/UI_MIGRATION.md", "### Phase 7 — Create v2 / Creative Direction", "## Feature/Surface Procedure")
          normalize_range("docs/ui/UI_MIGRATION.md", "## Current Work", "## Session Handoff Rule")
          PY
      - name: Commit documentation state
        shell: bash
        run: |
          git diff --check
          git config user.name "RenderLab Docs Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add AGENTS.md PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/UI_SYSTEM.md docs/ui/SCREEN_REGISTRY.md docs/architecture/PRODUCT_CAPABILITIES.md
          git commit -m "Replan Cycle 2 from closed-beta feedback"
          git rm .github/workflows/apply-cycle-2-replan.yml .github/scripts/apply-cycle-2-replan.py
          git commit -m "Remove Cycle 2 replan helpers"
          git push origin HEAD:docs/replan-cycle-2-create-v2

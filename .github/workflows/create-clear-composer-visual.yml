name: Create Clear Composer Visual

on:
  pull_request:
    paths:
      - "src/features/create/**"
      - "src/app/globals.css"
      - "src/components/ui/**"
      - "scripts/verify-create-clear-composer.mjs"
      - ".github/workflows/create-clear-composer-visual.yml"
      - "docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest evidence run for a moving PR head; acceptance still requires
# every workflow attached to the final exact head to pass.
concurrency:
  group: create-clear-composer-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: |
          PORT=3000 npm run start > /tmp/renderlab-clear-composer.log 2>&1 &
          echo $! > /tmp/renderlab-clear-composer.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/create > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-clear-composer.log
          exit 1

      - name: Verify production Clear Composer
        env:
          RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
          RENDERLAB_CLEAR_COMPOSER_ARTIFACT_DIR: artifacts/create-clear-composer
        run: node scripts/verify-create-clear-composer.mjs

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-clear-composer.log || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-create-clear-composer-visual
          path: artifacts/create-clear-composer
          if-no-files-found: warn
          retention-days: 14

name: Phase 18 Planning Handoff Fix

on:
  push:
    branches: [plan/phase-18-image-upscale]
    paths:
      - .github/workflows/phase18-plan-stale-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and correct stale Phase 17 handoff text
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = 'e0ba6ae3e8eadefbe1a7c1ae6bf37d3fdaec755e'
          test "$(git merge-base HEAD origin/main)" = 'e0ba6ae3e8eadefbe1a7c1ae6bf37d3fdaec755e'
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'PROJECT.md': (
                  'The next governance step is a fresh deployed-worker audit that expands Phase 18 into one coherent execution-ready capability contract. Phase 18 implementation is not pre-approved by this completion and was not started during Phase 17 closure.',
                  'That governance step is now complete: read-only worker audit `33995223659` selected the accepted Phase 18 Image Upscale v0.1 contract below. Phase 18 implementation remains not started; contract acceptance does not authorize deployment.'
              ),
              'docs/ui/UI_MIGRATION.md': (
                  '**Next after verified completion:** re-audit the deployed worker fleet and expand Phase 18 into one coherent capability contract; do not implement Phase 18 from roadmap preference alone.',
                  '**Post-Phase-17 governance:** completed by read-only worker audit `33995223659` and the accepted Phase 18 Image Upscale v0.1 contract below. Phase 18 implementation remains not started and deployment remains separately authorized.'
              ),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one stale handoff target, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'PROJECT.md'
          test "${changed[1]}" = 'docs/ui/UI_MIGRATION.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/ui/UI_MIGRATION.md
          git commit -m 'docs: finalize Phase 18 planning handoff'
          git push origin HEAD:plan/phase-18-image-upscale

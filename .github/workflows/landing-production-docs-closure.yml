name: Landing Production Docs Closure

on:
  push:
    branches:
      - docs/landing-production-rollout-closure
    paths:
      - .github/workflows/landing-production-docs-closure.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/landing-production-rollout-closure

      - name: Reconcile production deployment documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # PROJECT.md — current production baseline.
          replace_once(
              "PROJECT.md",
              "## Current Verified Baseline — 2026-09-10",
              "## Current Verified Baseline — 2026-09-11",
          )
          replace_once(
              "PROJECT.md",
              "- Authoritative repository source currently deployed is `a1f3cdcf095c9088fe3c2c0eebafaf52b5d609a7`. It includes the verified UI-068 / UI-069 / UI-070 / UI-071 post-production corrections plus their repository closure documentation.",
              "- Authoritative repository source currently deployed is `0173c4c5ba08360b6352331118abc81978cfa774`. It contains the approved four-section Lab Matrix Landing plus the previously verified application corrections through UI-071; commits after the Landing implementation merge are documentation-only.",
          )
          replace_once(
              "PROJECT.md",
              "- Accepted production application is source `a1f3cdcf095c9088fe3c2c0eebafaf52b5d609a7` at READY deployment `dpl_5U3URZkAjMqB3gZMS3pnXP7by2Ra` / `https://renderlab-8oab52lcl-faresmohamed260-6733s-projects.vercel.app`; `https://renderlab.faresuniform.uk` and the stable Vercel alias serve that deployment. Prior accepted UI-070 READY deployment `dpl_DoNm8T21WSano7zoWgGi112sDDqp` remains the preferred rollback anchor.",
              "- Accepted production application is source `0173c4c5ba08360b6352331118abc81978cfa774` at READY deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991` / `https://renderlab-a9ssca2l8-faresmohamed260-6733s-projects.vercel.app`. Explicit alias run `34547608773` moved `https://renderlab.faresuniform.uk` to that deployment and passed root + `/create` + `/library` + `/activity` + `/settings` smoke; independent Vercel checks found no runtime-error clusters and no error/fatal logs after rollout. Prior accepted UI-071 deployment `dpl_5U3URZkAjMqB3gZMS3pnXP7by2Ra` remains a known-good prior deployment for explicit alias restoration if needed.",
          )
          replace_once(
              "PROJECT.md",
              "- Production is verified through UI-071. UI-068 / PR #138, UI-069 / PR #140, UI-070 / PR #142 and UI-071 / PR #145 are production-live in exact source `a1f3cdcf095c9088fe3c2c0eebafaf52b5d609a7` at READY deployment `dpl_5U3URZkAjMqB3gZMS3pnXP7by2Ra`. Guarded clean rollout run `34460364114` preserved the exact verified source and pristine working tree, passed Landing + `/create` + `/library` + `/activity` + `/settings` smoke, and required no rollback. Automatic Git → Vercel deployment remains disabled.",
              "- Application surfaces remain verified through UI-071, while the public `/` surface is now the approved Lab Matrix Landing. UI-068 / PR #138, UI-069 / PR #140, UI-070 / PR #142 and UI-071 / PR #145 remain included in production source `0173c4c5ba08360b6352331118abc81978cfa774`; Landing implementation PR #174 is production-live in READY deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`. Automatic Git → Vercel deployment remains disabled.",
          )
          replace_once(
              "PROJECT.md",
              "UI-071 is production-live in exact source `a1f3cdcf095c9088fe3c2c0eebafaf52b5d609a7` at READY deployment `dpl_5U3URZkAjMqB3gZMS3pnXP7by2Ra` after guarded clean rollout `34460364114`.",
              "UI-071 remains included in current production source `0173c4c5ba08360b6352331118abc81978cfa774`, now served with the Lab Matrix Landing from READY deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`; its original guarded production rollout evidence remains run `34460364114`.",
          )

          # SCREEN_REGISTRY.md — current Landing production status/evidence.
          replace_once(
              "docs/ui/SCREEN_REGISTRY.md",
              "**Status:** APPROVED — Lab Matrix redesign merged on `main`; deployment remains separate",
              "**Status:** APPROVED — Lab Matrix redesign merged and production-live",
          )
          replace_once(
              "docs/ui/SCREEN_REGISTRY.md",
              "PR #175 records the repository closure. No deployment was part of the Landing approval/merge operation; current production state remains authoritative in `PROJECT.md`.",
              "PR #175 records the repository closure. Production rollout on 2026-09-11 deployed current `main` source `0173c4c5ba08360b6352331118abc81978cfa774` as READY Vercel deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`; explicit alias run `34547608773` then moved `renderlab.faresuniform.uk` to that deployment and passed root plus `/create`, `/library`, `/activity` and `/settings` smoke. Independent Vercel post-rollout checks found no runtime-error clusters and no error/fatal logs. `PROJECT.md` remains authoritative for the current production pointer.",
          )

          # UI_MIGRATION.md — concise current production closure before historical phase chronology.
          migration = Path("docs/ui/UI_MIGRATION.md")
          text = migration.read_text()
          marker = "## Phase 0 — Product & Capability Baseline"
          if marker not in text:
              raise SystemExit("UI_MIGRATION.md: Phase 0 marker missing")
          block = """## Current Landing production closure — 2026-09-11
- [x] Approved four-section Lab Matrix Landing implemented in PR #174 and merged as `1dc04f68d059a9f7d903c8313fe2e690aeec9d0e`.
- [x] Current `main` source `0173c4c5ba08360b6352331118abc81978cfa774` deployed as READY Vercel production deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`.
- [x] Explicit custom-domain alias run `34547608773` pointed `renderlab.faresuniform.uk` at the new deployment and passed root + `/create` + `/library` + `/activity` + `/settings` smoke.
- [x] Independent post-rollout Vercel checks found no runtime-error clusters and no error/fatal logs for the new production deployment.
- [x] Automatic Git → Vercel deployment remains disabled; future production releases still require explicit authorization.

**Landing production status: `APPROVED / PRODUCTION-LIVE`.**

"""
          if "## Current Landing production closure — 2026-09-11" not in text:
              migration.write_text(text.replace(marker, block + marker, 1))
          else:
              raise SystemExit("UI_MIGRATION.md: closure block already present unexpectedly")

          # INFRASTRUCTURE.md — persist the custom-domain alias behavior discovered during rollout.
          infra = Path("docs/architecture/INFRASTRUCTURE.md")
          text = infra.read_text()
          anchor = "Vercel is the production deployment target, but Git pushes are **not** deployment authorization. Repository `vercel.json` sets `git.deploymentEnabled=false`, so GitHub development/merge activity does not automatically create Vercel deployments. An explicit deployment action is required."
          if text.count(anchor) != 1:
              raise SystemExit(f"INFRASTRUCTURE.md: expected one Vercel boundary anchor, found {text.count(anchor)}")
          addition = anchor + "\n\nLanding production rollout on 2026-09-11 established an additional operational requirement for the current project configuration: a successful CLI `vercel deploy --prod` can create a READY production-target deployment and move the stable project Vercel alias without moving the custom domain `renderlab.faresuniform.uk`. After deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991` became READY from exact source `0173c4c5ba08360b6352331118abc81978cfa774`, the custom domain still served the prior deployment until explicit `vercel alias set <deployment-url> renderlab.faresuniform.uk` run `34547608773`; that alias operation then passed root + application-route smoke. Future guarded production rollouts must therefore verify the custom domain independently and explicitly assign it when required. For rollback on the current plan, prefer explicit alias restoration to the last known-good deployment rather than assuming deep `vercel rollback <old-url>` is available; the latter returned a plan-limit 402 during rollout run `34547306794`."
          infra.write_text(text.replace(anchor, addition, 1))
          PY

          rm .github/workflows/landing-production-docs-closure.yml
          git diff --check
          git status --short

      - name: Commit docs-only closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/architecture/INFRASTRUCTURE.md .github/workflows/landing-production-docs-closure.yml
          git diff --cached --check
          git commit -m "docs: record Landing production rollout"
          git push origin HEAD:docs/landing-production-rollout-closure

name: Phase 16 Creative Iteration Runner

on:
  push:
    branches: [noop]
    paths:
      - ".github/workflows/phase16-creative-iteration-runner.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0

      - name: Extract patched sync script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase16-creative-iteration-sync.yml').read_text()
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          payload = source[start:]
          lines = []
          for line in payload.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          script = script.replace('npm ci\n', 'npm install --no-audit --no-fund\n', 1)
          Path('/tmp/phase16-sync.sh').write_text(script)
          PY
          chmod +x /tmp/phase16-sync.sh

      - name: Apply verified Phase 16 batch
        shell: bash
        env:
          EXPECTED_HEAD: f5b43c52a9c457a7f5874a9f3722a6b33821941f
          TARGET_BRANCH: work/phase-16-creative-iteration
        run: /tmp/phase16-sync.sh

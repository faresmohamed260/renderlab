name: Brand / Launch Visual

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "design/penpot/brand-launch-v0.1-*.svg"
      - "design/penpot/README.md"
      - "tests/ui/**"
      - "scripts/verify-brand-launch.mjs"
      - "scripts/verify-ui-purity.mjs"
      - "package.json"
      - "tsconfig.json"
      - "next-env.d.ts"
      - "postcss.config.mjs"
      - "playwright.config.ts"
      - ".github/workflows/brand-launch-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-brand-launch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify maintained UI primitive usage
        run: npm run verify:ui-purity
      - name: Type-check
        run: npx tsc --noEmit
      - name: Verify launch script syntax
        run: node --check scripts/verify-brand-launch.mjs
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1
      - name: Verify Brand / Launch Visual
        run: node scripts/verify-brand-launch.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true
      - name: Upload launch screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderlab-brand-launch-screenshots
          path: artifacts/brand-launch-*.png
          if-no-files-found: warn
          retention-days: 14

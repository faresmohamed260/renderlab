name: Phase 20 mobile overflow fix

on:
  push:
    branches:
      - work/phase-20-create-instrument
    paths:
      - .github/workflows/phase20-mobile-overflow-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-20-create-instrument
          fetch-depth: 0
      - name: Apply token-aligned mobile deck width correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/create/create-workspace.tsx')
          text = path.read_text()
          old = 'className="kinetic-control-deck mt-3 flex flex-col gap-2 rounded-2xl border p-1.5 sm:flex-row sm:items-center"'
          new = 'className="kinetic-control-deck mt-3 flex flex-col gap-2 rounded-2xl border px-1 py-1.5 sm:flex-row sm:items-center sm:p-1.5"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one control-deck target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit correction and remove helper
        shell: bash
        run: |
          git rm .github/workflows/phase20-mobile-overflow-fix.yml
          git add src/features/create/create-workspace.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve Phase 20 mobile control width"
          git push origin HEAD:work/phase-20-create-instrument

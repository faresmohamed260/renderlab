name: Phase 16 Documentation Correction

on:
  push:
    branches: [noop]
    paths:
      - ".github/workflows/phase16-doc-correct.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: work/phase-16-creative-iteration
      EXPECTED_HEAD: 7c89ef0cc95a3934f0cddf1e7704aeb17fb28e0f
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0

      - name: Correct stale Phase 16 transition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          path = Path('PROJECT.md')
          text = path.read_text()
          old = 'Phase 16 remains roadmap-only. Its execution contract must now be expanded from current repository/product evidence before implementation begins.'
          new = 'At Phase 15 closure, Phase 16 was still roadmap-only. The authoritative current Phase 16 implementation state and accepted execution contract are recorded below.'
          if old not in text:
              raise SystemExit('Stale Phase 16 transition sentence not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -Fq 'At Phase 15 closure, Phase 16 was still roadmap-only.' PROJECT.md
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md
          git commit -m "Correct Phase 16 project handoff state"
          git push origin HEAD:"$TARGET_BRANCH"

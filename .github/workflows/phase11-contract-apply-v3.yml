name: Phase 11 Contract Apply v3

on:
  push:
    branches:
      - tmp/phase11-contract-apply-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4
        with:
          ref: tmp/phase11-contract-apply-v3
          path: bootstrap

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: work/phase-11-brand-launch-contract
          path: target
          fetch-depth: 0

      - name: Reposition Screen Registry target
        working-directory: target
        run: python ../bootstrap/.github/scripts/phase11_contract_screen_registry_reposition.py

      - name: Validate targeted placement
        working-directory: target
        shell: bash
        run: |
          test "$(git diff --name-only)" = "docs/ui/SCREEN_REGISTRY.md"
          git diff --check
          test "$(grep -F -c '### Brand / Landing — Phase 11 target' docs/ui/SCREEN_REGISTRY.md)" = "1"
          brand_line="$(grep -n -F '### Brand / Landing — Phase 11 target' docs/ui/SCREEN_REGISTRY.md | cut -d: -f1)"
          resolution_line="$(grep -n -F '## Creation Experience Resolution' docs/ui/SCREEN_REGISTRY.md | cut -d: -f1)"
          test "$brand_line" -lt "$resolution_line"

      - name: Amend contract commit
        working-directory: target
        shell: bash
        run: |
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add docs/ui/SCREEN_REGISTRY.md
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:work/phase-11-brand-launch-contract

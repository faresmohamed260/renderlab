name: Apply Phase 24 Library evidence verifier

on:
  push:
    branches:
      - work/phase-24-library-gallery-rail
    paths:
      - .github/workflows/tmp-phase24-history-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-24-library-gallery-rail
          fetch-depth: 0

      - name: Apply verifier evidence patch
        run: |
          python scripts/tmp_phase24_history_evidence.py
          git diff --check
          node --check scripts/verify-library-history.mjs

      - name: Commit verifier update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-library-history.mjs
          git commit -m "Add Gallery Rail temporal verification"
          git push origin HEAD:work/phase-24-library-gallery-rail

name: Audit Phase 7A reference contract callsites

on:
  push:
    branches:
      - audit/phase-7a-reference-contract
    paths:
      - .github/workflows/audit-phase-7a-reference-contract.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate reference contract callsites
        run: |
          echo '=== generation input / request callsites ==='
          grep -R -n -E 'GenerationInput|GenerationRequest|request\.inputs|inputs:' src tests scripts --exclude-dir=node_modules || true
          echo '=== role/source literals ==='
          grep -R -n -E 'primary-image|first-frame|temporary-source|media-asset' src tests scripts --exclude-dir=node_modules || true
          echo '=== generation job persistence schema ==='
          grep -R -n -E 'generation_jobs|inputs.*json|parameters.*json' supabase/migrations src/server --exclude-dir=node_modules || true
          echo '=== maintained picker/menu mechanics ==='
          grep -R -n -E 'DropdownMenu|Popover|Combobox|Command' src/components/ui src/features/create --exclude-dir=node_modules || true
          echo '=== create reference state ==='
          grep -n -E 'reference|continuationSource|uploadReference|clearReference' src/features/create/create-workspace.tsx || true

name: Apply Phase 6 planning expansion

on:
  push:
    branches:
      - docs/phase-6-expansion

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage Phase 6 planning expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-6-expansion
          fetch-depth: 0

      - name: Expand phase planning protocol and Phase 6 contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          def decode(value: str) -> str:
              return base64.b64decode(value).decode('utf-8')

          phase_protocol = decode('')
          project_protocol = decode('')
          phase6 = decode(' ')

          agents = Path('AGENTS.md')
          agents_text = agents.read_text()
          if '## Progressive Phase Planning' not in agents_text:
              anchor = '## Session Continuity\n'
              if anchor not in agents_text:
                  raise SystemExit('AGENTS.md Session Continuity anchor not found')
              agents_text = agents_text.replace(anchor, phase_protocol + anchor, 1)
              agents.write_text(agents_text)

          project = Path('PROJECT.md')
          project_text = project.read_text()
          if '### Phase planning protocol' not in project_text:
              anchor = '### Cycle 2 scope boundary\n'
              if anchor not in project_text:
                  raise SystemExit('PROJECT.md Cycle 2 scope anchor not found')
              project_text = project_text.replace(anchor, project_protocol + anchor, 1)
              project.write_text(project_text)

          migration = Path('docs/ui/UI_MIGRATION.md')
          migration_text = migration.read_text()
          pattern = r'### Phase 6 — Cycle 2 Baseline & Production Hardening\n.*?(?=\n### Phase 7 — Create v2 / Deeper Creative Iteration)'
          migration_text, count = re.subn(pattern, phase6.rstrip(), migration_text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('UI_MIGRATION.md Phase 6 block not replaced exactly once')
          migration_text = migration_text.replace(
              '**Current phase:** Phase 6 — Cycle 2 Baseline & Production Hardening is next, but is not started.',
              '**Current phase:** Phase 6 — Cycle 2 Baseline & Production Hardening has an expanded execution-ready planning contract; execution is not started.'
          )
          migration_text = migration_text.replace(
              '**Current gate:** Await explicit user authorization to start Phase 6. Planning acceptance is not implementation approval and does not authorize deployment.',
              '**Current gate:** Phase 6 planning is expanded; await explicit user authorization before executing the audit. Planning acceptance is not implementation approval and does not authorize deployment.'
          )
          migration.write_text(migration_text)
          PY

          git config user.name "RenderLab Docs Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git rm .github/workflows/apply-phase-6-expansion.yml
          git add AGENTS.md PROJECT.md docs/ui/UI_MIGRATION.md
          git diff --cached --check
          git commit -m "Expand Phase 6 planning contract"
          git push origin HEAD:docs/phase-6-expansion

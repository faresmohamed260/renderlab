name: Phase 13 Planning Documentation

on:
  push:
    branches: [work/phase-13-email-invite-hardening-contract]
    paths:
      - ".github/phase13_email_contract_patch.py"
      - ".github/phase13_current_work_patch.py"
      - ".github/workflows/phase-13-planning-docs.yml"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-13-email-invite-hardening-contract
          fetch-depth: 0

      - name: Normalize legacy exact anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/phase13_email_contract_patch.py')
          s = p.read_text()
          s, n1 = re.subn(r'old_current = """.*?project\.write_text\(text\)\n', 'project.write_text(text)\n', s, count=1, flags=re.S)
          s, n2 = re.subn(r'old_migration_current = """.*?migration\.write_text\(text\)\n', 'migration.write_text(text)\n', s, count=1, flags=re.S)
          if (n1, n2) != (1, 1):
              raise SystemExit(f'failed to normalize legacy anchors: {(n1, n2)}')
          p.write_text(s)
          PY

      - name: Apply Phase 13 contract
        run: |
          python .github/phase13_email_contract_patch.py
          python .github/phase13_current_work_patch.py

      - name: Validate docs diff
        run: git diff --check

      - name: Commit planning docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git commit -m "docs: plan Phase 13 email invite hardening"
          git push origin HEAD:work/phase-13-email-invite-hardening-contract

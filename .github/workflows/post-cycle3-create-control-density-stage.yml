name: Stage Create control density correction

on:
  push:
    branches:
      - work/post-cycle3-create-control-density
    paths:
      - .github/workflows/post-cycle3-create-control-density-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/post-cycle3-create-control-density
          fetch-depth: 0

      - name: Apply corrective Create composition and verification
        run: |
          python scripts/stage-create-control-density.py
          git diff --check
          node --check scripts/verify-create-lifecycle.mjs

      - name: Commit correction and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-cycle3-create-control-density-stage.yml scripts/stage-create-control-density.py
          git add \
            src/features/create/create-workspace.tsx \
            scripts/verify-create-lifecycle.mjs \
            PROJECT.md \
            docs/ui/UI_MIGRATION.md \
            docs/ui/UI_DECISIONS.md \
            docs/ui/SCREEN_REGISTRY.md \
            docs/ui/COMPONENT_CATALOG.md
          git diff --cached --check
          git commit -m "Fix Create control density and Advanced parity"
          git push origin HEAD:work/post-cycle3-create-control-density

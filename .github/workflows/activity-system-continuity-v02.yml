name: Activity System Continuity R&D v0.2

on:
  push:
    branches:
      - rd/activity-system-continuity-v02
    paths:
      - '.github/workflows/activity-system-continuity-v02.yml'
      - 'design/rd/activity-system-continuity-v02.md'
      - 'design/prototypes/activity-system-continuity-v02/**'
      - 'scripts/verify-activity-system-continuity-v02.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-system-continuity-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Activity system continuity
        run: node scripts/verify-activity-system-continuity-v02.mjs

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-activity-system-continuity-v02
          path: artifacts/activity-system-continuity-v02
          if-no-files-found: ignore
          retention-days: 30

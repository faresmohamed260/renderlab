name: Temporary UI-031 Final Project Handoff Cleanup

on:
  push:
    branches: [tmp/ui031-final-doc-sync]
    paths:
      - ".github/workflows/tmp-ui031-final-doc-sync.yml"
      - "scripts/tmp-ui031-project-cleanup.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/ui031-final-doc-sync
          path: helper

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Prepare final PROJECT handoff cleanup
        run: python helper/scripts/tmp-ui031-project-cleanup.py repo

      - name: Validate and push docs-only cleanup
        working-directory: repo
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md
          git commit -m "Close UI-031 active handoff"
          git push origin HEAD:main

name: Temporary UI-031 Post-Merge Documentation Sync

on:
  push:
    branches: [tmp/ui031-final-doc-sync]
    paths:
      - ".github/workflows/tmp-ui031-final-doc-sync.yml"
      - "scripts/tmp-ui031-post-merge-sync.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/ui031-final-doc-sync
          path: helper

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Prepare UI-031 approved handoff
        run: python helper/scripts/tmp-ui031-post-merge-sync.py repo

      - name: Validate and push docs-only main handoff
        working-directory: repo
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/INFRASTRUCTURE.md
          git commit -m "Record UI-031 approval"
          git push origin HEAD:main

name: Android SDK58 Standalone Native Proof (temporary / no distribution)
# This is a disposable pre-release engineering probe, NOT a signed app release.
# Never exports APK, signing keys, private credentials or production tokens.
on:
  pull_request:
    paths:
      - .github/workflows/android-standalone-native-proof-temporary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-offline-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      JAVA_TOOL_OPTIONS: "-Xmx3g -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout exact draft PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d1650
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact native project dependencies
        working-directory: apps/mobile
        run: npm ci --no-fund --no-audit
      - name: Generate temporary isolated Android identity
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const file='app.json';
          const x=JSON.parse(fs.readFileSync(file,'utf8'));
          x.expo.android.package='dev.renderlab.standaloneproof';
          x.expo.name='RenderLab Offline QA (not release)';
          x.expo.slug='renderlab-offline-native-proof';
          fs.writeFileSync(file,JSON.stringify(x,null,2));
          NODE
          npx expo prebuild --platform android --no-install --non-interactive
      - name: Compile RELEASE-MODE embedded JS (no Metro, no OTA provisioning)
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain --max-workers=2
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo 'Standalone Android arm64 binary compiled with an embedded release-mode Hermes/JS bundle.'
          unzip -l "$APK" | grep -E 'assets/(index.android.bundle|.*\.hbc)' | head -n 4
          du -h "$APK"
          # Never export or retain the APK beyond this ephemeral runner.
          rm -f "$APK"
          echo "DISPOSABLE_APK_REMOVED=1"

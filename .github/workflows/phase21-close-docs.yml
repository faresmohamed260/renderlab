name: Phase 21 documentation closure

on:
  push:
    branches:
      - work/phase-21-spatial-media
    paths:
      - ".github/workflows/phase21-close-docs.yml"

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard verified implementation baseline
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "12bb7133bf6c2686c47ccda9d26fd09b7e36c038"
          git merge-base --is-ancestor dd43169abae89e7e67267699a05f401370fa70ed HEAD

      - name: Apply verified Phase 21 documentation closure
        run: python scripts/phase21-close-docs.py

      - name: Remove temporary closure helpers
        run: rm .github/workflows/phase21-close-docs.yml scripts/phase21-close-docs.py

      - name: Validate and commit closure
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Phase 21 spatial media verification"
          git push origin HEAD:work/phase-21-spatial-media

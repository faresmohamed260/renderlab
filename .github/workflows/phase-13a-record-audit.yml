name: Phase 13A Audit Documentation

on:
  push:
    branches: [docs/phase-13a-email-audit-results]
    paths:
      - ".github/phase13a_record_audit.py"
      - ".github/workflows/phase-13a-record-audit.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-13a-email-audit-results
          fetch-depth: 0
      - name: Apply and validate audit documentation
        run: |
          python .github/phase13a_record_audit.py
          git diff --check
      - name: Commit documentation only
        run: |
          git rm .github/phase13a_record_audit.py .github/workflows/phase-13a-record-audit.yml
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record verified Phase 13A email audit"
          git push origin HEAD:docs/phase-13a-email-audit-results

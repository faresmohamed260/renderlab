name: Account Profile Credential

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/app/(app)/create/**"
      - "src/app/(app)/settings/**"
      - "src/app/api/account/preferences/**"
      - "src/app/api/account/profile/**"
      - "src/features/account/**"
      - "src/server/account/account-preferences.ts"
      - "src/server/account/account-profile.ts"
      - "src/server/account/account-profile-request.ts"
      - "src/server/account/account-data-lifecycle.ts"
      - "src/server/generation/generation-recipe.ts"
      - "src/server/maintenance/renderlab-maintenance.ts"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/cleanup-account-preferences-fixtures.mjs"
      - "scripts/verify-account-preferences.mjs"
      - "scripts/verify-account-profile-credential.mjs"
      - "supabase/migrations/0022_renderlab_account_profiles.sql"
      - "supabase/migrations/0023_renderlab_account_preferences.sql"
      - ".github/workflows/account-profile-credential.yml"
  push:
    branches: [main]
    paths:
      - "src/app/(app)/create/**"
      - "src/app/(app)/settings/**"
      - "src/app/api/account/preferences/**"
      - "src/app/api/account/profile/**"
      - "src/features/account/**"
      - "src/server/account/account-preferences.ts"
      - "src/server/account/account-profile.ts"
      - "src/server/account/account-profile-request.ts"
      - "src/server/account/account-data-lifecycle.ts"
      - "src/server/generation/generation-recipe.ts"
      - "src/server/maintenance/renderlab-maintenance.ts"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/cleanup-account-preferences-fixtures.mjs"
      - "scripts/verify-account-preferences.mjs"
      - "scripts/verify-account-profile-credential.mjs"
      - "supabase/migrations/0022_renderlab_account_profiles.sql"
      - "supabase/migrations/0023_renderlab_account_preferences.sql"
      - ".github/workflows/account-profile-credential.yml"

permissions:
  contents: read

concurrency:
  group: renderlab-account-profile-credential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  configured-profile-credential:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED: "true"
      RENDERLAB_TEST_ACCOUNT_SCOPE: profile-${{ github.event.pull_request.number || github.ref_name }}
      RENDERLAB_TEST_MFA_NAMESPACE: profile-mfa
      RENDERLAB_PROFILE_CREDENTIAL_ARTIFACT_DIR: artifacts/account-profile-credential
      RENDERLAB_ACCOUNT_PREFERENCES_ARTIFACT_DIR: artifacts/account-preferences

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate configured secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify configured verifier syntax
        run: |
          node --check scripts/verify-account-profile-credential.mjs
          node --check scripts/verify-account-preferences.mjs
          node --check scripts/cleanup-account-preferences-fixtures.mjs

      - name: Clean exact configured fixtures before verification
        run: |
          node scripts/verify-account-profile-credential.mjs --cleanup-only
          node scripts/cleanup-account-preferences-fixtures.mjs

      - name: Build exact head
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-223-next.log 2>&1 &
          echo $! > /tmp/renderlab-223-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/settings > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-223-next.log
          exit 1

      - name: Verify configured profile and credential UX
        run: node scripts/verify-account-profile-credential.mjs

      - name: Verify configured product preferences UX
        run: node scripts/verify-account-preferences.mjs

      - name: Clean exact configured fixtures after verification
        if: always()
        run: |
          node scripts/cleanup-account-preferences-fixtures.mjs
          node scripts/verify-account-profile-credential.mjs --cleanup-only

      - name: Print app log on failure
        if: failure()
        run: cat /tmp/renderlab-223-next.log || true

      - name: Upload #223 profile and credential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-profile-credential-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/account-profile-credential
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload #220 preferences evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-preferences-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/account-preferences
          if-no-files-found: ignore
          retention-days: 14

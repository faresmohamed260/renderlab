name: Production User Audit 2026-09-17

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-production-user-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: https://renderlab.faresuniform.uk
      RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED: "true"
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
      RENDERLAB_GENERATION_BACKEND_URL: http://127.0.0.1:3010
      RENDERLAB_GENERATION_BACKEND_TOKEN: production-audit-cleanup-only
      RENDERLAB_TEST_ACCOUNT_SCOPE: production-user-audit-${{ github.run_id }}
      RENDERLAB_TEST_MFA_NAMESPACE: profile-mfa
      RENDERLAB_LIFECYCLE_ARTIFACT_DIR: artifacts/create
      RENDERLAB_LIBRARY_ARTIFACT_DIR: artifacts/library
      RENDERLAB_ACTIVITY_ARTIFACT_DIR: artifacts/activity
      RENDERLAB_PHASE25_ARTIFACT_DIR: artifacts/viewer
      RENDERLAB_PROFILE_CREDENTIAL_ARTIFACT_DIR: artifacts/account-profile-credential
      RENDERLAB_ACCOUNT_PREFERENCES_ARTIFACT_DIR: artifacts/account-preferences
      RENDERLAB_SESSION_ARTIFACT_DIR: artifacts/sessions
      RENDERLAB_ADMIN_ARTIFACT_DIR: artifacts/admin

    steps:
      - name: Checkout exact audit source
        uses: actions/checkout@v4

      - name: Guard exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Validate fixture secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Clean exact fixtures before audit
        shell: bash
        run: |
          node scripts/verify-create-lifecycle.mjs --cleanup-only
          node scripts/verify-library-lifecycle.mjs --cleanup-only
          node scripts/verify-activity.mjs --cleanup-only
          node scripts/verify-media-viewer-register-fold.mjs --cleanup-only
          node scripts/verify-account-profile-credential.mjs --cleanup-only
          node scripts/cleanup-account-preferences-fixtures.mjs
          node scripts/verify-admin-operations.mjs --cleanup-only

      - name: Audit signed-out Landing and shell
        run: node scripts/verify-brand-launch.mjs

      - name: Audit Create user lifecycle
        run: node scripts/verify-create-lifecycle.mjs

      - name: Audit Library upload browse filter selection and Viewer handoff
        run: node scripts/verify-library-lifecycle.mjs

      - name: Audit Media Viewer actions and responsive fold
        run: node scripts/verify-media-viewer-register-fold.mjs

      - name: Audit profile credential and signed-out auth UX
        run: node scripts/verify-account-profile-credential.mjs

      - name: Audit preferences and cross-device Create defaults
        run: node scripts/verify-account-preferences.mjs

      - name: Audit session controls
        run: node scripts/verify-session-controls.mjs

      - name: Clean exact fixtures after audit
        if: always()
        shell: bash
        run: |
          node scripts/verify-create-lifecycle.mjs --cleanup-only || true
          node scripts/verify-library-lifecycle.mjs --cleanup-only || true
          node scripts/verify-activity.mjs --cleanup-only || true
          node scripts/verify-media-viewer-register-fold.mjs --cleanup-only || true
          node scripts/verify-account-profile-credential.mjs --cleanup-only || true
          node scripts/cleanup-account-preferences-fixtures.mjs || true
          node scripts/verify-admin-operations.mjs --cleanup-only || true

      - name: Upload production user audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-user-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

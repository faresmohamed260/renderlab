name: Apply Gallery Rail lifecycle verifier correction

on:
  push:
    branches:
      - work/phase-24-library-gallery-rail
    paths:
      - .github/workflows/tmp-phase24-lifecycle-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-24-library-gallery-rail
          fetch-depth: 0

      - name: Apply verifier correction
        run: |
          node scripts/tmp_phase24_lifecycle_patch.mjs
          node --check scripts/verify-library-lifecycle.mjs
          git diff --check

      - name: Commit verifier correction and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase24-lifecycle-verifier.yml scripts/tmp_phase24_lifecycle_patch.mjs
          git add scripts/verify-library-lifecycle.mjs
          git commit -m "Align Library lifecycle verifier with Gallery Rail"
          git push origin HEAD:work/phase-24-library-gallery-rail

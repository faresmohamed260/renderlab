name: FIBO private gateway qualification deploy

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed commit SHA on protected main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fibo-private-gateway-qualification
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'faresmohamed260/renderlab' && github.ref == 'refs/heads/main' && inputs.candidate_sha == github.sha
    environment: fibo-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify RenderLab account ownership
        run: node --input-type=module -e 'import { assertRenderLabModalAccount } from "./scripts/lib/modal-project-ownership.mjs"; assertRenderLabModalAccount("modal-01");'
      - name: Test deployment guards without credentials
        run: python3 scripts/tests/test_fibo_deploy_guards.py
      - name: Install pinned Modal CLI
        run: |
          python3 -m venv "${RUNNER_TEMP}/modal-cli"
          "${RUNNER_TEMP}/modal-cli/bin/python" -m pip install 'modal==1.6.4'
      - name: Verify workspace and deploy private qualification gateway
        env:
          MODAL_TOKEN_ID: ${{ secrets.RENDERLAB_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.RENDERLAB_MODAL_TOKEN_SECRET }}
        run: bash scripts/deploy-fibo-qualification.sh

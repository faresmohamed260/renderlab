name: Apply Phase 6 closed-beta decision

on:
  push:
    branches:
      - docs/close-phase-6-closed-beta
    paths:
      - .github/workflows/apply-phase-6-close.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-phase-6-closed-beta
      - name: Record closed-beta Phase 6 completion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "PROJECT.md",
              "**Cycle 2 — Creative Productivity & Beta Maturity. Phase 6 baseline audit is in progress; verified evidence is complete pending the beta operating-boundary decision.**",
              "**Cycle 2 — Creative Productivity & Beta Maturity. Phase 6 is complete with Closed Beta selected as the operating boundary; user-reported production issues are the next triage gate before Phase 7 planning.**",
          )
          replace(
              "PROJECT.md",
              "- Current phase: **Phase 6 — Cycle 2 Baseline & Production Hardening**, execution `IN PROGRESS`.",
              "- Current phase: **Phase 6 — Cycle 2 Baseline & Production Hardening**, execution `COMPLETE`.",
          )
          replace(
              "PROJECT.md",
              "- Remaining Phase 6 gate: obtain and record the user's operating-boundary choice for private use vs closed beta vs broader beta.\n- Do not expand Phase 7 into its execution-ready contract until that Phase 6 gate is resolved and Phase 6 is formally closed.",
              "- Phase 6 operating boundary: **Closed Beta**, explicitly selected by the user on 2026-08-29.\n- Before expanding Phase 7 into its execution-ready contract, triage the user-reported problems in the current production product. Verified defects that affect correctness, security, privacy, core workflows or beta usability must be handled as narrow maintenance slices before new feature implementation; non-blocking enhancements may be assigned deliberately to the appropriate later phase.",
          )
          replace(
              "PROJECT.md",
              "- Evidence supports **closed beta** as the recommended operating boundary until Phase 10 addresses rate/concurrency/abuse controls and the Auth warning, but this remains a recommendation until the user explicitly selects the Cycle 2 operating boundary.",
              "- **Closed Beta** is the selected Cycle 2 operating boundary. Keep access controlled until Phase 10 addresses broader-access rate/concurrency/abuse controls and the Auth leaked-password-protection warning; broader beta remains a separate explicit decision.",
          )

          replace(
              "docs/ui/UI_MIGRATION.md",
              "**Current cycle:** Cycle 2 — Creative Productivity & Beta Maturity is in progress; Phase 6 baseline evidence is complete pending the operating-boundary decision.",
              "**Current cycle:** Cycle 2 — Creative Productivity & Beta Maturity is in progress; Phase 6 is complete with Closed Beta selected as the operating boundary.",
          )
          replace(
              "docs/ui/UI_MIGRATION.md",
              "**Current phase:** Phase 6 — Cycle 2 Baseline & Production Hardening is `IN PROGRESS`; remote production/capability audit `33250031468` passed and only the user-approved operating boundary remains before formal close.",
              "**Current phase:** Phase 6 — Cycle 2 Baseline & Production Hardening is `COMPLETE`; remote production/capability audit `33250031468` passed, exact fixtures were cleaned and the user selected Closed Beta on 2026-08-29.",
          )
          replace(
              "docs/ui/UI_MIGRATION.md",
              "**Current product slice:** None. Phase 6 is an audit/documentation phase; do not begin Phase 7 feature implementation while the operating-boundary gate remains open.",
              "**Current product slice:** None. Before Phase 7 contract expansion or feature implementation, triage the user-reported problems in the current production product and resolve any blocking defects through narrow maintenance slices.",
          )
          replace(
              "docs/ui/UI_MIGRATION.md",
              "**Current gate:** Record the user-approved Cycle 2 operating boundary (private use, closed beta or broader beta). Closed beta is the evidence-backed recommendation; no deployment is authorized by Phase 6.",
              "**Current gate:** Production-issue triage before Phase 7 planning. Closed Beta is the approved Cycle 2 operating boundary; Phase 6 authorizes no deployment by itself.",
          )
          replace(
              "docs/ui/UI_MIGRATION.md",
              "- [ ] Operating boundary remains a user decision. Current evidence supports **closed beta** as the recommendation until Phase 10 adds broader-access rate/concurrency/abuse hardening and addresses the Auth warning.",
              "- [x] Operating boundary selected: **Closed Beta**. Keep access controlled until Phase 10 adds broader-access rate/concurrency/abuse hardening and addresses the Auth warning; broader beta requires a separate explicit decision.",
          )
          replace(
              "docs/ui/UI_MIGRATION.md",
              "- [ ] The user-approved Cycle 2 beta operating boundary is recorded.",
              "- [x] The user-approved Cycle 2 beta operating boundary is recorded as **Closed Beta**.",
          )

          replace(
              "docs/architecture/INFRASTRUCTURE.md",
              "The verified technical baseline is healthy for continued controlled use. Because app-level generation rate/concurrency/abuse controls are absent, provider cost is not product-observable and leaked-password protection is disabled, **closed beta** is the recommended Cycle 2 operating boundary until Phase 10 hardens broader-access requirements. This is a recommendation only until the user explicitly selects the operating boundary.",
              "The verified technical baseline is healthy for continued controlled use. The user explicitly selected **Closed Beta** as the Cycle 2 operating boundary on 2026-08-29. Because app-level generation rate/concurrency/abuse controls are absent, provider cost is not product-observable and leaked-password protection is disabled, access remains controlled until Phase 10 hardens broader-access requirements. Any move to broader beta is a separate explicit decision.",
          )
          PY
          git config user.name "RenderLab Docs Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git commit -m "Close Phase 6 as closed beta"
          git push origin HEAD:docs/close-phase-6-closed-beta

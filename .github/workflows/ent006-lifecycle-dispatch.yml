name: ENT-006 Library Lifecycle dispatch

on:
  push:
    branches:
      - automation/ent006-lifecycle-dispatch
    paths:
      - .github/workflows/ent006-lifecycle-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-head Library Lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/faresmohamed260/renderlab/actions/workflows/library-lifecycle-visual.yml/dispatches \
            -d '{"ref":"hardening/ent-006-server-boundaries"}'

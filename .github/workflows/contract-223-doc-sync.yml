name: Sync 223 Contract Governance Docs

on:
  push:
    branches:
      - account/223-profile-credential-contract
    paths:
      - .github/workflows/contract-223-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout contract branch
        uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-contract
          fetch-depth: 1

      - name: Update authoritative contract state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing marker in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          project_old = "- The next default P1 Account & Settings planning lane is #223 Profile and credential UX baseline unless explicitly reprioritized. #220 remains P2 product preferences/notifications and #221 remains a passkeys/WebAuthn research lane."
          project_new = project_old + "\n- #223 now has execution contract `docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md` / UI-081 on this planning branch. It chooses a RenderLab-owned 1:1 profile keyed by immutable `auth.users.id`, ships display name + private avatar, deliberately defers username/handle until a real product namespace exists, and standardizes every current password field through one accessible reveal/Caps-Lock/password-manager contract. Implementation starts only after the contract merges; no schema/application/deployment change is part of the contract PR."
          replace_once("PROJECT.md", project_old, project_new)

          roadmap = Path("docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md")
          text = roadmap.read_text()
          text = text.replace(
              "**Status:** ACCEPTED ACTIVE ROADMAP / #215 + #216 + #217 + #218 + #219 PRODUCTION-LIVE / #220 + #221 + #223 REMAINING",
              "**Status:** ACCEPTED ACTIVE ROADMAP / #215 + #216 + #217 + #218 + #219 PRODUCTION-LIVE / #223 CONTRACTED NEXT / #220 + #221 REMAINING",
              1,
          )
          old_exec = "**Current execution:** #216 Session Controls, #217 MFA/privileged step-up, #218 secure sign-in-email change, and #219 Data & Privacy lifecycle are production-live from exact source `d18ef8833d46c812dac6b43572b3f4f7069990f8`. Guarded rollout `35022243427` produced READY deployment `dpl_BYvrAU1W3sPzSjJ5VHpa5p5P7jP7`; custom-domain smoke passed for root, Create, Library, Activity, Settings and Settings/Password, and the post-cutover runtime audit found no error clusters or error/fatal logs. The first candidate failed before cutover on missing Vercel `RESEND_API_KEY`/`CRON_SECRET`; configuration run `35022087690` added the protected production values without storing secrets in the repository, after which the clean rerun succeeded. #223 is the default remaining P1 account-maturity lane unless explicitly reprioritized; #220 remains P2 and #221 remains research."
          new_exec = "**Current execution:** #216 Session Controls, #217 MFA/privileged step-up, #218 secure sign-in-email change, and #219 Data & Privacy lifecycle are production-live from exact source `d18ef8833d46c812dac6b43572b3f4f7069990f8`. #223 is the next execution lane under `docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md` / UI-081: a RenderLab-owned 1:1 profile keyed by immutable `auth.users.id`; display name + private avatar; username/handle deferred until a real namespace consumer exists; and one reusable credential-field standard across every current password-entry surface. #223 implementation must extend #219 export/deletion/storage residue coverage before merge. This contract does not authorize hosted Auth mutation or production deployment. #220 remains P2 and #221 remains research."
          if old_exec not in text:
              raise SystemExit("roadmap current-execution marker missing")
          roadmap.write_text(text.replace(old_exec, new_exec, 1))

          migration_marker = "## Current Landing production closure — 2026-09-11"
          migration_insert = """## UI-081 / #223 Profile & credential UX baseline — contract
**Status: `CONTRACTED / IMPLEMENTATION NOT STARTED / NOT DEPLOYED`.**

- `docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md` is the execution gate for #223 and preserves UI-078 Trust Register as the Settings visual/IA authority rather than reopening Settings redesign.
- Planned product scope is optional display name plus private account avatar in a RenderLab-owned 1:1 profile keyed by immutable `auth.users.id`; username/handle is deliberately deferred because RenderLab has no current public profile/share/attribution namespace that consumes one.
- Avatar storage is separate from creative Library media, uses an owner-derived private profile namespace, and must join #219 export/deletion/purge/residue verification before implementation can merge.
- Credential UX is one reusable account password-field composition across signed-out sign-in, ordinary/recovery password replacement, email-change reauthentication and account-deletion reauthentication. Reveal/hide, Caps Lock advisory, paste/password-manager/autocomplete behavior and the real 15-character policy are binding; no secret may appear in evidence artifacts.
- This contract changes no production code, schema, hosted Auth state or deployment. Implementation begins only after the contract PR merges.

## Current Landing production closure — 2026-09-11"""
          replace_once("docs/ui/UI_MIGRATION.md", migration_marker, migration_insert)

          screen_marker = "Automatic Git → Vercel deployment remains disabled.\n\n## Application Shell"
          screen_insert = "Automatic Git → Vercel deployment remains disabled.\n\n**Next Settings extension:** UI-081 / #223 is contracted but not implemented. It will extend UI-078 Account with private display-name/avatar profile identity plus a subordinate `/settings/profile` editor, and standardize existing password fields without redesigning Settings. Username/handle remains deferred. Current production remains unchanged until a separately verified implementation and explicit deployment.\n\n## Application Shell"
          replace_once("docs/ui/SCREEN_REGISTRY.md", screen_marker, screen_insert)

          lifecycle_marker = "**Out of scope:** #223 profile/avatar/username implementation, linked identities, new billing/commercial retention, a new queue vendor, paid Vercel/Supabase plan changes, arbitrary security-activity history, legal-policy drafting, production deployment\n\n## 1. Purpose"
          lifecycle_insert = """**Out of scope:** #223 profile/avatar/username implementation, linked identities, new billing/commercial retention, a new queue vendor, paid Vercel/Supabase plan changes, arbitrary security-activity history, legal-policy drafting, production deployment

**Post-closure integration note — 2026-09-16:** #219 is now production-live. The #223 execution contract deliberately adds a RenderLab-owned profile row and private avatar object. #223 therefore must extend the account export schema, owner storage-key purge/proof, transactional product finalizer, database/R2 residue verification, maintenance recovery and configured two-account acceptance before #223 implementation may merge. Historical statements below correctly describe the #219 planning/closure baseline where no profile existed; they are not permission for new account-owned state to bypass the lifecycle registry.

## 1. Purpose"""
          replace_once("docs/architecture/DATA_EXPORT_RETENTION_ACCOUNT_DELETION_IMPLEMENTATION_CONTRACT.md", lifecycle_marker, lifecycle_insert)

          decisions = Path("docs/ui/UI_DECISIONS.md")
          decisions.write_text(decisions.read_text().rstrip() + """

### UI-081 — Profile and credential baseline extends UI-078 without redesign
**Status:** Accepted contract / implementation pending / not deployed  
**Date:** 2026-09-16

**Decision:** #223 is an Integration-Mode capability extension of the approved UI-078 Settings Trust Register, not a Settings redesign. RenderLab will own one private 1:1 profile record keyed by immutable `auth.users.id`; optional display name and a private account avatar ship as ordinary display identity, while sign-in email remains Auth identity and `renderlab_account_access` remains admission/role truth. The avatar is account-profile media in a dedicated private R2 namespace, not a creative `media_asset`, and it must participate in #219 export/deletion/purge/residue guarantees. A subordinate `/settings/profile` editor extends the existing Account row and retains Settings' 1/4-expressiveness hierarchy.

**Username decision:** Do not implement a username/handle in #223. Current RenderLab has no public profile, attribution/feed, sharing namespace, handle lookup or person-to-person collaboration surface that consumes one. Creating a unique namespace now would impose reserved-name, normalization, race, rename and impersonation policy without current product value. A future handle requires its own use-case-backed namespace contract.

**Credential decision:** All current password-entry contexts—signed-out sign-in, Current/New/Confirm password change/recovery, email-change Current-password reauthentication, and delete-account Current-password reauthentication—must compose one account-owned password-field component using maintained Field/Input/Button + Lucide mechanics. Password is hidden by default; Show/Hide has programmatic name/state and keyboard/touch parity; Caps Lock feedback is advisory where detectable; paste and password-manager behavior remain allowed; autocomplete semantics stay authoritative; sign-in/current-password fields never inherit a new-password minimum gate. New-password guidance derives from the shared current 15-character policy and does not invent character-class rules or a fake strength score.

**Lifecycle/security boundary:** Profile fields never grant ownership, access, role, Admin eligibility, MFA/session authority or admission. Implementation cannot merge until #219 account export moves to schema v2 for new exports and profile/avatar state joins deterministic R2 purge/proof, transactional finalization, residue verification, maintenance recovery and two-account acceptance. No raw R2 identity or secret values may reach product UI/evidence.

**Implementation gate:** `docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md` must merge before schema/application implementation starts. Exact-head implementation requires configured two-account profile/avatar lifecycle verification plus credential interaction coverage and the existing Account Identity, Account Data Lifecycle, Email Identity Change, Session Controls, MFA/security and normal engineering/UI regressions that repository path selection attaches. Production deployment and hosted Supabase Auth/password-policy mutation remain separately explicit operations.
""".lstrip())
          PY

          git rm .github/workflows/contract-223-doc-sync.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md docs/architecture/DATA_EXPORT_RETENTION_ACCOUNT_DELETION_IMPLEMENTATION_CONTRACT.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md
          git commit -m "docs: synchronize #223 contract authority"
          git push origin HEAD:account/223-profile-credential-contract

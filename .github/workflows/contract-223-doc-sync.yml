name: Sync 223 Contract Governance Docs

on:
  push:
    branches:
      - account/223-profile-credential-contract
    paths:
      - .github/workflows/contract-223-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-contract
          fetch-depth: 1
      - name: Apply documentation updates
        run: python scripts/contract-223-doc-sync.py
      - name: Commit synchronized authority
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/contract-223-doc-sync.yml scripts/contract-223-doc-sync.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md docs/architecture/DATA_EXPORT_RETENTION_ACCOUNT_DELETION_IMPLEMENTATION_CONTRACT.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md
          git commit -m "docs: synchronize #223 contract authority"
          git push origin HEAD:account/223-profile-credential-contract

name: Create v0.5 Fidelity Materializer

on:
  push:
    branches:
      - work/phase-23-create-fidelity-correction
    paths:
      - scripts/apply-create-v05-fidelity-correction.mjs
      - scripts/fix-create-v05-materializer.mjs
      - .github/workflows/create-v05-fidelity-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply fidelity correction
        run: |
          node scripts/fix-create-v05-materializer.mjs
          node --check scripts/apply-create-v05-fidelity-correction.mjs
          node scripts/apply-create-v05-fidelity-correction.mjs
          git diff --check
          git diff -- src/components/shell/app-shell.tsx src/features/create/create-workspace.tsx src/features/create/create-advanced-panel.tsx src/app/globals.css

      - name: Commit materialized product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/create/create-workspace.tsx src/features/create/create-advanced-panel.tsx src/app/globals.css
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git commit -m "fix(ui): restore approved Create v0.5 fidelity"
          git push origin HEAD:work/phase-23-create-fidelity-correction

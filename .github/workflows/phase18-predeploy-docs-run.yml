name: Phase 18 Predeploy Docs Run

on:
  push:
    branches:
      - work/phase-18-image-upscale
    paths:
      - .github/workflows/phase18-predeploy-docs-run.yml

permissions:
  contents: write

concurrency:
  group: renderlab-phase18-predeploy-docs-run
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = '2d3131478d7dfbe522dc6f3a645fadd134d73ac5'
          test "$(git merge-base HEAD origin/main)" = '2d3131478d7dfbe522dc6f3a645fadd134d73ac5'

      - name: Patch and validate docs
        shell: bash
        run: |
          set -euo pipefail
          python3 .phase18-predeploy-docs.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_MIGRATION.md)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Commit documentation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_MIGRATION.md
          git commit -m 'docs: record Phase 18A predeploy preparation'
          git push origin HEAD:work/phase-18-image-upscale

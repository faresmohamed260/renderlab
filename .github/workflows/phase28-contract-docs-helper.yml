name: Phase 28 contract docs helper

on:
  push:
    branches:
      - plan/phase-28-admin-system-continuity-contract
    paths:
      - '.github/workflows/phase28-contract-docs-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/phase-28-admin-system-continuity-contract
          fetch-depth: 0
      - name: Record approved Phase 28 decision and planning status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          decisions = Path('docs/ui/UI_DECISIONS.md')
          text = decisions.read_text()
          if '### UI-079 — Admin reuses the Settings Trust Register skeleton for system continuity' not in text:
              text = text.rstrip() + '''\n\n### UI-079 — Admin reuses the Settings Trust Register skeleton for system continuity\n**Status:** Accepted / user-approved design / implementation contract defined / not implemented / not deployed\n**Date:** 2026-09-13\n\n**Decision:** `/admin` adopts the user-approved **Admin System Continuity v0.2** direction for Phase 28. Admin remains a 1/4-expressiveness privileged utility surface and uses UI-078 Settings Trust Register as its binding structural parent: UI-074 compact horizontal shell, compact utility intro, one registered near-black object, numbered left label/value rows, precise 1px rules, restrained quarter-arc signature and the same desktop-to-390px label-band collapse. Activity / UI-077 may contribute technical microtype and internal dense-row separators only; it does not supply the Admin page skeleton.\n\n**Design authority:** the accepted R&D authority is draft PR #232 exact head `419a58c8c7877bab21673342775eb0650108412e`, focused run `34777699455`, artifact `10323843563`, digest `sha256:1ada86fbb81b19ee0da11dbadbc5bab1aa15f31b56652f64aabd8eac6001940b`, plus `design/rd/admin-system-continuity-v02.md` and the companion prototype on that head. The user explicitly approved the settled desktop and 390px direction on 2026-09-13. PR #231 / Operations Register v0.1 is rejected and closed unmerged; its Admin-specific operator/ledger scaffold is not production authority.\n\n**Product/security boundary:** UI-079 changes presentation only. The fresh active-admin route/API gate, RenderLab-only admitted-account directory, invitation behavior, role/status semantics, self-lockout and last-active-admin protections, typed global generation settings, nullable per-account override inheritance, transactional generation-admission behavior, bounded/sanitized Health definitions, privacy/truncation rules and current server/client ownership remain authoritative. No arbitrary shared Supabase Auth browsing, new operator action, metric, route, schema/API/RLS, Auth configuration, provider/worker/R2/storage change or deployment is approved.\n\n**Composition boundary:** production keeps exactly three top-level registered rows: `01 Access`, `02 Generation`, `03 Health`. Access retains invitation, pending-invitation and admitted-account controls. Generation keeps global defaults visibly parent to nullable account overrides. Health keeps the current four primary values plus six diagnostic groups and bounded explanatory copy, but reads as one operational field rather than a generic KPI dashboard. Ordinary maintained controls remain conventional and stationary. Narrow layouts preserve all current controls and truth; reducing repetition must not hide capability.\n\n**Implementation gate:** `docs/ui/ADMIN_SYSTEM_CONTINUITY_IMPLEMENTATION_CONTRACT.md` must merge with UI-079 before production Admin source changes. Exact-head implementation acceptance requires the existing Account/Admin Operations security/product assertions, Engineering Quality, UI Shell Validation and every workflow GitHub actually attaches, plus configured desktop/390px/reduced-motion browser evidence compared directly with the approved v0.2 design and Settings/UI-078 structural parent. Production deployment remains separately explicit.\n'''
              decisions.write_text(text)

          project = Path('PROJECT.md')
          text = project.read_text()
          old = '4. **Phase 28 — Admin:** roadmap only. Apply the coherent system to the privileged operational surface at 1/4 expressiveness while preserving dense clarity and authorization boundaries.'
          new = '4. **Phase 28 — Admin:** USER-APPROVED DESIGN / UI-079 CONTRACT DEFINED / IMPLEMENTATION NOT STARTED / NOT DEPLOYED. Admin System Continuity v0.2 uses Settings/UI-078 as the binding structural parent, preserves the existing privileged product/security contracts, and is authorized for implementation only after the Phase 28 contract/decision merge.'
          if old not in text:
              raise SystemExit('PROJECT Phase 28 roadmap line not found')
          project.write_text(text.replace(old, new, 1))

          migration = Path('docs/ui/UI_MIGRATION.md')
          text = migration.read_text()
          old = '- [ ] **Phase 28 Admin redesign — ROADMAP ONLY.** Expand only after the prior slice closes.'
          new = '- [ ] **Phase 28 Admin redesign — USER-APPROVED DESIGN / UI-079 CONTRACT DEFINED / IMPLEMENTATION NOT STARTED / NOT DEPLOYED.** Binding R&D authority is draft PR #232 head `419a58c8c7877bab21673342775eb0650108412e`, run `34777699455`, artifact `10323843563` (`sha256:1ada86fbb81b19ee0da11dbadbc5bab1aa15f31b56652f64aabd8eac6001940b`). Settings/UI-078 is the structural parent; rejected PR #231 remains closed unmerged. `docs/ui/ADMIN_SYSTEM_CONTINUITY_IMPLEMENTATION_CONTRACT.md` and UI-079 must merge before production Admin source changes.'
          if old not in text:
              raise SystemExit('UI_MIGRATION Phase 28 roadmap line not found')
          migration.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/phase28-contract-docs-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md .github/workflows/phase28-contract-docs-helper.yml
          git commit -m 'docs: record approved Phase 28 Admin contract'
          git push origin HEAD:plan/phase-28-admin-system-continuity-contract

name: Phase 20 precision and lifecycle treatment

on:
  push:
    branches:
      - work/phase-20-create-instrument
    paths:
      - .github/workflows/phase20-precision-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-20-create-instrument
          fetch-depth: 0
      - name: Apply precision and lifecycle slice
        run: python .github/scripts/phase20-precision-lifecycle.py
      - name: Validate and commit slice
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/phase20-precision-lifecycle.yml .github/scripts/phase20-precision-lifecycle.py
          git add src/app/globals.css src/features/create/create-workspace.tsx src/features/create/create-advanced-panel.tsx scripts/verify-create-lifecycle.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: deepen Phase 20 precision and lifecycle motion"
          git push origin HEAD:work/phase-20-create-instrument

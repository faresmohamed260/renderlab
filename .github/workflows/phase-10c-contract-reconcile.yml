name: Phase 10C Contract Reconcile

on:
  push:
    branches:
      - work/phase-10c-generation-admission-contract

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-10c-generation-admission-contract
          fetch-depth: 0
      - name: Reconcile reservation authority
        run: python .github/phase10c_contract_reconcile.py
      - name: Commit clean contract tree
        run: |
          rm .github/phase10c_contract_reconcile.py
          rm .github/workflows/phase-10c-contract-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ui/UI_MIGRATION.md docs/architecture/FRONTEND_ARCHITECTURE.md .github/phase10c_contract_reconcile.py .github/workflows/phase-10c-contract-reconcile.yml
          git commit -m "docs: reconcile Phase 10C reservation semantics"
          git push origin HEAD:work/phase-10c-generation-admission-contract

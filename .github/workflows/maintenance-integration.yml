name: Maintenance Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-maintenance.mjs"
      - "src/server/maintenance/**"
      - "src/server/observability/**"
      - "src/server/media/**"
      - "src/server/storage/**"
      - "src/app/api/internal/maintenance/**"
      - "supabase/migrations/0017_staging_cleanup_claims.sql"
      - ".github/workflows/maintenance-integration.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-maintenance.mjs"
      - "src/server/maintenance/**"
      - "src/server/observability/**"
      - "src/server/media/**"
      - "src/server/storage/**"
      - "src/app/api/internal/maintenance/**"
      - "supabase/migrations/0017_staging_cleanup_claims.sql"
      - ".github/workflows/maintenance-integration.yml"

permissions:
  contents: read

concurrency:
  group: renderlab-maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_MAINTENANCE_SECRET: phase15-configured-maintenance-secret
      RENDERLAB_MAINTENANCE_BATCH_LIMIT: "8"
      RENDERLAB_TEST_MAINTENANCE_OWNER_SCOPE: "true"
      RENDERLAB_TEST_MAINTENANCE_FAULTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve isolated maintenance owner
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { configuredTestAccountIdentity } from "./scripts/lib/configured-test-account.mjs";
          console.log(`RENDERLAB_TEST_MAINTENANCE_OWNER_ID=${configuredTestAccountIdentity("maintenance-owner").id}`);
          NODE

      - name: Build
        run: npm run build

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-maintenance-next.log 2>&1 &
          echo $! > /tmp/renderlab-maintenance-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-maintenance-next.log
          exit 1

      - name: Verify bounded maintenance semantics
        run: node scripts/verify-maintenance.mjs

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-maintenance-next.log || true

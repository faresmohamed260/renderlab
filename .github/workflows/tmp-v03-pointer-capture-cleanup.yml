name: Temporary v0.3 Pointer Capture Cleanup

on:
  push:
    branches:
      - rd/create-premium-workstation-v03
    paths:
      - ".github/workflows/tmp-v03-pointer-capture-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rd/create-premium-workstation-v03
          fetch-depth: 0
      - name: Remove redundant pointer capture
        run: python3 scripts/tmp-remove-v03-pointer-capture.py
      - name: Validate patch
        run: git diff --check
      - name: Remove one-shot helper
        run: git rm scripts/tmp-remove-v03-pointer-capture.py .github/workflows/tmp-v03-pointer-capture-cleanup.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/prototypes/create-lab-matrix-v03/prototype.js
          git commit -m "R&D: simplify reference drag pointer session"
          git push origin HEAD:rd/create-premium-workstation-v03

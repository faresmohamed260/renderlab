name: Narrow #216 roadmap closure edits

on:
  push:
    branches:
      - docs/216-session-controls-closure
    paths:
      - ".github/workflows/docs-216-roadmap-narrow.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/216-session-controls-closure
          fetch-depth: 0

      - name: Restore roadmap and apply surgical closure updates
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md")
          baseline = subprocess.check_output([
              "git", "show",
              "590c15f6fc9db9c107b3bc67fae80083fe0d55c4:docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md",
          ], text=True)
          text = baseline

          replacements = [
              (
                  "**Status:** ACCEPTED PLANNING BASELINE / #215 COMPLETE + VERIFIED + PRODUCTION-LIVE / NEXT CONTRACT PLANNING: #217\n**Current execution:** #215 is complete, verified and production-live. #215A established the 15-character hosted/application policy, branded security mail and current-plan hardening. #215B replaced the rejected Supabase paid-plan path with free RenderLab-owned HIBP Pwned Passwords k-anonymity screening and is live from exact source `f3f89d0859154b2ab45b5364ce1acb04a0eb204b` as Vercel deployment `dpl_44guHU58EZvh9mPfE6bAVfUtHZvh`. Supabase's native leaked-password warning is an accepted Free-plan limitation, not an open roadmap blocker. The next default contract-planning slice is #217 privileged MFA/step-up.",
                  "**Status:** ACCEPTED ACTIVE ROADMAP / #215 PRODUCTION-LIVE / #216 + #217 IMPLEMENTED + VERIFIED + MERGED + NOT DEPLOYED / NEXT CONTRACT PLANNING: #218\n**Current execution:** #215 is complete, verified and production-live. #217 MFA/privileged step-up and #216 Session Controls v0.1 are complete, verified and merged to `main`; neither was deployed as part of its implementation/closure work. #216 added privacy-safe live session inventory, local/others/global sign-out and live-session-aware private authorization. Security Activity remains deliberately deferred because the approved hosted project's database-backed Auth audit source was empty and no new audit-retention/PII policy was authorized. The next default contract-planning slice is #218 Identity and sign-in method management unless explicitly reprioritized. #223 remains an independent P1 profile/credential-UX lane."
              ),
              (
                  "- Settings sign-out currently calls Supabase JavaScript `signOut()` without a scope; current Supabase behavior makes that global sign-out and RenderLab's verifier proves a secondary session is revoked.\n- Private server identity resolution uses fresh Supabase `getUser()` state, so still-unexpired revoked bearer sessions fail private RenderLab authorization.",
                  "- Settings now exposes explicit Supabase `local`, `others` and `global` sign-out controls plus a privacy-safe active-session inventory with one verified current-session marker.\n- Private server authorization freshly verifies the user and JWT claims, then requires the verified `session_id` to remain present in the owner's live `auth.sessions`; revoked still-unexpired bearers therefore fail private RenderLab authorization immediately.\n- Session presentation exposes coarse browser/platform labels and timestamps only; raw user agent, IP/geolocation, tokens and provider Auth internals remain server-owned."
              ),
              ("- MFA/passkeys;", "- passkeys;"),
              ("- session inventory/security activity;", "- trustworthy user-facing Security Activity and exact arbitrary row-level session revoke;"),
              (
                  "#215 is closed; the next default P0 contract-planning slice is #217 privileged MFA/AAL2 step-up.",
                  "#215 is closed and production-live. #217 MFA/privileged step-up and #216 Session Controls v0.1 are closed at the implementation level, verified and merged but not deployed by those workstreams. The next default contract-planning slice is #218 Identity and sign-in method management."
              ),
              (
                  "- `auth.audit_log_entries` exists and can support a sanitized security-event surface if filtered through a trusted server boundary.",
                  "- `auth.audit_log_entries` exists, but the approved hosted project's database-backed table was empty during the #216 audit; it is not yet a verified complete source for a user-facing Security Activity feed."
              ),
              ("| MFA/TOTP | Security | Plan | P0/P1 / #217 |", "| MFA/TOTP | Security | Implemented: one TOTP factor; Admin AAL2; member enforcement once enrolled | COMPLETE / #217 |"),
              ("| MFA backup factor | Security/Recovery | Plan | P1 / #217 |", "| MFA backup factor | Security/Recovery | Rejected for initial #217; hosted factor cap is exactly one | #217 decision |"),
              ("| Recovery codes | Security/Recovery | Research supported secure contract before committing | #217 |", "| Recovery codes | Security/Recovery | Not adopted; operator-assisted lost-factor recovery is the current policy | #217 decision |"),
              ("| Sensitive-action reauth / sudo mode | Security | Plan | P0/P1 / #217 |", "| Sensitive-action reauth / sudo mode | Security | Implemented recent TOTP step-up where contracted | COMPLETE / #217 |"),
              ("| Recent security activity | Sessions & Security Activity | Plan | P1 / #216 |", "| Recent security activity | Sessions & Security Activity | Deferred until a trustworthy populated event source + privacy/retention contract exists | #216 follow-on |"),
              ("| Active session list | Sessions & Security Activity | Plan | P1 / #216 |", "| Active session list | Sessions & Security Activity | Implemented, privacy-safe owner-scoped projection | COMPLETE / #216 |"),
              ("| Current-session marker | Sessions & Security Activity | Plan | P1 / #216 |", "| Current-session marker | Sessions & Security Activity | Implemented from verified JWT `session_id` + live owner session | COMPLETE / #216 |"),
              ("| Revoke one session | Sessions & Security Activity | Research provider API first | P1 research / #216 |", "| Revoke one session | Sessions & Security Activity | Deferred: supported user Auth API currently exposes local/others/global, not arbitrary session UUID revoke | Provider-gated follow-on |"),
              ("| Sign out current/others/everywhere | Sessions & Security Activity | Plan | P1 / #216 |", "| Sign out current/others/everywhere | Sessions & Security Activity | Implemented with supported local/others/global scopes | COMPLETE / #216 |"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Roadmap replacement anchor not found: {old[:90]}")
              text = text.replace(old, new, 1)

          start = text.index("## 12. Workstream B — Session controls and security activity (#216)")
          end = text.index("## 13. Workstream C — MFA, recovery and privileged step-up (#217)")
          section_b = '''## 12. Workstream B — Session controls and security activity (#216)\n\n**Status:** SESSION CONTROLS v0.1 COMPLETE / VERIFIED / MERGED / NOT DEPLOYED. Security Activity remains deliberately deferred.\n\nImplementation authority: `docs/architecture/SESSION_CONTROLS_SECURITY_ACTIVITY_IMPLEMENTATION_CONTRACT.md`. PR #259 exact candidate `061b4bf49637b4fb09f0f1486b6a85f251ea6650` merged as `590c15f6fc9db9c107b3bc67fae80083fe0d55c4`.\n\nImplemented:\n\n- privacy-safe owner-scoped active-session inventory in Settings;\n- exactly one `This device` marker from freshly verified JWT `session_id` plus live provider session equality;\n- created/last-active timestamps and coarse browser/platform labels;\n- no IP/geolocation or raw user-agent display;\n- **Sign out this device** → `local`;\n- **Sign out other devices** → `others`;\n- **Sign out everywhere** → `global`;\n- private product/Admin authorization requires the verified session ID to remain in live owner-scoped `auth.sessions`, so revoked still-unexpired JWTs fail immediately;\n- migration `0019_renderlab_auth_session_projection.sql` provides the read-only service-role-only provider projection;\n- configured multi-session acceptance and fixture cleanup.\n\nThe hosted projection is verified `SECURITY DEFINER` with empty `search_path`, owner-scoped reads, no IP/token/factor projection, and execute unavailable to `PUBLIC`, `anon` and `authenticated`; only `service_role` (plus owner) can execute.\n\n### Explicitly deferred from #216 v0.1\n\n- arbitrary per-row `Revoke`: current supported user Auth APIs expose local/others/global but no supported exact owned-session UUID revoke; do not build a decorative or SQL-backed substitute;\n- Security Activity: the approved hosted project's `auth.audit_log_entries` database table was empty despite active Auth usage, so RenderLab did not imply a complete history or change audit retention/PII policy;\n- IP/geolocation, device fingerprint/trust and suspicious/new-device labels;\n- paid hosted session lifetime/inactivity/single-session policy changes.\n\nA future Security Activity slice must first establish a populated supported event source, retention/storage policy, privacy treatment, sanitized taxonomy and configured completeness evidence.\n\n'''
          text = text[:start] + section_b + text[end:]

          start = text.index("## 13. Workstream C — MFA, recovery and privileged step-up (#217)")
          end = text.index("## 14. Workstream D — Identity and sign-in method management (#218)")
          section_c = '''## 13. Workstream C — MFA, recovery and privileged step-up (#217)\n\n**Status:** COMPLETE / VERIFIED / MERGED / NOT DEPLOYED.\n**Priority delivered:** P0 Admin / P1 optional members.\n\nBinding current policy:\n\n- TOTP authenticator-app MFA only for the initial implementation;\n- exactly one enrolled TOTP factor per user, enforced by hosted `mfa_max_enrolled_factors = 1`;\n- ordinary-member MFA is optional to enroll, but private product access requires AAL2 once enrolled;\n- active Admin access and Admin operations require a verified factor and AAL2;\n- sensitive account/security operations use the contracted recent TOTP step-up where applicable;\n- recovery-email state never counts as MFA;\n- sole-factor replacement is recent step-up → remove factor → refresh to AAL1/no factor → immediately enroll/verify replacement;\n- active Admin authorization disappears during that replacement gap;\n- lost sole factor uses operator-assisted recovery with strong identity correlation, supported Supabase Admin MFA APIs and session revocation;\n- no backup-factor UI, home-grown recovery codes, security questions, SMS-first factor or email-only bypass under the current contract.\n\nDetailed authority: `docs/architecture/MFA_PRIVILEGED_STEP_UP_IMPLEMENTATION_CONTRACT.md` plus `docs/architecture/MFA_PRIVILEGED_STEP_UP_CONTRACT_AMENDMENT_1.md`. Do not reintroduce the superseded multi-factor/backup-factor assumption without a new provider-enforceable contract.\n\n'''
          text = text[:start] + section_c + text[end:]

          start = text.index("## 19. Proposed execution sequence")
          end = text.index("## 20. Cross-cutting implementation invariants")
          section_19 = '''## 19. Proposed execution sequence\n\nRenderLab's progressive-planning rule remains in force. Only the immediate selected workstream should receive an execution-ready phase contract.\n\nCompleted account-security foundation:\n\n1. **#215 — Auth & email hardening:** complete, verified and production-live.\n2. **#217 — MFA & privileged step-up:** complete, verified, merged; not deployed by that workstream.\n3. **#216 — Session Controls v0.1:** complete, verified, merged; not deployed by that workstream. Security Activity remains a separately gated follow-on.\n\nDefault next planning sequence unless explicitly reprioritized:\n\n4. **#218 — Identity management:** secure email change and current identity/admission edge cases now that step-up/session foundations exist.\n5. **#219 — Data/privacy lifecycle:** export, retention and owner-wide deletion from a verified ownership/data map.\n6. **#223 — Profile & credential UX baseline:** independent P1 basic-maturity work that may be selected earlier if the user prioritizes visible account basics; it must not alter canonical Auth/authorization semantics.\n7. **#220 — Preferences & product notifications:** only product-backed durable preferences/channels/accessibility overrides.\n8. **#221 — Passkeys:** promote from research only after stability/domain/recovery gates are satisfied.\n\nThe Phase 23–29 UI redesign program is already complete and production-live. This account-capability roadmap is a separate product/security program.\n\n'''
          text = text[:start] + section_19 + text[end:]

          old_mfa_validation = '''### MFA / recovery\n\n- enroll/challenge/verify;\n- AAL1 → AAL2 transition;\n- protected Admin/sensitive-action denial at AAL1;\n- factor removal/backup factor;\n- lost-factor recovery;\n- supported recovery-code lifecycle if adopted;\n- other-session behavior after factor changes;\n- exact MFA/recovery fixture cleanup.'''
          new_mfa_validation = '''### MFA / recovery\n\n- one-factor enroll/challenge/verify;\n- AAL1 → AAL2 transition;\n- protected Admin/sensitive-action denial at AAL1;\n- direct second-factor enrollment rejected by the hosted one-factor cap;\n- protected sole-factor remove/replace flow;\n- operator-assisted lost-factor recovery;\n- other-session behavior after factor changes;\n- exact MFA/recovery fixture cleanup.'''
          if old_mfa_validation not in text:
              raise SystemExit("MFA validation anchor not found")
          text = text.replace(old_mfa_validation, new_mfa_validation, 1)

          path.write_text(text)

      - name: Commit narrow roadmap reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md
          git commit -m "docs: reconcile roadmap after #216 and #217"
          git push origin HEAD:docs/216-session-controls-closure

name: Prepare Phase 24 Library contract

on:
  push:
    branches:
      - plan/phase-24-library-gallery-rail
    paths:
      - .github/workflows/tmp-phase24-contract.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: plan/phase-24-library-gallery-rail
          fetch-depth: 0

      - name: Record approved design and implementation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp_phase24_contract.py')
          s = p.read_text(encoding='utf-8')
          old = "decisions_path.write_text(decisions.rstrip() + ui075 + '\\n', encoding='utf-8')"
          new = "decisions_path.write_text(decisions.rstrip() + ui075.rstrip() + '\\n', encoding='utf-8')"
          if old not in s:
              raise SystemExit('expected decision writer not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/tmp_phase24_contract.py
          git diff --check
          git diff -- PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md docs/ui/LIBRARY_GALLERY_RAIL_IMPLEMENTATION_CONTRACT.md

      - name: Commit planning documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md docs/ui/LIBRARY_GALLERY_RAIL_IMPLEMENTATION_CONTRACT.md
          git commit -m "Define Phase 24 Library Gallery Rail contract"
          git push origin HEAD:plan/phase-24-library-gallery-rail

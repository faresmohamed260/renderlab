name: Execute Phase 27 decision record patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/phase-27-settings-trust-register
          fetch-depth: 0
      - name: Append UI-078
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit docs and remove staging workflows
        run: |
          git diff --check
          rm .github/workflows/phase27-contract-doc-patch.yml .github/workflows/phase27-contract-doc-final.yml
          git config user.name "RenderLab Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ui/UI_DECISIONS.md .github/workflows/phase27-contract-doc-patch.yml .github/workflows/phase27-contract-doc-final.yml
          git commit -m "docs: record UI-078 Settings Trust Register decision"
          git push origin HEAD:plan/phase-27-settings-trust-register

name: Apply UI-069 corrective batch

on:
  push:
    branches: [work/ui-069-create-viewer-library-correctives]
    paths:
      - ".github/workflows/apply-ui069-correctives.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 584e70603d49247b828930848e4e3c342a32d891
      BRANCH: work/ui-069-create-viewer-library-correctives
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"

      - name: Apply bounded corrective patch
        run: python .github/scripts/apply-ui069-correctives.py

      - name: Check candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f src/features/library/library-navigation-link.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify UI purity
        run: npm run verify:ui-purity

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git restore -- next-env.d.ts 2>/dev/null || true
          git rm .github/scripts/apply-ui069-correctives.py .github/workflows/apply-ui069-correctives.yml
          git add \
            src/features/create/create-workspace.tsx \
            src/features/library/library-navigation-link.tsx \
            src/features/library/library-view.tsx \
            src/features/library/library-collection-menu.tsx \
            src/features/library/library-sort-toggle.tsx \
            src/features/library/media-viewer.tsx \
            src/features/library/media-viewer-comparison.tsx \
            scripts/verify-create-lifecycle.mjs \
            scripts/verify-library-lifecycle.mjs \
            scripts/verify-library-history.mjs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/apply-ui069-correctives.py \
            .github/workflows/apply-ui069-correctives.yml \
            scripts/verify-create-lifecycle.mjs \
            scripts/verify-library-history.mjs \
            scripts/verify-library-lifecycle.mjs \
            src/features/create/create-workspace.tsx \
            src/features/library/library-collection-menu.tsx \
            src/features/library/library-navigation-link.tsx \
            src/features/library/library-sort-toggle.tsx \
            src/features/library/library-view.tsx \
            src/features/library/media-viewer-comparison.tsx \
            src/features/library/media-viewer.tsx | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Create drop, Viewer overflow, and Library navigation"
          git push origin HEAD:"$BRANCH"

name: Phase 23 Fix Mobile Result

on:
  push:
    branches:
      - work/phase-23-create-clear-composer
    paths:
      - .github/workflows/phase23-fix-mobile-result.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply correction
        run: python3 scripts/phase23-fix-mobile-result.py

      - name: Commit correction
        run: |
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git rm .github/workflows/phase23-fix-mobile-result.yml scripts/phase23-fix-mobile-result.py
          git add src/features/create/create-workspace.tsx src/app/globals.css scripts/verify-create-lifecycle.mjs
          git diff --cached --check
          git commit -m "Phase 23: keep mobile result actions above dock"
          git push origin HEAD:work/phase-23-create-clear-composer

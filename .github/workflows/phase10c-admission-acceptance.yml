name: Phase 10C Admission Acceptance

on:
  push:
    branches:
      - tmp/phase10c-postmigration-acceptance

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_GENERATION_BACKEND_URL: http://127.0.0.1:3020
      RENDERLAB_GENERATION_BACKEND_TOKEN: renderlab-generation-admission-ci-token
      RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED: "true"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: a0f8166e5a4c9057b7d2daf5bf338d8bdce3c8e1
      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "a0f8166e5a4c9057b7d2daf5bf338d8bdce3c8e1"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/renderlab-next.log || true
          exit 1
      - name: Verify configured Generation Admission
        run: node scripts/verify-generation-admission.mjs
      - name: Cleanup Generation Admission fixtures
        if: always()
        run: node scripts/verify-generation-admission.mjs --cleanup-only
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true
      - name: Upload Generation Admission screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-generation-admission-screenshots
          path: artifacts/generation-admission-*.png
          if-no-files-found: warn
          retention-days: 14

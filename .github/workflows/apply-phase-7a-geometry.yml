name: Apply Phase 7A geometry slice

on:
  push:
    branches: [work/phase-7a-geometry]
    paths:
      - "scripts/apply-phase-7a-geometry.py"
      - ".github/workflows/apply-phase-7a-geometry.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/phase-7a-geometry
          fetch-depth: 0

      - name: Apply geometry patch
        run: python scripts/apply-phase-7a-geometry.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify UI purity
        run: npm run verify:ui-purity

      - name: Keep workflow and generated-file changes separate
        run: |
          git checkout HEAD -- next-env.d.ts
          git checkout HEAD -- .github/workflows/generation-bridge-integration.yml
          git checkout HEAD -- .github/workflows/video-generation-integration.yml

      - name: Remove migration helpers
        run: rm scripts/apply-phase-7a-geometry.py .github/workflows/apply-phase-7a-geometry.yml

      - name: Validate diff
        run: |
          git add -A
          git diff --cached --check
          git status --short

      - name: Commit Phase 7A geometry slice
        run: |
          git config user.name "RenderLab Phase 7A Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git commit -m "Implement source-aware Create geometry"
          git push origin HEAD:work/phase-7a-geometry

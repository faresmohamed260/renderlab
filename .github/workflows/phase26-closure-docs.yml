name: Phase 26 Closure Documentation

on:
  push:
    branches:
      - ops/phase-26-closure-docs-20260913
    paths:
      - .github/workflows/phase26-closure-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/phase-26-activity-closure
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Record verified Phase 26 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          project = Path("PROJECT.md")
          text = project.read_text()
          text = replace_once(
              text,
              "**Status: ACTIVE — Landing, Create and Library completed; remaining product surfaces still require redesign.**",
              "**Status: ACTIVE — Landing, Create, Library, Media Viewer and Activity completed; Settings, Admin and final cohesion remain.**",
              "PROJECT redesign status",
          )
          text = replace_once(
              text,
              "- **Media Viewer:** approved Media Register + Source Fold v0.2 / UI-076, merged and merged-main verified, not yet deployed.\n- **Application shell:** UI-074 compact horizontal header is the current shared shell geometry and should be maintained/cohered rather than restarted as a competing navigation system.",
              "- **Media Viewer:** approved Media Register + Source Fold v0.2 / UI-076, merged and merged-main verified, not yet deployed.\n- **Activity:** approved Job Matrix + History Register v0.2 / UI-077, merged and merged-main verified, not yet deployed.\n- **Application shell:** UI-074 compact horizontal header is the current shared shell geometry and should be maintained/cohered rather than restarted as a competing navigation system.",
              "PROJECT completed slices",
          )
          text = replace_once(
              text,
              "2. **Phase 26 — Activity:** NEXT / ACTIVE R&D. Phase 25 evidence is closed; audit the current Activity desktop/390px real-state lifecycle, then develop same-family concepts at 2/4 expressiveness without weakening Retry / Run Again / Cancel truth or operational clarity. No production Activity implementation should begin before explicit design approval and an implementation contract.\n3. **Phase 27 — Settings / account-security flows:** roadmap only. Apply the shared typography, spacing, shell and trust language at 1/4 expressiveness across signed-out, signed-in, access-status, password and recovery states.",
              "2. **Phase 26 — Activity:** USER-APPROVED / EXACT-HEAD VERIFIED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED. Job Matrix + History Register v0.2 is now the repository-authoritative Activity composition under UI-077.\n3. **Phase 27 — Settings / account-security flows:** NEXT / R&D NOT STARTED. Apply the shared typography, spacing, shell and trust language at 1/4 expressiveness across signed-out, signed-in, access-status, password and recovery states.",
              "PROJECT roadmap",
          )
          text = replace_once(
              text,
              "Phase 25 is closed. The next session may expand only the immediate Phase 26 Activity R&D slice; Phases 27–29 remain roadmap-level until predecessor evidence exists.",
              "Phase 26 is closed. The next redesign slice is Phase 27 Settings / account-security; it remains unstarted and must follow the normal audit, design-approval and implementation-contract gates before production work. Phases 28–29 remain roadmap-level until predecessor evidence exists.",
              "PROJECT next phase",
          )
          closure = """
## Phase 26 Activity Job Matrix + History Register closure — 2026-09-13
- User-approved design authority remains R&D head `13bbfc32e5dabb5944943c1a704058aed6a1befc`, run `34722631963`, artifact `10307305396`, digest `sha256:5c440d5c1768fa6ea19a67165263c20d701ee9f2b50487e3a87246e7de8a9058`; UI-077 and `docs/ui/ACTIVITY_JOB_MATRIX_IMPLEMENTATION_CONTRACT.md` were merged before production work through planning PR #204 / `8b89f30322ab284b4233ebd6880c6fcb60dff819`.
- PR #205 implemented the approved three-job `01 / 02 / 03` Job Matrix plus attached History Register while preserving server-owned newest-first lifecycle truth, pagination, ownership, Retry / Run Again / Cancel semantics, sanitized errors, active-only refresh and the UI-074 shell. No schema/API/provider/worker/storage/auth/admission/ownership/generation-lifecycle contract changed.
- Final implementation head `db4d45320d6abd92e729a5fcae9a8f63ce79d3c4` passed all 10 directly attached workflows. Activity Visual `34755095367` produced artifact `10317550573` (`sha256:dbf866939fdb0787a5ea848a1b5c700e1d9bda864b431600ab8c5ecff24b35b6`), and human review accepted desktop, 390px, reduced-motion, signed-out, retrying, retry-success and retry-error evidence against the approved v0.2 direction.
- Generation Admission `34755095363` attempt 1 hit a transient Supabase 504 during fixture inspection/cleanup; unchanged attempt 2 passed completely. Release Candidate Matrix `34755095388` attempt 2 then passed the full 23/23 exact-SHA child matrix and produced manifest artifact `10317707403` (`sha256:125d0f85747eb26cba642591a8f62dc386e7a18b0375c86da85c1bb3dab17cc0`).
- PR #205 squash-merged to `main` as `2a49d7e223595cd2f876829a779d3f5d3c362e81`. All seven push workflows attached to that merge SHA have successful coverage: Engineering Quality `34756670745`, Creative Iteration `34756670762`, Integrated Release `34756670733`, Image Upscale Integration `34756670822`, Release Candidate Matrix `34756670731`, Activity Cancel Visual `34756670746`, and UI Shell Validation `34756670739` unchanged attempt 2 after attempt 1 was cancelled during the visual step. Merged-main Release Candidate Matrix `34756670731` passed its full configured child matrix and produced manifest artifact `10317304020` (`sha256:6ebdc3ea29cd08c31946c51a9bded64f8f1861ae6bbe21e22b840b6ab7230e9e`).
- Production remains unchanged at source `0173c4c5ba08360b6352331118abc81978cfa774` / READY deployment `dpl_3Smw21pn4PPQ1DzN7aaWmTuuf991`; automatic Git → Vercel deployment remains disabled.

**Phase 26 status: `USER-APPROVED / EXACT-HEAD VERIFIED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED`.**

"""
          marker = "## Current Verified Baseline — 2026-09-12"
          if closure.strip() in text:
              raise SystemExit("PROJECT closure already present")
          if marker not in text:
              raise SystemExit("PROJECT baseline marker missing")
          text = text.replace(marker, closure + "## Current Verified Baseline — 2026-09-13", 1)
          old_baseline = "- The verified repository application baseline is Phase 25 / PR #200 merge `b672c711f885092c5e92c42824078e7bd5bc691e`; Media Register + Source Fold v0.2 is user-approved, exact-head verified and merged-main verified. Production remains the separately approved source `0173c4c5ba08360b6352331118abc81978cfa774`; no production deployment followed the Phase 25 repository merge."
          new_baseline = "- The verified repository application baseline is Phase 26 / PR #205 merge `2a49d7e223595cd2f876829a779d3f5d3c362e81`; Job Matrix + History Register v0.2 is user-approved, exact-head verified and merged-main verified. Production remains the separately approved source `0173c4c5ba08360b6352331118abc81978cfa774`; no production deployment followed the Phase 26 repository merge."
          text = replace_once(text, old_baseline, new_baseline, "PROJECT verified baseline")
          project.write_text(text)

          migration = Path("docs/ui/UI_MIGRATION.md")
          text = migration.read_text()
          closure = """
## Phase 26 — Activity Job Matrix + History Register v0.2 closure — 2026-09-13
**Status: `USER-APPROVED / EXACT-HEAD VERIFIED / MERGED / MERGED-MAIN VERIFIED / NOT DEPLOYED`.**

- [x] User-approved design authority: R&D head `13bbfc32e5dabb5944943c1a704058aed6a1befc`, run `34722631963`, artifact `10307305396`, digest `sha256:5c440d5c1768fa6ea19a67165263c20d701ee9f2b50487e3a87246e7de8a9058`.
- [x] UI-077 and `docs/ui/ACTIVITY_JOB_MATRIX_IMPLEMENTATION_CONTRACT.md` merged before implementation through PR #204 / `8b89f30322ab284b4233ebd6880c6fcb60dff819`.
- [x] PR #205 preserved the existing Activity route, server-owned lifecycle/order/pagination/ownership, Retry / Run Again / Cancel semantics, sanitized errors, active-only refresh and UI-074 shell while implementing the approved `01 / 02 / 03` Job Matrix plus attached History Register.
- [x] Final implementation head `db4d45320d6abd92e729a5fcae9a8f63ce79d3c4` passed all 10 attached workflows; Activity Visual `34755095367` produced artifact `10317550573` (`sha256:dbf866939fdb0787a5ea848a1b5c700e1d9bda864b431600ab8c5ecff24b35b6`) and human review accepted desktop, 390px, reduced-motion, signed-out and retry temporal states.
- [x] Generation Admission `34755095363` unchanged attempt 2 passed after attempt 1 hit a transient Supabase 504. Release Candidate Matrix `34755095388` unchanged attempt 2 passed the complete 23/23 exact-SHA child matrix; manifest artifact `10317707403`, digest `sha256:125d0f85747eb26cba642591a8f62dc386e7a18b0375c86da85c1bb3dab17cc0`.
- [x] PR #205 squash-merged as `2a49d7e223595cd2f876829a779d3f5d3c362e81`. All seven workflows attached to merged `main` have successful coverage; UI Shell `34756670739` passed unchanged attempt 2 after attempt 1 cancellation, and merged-main Release Candidate Matrix `34756670731` passed its full child matrix with manifest artifact `10317304020` (`sha256:6ebdc3ea29cd08c31946c51a9bded64f8f1861ae6bbe21e22b840b6ab7230e9e`).
- [x] No schema/API/provider/worker/R2/auth/admission/ownership/routing/deployment contract changed.
- [ ] Production deployment remains separately explicit and automatic Git → Vercel deployment stays disabled.

"""
          marker = "## Active full-product redesign roadmap — after Phase 25"
          if closure.strip() in text:
              raise SystemExit("UI_MIGRATION closure already present")
          if marker not in text:
              raise SystemExit("UI_MIGRATION roadmap marker missing")
          text = text.replace(marker, closure + "## Active full-product redesign roadmap — after Phase 26", 1)
          text = replace_once(
              text,
              "- [ ] **Phase 26 Activity redesign — NEXT / ACTIVE R&D.** Phase 25 verified evidence is closed. Audit current Activity desktop/390px real job states, Retry / Run Again / Cancel, loading/empty/error behavior and real-state-driven motion; develop same-family concepts and obtain explicit design approval before any production implementation contract.\n- [ ] **Phase 27 Settings/account-security redesign — ROADMAP ONLY.** Expand only after the prior slice closes.",
              "- [x] **Phase 26 Activity redesign — COMPLETE / VERIFIED / MERGED / NOT DEPLOYED.** Job Matrix + History Register v0.2 is user-approved, exact-head verified, merged as `2a49d7e223595cd2f876829a779d3f5d3c362e81`, and merged-main verified.\n- [ ] **Phase 27 Settings/account-security redesign — NEXT / R&D NOT STARTED.** Expand only after the Phase 26 closure and follow the normal design-before-code gates.",
              "UI_MIGRATION roadmap",
          )
          migration.write_text(text)

          decisions = Path("docs/ui/UI_DECISIONS.md")
          text = decisions.read_text()
          text = replace_once(
              text,
              "**Status:** Accepted / user-approved design; implementation pending",
              "**Status:** Accepted / user-approved / implemented / exact-head verified / merged / merged-main verified / not deployed",
              "UI-077 status",
          )
          anchor = "Existing Motion for React plus CSS and RenderLab primitives are sufficient; no second animation runtime is approved."
          verification = """

**Implementation verification:** UI-077 plus `docs/ui/ACTIVITY_JOB_MATRIX_IMPLEMENTATION_CONTRACT.md` merged before production work through PR #204 / `8b89f30322ab284b4233ebd6880c6fcb60dff819`. PR #205 implemented the accepted composition at final exact head `db4d45320d6abd92e729a5fcae9a8f63ce79d3c4`; all 10 directly attached workflows passed, Activity Visual `34755095367` produced reviewed artifact `10317550573` (`sha256:dbf866939fdb0787a5ea848a1b5c700e1d9bda864b431600ab8c5ecff24b35b6`), and Release Candidate Matrix `34755095388` attempt 2 passed all 23 exact-SHA children with manifest artifact `10317707403` (`sha256:125d0f85747eb26cba642591a8f62dc386e7a18b0375c86da85c1bb3dab17cc0`). PR #205 squash-merged as `2a49d7e223595cd2f876829a779d3f5d3c362e81`; all seven merged-main workflows have successful coverage, including UI Shell `34756670739` unchanged attempt 2, while merged-main Release Candidate Matrix `34756670731` passed its full child matrix and produced manifest `10317304020` (`sha256:6ebdc3ea29cd08c31946c51a9bded64f8f1861ae6bbe21e22b840b6ab7230e9e`). Production deployment remains separately explicit and was not performed.
"""
          if "**Implementation verification:** UI-077" in text:
              raise SystemExit("UI-077 verification already present")
          text = replace_once(text, anchor, anchor + verification, "UI-077 verification anchor")
          decisions.write_text(text)

          registry = Path("docs/ui/SCREEN_REGISTRY.md")
          text = registry.read_text()
          old_status = "**Status:** APPROVED — Activity v0.1 / UI-035 + failed-job Retry / UI-050 + native Cancel / UI-055 + successful Run Again / UI-056 + Upscale lifecycle/recovery summary / UI-058"
          new_status = "**Status:** APPROVED — Job Matrix + History Register v0.2 / UI-077; existing Retry / Run Again / Cancel / Upscale lifecycle contracts preserved"
          text = replace_once(text, old_status, new_status, "Activity registry status")
          purpose = "**Purpose:** Show current/recent account-owned RenderLab `generation_jobs`, real execution state and actionable product recovery/control without exposing worker infrastructure as user responsibility."
          evidence = """

**Phase 26 / UI-077 closure — merged / verified:** Activity now renders the three newest visible jobs as the chronological asymmetric `01 / 02 / 03` Job Matrix and continues remaining visible jobs in the attached History Register without changing server ownership, newest-first truth, pagination, lifecycle states or action eligibility. Final exact head `db4d45320d6abd92e729a5fcae9a8f63ce79d3c4` passed all 10 attached workflows; Activity Visual `34755095367` / artifact `10317550573` (`sha256:dbf866939fdb0787a5ea848a1b5c700e1d9bda864b431600ab8c5ecff24b35b6`) was human-reviewed across desktop, 390px, reduced motion, signed-out and retry temporal states. Release Candidate Matrix `34755095388` attempt 2 passed 23/23 exact-SHA children. PR #205 merged as `2a49d7e223595cd2f876829a779d3f5d3c362e81`; all seven merged-main workflows have successful coverage and merged-main Release Candidate Matrix `34756670731` passed its full child matrix. Production remains unchanged pending separate authorization.
"""
          if "**Phase 26 / UI-077 closure — merged / verified:**" in text:
              raise SystemExit("Activity registry closure already present")
          text = replace_once(text, purpose, purpose + evidence, "Activity registry evidence")
          registry.write_text(text)
          PY

          git diff --check
          git diff -- PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md

      - name: Commit and push closure docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md
          git commit -m "Record Phase 26 Activity closure"
          git push origin HEAD:docs/phase-26-activity-closure

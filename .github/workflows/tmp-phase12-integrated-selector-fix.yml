name: Phase 12 integrated selector fix

on:
  push:
    branches: [work/phase-12-release-validation]
    paths:
      - .github/workflows/tmp-phase12-integrated-selector-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-12-release-validation
          fetch-depth: 0
      - name: Apply exact verifier fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-release-integrated.mjs')
          text = path.read_text()
          old = 'await page.getByRole("link", { name: "Open Create", exact: true }).waitFor({ state: "visible", timeout: 30_000 });'
          new = 'await page.getByRole("link", { name: "Open Create", exact: true }).first().waitFor({ state: "visible", timeout: 30_000 });'
          if text.count(old) != 1:
              raise SystemExit(f'expected one selector occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- scripts/verify-release-integrated.mjs
      - name: Commit fix and self-clean
        shell: bash
        run: |
          rm .github/workflows/tmp-phase12-integrated-selector-fix.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-phase12-integrated-selector-fix.yml scripts/verify-release-integrated.mjs | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: fix Phase 12 landing CTA selector"
          git push origin HEAD:work/phase-12-release-validation

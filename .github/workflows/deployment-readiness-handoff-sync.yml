name: Deployment Readiness Handoff Sync

on:
  push:
    branches:
      - work/deployment-readiness-v0-1

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Apply deployment readiness handoff sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deployment-readiness-v0-1
          fetch-depth: 0
      - run: node scripts/sync-deployment-readiness-handoff.mjs
      - run: git diff --check
      - name: Commit handoff and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/INFRASTRUCTURE.md
          git rm scripts/sync-deployment-readiness-handoff.mjs .github/workflows/deployment-readiness-handoff-sync.yml
          git commit -m "Document deployment readiness gate"
          git push origin HEAD:work/deployment-readiness-v0-1

name: Session Controls

on:
  pull_request:
    paths:
      - "src/lib/supabase/**"
      - "src/server/account/account-sessions.ts"
      - "src/app/(app)/settings/**"
      - "src/features/account/account-settings.tsx"
      - "src/features/account/account-settings.module.css"
      - "supabase/migrations/0019_renderlab_auth_session_projection.sql"
      - "scripts/verify-session-controls.mjs"
      - ".github/workflows/session-controls.yml"
      - "docs/architecture/SESSION_CONTROLS_SECURITY_ACTIVITY_IMPLEMENTATION_CONTRACT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED: "true"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate required Auth fixture secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured for RenderLab."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify configured verifier syntax
        run: node --check scripts/verify-session-controls.mjs

      - name: Build exact head
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-session-next.log 2>&1 &
          echo $! > /tmp/renderlab-session-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/settings > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-session-next.log || true
          exit 1

      - name: Verify configured session controls
        run: node scripts/verify-session-controls.mjs

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-session-next.log || true

      - name: Upload session-control screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-session-controls-screenshots
          path: artifacts/session-controls-*.png
          if-no-files-found: warn
          retention-days: 14

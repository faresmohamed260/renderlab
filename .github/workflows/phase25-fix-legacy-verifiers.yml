name: Phase 25 Fix Legacy Verifiers

on:
  push:
    branches:
      - work/phase-25-media-viewer-register-fold
    paths:
      - .github/workflows/phase25-fix-legacy-verifiers.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-25-media-viewer-register-fold
          fetch-depth: 0
      - name: Migrate stale Viewer locators to UI-076 semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/verify-library-lifecycle.mjs'): [(
                  '''  await page.getByRole("button", { name: "Details", exact: true }).click();\n  await page.getByText(/^uploaded image$/i).waitFor({ state: "visible", timeout: 30_000 });\n  await page.getByText("Upload", { exact: true }).waitFor({ state: "visible", timeout: 30_000 });\n  await page.getByText(fixtureFilename, { exact: true }).waitFor({ state: "visible", timeout: 30_000 });''',
                  '''  await page.getByRole("button", { name: "Details", exact: true }).click();\n  const detailsPanel = page.locator("#media-viewer-register-panel");\n  await detailsPanel.getByRole("heading", { name: "DETAILS", exact: true }).waitFor({ state: "visible", timeout: 30_000 });\n  await detailsPanel.getByText("Image", { exact: true }).waitFor({ state: "visible", timeout: 30_000 });\n  await detailsPanel.getByText("Upload", { exact: true }).waitFor({ state: "visible", timeout: 30_000 });\n  await detailsPanel.getByText(fixtureFilename, { exact: true }).waitFor({ state: "visible", timeout: 30_000 });'''
              )],
              Path('scripts/verify-creative-iteration.mjs'): [(
                  '''  await page.getByText("Result video", { exact: true }).waitFor({ state: "visible" });''',
                  '''  await page.locator("#media-viewer-comparison").getByText("RESULT", { exact: true }).waitFor({ state: "visible" });'''
              )],
              Path('scripts/verify-media-delete.mjs'): [(
                  '''  await page.getByRole("heading", { name: "RenderLab Delete Generated", exact: true }).waitFor({ state: "visible", timeout: 30_000 });\n  await page.getByRole("button", { name: "Delete", exact: true }).click();''',
                  '''  await page.getByRole("heading", { name: "RenderLab Delete Generated", exact: true }).waitFor({ state: "visible", timeout: 30_000 });\n  await page.getByRole("button", { name: "Manage", exact: true }).click();\n  await page.getByRole("button", { name: "Delete", exact: true }).click();'''
              )],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          node --check scripts/verify-library-lifecycle.mjs
          node --check scripts/verify-creative-iteration.mjs
          node --check scripts/verify-media-delete.mjs
          git diff --check
          git diff -- scripts/verify-library-lifecycle.mjs scripts/verify-creative-iteration.mjs scripts/verify-media-delete.mjs
      - name: Commit verifier-only locator migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-library-lifecycle.mjs scripts/verify-creative-iteration.mjs scripts/verify-media-delete.mjs
          git commit -m "Align legacy Viewer verifiers with UI-076"
          git push origin HEAD:work/phase-25-media-viewer-register-fold

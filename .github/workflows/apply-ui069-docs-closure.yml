name: Apply UI-069 documentation closure

on:
  push:
    branches:
      - docs/ui-069-corrective-closure

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact application merge baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="c71554b692864c84cd1bc9f796255fdde71eae43"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$expected"
          test "$(git rev-parse HEAD^)" = "$expected"
          changed="$(git diff --name-only "$expected"..HEAD)"
          test "$changed" = ".github/workflows/apply-ui069-docs-closure.yml"

      - name: Record verified UI-069 state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          project_old = "- Repository `main` additionally includes UI-068 / PR #138 as merge `c33539ae682d1d1d32cc4c0eb410ec94fd556666`: desktop Create omits redundant top-bar chrome and the unified Create composer owns the visible prompt focus boundary. This application change is verified but not production-deployed; live production remains source `0d584c5dab288ad1e99a7b7c1aac2a2ec12bf814` recorded above."
          project_new = "- Repository `main` additionally includes two verified post-production UI corrections not yet deployed: UI-068 / PR #138 merge `c33539ae682d1d1d32cc4c0eb410ec94fd556666` (desktop Create shell/composer focus cleanup) and UI-069 / PR #140 merge `c71554b692864c84cd1bc9f796255fdde71eae43` (Create reference drag/drop, Viewer narrow/intermediate containment, Library action alignment and explicit prefetch/pending feedback for URL/server-owned Library navigation). UI-069 exact PR head `cf065b62032d8b2d3be497b358b0b81067a99675` passed all 22 attached workflows and all six workflows attached to merged `main` passed. Live production remains source `0d584c5dab288ad1e99a7b7c1aac2a2ec12bf814` recorded above."
          replace_once("PROJECT.md", project_old, project_new)

          create_anchor = "- PNG/JPEG/WebP user reference input up to 25 MB;"
          create_insert = create_anchor + "\n- UI-069 adds optional desktop file drag/drop onto the Create composer for one reference image through the exact same durable upload/validation transaction as the maintained file picker; the picker remains the keyboard/touch/mobile baseline and no second upload path exists;"
          replace_once("docs/ui/SCREEN_REGISTRY.md", create_anchor, create_insert)

          library_anchor = "- `All / Images / Videos` URL-owned kind filter;"
          library_insert = library_anchor + "\n- UI-069 keeps Creatives/Uploads sections and All/Images/Videos filtering URL/server-owned while explicitly prefetching relevant destinations and exposing immediate link-pending feedback during dynamic server resolution; no client-owned media/filter dataset is introduced;"
          replace_once("docs/ui/SCREEN_REGISTRY.md", library_anchor, library_insert)

          library_actions_anchor = "- Favorites remains a compact Library toolbar filter, not a new top-level destination or client-only card filter."
          library_actions_insert = library_actions_anchor + "\n- UI-069 requires Favorites, Collections and chronological sort controls to share one true control baseline/height; closed collection-management disclosure content must not reserve phantom spacing in the toolbar."
          replace_once("docs/ui/SCREEN_REGISTRY.md", library_actions_anchor, library_actions_insert)

          viewer_anchor = "- responsive media-primary image/video presentation;"
          viewer_insert = viewer_anchor + "\n- UI-069 requires shrinkable min-content-safe Viewer layout/stage/rail composition and safe wrapping for long unbroken labels so intrinsic media or filenames cannot force horizontal viewport overflow at narrow/intermediate widths;"
          replace_once("docs/ui/SCREEN_REGISTRY.md", viewer_anchor, viewer_insert)

          decisions_path = Path("docs/ui/UI_DECISIONS.md")
          decisions = decisions_path.read_text()
          marker = "### UI-069 — Post-production Create / Viewer / Library corrective interaction pass"
          if marker in decisions:
              raise SystemExit("UI_DECISIONS.md: UI-069 marker already exists")
          decisions += """

### UI-069 — Post-production Create / Viewer / Library corrective interaction pass
**Status:** Accepted / Implemented / Verified / Merged
**Date:** 2026-09-09

**Decision:** User-directed production review adds four bounded corrections without reopening Create, Library or Viewer architecture. Desktop Create may accept one image file dropped onto the composer through the exact existing durable reference-upload transaction used by the file picker; the picker remains the keyboard/touch/mobile baseline. Media Viewer layout/stage/rail children must permit min-content shrinking, long unbroken titles/filenames must wrap safely and intrinsic media must not force horizontal viewport overflow at narrow or intermediate widths. Library Favorites / Collections / sort controls share one actual baseline and closed progressive-disclosure content may not reserve phantom spacing. Creatives↔Uploads and All↔Images↔Videos remain URL/server-owned; relevant destinations are explicitly prefetched and the activating link exposes immediate pending feedback while the dynamic authoritative server view resolves. No client-owned Library dataset/filter store is introduced.

**Verification:** Guarded pre-PR run `34411812191` passed exact-baseline diff validation, UI purity, lint, typecheck, unit tests and production build. Exact PR head `cf065b62032d8b2d3be497b358b0b81067a99675` passed all 22 attached workflows. Configured Create Lifecycle `34412081831` proved a real `DataTransfer` file drop used the durable upload ticket/completion transaction and continued through multi-reference behavior. Library History `34412081854` measured Favorites / Collections / sort centers and heights within 1px. Library Lifecycle `34412081785` used a deliberately long uploaded filename at a 700px Viewer viewport and proved no horizontal overflow with both stage and rail contained. Video Generation Integration `34412081743` passed the unchanged live Create Video / Animate Image ownership regression. Reviewed desktop/mobile/intermediate artifacts matched the intended correction.

PR #140 guarded squash-merged as `c71554b692864c84cd1bc9f796255fdde71eae43`. All six workflows GitHub attached to merged `main` passed: Engineering Quality `34413931082`, UI Shell Validation `34413931186`, Upscale Viewer Visual `34413931195`, Creative Iteration `34413931100`, Image Upscale Integration `34413931066` and Video Generation Integration `34413931077`.

**Consequences:** No schema, account/authorization, generation/provider/worker, R2/storage, route hierarchy or deployment contract changes. Automatic Git deployment remains disabled. This correction is verified/merged but not production-deployed; live production remains exact source `0d584c5dab288ad1e99a7b7c1aac2a2ec12bf814` at READY deployment `dpl_BpMCWYggKkzf8FuWpb2vLun46r3M`. UI-069 does not authorize or imply Phase 23 / Cycle 5.
"""
          decisions_path.write_text(decisions)

          migration_path = Path("docs/ui/UI_MIGRATION.md")
          migration = migration_path.read_text()
          migration_marker = "## Post-production UI-069 Create / Viewer / Library corrective pass — 2026-09-09"
          if migration_marker in migration:
              raise SystemExit("UI_MIGRATION.md: UI-069 marker already exists")
          migration += """

## Post-production UI-069 Create / Viewer / Library corrective pass — 2026-09-09
**Status: `COMPLETE / VERIFIED / MERGED / NOT YET PRODUCTION DEPLOYED`.**

- [x] Add optional desktop Create reference drag/drop through the existing durable image upload/validation path; keep the maintained file picker as the keyboard/touch/mobile baseline and introduce no second storage transaction.
- [x] Make Media Viewer min-content-safe at narrow/intermediate widths so intrinsic media and long unbroken title/filename text cannot widen or clip the page.
- [x] Align Library Favorites / Collections / sort controls on one actual baseline/height by removing closed-state phantom collection-manager spacing.
- [x] Keep Creatives/Uploads and All/Images/Videos URL/server-owned while explicitly prefetching relevant destinations and exposing immediate pending feedback during dynamic navigation; no client-owned Library media/filter store.
- [x] Guarded pre-PR run `34411812191` passed exact baseline/diff, UI purity, lint, typecheck, unit and production-build gates.
- [x] Exact PR head `cf065b62032d8b2d3be497b358b0b81067a99675` passed all 22 attached workflows. Direct acceptance included Create Lifecycle `34412081831` (real DataTransfer durable reference drop), Library History `34412081854` (≤1px action alignment), Library Lifecycle `34412081785` (700px long-filename Viewer containment/no overflow) and Video Generation Integration `34412081743` (unchanged live ownership regression). Reviewed rendered evidence was accepted.
- [x] PR #140 guarded squash-merged as `c71554b692864c84cd1bc9f796255fdde71eae43`.
- [x] Every workflow GitHub attached to merged `main` passed: Engineering Quality `34413931082`, UI Shell Validation `34413931186`, Upscale Viewer Visual `34413931195`, Creative Iteration `34413931100`, Image Upscale Integration `34413931066` and Video Generation Integration `34413931077`.
- [x] No schema, authorization, worker/provider, R2/storage, route hierarchy or deployment configuration changed. Automatic Git → Vercel deployment remains disabled.

Live production remains exact source `0d584c5dab288ad1e99a7b7c1aac2a2ec12bf814` at READY deployment `dpl_BpMCWYggKkzf8FuWpb2vLun46r3M`; UI-068 and UI-069 are therefore verified repository changes awaiting a separate explicit production rollout. No Phase 23 / Cycle 5 work is implied.
"""
          migration_path.write_text(migration)
          PY

      - name: Remove temporary helper and validate effective docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          base="c71554b692864c84cd1bc9f796255fdde71eae43"
          rm .github/workflows/apply-ui069-docs-closure.yml
          git diff --check
          mapfile -t files < <(git diff --name-only "$base" | sort)
          expected=(
            "PROJECT.md"
            "docs/ui/SCREEN_REGISTRY.md"
            "docs/ui/UI_DECISIONS.md"
            "docs/ui/UI_MIGRATION.md"
          )
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#sorted_expected[@]}"
          for i in "${!files[@]}"; do test "${files[$i]}" = "${sorted_expected[$i]}"; done

      - name: Commit documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md .github/workflows/apply-ui069-docs-closure.yml
          git commit -m "docs: record UI-069 corrective closure"
          git push origin HEAD:docs/ui-069-corrective-closure

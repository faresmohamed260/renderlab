name: Fix Create Advanced verifier

on:
  push:
    branches:
      - work/post-cycle3-create-control-density

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/post-cycle3-create-control-density
          fetch-depth: 0
      - name: Patch stale Creative Iteration verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-creative-iteration.mjs')
          text = path.read_text()
          old = '''  await videoSettings.waitFor({ state: "visible" });\n  await videoSettings.click();\n  await page.getByRole("menuitem", { name: "Advanced controls", exact: true }).click();'''
          new = '''  await videoSettings.waitFor({ state: "visible" });\n  const videoAdvancedButton = page.getByRole("button", { name: "Open Advanced controls", exact: true });\n  await videoAdvancedButton.waitFor({ state: "visible" });\n  await videoAdvancedButton.click();'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Advanced verifier block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          node --check scripts/verify-creative-iteration.mjs
          git diff --check
      - name: Commit verifier correction and remove helper
        shell: bash
        run: |
          git rm .github/workflows/fix-create-advanced-verifier.yml
          git add scripts/verify-creative-iteration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Creative Iteration Advanced verifier"
          git push origin HEAD:work/post-cycle3-create-control-density

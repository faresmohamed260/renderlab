name: Temporary #223 closure docs

on:
  push:
    branches:
      - account/223-profile-credential-implementation
    paths:
      - .github/workflows/_tmp-223-closure-docs.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-implementation
          fetch-depth: 0
      - name: Synchronize verified #223 source of truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one regex match, found {count}: {pattern[:90]!r}")
              p.write_text(updated)

          # PROJECT.md — verified current account-program state.
          exact(
              "PROJECT.md",
              "- The next default P1 Account & Settings planning lane is #223 Profile and credential UX baseline unless explicitly reprioritized. #220 remains P2 product preferences/notifications and #221 remains a passkeys/WebAuthn research lane.",
              "- Workstream #223 Profile and credential UX baseline is **IMPLEMENTED / EXACT-HEAD VERIFIED / HUMAN-REVIEWED / NOT DEPLOYED** in PR #271. The next default Account & Settings implementation lane is #220 Product preferences and notifications unless explicitly reprioritized; #221 remains passkeys/WebAuthn research.",
          )
          exact(
              "PROJECT.md",
              "- #223 now has execution contract `docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md` / UI-081 on this planning branch. It chooses a RenderLab-owned 1:1 profile keyed by immutable `auth.users.id`, ships display name + private avatar, deliberately defers username/handle until a real product namespace exists, and standardizes every current password field through one accessible reveal/Caps-Lock/password-manager contract. Implementation starts only after the contract merges; no schema/application/deployment change is part of the contract PR.",
              "- #223 now implements that contract: a RenderLab-owned 1:1 private profile keyed by immutable `auth.users.id`, optional normalized display name, deterministic private R2 avatar, `/settings/profile`, and one reusable account password-field interaction standard across every current password-entry surface. Username/handle remains deliberately deferred. Export schema v2, deterministic avatar purge/proof, transactional profile finalization, residue verification and maintenance are integrated into #219. Shared-project migration `0022_renderlab_account_profiles.sql` is applied; the production application deployment remains unchanged and separately explicit. Exact implementation-verification head `e49c0d366a9aafb0ff0194692c0b6d915fc480b3` passed the dedicated Account Profile Credential run `35062679531`, Account Data Lifecycle `35062679557`, Engineering Quality `35062679429`, UI Shell `35062679416`, Account Identity `35062679423`, Session Controls `35062679419`, MFA `35062679519`, Integrated Release `35062679421`, Account/Admin `35062679428`, Maintenance `35062679414`, Video Generation `35062679350` and every other non-email attached workflow. Email Identity Change run `35062679472` passed its local Settings/a11y and wrong-current-password checks but the initial attempt and one unchanged retry were stopped by hosted Supabase `429 email_change_rate_limited`; the same #218 email-change implementation previously passed its full configured acceptance and #223 does not change that backend flow.",
          )
          exact(
              "PROJECT.md",
              "- The next default Account & Settings contract-planning slice is #223 Profile and credential UX baseline unless explicitly reprioritized. #220 remains P2 and #221 remains research-oriented.",
              "- With #223 implemented and verified, the next default Account & Settings implementation/planning lane is #220 Product preferences and notifications unless explicitly reprioritized. #221 remains research-oriented passkeys/WebAuthn work.",
          )

          # Account roadmap — close #223 and leave only real remaining gaps.
          exact(
              "docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md",
              "**Status:** ACCEPTED ACTIVE ROADMAP / #215 + #216 + #217 + #218 + #219 PRODUCTION-LIVE / #223 CONTRACTED NEXT / #220 + #221 REMAINING",
              "**Status:** ACCEPTED ACTIVE ROADMAP / #215 + #216 + #217 + #218 + #219 PRODUCTION-LIVE / #223 IMPLEMENTED + VERIFIED / NOT DEPLOYED / #220 + #221 REMAINING",
          )
          regex_once(
              "docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md",
              r"\*\*Current execution:\*\* .*?\n\*\*Tracker:\*\* #213",
              "**Current execution:** #216 Session Controls, #217 MFA/privileged step-up, #218 secure sign-in-email change, and #219 Data & Privacy lifecycle are production-live from exact source `d18ef8833d46c812dac6b43572b3f4f7069990f8`. #223 is implemented and exact-head verified in PR #271 under `docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md` / UI-081: private display name + avatar keyed by immutable `auth.users.id`, username/handle deferred, and one reusable credential-field standard across every current password-entry surface. #219 export/deletion/storage-residue integration is complete and shared-project migration `0022_renderlab_account_profiles.sql` is applied. The #223 application is not production-deployed. #220 is the next default product lane; #221 remains research.\n**Tracker:** #213",
          )
          for old in [
              "- durable display name/profile identity;\n",
              "- user-managed avatar/profile picture;\n",
              "- one documented credential-field interaction standard across sign-in/recovery/password surfaces;\n",
          ]:
              exact("docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md", old, "")
          exact(
              "docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md",
              "The next default contract-planning slice is #223 Profile and credential UX baseline unless explicitly reprioritized.",
              "With #223 implemented and verified, the next default product lane is #220 Product preferences and notifications unless explicitly reprioritized; #221 remains research.",
          )

          # Infrastructure — record all live account-lifecycle/profile migrations.
          regex_once(
              "docs/architecture/INFRASTRUCTURE.md",
              r"(- `0019_renderlab_auth_session_projection\.sql` —[^\n]+\n)",
              r"\1- `0020_account_data_lifecycle.sql` — applied and verified for #219; adds server-only account lifecycle/export state, deletion freeze/quiescence, owner-wide product finalization and invitation de-identification support. RLS is enabled on lifecycle/export tables and browser roles have no direct grants; the production application now uses this boundary through the #219 rollout.\n- `0021_revoke_account_lifecycle_trigger_rpc_execute.sql` — applied #219 hardening that revokes callable RPC execute from the lifecycle trigger-only guard helpers so those SECURITY DEFINER routines remain trigger plumbing rather than browser/service RPC surface.\n- `0022_renderlab_account_profiles.sql` — applied and verified for #223 on 2026-09-16; adds private `renderlab_account_profiles` keyed by immutable `auth.users.id ON DELETE RESTRICT`, RLS enabled, zero `anon`/`authenticated` table privileges and service-role-only application access. It adds display-name/avatar lifecycle metadata, deleting-owner protection, and extends the service-role account-deletion finalizer to remove the profile row. Avatar bytes live in the deterministic private R2 key `renderlab/account-profiles/<owner-id>/avatar.webp`; no public/avatar bucket grant or browser-owned R2 key is introduced. The #223 application remains not production-deployed.\n",
          )
          exact(
              "docs/architecture/INFRASTRUCTURE.md",
              "Do not reapply migrations 0003 through 0019;",
              "Do not reapply migrations 0003 through 0022;",
          )

          # #223 execution contract — preserve contract but record closure.
          exact(
              "docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md",
              "**Status:** EXECUTION CONTRACT — implementation authorized after this contract merges; hosted Auth mutation and production deployment are not authorized  ",
              "**Status:** IMPLEMENTED + EXACT-HEAD VERIFIED — contract remains binding; production application deployment remains separately explicit and no hosted Auth/password-policy mutation was performed by #223  ",
          )
          exact(
              "docs/architecture/PROFILE_CREDENTIAL_UX_BASELINE_IMPLEMENTATION_CONTRACT.md",
              "**Out of scope:** public profiles, username/handle namespace implementation, bio/pronouns/location/social fields, linked identities, passkeys, independent recovery methods, notification/preferences work, hosted password-policy mutation, public sharing routes, production deployment\n",
              "**Out of scope:** public profiles, username/handle namespace implementation, bio/pronouns/location/social fields, linked identities, passkeys, independent recovery methods, notification/preferences work, hosted password-policy mutation, public sharing routes, production deployment\n**Implementation verification:** PR #271 implementation-verification head `e49c0d366a9aafb0ff0194692c0b6d915fc480b3` passed Account Profile Credential `35062679531`, Account Data Lifecycle `35062679557`, Engineering `35062679429`, UI Shell `35062679416`, Account Identity `35062679423`, Session Controls `35062679419`, MFA `35062679519`, Integrated Release `35062679421`, Account/Admin `35062679428`, Maintenance `35062679414`, Video Generation `35062679350` and every other non-email attached workflow. The dedicated profile artifact `10432827873` (`sha256:79e27a2998adf76d3150e1a296cfd87bdbe98eb35948468bf366a2deaf50583c`) was human-reviewed clean across desktop, 390px and reduced motion with no credential secret visible. Email Identity Change `35062679472` was blocked at the hosted Supabase correct-current-password initiation boundary by repeat `429 email_change_rate_limited` after its local UI/a11y and wrong-password assertions passed; #223 changes no email-change backend contract. Migration `0022_renderlab_account_profiles.sql` is applied to the approved shared project.\n",
          )

          # #219 registry note — integration is now realized, not future work.
          exact(
              "docs/architecture/DATA_EXPORT_RETENTION_ACCOUNT_DELETION_IMPLEMENTATION_CONTRACT.md",
              "**Post-closure integration note — 2026-09-16:** #219 is now production-live. The #223 execution contract deliberately adds a RenderLab-owned profile row and private avatar object. #223 therefore must extend the account export schema, owner storage-key purge/proof, transactional product finalizer, database/R2 residue verification, maintenance recovery and configured two-account acceptance before #223 implementation may merge. Historical statements below correctly describe the #219 planning/closure baseline where no profile existed; they are not permission for new account-owned state to bypass the lifecycle registry.",
              "**Post-closure integration note — 2026-09-16:** #219 is production-live and #223 has now completed the required lifecycle registration. New account exports use schema version 2 and include safe profile/display/avatar metadata plus an authenticated avatar download path without exposing R2 identity. The deterministic profile-avatar key participates in owner storage purge/proof even if profile metadata is stale; `renderlab_account_profiles` participates in transactional finalization and database residue verification; `purge_pending` avatar cleanup participates in daily maintenance; and configured two-account acceptance proves deletion/non-interference. Exact #223 Account Data Lifecycle run `35062679557` passed on implementation-verification head `e49c0d366a9aafb0ff0194692c0b6d915fc480b3`. Historical statements below correctly describe the original #219 planning/closure baseline where no profile existed; this note records the now-realized additive registry extension.",
          )

          # UI migration status — replace the contract-only block with verified closure.
          regex_once(
              "docs/ui/UI_MIGRATION.md",
              r"## UI-081 / #223 Profile & credential UX baseline — contract\n.*?(?=\n## Current Landing production closure)",
              """## UI-081 / #223 Profile & credential UX baseline — implementation closure
**Status: `IMPLEMENTED / EXACT-HEAD VERIFIED / HUMAN-REVIEWED / NOT DEPLOYED`.**

- PR #271 implements the merged #223/UI-081 contract without reopening UI-078: private optional display name, deterministic private avatar, subordinate `/settings/profile`, and Profile-before-sign-in-identity composition inside Account.
- Shared `AccountPasswordField` now owns current password-entry interaction across signed-out sign-in, password change/recovery, email-change reauthentication and account-deletion reauthentication: hidden by default, accessible Show/Hide state, independent reveal state, Caps Lock advisory, paste/password-manager-safe behavior, correct autocomplete semantics, real 15-character new-password guidance and textual confirmation matching.
- Migration `0022_renderlab_account_profiles.sql` is applied to the approved shared Supabase project. Profile metadata is server-owned/RLS-enabled with no browser table grants; avatar bytes use one owner-derived private R2 key and remain outside Library/media/generation identity.
- #219 integration is complete: new exports are schema v2 with safe profile metadata, avatar storage joins deterministic purge/proof, profile rows join transactional finalization/residue verification, and `purge_pending` avatar state joins maintenance recovery. Exact Account Data Lifecycle run `35062679557` passed.
- Exact implementation-verification head `e49c0d366a9aafb0ff0194692c0b6d915fc480b3` passed Account Profile Credential `35062679531`, Engineering `35062679429`, UI Shell `35062679416`, Account Identity `35062679423`, Session Controls `35062679419`, MFA `35062679519`, Account/Admin `35062679428`, Maintenance `35062679414`, Integrated Release `35062679421`, Video Generation `35062679350` and every other non-email attached workflow. Account Profile Credential artifact `10432827873` has digest `sha256:79e27a2998adf76d3150e1a296cfd87bdbe98eb35948468bf366a2deaf50583c`.
- Human review of the dedicated artifact accepted desktop, 390px and reduced-motion profile/crop/credential states as faithful to UI-078/UI-081, overflow-free and secret-free.
- Email Identity Change run `35062679472` passed fixture cleanup, build, Settings desktop/mobile/a11y and wrong-current-password assertions on both attempts, but hosted Supabase returned `429 email_change_rate_limited` at correct-current-password change initiation on the original attempt and the single unchanged retry. The same #218 email-change implementation previously passed full configured acceptance (`34962080182` attempt 3), and #223 changes no email-change backend flow; the hosted rate limit is therefore recorded rather than worked around.
- Username/handle remains deliberately deferred. Production application deployment remains unchanged at source `d18ef8833d46c812dac6b43572b3f4f7069990f8` / READY `dpl_BYvrAU1W3sPzSjJ5VHpa5p5P7jP7`; automatic Git → Vercel deployment remains disabled.
""",
          )

          # UI decision — status and implementation evidence.
          exact(
              "docs/ui/UI_DECISIONS.md",
              "**Status:** Accepted contract / implementation pending / not deployed",
              "**Status:** Accepted / implemented / exact-head verified / human-reviewed / not deployed",
          )
          decisions = Path("docs/ui/UI_DECISIONS.md")
          decision_text = decisions.read_text()
          marker = "**Implementation verification:** PR #271 implementation-verification head"
          if marker in decision_text:
              raise SystemExit("docs/ui/UI_DECISIONS.md: implementation verification already present")
          if "### UI-081 — Profile and credential baseline extends UI-078 without redesign" not in decision_text:
              raise SystemExit("docs/ui/UI_DECISIONS.md: UI-081 marker missing")
          decision_text = decision_text.rstrip() + "\n\n**Implementation verification:** PR #271 implementation-verification head `e49c0d366a9aafb0ff0194692c0b6d915fc480b3` passed the dedicated Account Profile Credential run `35062679531`, Account Data Lifecycle `35062679557`, Engineering Quality `35062679429`, UI Shell `35062679416`, Account Identity `35062679423`, Session Controls `35062679419`, MFA `35062679519`, Account/Admin `35062679428`, Maintenance `35062679414`, Integrated Release `35062679421`, Video Generation `35062679350` and every other non-email attached workflow. Dedicated artifact `10432827873` (`sha256:79e27a2998adf76d3150e1a296cfd87bdbe98eb35948468bf366a2deaf50583c`) was human-reviewed clean at desktop, 390px and reduced motion with no credential secret visible. Email Identity Change `35062679472` passed its local Settings/a11y and wrong-password assertions but both the original attempt and one unchanged retry were stopped by hosted Supabase `429 email_change_rate_limited` at correct-current-password initiation; the established #218 backend previously passed full configured acceptance and #223 changes no email-change backend semantics. Shared-project migration `0022_renderlab_account_profiles.sql` is applied. No production application deployment was performed.\n"
          decisions.write_text(decision_text)

          # Screen registry — actual route/status, not future tense.
          exact(
              "docs/ui/SCREEN_REGISTRY.md",
              "**Next Settings extension:** UI-081 / #223 is contracted but not implemented. It will extend UI-078 Account with private display-name/avatar profile identity plus a subordinate `/settings/profile` editor, and standardize existing password fields without redesigning Settings. Username/handle remains deferred. Current production remains unchanged until a separately verified implementation and explicit deployment.",
              "**Current repository Settings extension:** UI-081 / #223 is implemented, exact-head verified and human-reviewed in PR #271 but not production-deployed. UI-078 Account now composes private display-name/avatar profile identity plus subordinate `/settings/profile`, and all current password-entry surfaces share the approved account credential-field interaction standard. Username/handle remains deferred. Current production remains unchanged until an explicit deployment.",
          )
          exact(
              "docs/ui/SCREEN_REGISTRY.md",
              "## Screens\n\n### Brand / Landing",
              """## Screens

### Settings Profile
**Route:** `/settings/profile`  
**Status:** APPROVED — UI-081 implementation verified / not deployed  
**Implementation:** `src/app/(app)/settings/profile/page.tsx`, `src/features/account/account-profile-form.tsx`, `src/features/account/account-profile-identity.tsx`  
**Purpose:** Edit optional private display name and private account avatar without changing sign-in identity, admission, role, ownership or public visibility.  
**Composition:** subordinate UI-078 Trust Register continuation; square avatar crop supports pointer/touch pan plus keyboard controls, zoom/reset, deterministic replacement/removal and neutral fallback when no display identity exists. Username/handle, public profile and social identity are intentionally absent.  
**Verification:** exact head `e49c0d366a9aafb0ff0194692c0b6d915fc480b3`, Account Profile Credential `35062679531`, artifact `10432827873` (`sha256:79e27a2998adf76d3150e1a296cfd87bdbe98eb35948468bf366a2deaf50583c`), human-reviewed at desktop and reduced-motion 390px. Production deployment remains separate.

### Brand / Landing""",
          )

          # Component catalog — reusable account credential composition is now repository reality.
          exact(
              "docs/ui/COMPONENT_CATALOG.md",
              "### AppShell\n",
              """### AccountPasswordField
**Status:** APPROVED  
**Source:** `src/features/account/account-password-field.tsx`  
**Origin:** RenderLab account-owned composition over maintained Field/Input/Button + Lucide mechanics  
**Purpose:** One reusable password-entry interaction standard without moving account policy into the generic Input primitive.  
**Used by:** signed-out Settings sign-in, `/settings/password` Current/New/Confirm fields, `/settings/email` current-password reauthentication, and Data & Privacy account-deletion current-password reauthentication.  
**Reuse rules:** hidden by default; accessible Show/Hide name + pressed state; independent reveal state per field; Caps Lock advisory where detectable; paste/password managers allowed; preserve authoritative `current-password` vs `new-password` autocomplete; apply the real 15-character guidance only to new-password establishment and keep HIBP screening out of per-keystroke interaction.  

name: Phase 13B Email Configuration Corrected

on:
  push:
    branches: [work/phase-13b-email-config]
    paths:
      - ".github/workflows/phase-13b-email-config-corrected.yml"

permissions:
  contents: read

jobs:
  configure-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rashyleshocuvpgcooxy
      SITE_URL: https://renderlab.faresuniform.uk
      INVITE_REDIRECT: https://renderlab.faresuniform.uk/settings
      RECOVERY_REDIRECT: https://renderlab.faresuniform.uk/auth/confirm?type=recovery&next=/settings/password

    steps:
      - name: Verify existing Management API credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured."; exit 1; }
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=true"

      - name: Audit hosted MFA configuration without mutation
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          curl --fail-with-body --silent --show-error \
            --user-agent 'RenderLab-217-MFAConfigAudit/1.0' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "$endpoint" -o /tmp/auth-config.json

          python - <<'PY'
          import json, os
          from pathlib import Path

          d = json.loads(Path('/tmp/auth-config.json').read_text())
          if d.get('site_url') != os.environ['SITE_URL']:
              raise SystemExit('Unexpected Site URL')
          allow = [x.strip() for x in str(d.get('uri_allow_list') or '').split(',') if x.strip()]
          for required in (os.environ['INVITE_REDIRECT'], os.environ['RECOVERY_REDIRECT']):
              if required not in allow:
                  raise SystemExit('Required redirect missing')
          if d.get('smtp_host') != 'smtp.resend.com':
              raise SystemExit('Unexpected SMTP host')
          if int(d.get('password_min_length') or -1) != 15:
              raise SystemExit('Hosted password minimum drifted')
          if d.get('password_required_characters') not in (None, ''):
              raise SystemExit('Hosted required-character policy drifted')
          if d.get('mailer_notifications_mfa_factor_enrolled_enabled') is not True:
              raise SystemExit('MFA enrollment security notification is not enabled')
          if d.get('mailer_notifications_mfa_factor_unenrolled_enabled') is not True:
              raise SystemExit('MFA removal security notification is not enabled')

          value = d.get('mfa_max_enrolled_factors')
          if not isinstance(value, int):
              raise SystemExit(f'Hosted Auth did not expose integer mfa_max_enrolled_factors: {value!r}')

          print(f'RENDERLAB_217_MFA_MAX_ENROLLED_FACTORS={value}')
          print(f'RENDERLAB_217_MFA_TOTP_ENROLL_ENABLED={str(d.get("mfa_totp_enroll_enabled")).lower()}')
          print(f'RENDERLAB_217_MFA_TOTP_VERIFY_ENABLED={str(d.get("mfa_totp_verify_enabled")).lower()}')
          print('RENDERLAB_217_MFA_SECURITY_NOTIFICATIONS_ENABLED=true')
          print('RENDERLAB_217_HOSTED_AUTH_BASELINE_OK=true')
          PY

name: Phase 13B Email Configuration Corrected

on:
  push:
    branches: [work/phase-13b-email-config]
    paths:
      - ".github/workflows/phase-13b-email-config-corrected.yml"

permissions:
  contents: read

jobs:
  configure-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rashyleshocuvpgcooxy
      SITE_URL: https://renderlab.faresuniform.uk
      INVITE_REDIRECT: https://renderlab.faresuniform.uk/settings
      RECOVERY_REDIRECT: https://renderlab.faresuniform.uk/auth/confirm?type=recovery&next=/settings/password

    steps:
      - name: Verify existing Management API credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured."; exit 1; }
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=true"

      - name: Apply guarded 6-to-15 password minimum transition
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"

          read_auth() {
            curl --fail-with-body --silent --show-error \
              --user-agent 'RenderLab-215A-PasswordPolicy/1.0' \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "$endpoint" -o "$1"
          }

          patch_auth() {
            curl --fail-with-body --silent --show-error \
              --user-agent 'RenderLab-215A-PasswordPolicy/1.0' \
              --request PATCH \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header 'content-type: application/json' \
              --data-binary @"$1" \
              "$endpoint" -o "$2"
          }

          read_auth /tmp/auth-before.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/auth-before.json').read_text())
          if d.get('site_url') != os.environ['SITE_URL']:
              raise SystemExit('Unexpected Site URL; refusing mutation')
          allow=[x.strip() for x in str(d.get('uri_allow_list') or '').split(',') if x.strip()]
          for required in (os.environ['INVITE_REDIRECT'], os.environ['RECOVERY_REDIRECT']):
              if required not in allow:
                  raise SystemExit('Required redirect missing; refusing mutation')
          if d.get('smtp_host') != 'smtp.resend.com':
              raise SystemExit('Unexpected SMTP host; refusing mutation')
          if int(d.get('password_min_length') or -1) != 6:
              raise SystemExit(f"Expected hosted password minimum 6 before transition, got {d.get('password_min_length')!r}")
          if d.get('password_required_characters') not in (None, ''):
              raise SystemExit('Unexpected required-character policy; refusing mutation')
          Path('/tmp/auth-patch.json').write_text(json.dumps({'password_min_length':15}))
          Path('/tmp/auth-rollback.json').write_text(json.dumps({'password_min_length':6}))
          print('RENDERLAB_215A_PASSWORD_MINIMUM_BEFORE=6')
          print('RENDERLAB_215A_BASELINE_ASSERTIONS_OK=true')
          PY

          mutated=false
          rollback() {
            if [ "$mutated" = true ]; then
              echo "RENDERLAB_215A_PASSWORD_POLICY_ROLLBACK_ATTEMPTED=true"
              patch_auth /tmp/auth-rollback.json /tmp/auth-rollback-response.json || true
            fi
          }
          trap rollback ERR

          patch_auth /tmp/auth-patch.json /tmp/auth-patch-response.json
          mutated=true
          read_auth /tmp/auth-after.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/auth-after.json').read_text())
          if int(d.get('password_min_length') or -1) != 15:
              raise SystemExit('Hosted password minimum did not read back as 15')
          if d.get('password_required_characters') not in (None, ''):
              raise SystemExit('Required-character policy changed unexpectedly')
          if d.get('site_url') != os.environ['SITE_URL']:
              raise SystemExit('Site URL changed unexpectedly')
          if d.get('smtp_host') != 'smtp.resend.com':
              raise SystemExit('SMTP host changed unexpectedly')
          allow=[x.strip() for x in str(d.get('uri_allow_list') or '').split(',') if x.strip()]
          for required in (os.environ['INVITE_REDIRECT'], os.environ['RECOVERY_REDIRECT']):
              if required not in allow:
                  raise SystemExit('Required redirect disappeared')
          print('RENDERLAB_215A_PASSWORD_MINIMUM_AFTER=15')
          print('RENDERLAB_215A_PASSWORD_POLICY_READBACK_OK=true')
          PY

          trap - ERR

name: Phase 13B Email Configuration Corrected

on:
  push:
    branches: [work/phase-13b-email-config]
    paths:
      - ".github/workflows/phase-13b-email-config-corrected.yml"

permissions:
  contents: read

jobs:
  configure-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rashyleshocuvpgcooxy
      SITE_URL: https://renderlab.faresuniform.uk
      INVITE_REDIRECT: https://renderlab.faresuniform.uk/settings
      RECOVERY_REDIRECT: https://renderlab.faresuniform.uk/auth/confirm?type=recovery&next=/settings/password

    steps:
      - name: Verify existing Management API credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured."; exit 1; }
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=true"

      - name: Apply guarded branded security-mail configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          endpoint = f"https://api.supabase.com/v1/projects/{os.environ['SUPABASE_PROJECT_REF']}/config/auth"
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'RenderLab-215A-SecurityMail/1.0',
          }

          def request(method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(endpoint, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  text = response.read().decode()
              return json.loads(text) if text else {}

          before = request()
          if before.get('site_url') != os.environ['SITE_URL']:
              raise SystemExit('Unexpected Site URL; refusing mutation')
          allow = [x.strip() for x in str(before.get('uri_allow_list') or '').split(',') if x.strip()]
          for required in (os.environ['INVITE_REDIRECT'], os.environ['RECOVERY_REDIRECT']):
              if required not in allow:
                  raise SystemExit('Required redirect missing; refusing mutation')
          if before.get('smtp_host') != 'smtp.resend.com':
              raise SystemExit('Unexpected SMTP host; refusing mutation')
          if int(before.get('password_min_length') or -1) != 15:
              raise SystemExit('Hosted password minimum must already be 15')
          if before.get('password_required_characters') not in (None, ''):
              raise SystemExit('Unexpected required-character policy')
          if before.get('security_captcha_enabled') is not False:
              raise SystemExit('CAPTCHA state drifted; refusing mutation')
          if before.get('security_update_password_require_current_password') is not False:
              raise SystemExit('Hosted current-password requirement drifted')
          if before.get('security_update_password_require_reauthentication') is not False:
              raise SystemExit('Hosted nonce reauthentication requirement drifted')

          patch = {
              'mailer_subjects_reauthentication': '{{ .Token }} is your RenderLab verification code',
              'mailer_templates_reauthentication_content': '<h2>RenderLab verification code</h2><p>Use this code to verify a sensitive RenderLab account action:</p><p><strong>{{ .Token }}</strong></p><p>If you did not request this, do not share the code and change your RenderLab password.</p>',
              'mailer_subjects_email_change': 'Confirm your RenderLab sign-in email change',
              'mailer_templates_email_change_content': '<h2>Confirm your RenderLab sign-in email change</h2><p>You requested to change your RenderLab sign-in email to {{ .NewEmail }}.</p><p><a href="{{ .ConfirmationURL }}">Confirm new sign-in email</a></p><p>If you did not request this change, do not use the link and change your RenderLab password.</p>',
              'mailer_notifications_password_changed_enabled': True,
              'mailer_subjects_password_changed_notification': 'Your RenderLab password was changed',
              'mailer_templates_password_changed_notification_content': '<h2>Your RenderLab password was changed</h2><p>The password for your RenderLab account was changed.</p><p>If you did not make this change, use RenderLab password recovery immediately and contact your RenderLab administrator.</p>',
              'mailer_notifications_email_changed_enabled': True,
              'mailer_subjects_email_changed_notification': 'Your RenderLab sign-in email was changed',
              'mailer_templates_email_changed_notification_content': '<h2>Your RenderLab sign-in email was changed</h2><p>Your RenderLab sign-in email was changed from {{ .OldEmail }} to {{ .Email }}.</p><p>If you did not make this change, use RenderLab password recovery immediately and contact your RenderLab administrator.</p>',
              'mailer_notifications_mfa_factor_enrolled_enabled': True,
              'mailer_subjects_mfa_factor_enrolled_notification': 'A RenderLab verification method was added',
              'mailer_templates_mfa_factor_enrolled_notification_content': '<h2>A RenderLab verification method was added</h2><p>Verification method {{ .FactorType }} was added to your RenderLab account.</p><p>If you did not make this change, change your RenderLab password immediately and contact your RenderLab administrator.</p>',
              'mailer_notifications_mfa_factor_unenrolled_enabled': True,
              'mailer_subjects_mfa_factor_unenrolled_notification': 'A RenderLab verification method was removed',
              'mailer_templates_mfa_factor_unenrolled_notification_content': '<h2>A RenderLab verification method was removed</h2><p>Verification method {{ .FactorType }} was removed from your RenderLab account.</p><p>If you did not make this change, change your RenderLab password immediately and contact your RenderLab administrator.</p>',
              'mailer_notifications_identity_linked_enabled': True,
              'mailer_subjects_identity_linked_notification': 'A RenderLab sign-in method was linked',
              'mailer_templates_identity_linked_notification_content': '<h2>A RenderLab sign-in method was linked</h2><p>A {{ .Provider }} sign-in method was linked to your RenderLab account.</p><p>If you did not make this change, change your RenderLab password immediately and contact your RenderLab administrator.</p>',
              'mailer_notifications_identity_unlinked_enabled': True,
              'mailer_subjects_identity_unlinked_notification': 'A RenderLab sign-in method was removed',
              'mailer_templates_identity_unlinked_notification_content': '<h2>A RenderLab sign-in method was removed</h2><p>A {{ .Provider }} sign-in method was removed from your RenderLab account.</p><p>If you did not make this change, change your RenderLab password immediately and contact your RenderLab administrator.</p>',
          }

          rollback = {key: before.get(key) for key in patch}
          Path('artifacts/account-auth-hardening-215a-security-mail-rollback.json').write_text(
              json.dumps(rollback, indent=2, sort_keys=True) + '\n'
          )

          unchanged = [
              'site_url', 'uri_allow_list',
              'smtp_admin_email', 'smtp_host', 'smtp_port', 'smtp_sender_name', 'smtp_max_frequency',
              'password_min_length', 'password_required_characters', 'password_hibp_enabled',
              'security_captcha_enabled', 'security_captcha_provider',
              'security_update_password_require_current_password', 'security_update_password_require_reauthentication',
              'mailer_secure_email_change_enabled',
              'rate_limit_anonymous_users', 'rate_limit_email_sent', 'rate_limit_otp', 'rate_limit_sms_sent',
              'rate_limit_token_refresh', 'rate_limit_verify', 'rate_limit_web3',
              'mailer_subjects_invite', 'mailer_templates_invite_content',
              'mailer_subjects_recovery', 'mailer_templates_recovery_content',
              'mailer_notifications_phone_changed_enabled',
          ]

          mutated = False
          try:
              request('PATCH', patch)
              mutated = True
              after = request()
              for key, value in patch.items():
                  if after.get(key) != value:
                      raise RuntimeError(f'Hosted readback mismatch: {key}')
              for key in unchanged:
                  if after.get(key) != before.get(key):
                      raise RuntimeError(f'Out-of-scope hosted config changed: {key}')
              print('RENDERLAB_215A_SECURITY_NOTIFICATIONS_ENABLED=6')
              print('RENDERLAB_215A_REAUTH_TEMPLATE_BRANDED=true')
              print('RENDERLAB_215A_EMAIL_CHANGE_TEMPLATE_BRANDED=true')
              print('RENDERLAB_215A_SECURITY_MAIL_READBACK_OK=true')
              print('RENDERLAB_215A_OUT_OF_SCOPE_CONFIG_PRESERVED=true')
          except Exception:
              if mutated:
                  try:
                      request('PATCH', rollback)
                      print('RENDERLAB_215A_SECURITY_MAIL_ROLLBACK_ATTEMPTED=true')
                  except Exception:
                      print('RENDERLAB_215A_SECURITY_MAIL_ROLLBACK_FAILED=true')
              raise
          PY

      - name: Upload bounded rollback values
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-account-auth-hardening-215a-security-mail-rollback
          path: artifacts/account-auth-hardening-215a-security-mail-rollback.json
          if-no-files-found: error
          retention-days: 14

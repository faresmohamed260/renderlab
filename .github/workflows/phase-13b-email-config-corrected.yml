name: Phase 13B Email Configuration Corrected

on:
  push:
    branches: [work/phase-13b-email-config]
    paths:
      - ".github/workflows/phase-13b-email-config-corrected.yml"

permissions:
  contents: read

jobs:
  configure-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
      BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BREVO_DOMAIN: mail.renderlab.faresuniform.uk
      ZONE_APEX: faresuniform.uk
      FROM_EMAIL: noreply@mail.renderlab.faresuniform.uk
      FROM_NAME: RenderLab
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: "587"
      SUPABASE_PROJECT_REF: rashyleshocuvpgcooxy
      SITE_URL: https://renderlab.faresuniform.uk
      INVITE_REDIRECT: https://renderlab.faresuniform.uk/settings
      RECOVERY_REDIRECT: https://renderlab.faresuniform.uk/auth/confirm?type=recovery&next=/settings/password
      AUTH_EMAIL_RATE_LIMIT: "30"

    steps:
      - name: Verify credentials without sending mail
        shell: bash
        run: |
          set -euo pipefail
          for name in BREVO_API_KEY BREVO_SMTP_LOGIN BREVO_SMTP_KEY SUPABASE_ACCESS_TOKEN CLOUDFLARE_API_TOKEN; do
            test -n "${!name:-}" || { echo "${name}_PRESENT=false"; exit 1; }
            echo "${name}_PRESENT=true"
          done
          curl --fail-with-body --silent --show-error \
            --header "api-key: ${BREVO_API_KEY}" --header 'accept: application/json' \
            'https://api.brevo.com/v3/account' -o /tmp/brevo-account.json
          python - <<'PY'
          import os, smtplib, ssl
          with smtplib.SMTP(os.environ['SMTP_HOST'], int(os.environ['SMTP_PORT']), timeout=20) as smtp:
              smtp.ehlo(); smtp.starttls(context=ssl.create_default_context()); smtp.ehlo()
              smtp.login(os.environ['BREVO_SMTP_LOGIN'], os.environ['BREVO_SMTP_KEY'])
          print('BREVO_API_AND_SMTP_AUTH_OK=true')
          print('BREVO_SMTP_MESSAGE_SENT=false')
          PY

      - name: Read Brevo domain and normalize provider DNS safely
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "api-key: ${BREVO_API_KEY}" --header 'accept: application/json' \
            "https://api.brevo.com/v3/senders/domains/${BREVO_DOMAIN}" \
            -o /tmp/brevo-domain.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          domain=os.environ['BREVO_DOMAIN'].lower().rstrip('.')
          zone=os.environ['ZONE_APEX'].lower().rstrip('.')
          relative=domain[:-(len(zone)+1)] if domain.endswith('.'+zone) else ''
          data=json.loads(Path('/tmp/brevo-domain.json').read_text())
          got=(data.get('domain') or data.get('domain_name') or '').lower().rstrip('.')
          if got != domain:
              raise SystemExit(f'Unexpected Brevo domain response: {got!r}')
          records=[]
          for label, rec in (data.get('dns_records') or {}).items():
              if not isinstance(rec,dict):
                  continue
              typ=str(rec.get('type') or '').upper().strip()
              value=str(rec.get('value') or '').strip()
              raw=str(rec.get('host_name') or '').strip().rstrip('.').lower()
              if not typ or not value:
                  continue
              if raw in ('','@'):
                  fqdn=domain
              elif raw == zone or raw.endswith('.'+zone):
                  fqdn=raw
              elif relative and (raw == relative or raw.endswith('.'+relative)):
                  fqdn=f'{raw}.{zone}'
              else:
                  fqdn=f'{raw}.{domain}'
              if typ not in ('TXT','CNAME'):
                  raise SystemExit(f'Unexpected Brevo DNS type {typ}; refusing mutation')
              if fqdn != domain and not fqdn.endswith('.'+domain):
                  raise SystemExit(f'Brevo DNS record escaped sender-domain subtree: {fqdn}')
              records.append({'label':label,'type':typ,'name':fqdn,'content':value})
              print(f'BREVO_DNS_NORMALIZED={label}:{typ}:{raw or "@"}->{fqdn}')
          if len(records) < 2:
              raise SystemExit('Brevo returned too few DNS records')
          Path('/tmp/brevo-required-dns.json').write_text(json.dumps(records))
          print('BREVO_DOMAIN_AUTHENTICATED_BEFORE=' + str(bool(data.get('authenticated'))).lower())
          print('BREVO_DOMAIN_VERIFIED_BEFORE=' + str(bool(data.get('verified'))).lower())
          PY

      - name: Remove only the two run-owned malformed TXT records and apply corrected DNS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_APEX}" \
            -o /tmp/cf-zones.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cf-zones.json').read_text())
          rows=d.get('result') or []
          if not d.get('success') or len(rows)!=1:
              raise SystemExit('Could not resolve exact Cloudflare zone')
          Path('/tmp/cf-zone-id').write_text(rows[0]['id'])
          PY

          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          token=os.environ['CLOUDFLARE_API_TOKEN']
          zone=Path('/tmp/cf-zone-id').read_text().strip()
          domain=os.environ['BREVO_DOMAIN'].lower()
          base=f'https://api.cloudflare.com/client/v4/zones/{zone}/dns_records'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          required=json.loads(Path('/tmp/brevo-required-dns.json').read_text())

          def call(url, method='GET', body=None):
              req=urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as res:
                  payload=json.loads(res.read().decode())
              if not payload.get('success'):
                  raise RuntimeError('Cloudflare API success=false')
              return payload

          malformed=[
              'mail.renderlab.mail.renderlab.faresuniform.uk',
              '_dmarc.mail.renderlab.mail.renderlab.faresuniform.uk',
          ]
          removed=0
          for name in malformed:
              rows=call(base+'?'+urllib.parse.urlencode({'name':name,'per_page':100})).get('result') or []
              for row in rows:
                  if str(row.get('type') or '').upper()!='TXT':
                      raise SystemExit(f'Unexpected non-TXT record exists at malformed run-owned name {name}; refusing deletion')
                  call(f"{base}/{row['id']}",'DELETE')
                  removed += 1
                  print(f'CLOUDFLARE_RUN_OWNED_MALFORMED_TXT_REMOVED={name}')
          print(f'CLOUDFLARE_MALFORMED_REMOVED_COUNT={removed}')

          created=0; existing=0
          for rec in required:
              name=rec['name'].lower().rstrip('.')
              typ=rec['type'].upper()
              content=rec['content'].strip().rstrip('.') if typ=='CNAME' else rec['content'].strip()
              if name != domain and not name.endswith('.'+domain):
                  raise SystemExit(f'Refusing out-of-scope DNS name {name}')
              rows=call(base+'?'+urllib.parse.urlencode({'name':name,'per_page':100})).get('result') or []
              exact=False
              for row in rows:
                  rtype=str(row.get('type') or '').upper()
                  rcontent=str(row.get('content') or '').strip().rstrip('.') if rtype=='CNAME' else str(row.get('content') or '').strip()
                  if rtype==typ and rcontent==content:
                      exact=True; break
              if exact:
                  existing += 1
                  print(f'CLOUDFLARE_DNS_EXISTS={typ} {name}')
                  continue
              if typ=='CNAME' and rows:
                  raise SystemExit(f'Conflicting record at {name}; refusing CNAME overwrite')
              if any(str(r.get('type') or '').upper()=='CNAME' for r in rows):
                  raise SystemExit(f'CNAME conflict at {name}; refusing TXT write')
              if (name.startswith('_dmarc.') or '_domainkey.' in name) and rows:
                  raise SystemExit(f'Conflicting authentication DNS at {name}; refusing overwrite')
              body={'type':typ,'name':name,'content':content,'ttl':1}
              if typ=='CNAME': body['proxied']=False
              call(base,'POST',body)
              created += 1
              print(f'CLOUDFLARE_DNS_CREATED={typ} {name}')
          print(f'CLOUDFLARE_DNS_CREATED_COUNT={created}')
          print(f'CLOUDFLARE_DNS_EXISTING_COUNT={existing}')
          PY

      - name: Verify public DNS and authenticate Brevo domain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          python - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          required=json.loads(Path('/tmp/brevo-required-dns.json').read_text())
          def txt(v): return v.strip().replace('" "','').strip('"')
          pending=[]
          for attempt in range(1,13):
              pending=[]
              for rec in required:
                  typ,name=rec['type'],rec['name']
                  want=rec['content'].rstrip('.') if typ=='CNAME' else rec['content']
                  p=subprocess.run(['dig','+short',typ,name,'@1.1.1.1'],text=True,capture_output=True)
                  vals=[x.strip().rstrip('.') for x in p.stdout.splitlines() if x.strip()]
                  if typ=='TXT': vals=[txt(x) for x in vals]
                  if want.rstrip('.') not in vals: pending.append(f'{typ} {name}')
              if not pending:
                  print(f'PUBLIC_DNS_PROPAGATED_ATTEMPT={attempt}'); break
              if attempt<12: time.sleep(10)
          if pending: raise SystemExit('Public DNS missing: '+', '.join(pending))
          print('PUBLIC_DNS_REQUIRED_RECORDS_OK=true')
          PY

          ok=false
          for attempt in $(seq 1 18); do
            code="$(curl --silent --show-error --output /tmp/brevo-auth.json --write-out '%{http_code}' \
              --request PUT --header "api-key: ${BREVO_API_KEY}" --header 'accept: application/json' \
              "https://api.brevo.com/v3/senders/domains/${BREVO_DOMAIN}/authenticate")"
            if [ "$code" = "200" ]; then echo "BREVO_AUTH_ATTEMPT=${attempt}"; ok=true; break; fi
            if [ "$code" != "400" ]; then echo "BREVO_AUTH_HTTP=${code}"; exit 1; fi
            sleep 10
          done
          test "$ok" = true
          curl --fail-with-body --silent --show-error --header "api-key: ${BREVO_API_KEY}" \
            "https://api.brevo.com/v3/senders/domains/${BREVO_DOMAIN}" -o /tmp/brevo-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/brevo-after.json').read_text())
          if not d.get('authenticated'): raise SystemExit('Brevo domain not authenticated')
          print('BREVO_DOMAIN_AUTHENTICATED=true')
          print('BREVO_DOMAIN_VERIFIED=' + str(bool(d.get('verified'))).lower())
          for label,rec in (d.get('dns_records') or {}).items():
              if isinstance(rec,dict) and rec.get('type'):
                  print(f'BREVO_DNS_STATUS_{label.upper()}=' + str(bool(rec.get('status'))).lower())
          PY

      - name: Ensure RenderLab sender and validate MAIL FROM without recipient
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --header "api-key: ${BREVO_API_KEY}" \
            "https://api.brevo.com/v3/senders?domain=${BREVO_DOMAIN}" -o /tmp/senders.json
          state="$(python - <<'PY'
          import json,os
          d=json.load(open('/tmp/senders.json')); target=os.environ['FROM_EMAIL'].lower()
          rows=[r for r in (d.get('senders') or []) if str(r.get('email') or '').lower()==target]
          print('missing' if not rows else ('active' if rows[0].get('active') else 'inactive'))
          PY
          )"
          if [ "$state" = "missing" ]; then
            python - <<'PY'
          import json,os
          json.dump({'name':os.environ['FROM_NAME'],'email':os.environ['FROM_EMAIL']},open('/tmp/sender.json','w'))
          PY
            code="$(curl --silent --show-error --output /tmp/sender-result.json --write-out '%{http_code}' \
              --request POST --header "api-key: ${BREVO_API_KEY}" --header 'content-type: application/json' \
              --data-binary @/tmp/sender.json 'https://api.brevo.com/v3/senders')"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then echo "BREVO_SENDER_CREATE_HTTP=${code}"; exit 1; fi
            echo 'BREVO_SENDER_CREATED=true'
          elif [ "$state" = "inactive" ]; then
            echo 'BREVO_SENDER_INACTIVE=true'; exit 1
          else
            echo 'BREVO_SENDER_CREATED=false'
          fi
          sleep 2
          curl --fail-with-body --silent --show-error --header "api-key: ${BREVO_API_KEY}" \
            "https://api.brevo.com/v3/senders?domain=${BREVO_DOMAIN}" -o /tmp/senders-after.json
          python - <<'PY'
          import json,os,smtplib,ssl
          d=json.load(open('/tmp/senders-after.json')); target=os.environ['FROM_EMAIL'].lower()
          rows=[r for r in (d.get('senders') or []) if str(r.get('email') or '').lower()==target]
          if len(rows)!=1 or not rows[0].get('active'): raise SystemExit('RenderLab sender not active')
          with smtplib.SMTP(os.environ['SMTP_HOST'],int(os.environ['SMTP_PORT']),timeout=20) as s:
              s.ehlo(); s.starttls(context=ssl.create_default_context()); s.ehlo(); s.login(os.environ['BREVO_SMTP_LOGIN'],os.environ['BREVO_SMTP_KEY'])
              code,_=s.mail(os.environ['FROM_EMAIL'])
              if code>=400: raise SystemExit(f'MAIL FROM rejected: {code}')
              s.rset()
          print('BREVO_SENDER_ACTIVE=true')
          print('BREVO_FROM_ACCEPTED_WITHOUT_RECIPIENT=true')
          print('BREVO_SMTP_MESSAGE_SENT=false')
          PY

      - name: Configure and read back Supabase Custom SMTP
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          curl --fail-with-body --silent --show-error --user-agent 'RenderLab-Phase13B/1.1' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$endpoint" -o /tmp/auth-before.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/auth-before.json'))
          if d.get('site_url')!=os.environ['SITE_URL']: raise SystemExit('Unexpected Site URL; refusing mutation')
          v=d.get('uri_allow_list'); allow=[x.strip() for x in v.split(',')] if isinstance(v,str) else list(v or [])
          for u in (os.environ['INVITE_REDIRECT'],os.environ['RECOVERY_REDIRECT']):
              if u not in allow: raise SystemExit('Required redirect missing; refusing mutation')
          patch={'smtp_admin_email':os.environ['FROM_EMAIL'],'smtp_host':os.environ['SMTP_HOST'],'smtp_port':int(os.environ['SMTP_PORT']),'smtp_user':os.environ['BREVO_SMTP_LOGIN'],'smtp_pass':os.environ['BREVO_SMTP_KEY'],'smtp_sender_name':os.environ['FROM_NAME'],'rate_limit_email_sent':int(os.environ['AUTH_EMAIL_RATE_LIMIT'])}
          json.dump(patch,open('/tmp/auth-patch.json','w'))
          print('SUPABASE_SMTP_CONFIGURED_BEFORE=' + str(bool(d.get('smtp_host'))).lower())
          print('SUPABASE_EMAIL_RATE_LIMIT_BEFORE=' + str(d.get('rate_limit_email_sent')))
          PY
          curl --fail-with-body --silent --show-error --user-agent 'RenderLab-Phase13B/1.1' \
            --request PATCH --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'content-type: application/json' --data-binary @/tmp/auth-patch.json "$endpoint" -o /tmp/auth-patch-response.json
          curl --fail-with-body --silent --show-error --user-agent 'RenderLab-Phase13B/1.1' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$endpoint" -o /tmp/auth-after.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/auth-after.json'))
          expect={'smtp_admin_email':os.environ['FROM_EMAIL'],'smtp_host':os.environ['SMTP_HOST'],'smtp_sender_name':os.environ['FROM_NAME']}
          for k,v in expect.items():
              if str(d.get(k) or '')!=v: raise SystemExit(f'Supabase readback mismatch: {k}')
          if str(d.get('smtp_port'))!=os.environ['SMTP_PORT']: raise SystemExit('Supabase smtp_port mismatch')
          if int(d.get('rate_limit_email_sent') or -1)!=int(os.environ['AUTH_EMAIL_RATE_LIMIT']): raise SystemExit('Supabase email rate limit mismatch')
          if d.get('site_url')!=os.environ['SITE_URL']: raise SystemExit('Supabase Site URL changed')
          v=d.get('uri_allow_list'); allow=[x.strip() for x in v.split(',')] if isinstance(v,str) else list(v or [])
          for u in (os.environ['INVITE_REDIRECT'],os.environ['RECOVERY_REDIRECT']):
              if u not in allow: raise SystemExit('Required redirect disappeared')
          print('SUPABASE_CUSTOM_SMTP_READBACK_OK=true')
          print('SUPABASE_SMTP_HOST=' + str(d.get('smtp_host')))
          print('SUPABASE_SMTP_PORT=' + str(d.get('smtp_port')))
          print('SUPABASE_SMTP_ADMIN_EMAIL=' + str(d.get('smtp_admin_email')))
          print('SUPABASE_SMTP_SENDER_NAME=' + str(d.get('smtp_sender_name')))
          print('SUPABASE_EMAIL_RATE_LIMIT=' + str(d.get('rate_limit_email_sent')))
          print('SUPABASE_SITE_URL=' + str(d.get('site_url')))
          print('SUPABASE_REQUIRED_REDIRECTS_PRESERVED=true')
          print('SUPABASE_INVITE_TEMPLATE_STILL_PHASE13C=' + str('{{ .ConfirmationURL }}' in str(d.get('mailer_templates_invite_content') or '')).lower())
          print('SUPABASE_RECOVERY_TEMPLATE_STILL_PHASE13C=' + str('{{ .ConfirmationURL }}' in str(d.get('mailer_templates_recovery_content') or '')).lower())
          print('PHASE13B_REAL_AUTH_EMAIL_SENT=false')
          PY

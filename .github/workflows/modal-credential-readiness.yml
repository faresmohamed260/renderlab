name: RenderLab Modal Credential Readiness

on:
  push:
    branches:
      - ops/modal-credential-readiness-20260913
    paths:
      - .github/workflows/modal-credential-readiness.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      RENDERLAB_MODAL_TOKENS_JSON: ${{ secrets.RENDERLAB_MODAL_TOKENS_JSON }}
      MODAL_TOKENS_JSON: ${{ secrets.MODAL_TOKENS_JSON }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit credential availability without exposing credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expectedRenderLab = ["modal-01", "modal-02", "modal-42", "modal-43", "modal-44", "modal-45", "modal-46", "modal-47"];
          const expectedSaga = Array.from({ length: 39 }, (_, index) => `modal-${String(index + 3).padStart(2, "0")}`);
          const rosterCandidates = [
            ["SAGA_MODAL_TOKENS_JSON", process.env.SAGA_MODAL_TOKENS_JSON],
            ["RENDERLAB_MODAL_TOKENS_JSON", process.env.RENDERLAB_MODAL_TOKENS_JSON],
            ["MODAL_TOKENS_JSON", process.env.MODAL_TOKENS_JSON],
          ];
          const presentRosters = rosterCandidates.filter(([, value]) => Boolean(String(value || "").trim()));
          const genericPairPresent = Boolean(String(process.env.MODAL_TOKEN_ID || "").trim() && String(process.env.MODAL_TOKEN_SECRET || "").trim());
          console.log(JSON.stringify({
            populatedRosterSecretNames: presentRosters.map(([name]) => name),
            genericModalTokenPairPresent: genericPairPresent,
          }));
          if (presentRosters.length === 0) {
            console.log(JSON.stringify({ rosterAvailable: false }));
            process.exit(0);
          }
          for (const [name, raw] of presentRosters) {
            let payload;
            try {
              payload = JSON.parse(raw);
            } catch {
              console.log(JSON.stringify({ secretName: name, parseableRoster: false }));
              continue;
            }
            const rows = Array.isArray(payload) ? payload : (payload.accounts || payload.tokens || payload.roster || []);
            if (!Array.isArray(rows)) {
              console.log(JSON.stringify({ secretName: name, parseableRoster: false }));
              continue;
            }
            const labels = rows.map((row, index) => String(row?.label || row?.name || row?.account || `modal-${String(index + 1).padStart(2, "0")}`).trim());
            const unique = new Set(labels);
            console.log(JSON.stringify({
              secretName: name,
              parseableRoster: true,
              rosterEntryCount: rows.length,
              uniqueLabelCount: unique.size,
              allRenderLabAssignedLabelsPresent: expectedRenderLab.every((label) => unique.has(label)),
              allSagaAssignedLabelsPresent: expectedSaga.every((label) => unique.has(label)),
            }));
          }
          NODE

name: Android SDK58 Standalone Emulator Proof (temporary)
# CI-only throwaway signed binary, no distribution or release signing.
on:
  pull_request:
    paths:
      - .github/workflows/android-standalone-emulator-proof-temporary.yml
      - apps/mobile/tools/android-standalone-emulator-smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      JAVA_TOOL_OPTIONS: "-Xmx3g -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d1650
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable emulator KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Install exact standalone-app dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Compile release-mode Android x86_64 APK with embedded JS
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'app.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.expo.android.package = 'dev.renderlab.standaloneproof';
          data.expo.slug = 'renderlab-disposable-standalone-emulator';
          data.expo.name = 'RenderLab Emulator QA (no distribution)';
          fs.writeFileSync(path, JSON.stringify(data, null, 2));
          NODE
          npx expo prebuild --platform android --no-install --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
          echo 'PASS: standalone JS/Hermes embedded inside Android release-mode APK'
      - name: Disposable CI-only signing for emulator installation
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/throwaway-android-emulator-only.p12"
          OUT="$RUNNER_TEMP/standalone-emulator-only.apk"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KEYSTORE" \
            -alias emulator-ci-only -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=RenderLab ephemeral Android CI, O=QA only' \
            -storepass changeit -keypass changeit >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias emulator-ci-only \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --out "$OUT" android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify "$OUT"
          test -s "$OUT"
          echo 'PASS: disposable signed APK for emulator only; never uploaded'
      - name: Boot isolated Android and prove touch navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 apps/mobile/tools/android-standalone-emulator-smoke.py "$RUNNER_TEMP/standalone-emulator-only.apk"
      - name: Preserve only non-secret navigation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk58-isolated-emulator-ui-evidence
          path: ${{ runner.temp }}/renderlab-standalone-emulator/
          if-no-files-found: warn
          retention-days: 3
      - name: Delete disposable signing material and APK
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/standalone-emulator-only.apk" "$RUNNER_TEMP/throwaway-android-emulator-only.p12"
          echo 'CI-only APK/keystore removed; no signing identity or APK exported.'

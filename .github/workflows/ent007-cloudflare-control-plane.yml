name: ENT-007 Cloudflare Control Plane

on:
  push:
    branches:
      - work/ent-007-recovery-implementation
    paths:
      - ".github/workflows/ent007-cloudflare-control-plane.yml"

permissions:
  contents: read

jobs:
  r2-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      BACKUP_BUCKET: renderlab-dr-backup
    steps:
      - name: Classify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(node -e 'process.stdout.write((process.env.CLOUDFLARE_API_TOKEN || "").trim())')
          test -n "$TOKEN"

          user_code=$(curl -sS -o user-token.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          account_code=$(curl -sS -o account-token.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")

          echo "user_token_verify_http=${user_code}"
          jq '{success, status: .result.status, errors}' user-token.json
          echo "account_token_verify_http=${account_code}"
          jq '{success, status: .result.status, errors}' account-token.json

          if [ "$user_code" = "200" ] && jq -e '.success == true' user-token.json >/dev/null; then
            echo "cloudflare_token_kind=user"
          elif [ "$account_code" = "200" ] && jq -e '.success == true' account-token.json >/dev/null; then
            echo "cloudflare_token_kind=account"
          else
            echo "cloudflare_token_verification=unrecognized; testing target R2 endpoint directly"
          fi

      - name: Read and enforce ENT-007 bucket lock
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(node -e 'process.stdout.write((process.env.CLOUDFLARE_API_TOKEN || "").trim())')
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BACKUP_BUCKET}/lock"
          code=$(curl -sS -o lock-before.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "$api")
          echo "r2_lock_read_http=${code}"
          if [ "$code" != "200" ]; then
            jq '{success, errors}' lock-before.json
            exit 1
          fi
          jq -e '.success == true' lock-before.json >/dev/null
          jq '{rules: (.result.rules // [])}' lock-before.json

          if jq -e 'any((.result.rules // [])[]; .enabled == true and ((.prefix // "") == "") and ((.condition.type == "Indefinite") or (.condition.type == "Age" and (.condition.maxAgeSeconds // 0) >= 604800)))' lock-before.json >/dev/null; then
            echo "ent007_retention_already_satisfied=true"
          else
            jq '{rules: (((.result.rules // []) | map(select(.id != "ent007-minimum-7d"))) + [{id:"ent007-minimum-7d", enabled:true, prefix:"", condition:{type:"Age", maxAgeSeconds:604800}}])}' lock-before.json > lock-put.json
            code=$(curl -sS -o lock-put-response.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @lock-put.json \
              "$api")
            echo "r2_lock_write_http=${code}"
            if [ "$code" != "200" ]; then
              jq '{success, errors}' lock-put-response.json
              exit 1
            fi
            jq -e '.success == true' lock-put-response.json >/dev/null
          fi

          code=$(curl -sS -o lock-after.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "$api")
          test "$code" = "200"
          jq -e '.success == true' lock-after.json >/dev/null
          jq -e 'any((.result.rules // [])[]; .enabled == true and ((.prefix // "") == "") and ((.condition.type == "Indefinite") or (.condition.type == "Age" and (.condition.maxAgeSeconds // 0) >= 604800)))' lock-after.json >/dev/null
          jq '{rules: (.result.rules // [])}' lock-after.json
          echo "ent007_retention_verified=true"

      - name: Inspect active account-token policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(node -e 'process.stdout.write((process.env.CLOUDFLARE_API_TOKEN || "").trim())')
          verify=$(curl -sS -H "Authorization: Bearer ${TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")
          token_id=$(printf '%s' "$verify" | jq -r '.result.id // empty')
          test -n "$token_id"
          code=$(curl -sS -o token-details.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/${token_id}")
          echo "account_token_details_http=${code}"
          test "$code" = "200"
          jq -e '.success == true' token-details.json >/dev/null
          jq '{id: .result.id, name: .result.name, status: .result.status, policies: [.result.policies[]? | {id, effect, resources, permission_groups: [.permission_groups[]? | {id, name}]}]}' token-details.json

      - name: Probe account-token provisioning authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(node -e 'process.stdout.write((process.env.CLOUDFLARE_API_TOKEN || "").trim())')
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/permission_groups"
          code=$(curl -sS -o permission-groups.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "$url")
          echo "account_token_permission_groups_http=${code}"
          if [ "$code" = "200" ] && jq -e '.success == true' permission-groups.json >/dev/null; then
            jq '[.result[] | select((.name // "") | test("R2|API Token"; "i")) | {id, name, scopes: .meta.scopes}]' permission-groups.json
          else
            jq '{success, errors}' permission-groups.json
          fi

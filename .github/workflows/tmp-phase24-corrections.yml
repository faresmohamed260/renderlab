name: Apply Phase 24 verification corrections

on:
  push:
    branches:
      - work/phase-24-library-gallery-rail
    paths:
      - .github/workflows/tmp-phase24-corrections.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-24-library-gallery-rail
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Apply bounded corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          search = Path('scripts/verify-library-search.mjs')
          text = search.read_text(encoding='utf-8')
          old = 'page.getByRole("button", { name: "Search", exact: true }).click()'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 stale Search button locators, found {count}')
          text = text.replace(old, 'page.getByRole("button", { name: "Search Library", exact: true }).click()')
          search.write_text(text, encoding='utf-8')

          menu = Path('src/features/library/library-collection-menu.tsx')
          text = menu.read_text(encoding='utf-8')
          old = 'className="w-full max-w-none sm:w-auto sm:max-w-56"'
          if text.count(old) != 1:
              raise SystemExit('Collection trigger class marker missing or ambiguous')
          text = text.replace(old, 'className="min-h-11 w-full max-w-none sm:w-auto sm:max-w-56"', 1)
          menu.write_text(text, encoding='utf-8')
          PY
          node --check scripts/verify-library-search.mjs
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify UI purity
        run: npm run verify:ui-purity

      - name: Build
        run: npm run build

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase24-corrections.yml
          git add scripts/verify-library-search.mjs src/features/library/library-collection-menu.tsx
          git commit -m "Align Gallery Rail controls and search verifier"
          git push origin HEAD:work/phase-24-library-gallery-rail

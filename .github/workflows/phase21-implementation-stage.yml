name: Phase 21 implementation stage

on:
  push:
    branches:
      - work/phase-21-spatial-media
    paths:
      - ".github/workflows/phase21-implementation-stage.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard implementation baseline
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "12bb7133bf6c2686c47ccda9d26fd09b7e36c038"
          test "$(git merge-base HEAD origin/main)" = "12bb7133bf6c2686c47ccda9d26fd09b7e36c038"

      - name: Apply UI-064 patch
        run: |
          python scripts/phase21-stage.py
          python - <<'PY'
          from pathlib import Path
          path = Path("src/app/globals.css")
          path.write_text(path.read_text().rstrip() + "\n")
          PY

      - name: Validate patch whitespace
        shell: bash
        run: |
          if ! git diff --check > /tmp/phase21-diffcheck.txt 2>&1; then
            cp /tmp/phase21-diffcheck.txt phase21-diffcheck.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add phase21-diffcheck.txt
            git commit -m "chore: record Phase 21 diff-check diagnostic"
            git push origin HEAD:work/phase-21-spatial-media
            cat /tmp/phase21-diffcheck.txt
            exit 1
          fi

      - name: Remove staging helpers
        run: rm .github/workflows/phase21-implementation-stage.yml scripts/phase21-stage.py phase21-diffcheck.txt 2>/dev/null || true

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Phase 21 spatial media treatment"

      - name: Push candidate
        run: git push origin HEAD:work/phase-21-spatial-media

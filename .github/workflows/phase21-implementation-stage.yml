name: Phase 21 implementation stage

on:
  push:
    branches:
      - work/phase-21-spatial-media
    paths:
      - ".github/workflows/phase21-implementation-stage.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard implementation baseline
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "12bb7133bf6c2686c47ccda9d26fd09b7e36c038"
          test "$(git merge-base HEAD origin/main)" = "12bb7133bf6c2686c47ccda9d26fd09b7e36c038"

      - name: Apply UI-064 patch
        run: python scripts/phase21-stage.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Remove staging helpers
        run: rm .github/workflows/phase21-implementation-stage.yml scripts/phase21-stage.py

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Phase 21 spatial media treatment"

      - name: Push candidate
        run: git push origin HEAD:work/phase-21-spatial-media

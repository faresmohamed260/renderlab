name: Production Complete User Journey

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Exact 40-character Git SHA independently verified as production-live
        required: true
        type: string
      confirm_bounded_fixture_provider_work:
        description: Confirm this run may dispatch exactly four provider-backed generations owned by the QA-002 fixture
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renderlab-production-complete-user-journey
  cancel-in-progress: false

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: https://renderlab.faresuniform.uk
      RENDERLAB_EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      RENDERLAB_CONFIRM_BOUNDED_FIXTURE_PROVIDER_WORK: ${{ inputs.confirm_bounded_fixture_provider_work }}
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
      RENDERLAB_TEST_ACCOUNT_SCOPE: production-complete-user-journey-${{ github.run_id }}
      RENDERLAB_COMPLETE_JOURNEY_ARTIFACT_DIR: artifacts/production-complete-user-journey

    steps:
      - name: Checkout audit harness head
        uses: actions/checkout@v4

      - name: Validate manual production-audit dispatch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::QA-002 is manual production-audit only."
            exit 1
          fi
          if [ "$RENDERLAB_CONFIRM_BOUNDED_FIXTURE_PROVIDER_WORK" != "true" ]; then
            echo "::error::QA-002 requires explicit bounded fixture provider-work confirmation."
            exit 1
          fi
          if ! printf "%s" "$RENDERLAB_EXPECTED_PRODUCTION_SHA" | grep -Eq "^[0-9a-fA-F]{40}$"; then
            echo "::error::expected_production_sha must be an exact 40-character Git SHA."
            exit 1
          fi

      - name: Validate shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate QA-002 audit harness
        run: |
          node --check scripts/verify-production-complete-user-journey.mjs
          node --test tests/unit/production-complete-user-journey-contract.test.mjs

      - name: Clean exact QA-002 fixture before audit
        run: node scripts/verify-production-complete-user-journey.mjs --cleanup-only

      - name: Run complete production user journey
        run: node scripts/verify-production-complete-user-journey.mjs

      - name: Clean exact QA-002 fixture after audit
        if: always()
        run: node scripts/verify-production-complete-user-journey.mjs --cleanup-only

      - name: Upload QA-002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-complete-user-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-complete-user-journey
          if-no-files-found: warn
          retention-days: 30

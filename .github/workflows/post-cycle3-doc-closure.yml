name: Post-Cycle 3 Documentation Closure

on:
  push:
    branches:
      - docs/post-cycle3-corrective-closure

permissions:
  contents: write

jobs:
  close-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/post-cycle3-corrective-closure
          fetch-depth: 0

      - name: Reconcile authoritative documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_tail(path, marker, replacement):
              text = read(path)
              if marker not in text:
                  raise SystemExit(f"Missing marker in {path}: {marker}")
              before, _ = text.split(marker, 1)
              write(path, before.rstrip() + "\n\n" + replacement.strip() + "\n")

          project = r'''
          ## Post-Cycle 3 Corrective Maintenance — Contextual Image Model Choice
          **Status: `COMPLETE / VERIFIED / MERGED`.**

          The existing Create Image/Edit capability now treats model selection as user-owned product intent rather than an invisible routing choice. Image mode exposes **FLUX.2 Klein 9B** as the default and **Qwen Image Edit 2511** as an explicit alternative; Video remains on its single current REDGraft model and therefore does not gain a redundant selector. The chosen image model is validated at the product request boundary, persisted in existing `generation_jobs.parameters.model`, reconstructed by Reuse Settings / Run Again / failed Retry, and mapped server-side to the matching worker ecosystem. Historical prompt-generation jobs without a persisted model retain the pre-change defaults (Image → FLUX, Video → REDGraft). Qwen keeps its verified fixed 4-step / CFG 1.0 tuning, so FLUX-only configurable Steps/Guidance are not exposed for Qwen. Worker IDs, primary/standby choice, provider IDs and workflow internals remain hidden.

          Fresh read-only Qwen readiness audit `34064898642` / artifact `9998623751` (`sha256:5075cdef0ee55cfa7b6649642815fcb2d6f585fc27565d0eb85f6bc9907975af`) verified both registered Qwen gateways ready with the same async multi-reference contract and fixed tuning. Local isolated routing proof `34065515794` verified Qwen/FLUX/default model routing, persisted intent, invalid model/tuning rejection and cleanup without provider generation spend. Exact PR head `d5f80c02f041b645b7a3b1dee13d70d8139cc832` passed all 19 attached workflows, including Image Model Routing, Engineering Quality, Create Lifecycle, Generation/Video integration, Admission/Reconciliation/Cancellation and responsive UI coverage. PR #115 merged to `main` as `e8649ba39e660e2ec98cfd2fd864b22db74e64e3`. No schema migration, worker redeployment, new infrastructure resource, top-level Models screen or production deployment was part of this corrective slice.

          ## Post-Cycle 3 Corrective Maintenance — Library Creatives / Uploads
          **Status: `COMPLETE / VERIFIED / MERGED`.**

          Library now separates the existing durable asset set into two same-route user-facing sections without splitting media identity. **Creatives** is the canonical `/library` default and lists `media_assets.origin=generated`; **Uploads** is URL-owned as `?tab=uploads` and lists `origin=uploaded`. Existing All/Images/Videos, search, Favorites, Collections, sort and bounded pagination compose inside the active section; switching sections clears stale pagination. Upload and desktop drag/drop belong to Uploads only, while Viewer/deep-link identity and Favorite/Collection/Rename/Delete/Download/continuation behavior remain origin-agnostic over the same durable media IDs.

          `GET /api/media/assets` accepts optional validated `origin=generated|uploaded`; omitting it preserves the existing unified API contract. No schema migration, backfill, R2 change, worker change or new route was introduced. Exact reconciled head `a81c02e82abb0cec6b386e4cfb69f1075f377e33` passed all 30 attached workflows, including Library Search/Lifecycle/Drag Drop, persistent upload, generation/video, ownership, UI shell and affected media regressions. Final desktop and 390px Library artifacts were reviewed clean. PR #116 merged to `main` as `999d32812e74afdba73e3cbaa7607a64ce65d603`, and all nine workflows GitHub attached to that merge SHA completed successfully.

          ## Post-Cycle 3 Corrective Maintenance — Repository Closure / Deployment Readiness
          **Status: `COMPLETE / VERIFIED / MERGED / NOT DEPLOYED`.**

          - Authoritative repository `main` is `999d32812e74afdba73e3cbaa7607a64ce65d603` before this documentation-only closure.
          - Corrective product PRs #115 and #116 are merged; temporary validation PR #113 is closed without merge; no resolved-work pull request remains open.
          - The model-choice exact head passed 19/19 attached workflows, the reconciled Library exact head passed 30/30, and the latest implementation merge passed all nine workflows GitHub attached to `main`.
          - Production remains the separately verified application source `71a9034039a64beec66894cc4f79b1f62bfc7bf7` at READY deployment `dpl_Ck2HEMFpt2aRUwSVTrYA6YcFTbbi` / `https://renderlab.faresuniform.uk`. These repository merges are **not deployed**.
          - Automatic Git → Vercel deployment remains disabled. No Supabase migration, R2 resource change, worker redeployment or scheduler activation is implied by repository readiness.
          '''
          replace_tail(
              "PROJECT.md",
              "## Post-Cycle 3 Corrective Maintenance — Contextual Image Model Choice",
              project,
          )

          migration = r'''
          ## Post-Cycle 3 Corrective Maintenance — Contextual Image Model Choice
          **Status: `COMPLETE / VERIFIED / MERGED`.**

          - [x] Treat the model as bounded Create product intent instead of an invisible worker-routing detail.
          - [x] In Image mode expose a compact maintained-dropdown selector with **FLUX.2 Klein** as the default and **Qwen Image Edit** as the current alternative; do not add a Models destination.
          - [x] Keep the selector contextual: Video has one current model and keeps no redundant model control.
          - [x] Persist the canonical model ID in existing generation-job parameters and preserve it through current-valid Reuse Settings, successful Run Again and failed Retry reconstruction.
          - [x] Keep worker primary/standby, provider IDs, workflow IDs and failover behavior server-owned and absent from the browser contract.
          - [x] Respect model-specific tuning: Qwen uses verified fixed 4-step / CFG 1.0 execution, hides configurable Steps/Guidance and rejects incompatible submitted tuning; FLUX retains its current configurable Image Advanced controls.
          - [x] Preserve historical compatibility: omitted model intent defaults to FLUX for Image and REDGraft for Video.
          - [x] Fresh Qwen audit `34064898642` / artifact `9998623751` verified both registered gateways; isolated local routing run `34065515794` proved Qwen → Qwen fleet, FLUX → current FLUX fleet, old omitted-model → FLUX, and exact cleanup without real provider work.
          - [x] Exact PR head `d5f80c02f041b645b7a3b1dee13d70d8139cc832` passed all 19 attached workflows and responsive rendered review; PR #115 merged as `e8649ba39e660e2ec98cfd2fd864b22db74e64e3`.

          No schema migration, worker deployment, new infrastructure resource or production rollout was part of this maintenance item.

          ## Post-Cycle 3 Corrective Maintenance — Library Creatives / Uploads
          **Status: `COMPLETE / VERIFIED / MERGED`.**

          - [x] Keep one durable `media_assets` identity and use the existing indexed `origin=generated|uploaded` field as the section boundary.
          - [x] Make **Creatives** the canonical `/library` default and **Uploads** the URL-owned `?tab=uploads` alternative.
          - [x] Preserve kind/search/Favorites/Collections/sort state when changing sections while clearing stale pagination.
          - [x] Scope page results, empty states and page-scoped selection to the active origin section.
          - [x] Keep Upload and desktop drag/drop affordances inside Uploads; Creatives does not accept drops or show Upload.
          - [x] Keep Viewer/deep-link identity and existing media mutations/continuations unchanged across both origins.
          - [x] Add optional validated `origin` filtering to `GET /api/media/assets` while preserving unified results when omitted.
          - [x] Reuse existing schema/infrastructure; no migration, backfill, R2 or worker change.
          - [x] Exact reconciled head `a81c02e82abb0cec6b386e4cfb69f1075f377e33` passed all 30 attached workflows, including Library Lifecycle/Search/Drag Drop and affected upload/media/generation regressions; final desktop/390px artifacts were reviewed clean.
          - [x] PR #116 merged as `999d32812e74afdba73e3cbaa7607a64ce65d603`; all nine workflows attached to the merge SHA completed successfully.

          This corrective item supersedes only the earlier v0.1 prohibition on Creatives/Uploads navigation. It does not create parallel Upload media identity or a second Library system. Production rollout remains separate.
          '''
          replace_tail(
              "docs/ui/UI_MIGRATION.md",
              "## Post-Cycle 3 Corrective Maintenance — Contextual Image Model Choice",
              migration,
          )

          path = "docs/ui/UI_DECISIONS.md"
          text = read(path)
          marker = "### UI-059 — Contextual Image model choice is product intent, not worker selection"
          if marker not in text:
              raise SystemExit("UI-059 marker missing")
          if "### UI-060 — Library separates Creatives and Uploads while retaining one media identity" in text:
              raise SystemExit("UI-060 already present")
          before, tail = text.split(marker, 1)
          tail = marker + tail
          tail = tail.replace("**Status:** Accepted / Implemented / Staging Verified", "**Status:** Accepted / Implemented / Verified / Merged", 1)
          tail = tail.rstrip() + r'''

          #### UI-059 implementation verification — 2026-09-07
          Exact PR head `d5f80c02f041b645b7a3b1dee13d70d8139cc832` passed all 19 attached workflows, including Image Model Routing, Create Lifecycle, Engineering Quality and affected lifecycle/integration coverage. Responsive Create/model-selection review passed before PR #115 merged as `e8649ba39e660e2ec98cfd2fd864b22db74e64e3`. No schema migration, worker redeployment, new infrastructure resource or production rollout followed this decision.

          ### UI-060 — Library separates Creatives and Uploads while retaining one media identity
          **Status:** Accepted / Implemented / Verified / Merged
          **Date:** 2026-09-07
          **Decision:** `/library` has two origin-scoped, URL-addressable sections over the existing durable media model. **Creatives** is the canonical default and maps to `media_assets.origin=generated`; **Uploads** maps to `media_assets.origin=uploaded` and is encoded as `tab=uploads`. The section is higher-level browsing context than `All / Images / Videos`: kind, search, Favorites, Collections and sort remain available inside either section, pagination is section-scoped, and switching sections clears stale `offset`. Upload and desktop drag/drop are visible/active only in Uploads. The Media Viewer remains `/library/[assetId]`, and both sections continue using the same Favorite, Collection, rename, delete, download and continuation contracts.

          **Reason:** Generated creative outputs and user-supplied source assets serve different day-to-day retrieval tasks. Keeping them visually interleaved makes the Library harder to scan and makes uploads compete with the outputs users usually want to revisit. The existing durable origin field already expresses this distinction truthfully, so the UI can expose it without inventing a parallel data store.

          **Consequences:** UI-020's original v0.1 instruction not to add Creatives/Uploads tabs and UI-022's original instruction not to expose an Uploads section are superseded by this decision. Their more important architectural constraint remains: uploads are ordinary durable `media_assets`, not a parallel public media identity. `GET /api/media/assets` may accept optional `origin=generated|uploaded`; omitted origin remains backward-compatible unified API behavior. No schema migration, data backfill, new top-level route, worker/provider change or production rollout is implied.

          #### UI-060 implementation verification — 2026-09-07
          Exact reconciled head `a81c02e82abb0cec6b386e4cfb69f1075f377e33` passed all 30 attached workflows, including Library Lifecycle/Search/Drag Drop, persistent upload, ownership, UI shell and affected generation/media regressions. Desktop and 390px Library artifacts were reviewed clean. PR #116 merged as `999d32812e74afdba73e3cbaa7607a64ce65d603`; all nine workflows GitHub attached to the merge SHA completed successfully. No schema/R2/worker/deployment change occurred.
          '''
          write(path, before.rstrip() + "\n\n" + tail.strip() + "\n")

          path = "docs/ui/SCREEN_REGISTRY.md"
          text = read(path)
          marker = "## Post-Cycle 3 Create Extension — Contextual Image Model Choice"
          if marker not in text:
              raise SystemExit("Create model screen marker missing")
          if "## Post-Cycle 3 Library Extension — Creatives / Uploads" in text:
              raise SystemExit("Library extension already present")
          before, tail = text.split(marker, 1)
          tail = marker + tail
          tail = tail.replace("**Status:** IMPLEMENTED / STAGING VERIFIED / FINAL PR RENDER REVIEW PENDING", "**Status:** IMPLEMENTED / VERIFIED / MERGED", 1)
          tail = tail.rstrip() + r'''

          Exact PR head `d5f80c02f041b645b7a3b1dee13d70d8139cc832` passed all 19 attached workflows and the responsive Create/model-selection review before PR #115 merged as `e8649ba39e660e2ec98cfd2fd864b22db74e64e3`. No new route, generic component, worker deployment or production rollout was introduced.

          ## Post-Cycle 3 Library Extension — Creatives / Uploads
          **Route:** `/library`
          **Status:** IMPLEMENTED / VERIFIED / MERGED — UI-060

          The approved Library remains one route and one durable-media workspace, but now exposes two higher-level origin sections. **Creatives** is canonical `/library` and maps to generated assets; **Uploads** is URL-owned as `?tab=uploads` and maps to uploaded assets. All/Images/Videos, search, Favorites, Collections, sort and pagination remain inside the active section. Upload and desktop drag/drop exist only in Uploads. Media Viewer stays `/library/[assetId]`; Rename, Download, Favorite, Collections, Delete and continuation remain asset-ID based and origin-agnostic.

          Exact reconciled head `a81c02e82abb0cec6b386e4cfb69f1075f377e33` passed all 30 attached workflows and final desktop/390px Library review. PR #116 merged as `999d32812e74afdba73e3cbaa7607a64ce65d603`; all nine attached merged-main workflows passed. No new route, schema, parallel Upload media identity or deployment was introduced.
          '''
          write(path, before.rstrip() + "\n\n" + tail.strip() + "\n")

          path = "docs/architecture/FRONTEND_ARCHITECTURE.md"
          text = read(path)
          if "### Post-Cycle 3 Library origin-section boundary — UI-060" in text:
              raise SystemExit("Frontend UI-060 already present")
          text = text.rstrip() + r'''

          The contextual Image model-intent implementation was accepted on exact head `d5f80c02f041b645b7a3b1dee13d70d8139cc832` after all 19 attached workflows passed; PR #115 merged as `e8649ba39e660e2ec98cfd2fd864b22db74e64e3`. This changed no route, schema, worker deployment or production runtime state.

          ### Post-Cycle 3 Library origin-section boundary — UI-060
          The Library remains one `/library` route and one durable `media_assets` domain. Server-rendered page state maps the user-facing section to the existing indexed origin field: canonical Creatives → `generated`, explicit `tab=uploads` → `uploaded`. `listMediaAssets` owns the optional server-side origin constraint so filtering/pagination happen before serialization rather than as a client-only card filter. `GET /api/media/assets` exposes the same origin constraint only when requested and preserves its prior unified behavior when omitted.

          The browser does not create a second upload store. `LibraryView` carries the section through kind/search/Favorites/Collections/sort/pagination URLs, keys page-scoped selection by section, and enables `LibraryUploadButton` / `LibraryDropUploadSurface` only for Uploads. Viewer routes and asset-level actions remain origin-agnostic because durable asset IDs are unchanged. Migration `0003_persistent_media_uploads.sql` already supplies the `origin` constraint and `media_assets_origin_created_at_idx`; UI-060 adds no schema or infrastructure change. Exact reconciled head `a81c02e82abb0cec6b386e4cfb69f1075f377e33` passed all 30 attached workflows and merged as `999d32812e74afdba73e3cbaa7607a64ce65d603`.
          '''
          write(path, text.strip() + "\n")

          path = "docs/architecture/PRODUCT_CAPABILITIES.md"
          text = read(path)
          marker = "## Post-Cycle 3 Productization — User-selectable Image model"
          if marker not in text:
              raise SystemExit("Product model marker missing")
          if "## Post-Cycle 3 Library browsing — Creatives / Uploads" in text:
              raise SystemExit("Product UI-060 already present")
          before, tail = text.split(marker, 1)
          tail = marker + tail
          tail = tail.replace("**Status:** IMPLEMENTED / STAGING VERIFIED / FINAL PR ACCEPTANCE PENDING", "**Status:** COMPLETE / VERIFIED / MERGED", 1)
          tail = tail.rstrip() + r'''

          Exact PR head `d5f80c02f041b645b7a3b1dee13d70d8139cc832` passed all 19 attached workflows before PR #115 merged as `e8649ba39e660e2ec98cfd2fd864b22db74e64e3`. No schema, worker, provider-resource or production deployment change was required.

          ## Post-Cycle 3 Library browsing — Creatives / Uploads
          **Status:** COMPLETE / VERIFIED / MERGED

          The Library now exposes an origin browsing dimension over existing durable media: canonical **Creatives** maps to `origin=generated`, while **Uploads** maps to `origin=uploaded`. This does not change durable media identity or capability. Kind/search/Favorites/Collections/sort/pagination remain composable inside either origin. Upload/drag-drop are available only in Uploads; Viewer and asset-level capabilities remain unchanged. The media-list API accepts optional origin filtering and remains unified when omitted. Existing `media_assets.origin` schema/indexes are reused; no migration/backfill/storage/provider change was required.

          Exact reconciled head `a81c02e82abb0cec6b386e4cfb69f1075f377e33` passed 30/30 attached workflows; PR #116 merged as `999d32812e74afdba73e3cbaa7607a64ce65d603`, and all nine attached merged-main workflows passed.
          '''
          write(path, before.rstrip() + "\n\n" + tail.strip() + "\n")

          PY

      - name: Verify documentation-only scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            PROJECT.md \
            docs/architecture/FRONTEND_ARCHITECTURE.md \
            docs/architecture/PRODUCT_CAPABILITIES.md \
            docs/ui/SCREEN_REGISTRY.md \
            docs/ui/UI_DECISIONS.md \
            docs/ui/UI_MIGRATION.md | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected documentation closure diff:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          grep -Fq 'COMPLETE / VERIFIED / MERGED' PROJECT.md
          grep -Fq 'UI-060 — Library separates Creatives and Uploads' docs/ui/UI_DECISIONS.md
          grep -Fq 'PR #116 merged as `999d32812e74afdba73e3cbaa7607a64ce65d603`' docs/ui/UI_MIGRATION.md
          ! grep -R -Fq 'EXACT-HEAD PR ACCEPTANCE PENDING' PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/PRODUCT_CAPABILITIES.md
          ! grep -R -Fq 'FINAL PR ACCEPTANCE PENDING' docs/ui/SCREEN_REGISTRY.md docs/architecture/PRODUCT_CAPABILITIES.md

      - name: Commit closure and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-cycle3-doc-closure.yml
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/PRODUCT_CAPABILITIES.md
          git commit -m "Close post-Cycle 3 corrective documentation"
          git push origin HEAD:docs/post-cycle3-corrective-closure

              '''          <Textarea\n            ref={promptInputRef}\n            id="create-prompt"\n            variant="bare"\n            value={prompt}\n            onChange={handlePromptChange}\n            onSelect={(event) => rememberPromptSelection(event.currentTarget)}''',

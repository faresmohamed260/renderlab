name: Stage Phase 7A reference foundation

on:
  push:
    branches:
      - stage/phase-7a-reference-foundation
    paths:
      - .github/workflows/apply-phase-7a-reference-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/phase-7a-reference-foundation
          fetch-depth: 0

      - name: Apply reference identity and prompt-addressing foundation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          # Structured aliases and shared prompt-reference helpers.
          replace_once(
              'src/lib/capabilities/generation.ts',
              'export type GenerationInputRole = "reference" | "primary-image" | "first-frame";\n\nexport type GenerationInputSource =',
              '''export type GenerationInputRole = "reference" | "primary-image" | "first-frame";\n\nexport type GenerationInputAlias = `image${number}`;\n\nexport const generationInputAliasPattern = /^image[1-9]\\d*$/;\n\nexport function generationInputAlias(position: number): GenerationInputAlias {\n  if (!Number.isInteger(position) || position < 1) throw new RangeError("Reference positions begin at 1.");\n  return `image${position}` as GenerationInputAlias;\n}\n\nexport function generationPromptReferenceAliases(prompt: string): GenerationInputAlias[] {\n  const aliases = prompt.match(/@image\\d+\\b/g)?.map((mention) => mention.slice(1) as GenerationInputAlias) ?? [];\n  return [...new Set(aliases)];\n}\n\nexport function unresolvedGenerationPromptReferenceAliases(\n  prompt: string,\n  attachedAliases: readonly string[],\n): GenerationInputAlias[] {\n  const attached = new Set(attachedAliases);\n  return generationPromptReferenceAliases(prompt).filter((alias) => !attached.has(alias));\n}\n\nexport type GenerationInputSource =''',
          )
          replace_once(
              'src/lib/capabilities/generation.ts',
              'export type GenerationInput = {\n  source: GenerationInputSource;\n  role: GenerationInputRole;\n};',
              'export type GenerationInput = {\n  alias: GenerationInputAlias;\n  source: GenerationInputSource;\n  role: GenerationInputRole;\n};',
          )

          # API parser: normalize legacy callers positionally, validate aliases, reject unresolved prompt mentions.
          replace_once(
              'src/lib/api/generation-contract.ts',
              '  defaultVideoAudioEnabled,\n  generationAdvancedCapabilities,\n  imageAspectRatios,\n  videoAspectRatios,',
              '  defaultVideoAudioEnabled,\n  generationAdvancedCapabilities,\n  generationInputAlias,\n  generationInputAliasPattern,\n  imageAspectRatios,\n  unresolvedGenerationPromptReferenceAliases,\n  videoAspectRatios,',
          )
          replace_once(
              'src/lib/api/generation-contract.ts',
              '''function parseInputs(value: unknown): GenerationInput[] | null {\n  if (!Array.isArray(value)) return null;\n\n  const inputs: GenerationInput[] = [];\n  for (const item of value) {\n    if (!isRecord(item) || !isRecord(item.source)) return null;\n    if (typeof item.role !== "string" || !inputRoles.has(item.role as GenerationInput["role"])) return null;\n\n    const sourceType = item.source.type;\n    const sourceId = item.source.id;\n    if (typeof sourceType !== "string" || !inputSourceTypes.has(sourceType as GenerationInput["source"]["type"])) return null;\n    if (typeof sourceId !== "string" || !sourceId.trim()) return null;\n\n    inputs.push({\n      role: item.role as GenerationInput["role"],\n      source: {\n        type: sourceType as GenerationInput["source"]["type"],\n        id: sourceId.trim(),\n      },\n    });\n  }\n  return inputs;\n}''',
              '''function parseInputs(value: unknown): GenerationInput[] | null {\n  if (!Array.isArray(value)) return null;\n\n  const inputs: GenerationInput[] = [];\n  const aliases = new Set<string>();\n  for (const [index, item] of value.entries()) {\n    if (!isRecord(item) || !isRecord(item.source)) return null;\n    if (typeof item.role !== "string" || !inputRoles.has(item.role as GenerationInput["role"])) return null;\n\n    const rawAlias = item.alias;\n    const alias = rawAlias === undefined ? generationInputAlias(index + 1) : rawAlias;\n    if (typeof alias !== "string" || !generationInputAliasPattern.test(alias) || aliases.has(alias)) return null;\n    aliases.add(alias);\n\n    const sourceType = item.source.type;\n    const sourceId = item.source.id;\n    if (typeof sourceType !== "string" || !inputSourceTypes.has(sourceType as GenerationInput["source"]["type"])) return null;\n    if (typeof sourceId !== "string" || !sourceId.trim()) return null;\n\n    inputs.push({\n      alias: alias as GenerationInput["alias"],\n      role: item.role as GenerationInput["role"],\n      source: {\n        type: sourceType as GenerationInput["source"]["type"],\n        id: sourceId.trim(),\n      },\n    });\n  }\n  return inputs;\n}''',
          )
          replace_once(
              'src/lib/api/generation-contract.ts',
              '''  if (typeof value.prompt !== "string" || !value.prompt.trim()) {\n    return { ok: false, error: { code: "invalid_request", message: "A prompt is required." } };\n  }\n\n  if (!isRecord(value.output)) {''',
              '''  if (typeof value.prompt !== "string" || !value.prompt.trim()) {\n    return { ok: false, error: { code: "invalid_request", message: "A prompt is required." } };\n  }\n  const prompt = value.prompt.trim();\n\n  if (!isRecord(value.output)) {''',
          )

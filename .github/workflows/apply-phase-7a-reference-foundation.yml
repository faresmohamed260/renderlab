              '''  async function submit(event: FormEvent<HTMLFormElement>) {\n    event.preventDefault();\n    if (!canSubmit) return;\n    if (hasReference && !referenceAlias) {\n      setError("The attached reference is missing its product identity. Reattach it before generating.");\n      return;\n    }\n\n    const advanced =''',

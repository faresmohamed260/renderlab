name: Temporary UI-030 Whitespace Fix

on:
  push:
    branches: [docs/ui030-rollout-complete]
    paths:
      - ".github/workflows/tmp-ui030-whitespace-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ui030-rollout-complete
      - name: Remove one legacy trailing-space sequence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ui/UI_MIGRATION.md')
          text = path.read_text()
          old = '**Completed product slices:** Persistent Upload PR #9, Library Search PR #10, Download PR #11, Rename PR #12, History Ordering PR #14 and Drag/drop Upload PR #15 are merged and approved.  \n'
          new = '**Completed product slices:** Persistent Upload PR #9, Library Search PR #10, Download PR #11, Rename PR #12, History Ordering PR #14 and Drag/drop Upload PR #15 are merged and approved.\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy completed-slices line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/UI_MIGRATION.md
          git diff --cached --check
          git commit -m "Normalize UI migration handoff whitespace"
          git push origin HEAD:docs/ui030-rollout-complete

name: Phase 26 Integrated Verifier Patch

on:
  push:
    branches:
      - work/phase-26-activity-job-matrix
    paths:
      - .github/workflows/phase26-integrated-verifier-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-26-activity-job-matrix
          fetch-depth: 0

      - name: Tighten Integrated Release retry locator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-integrated-release.mjs')
          text = path.read_text()
          old = '  const retryRow = page.locator("li").filter({ hasText: retryPrompt }).first();\n'
          new = '  const retryRow = page.locator("li").filter({ hasText: retryPrompt }).filter({ hasText: "Sanitized Phase 12 recovery fixture failure." }).first();\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one ambiguous retry locator, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          node --check scripts/verify-integrated-release.mjs

      - name: Commit verifier fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-integrated-release.mjs
          git commit -m 'Stabilize Integrated Release retry verification'
          git push origin HEAD:work/phase-26-activity-job-matrix

name: Phase 13 Email Domain Documentation

on:
  push:
    branches:
      - docs/phase-13-email-domain-design
    paths:
      - .github/workflows/phase-13-email-domain-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-13-email-domain-design
          fetch-depth: 0

      - name: Apply documentation patch
        run: python .github/phase13_email_domain_patch.py

      - name: Validate and commit documentation only
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/phase-13-email-domain-docs.yml .github/phase13_email_domain_patch.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: lock RenderLab transactional email identity"
          git push origin HEAD:docs/phase-13-email-domain-design

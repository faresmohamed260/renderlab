name: Patch 223 Credential Fields

on:
  push:
    branches:
      - account/223-profile-credential-implementation
    paths:
      - .github/workflows/patch-223-credential-fields.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-implementation
          fetch-depth: 1
      - name: Apply credential field integration
        run: python scripts/patch-223-credential-fields.py
      - name: Commit credential field integration
        run: |
          set -euo pipefail
          git rm scripts/patch-223-credential-fields.py .github/workflows/patch-223-credential-fields.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/account/account-settings.tsx src/features/account/account-email-form.tsx src/features/account/account-data-privacy.tsx src/features/account/account-password-form.tsx
          git commit -m "feat: standardize account credential fields"
          git push origin HEAD:account/223-profile-credential-implementation

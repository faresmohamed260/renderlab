name: Phase 10C Verification Stage

on:
  push:
    branches:
      - tmp/phase10c-verification-stage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 10C verification wiring
        shell: bash
        run: |
          python .github/phase10c_verification_patch.py
          rm .github/phase10c_verification_patch.py
          rm .github/workflows/phase10c-verification-stage.yml
          git diff --check
          node --check scripts/verify-generation-admission.mjs
          node --check scripts/verify-admin-operations.mjs
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: wire Phase 10C verification matrix"
          git push

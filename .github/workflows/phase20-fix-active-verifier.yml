name: Phase 20 active verifier correction

on:
  push:
    branches:
      - work/phase-20-create-instrument
    paths:
      - .github/workflows/phase20-fix-active-verifier.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-20-create-instrument
          fetch-depth: 0
      - name: Apply stable active actuator verification
        run: python .github/scripts/phase20-fix-active-verifier.py
      - name: Commit correction and remove helper
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/phase20-fix-active-verifier.yml .github/scripts/phase20-fix-active-verifier.py
          git add scripts/verify-create-lifecycle.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: verify active Phase 20 actuator by stable marker"
          git push origin HEAD:work/phase-20-create-instrument

name: Temporary UI-036 Implementation Sync

on:
  push:
    branches: [tmp/ui036-impl-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep video audio visible on mobile
        shell: bash
        run: |
          git fetch origin work/video-audio-control
          git checkout -B work/video-audio-control origin/work/video-audio-control
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/features/create/create-workspace.tsx",
              '''                  <>\n                    <Button\n                      type="button"\n                      variant="secondary"\n                      onClick={() => setDurationSeconds(nextValue(videoDurations, durationSeconds))}\n                      aria-label={`Duration ${durationSeconds} seconds. Activate to choose the next duration.`}\n                      className="shrink-0"\n                    >\n                      {durationSeconds} s\n                    </Button>\n                    <Toggle\n                      pressed={audioEnabled}\n                      onPressedChange={setAudioEnabled}\n                      size="sm"\n                      aria-label={`Audio ${audioEnabled ? "on" : "off"}`}\n                      title={audioEnabled ? "Generate video with audio" : "Generate video without audio"}\n                      className="shrink-0 gap-1.5 bg-surface-2"\n                    >\n                      {audioEnabled ? <Volume2 aria-hidden="true" className="size-4" /> : <VolumeX aria-hidden="true" className="size-4" />}\n                      Audio\n                    </Toggle>\n                  </>\n''',
              '''                  <>\n                    <Toggle\n                      pressed={audioEnabled}\n                      onPressedChange={setAudioEnabled}\n                      size="sm"\n                      aria-label={`Audio ${audioEnabled ? "on" : "off"}`}\n                      title={audioEnabled ? "Generate video with audio" : "Generate video without audio"}\n                      className="shrink-0 gap-1.5 bg-surface-2"\n                    >\n                      {audioEnabled ? <Volume2 aria-hidden="true" className="size-4" /> : <VolumeX aria-hidden="true" className="size-4" />}\n                      <span className="hidden sm:inline">Audio</span>\n                    </Toggle>\n                    <Button\n                      type="button"\n                      variant="secondary"\n                      onClick={() => setDurationSeconds(nextValue(videoDurations, durationSeconds))}\n                      aria-label={`Duration ${durationSeconds} seconds. Activate to choose the next duration.`}\n                      className="shrink-0"\n                    >\n                      {durationSeconds} s\n                    </Button>\n                  </>\n''',
          )

          replace(
              "tests/ui/create.spec.ts",
              '''  const audio = page.getByRole("button", { name: "Audio on" });\n  await expect(audio).toBeVisible();\n  await expect(audio).toHaveAttribute("aria-pressed", "true");\n  await expect(page.getByRole("button", { name: /Duration 5 seconds/ })).toBeVisible();\n  await expect(page.getByRole("button", { name: "Generate", exact: true })).toBeVisible();\n\n  await page.screenshot({ path: "artifacts/create-mobile-video.png", fullPage: true });\n''',
              '''  const audio = page.getByRole("button", { name: "Audio on" });\n  await expect(audio).toBeVisible();\n  await expect(audio).toHaveAttribute("aria-pressed", "true");\n  const audioBox = await audio.boundingBox();\n  expect(audioBox).not.toBeNull();\n  expect(audioBox!.x).toBeGreaterThanOrEqual(0);\n  expect(audioBox!.x + audioBox!.width).toBeLessThanOrEqual(mobileViewport.width);\n  await expect(page.getByRole("button", { name: /Duration 5 seconds/ })).toBeVisible();\n  await expect(page.getByRole("button", { name: "Generate", exact: true })).toBeVisible();\n\n  await page.screenshot({ path: "artifacts/create-mobile-video.png", fullPage: true });\n''',
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/create/create-workspace.tsx tests/ui/create.spec.ts
          git commit -m "Keep video audio visible on mobile"
          git push origin HEAD:work/video-audio-control

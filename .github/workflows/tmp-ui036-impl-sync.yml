name: Temporary UI-036 Implementation Sync

on:
  push:
    branches: [tmp/ui036-impl-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize video audio default
        shell: bash
        run: |
          git fetch origin work/video-audio-control
          git checkout -B work/video-audio-control origin/work/video-audio-control
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/lib/capabilities/generation.ts",
              'export type GenerationInput = {\n  source: GenerationInputSource;\n  role: GenerationInputRole;\n};\n\n',
              'export type GenerationInput = {\n  source: GenerationInputSource;\n  role: GenerationInputRole;\n};\n\nexport const defaultVideoAudioEnabled = true;\n\n',
          )
          replace(
              "src/lib/capabilities/generation.ts",
              '      frameRate: 24 as const,\n      audioEnabled: true,\n',
              '      frameRate: 24 as const,\n',
          )

          replace(
              "src/features/create/create-workspace.tsx",
              '  continuationActionsForMedia,\n  imageAspectRatios,\n',
              '  continuationActionsForMedia,\n  defaultVideoAudioEnabled,\n  imageAspectRatios,\n',
          )
          replace(
              "src/features/create/create-workspace.tsx",
              '  const [audioEnabled, setAudioEnabled] = useState(true);\n',
              '  const [audioEnabled, setAudioEnabled] = useState(defaultVideoAudioEnabled);\n',
          )

          replace(
              "src/lib/api/generation-contract.ts",
              'import { generationAdvancedCapabilities } from "@/lib/capabilities/generation";\n',
              'import { defaultVideoAudioEnabled, generationAdvancedCapabilities } from "@/lib/capabilities/generation";\n',
          )
          replace(
              "src/lib/api/generation-contract.ts",
              '          ? { durationSeconds: durationSeconds as number, audioEnabled: audioEnabled === undefined ? true : audioEnabled }\n',
              '          ? { durationSeconds: durationSeconds as number, audioEnabled: audioEnabled === undefined ? defaultVideoAudioEnabled : audioEnabled }\n',
          )

          replace(
              "src/server/generation/native-generation.ts",
              'import { resolveCreativeOperation } from "@/lib/capabilities/generation";\n',
              'import { defaultVideoAudioEnabled, resolveCreativeOperation } from "@/lib/capabilities/generation";\n',
          )
          replace(
              "src/server/generation/native-generation.ts",
              '      audioEnabled: true,\n',
              '      audioEnabled: defaultVideoAudioEnabled,\n',
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/capabilities/generation.ts src/features/create/create-workspace.tsx src/lib/api/generation-contract.ts src/server/generation/native-generation.ts
          git commit -m "Centralize video audio default"
          git push origin HEAD:work/video-audio-control

name: Temporary UI-036 Implementation Sync

on:
  push:
    branches: [tmp/ui036-impl-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wrap mobile video essentials
        shell: bash
        run: |
          git fetch origin work/video-audio-control
          git checkout -B work/video-audio-control origin/work/video-audio-control
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/features/create/create-workspace.tsx",
              'className="flex min-w-0 flex-1 items-center gap-2 overflow-x-auto pb-1 sm:overflow-visible sm:pb-0"',
              'className="flex min-w-0 flex-1 flex-wrap items-center gap-2 pb-1 sm:flex-nowrap sm:overflow-visible sm:pb-0"',
          )

          replace(
              "tests/ui/create.spec.ts",
              '''  const audioBox = await audio.boundingBox();\n  expect(audioBox).not.toBeNull();\n  expect(audioBox!.x).toBeGreaterThanOrEqual(0);\n  expect(audioBox!.x + audioBox!.width).toBeLessThanOrEqual(mobileViewport.width);\n  await expect(page.getByRole("button", { name: /Duration 5 seconds/ })).toBeVisible();\n  await expect(page.getByRole("button", { name: "Generate", exact: true })).toBeVisible();\n''',
              '''  const audioBox = await audio.boundingBox();\n  expect(audioBox).not.toBeNull();\n  expect(audioBox!.x).toBeGreaterThanOrEqual(0);\n  expect(audioBox!.x + audioBox!.width).toBeLessThanOrEqual(mobileViewport.width);\n  const duration = page.getByRole("button", { name: /Duration 5 seconds/ });\n  await expect(duration).toBeVisible();\n  const durationBox = await duration.boundingBox();\n  expect(durationBox).not.toBeNull();\n  expect(durationBox!.x).toBeGreaterThanOrEqual(0);\n  expect(durationBox!.x + durationBox!.width).toBeLessThanOrEqual(mobileViewport.width);\n  await expect(page.getByRole("button", { name: "Open Advanced controls" })).toBeVisible();\n  await expect(page.getByRole("button", { name: "Generate", exact: true })).toBeVisible();\n''',
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/create/create-workspace.tsx tests/ui/create.spec.ts
          git commit -m "Wrap mobile video essentials"
          git push origin HEAD:work/video-audio-control

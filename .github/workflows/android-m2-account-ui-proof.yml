name: Android M2 disabled account screen proof
on:
  pull_request:
    paths:
      - apps/mobile/tools/android-m2-account-ui-qa.py
      - .github/workflows/android-m2-account-ui-proof.yml
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      JAVA_TOOL_OPTIONS: -Xmx3g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable emulator hardware acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Deterministic mobile dependencies
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Build isolated standalone Android APK, no Metro
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('app.json','utf8'));
          cfg.expo.android.package='dev.renderlab.m2accountuiqa';
          cfg.expo.name='RenderLab M2 offline account QA';
          cfg.expo.slug='renderlab-m2-account-offline-only';
          fs.writeFileSync('app.json',JSON.stringify(cfg,null,2));
          NODE
          npx expo prebuild --platform android --no-install --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - name: Disposable emulator-only signing
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/m2-qa-only.p12" \
            -alias m2-only -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=RenderLab M2 offline account QA' \
            -storepass changeit -keypass changeit >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$SIGNER" sign --ks "$RUNNER_TEMP/m2-qa-only.p12" --ks-key-alias m2-only \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --out "$RUNNER_TEMP/m2-qa-only.apk" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$SIGNER" verify "$RUNNER_TEMP/m2-qa-only.apk"
      - name: Verify disabled account screen without internet or Metro
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 apps/mobile/tools/android-m2-account-ui-qa.py "$RUNNER_TEMP/m2-qa-only.apk"
      - name: Destroy QA APK and signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/m2-qa-only.apk" "$RUNNER_TEMP/m2-qa-only.p12"
          rm -rf apps/mobile/android
          echo "No production login, credential capture or APK distribution"

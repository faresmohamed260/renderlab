name: Phase 23 Refresh Stale Create Verifiers

on:
  push:
    branches:
      - work/phase-23-create-clear-composer
    paths:
      - .github/workflows/phase23-refresh-stale-create-verifiers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh stale verifier assertions
        run: python3 scripts/phase23-refresh-stale-create-verifiers.py

      - name: Commit verifier cleanup
        run: |
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git rm .github/workflows/phase23-refresh-stale-create-verifiers.yml scripts/phase23-refresh-stale-create-verifiers.py
          git add docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md tests/ui/create.spec.ts tests/ui/library.spec.ts scripts/verify-create-durable-upload.mjs scripts/verify-library-lifecycle.mjs scripts/verify-integrated-release.mjs
          git diff --cached --check
          git commit -m "Phase 23: align repository verifiers with Clear Composer"
          git push origin HEAD:work/phase-23-create-clear-composer

name: ENT-009 Lock Bootstrap

on:
  push:
    branches: [work/ent-009-coverage-visibility]
    paths:
      - ".github/workflows/ent009-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate exact c8 lock state
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact c8@12.0.0

      - name: Verify generated diff
        run: git diff --check

      - name: Commit generated dependency state
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add pinned c8 coverage tooling"
          git push origin "HEAD:${GITHUB_REF_NAME}"

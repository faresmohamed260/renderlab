name: Phase 26 Roadmap Handoff

on:
  push:
    branches:
      - docs/phase-25-handoff-2026-09-13
    paths:
      - .github/workflows/phase26-next-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-25-handoff-2026-09-13
          fetch-depth: 0
      - name: Advance redesign roadmap to Phase 26
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path('PROJECT.md')
          text = project.read_text()
          old = '- **Library:** approved Gallery Rail v0.3 / UI-075, merged and verified, not yet deployed.\n- **Application shell:** UI-074 compact horizontal header is the current shared shell geometry and should be maintained/cohered rather than restarted as a competing navigation system.'
          new = '- **Library:** approved Gallery Rail v0.3 / UI-075, merged and verified, not yet deployed.\n- **Media Viewer:** approved Media Register + Source Fold v0.2 / UI-076, merged and merged-main verified, not yet deployed.\n- **Application shell:** UI-074 compact horizontal header is the current shared shell geometry and should be maintained/cohered rather than restarted as a competing navigation system.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '2. **Phase 26 — Activity:** roadmap only until Phase 25 evidence closes. Bring real generation lifecycle/history states into the same authored system at 2/4 expressiveness without weakening Retry / Run Again / Cancel truth or operational clarity.'
          new = '2. **Phase 26 — Activity:** NEXT / ACTIVE R&D. Phase 25 evidence is closed; audit the current Activity desktop/390px real-state lifecycle, then develop same-family concepts at 2/4 expressiveness without weakening Retry / Run Again / Cancel truth or operational clarity. No production Activity implementation should begin before explicit design approval and an implementation contract.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = 'Only the immediate Phase 25 R&D slice may be expanded now; later phases remain roadmap-level until predecessor evidence exists. Every remaining surface must reuse the established RenderLab visual/interaction family rather than inventing a new theme.'
          new = 'Phase 25 is closed. The next session may expand only the immediate Phase 26 Activity R&D slice; Phases 27–29 remain roadmap-level until predecessor evidence exists. Every remaining surface must reuse the established RenderLab visual/interaction family rather than inventing a new theme.'
          assert text.count(old) == 1
          project.write_text(text.replace(old, new, 1))

          migration = Path('docs/ui/UI_MIGRATION.md')
          text = migration.read_text()
          old = '## Active full-product redesign roadmap — after Phase 24\n**Status: `IN PROGRESS`.** Phase 24 completes the Library slice only; the full UI/UX redesign is not complete.'
          new = '## Active full-product redesign roadmap — after Phase 25\n**Status: `IN PROGRESS`.** Phase 25 completes the Media Viewer slice only; the full UI/UX redesign is not complete.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '- [ ] **Phase 26 Activity redesign — ROADMAP ONLY.** Expand only after Phase 25 produces verified evidence.'
          new = '- [ ] **Phase 26 Activity redesign — NEXT / ACTIVE R&D.** Phase 25 verified evidence is closed. Audit current Activity desktop/390px real job states, Retry / Run Again / Cancel, loading/empty/error behavior and real-state-driven motion; develop same-family concepts and obtain explicit design approval before any production implementation contract.'
          assert text.count(old) == 1
          migration.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- PROJECT.md docs/ui/UI_MIGRATION.md
      - name: Commit roadmap and remove helper
        shell: bash
        run: |
          rm .github/workflows/phase26-next-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md .github/workflows/phase26-next-docs.yml
          git commit -m "Advance redesign roadmap to Phase 26 Activity R&D"
          git push origin HEAD:docs/phase-25-handoff-2026-09-13

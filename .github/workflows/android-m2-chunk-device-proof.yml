name: Android M2 isolated chunked SecureStore proof
on:
  pull_request:
    paths:
      - apps/mobile/tools/android-m2-chunk-qa-screen.tsx
      - apps/mobile/tools/android-m2-chunk-qa.py
      - .github/workflows/android-m2-chunk-device-proof.yml
permissions:
  contents: read
concurrency:
  group: android-m2-chunks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      JAVA_TOOL_OPTIONS: -Xmx3g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable Android hardware acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Deterministic mobile dependencies and tests
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Verify backup exclusions and assemble isolated standalone Android proof
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          cp tools/android-m2-chunk-qa-screen.tsx 'src/app/(tabs)/settings.tsx'
          node - <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('app.json','utf8'));
          cfg.expo.android.package = 'dev.renderlab.m2chunkproof';
          cfg.expo.name = 'RenderLab M2 synthetic encrypted storage proof';
          cfg.expo.slug = 'renderlab-m2-chunk-emulator-only';
          fs.writeFileSync('app.json', JSON.stringify(cfg,null,2));
          NODE
          npx expo prebuild --platform android --no-install --non-interactive
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('android/app/src/main')
          manifest = (app / 'AndroidManifest.xml').read_text()
          expected = (
              ('fullBackupContent', 'secure_store_backup_rules.xml'),
              ('dataExtractionRules', 'secure_store_data_extraction_rules.xml'),
          )
          native_resources = Path('node_modules/expo-secure-store/android/src/main/res/xml')
          for attribute, filename in expected:
              reference = '@xml/' + filename.removesuffix('.xml')
              if 'android:' + attribute + '="' + reference + '"' not in manifest:
                  raise AssertionError('Missing required Android manifest backup reference: ' + attribute)
              app_copy = app / 'res/xml' / filename
              module_copy = native_resources / filename
              rules = app_copy if app_copy.exists() else module_copy
              if not rules.exists():
                  raise AssertionError('Missing native merged-resource source: ' + filename)
              xml = rules.read_text()
              excludes = re.findall(r'<exclude\\s+domain="sharedpref"\\s+path="SecureStore"\\s*/>', xml)
              minimum = 2 if attribute == 'dataExtractionRules' else 1
              if len(excludes) < minimum:
                  raise AssertionError('SecureStore excluded in fewer backup paths than required: ' + filename)
              print('PASS Android backup resource and manifest for:', attribute,
                    'excluded paths:', len(excludes))
          # App-local rules, when present, override the Expo module resource:
          # only the effective merged-resource source above may be accepted.
          PY
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - name: Disposable emulator-only APK signing
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/m2-chunk-only.p12" \
            -alias m2-only -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=RenderLab M2 synthetic device QA only' \
            -storepass changeit -keypass changeit >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$SIGNER"
          "$SIGNER" sign --ks "$RUNNER_TEMP/m2-chunk-only.p12" --ks-key-alias m2-only \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --out "$RUNNER_TEMP/m2-chunk-only.apk" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$SIGNER" verify "$RUNNER_TEMP/m2-chunk-only.apk"
      - name: Prove encrypted multi-chunk native storage and uninstall
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 apps/mobile/tools/android-m2-chunk-qa.py "$RUNNER_TEMP/m2-chunk-only.apk"
      - name: Remove disposable build artifacts and credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/m2-chunk-only.apk" "$RUNNER_TEMP/m2-chunk-only.p12"
          rm -rf apps/mobile/android
          echo "No upload, real accounts, production Auth requests, or APK distribution"

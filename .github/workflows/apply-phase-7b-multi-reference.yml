name: Apply Phase 7B Multi-reference

on:
  push:
    branches:
      - work/phase-7b-multi-reference-v0-1
    paths:
      - .github/workflows/apply-phase-7b-multi-reference.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/scripts/apply-phase-7b-multi-reference.py")
          text = path.read_text()
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if text.count(old) != 1:
              raise SystemExit("Could not locate regex helper replacement call.")
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/scripts/apply-phase-7b-multi-reference.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify maintained UI primitives
        run: npm run verify:ui-purity

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1

      - name: Run Create UI and request-contract tests
        run: npx playwright test tests/ui/create.spec.ts

      - name: Finalize product commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-phase-7b-multi-reference.yml
          rm .github/scripts/apply-phase-7b-multi-reference.py
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "RenderLab Phase 7B Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git commit -m "Implement bounded multi-reference image editing"
          git push

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

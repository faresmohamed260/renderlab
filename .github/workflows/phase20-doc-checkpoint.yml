name: Phase 20 documentation checkpoint

on:
  push:
    branches:
      - work/phase-20-create-instrument
    paths:
      - .github/workflows/phase20-doc-checkpoint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-20-create-instrument
          fetch-depth: 0
      - name: Update authoritative Phase 20 docs
        run: python .github/scripts/phase20-doc-checkpoint.py
      - name: Commit checkpoint and remove helper
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/phase20-doc-checkpoint.yml .github/scripts/phase20-doc-checkpoint.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record Phase 20 implementation checkpoint"
          git push origin HEAD:work/phase-20-create-instrument

# retry after whitespace normalization

name: Landing Complete Surface R&D

on:
  pull_request:
    paths:
      - "design/prototypes/landing-complete-surface-rd-v0.1/**"
      - "scripts/verify-landing-complete-surface-rd.mjs"
      - ".github/workflows/landing-complete-surface-rd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-landing-complete-surface-rd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify script syntax
        run: node --check scripts/verify-landing-complete-surface-rd.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated static prototype
        run: |
          python3 -m http.server 4173 --directory . > /tmp/renderlab-landing-complete.log 2>&1 &
          echo $! > /tmp/renderlab-landing-complete.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/design/prototypes/landing-complete-surface-rd-v0.1/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-landing-complete.log
          exit 1

      - name: Verify complete Landing surface
        run: node scripts/verify-landing-complete-surface-rd.mjs

      - name: Print static-server log on failure
        if: failure()
        run: cat /tmp/renderlab-landing-complete.log || true

      - name: Upload complete-surface R&D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-landing-complete-surface-rd-v0.1
          path: artifacts/landing-complete-surface-rd-v0.1/*.png
          if-no-files-found: warn
          retention-days: 14

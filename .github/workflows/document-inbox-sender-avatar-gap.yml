name: Document Inbox Sender Avatar Gap

on:
  push:
    branches:
      - docs/inbox-sender-avatar-gap
    paths:
      - .github/workflows/document-inbox-sender-avatar-gap.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/inbox-sender-avatar-gap
          fetch-depth: 0

      - name: Update authoritative documentation
        run: |
          python scripts/tmp-document-inbox-sender-avatar-gap.py
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ui/UI_DECISIONS.md')
          text = p.read_text()
          marker = '### UI-054 — Inbox sender avatar uses authenticated RenderLab brand identity'
          if marker in text:
              before, after = text.split(marker, 1)
              after = '\n'.join(line.rstrip() for line in (marker + after).splitlines()) + '\n'
              p.write_text(before + after)
          PY

      - name: Remove helpers and validate final scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/document-inbox-sender-avatar-gap.yml scripts/tmp-document-inbox-sender-avatar-gap.py
          git diff --check
          git add -A
          mapfile -t unique < <(git diff --cached --name-only origin/main | sed '/^$/d' | sort -u)
          expected=(PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md)
          mapfile -t exp < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'Final candidate files:\n%s\n' "${unique[*]}"
          test "$(printf '%s\n' "${unique[@]}")" = "$(printf '%s\n' "${exp[@]}")"
          ! grep -R "playboy40k@gmail.com\|bplay2086@gmail.com" PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md

      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record inbox sender avatar branding gap"
          git push origin HEAD:docs/inbox-sender-avatar-gap

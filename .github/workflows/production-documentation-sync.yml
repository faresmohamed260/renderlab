name: Production Documentation Sync

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Exact 40-character Git SHA independently verified as production-live
        required: true
        type: string
  workflow_call:
    inputs:
      expected_production_sha:
        description: Exact 40-character Git SHA independently verified as production-live
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: renderlab-production-documentation-sync-${{ inputs.expected_production_sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDERLAB_EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      RENDERLAB_VERCEL_TEAM_ID: team_r09C6RLmb2acHapENECQIn9T
      RENDERLAB_VERCEL_PROJECT_ID: prj_UGFbrAJ0fg2H0cZOznBoCZ8RCsJU
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository production records
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate exact production SHA input
        shell: bash
        run: |
          if ! printf "%s" "$RENDERLAB_EXPECTED_PRODUCTION_SHA" | grep -Eq "^[0-9a-fA-F]{40}$"; then
            echo "::error::expected_production_sha must be an exact 40-character Git SHA."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify canonical production manifest and documentation mirrors
        run: node scripts/verify-production-documentation-sync.mjs

      - name: Verify production state read-only against GitHub and Vercel
        run: node scripts/verify-production-live-state.mjs

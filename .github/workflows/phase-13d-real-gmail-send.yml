name: Phase 13D Real Gmail Send

on:
  push:
    branches:
      - work/phase-13d-real-gmail-acceptance
    paths:
      - scripts/verify-217-mfa-security-mail.mjs
      - .github/workflows/phase-13d-real-gmail-send.yml

permissions:
  contents: read

jobs:
  real-gmail-send:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RENDERLAB_217_REAL_MFA_MAIL_ARMED: YES_RENDERLAB_217_REAL_MFA_EMAIL
    steps:
      - name: Checkout exact Gmail acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify script syntax
        run: node --check scripts/verify-217-mfa-security-mail.mjs
      - name: Verify bounded MFA security-mail delivery
        run: node scripts/verify-217-mfa-security-mail.mjs

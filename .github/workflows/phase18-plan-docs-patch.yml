name: Phase 18 Planning Docs Patch

on:
  push:
    branches: [plan/phase-18-image-upscale]
    paths:
      - .github/workflows/phase18-plan-docs-patch.yml

permissions:
  contents: write

concurrency:
  group: renderlab-phase18-plan-docs-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard authoritative baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          expected='e0ba6ae3e8eadefbe1a7c1ae6bf37d3fdaec755e'
          actual="$(git rev-parse origin/main)"
          base="$(git merge-base HEAD origin/main)"
          test "$actual" = "$expected"
          test "$base" = "$expected"
          echo "PHASE18_PLAN_BASELINE $expected"

      - name: Apply guarded authoritative documentation patch
        run: python .phase18-plan-docs-patch.py

      - name: Validate exact documentation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            PROJECT.md
            docs/architecture/FRONTEND_ARCHITECTURE.md
            docs/architecture/INFRASTRUCTURE.md
            docs/architecture/PRODUCT_CAPABILITIES.md
            docs/ui/SCREEN_REGISTRY.md
            docs/ui/UI_DECISIONS.md
            docs/ui/UI_MIGRATION.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#changed[@]}" -ne "${#expected_sorted[@]}" ]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          echo 'PHASE18_PLAN_DOC_SCOPE_OK'
          printf '%s\n' "${changed[@]}"

      - name: Commit planning contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PROJECT.md \
            docs/architecture/FRONTEND_ARCHITECTURE.md \
            docs/architecture/INFRASTRUCTURE.md \
            docs/architecture/PRODUCT_CAPABILITIES.md \
            docs/ui/SCREEN_REGISTRY.md \
            docs/ui/UI_DECISIONS.md \
            docs/ui/UI_MIGRATION.md
          git commit -m 'docs: accept Phase 18 image upscale contract'
          git push origin HEAD:plan/phase-18-image-upscale

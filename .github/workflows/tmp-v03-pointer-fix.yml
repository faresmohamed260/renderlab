name: Temporary v0.3 Pointer Fix

on:
  push:
    branches:
      - rd/create-premium-workstation-v03
    paths:
      - ".github/workflows/tmp-v03-pointer-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rd/create-premium-workstation-v03
          fetch-depth: 0
      - name: Apply pointer patch
        run: python3 scripts/tmp-fix-v03-pointer.py
      - name: Validate patch
        run: git diff --check
      - name: Remove one-shot helper
        run: git rm scripts/tmp-fix-v03-pointer.py .github/workflows/tmp-v03-pointer-fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/prototypes/create-lab-matrix-v03/prototype.js scripts/verify-create-lab-matrix-v03.mjs
          git commit -m "R&D: route reorder through explicit grab surface"
          git push origin HEAD:rd/create-premium-workstation-v03

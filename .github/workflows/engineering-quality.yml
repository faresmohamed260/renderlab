name: Engineering Quality

on:
  push:
    branches: [tmp/220-doc-closure-20260916]
    paths:
      - ".github/workflows/engineering-quality.yml"

permissions:
  contents: write

concurrency:
  group: renderlab-engineering-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scratch head
        uses: actions/checkout@v4

      - name: Build documentation-only closure
        env:
          BASE_SHA: f01399bac0a50fef82ac55cf2c9a088c18443415
        shell: bash
        run: |
          python .github/tmp-220-doc-closure.py
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout "$BASE_SHA" -- .github/workflows/engineering-quality.yml
          rm .github/tmp-220-doc-closure.py
          git diff --check
          test -s PROJECT.md
          test -s docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md
          test -s docs/architecture/PRODUCT_PREFERENCES_NOTIFICATIONS_IMPLEMENTATION_CONTRACT.md
          test -s docs/architecture/INFRASTRUCTURE.md
          test -s docs/ui/UI_MIGRATION.md
          test -s docs/ui/SCREEN_REGISTRY.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md \
            docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md \
            docs/architecture/PRODUCT_PREFERENCES_NOTIFICATIONS_IMPLEMENTATION_CONTRACT.md \
            docs/architecture/INFRASTRUCTURE.md \
            docs/ui/UI_MIGRATION.md \
            docs/ui/SCREEN_REGISTRY.md \
            .github/workflows/engineering-quality.yml \
            .github/tmp-220-doc-closure.py
          git diff --cached --check
          git commit -m "docs: record #220 implementation verification"
          git push origin HEAD:tmp/220-doc-closure-20260916

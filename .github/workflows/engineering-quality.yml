name: Engineering Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: renderlab-engineering-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify developer toolchain
        run: npm run doctor

      - name: Verify repository text policy
        run: npm run verify:text-policy

      - name: Classify exact-commit change scope (fail closed)
        id: ci-scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-classify-changes.mjs

      - name: Verify evidence-only Markdown with dependency-free governance
        if: steps.ci-scope.outputs.docs_only == 'true'
        run: npm run verify:docs-governance
      - name: Install dependencies
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run test:unit

      - name: Verify negative gate fixtures
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run verify:engineering-quality

      - name: Verify Modal project ownership boundary
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run verify:modal-project-ownership

      - name: Test script and all worker Python suites without secrets
        if: steps.ci-scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/renderlab-worker-tests"
          python="$RUNNER_TEMP/renderlab-worker-tests/bin/python"
          "$python" -m pip install --disable-pip-version-check -r workers/fibo-studio/requirements-ci.txt
          "$python" -m pip check
          "$python" -m unittest discover -s scripts/tests -p "test_*.py" -v
          mapfile -t test_dirs < <(find workers -type f -name 'test_*.py' -printf '%h\n' | sort -u)
          test "${#test_dirs[@]}" -gt 0
          for directory in "${test_dirs[@]}"; do
            "$python" -m unittest discover -s "$directory" -p "test_*.py" -v
          done
          "$python" scripts/verify-dispatcher-tls-canary-cli.py

      - name: Verify production Modal deploy guards offline
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: python3 scripts/tests/test_fibo_deploy_guards.py

      - name: Verify reciprocal S.A.G.A. Modal ownership
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run verify:modal-cross-repo-ownership

      - name: Production build
        if: steps.ci-scope.outputs.docs_only != 'true'
        run: npm run build

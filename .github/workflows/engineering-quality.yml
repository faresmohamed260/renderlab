name: Engineering Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: renderlab-engineering-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify developer toolchain
        run: npm run doctor

      - name: Verify repository text policy
        run: npm run verify:text-policy

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify negative gate fixtures
        run: npm run verify:engineering-quality

      - name: Verify Modal project ownership boundary
        run: npm run verify:modal-project-ownership

      - name: Verify reciprocal S.A.G.A. Modal ownership
        run: npm run verify:modal-cross-repo-ownership

      - name: Verify maintained UI primitive usage
        run: npm run verify:ui-purity

      - name: Production build
        run: npm run build

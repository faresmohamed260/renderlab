name: Engineering Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/unit/**"
      - "config/modal-project-ownership.json"
      - ".oxlintrc.json"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/engineering-quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/unit/**"
      - "config/modal-project-ownership.json"
      - ".oxlintrc.json"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/engineering-quality.yml"

permissions:
  contents: write

concurrency:
  group: renderlab-engineering-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-lifecycle-verifier:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'account/220-product-preferences'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch verifier and restore workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("scripts/verify-account-data-lifecycle.mjs")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '    "renderlab_account_profiles",\n  ]) {',
              '    "renderlab_account_profiles",\n    "renderlab_account_preferences",\n  ]) {',
              "cleanup registry",
          )
          replace_once(
              '  }), "Could not seed account profile fixtures");\n\n  await expectOk(await serviceRest("generation_jobs", {',
              '''  }), "Could not seed account profile fixtures");

  await expectOk(await serviceRest("renderlab_account_preferences", {
    method: "POST",
    body: JSON.stringify([
      {
        owner_id: accountA.id,
        create_output_kind: "video",
        create_image_aspect_ratio: "4:5",
        create_video_resolution: "1080p",
        create_video_duration_seconds: 20,
        create_video_audio_enabled: false,
      },
      {
        owner_id: accountB.id,
        create_output_kind: "image",
        create_image_aspect_ratio: "21:9",
        create_video_resolution: "2K",
        create_video_duration_seconds: 30,
        create_video_audio_enabled: true,
      },
    ]),
  }), "Could not seed account preference fixtures");

  await expectOk(await serviceRest("generation_jobs", {''',
              "preference fixtures",
          )
          replace_once(
              '  const bProfileBefore = JSON.stringify(await serviceRows(`renderlab_account_profiles?owner_id=eq.${encodeURIComponent(accountB.id)}&select=*`));\n  const bAvatarBefore = await readObject(keys.avatarB);',
              '  const bProfileBefore = JSON.stringify(await serviceRows(`renderlab_account_profiles?owner_id=eq.${encodeURIComponent(accountB.id)}&select=*`));\n  const bPreferencesBefore = JSON.stringify(await serviceRows(`renderlab_account_preferences?owner_id=eq.${encodeURIComponent(accountB.id)}&select=*`));\n  const bAvatarBefore = await readObject(keys.avatarB);',
              "B preference sentinel before",
          )
          replace_once(
              '  assert(exported.schemaVersion === 2, "Export schema version mismatch.");',
              '  assert(exported.schemaVersion === 3, "Export schema version mismatch.");',
              "export schema version",
          )
          replace_once(
              '  assert(exported.profile?.avatar?.downloadPath === "/api/account/profile/avatar", "Export profile-avatar download path is not owner-authenticated.");',
              '''  assert(exported.profile?.avatar?.downloadPath === "/api/account/profile/avatar", "Export profile-avatar download path is not owner-authenticated.");
  assert(exported.preferences?.source === "saved", "Export is missing saved preference source state.");
  assert(exported.preferences?.create?.outputKind === "video", "Export is missing default Create mode.");
  assert(exported.preferences?.create?.imageAspectRatio === "4:5", "Export is missing default Image aspect ratio.");
  assert(exported.preferences?.create?.videoResolution === "1080p", "Export is missing default Video resolution.");
  assert(exported.preferences?.create?.videoDurationSeconds === 20, "Export is missing default Video duration.");
  assert(exported.preferences?.create?.videoAudioEnabled === false, "Export is missing default Video audio state.");''',
              "preference export assertions",
          )
          replace_once(
              '    "renderlab_account_profiles",\n  ]) {\n    const response = await serviceRest(table, { method: "POST", body: JSON.stringify({ owner_id: accountA.id }) });',
              '    "renderlab_account_profiles",\n    "renderlab_account_preferences",\n  ]) {\n    const response = await serviceRest(table, { method: "POST", body: JSON.stringify({ owner_id: accountA.id }) });',
              "deletion guard registry",
          )
          replace_once(
              '  assert(aMediaStillPresent.length === 1, "Database product rows disappeared before finalizer commit.");',
              '''  assert(aMediaStillPresent.length === 1, "Database product rows disappeared before finalizer commit.");
  const aPreferencesStillPresent = await serviceRows(`renderlab_account_preferences?owner_id=eq.${encodeURIComponent(accountA.id)}&select=owner_id&limit=1`);
  assert(aPreferencesStillPresent.length === 1, "Preference row disappeared before finalizer commit.");''',
              "preference pre-finalizer assertion",
          )
          replace_once(
              '  assert(aMediaAfterFinalize.length === 0, "Product rows remained after successful transactional finalizer.");',
              '''  assert(aMediaAfterFinalize.length === 0, "Product rows remained after successful transactional finalizer.");
  const aPreferencesAfterFinalize = await serviceRows(`renderlab_account_preferences?owner_id=eq.${encodeURIComponent(accountA.id)}&select=owner_id&limit=1`);
  assert(aPreferencesAfterFinalize.length === 0, "Preference row remained after successful transactional finalizer.");''',
              "preference post-finalizer assertion",
          )
          replace_once(
              '    "renderlab_account_profiles",\n  ]) {\n    const rows = await serviceRows(`${table}?owner_id=eq.${encodeURIComponent(accountA.id)}&select=*&limit=1`);',
              '    "renderlab_account_profiles",\n    "renderlab_account_preferences",\n  ]) {\n    const rows = await serviceRows(`${table}?owner_id=eq.${encodeURIComponent(accountA.id)}&select=*&limit=1`);',
              "residue registry",
          )
          replace_once(
              '  const bProfileAfter = JSON.stringify(await serviceRows(`renderlab_account_profiles?owner_id=eq.${encodeURIComponent(accountB.id)}&select=*`));\n  assert(bProfileAfter === bProfileBefore, "Account B profile metadata changed during A deletion.");',
              '''  const bProfileAfter = JSON.stringify(await serviceRows(`renderlab_account_profiles?owner_id=eq.${encodeURIComponent(accountB.id)}&select=*`));
  assert(bProfileAfter === bProfileBefore, "Account B profile metadata changed during A deletion.");
  const bPreferencesAfter = JSON.stringify(await serviceRows(`renderlab_account_preferences?owner_id=eq.${encodeURIComponent(accountB.id)}&select=*`));
  assert(bPreferencesAfter === bPreferencesBefore, "Account B preference state changed during A deletion.");''',
              "B preference sentinel after",
          )
          replace_once(
              '  console.log("RENDERLAB_223_PROFILE_EXPORT_DELETE_NONINTERFERENCE=true");\n  console.log("RENDERLAB_219_CROSS_ACCOUNT_NON_INTERFERENCE=true");',
              '  console.log("RENDERLAB_223_PROFILE_EXPORT_DELETE_NONINTERFERENCE=true");\n  console.log("RENDERLAB_220_PREFERENCES_EXPORT_DELETE_NONINTERFERENCE=true");\n  console.log("RENDERLAB_219_CROSS_ACCOUNT_NON_INTERFERENCE=true");',
              "preference acceptance marker",
          )

          path.write_text(text)
          subprocess.run(["git", "checkout", "origin/main", "--", ".github/workflows/engineering-quality.yml"], check=True)
          helper = Path(".github/workflows/_tmp-220-lifecycle-verifier.yml")
          if helper.exists():
              helper.unlink()

      - name: Verify and commit repair
        run: |
          node --check scripts/verify-account-data-lifecycle.mjs
          git diff --check
          grep -q 'exported.schemaVersion === 3' scripts/verify-account-data-lifecycle.mjs
          grep -q 'RENDERLAB_220_PREFERENCES_EXPORT_DELETE_NONINTERFERENCE=true' scripts/verify-account-data-lifecycle.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: extend account lifecycle acceptance for preferences"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify negative gate fixtures
        run: npm run verify:engineering-quality

      - name: Verify Modal project ownership boundary
        run: npm run verify:modal-project-ownership

      - name: Verify maintained UI primitive usage
        run: npm run verify:ui-purity

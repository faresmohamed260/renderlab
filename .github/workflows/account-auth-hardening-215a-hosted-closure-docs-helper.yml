name: Account Auth Hardening 215A Hosted Closure Docs Helper

on:
  push:
    branches:
      - docs/account-auth-hardening-215a-hosted-closure
    paths:
      - ".github/workflows/account-auth-hardening-215a-hosted-closure-docs-helper.yml"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconcile authoritative #215A state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {text.count(old)} for: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md',
              '**Status:** CONTRACT MERGED / REPOSITORY-SIDE #215A MERGED + MERGED-MAIN VERIFIED / HOSTED PREFLIGHT VERIFIED / HOSTED MUTATION NOT EXECUTED / NOT DEPLOYED',
              '**Status:** #215A CURRENT-PLAN HARDENING COMPLETE + VERIFIED / #215B PLAN-GATED / APPLICATION POLICY CODE NOT YET DEPLOYED'
          )

          replace_once(
              'docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md',
              '- No hosted Auth configuration or production deployment changed. The merged code must remain undeployed until Stage 2 hosted policy/config execution is explicitly authorized and coordinated.',
              '- Repository policy code remains **not deployed**. Production application source is still the Phase 23–29 redesign deployment until a separate application deployment is authorized.\n- Hosted #215A configuration was subsequently executed and verified under the Stage 2 record below.'
          )

          old = '''A guarded patch definition and rollback-capable execution script were prepared on temporary ops branch `ops/account-auth-hardening-215a-hosted-preflight`, but the current GitHub connector refused creation of a new workflow binding the repository's high-privilege service-role secret to that script. That control was not bypassed. Because the contract requires an owned existing below-new-policy user fixture before raising the hosted minimum, **no hosted Auth mutation occurred** and #215A is not implementation-complete.'''
          new = '''### Stage 2 hosted execution — completed and verified 2026-09-14

The first attempt to create a new high-privilege workflow was correctly rejected by the GitHub connector. Execution therefore reused only **existing trusted secret bindings** already established by RenderLab: Account Identity for `SUPABASE_SERVICE_ROLE_KEY`, and the historical Phase 13B Management API workflow for `SUPABASE_ACCESS_TOKEN`. No new repository secret binding was introduced.

Verified execution evidence:

- owned legacy-password fixture preparation: Account Identity run `34844165287`, job `103975951408`; a deterministic owned fixture with a runtime-derived **12-character** password signed in successfully before the hosted policy change, without logging the password;
- hosted password transition: Phase 13B Management API run `34844260270`, job `103976259966`; guarded read/write/readback changed only `password_min_length` from `6` to `15`, retained no required character classes and preserved Site URL, redirect allowlist and Resend SMTP;
- legacy compatibility after strengthening: Account Identity run `34844349294`, job `103976544838`; the same existing 12-character fixture still signed in after the hosted minimum became 15, proving existing credentials were not locked out by the policy increase;
- hosted security-mail mutation: Phase 13B Management API run `34844522493`, job `103977111129`; all six contracted security notifications were enabled, reauthentication and future email-change templates were branded, and readback proved URLs, Resend SMTP, password policy, CAPTCHA state, rate limits, invite/recovery templates, secure-email-change mode and hosted password-change reauthentication flags did not drift;
- rollback artifact: `10347711381`, `sha256:c4d7b56726467df807b20096325ecd47fd511811dd81d527336d0ec50d50935d`, containing only the bounded pre-change non-secret values for the security-mail delta;
- real password-change security-email delivery: Phase 13D run `34844954211`, job `103978532280`; one approved Gmail test fixture changed its password through Auth, the `Your RenderLab password was changed` message reached Resend `delivered`, RenderLab branding/privacy checks passed and the fixture was deleted;
- configured Account Identity after hosted mutation: existing run `34821671246` attempt 4, job `103978254613`, passed the full suite unchanged. Attempt 3 failed only on the known shared-project transient `504 Gateway Timeout` while deleting stale admission reservations before any product/Auth assertion; cleanup succeeded and the unchanged retry passed;
- fresh Account Identity artifact after hosted mutation: `10347217183`, `sha256:69c61dd88fce6154766210d56748b4faaca8d1506ddc9af722de83e6fbfbb1ce`;
- Security Advisor after mutation contained no new findings: the only warning remained `auth_leaked_password_protection`, plus the expected `rls_enabled_no_policy` informational notices for intentionally server-owned tables;
- owned legacy fixture cleanup: run `34845048297`, job `103978842910`, emitted `RENDERLAB_215A_LEGACY_FIXTURE_CLEAN=true`; temporary PR #246 was closed unmerged.

Final current-plan hosted state:

- password minimum `15`;
- required-character policy none;
- six contracted security notifications enabled and RenderLab-branded;
- reauthentication and future email-change templates RenderLab-branded;
- production Site URL and redirect allowlist unchanged;
- Resend SMTP plus Phase 13 invite/recovery templates unchanged;
- Auth rate limits unchanged;
- CAPTCHA remains disabled/evaluated-deferred;
- hosted current-password and nonce-reauthentication toggles remain disabled, preserving RenderLab's app-owned current-password verification contract;
- leaked-password protection remains disabled solely as the explicit #215B **Supabase Pro+ plan gate**.

#215A is therefore **implementation-complete and verified for the current Free plan**. #215 remains open only for the separately authorized #215B plan/billing decision and leaked-password-protection closure. The repository-side 15-character application guidance is merged but still requires a separately authorized production application deployment before hosted policy and production presentation are fully synchronized.'''
          replace_once('docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md', old, new)

          old_project = '''- Hosted Supabase Auth configuration has **not** been mutated. Read-only Management API preflight run `34835108876` / artifact `10343259904` verified the live config: production URLs and Resend SMTP are correct, invite/recovery fingerprints remain stable, password minimum is still 6 with no required classes, all six scoped security notifications are off, CAPTCHA is off, and existing Auth rate limits are retained. CAPTCHA is evaluated/deferred for lack of evidence-backed abuse need.
- The remaining #215A execution gate is the authorized hosted mutation plus owned legacy-password fixture, rollback, Account Identity and Security Advisor verification. A reviewed patch/script exists only on temporary ops branch `ops/account-auth-hardening-215a-hosted-preflight`; the current connector refused a new high-privilege secret-bound workflow, so that control was not bypassed and no production Auth setting changed. Leaked-password protection remains the separate #215B Free-plan blocker.'''
          new_project = '''- Hosted #215A execution is now **complete and verified for the current Supabase Free plan**. The hosted password minimum is 15 with no required character classes; an owned 12-character existing credential was proven to keep signing in after the transition; all six contracted security notifications plus reauthentication/future email-change templates are RenderLab-branded; production URLs, Resend SMTP, Phase 13 invite/recovery templates, rate limits, CAPTCHA state and hosted password-change reauthentication flags remained unchanged.
- Hosted execution evidence: password-policy run `34844260270`; legacy compatibility runs `34844165287` and `34844349294`; security-mail run `34844522493` with rollback artifact `10347711381` (`sha256:c4d7b56726467df807b20096325ecd47fd511811dd81d527336d0ec50d50935d`); real Gmail password-change notification run `34844954211`; configured Account Identity run `34821671246` attempt 4 passed with artifact `10347217183` (`sha256:69c61dd88fce6154766210d56748b4faaca8d1506ddc9af722de83e6fbfbb1ce`); legacy fixture cleanup `34845048297`; temporary PR #246 closed unmerged.
- Security Advisor shows no new findings. `auth_leaked_password_protection` remains the explicit #215B blocker because the organization is still on Free and leaked-password protection requires Pro+. CAPTCHA remains evaluated/deferred. Repository-side 15-character guidance is still **not deployed**, so production application deployment remains the next separate authorization gate before presentation and hosted policy are fully synchronized.'''
          replace_once('PROJECT.md', old_project, new_project)

          replace_once(
              'docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md',
              '**Current execution:** #215A repository-side password-policy synchronization merged/verified as `8ea859df84f5173267defbf3e278a95bba403014`; hosted Auth execution remains separately pending and #215B leaked-password protection remains plan-gated.',
              '**Current execution:** #215A current-plan hardening is complete and verified: repository policy merged as `8ea859df84f5173267defbf3e278a95bba403014`, hosted Auth minimum is 15, security notifications/templates are branded, configured acceptance passed, and #215B leaked-password protection remains the explicit Supabase Pro+ plan gate. Repository policy presentation is not yet deployed.'
          )

          replace_once(
              'docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md',
              'A fresh Security Advisor read on 2026-09-13 still reports **Leaked Password Protection Disabled**. The other current findings are the expected `rls_enabled_no_policy` informational notices for deliberately server-owned RenderLab tables.',
              'A fresh Security Advisor read after #215A hosted execution on 2026-09-14 still reports **Leaked Password Protection Disabled** as the only warning. The other current findings are the expected `rls_enabled_no_policy` informational notices for deliberately server-owned RenderLab tables. The current organization remains on Free, so the warning is the explicit #215B Pro+ plan gate rather than unfinished #215A work.'
          )
          PY

          git diff --check
          git diff -- PROJECT.md docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md

      - name: Commit docs and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/account-auth-hardening-215a-hosted-closure-docs-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md .github/workflows/account-auth-hardening-215a-hosted-closure-docs-helper.yml
          git diff --cached --check
          git commit -m "docs: close #215A current-plan hardening"
          git push origin HEAD:docs/account-auth-hardening-215a-hosted-closure

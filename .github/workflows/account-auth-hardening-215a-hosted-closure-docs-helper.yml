name: Account Auth Hardening 215A Hosted Closure Docs Helper

on:
  push:
    branches:
      - docs/account-auth-hardening-215a-hosted-closure
    paths:
      - ".github/workflows/account-auth-hardening-215a-hosted-closure-docs-helper.yml"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch authoritative docs
        run: python .github/scripts/account-auth-hardening-215a-hosted-closure-docs.py

      - name: Validate and commit docs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/account-auth-hardening-215a-hosted-closure-docs-helper.yml
          rm .github/scripts/account-auth-hardening-215a-hosted-closure-docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md .github/workflows/account-auth-hardening-215a-hosted-closure-docs-helper.yml .github/scripts/account-auth-hardening-215a-hosted-closure-docs.py
          git diff --cached --check
          git commit -m "docs: close #215A current-plan hardening"
          git push origin HEAD:docs/account-auth-hardening-215a-hosted-closure

name: Apply post-Cycle 4 production correctives

on:
  push:
    branches:
      - work/post-cycle4-production-correctives
    paths:
      - .github/workflows/post-cycle4-corrective-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: b3aae9d3159aa3daeeff0390b585d010aa6f71c2
      STAGING_SHA: 4c02ae3950f5240e7523b92c88a2c1fae8005499
      BRANCH: work/post-cycle4-production-correctives
    steps:
      - name: Check out exact corrective staging head
        uses: actions/checkout@v4
        with:
          ref: work/post-cycle4-production-correctives
          fetch-depth: 0

      - name: Guard repository and branch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$STAGING_SHA"
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          mapfile -t staged < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = ".github/scripts/post-cycle4-corrective.py"
          test "${staged[1]}" = ".github/workflows/post-cycle4-corrective-apply.yml"

      - name: Apply user-authorized corrective scope
        run: python .github/scripts/post-cycle4-corrective.py

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          rm .github/scripts/post-cycle4-corrective.py
          rm .github/workflows/post-cycle4-corrective-apply.yml
          git diff --check
          test ! -e src/features/library/library-sort-menu.tsx
          test -e src/features/library/library-sort-toggle.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify maintained UI primitives
        run: npm run verify:ui-purity

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Guard effective changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" | sort)
          printf 'Effective corrective files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 15
          test "${#changed[@]}" -le 24
          for required in \
            PROJECT.md \
            docs/ui/UI_MIGRATION.md \
            docs/ui/UI_DECISIONS.md \
            src/components/shell/app-shell.tsx \
            src/features/library/library-view.tsx \
            src/features/library/library-sort-toggle.tsx \
            src/features/create/create-workspace.tsx \
            src/features/create/create-advanced-panel.tsx \
            src/server/generation/retry-generation.ts \
            src/server/generation/generation-activity.ts \
            scripts/verify-library-history.mjs \
            scripts/verify-activity.mjs \
            tests/ui/create.spec.ts \
            tests/ui/kinetic-shell.spec.ts; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null
          done
          if printf '%s\n' "${changed[@]}" | grep -E '^\.github/(scripts|workflows)/post-cycle4-corrective'; then
            echo 'Temporary helper residue remains.' >&2
            exit 1
          fi

      - name: Commit corrective implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply post-Cycle 4 production review correctives"
          git push origin HEAD:"$BRANCH"

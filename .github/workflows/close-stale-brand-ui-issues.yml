name: Close Stale Brand and UI Issues

"on":
  push:
    branches:
      - docs/close-stale-brand-ui-issues
    paths:
      - .github/workflows/close-stale-brand-ui-issues.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/close-stale-brand-ui-issues

      - name: Reconcile stale records
        run: |
          set -euo pipefail
          python scripts/close-stale-brand-ui-issues.py
          rm scripts/close-stale-brand-ui-issues.py
          rm .github/workflows/close-stale-brand-ui-issues.yml
          git diff --check
          git status --short

      - name: Commit docs-only reconciliation
        run: |
          set -euo pipefail
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add docs/ui/UI_DECISIONS.md docs/ui/COMPONENT_CATALOG.md scripts/close-stale-brand-ui-issues.py .github/workflows/close-stale-brand-ui-issues.yml
          git diff --cached --check
          git commit -m "docs: close stale brand and UI records"
          git push origin HEAD:docs/close-stale-brand-ui-issues

name: Finalize Phase 7B Tracker

on:
  push:
    branches:
      - docs/phase-7b-complete
    paths:
      - .github/workflows/finalize-phase-7b-tracker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tracker consistency fix
        run: python .github/scripts/finalize-phase-7b-tracker.py
      - name: Validate and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-phase-7b-tracker.yml
          rm .github/scripts/finalize-phase-7b-tracker.py
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "RenderLab Phase 7B Docs Bot"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git commit -m "Finalize Phase 7B tracker"
          git push

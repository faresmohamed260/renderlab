name: Temporary Library Favorites Contract Sync

on:
  push:
    branches: [work/library-favorites-v0-1]
    paths:
      - ".github/workflows/tmp-library-favorites-contract.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/library-favorites-v0-1
      - name: Record UI-031 contract and reconcile handoff state
        run: python scripts/tmp-sync-library-favorites.py
      - name: Commit synchronized contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/INFRASTRUCTURE.md supabase/migrations/0006_media_favorites.sql
          git diff --cached --check
          git commit -m "Start Library Favorites v0.1"
          git push origin HEAD:work/library-favorites-v0-1

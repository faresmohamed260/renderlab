name: Temporary Library Favorites Implementation

on:
  push:
    branches: [work/library-favorites-v0-1]
    paths:
      - ".github/workflows/tmp-library-favorites-contract.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/library-favorites-v0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply Favorites implementation patch
        run: python scripts/tmp-implement-library-favorites.py
      - name: Verify UI primitive purity
        run: npm run verify:ui-purity
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_MIGRATION.md src/lib/api/media-assets-contract.ts src/server/media/media-assets.ts src/app/library/page.tsx src/app/api/media/assets/route.ts 'src/app/api/media/assets/[assetId]/favorite/route.ts' src/features/library/library-view.tsx src/features/library/media-viewer.tsx src/features/library/media-viewer-actions.tsx scripts/verify-library-favorites.mjs
          git diff --cached --check
          git commit -m "Implement Library Favorites v0.1"
          git push origin HEAD:work/library-favorites-v0-1

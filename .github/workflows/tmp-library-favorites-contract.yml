name: Temporary Library Favorites Contract Sync

on:
  push:
    branches: [work/library-favorites-v0-1]
    paths:
      - ".github/workflows/tmp-library-favorites-contract.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/library-favorites-v0-1
      - name: Record UI-031 contract and reconcile handoff state
        run: python scripts/tmp-sync-library-favorites.py
      - name: Normalize generated Markdown
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("docs/ui/SCREEN_REGISTRY.md"); t=p.read_text(); t=t.replace("**Status:** APPROVED base Library; Favorites v0.1 / UI-031 IN PROGRESS  \n", "**Status:** APPROVED base Library; Favorites v0.1 / UI-031 IN PROGRESS\n"); p.write_text(t)'
          python -c 'from pathlib import Path; p=Path("docs/ui/UI_DECISIONS.md"); t=p.read_text(); marker="### UI-031 — Favorites are lightweight owner-scoped durable-media organization"; before, after=t.split(marker, 1); after="\n".join(line.rstrip() for line in after.splitlines()).rstrip(); p.write_text(before.rstrip()+"\n\n"+marker+"\n"+after+"\n")'
      - name: Commit synchronized contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/INFRASTRUCTURE.md supabase/migrations/0006_media_favorites.sql
          git diff --cached --check
          git commit -m "Start Library Favorites v0.1"
          git push origin HEAD:work/library-favorites-v0-1

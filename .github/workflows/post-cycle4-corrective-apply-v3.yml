name: Apply post-Cycle 4 production correctives v3

on:
  push:
    branches:
      - work/post-cycle4-production-correctives
    paths:
      - .github/workflows/post-cycle4-corrective-apply-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: b3aae9d3159aa3daeeff0390b585d010aa6f71c2
      PREVIOUS_HEAD: bfbfe908395660b94bca6f87f3a3a9cb4c52e2e1
      BRANCH: work/post-cycle4-production-correctives
    steps:
      - name: Check out exact corrective staging head
        uses: actions/checkout@v4
        with:
          ref: work/post-cycle4-production-correctives
          fetch-depth: 0

      - name: Guard repository and branch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          mapfile -t staged < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 4
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/scripts/post-cycle4-corrective.py' >/dev/null
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/post-cycle4-corrective-apply.yml' >/dev/null
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/post-cycle4-corrective-apply-v2.yml' >/dev/null
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/post-cycle4-corrective-apply-v3.yml' >/dev/null

      - name: Reconcile temporary patch matchers with current docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/post-cycle4-corrective.py')
          s = p.read_text()

          # Current Component Catalog uses prose rather than a standalone sort component entry.
          start = s.index('replace_once(\n    "docs/ui/COMPONENT_CATALOG.md",')
          end = s.index('replace_once(\n    "docs/ui/SCREEN_REGISTRY.md",', start)
          catalog = '''replace_once(
              "docs/ui/COMPONENT_CATALOG.md",
              "UI-027 added the maintained Radix Dropdown Menu for Library ordering instead of a bespoke selector.",
              "UI-027 originally added the maintained Radix Dropdown Menu for Library ordering; user-directed UI-066 later replaces that interaction with a direct maintained Button/Link toggle while URL/server ordering stays authoritative.",
              "Component catalog Library sort history",
          )
          replace_once(
              "docs/ui/COMPONENT_CATALOG.md",
              "**Current fields:** Image — negative prompt, seed, Steps, Guidance. Video — negative prompt, seed, Frame rate. Video Steps/Guidance are deliberately absent and server-rejected under UI-048.",
              "**Current fields:** Image — negative prompt, seed with Randomize, Steps, Guidance. Video — negative prompt, seed with Randomize, Frame rate. Video Steps/Guidance are deliberately absent and server-rejected under UI-048.",
              "Component catalog Advanced seed",
          )
          '''
          s = s[:start] + catalog + s[end:]

          # Current Screen Registry names the implementation and behavior explicitly.
          start = s.index('replace_once(\n    "docs/ui/SCREEN_REGISTRY.md",')
          end = s.index('replace_once(\n    "docs/architecture/FRONTEND_ARCHITECTURE.md",', start)
          registry = '''replace_once(
              "docs/ui/SCREEN_REGISTRY.md",
              "**Sort control:** `src/features/library/library-sort-menu.tsx`  ",
              "**Sort control:** `src/features/library/library-sort-toggle.tsx`  ",
              "Screen registry Library sort implementation",
          )
          replace_once(
              "docs/ui/SCREEN_REGISTRY.md",
              "- explicit URL-owned `Newest first / Oldest first` ordering via `sort`, with deterministic server ordering by `created_at` + `id` in matching direction;",
              "- explicit URL-owned `Newest first / Oldest first` ordering via `sort`, exposed as one direct toggle with deterministic server ordering by `created_at` + `id` in matching direction;",
              "Screen registry Library sort behavior",
          )
          '''
          s = s[:start] + registry + s[end:]

          # Current frontend architecture records the old dropdown semantics in the primitive rule.
          start = s.index('replace_once(\n    "docs/architecture/FRONTEND_ARCHITECTURE.md",')
          end = s.index('append_once(\n    "docs/architecture/PRODUCT_CAPABILITIES.md",', start)
          architecture = '''replace_once(
              "docs/architecture/FRONTEND_ARCHITECTURE.md",
              "- maintained accessibility semantics are authoritative when they correctly represent the interaction. Create Image/Video is a required single-choice Radix `radiogroup` with checked `radio` items, not two independent legacy pressed buttons; Library Newest/Oldest uses Radix Dropdown Menu radio semantics;",
              "- maintained accessibility semantics are authoritative when they correctly represent the interaction. Create Image/Video is a required single-choice Radix `radiogroup` with checked `radio` items, not two independent legacy pressed buttons; UI-066 keeps Library Newest/Oldest URL/server-owned while exposing the current order through one direct maintained Button/Link toggle;",
              "Frontend architecture Library sort interaction",
          )
          '''
          s = s[:start] + architecture + s[end:]

          s = s.replace('const seed = value[0] % (generationSeedMax + 1);', 'const seed = value[0]! % (generationSeedMax + 1);')
          p.write_text(s)
          PY

      - name: Apply user-authorized corrective scope
        run: python .github/scripts/post-cycle4-corrective.py

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          rm .github/scripts/post-cycle4-corrective.py
          rm .github/workflows/post-cycle4-corrective-apply.yml
          rm .github/workflows/post-cycle4-corrective-apply-v2.yml
          rm .github/workflows/post-cycle4-corrective-apply-v3.yml
          git diff --check
          test ! -e src/features/library/library-sort-menu.tsx
          test -e src/features/library/library-sort-toggle.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify maintained UI primitives
        run: npm run verify:ui-purity

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Guard effective changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" | sort)
          printf 'Effective corrective files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 15
          test "${#changed[@]}" -le 24
          for required in \
            PROJECT.md \
            docs/ui/UI_MIGRATION.md \
            docs/ui/UI_DECISIONS.md \
            docs/ui/COMPONENT_CATALOG.md \
            docs/ui/SCREEN_REGISTRY.md \
            docs/architecture/FRONTEND_ARCHITECTURE.md \
            docs/architecture/PRODUCT_CAPABILITIES.md \
            src/components/shell/app-shell.tsx \
            src/features/library/library-view.tsx \
            src/features/library/library-sort-toggle.tsx \
            src/features/create/create-workspace.tsx \
            src/features/create/create-advanced-panel.tsx \
            src/server/generation/retry-generation.ts \
            src/server/generation/generation-activity.ts \
            scripts/verify-library-history.mjs \
            scripts/verify-activity.mjs \
            tests/ui/create.spec.ts \
            tests/ui/kinetic-shell.spec.ts; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null
          done
          if printf '%s\n' "${changed[@]}" | grep -E '^\.github/(scripts|workflows)/post-cycle4-corrective'; then
            echo 'Temporary helper residue remains.' >&2
            exit 1
          fi

      - name: Commit corrective implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply post-Cycle 4 production review correctives"
          git push origin HEAD:"$BRANCH"

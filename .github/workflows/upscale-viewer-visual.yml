name: Upscale Viewer Visual

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/upscale-viewer-visual.yml"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-upscale-viewer.mjs"
      - "src/app/(app)/library/[assetId]/**"
      - "src/app/api/media/assets/**"
      - "src/features/library/media-viewer*.tsx"
      - "src/lib/capabilities/upscale.ts"
      - "src/server/generation/submit-upscale.ts"
      - "src/server/generation/upscale-*.ts"
      - "src/server/media/media-assets.ts"
      - "src/server/storage/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/upscale-viewer-visual.yml"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-upscale-viewer.mjs"
      - "src/app/(app)/library/[assetId]/**"
      - "src/app/api/media/assets/**"
      - "src/features/library/media-viewer*.tsx"
      - "src/lib/capabilities/upscale.ts"
      - "src/server/generation/submit-upscale.ts"
      - "src/server/generation/upscale-*.ts"
      - "src/server/media/media-assets.ts"
      - "src/server/storage/**"

permissions:
  contents: read

concurrency:
  group: renderlab-upscale-viewer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
      RENDERLAB_TEST_UPSCALE_WORKER_OVERRIDE: "true"
      RENDERLAB_TEST_UPSCALE_WORKER_GATEWAY_URL: http://127.0.0.1:3999
      RENDERLAB_PHASE18E_ARTIFACT_DIR: artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify UI primitive purity
        run: npm run verify:ui-purity

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/library > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log || true
          exit 1

      - name: Verify Upscale Viewer contract
        run: node scripts/verify-upscale-viewer.mjs

      - name: Cleanup Upscale Viewer fixtures
        if: always()
        run: node scripts/verify-upscale-viewer.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload Upscale Viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-phase18e-upscale-viewer-screenshots
          path: artifacts/phase18e-*.png
          if-no-files-found: warn
          retention-days: 14

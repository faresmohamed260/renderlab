name: Governance Checkpoint 1 Status Correction

on:
  push:
    branches:
      - docs/governance-hardening-checkpoint-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Correct STATUS production boundary
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/STATUS.md')
          text = path.read_text()
          old = "- Every completed/verified/merged change on protected `main` is production-live in this cumulative release, including UI-082/ENT-010 closure reconciliation and `sharp@0.35.5`. Historical phase-level `NOT DEPLOYED` statements below retain their closure-time meaning; unfinished draft/research work is excluded."
          new = "- All completed application/runtime changes through exact production application source `d7571a230b3f1c5719552628db020823adb4da73` are production-live in this cumulative release, including UI-082/ENT-010 closure reconciliation and `sharp@0.35.5`. Repository `main` may be newer because documentation- and verification-only commits are intentionally not redeployed. Historical phase-level `NOT DEPLOYED` statements below retain their closure-time meaning; unfinished draft/research work is excluded."
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale STATUS sentence, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- docs/STATUS.md
          rm .github/workflows/governance-checkpoint-1-status.yml

      - name: Commit correction and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md .github/workflows/governance-checkpoint-1-status.yml
          git commit -m "docs: clarify production application boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"

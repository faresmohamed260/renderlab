name: Phase 22 tracker status reconcile

on:
  push:
    branches:
      - docs/phase-22-tracker-status-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard verified baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="c694afed4f4efbdf8851bc9689188413b6c2e3a0"
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git rev-parse origin/main)" = "$expected"

      - name: Reconcile Phase 22 tracker status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ui/UI_MIGRATION.md')
          text = path.read_text()
          old = "## Phase 22 acceptance tracker\n**Status: `VERIFIED ON IMPLEMENTATION HEAD / MERGE PENDING`.**"
          new = "## Phase 22 acceptance tracker\n**Status: `COMPLETE / VERIFIED / MERGED`.**"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one live Phase 22 tracker marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase22-tracker-status-reconcile.yml
          git diff --check
          actual="$(git diff --name-only HEAD | sort)"
          expected=$'.github/workflows/phase22-tracker-status-reconcile.yml\ndocs/ui/UI_MIGRATION.md'
          test "$actual" = "$expected"

      - name: Commit self-removing docs correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/UI_MIGRATION.md .github/workflows/phase22-tracker-status-reconcile.yml
          git commit -m "docs: reconcile Phase 22 migration tracker status"
          git push origin HEAD:docs/phase-22-tracker-status-reconcile

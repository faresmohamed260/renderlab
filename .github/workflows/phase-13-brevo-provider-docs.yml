name: Phase 13 Brevo Provider Docs

on:
  push:
    branches: [docs/phase-13-brevo-provider-approval]
    paths:
      - ".github/workflows/phase-13-brevo-provider-docs.yml"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-13-brevo-provider-approval
          fetch-depth: 0
      - name: Record approved provider
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('PROJECT.md')
          s = p.read_text()
          old = "**Remaining 13B gate:** explicit transactional-provider/account approval (Brevo remains the lowest-drift candidate from 13A), secure SMTP credential provisioning, and provider-specific DNS/read-back verification."
          new = "**13B provider decision — accepted 2026-08-31:** Brevo custom SMTP is the approved production transactional-delivery path for RenderLab. **Remaining 13B gate:** create/provision a dedicated RenderLab Brevo SMTP key plus Brevo API key/login in approved GitHub secret storage, then perform provider-specific DNS/Supabase configuration and read-back verification. Do not reuse the existing Brevo Master Password when a dedicated RenderLab SMTP key can be created."
          if old not in s:
              raise SystemExit('PROJECT provider gate anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/ui/UI_MIGRATION.md')
          s = p.read_text()
          old = "- [ ] Choose/confirm one operator-approved transactional delivery path and provider account/plan (Brevo custom SMTP remains the current lowest-drift recommendation) and provision its SMTP/API credentials only in an approved secret store."
          new = "- [x] Production transactional delivery path/provider is approved as Brevo custom SMTP for the current Closed Beta. Provision a dedicated RenderLab SMTP key and Brevo API key/login only in approved GitHub secret storage; do not reuse a general/master SMTP password when a scoped RenderLab key can be created."
          if old not in s:
              raise SystemExit('UI_MIGRATION provider checklist anchor missing')
          s = s.replace(old, new, 1)
          old = "**Current phase:** Phase 13 — Email & Invite Production Hardening is `IN PROGRESS`; 13A is `COMPLETE / VERIFIED`; the 13B sender-domain/From identity is accepted as `RenderLab <noreply@mail.renderlab.faresuniform.uk>`, while provider/account and SMTP credentials remain the explicit operator gate."
          new = "**Current phase:** Phase 13 — Email & Invite Production Hardening is `IN PROGRESS`; 13A is `COMPLETE / VERIFIED`; Brevo custom SMTP and `RenderLab <noreply@mail.renderlab.faresuniform.uk>` are accepted for 13B, while dedicated Brevo credentials and verified DNS/Supabase configuration remain the execution gate."
          if old not in s:
              raise SystemExit('UI_MIGRATION current phase anchor missing')
          s = s.replace(old, new, 1)
          old = "**Next sequence:** confirm Brevo custom SMTP as the provider path (or explicitly select an alternative), provision the provider SMTP credentials in an approved secret store, authenticate `mail.renderlab.faresuniform.uk` with only the provider-required DNS, configure Supabase custom SMTP + bounded Auth mail limits, then execute 13C branded invite/recovery templates and link-tracking-safe verification."
          new = "**Next sequence:** create a dedicated RenderLab Brevo SMTP key plus Brevo API key, store `BREVO_SMTP_LOGIN`, `BREVO_SMTP_KEY`, and `BREVO_API_KEY` as GitHub repository secrets, then authenticate `mail.renderlab.faresuniform.uk` with only Brevo-required DNS, configure Supabase custom SMTP + bounded Auth mail limits, and continue to 13C branded invite/recovery templates and link-tracking-safe verification."
          if old not in s:
              raise SystemExit('UI_MIGRATION next sequence anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/architecture/INFRASTRUCTURE.md')
          s = p.read_text()
          old = "Provider/account/plan and SMTP credentials remain an explicit operator gate; the repository does not infer that credentials exist from DNS alone."
          new = "Brevo custom SMTP is now operator-approved for RenderLab. Dedicated RenderLab Brevo SMTP/API credentials remain the execution gate; the repository does not infer credential availability from DNS alone and must not reuse a general/master SMTP password when a dedicated project key can be provisioned."
          if old not in s:
              raise SystemExit('INFRA provider gate anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git rm .github/workflows/phase-13-brevo-provider-docs.yml
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: approve Brevo for Phase 13"
          git push origin HEAD:docs/phase-13-brevo-provider-approval

name: Phase 16 Contract Runner

on:
  push:
    branches: [noop]
    paths:
      - ".github/workflows/phase16-contract-runner.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0

      - name: Correct Phase 16 migration handoff
        shell: bash
        env:
          EXPECTED_HEAD: d24a863cc0516db501ba9e06a416ee27a6e77053
          TARGET_BRANCH: plan/phase-16-creative-iteration-contract
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python <<'PY'
          from pathlib import Path
          path = Path('docs/ui/UI_MIGRATION.md')
          text = path.read_text()
          old = '**Next:** Phase 16 Creative Iteration remains roadmap-only until its execution-ready contract is merged.'
          new = '**Next:** the accepted Phase 16 Creative Iteration contract is recorded below; implementation has not started.'
          if text.count(old) != 1:
              raise SystemExit('Expected Phase 15 handoff sentence not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add docs/ui/UI_MIGRATION.md
          git commit -m "Clarify Phase 16 contract handoff"
          git push origin HEAD:"$TARGET_BRANCH"

name: Phase 18B Docs Patch Recovery

on:
  push:
    branches:
      - work/phase-18-image-upscale
    paths:
      - .github/workflows/phase18b-docs-patch-recover.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-18-image-upscale
          fetch-depth: 0
      - name: Reuse validated patch and normalize formatting
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/phase18b-docs-patch.yml').read_text()
          start_marker = '      - name: Patch authoritative docs and self-remove\n        shell: python\n        run: |\n'
          end_marker = '      - name: Commit documentation closure\n'
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(block)
          exec(compile(script, 'phase18b-docs-patch.py', 'exec'))

          for path in [
              'docs/ui/UI_DECISIONS.md',
              'docs/architecture/FRONTEND_ARCHITECTURE.md',
              'docs/architecture/INFRASTRUCTURE.md',
          ]:
              p = Path(path)
              p.write_text(p.read_text().rstrip() + '\n')

          for workflow in [
              '.github/workflows/phase18b-docs-patch-v2.yml',
              '.github/workflows/phase18b-docs-patch-recover.yml',
          ]:
              Path(workflow).unlink(missing_ok=True)
      - name: Commit documentation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Document Phase 18B verification"
          git push origin HEAD:work/phase-18-image-upscale

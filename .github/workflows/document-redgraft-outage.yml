name: Document REDGraft outage

on:
  push:
    branches:
      - docs/redgraft-disabled-20260907
    paths:
      - .github/workflows/document-redgraft-outage.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/redgraft-disabled-20260907
          fetch-depth: 0
      - name: Apply outage documentation
        run: python .github/scripts/document-redgraft-outage.py
      - name: Commit docs and remove helper
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/document-redgraft-outage.yml .github/scripts/document-redgraft-outage.py
          git add docs/architecture/INFRASTRUCTURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record REDGraft worker outage"
          git push origin HEAD:docs/redgraft-disabled-20260907

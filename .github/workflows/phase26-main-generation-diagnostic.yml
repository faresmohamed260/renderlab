name: Phase 26 Current Main Generation Diagnostic

on:
  push:
    branches:
      - work/phase-26-activity-job-matrix
    paths:
      - .github/workflows/phase26-main-generation-diagnostic.yml

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
      RENDERLAB_TEST_UPSCALE_WORKER_OVERRIDE: "true"
      RENDERLAB_TEST_UPSCALE_WORKER_GATEWAY_URL: http://127.0.0.1:3030
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify checked-out main identity
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="8b89f30322ab284b4233ebd6880c6fcb60dff819"
          test "$actual" = "$expected" || { echo "::error::main moved: $actual"; exit 1; }
      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1
      - name: Verify native generation ownership on current main
        run: node scripts/verify-generation-bridge.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

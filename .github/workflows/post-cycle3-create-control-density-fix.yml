name: Stage Create control verifier corrections

on:
  push:
    branches:
      - work/post-cycle3-create-control-density
    paths:
      - .github/workflows/post-cycle3-create-control-density-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/post-cycle3-create-control-density
          fetch-depth: 0

      - name: Apply corrections
        run: |
          python scripts/stage-create-control-density-fix.py
          git diff --check
          node --check scripts/verify-create-lifecycle.mjs

      - name: Commit corrections and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-cycle3-create-control-density-fix.yml scripts/stage-create-control-density-fix.py
          git add src/features/create/create-workspace.tsx scripts/verify-create-lifecycle.mjs tests/ui/create.spec.ts
          git diff --cached --check
          git commit -m "Correct Create responsive verification"
          git push origin HEAD:work/post-cycle3-create-control-density

name: Phase 12 Admin selector fix

on:
  push:
    branches: [work/phase-12-release-validation]
    paths:
      - .github/workflows/tmp-phase12-admin-selector.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-12-release-validation
          fetch-depth: 0
      - name: Scope Admin assertion to page content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-release-integrated.mjs')
          text = path.read_text()
          old = 'await page.getByRole("heading", { name: "Admin", exact: true }).waitFor({ state: "visible", timeout: 30_000 });'
          new = 'await page.getByRole("main").getByRole("heading", { name: "Admin", exact: true }).waitFor({ state: "visible", timeout: 30_000 });'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Admin heading assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/verify-release-integrated.mjs
          git diff --check
      - name: Commit fix and self-clean
        shell: bash
        run: |
          rm .github/workflows/tmp-phase12-admin-selector.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-phase12-admin-selector.yml scripts/verify-release-integrated.mjs | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: scope Phase 12 Admin assertion"
          git push origin HEAD:work/phase-12-release-validation

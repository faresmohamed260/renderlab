name: Phase 25 Corrective Batch

on:
  push:
    branches:
      - work/phase-25-media-viewer-register-fold
    paths:
      - .github/workflows/phase25-corrective-batch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-25-media-viewer-register-fold
          fetch-depth: 0

      - name: Apply bounded UI-076 corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "src/features/library/media-viewer-actions.tsx",
              'aria-label={saving ? "Saving favorite" : favorite ? "Remove from favorites" : "Favorite"}',
              'aria-label={saving ? "Saving favorite" : favorite ? "Favorited" : "Favorite"}',
          )
          replace(
              "src/features/library/media-viewer-actions.tsx",
              'aria-label="Download media"',
              'aria-label="Download"',
          )

          generated_heading = '  await page.getByRole("heading", { name: generatedPrompt, exact: true }).waitFor({ state: "visible", timeout: 30_000 });'
          replace(
              "scripts/verify-media-rename.mjs",
              generated_heading,
              generated_heading + '\n  await page.getByRole("button", { name: "Manage", exact: true }).click();',
          )
          uploaded_heading = '  await page.getByRole("heading", { name: uploadedInitialDisplayName, exact: true }).waitFor({ state: "visible", timeout: 30_000 });'
          replace(
              "scripts/verify-media-rename.mjs",
              uploaded_heading,
              uploaded_heading + '\n  await page.getByRole("button", { name: "Manage", exact: true }).click();',
          )

          collections_goto = '  await page.goto(`${baseUrl}/library/${encodeURIComponent(collectionAsset.id)}`, { waitUntil: "networkidle", timeout: 60_000 });'
          replace(
              "scripts/verify-library-collections.mjs",
              collections_goto,
              collections_goto + '\n  await page.getByRole("button", { name: "Manage", exact: true }).click();',
          )

          viewer_ratio = '  assertRatio(viewerMetrics, fixtureWidth / fixtureHeight, "Uploaded Media Viewer image");'
          replace(
              "scripts/verify-library-lifecycle.mjs",
              viewer_ratio,
              viewer_ratio + '\n  await page.getByRole("button", { name: "Details", exact: true }).click();',
          )
          replace(
              "scripts/verify-library-lifecycle.mjs",
              '    const rail = document.querySelector(".kinetic-viewer-rail")?.getBoundingClientRect() || null;',
              '    const register = document.querySelector("[data-viewer-register]")?.getBoundingClientRect() || null;',
          )
          replace(
              "scripts/verify-library-lifecycle.mjs",
              '      railLeft: rail?.left ?? null,\n      railRight: rail?.right ?? null,',
              '      registerLeft: register?.left ?? null,\n      registerRight: register?.right ?? null,',
          )
          replace(
              "scripts/verify-library-lifecycle.mjs",
              '  assert(viewerLayoutMetrics.railLeft !== null && viewerLayoutMetrics.railLeft >= 0 && viewerLayoutMetrics.railRight <= viewerLayoutMetrics.innerWidth, `Intermediate Viewer rail escaped the viewport: ${JSON.stringify(viewerLayoutMetrics)}`);',
              '  assert(viewerLayoutMetrics.registerLeft !== null && viewerLayoutMetrics.registerLeft >= 0 && viewerLayoutMetrics.registerRight <= viewerLayoutMetrics.innerWidth, `Intermediate Viewer register escaped the viewport: ${JSON.stringify(viewerLayoutMetrics)}`);',
          )

          replace(
              "scripts/verify-creative-iteration.mjs",
              '  await page.getByText("Result", { exact: true }).waitFor({ state: "visible" });',
              '  await page.getByText(/^result$/i).waitFor({ state: "visible" });',
          )
          replace(
              "scripts/verify-creative-iteration.mjs",
              '  await page.getByText("Source", { exact: true }).waitFor({ state: "visible" });',
              '  await page.getByText(/^source$/i).waitFor({ state: "visible" });',
          )
          replace(
              "scripts/verify-image-upscale.mjs",
              '    await page.getByText("Source", { exact: true }).first().waitFor({ state: "visible" });',
              '    await page.getByText(/^source$/i).first().waitFor({ state: "visible" });',
          )

          Path(".github/workflows/phase25-corrective-batch.yml").unlink()
          PY

      - name: Commit corrective head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align Phase 25 regressions with UI-076"
          git push origin HEAD:work/phase-25-media-viewer-register-fold

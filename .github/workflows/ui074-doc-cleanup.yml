name: UI-074 Documentation Cleanup

on:
  push:
    branches:
      - work/phase-23-create-fidelity-correction
    paths:
      - .github/workflows/ui074-doc-cleanup.yml
      - scripts/ui074-doc-cleanup.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/phase-23-create-fidelity-correction
          fetch-depth: 0

      - name: Rebuild scoped documentation changes
        run: python3 scripts/ui074-doc-cleanup.py

      - name: Commit scoped documentation and remove helpers
        run: |
          rm .github/workflows/ui074-doc-cleanup.yml
          rm scripts/ui074-doc-cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md docs/ui/COMPONENT_CATALOG.md docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md .github/workflows/ui074-doc-cleanup.yml scripts/ui074-doc-cleanup.py
          git diff --cached --check
          git commit -m "Scope UI-074 documentation changes"
          git push origin HEAD:work/phase-23-create-fidelity-correction

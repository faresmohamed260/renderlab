name: Phase 12 Collections teardown preflight

on:
  push:
    branches:
      - work/phase-12-release-validation
    paths:
      - .github/workflows/tmp-phase12-collections-preflight.yml

permissions:
  actions: write
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-12-release-validation
          fetch-depth: 0
      - name: Dispatch Collections verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/library-collections-visual.yml/dispatches" -f ref=work/phase-12-release-validation
      - name: Require exact-head Collections success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1800))
          run_id=""
          while [ -z "$run_id" ]; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/library-collections-visual.yml/runs?event=workflow_dispatch&branch=work/phase-12-release-validation&per_page=20")"
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha)) | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$runs")"
            if [ -z "$run_id" ]; then sleep 5; fi
            if (( SECONDS > deadline )); then echo "Timed out locating Collections preflight"; exit 1; fi
          done
          while true; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            if [ "$status" = "completed" ]; then
              echo "Collections preflight run=$run_id conclusion=$conclusion"
              [ "$conclusion" = "success" ]
              break
            fi
            if (( SECONDS > deadline )); then echo "Timed out waiting for Collections preflight"; exit 1; fi
            sleep 8
          done
      - name: Remove temporary preflight workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase12-collections-preflight.yml
          git commit -m "chore: remove Collections teardown preflight"
          git push origin HEAD:work/phase-12-release-validation

name: Library Batch Delete Visual

on:
  pull_request:
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-library-batch-delete.mjs"
      - ".github/workflows/library-batch-delete-visual.yml"
      - "components.json"
      - "package.json"
      - "src/components/ui/**"
      - "src/lib/utils.ts"
      - "src/lib/supabase/**"
      - "src/app/(app)/library/**"
      - "src/features/library/**"
      - "src/app/api/media/assets/**"
      - "src/app/api/media/collections/**"
      - "src/server/media/media-assets.ts"
      - "src/server/media/media-collections.ts"
      - "src/server/storage/r2.ts"
      - "src/lib/api/media-assets-contract.ts"
      - "src/lib/api/media-collections-contract.ts"
      - "supabase/migrations/0004_core_account_ownership_prepare.sql"
      - "supabase/migrations/0005_core_account_ownership_enforce.sql"
      - "supabase/migrations/0006_media_favorites.sql"
      - "supabase/migrations/0007_media_collections.sql"
      - "supabase/migrations/0008_media_collection_asset_fk_index.sql"
      - "supabase/migrations/0009_media_asset_deletion.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-library-batch-delete-shared
  cancel-in-progress: false

jobs:
  batch-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/library > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log || true
          exit 1

      - name: Verify Library batch actions lifecycle
        run: node scripts/verify-library-batch-delete.mjs

      - name: Cleanup Library batch delete fixtures
        if: always()
        run: node scripts/verify-library-batch-delete.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload Library batch delete screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-library-batch-actions-screenshots
          path: artifacts/library-batch-*.png
          if-no-files-found: warn
          retention-days: 14
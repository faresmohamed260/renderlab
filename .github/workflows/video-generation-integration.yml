name: Video Generation Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-video-generation.mjs"
      - "scripts/verify-video-contract.ts"
      - "src/features/create/**"
      - "src/lib/capabilities/generation.ts"
      - "src/lib/api/generation-contract.ts"
      - "src/lib/supabase/**"
      - "src/server/generation/**"
      - "src/server/media/**"
      - "src/app/api/generation/**"
      - "src/app/api/media/assets/**"
      - "src/app/api/assets/reference/**"
      - "supabase/migrations/0004_core_account_ownership_prepare.sql"
      - "supabase/migrations/0005_core_account_ownership_enforce.sql"
      - ".github/workflows/video-generation-integration.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-video-generation.mjs"
      - "scripts/verify-video-contract.ts"
      - "src/features/create/**"
      - "src/lib/capabilities/generation.ts"
      - "src/lib/api/generation-contract.ts"
      - "src/lib/supabase/**"
      - "src/server/generation/**"
      - "src/server/media/**"
      - "src/app/api/generation/**"
      - "src/app/api/media/assets/**"
      - "src/app/api/assets/reference/**"
      - "supabase/migrations/**"
      - ".github/workflows/video-generation-integration.yml"

permissions:
  contents: read

jobs:
  video-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured for RenderLab."; missing=1; fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify Phase 7D product contract
        run: npx --yes tsx@4.20.6 scripts/verify-video-contract.ts

      - name: Build
        run: npm run build

      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1

      - name: Verify Create Video and Animate Image ownership
        run: node scripts/verify-video-generation.mjs

      - name: Cleanup video ownership fixtures
        if: always()
        run: node scripts/verify-video-generation.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload Phase 7D contextual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-phase7d-video-review
          path: artifacts/phase7d-video-*
          if-no-files-found: warn
          retention-days: 14

name: Video Generation Integration

on:
  push:
    branches: [main]
    paths:
      - "scripts/verify-video-generation.mjs"
      - ".github/workflows/video-generation-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured for RenderLab."; missing=1; fi
          done
          exit "$missing"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1
      - name: Verify Create Video and Animate Image
        run: node scripts/verify-video-generation.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

name: Patch 223 Profile Lifecycle

on:
  push:
    branches:
      - account/223-profile-credential-implementation
    paths:
      - .github/workflows/patch-223-profile-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-implementation
          fetch-depth: 1
      - name: Apply lifecycle integration
        run: python scripts/patch-223-profile-lifecycle.py
      - name: Commit lifecycle integration
        run: |
          set -euo pipefail
          git rm scripts/patch-223-profile-lifecycle.py .github/workflows/patch-223-profile-lifecycle.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/account/account-profile.ts src/server/account/account-data-lifecycle.ts
          git commit -m "feat: integrate profile lifecycle with account data"
          git push origin HEAD:account/223-profile-credential-implementation

name: Phase 13B Completion Documentation

on:
  push:
    branches:
      - docs/phase-13b-completion
    paths:
      - .github/workflows/phase-13b-completion-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-13b-completion
          fetch-depth: 0
      - name: Apply documentation patch
        run: python .github/phase13b_completion_patch.py
      - name: Validate and commit documentation only
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/phase-13b-completion-docs.yml .github/phase13b_completion_patch.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: complete Phase 13B email configuration"
          git push origin HEAD:docs/phase-13b-completion

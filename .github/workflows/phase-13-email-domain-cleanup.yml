name: Phase 13 Email Domain Docs Cleanup

on:
  push:
    branches:
      - docs/phase-13-email-domain-design
    paths:
      - .github/workflows/phase-13-email-domain-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-13-email-domain-design
          fetch-depth: 0
      - name: Apply cleanup patch
        run: python .github/phase13_email_domain_cleanup.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/phase-13-email-domain-cleanup.yml .github/phase13_email_domain_cleanup.py
          git add docs/ui/UI_MIGRATION.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: clarify Phase 13 provider gate"
          git push origin HEAD:docs/phase-13-email-domain-design

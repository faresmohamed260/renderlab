name: Temporary Infrastructure Status Normalization

on:
  push:
    branches:
      - docs/governance-remediation-status-infrastructure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded infrastructure status normalization
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const infrastructurePath = 'docs/architecture/INFRASTRUCTURE.md';
          let body = fs.readFileSync(infrastructurePath, 'utf8');

          const replacements = [
            [
              'Cycle 2 production is accepted and Phase 13 — Email & Invite Production Hardening is `COMPLETE / VERIFIED`: 13A–13D passed. Phase 13 changed only transactional-email/DNS/hosted-Auth configuration plus bounded external-mailbox verification; no application or Vercel deployment changed.',
              'Current application deployment truth is owned by the production block above and `docs/production/current.json`. Phase 13 — Email & Invite Production Hardening is historical closure evidence; its still-binding transactional-email, DNS and hosted-Auth constraints remain authoritative where this document carries them forward.',
            ],
            [
              '**Status:** APPLIED / VERIFIED, application enforcement not enabled in production.',
              '**Closure-time status:** APPLIED / VERIFIED; application enforcement was not enabled in production at this checkpoint.',
            ],
            [
              'Phase 12B is `COMPLETE / VERIFIED` for the Cycle 2 Closed-Beta operating boundary. Exact 12A-verified application SHA `d6b8f386db3893e583c99b23fc3397b0eb377d42` is the accepted production application.',
              'At closure, Phase 12B was `COMPLETE / VERIFIED` for the Cycle 2 Closed-Beta operating boundary. Exact 12A-verified application SHA `d6b8f386db3893e583c99b23fc3397b0eb377d42` was the accepted production application for that rollout.',
            ],
            [
              '**Status: `COMPLETE / VERIFIED`; 13A–13D complete.** The active production Auth mail provider is Resend custom SMTP. Brevo remains historical 13B evidence and rollback context, not the current Supabase SMTP route.',
              '**Closure-time status:** `COMPLETE / VERIFIED`; 13A–13D complete. The current accepted Auth mail provider remains Resend custom SMTP. Brevo remains historical 13B evidence and rollback context, not the current Supabase SMTP route.',
            ],
            [
              '**Status: `COMPLETE / VERIFIED / LIVE`.**',
              '**Closure-time status:** `COMPLETE / VERIFIED / LIVE`. Present application deployment truth is the current production block at the top of this document.',
            ],
          ];

          for (const [from, to] of replacements) {
            const count = body.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`Expected exactly one infrastructure replacement for ${JSON.stringify(from)}, found ${count}`);
            }
            body = body.replace(from, to);
          }

          fs.writeFileSync(infrastructurePath, body);

          const testBody = [
            'import assert from "node:assert/strict";',
            'import { readFile } from "node:fs/promises";',
            'import path from "node:path";',
            'import test from "node:test";',
            '',
            'const rootDir = process.cwd();',
            '',
            'test("infrastructure lifecycle state distinguishes current status from historical closure evidence", async () => {',
            '  const body = await readFile(',
            '    path.join(rootDir, "docs/architecture/INFRASTRUCTURE.md"),',
            '    "utf8",',
            '  );',
            '  const genericStatusLines = body',
            '    .split(/\\r?\\n/)',
            '    .filter((line) => /^\\*\\*Status:/i.test(line));',
            '',
            '  assert.deepEqual(',
            '    genericStatusLines,',
            '    [],',
            '    "INFRASTRUCTURE.md must not use generic Status fields for current or closure-time lifecycle state.",',
            '  );',
            '  assert.equal(',
            '    body.includes("Cycle 2 production is accepted and Phase 13"),',
            '    false,',
            '    "Infrastructure operating rules must defer present deployment truth to the canonical current-production authority.",',
            '  );',
            '  assert.equal(',
            '    body.includes("Phase 12B is `COMPLETE / VERIFIED`"),',
            '    false,',
            '    "Superseded rollout status must be written as closure-time history rather than present lifecycle state.",',
            '  );',
            '  const closureTimeStatusLines = body',
            '    .split(/\\r?\\n/)',
            '    .filter((line) => /^\\*\\*Closure-time status:\\*\\*/i.test(line));',
            '  assert.equal(',
            '    closureTimeStatusLines.length,',
            '    3,',
            '    "The three legacy infrastructure Status fields must remain explicitly labeled as closure-time evidence.",',
            '  );',
            '});',
            '',
          ].join('\\n');

          fs.writeFileSync('tests/unit/infrastructure-status.test.mjs', testBody);
          NODE

          git rm -- .github/workflows/tmp-infrastructure-status-normalization.yml
          git diff --check
          git status --short

      - name: Commit normalized status slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/INFRASTRUCTURE.md tests/unit/infrastructure-status.test.mjs
          git commit -m "docs: normalize infrastructure lifecycle status"
          git push origin "HEAD:${GITHUB_REF_NAME}"

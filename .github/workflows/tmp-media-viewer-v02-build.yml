name: Prepare focused Media Viewer v0.2

on:
  push:
    branches:
      - rd/media-viewer-register-fold-v02
    paths:
      - '.github/workflows/tmp-media-viewer-v02-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R&D branch
        uses: actions/checkout@v4
        with:
          ref: rd/media-viewer-register-fold-v02
          fetch-depth: 0

      - name: Build focused prototype from verified v0.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf design/prototypes/media-viewer-register-fold-v02
          cp -R design/prototypes/media-viewer-continuity-v01 design/prototypes/media-viewer-register-fold-v02
          python - <<'PY'
          from pathlib import Path

          root = Path('design/prototypes/media-viewer-register-fold-v02')
          index = root / 'index.html'
          text = index.read_text()
          text = text.replace('RenderLab Media Viewer Continuity R&D v0.1', 'RenderLab Media Viewer Register + Source Fold R&D v0.2')
          text = text.replace('data-prototype="media-viewer-continuity-v01" data-concept="register"', 'data-prototype="media-viewer-register-fold-v02" data-concept="fold"')
          text = text.replace('                <button type="button">★ Favorite</button>\n', '')
          text = text.replace('                <button type="button">Download</button>\n', '')
          text = text.replace('MEDIA VIEWER CONTINUITY / V0.1', 'MEDIA VIEWER REGISTER + SOURCE FOLD / V0.2')
          index.write_text(text)

          js = root / 'prototype.js'
          script = js.read_text().replace('setConcept("register");', 'setConcept("fold");')
          js.write_text(script)
          PY

      - name: Verify focused prototype source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-prototype="media-viewer-register-fold-v02" data-concept="fold"' design/prototypes/media-viewer-register-fold-v02/index.html
          grep -q 'MEDIA VIEWER REGISTER + SOURCE FOLD / V0.2' design/prototypes/media-viewer-register-fold-v02/index.html
          ! grep -A8 'data-panel-content="manage"' design/prototypes/media-viewer-register-fold-v02/index.html | grep -q '★ Favorite'
          ! grep -A8 'data-panel-content="manage"' design/prototypes/media-viewer-register-fold-v02/index.html | grep -q '>Download<'
          grep -q 'setConcept("fold");' design/prototypes/media-viewer-register-fold-v02/prototype.js
          git diff --check

      - name: Commit focused prototype and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/prototypes/media-viewer-register-fold-v02
          git rm .github/workflows/tmp-media-viewer-v02-build.yml
          git commit -m 'Build focused Media Viewer Register + Source Fold v0.2'
          git push origin HEAD:rd/media-viewer-register-fold-v02

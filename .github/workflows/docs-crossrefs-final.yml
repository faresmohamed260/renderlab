name: Execute Account Settings docs patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/account-settings-roadmap-crossrefs
          fetch-depth: 0
      - name: Patch docs
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit bounded doc-only result
        run: |
          git diff --check
          rm .github/workflows/docs-account-settings-crossrefs.yml .github/workflows/docs-crossrefs-runner.yml .github/workflows/docs-crossrefs-final.yml
          git config user.name "RenderLab Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT.md docs/architecture/PRODUCT_CAPABILITIES.md docs/ui/UI_MIGRATION.md .github/workflows/docs-account-settings-crossrefs.yml .github/workflows/docs-crossrefs-runner.yml .github/workflows/docs-crossrefs-final.yml
          git commit -m "docs: cross-reference Account Settings roadmap [docs-crossrefs-applied]"
          git push origin HEAD:docs/account-settings-roadmap-crossrefs

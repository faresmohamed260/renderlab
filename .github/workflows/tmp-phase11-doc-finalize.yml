name: Temporary Phase 11 docs finalizer

on:
  push:
    branches:
      - work/phase-11-brand-launch-implementation
    paths:
      - .github/workflows/tmp-phase11-doc-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-11-brand-launch-implementation
          fetch-depth: 0

      - name: Apply Phase 11 documentation reconciliation
        run: python scripts/tmp-phase11-doc-finalize.py

      - name: Normalize newly inserted Markdown lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          exact_lines = {
              "docs/ui/SCREEN_REGISTRY.md": {
                  "**Route:** `/`  ",
                  "**Route:** `/create`  ",
                  "**Status:** APPROVED on validated PR #73 implementation; pending merge to `main`  ",
                  "**Implementation:** `src/app/page.tsx`, `src/components/brand/renderlab-brand.tsx`, `src/app/opengraph-image.tsx`  ",
                  "**Design artifacts:** `design/penpot/brand-launch-v0.1-desktop.svg`, `design/penpot/brand-launch-v0.1-mobile.svg`  ",
              },
              "docs/ui/COMPONENT_CATALOG.md": {
                  "**Used by:** `src/app/(app)/layout.tsx` for `/create`, Library/Viewer, Activity, Settings and Admin application routes  ",
                  "**Status:** APPROVED  ",
                  "**Source:** `src/components/brand/renderlab-brand.tsx`  ",
                  "**Origin:** RenderLab-owned geometric mark/wordmark from the reviewed UI-052 design checkpoint  ",
                  "**Purpose:** Shared RenderLab identity for landing, shell and small navigation/favicon scales without glow/gradient dependence.  ",
                  "**Used by:** public Brand / Landing and application `AppShell`; matching vector asset at `public/renderlab-mark.svg`, app icon at `src/app/icon.svg`.  ",
                  "**Reuse rules:** Reuse the component/mark geometry; marketing destination is `/`, application-shell destination is `/create`; preserve accessible labeling and monochrome legibility.  ",
                  "**Do not:** Fork unrelated RenderLab logos, substitute generic AI sparkle/glow identity, or couple branding to provider/model/runtime claims.  ",
              },
          }

          for path, targets in exact_lines.items():
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              normalized = [line.rstrip() if line in targets else line for line in lines]
              p.write_text("\n".join(normalized) + "\n", encoding="utf-8")
          PY

      - name: Remove temporary helpers
        run: |
          rm scripts/tmp-phase11-doc-finalize.py
          rm .github/workflows/tmp-phase11-doc-finalize.yml

      - name: Capture whitespace diagnostic
        id: whitespace
        continue-on-error: true
        shell: bash
        run: git diff --check > phase11-diffcheck.txt 2>&1

      - name: Upload whitespace diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-diffcheck
          path: phase11-diffcheck.txt

      - name: Enforce whitespace gate
        if: steps.whitespace.outcome == 'failure'
        run: |
          cat phase11-diffcheck.txt
          exit 1

      - name: Commit final Phase 11 documentation
        if: steps.whitespace.outcome == 'success'
        run: |
          rm phase11-diffcheck.txt
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize Phase 11 validation evidence"
          git push origin HEAD:work/phase-11-brand-launch-implementation

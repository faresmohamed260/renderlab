name: Temporary Phase 11 docs finalizer

on:
  push:
    branches:
      - work/phase-11-brand-launch-implementation
    paths:
      - .github/workflows/tmp-phase11-doc-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-11-brand-launch-implementation
          fetch-depth: 0

      - name: Apply Phase 11 documentation reconciliation
        run: python scripts/tmp-phase11-doc-finalize.py

      - name: Remove temporary helpers and validate diff
        run: |
          rm scripts/tmp-phase11-doc-finalize.py
          rm .github/workflows/tmp-phase11-doc-finalize.yml
          git diff --check
          git status --short

      - name: Commit final Phase 11 documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize Phase 11 validation evidence"
          git push origin HEAD:work/phase-11-brand-launch-implementation

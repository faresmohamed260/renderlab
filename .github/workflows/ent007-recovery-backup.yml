name: ENT-007 Recovery Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-ent007-recovery-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: rashyleshocuvpgcooxy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ENT007_BACKUP_ENCRYPTION_KEY: ${{ secrets.ENT007_BACKUP_ENCRYPTION_KEY }}
      ENT007_OUTPUT_DIR: artifacts/ent007-recovery
      ENT007_R2_BACKUP_BUCKET: renderlab-dr-backup
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      ENT007_R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.ENT007_R2_BACKUP_ACCESS_KEY_ID }}
      ENT007_R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.ENT007_R2_BACKUP_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused recovery unit tests
        run: node --test tests/unit/ent007-recovery.test.mjs

      - name: Create encrypted logical snapshot
        run: node scripts/create-ent007-recovery-snapshot.mjs

      - name: Persist retained recovery generation
        id: persist
        run: node scripts/persist-ent007-recovery-backup.mjs

      - name: Record secret-safe completion evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "ent007_generation_id=${{ steps.persist.outputs.generation_id }}"
          echo "ent007_completed_at=${{ steps.persist.outputs.completed_at }}"
          echo "ent007_object_backup_count=${{ steps.persist.outputs.object_backup_count }}"
          echo "ent007_object_backup_bytes=${{ steps.persist.outputs.object_backup_bytes }}"

      - name: Remove sensitive runner-local snapshot
        if: always()
        shell: bash
        run: rm -rf artifacts/ent007-recovery

name: Temporary #223 Drag Drop Exact-Head Dispatch

on:
  pull_request:
    paths:
      - ".github/workflows/release-candidate-matrix.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: renderlab-223-drag-drop-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: account/223-profile-credential-implementation
      TARGET_SHA: 5851641ff47bd70cc1177f09e0e02ab7f2e32eff
    steps:
      - name: Verify #271 exact head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_REF" --jq '.object.sha')"
          echo "Target ref: $TARGET_REF"
          echo "Target SHA: $current"
          test "$current" = "$TARGET_SHA"

      - name: Wait for shared Library lifecycle concurrency to quiesce
        shell: bash
        run: |
          set -euo pipefail
          workflows=(library-lifecycle-visual.yml library-drag-drop-visual.yml)
          for attempt in $(seq 1 180); do
            active=0
            for workflow in "${workflows[@]}"; do
              response="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
              count="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length' <<<"$response")"
              active=$((active + count))
            done
            if [ "$active" -eq 0 ]; then
              echo "Shared Library lifecycle concurrency is idle."
              exit 0
            fi
            echo "Waiting for $active active Library lifecycle run(s)..."
            sleep 5
          done
          echo "::error::Library lifecycle concurrency did not quiesce."
          exit 1

      - name: Dispatch and verify exact-head Library Drag Drop
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/library-drag-drop-visual.yml/dispatches" \
            -f "ref=$TARGET_REF"

          for attempt in $(seq 1 240); do
            response="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/library-drag-drop-visual.yml/runs?event=workflow_dispatch&branch=$TARGET_REF&per_page=20")"
            run_json="$(jq -c --arg sha "$TARGET_SHA" --arg started "$started_at" '
              .workflow_runs
              | map(select(.head_sha == $sha and .created_at >= $started))
              | sort_by(.created_at)
              | last // empty
            ' <<<"$response")"

            if [ -z "$run_json" ]; then
              sleep 5
              continue
            fi

            run_id="$(jq -r '.id' <<<"$run_json")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            echo "Library Drag Drop run $run_id: $status $conclusion"

            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "Exact-head Library Drag Drop passed at $TARGET_SHA (run $run_id)."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Timed out waiting for exact-head Library Drag Drop."
          exit 1

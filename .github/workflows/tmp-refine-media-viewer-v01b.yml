name: Apply second Media Viewer v0.1 refinement

on:
  push:
    branches:
      - rd/media-viewer-continuity-v01
    paths:
      - '.github/workflows/tmp-refine-media-viewer-v01b.yml'
      - 'scripts/tmp-refine-media-viewer-v01b.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R&D branch
        uses: actions/checkout@v4
        with:
          ref: rd/media-viewer-continuity-v01
          fetch-depth: 0
      - name: Apply refinement
        run: |
          node scripts/tmp-refine-media-viewer-v01b.mjs
          node --check scripts/verify-media-viewer-continuity-v01.mjs
          node --check design/prototypes/media-viewer-continuity-v01/prototype.js
          git diff --check
      - name: Verify bounded scope
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          expected=$(printf '%s\n' \
            design/prototypes/media-viewer-continuity-v01/style.css \
            scripts/verify-media-viewer-continuity-v01.mjs | sort)
          actual=$(git diff --name-only | grep -Ev '^(scripts/tmp-refine-media-viewer-v01b\.mjs|\.github/workflows/tmp-refine-media-viewer-v01b\.yml)$' | sort)
          test "$actual" = "$expected"
      - name: Commit refinement and remove helpers
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-refine-media-viewer-v01b.yml scripts/tmp-refine-media-viewer-v01b.mjs
          git add design/prototypes/media-viewer-continuity-v01/style.css scripts/verify-media-viewer-continuity-v01.mjs
          git diff --cached --check
          git commit -m "Tighten Viewer first-viewport evidence"
          git push origin HEAD:rd/media-viewer-continuity-v01

name: Phase 15 Post-Merge Documentation Sync

on:
  push:
    branches: [noop]
    paths:
      - ".github/workflows/phase15-postmerge-doc-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0

      - name: Update authoritative Phase 15 post-merge handoff
        shell: bash
        env:
          EXPECTED_MAIN: e4daac8870dead088f19101e3083743a31a692c2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"

          python <<'PY'
          from pathlib import Path

          project = Path('PROJECT.md')
          text = project.read_text()
          old = "The 2026-09-05 audit found eight such unindexed generated assets total, including newer production Edit history and one newer duplicate-finalization case. They are user/product history, not maintenance garbage, and were not deleted or reclassified. Indexed slot uniqueness remains clean."
          new = "Pre-merge 2026-09-05 audits observed this nullable legacy set continuing to grow while the still-deployed older application served real production generations, including newer Edit history and a duplicate-linked case. The exact count is therefore intentionally **not** a stable invariant until Phase 14/15 is rolled out. These rows are user/product history, not maintenance garbage, and must not be deleted or reclassified; indexed slot uniqueness remains clean."
          if old not in text:
              raise SystemExit('Expected PROJECT rolling-deployment sentence not found')
          text = text.replace(old, new, 1)
          marker = '## Phase 15 Post-Merge Closure — 2026-09-05'
          if marker not in text:
              text = text.rstrip() + '''\n\n## Phase 15 Post-Merge Closure — 2026-09-05\nPR #96 merged Phase 15 to `main` as `e4daac8870dead088f19101e3083743a31a692c2` from exact final PR head `ef142d40469eaa781fd0d009ed33652ffd0cb5b2`.\n\nThe exact final PR head passed all 17 attached workflows: Reference Upload `33940933416`, Persistent Media Upload `33940933396`, Brand / Launch `33940933393`, Account Ownership `33940933426`, UI Shell `33940933463`, Library Lifecycle `33940933641`, Activity Cancel `33940933484`, Generation Cancellation `33940933399`, Maintenance `33940933497`, Generation Reconciliation `33940933468`, Activity `33940933382`, Create Lifecycle `33940933465`, Integrated Release `33940933431`, Generation Integration `33940933421`, Generation Admission `33940933390`, Video Generation Integration `33940933476`, and Media Delete `33940933453`.\n\nFinal shared-resource audit after those runs found zero fixture Auth users, zero active generation jobs, zero active reconciliation claims, zero duplicate indexed output slots, zero pending media purges, zero nonterminal upload sessions and zero orphan admission reservations; generation defaults were restored to enabled / 1 active / 12 hourly / `updated_by=null`. The old temporary-source backlog remains three stale unreferenced rows plus one stale referenced/protected row; no production maintenance sweep was run.\n\nThe nullable `generation_output_index` population is a rolling-deployment observation rather than a fixed invariant: pre-merge audits observed it grow from eight to nine as the still-deployed pre-Phase-14 finalizer handled legitimate production Edit work. Those rows remain user/product history and are not cleanup candidates.\n\nNo Phase 14/15 application rollout or scheduler activation followed the merge. Vercel still reports accepted production deployment `dpl_CZZvmdN42VHRK7uLVUA9W8kdc7x2`; automatic Git deployment remains disabled; Supabase `pg_cron` and `pg_net` remain absent; no production reconciliation or maintenance schedule/secret was activated. Supabase advisors show no new Phase 15-specific finding beyond the already tracked server-owned RLS/no-policy INFO, leaked-password-protection WARN, singleton FK INFO and unused-index INFO.\n\nPhase 16 remains roadmap-only. The next substantial product-planning task is to expand Creative Iteration into an execution-ready contract from current `main` before implementation begins.\n'''
          project.write_text(text)

          infra = Path('docs/architecture/INFRASTRUCTURE.md')
          text = infra.read_text()
          old = "As of the 2026-09-05 audit there are eight generated-media rows with null output index, including newer production Edit jobs created by the pre-Phase-14 finalizer and a newer duplicate-linked case. They are legitimate user/product history and must **not** be swept or reclassified by Phase 15 maintenance. The indexed `(generation_job_id, generation_output_index)` uniqueness boundary remains clean for code that uses the new contract."
          new = "Pre-merge 2026-09-05 audits observed the generated-media rows with null output index continuing to grow while the pre-Phase-14 production finalizer remained live, including newer production Edit jobs and a duplicate-linked case. Their exact count is deliberately treated as volatile until application rollout, not as a cleanup invariant. They are legitimate user/product history and must **not** be swept or reclassified by Phase 15 maintenance. The indexed `(generation_job_id, generation_output_index)` uniqueness boundary remains clean for code that uses the new contract."
          if old not in text:
              raise SystemExit('Expected INFRA rolling-deployment sentence not found')
          infra.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/architecture/INFRASTRUCTURE.md
          git commit -m "Record Phase 15 post-merge closure"
          git push origin HEAD:main

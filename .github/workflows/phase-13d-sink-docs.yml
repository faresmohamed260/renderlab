name: Phase 13D Sink Evidence Docs

on:
  push:
    branches:
      - docs/phase-13d-resend-sink-evidence
    paths:
      - .github/phase13d_sink_docs.py
      - .github/workflows/phase-13d-sink-docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/phase-13d-resend-sink-evidence
          fetch-depth: 0

      - name: Record verified provider-sink evidence
        run: python .github/phase13d_sink_docs.py

      - name: Commit docs and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/phase13d_sink_docs.py .github/workflows/phase-13d-sink-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md .github
          git diff --cached --check
          git commit -m 'docs: record Phase 13D provider sink evidence'
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_MIGRATION.md | sort)"
          test "$changed" = "$expected"
          git push origin HEAD:docs/phase-13d-resend-sink-evidence

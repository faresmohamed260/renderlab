name: Phase 12B Blocker Documentation

on:
  push:
    branches: [work/phase-12b-auth-blocker-record]
    paths:
      - ".github/workflows/phase-12b-blocker-docs.yml"
      - ".github/phase12b_blocker_patch.py"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blocker branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-12b-auth-blocker-record
          fetch-depth: 0

      - name: Record verified rollout blocker
        run: python .github/phase12b_blocker_patch.py

      - name: Commit authoritative blocker state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git commit -m "docs: record Phase 12B Auth URL blocker"
          git push origin HEAD:work/phase-12b-auth-blocker-record

name: TEMP #286 Historical Fixture Cleanup

on:
  push:
    branches:
      - fix/286-configured-fixture-cleanup

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - namespace: activity-cancel-owner
            scope: "34680270864"
            expected_id: "95df1d0f-7e0d-4882-8b94-150c5d72eb0e"
          - namespace: library-lifecycle
            scope: "34695128670"
            expected_id: "5291a621-5ec6-489c-8969-260899ddb1ba"
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_ACCOUNT_SCOPE: ${{ matrix.scope }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Delete and prove exact historical fixture absence
        env:
          FIXTURE_NAMESPACE: ${{ matrix.namespace }}
          EXPECTED_FIXTURE_ID: ${{ matrix.expected_id }}
        run: |
          node --input-type=module <<'NODE'
          import {
            configuredTestAccountIdentity,
            deleteConfiguredTestAccount,
          } from "./scripts/lib/configured-test-account.mjs";

          const account = configuredTestAccountIdentity(process.env.FIXTURE_NAMESPACE);
          if (account.id !== process.env.EXPECTED_FIXTURE_ID) {
            throw new Error(`Refusing cleanup: deterministic ID ${account.id} does not match expected ${process.env.EXPECTED_FIXTURE_ID}.`);
          }
          await deleteConfiguredTestAccount(account);
          console.log(`Verified historical configured fixture absent: ${process.env.FIXTURE_NAMESPACE} ${account.id}`);
          NODE

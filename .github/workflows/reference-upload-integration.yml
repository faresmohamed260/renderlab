name: Reference Upload Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/reference-upload-integration.yml"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-reference-upload.mjs"
      - "src/lib/supabase/**"
      - "src/app/api/assets/reference/**"
      - "src/server/media/reference-uploads.ts"
      - "src/server/storage/**"
      - "src/server/data/**"
      - "src/lib/api/reference-upload-contract.ts"
      - "supabase/migrations/0004_core_account_ownership_prepare.sql"
      - "supabase/migrations/0005_core_account_ownership_enforce.sql"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-upload-integration.yml"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-reference-upload.mjs"
      - "src/lib/supabase/**"
      - "src/app/api/assets/reference/**"
      - "src/server/media/reference-uploads.ts"
      - "src/server/storage/**"
      - "src/server/data/**"
      - "src/lib/api/reference-upload-contract.ts"
      - "supabase/migrations/**"
      - "package.json"

permissions:
  contents: read

jobs:
  reference-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the RenderLab repository/environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1

      - name: Verify real signed reference upload
        run: node scripts/verify-reference-upload.mjs

      - name: Cleanup reference upload fixture
        if: always()
        run: node scripts/verify-reference-upload.mjs

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

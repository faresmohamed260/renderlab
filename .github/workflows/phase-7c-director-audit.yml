name: Phase 7C Director Audit

on:
  push:
    branches:
      - audit/phase-7c-director
    paths:
      - .github/workflows/phase-7c-director-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe configured REDGraft gateways
        env:
          PRIMARY: https://dreadcipher67--saga-ltx25-gateway-web.modal.run
          STANDBY: https://blackzerox67--saga-ltx25-gateway-web.modal.run
        run: |
          set -euo pipefail
          mkdir -p audit
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$PRIMARY/health" -o audit/primary-health.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$STANDBY/health" -o audit/standby-health.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$PRIMARY/openapi.json" -o audit/primary-openapi.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$STANDBY/openapi.json" -o audit/standby-openapi.json
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 900 "$PRIMARY/runtime-health" -o audit/primary-runtime-health.json

          # This request cannot spawn generation because duration_seconds=1 is invalid.
          # It deliberately includes the RenderLab-posted cfg/steps fields to determine
          # whether the live gateway still validates them or simply ignores them.
          status="$(curl --silent --show-error -o audit/primary-extra-fields.json -w '%{http_code}' \
            -X POST "$PRIMARY/jobs/video" \
            -F 'prompt=renderlab phase 7c contract audit' \
            -F 'resolution=480p' \
            -F 'duration_seconds=1' \
            -F 'steps=999' \
            -F 'cfg=999')"
          printf '%s\n' "$status" > audit/primary-extra-fields-status.txt

      - name: Summarize live Director capability boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('audit')
          primary = json.loads((root/'primary-health.json').read_text())
          standby = json.loads((root/'standby-health.json').read_text())
          runtime = json.loads((root/'primary-runtime-health.json').read_text())
          po = json.loads((root/'primary-openapi.json').read_text())
          so = json.loads((root/'standby-openapi.json').read_text())
          extra_status = (root/'primary-extra-fields-status.txt').read_text().strip()
          extra_body = json.loads((root/'primary-extra-fields.json').read_text())

          def video_schema(doc):
              op = doc['paths']['/jobs/video']['post']
              content = op['requestBody']['content']['multipart/form-data']['schema']
              if '$ref' in content:
                  name = content['$ref'].split('/')[-1]
                  content = doc['components']['schemas'][name]
              props = content.get('properties', {})
              return props, sorted(content.get('required', []))

          primary_props, primary_required = video_schema(po)
          standby_props, standby_required = video_schema(so)
          primary_fields = sorted(primary_props)
          standby_fields = sorted(standby_props)
          director_specific = {
              'frames','frame_files','storyboard','scenes','scene_prompt','action',
              'dialogue','speech','speaker','sound','ambient_sound','audio_prompt',
              'camera','shot','keyframes','start_frame','end_frame'
          }
          found_director = sorted(set(primary_fields) & director_specific)

          assert primary.get('ready') is True, primary
          assert standby.get('ready') is True, standby
          assert primary_fields == standby_fields, (primary_fields, standby_fields)
          assert primary_required == standby_required, (primary_required, standby_required)
          assert 'prompt' in primary_fields
          assert primary_fields.count('image_file') <= 1
          assert not found_director, found_director
          assert runtime.get('ready') is True, runtime
          assert extra_status == '400', (extra_status, extra_body)
          extra_detail = str(extra_body.get('detail') or extra_body.get('error') or '')
          assert 'duration' in extra_detail.lower(), extra_body
          assert 'step' not in extra_detail.lower(), extra_body
          assert 'cfg' not in extra_detail.lower(), extra_body

          def property_summary(props):
              result = {}
              for name, schema in sorted(props.items()):
                  result[name] = {
                      key: schema[key]
                      for key in ('type', 'title', 'default', 'minimum', 'maximum', 'enum', 'anyOf')
                      if key in schema
                  }
              return result

          summary = {
              'gateway_primary': {
                  'gateway': primary.get('gateway'),
                  'build': primary.get('build'),
                  'runtime_app': primary.get('runtime_app'),
                  'runtime_class': primary.get('runtime_class'),
                  'async_jobs': primary.get('async_jobs'),
                  'cancel_jobs': primary.get('cancel_jobs'),
              },
              'gateway_standby': {
                  'gateway': standby.get('gateway'),
                  'build': standby.get('build'),
                  'runtime_app': standby.get('runtime_app'),
                  'runtime_class': standby.get('runtime_class'),
                  'async_jobs': standby.get('async_jobs'),
                  'cancel_jobs': standby.get('cancel_jobs'),
              },
              'video_submit_fields': primary_fields,
              'video_required_fields': primary_required,
              'video_submit_schema': property_summary(primary_props),
              'director_specific_fields': found_director,
              'source_live_drift': {
                  'cfg_exposed_live': 'cfg' in primary_fields,
                  'steps_exposed_live': 'steps' in primary_fields,
                  'invalid_duration_probe_status': extra_status,
                  'invalid_duration_probe_detail': extra_detail,
                  'probe_sent_cfg': 999,
                  'probe_sent_steps': 999,
                  'conclusion': (
                      'The live endpoint proceeded to duration validation despite invalid cfg/steps values, '
                      'confirming those extra multipart fields are not active live controls.'
                  ),
              },
              'runtime': {
                  'app': runtime.get('app'),
                  'runtime_build': runtime.get('runtime_build'),
                  'gpu': runtime.get('gpu'),
                  'gpu_name': runtime.get('gpu_name'),
                  'frame_rates': runtime.get('frame_rates'),
                  'enabled_resolutions': runtime.get('enabled_resolutions'),
                  'recipe': runtime.get('recipe'),
              },
              'conclusion': (
                  'Live configured gateway exposes one optional image_file and one shared prompt; '
                  'no structured storyboard/frame/dialogue/speech/ambient-sound/Director fields are deployed.'
              ),
          }
          (root/'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-7c-director-audit
          path: audit/
          if-no-files-found: error
          retention-days: 14

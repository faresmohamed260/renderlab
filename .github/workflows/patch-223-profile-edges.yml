name: Patch 223 Profile Edges

on:
  push:
    branches:
      - account/223-profile-credential-implementation
    paths:
      - .github/workflows/patch-223-profile-edges.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/223-profile-credential-implementation
          fetch-depth: 1
      - run: python scripts/patch-223-profile-edges.py
      - name: Commit edge corrections
        run: |
          set -euo pipefail
          git rm scripts/patch-223-profile-edges.py .github/workflows/patch-223-profile-edges.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/account/account-profile.ts scripts/lib/configured-test-account.mjs
          git commit -m "fix: tighten profile normalization and test redirects"
          git push origin HEAD:account/223-profile-credential-implementation

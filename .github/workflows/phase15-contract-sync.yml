name: Phase 15 Contract Documentation Sync

on:
  push:
    branches:
      - plan/phase15-control-maintenance-contract
    paths:
      - .github/workflows/phase15-contract-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contract branch
        uses: actions/checkout@v4
        with:
          ref: plan/phase15-control-maintenance-contract
          fetch-depth: 0

      - name: Record Phase 15 execution contract
        run: python .github/phase15-contract-sync.py

      - name: Commit source-of-truth contract
        shell: bash
        run: |
          rm .github/workflows/phase15-contract-sync.yml .github/phase15-contract-sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/PRODUCT_CAPABILITIES.md docs/architecture/INFRASTRUCTURE.md .github/workflows/phase15-contract-sync.yml .github/phase15-contract-sync.py
          git diff --cached --quiet && exit 0
          git commit -m 'Record Phase 15 execution contract'
          git push origin HEAD:plan/phase15-control-maintenance-contract

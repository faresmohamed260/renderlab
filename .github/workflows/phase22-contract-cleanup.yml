name: Phase 22 Contract Cleanup

on:
  push:
    branches:
      - work/phase-22-system-cohesion-contract
    paths:
      - .github/workflows/phase22-contract-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-22-system-cohesion-contract
      - name: Correct stale Phase 21 handoff wording
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("docs/ui/UI_MIGRATION.md"); t=p.read_text(); old="No schema, Supabase/R2, account/admission, generation capability, worker/provider/routing or production-deployment change is authorized by this contract. Phase 22 remains roadmap-only."; new="No schema, Supabase/R2, account/admission, generation capability, worker/provider/routing or production-deployment change is authorized by this contract. Phase 22 is expanded below from the now-verified merged Phase 21 baseline; implementation still requires the design checkpoint."; assert old in t; p.write_text(t.replace(old,new,1))'
          rm .github/workflows/phase22-contract-cleanup.yml
          git diff --check
      - name: Commit corrected handoff wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/UI_MIGRATION.md .github/workflows/phase22-contract-cleanup.yml
          git commit -m "docs: align Phase 22 handoff state"
          git push origin HEAD:work/phase-22-system-cohesion-contract

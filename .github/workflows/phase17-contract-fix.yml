name: Phase 17 contract fix

on:
  push:
    branches: [work/phase-17-observability-quality]
    paths:
      - ".github/workflows/phase17-contract-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-17-observability-quality
          fetch-depth: 0

      - name: Apply guarded contract fixes
        shell: bash
        run: |
          sed -i 's/    "staleSourceCandidates",/    "maintenance backlog",/' .github/phase17-contract-fix.py
          python .github/phase17-contract-fix.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify negative fixtures
        run: npm run verify:engineering-quality

      - name: Verify Admin verifier syntax
        run: node --check scripts/verify-admin-operations.mjs

      - name: Audit whitespace and guarded diff
        run: |
          git diff --check
          test -f .github/phase17-contract-fix.py
          test -f .github/workflows/phase17-contract-fix.yml

      - name: Commit source fixes only
        shell: bash
        run: |
          git checkout -- \
            .github/workflows/admin-operations.yml \
            .github/workflows/generation-bridge-integration.yml \
            .github/workflows/video-generation-integration.yml \
            .github/workflows/generation-reconciliation.yml \
            .github/workflows/generation-cancellation.yml \
            .github/workflows/generation-admission.yml \
            .github/workflows/activity-visual.yml \
            .github/workflows/activity-cancel-visual.yml \
            .github/workflows/maintenance-integration.yml
          rm .github/phase17-contract-fix.py
          rm -f package-lock.json
          git add -A
          git diff --cached --check
          git diff --cached --name-only | tee /tmp/phase17-source-files.txt
          if grep -q '^.github/workflows/' /tmp/phase17-source-files.txt; then
            echo "::error::Source-only commit still contains workflow changes."
            exit 1
          fi
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git commit -m "Fix Phase 17 observability verification boundary"
          git push origin HEAD:work/phase-17-observability-quality

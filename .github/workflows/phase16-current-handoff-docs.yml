name: Phase 16 Current Handoff Docs

on:
  push:
    branches: [noop]
    paths:
      - ".github/phase16-current-handoff-docs.py"
      - ".github/workflows/phase16-current-handoff-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: work/phase-16-creative-iteration
      EXPECTED_HEAD: 4d1a495a8145238e1e78756c7b09cdbaee8d8115
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0
      - name: Preserve patch helper
        run: cp .github/phase16-current-handoff-docs.py /tmp/phase16-current-handoff-docs.py
      - name: Update Phase 16 repository handoff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python /tmp/phase16-current-handoff-docs.py
          git diff --check
          grep -Fq '16A/16B/16C/16D IMPLEMENTED / CONFIGURED VERIFIED' PROJECT.md
          grep -Fq 'FINAL HUMAN VIEWER REVIEW / PHASE CLOSURE PENDING' PROJECT.md
          grep -Fq '16D implementation / configured verification' docs/ui/UI_MIGRATION.md
          grep -Fq 'Compare source implemented / configured-verified' docs/ui/SCREEN_REGISTRY.md
          grep -Fq 'UI-056 implementation verification' docs/ui/UI_DECISIONS.md
          grep -Fq '16A–16D configured-verified' docs/architecture/PRODUCT_CAPABILITIES.md
          grep -Fq '16A–16D configured-verified' docs/architecture/FRONTEND_ARCHITECTURE.md
          grep -Fq 'Implementation evidence / remaining boundary' design/penpot/media-viewer-v0.2-compare-source.md
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/ui/UI_DECISIONS.md docs/architecture/PRODUCT_CAPABILITIES.md docs/architecture/FRONTEND_ARCHITECTURE.md design/penpot/media-viewer-v0.2-compare-source.md
          git commit -m "Update Phase 16 implementation handoff"
          git push origin HEAD:"$TARGET_BRANCH"

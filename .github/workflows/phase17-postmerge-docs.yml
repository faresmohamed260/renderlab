name: Phase 17 Post-Merge Documentation Closure

on:
  push:
    branches:
      - work/phase-17-observability-quality
    paths:
      - .github/workflows/phase17-postmerge-docs.yml

permissions:
  contents: write

concurrency:
  group: renderlab-phase17-postmerge-docs
  cancel-in-progress: false

jobs:
  close-phase-17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard expected merged main
        shell: bash
        run: |
          set -euo pipefail
          expected="aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "main moved: expected $expected, got $actual" >&2
            exit 1
          }

      - name: Record verified Phase 17 repository closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          project_path = Path("PROJECT.md")
          project = project_path.read_text()

          project = replace_once(
              project,
              "**Status: `IN PROGRESS — PHASE 17 COMPLETE / VERIFIED; PR #108 MERGE PENDING`.**",
              "**Status: `IN PROGRESS — PHASE 17 COMPLETE / VERIFIED / MERGED; PHASE 18 CONTRACT EXPANSION NEXT`.**",
              "PROJECT cycle status",
          )
          project = replace_once(
              project,
              "Phase 17 contract expansion is next; production rollout remains separate and unauthorized by this completion.",
              "Phase 17 subsequently completed and merged; production rollout remains separate and unauthorized by both phase completions.",
              "PROJECT Phase 16 next-state sentence",
          )
          project = replace_once(
              project,
              "Exact implementation evidence is recorded below; PR #108 merge remains a separate repository operation.",
              "Exact implementation and repository-closure evidence is recorded below; PR #108 was squash-merged as `aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd` from definitive exact final head `6c9af34702d8d2fc26d0e5e7d0cca649fde4cf0b` after all 29 attached workflows passed, and the merged-main push set then passed all 11 workflows GitHub actually attached.",
              "PROJECT Phase 17 roadmap closure",
          )
          project = replace_once(
              project,
              "Phase 17 contract expansion is the next repository phase.",
              "Phase 17 subsequently completed and merged; Phase 18 contract expansion is now the next repository governance step.",
              "PROJECT pre-Phase17 handoff",
          )
          project = replace_once(
              project,
              "**Status: `COMPLETE / VERIFIED` — exact implementation and rendered Admin evidence recorded below; PR #108 merge pending.**",
              "**Status: `COMPLETE / VERIFIED / MERGED` — exact implementation, rendered Admin, exact-final-head and merged-main evidence recorded below.**",
              "PROJECT Phase 17 contract status",
          )
          project = replace_once(
              project,
              "Only after Phase 17 is `COMPLETE / VERIFIED` should Phase 18 be expanded into an execution-ready Next Creative Capability contract from a fresh deployed-worker audit.",
              "Phase 17 is now `COMPLETE / VERIFIED / MERGED`; Phase 18 may be expanded into an execution-ready Next Creative Capability contract only from a fresh deployed-worker audit. Phase 18 implementation remains unapproved until that contract is established.",
              "PROJECT Phase 18 gate",
          )
          project = replace_once(
              project,
              "Phase 17 is `COMPLETE / VERIFIED` in repository implementation at exact clean head `1ecd46bb809c1953cd24f1eecbd4bbfab7dbd4be`. PR #108 merge remains a separate repository operation; this verification does not authorize production deployment or scheduler activation.",
              "Phase 17 is `COMPLETE / VERIFIED / MERGED`. Exact clean implementation head `1ecd46bb809c1953cd24f1eecbd4bbfab7dbd4be` remains the implementation evidence. Definitive tree-identical final PR head `6c9af34702d8d2fc26d0e5e7d0cca649fde4cf0b` passed all 29 attached workflows with zero failures and zero cancellations; PR #108 was then squash-merged with the expected-head guard as `aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd`. This verification and repository merge do not authorize production deployment or scheduler activation.",
              "PROJECT Phase 17 verification intro",
          )
          project = replace_once(
              project,
              "- **No speculative infrastructure:** Phase 17 adds no database migration, durable telemetry/event-store table, telemetry vendor, client RUM/session replay, production deployment or reconciliation/maintenance scheduler activation. Existing platform/server logs and current durable RenderLab state remain the v0.1 evidence sources.",
              "- **Repository closure:** definitive exact final PR head `6c9af34702d8d2fc26d0e5e7d0cca649fde4cf0b` is a true empty/tree-identical commit on docs-complete tree `c48a1f33e6db512abaa1072b45e4bdd59de7258e`; all 29 attached workflows passed with zero failures/cancellations before PR #108 was marked ready and squash-merged as `aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd`.\n- **Merged-main push verification:** all 11 workflows GitHub actually attached to merge SHA `aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd` passed: Engineering Quality `33992552565`, Deployment Readiness `33992552541`, Reference Upload Integration `33992552558`, Generation Integration `33992552557`, Video Generation Integration `33992552570`, Generation Reconciliation `33992552537`, Generation Cancellation `33992552555`, Maintenance Integration `33992552530`, Activity Cancel Visual `33992552529`, Creative Iteration `33992552596`, and UI Shell Validation `33992552536`. The Video run completed its live four-case product matrix, exact fixture cleanup and artifact upload.\n- **Release boundary:** a live Vercel audit after merge found no Phase 17 deployment; production remains accepted candidate `d6b8f386db3893e583c99b23fc3397b0eb377d42` at READY deployment `dpl_CZZvmdN42VHRK7uLVUA9W8kdc7x2`. No reconciliation/maintenance scheduler, `pg_cron`/`pg_net`, telemetry vendor/event store, schema migration or production maintenance sweep was activated by repository closure.\n- **No speculative infrastructure:** Phase 17 adds no database migration, durable telemetry/event-store table, telemetry vendor, client RUM/session replay, production deployment or reconciliation/maintenance scheduler activation. Existing platform/server logs and current durable RenderLab state remain the v0.1 evidence sources.",
              "PROJECT Phase 17 closure evidence insertion",
          )
          project = replace_once(
              project,
              "The next governance step after PR #108 is merged and merged-main checks are verified is a fresh deployed-worker audit that expands Phase 18 into one coherent execution-ready capability contract. Phase 18 implementation is not pre-approved by this completion.",
              "The next governance step is a fresh deployed-worker audit that expands Phase 18 into one coherent execution-ready capability contract. Phase 18 implementation is not pre-approved by this completion and was not started during Phase 17 closure.",
              "PROJECT next governance step",
          )
          project = replace_once(
              project,
              "Current FLUX and REDgraft gateway implementations advertise `cancel_jobs=true`",
              "Current FLUX and REDGraft gateway implementations advertise `cancel_jobs=true`",
              "PROJECT REDGraft capitalization",
          )
          if "PR #108 merge pending" in project or "PR #108 MERGE PENDING" in project or "PR #108 merge remains" in project:
              raise SystemExit("PROJECT still contains stale PR #108 pending language")
          project_path.write_text(project)

          migration_path = Path("docs/ui/UI_MIGRATION.md")
          migration = migration_path.read_text()
          migration = replace_once(
              migration,
              "**Current phase:** Phase 17 — Observability & Engineering Quality is `COMPLETE / VERIFIED` under UI-057; PR #108 merge is pending. Phase 16 is `COMPLETE / VERIFIED / MERGED` on `main` `ad3cf2a987b60098fdc361a7f8fc358ae706aeae`.",
              "**Current phase:** Phase 17 — Observability & Engineering Quality is `COMPLETE / VERIFIED / MERGED` under UI-057 on `main` `aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd`. Phase 16 remains `COMPLETE / VERIFIED / MERGED` on its verified repository baseline.",
              "UI_MIGRATION current phase",
          )
          migration = replace_once(
              migration,
              "**Next sequence:** finish exact-final-head validation and merge verified Phase 17 PR #108, then re-audit the deployed worker fleet and expand Phase 18 into one coherent execution-ready capability contract. Do not implement Phase 18 from roadmap preference alone.",
              "**Next sequence:** re-audit the deployed worker fleet and expand Phase 18 into one coherent execution-ready capability contract. Do not implement Phase 18 from roadmap preference alone.",
              "UI_MIGRATION next sequence",
          )
          migration = replace_once(
              migration,
              "**Deployment boundary:** Phase 16 merge and Phase 17 planning changed repository state only. They do not authorize or imply a production application rollout, reconciliation/maintenance scheduler activation, `pg_cron`/`pg_net`, telemetry-vendor configuration or production maintenance sweep.",
              "**Deployment boundary:** Phase 16 and Phase 17 repository merges changed repository state only. They do not authorize or imply a production application rollout, reconciliation/maintenance scheduler activation, `pg_cron`/`pg_net`, telemetry-vendor configuration or production maintenance sweep; a post-merge Vercel audit confirmed no Phase 17 deployment was created.",
              "UI_MIGRATION deployment boundary",
          )
          migration = replace_once(
              migration,
              "**Status: `COMPLETE / VERIFIED` — exact implementation/render evidence recorded below; PR #108 merge pending.**",
              "**Status: `COMPLETE / VERIFIED / MERGED` — exact implementation/render, exact-final-head and merged-main evidence recorded below.**",
              "UI_MIGRATION Phase 17 status",
          )
          migration = replace_once(
              migration,
              "**Next after verified completion:** re-audit the deployed worker fleet and expand Phase 18 into one coherent capability contract; do not implement Phase 18 from roadmap preference alone.",
              "- [x] Definitive exact final PR head `6c9af34702d8d2fc26d0e5e7d0cca649fde4cf0b` was a true empty/tree-identical validation commit on docs-complete tree `c48a1f33e6db512abaa1072b45e4bdd59de7258e`; all 29 attached workflows passed with zero failures and zero cancellations.\n- [x] PR #108 was marked ready and squash-merged with the expected-head guard as `aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd`.\n- [x] Merged `main` `aaa2dcf06a927b9cbc5fe08dd3af1f47116ce1dd` passed all 11 actually attached push workflows: Engineering Quality `33992552565`, Deployment Readiness `33992552541`, Reference Upload Integration `33992552558`, Generation Integration `33992552557`, Video Generation Integration `33992552570`, Generation Reconciliation `33992552537`, Generation Cancellation `33992552555`, Maintenance Integration `33992552530`, Activity Cancel Visual `33992552529`, Creative Iteration `33992552596`, and UI Shell Validation `33992552536`.\n- [x] Live Vercel audit after merge found no Phase 17 deployment; production remains exact candidate `d6b8f386db3893e583c99b23fc3397b0eb377d42` at READY deployment `dpl_CZZvmdN42VHRK7uLVUA9W8kdc7x2`. No scheduler activation, schema migration, telemetry vendor/event store, client tracking or production maintenance sweep followed repository closure.\n\n**Phase 17 repository status: `COMPLETE / VERIFIED / MERGED`.**\n\n**Next after verified completion:** re-audit the deployed worker fleet and expand Phase 18 into one coherent capability contract; do not implement Phase 18 from roadmap preference alone.",
              "UI_MIGRATION closure block",
          )
          if "PR #108 merge pending" in migration or "PR #108 merge is pending" in migration:
              raise SystemExit("UI_MIGRATION still contains stale PR #108 pending language")
          migration_path.write_text(migration)
          PY

      - name: Verify narrow documentation diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "PROJECT.md"
          test "${changed[1]}" = "docs/ui/UI_MIGRATION.md"
          ! git diff -- PROJECT.md docs/ui/UI_MIGRATION.md | grep -F "PR #108 merge pending"
          ! git diff -- PROJECT.md docs/ui/UI_MIGRATION.md | grep -F "PR #108 merge is pending"

      - name: Commit and push closure handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md
          git commit -m "docs: close Phase 17 repository handoff"
          git push origin HEAD:main

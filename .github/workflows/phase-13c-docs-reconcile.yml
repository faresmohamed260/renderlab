name: Phase 13C Docs Reconcile

on:
  push:
    branches:
      - docs/phase-13c-resend-closure
    paths:
      - .github/phase13c_docs_reconcile.py
      - .github/workflows/phase-13c-docs-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/phase-13c-resend-closure
          fetch-depth: 0

      - name: Tighten Phase 13 insertion guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/phase13c_docs_reconcile.py')
          text = path.read_text()
          old = '''if "**13C implementation / verification evidence — 2026-09-01**" not in p:\n    p = replace_once(p, marker, evidence + marker, "PROJECT 13C evidence insertion")'''
          new = '''if "**13C implementation / verification evidence — 2026-09-01**" not in p:\n    phase13_start = p.index("### Phase 13 execution contract — Email & Invite Production Hardening")\n    marker_pos = p.index(marker, phase13_start)\n    p = p[:marker_pos] + evidence + p[marker_pos:]'''
          if old not in text:
              raise SystemExit('expected generic insertion guard not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Reconcile authoritative Phase 13 docs
        run: python .github/phase13c_docs_reconcile.py

      - name: Commit documentation and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/phase13c_docs_reconcile.py .github/workflows/phase-13c-docs-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/INFRASTRUCTURE.md .github
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md | sort)"
          test "$changed" = "$expected"
          git commit -m 'docs: record verified Phase 13C Resend state'
          git push origin HEAD:docs/phase-13c-resend-closure

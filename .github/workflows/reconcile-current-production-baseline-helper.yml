name: Reconcile Current Production Baseline Helper

on:
  push:
    branches: [docs/reconcile-current-production-baseline-20260914]
    paths:
      - ".github/workflows/reconcile-current-production-baseline-helper.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-current-production-baseline-20260914
      - run: python .github/scripts/reconcile-current-production-baseline.py
      - name: Commit and remove helper
        run: |
          rm .github/workflows/reconcile-current-production-baseline-helper.yml .github/scripts/reconcile-current-production-baseline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile current production baseline"
          git push origin HEAD:docs/reconcile-current-production-baseline-20260914

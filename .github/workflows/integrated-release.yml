name: Integrated Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/release-candidate"
      - ".github/workflows/integrated-release.yml"
      - "package.json"
      - "next.config.ts"
      - "proxy.ts"
      - "src/**"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-integrated-release.mjs"
      - "scripts/verify-r2-browser-cors.mjs"
      - "supabase/migrations/**"
  push:
    branches: [main]
    paths:
      - ".github/release-candidate"
      - ".github/workflows/integrated-release.yml"
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-integrated-release.mjs"
      - "scripts/verify-r2-browser-cors.mjs"

permissions:
  contents: read

concurrency:
  group: renderlab-integrated-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_BROWSER_UPLOAD_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,https://renderlab-lake.vercel.app,https://renderlab.faresuniform.uk,https://renderlab-faresmohamed260-6733s-projects.vercel.app,https://renderlab-git-main-faresmohamed260-6733s-projects.vercel.app
      RENDERLAB_GENERATION_BACKEND_URL: http://127.0.0.1:4312
      RENDERLAB_GENERATION_BACKEND_TOKEN: phase-12-integrated-release
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for RenderLab."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release verifier syntax
        run: |
          node --check scripts/verify-integrated-release.mjs
          node --check scripts/verify-r2-browser-cors.mjs

      - name: Audit R2 browser upload CORS without mutation
        run: node scripts/verify-r2-browser-cors.mjs

      - name: Verify UI purity
        run: npm run verify:ui-purity

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          echo $! > /tmp/renderlab-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1

      - name: Verify integrated release candidate
        run: node scripts/verify-integrated-release.mjs

      - name: Cleanup Integrated Release fixtures
        if: always()
        run: node scripts/verify-integrated-release.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true

      - name: Upload Integrated Release screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-integrated-release-screenshots
          path: artifacts/release-*.png
          if-no-files-found: warn
          retention-days: 14

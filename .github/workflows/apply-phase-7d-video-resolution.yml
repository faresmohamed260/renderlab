name: Apply Phase 7D Video Resolution

on:
  push:
    branches:
      - work/phase-7d-video-resolution-v0-1
    paths:
      - .github/workflows/apply-phase-7d-video-resolution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct staging patch typo
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-phase-7d-video-resolution.py')
          text = path.read_text()
          text = text.replace("Audio on/);',", "Audio on/ });',")
          path.write_text(text)
          PY

      - name: Apply Phase 7D patch
        run: python scripts/apply-phase-7d-video-resolution.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify maintained UI primitives
        run: npm run verify:ui-purity

      - name: Build
        run: npm run build

      - name: Parse configured Video verifier
        run: node --check scripts/verify-video-generation.mjs

      - name: Finalize product commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-phase-7d-video-resolution.yml
          rm -f scripts/apply-phase-7d-video-resolution.py
          git diff --check
          git status --short
          git config user.name 'RenderLab Phase 7D Bot'
          git config user.email '121525183+faresmohamed260@users.noreply.github.com'
          git add src tests scripts .github/workflows
          git diff --cached --check
          git commit -m 'Implement Video quality resolution v0.1'
          git push origin HEAD:work/phase-7d-video-resolution-v0-1

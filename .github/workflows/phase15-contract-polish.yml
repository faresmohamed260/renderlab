name: Phase 15 Contract Polish

on:
  push:
    branches:
      - plan/phase15-control-maintenance-contract
    paths:
      - .github/workflows/phase15-contract-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contract branch
        uses: actions/checkout@v4
        with:
          ref: plan/phase15-control-maintenance-contract
          fetch-depth: 0

      - name: Remove stale roadmap-only wording
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('PROJECT.md'); s=p.read_text(); old='Phase 15 remains roadmap-only. Phase 14 does not add user-facing Cancel, a general maintenance sweeper, creative iteration features or a production rollout.'; new='Phase 15 now has an accepted execution contract but implementation has not started. Phase 14 itself did not add user-facing Cancel, a general maintenance sweeper, creative iteration features or a production rollout.'; assert old in s; p.write_text(s.replace(old,new))"

      - name: Validate Phase 15 contract markers
        shell: bash
        run: |
          grep -Fq '# Phase 15 Execution Contract — Generation Control & Maintenance' PROJECT.md
          grep -Fq 'CONTRACT ACCEPTED / IMPLEMENTATION NOT STARTED' PROJECT.md
          grep -Fq '## Cycle 3 Phase 15 — Generation Control & Maintenance' docs/ui/UI_MIGRATION.md
          grep -Fq '### UI-055 — Generation Cancel is serialized lifecycle control, not a provider shortcut' docs/ui/UI_DECISIONS.md
          grep -Fq '## Phase 15 planning boundary — Cancel and maintenance' docs/architecture/PRODUCT_CAPABILITIES.md
          grep -Fq '### Phase 15 pre-implementation control/maintenance audit — 2026-09-04' docs/architecture/INFRASTRUCTURE.md
          ! grep -Fq 'Phase 15 remains roadmap-only.' PROJECT.md

      - name: Commit polished contract
        shell: bash
        run: |
          rm .github/workflows/phase15-contract-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md .github/workflows/phase15-contract-polish.yml
          git commit -m 'Polish Phase 15 contract handoff'
          git push origin HEAD:plan/phase15-control-maintenance-contract

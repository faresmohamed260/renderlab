name: Phase 12 Integrated Verifier Preflight

on:
  push:
    branches: [work/phase-12-release-validation]
    paths:
      - ".github/workflows/tmp-phase12-integrated-preflight.yml"

permissions:
  contents: write

jobs:
  integrated-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_GENERATION_BACKEND_URL: http://127.0.0.1:3030
      RENDERLAB_GENERATION_BACKEND_TOKEN: phase12-release-integrated-token
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-12-release-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: node --check scripts/verify-release-integrated.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1
      - name: Verify corrected integrated release continuity
        run: node scripts/verify-release-integrated.mjs
      - name: Cleanup integrated fixtures
        if: always()
        run: node scripts/verify-release-integrated.mjs --cleanup-only
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true
      - name: Remove temporary preflight workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/phase-12-release-validation
          git checkout -B work/phase-12-release-validation origin/work/phase-12-release-validation
          rm .github/workflows/tmp-phase12-integrated-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-phase12-integrated-preflight.yml
          git diff --cached --check
          git commit -m 'chore: remove Phase 12 integrated preflight helper'
          git push origin HEAD:work/phase-12-release-validation

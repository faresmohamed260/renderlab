name: Phase 28 Admin verifier helper

on:
  push:
    branches:
      - work/phase-28-admin-system-continuity
    paths:
      - '.github/workflows/phase28-admin-verifier-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-28-admin-system-continuity
          fetch-depth: 0
      - name: Patch configured Admin verifier
        run: python scripts/phase28-patch-admin-verifier.py
      - name: Commit verifier and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/phase28-admin-verifier-helper.yml
          rm scripts/phase28-patch-admin-verifier.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-admin-operations.mjs .github/workflows/phase28-admin-verifier-helper.yml scripts/phase28-patch-admin-verifier.py
          git commit -m 'test: verify Phase 28 Admin system continuity'
          git push origin HEAD:work/phase-28-admin-system-continuity

name: Android SDK58 Emulator Runtime Proof (temporary / no distribution)
on:
  pull_request:
    paths:
      - .github/workflows/android-emulator-runtime-proof-temporary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      JAVA_TOOL_OPTIONS: "-Xmx3g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d1650
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact Expo SDK58 app
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Generate isolated emulator-only package and release-mode embedded JS
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const f='app.json', x=JSON.parse(fs.readFileSync(f,'utf8'));
          x.expo.android.package='dev.renderlab.emulatorproof';
          x.expo.name='RenderLab Emulator QA';
          x.expo.slug='renderlab-emulator-proof';
          fs.writeFileSync(f,JSON.stringify(x,null,2));
          NODE
          npx expo prebuild --platform android --no-install --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -F assets/index.android.bundle
      - name: Sign only temporary emulator APK with ephemeral nonrelease key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/emulator-qa.jks" -alias qa -storepass emulatorqa -keypass emulatorqa -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Temporary Android QA"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/emulator-qa.jks" --ks-key-alias qa --ks-pass pass:emulatorqa --key-pass pass:emulatorqa apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Boot isolated Android x86_64 emulator, install and exercise existing tab controls
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n renderlab-qa -k "system-images;android-35;google_apis;x86_64" --force
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          emulator -avd renderlab-qa -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          READY=0
          for i in $(seq 1 100); do
            if test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1; then READY=1; break; fi
            sleep 3
          done
          test "$READY" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          adb logcat -c
          adb shell am start -W -n dev.renderlab.emulatorproof/.MainActivity
          sleep 18
          PID="$(adb shell pidof dev.renderlab.emulatorproof | tr -d '\r')"
          test -n "$PID"
          echo "PASS: standalone Android process running (PID $PID), no Metro."
          adb shell input tap 200 2260
          sleep 2
          adb shell input tap 560 2260
          sleep 2
          adb shell input tap 900 2260
          sleep 2
          test -n "$(adb shell pidof dev.renderlab.emulatorproof | tr -d '\r')"
          if adb logcat -d -t 4000 | grep -E 'FATAL EXCEPTION|ReactNativeJS: Error:|Unable to load script from assets'; then
            echo "FAIL: native crash or JS runtime error found"
            exit 1
          fi
          echo "PASS: app survived tab-touch smoke and no fatal JS/native crash found."
          # No screenshot, no APK artifact, no release keystore retained.
          rm -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/emulator-qa.jks"

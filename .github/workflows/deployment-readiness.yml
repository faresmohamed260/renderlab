name: Deployment Readiness

# Non-deploying guard for the explicit RenderLab production rollout and Vercel environment contract.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "next.config.ts"
      - "package.json"
      - "scripts/verify-vercel-env.mjs"
      - "src/lib/config/runtime-env.ts"
      - "docs/operations/PRODUCTION_ENV_REQUIRED_NAMES.json"
      - "proxy.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - ".github/workflows/deployment-readiness.yml"
  pull_request:
    paths:
      - "vercel.json"
      - "next.config.ts"
      - "package.json"
      - "scripts/verify-vercel-env.mjs"
      - "src/lib/config/runtime-env.ts"
      - "docs/operations/PRODUCTION_ENV_REQUIRED_NAMES.json"
      - "proxy.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - ".github/workflows/deployment-readiness.yml"

permissions:
  contents: read

concurrency:
  group: renderlab-deployment-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify explicit Vercel deployment contract
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const config = JSON.parse(fs.readFileSync("vercel.json", "utf8"));

          if (config.framework !== "nextjs") {
            throw new Error(`Expected vercel.json framework=nextjs, got ${JSON.stringify(config.framework)}`);
          }

          if (config.git?.deploymentEnabled !== false) {
            throw new Error("Automatic Vercel Git deployments must remain disabled.");
          }

          if (Object.hasOwn(config, "outputDirectory")) {
            throw new Error("Next.js deployment must use the framework-managed output; do not force outputDirectory.");
          }

          console.log("Vercel deployment contract is explicit, Next.js-native, and non-automatic.");
          EOF

      - name: Verify Vercel environment preflight
        env:
          VERCEL: "1"
          VERCEL_ENV: "production"
          RENDERLAB_GENERATION_GATEWAY_URL: "https://faresmohamed260-main--renderlab-generation-gateway-web.us-east.modal.run"
          RENDERLAB_FIBO_GENERATION: "1"
          RENDERLAB_FIBO_MODAL_KEY: "offline-fixture-modal-key"
          RENDERLAB_FIBO_MODAL_SECRET: "offline-fixture-modal-secret"
          RENDERLAB_CLOSED_BETA_ACCESS_ENFORCEMENT_ENABLED: "true"
          RENDERLAB_FIBO_MASK_ENABLED: "true"
          SUPABASE_URL: "https://rashyleshocuvpgcooxy.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "test-publishable-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          CLOUDFLARE_R2_ACCOUNT_ID: "test-account"
          CLOUDFLARE_R2_ACCESS_KEY_ID: "test-access-key"
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: "test-secret-key"
          CLOUDFLARE_R2_BUCKET: "test-bucket"
          RESEND_API_KEY: "re_test_renderlab"
          CRON_SECRET: "renderlab-test-cron-secret-fixture-0001"
          RENDERLAB_GENERATION_RECONCILER_SECRET: "renderlab-test-reconciler-secret-0001"
        run: node scripts/verify-vercel-env.mjs

      - name: Build production application with Vercel contract
        env:
          VERCEL: "1"
          SUPABASE_URL: "https://rashyleshocuvpgcooxy.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "test-publishable-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          CLOUDFLARE_R2_ACCOUNT_ID: "test-account"
          CLOUDFLARE_R2_ACCESS_KEY_ID: "test-access-key"
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: "test-secret-key"
          CLOUDFLARE_R2_BUCKET: "test-bucket"
          RESEND_API_KEY: "re_test_renderlab"
          CRON_SECRET: "renderlab-test-cron-secret-fixture-0001"
          RENDERLAB_GENERATION_RECONCILER_SECRET: "renderlab-test-reconciler-secret-0001"
        run: npm run build

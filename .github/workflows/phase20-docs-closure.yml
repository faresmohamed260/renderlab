name: Phase 20 documentation closure

on:
  push:
    branches:
      - work/phase-20-create-instrument
    paths:
      - .github/workflows/phase20-docs-closure.yml
      - .github/scripts/phase20-docs-closure.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-20-create-instrument
          fetch-depth: 0
      - name: Guard exact staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "829bd4e01aa7e5e78fe522712d95465dcb3c9808"
          test "$(git rev-parse HEAD^^)" = "b7358da8f71fd789249515fca87ed01a64789f5f"
      - name: Update authoritative Phase 20 docs
        run: python .github/scripts/phase20-docs-closure.py
      - name: Commit closure and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/phase20-docs-closure.yml .github/scripts/phase20-docs-closure.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/INFRASTRUCTURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close Phase 20 and record REDGraft recovery"
          git push origin HEAD:work/phase-20-create-instrument

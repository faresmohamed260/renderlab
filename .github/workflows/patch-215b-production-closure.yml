name: Patch 215B Production Closure

on:
  push:
    branches:
      - docs/close-215-free-screening-production
    paths:
      - scripts/patch-215b-production-closure.py
      - .github/workflows/patch-215b-production-closure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-215-free-screening-production
          fetch-depth: 1
      - name: Patch authoritative closure docs
        run: python scripts/patch-215b-production-closure.py
      - name: Remove temporary helpers
        run: |
          rm scripts/patch-215b-production-closure.py
          rm .github/workflows/patch-215b-production-closure.yml
      - name: Validate closure docs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '#215 is complete, verified and production-live.' docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md
          grep -F 'dpl_44guHU58EZvh9mPfE6bAVfUtHZvh' PROJECT.md
          grep -F 'Stage 4 — #215B free-screening closure — completed and verified 2026-09-14' docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md
          grep -F '#215B free compromised-password screening production rollout — 2026-09-14' docs/architecture/INFRASTRUCTURE.md
      - name: Commit closure docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md docs/architecture/INFRASTRUCTURE.md scripts/patch-215b-production-closure.py .github/workflows/patch-215b-production-closure.yml
          git commit -m "docs: close #215 auth hardening"
          git push origin HEAD:docs/close-215-free-screening-production

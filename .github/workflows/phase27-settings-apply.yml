          python <<'PY'
          from pathlib import Path
          
          path = Path('scripts/verify-account-identity.mjs')
          text = path.read_text()
          text = text.replace('name: "Sign out", exact: true', 'name: "Sign out everywhere", exact: true')
          text = text.replace('Signed-in Settings is missing Sign out.', 'Signed-in Settings is missing Sign out everywhere.')
          text = text.replace('Narrow Settings Sign out"', 'Narrow Settings Sign out everywhere"')
          text = text.replace('Suspended Settings Sign out"', 'Suspended Settings Sign out everywhere"')
          
          active_wait = '  await page.getByText("Active", { exact: true }).waitFor({ state: "visible" });\n'
          active_assertions = active_wait + (
              '  assert(await page.getByText("Sign-in email", { exact: true }).isVisible(), "Signed-in Settings is missing Sign-in email framing.");\n'
              '  assert(await page.getByText("Ends RenderLab sessions on every device and browser.", { exact: true }).isVisible(), "Signed-in Settings is missing global sign-out scope copy.");\n'
          )
          if active_wait not in text:
              raise SystemExit('Could not find initial Active wait for Phase 27 verifier update.')
          text = text.replace(active_wait, active_assertions, 1)
          
          recovery_heading = '  await recoveryPage.getByRole("heading", { name: "Set a new password", exact: true }).waitFor({ state: "visible", timeout: 30_000 });\n'
          recovery_assertion = recovery_heading + '  await recoveryPage.getByText("Verified recovery link", { exact: true }).waitFor({ state: "visible" });\n'
          if recovery_heading not in text:
              raise SystemExit('Could not find recovery heading for Phase 27 verifier update.')
          text = text.replace(recovery_heading, recovery_assertion, 1)
          
          path.write_text(text)
          PY
          

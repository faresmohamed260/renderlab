name: Apply Create composer and shell cleanup

on:
  push:
    branches: [work/create-composer-shell-cleanup]
    paths:
      - ".github/workflows/apply-create-composer-shell-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: a8b2bae466fe5b30f2668ceb9eaf562adbbd4d77
      BRANCH: work/create-composer-shell-cleanup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"

      - name: Apply bounded UI corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/shell/app-shell.tsx",
              '  const title = routeTitle(pathname);\n  const section = routeSection(pathname);',
              '  const title = routeTitle(pathname);\n  const section = routeSection(pathname);\n  const hideDesktopTopBar = section === "/create";',
          )
          replace_once(
              "src/components/shell/app-shell.tsx",
              '          className="kinetic-glass kinetic-topbar sticky top-3 z-30 mx-3 mt-3 flex h-14 items-center rounded-2xl border px-4 sm:px-6 lg:ml-0"',
              '          className={cn(\n            "kinetic-glass kinetic-topbar sticky top-3 z-30 mx-3 mt-3 flex h-14 items-center rounded-2xl border px-4 sm:px-6 lg:ml-0",\n            hideDesktopTopBar && "lg:hidden",\n          )}',
          )

          replace_once(
              "src/app/globals.css",
              '.kinetic-composer > * {\n  position: relative;\n  z-index: 1;\n}\n\n.kinetic-composer:focus-within {',
              '.kinetic-composer > * {\n  position: relative;\n  z-index: 1;\n}\n\n.kinetic-composer [data-slot="textarea"]:focus-visible {\n  outline: none;\n}\n\n.kinetic-composer:focus-within {',
          )

          replace_once(
              "tests/ui/shell.spec.ts",
              '  await expect(page.getByRole("link", { name: "Library", exact: true }).first()).toBeVisible();\n  await expect(page.getByRole("heading", { name: "Create", exact: true })).toBeVisible();\n  await expect(page.getByRole("textbox", { name: "Prompt" })).toBeVisible();',
              '  await expect(page.getByRole("link", { name: "Library", exact: true }).first()).toBeVisible();\n  await expect(page.locator(\'[data-kinetic-surface="topbar"]\')).toBeHidden();\n  await expect(page.getByRole("textbox", { name: "Prompt" })).toBeVisible();',
          )

          replace_once(
              "tests/ui/kinetic-shell.spec.ts",
              '  await expect(shell).toBeVisible();\n  await expect(rail).toBeVisible();\n  await expect(topbar).toBeVisible();\n  await expectDimensionalSurface(rail);\n  await expectDimensionalSurface(topbar);',
              '  await expect(shell).toBeVisible();\n  await expect(rail).toBeVisible();\n  await expect(topbar).toBeHidden();\n  await expectDimensionalSurface(rail);',
          )
          replace_once(
              "tests/ui/kinetic-shell.spec.ts",
              '  await expect(page.getByRole("link", { name: "Library", exact: true })).toHaveAttribute("aria-current", "page");\n  await expect(shell).toBeVisible();\n  await expectNoHorizontalOverflow(page);',
              '  await expect(page.getByRole("link", { name: "Library", exact: true })).toHaveAttribute("aria-current", "page");\n  await expect(shell).toBeVisible();\n  await expect(topbar).toBeVisible();\n  await expectDimensionalSurface(topbar);\n  await expectNoHorizontalOverflow(page);',
          )

          replace_once(
              "tests/ui/create.spec.ts",
              '  await expect(page.getByRole("textbox", { name: "Prompt" })).toBeVisible();\n  await expect(page.getByRole("radiogroup", { name: "Output type" })).toBeVisible();',
              '  const prompt = page.getByRole("textbox", { name: "Prompt" });\n  const composer = page.locator(\'[data-create-instrument="true"]\');\n  await expect(prompt).toBeVisible();\n  await prompt.focus();\n  await expect(prompt).toHaveCSS("outline-style", "none");\n  expect(await composer.evaluate((element) => element.matches(":focus-within"))).toBeTruthy();\n  await expect(page.getByRole("radiogroup", { name: "Output type" })).toBeVisible();',
          )
          replace_once(
              "tests/ui/create.spec.ts",
              '  await page.getByRole("textbox", { name: "Prompt" }).fill("A quiet futuristic coastal city at blue hour");',
              '  await prompt.fill("A quiet futuristic coastal city at blue hour");',
          )
          PY
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify UI purity
        run: npm run verify:ui-purity

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git restore -- next-env.d.ts 2>/dev/null || true
          git rm .github/workflows/apply-create-composer-shell-cleanup.yml
          git add src/components/shell/app-shell.tsx src/app/globals.css tests/ui/shell.spec.ts tests/ui/kinetic-shell.spec.ts tests/ui/create.spec.ts
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/apply-create-composer-shell-cleanup.yml \
            src/app/globals.css \
            src/components/shell/app-shell.tsx \
            tests/ui/create.spec.ts \
            tests/ui/kinetic-shell.spec.ts \
            tests/ui/shell.spec.ts | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Create composer focus and redundant desktop chrome"
          git push origin HEAD:"$BRANCH"

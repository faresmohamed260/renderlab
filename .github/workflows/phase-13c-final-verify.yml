name: Phase 13C Final No-Send Verification

on:
  push:
    branches:
      - work/phase-13c-email-templates
    paths:
      - .github/workflows/phase-13c-final-verify.yml
      - .github/phase13c_final_verify.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SUPABASE_PROJECT_REF: rashyleshocuvpgcooxy
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SITE_URL: https://renderlab.faresuniform.uk
      SENDER_DOMAIN: mail.renderlab.faresuniform.uk
      FROM_EMAIL: noreply@mail.renderlab.faresuniform.uk
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "587"
      AUTH_EMAIL_RATE_LIMIT: "30"
      INVITE_SUBJECT: "You're invited to RenderLab"
      RECOVERY_SUBJECT: "Reset your RenderLab password"
    steps:
      - uses: actions/checkout@v4
      - name: Verify live 13C contract without sending mail
        run: python .github/phase13c_final_verify.py

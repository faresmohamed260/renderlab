name: Full UI Redesign Production Rollout Docs Helper

on:
  push:
    branches: [docs/full-ui-redesign-production-rollout-20260914]
    paths:
      - ".github/workflows/full-ui-redesign-production-rollout-docs-helper.yml"

permissions:
  contents: write

jobs:
  patch_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/full-ui-redesign-production-rollout-20260914

      - name: Patch rollout docs
        run: python .github/scripts/full-ui-redesign-production-rollout-docs.py

      - name: Commit rollout docs and remove helper
        run: |
          rm .github/workflows/full-ui-redesign-production-rollout-docs-helper.yml .github/scripts/full-ui-redesign-production-rollout-docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: record completed UI redesign production rollout"
          git push origin HEAD:docs/full-ui-redesign-production-rollout-20260914

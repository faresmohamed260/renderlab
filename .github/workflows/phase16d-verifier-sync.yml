name: Phase 16D Verifier Sync

on:
  push:
    branches: [noop]
    paths:
      - ".github/phase16d-verifier-patch.py"
      - ".github/workflows/phase16d-verifier-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: work/phase-16-creative-iteration
      EXPECTED_HEAD: 6a524ac3e6246a0353c8bb7e02b2646ca65d0bef
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0
      - name: Preserve patch helper
        run: cp .github/phase16d-verifier-patch.py /tmp/phase16d-verifier-patch.py
      - name: Patch and statically verify Phase 16D verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python /tmp/phase16d-verifier-patch.py
          git diff --check
          node --check scripts/verify-creative-iteration.mjs
          npm install --no-audit --no-fund
          npm run build
          npm run verify:ui-purity
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add scripts/verify-creative-iteration.mjs
          git commit -m "Verify Phase 16D Viewer comparison contract"
          git push origin HEAD:"$TARGET_BRANCH"

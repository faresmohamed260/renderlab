name: Phase 22 implementation apply

on:
  push:
    branches:
      - work/phase-22-system-cohesion
    paths:
      - ".github/workflows/phase22-implement-cohesion.yml"

permissions:
  contents: write

concurrency:
  group: renderlab-phase22-implementation-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-22-system-cohesion
          fetch-depth: 0

      - name: Validate staging script syntax
        run: |
          python -m py_compile scripts/phase22-implement-cohesion.py
          rm -rf scripts/__pycache__

      - name: Apply guarded Phase 22 implementation
        run: python scripts/phase22-implement-cohesion.py

      - name: Restore workflow and staging files for connector-owned cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            .github/workflows/activity-visual.yml \
            .github/workflows/activity-cancel-visual.yml \
            .github/workflows/account-identity-visual.yml \
            .github/workflows/phase22-implement-cohesion.yml \
            scripts/phase22-implement-cohesion.py
          rm -rf scripts/__pycache__

      - name: Validate durable product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check scripts/verify-brand-launch.mjs
          if ! git diff --quiet -- src/server src/lib/supabase supabase package.json package-lock.json; then
            echo "::error::Phase 22 presentation patch changed prohibited backend/auth/schema/dependency paths."
            git diff -- src/server src/lib/supabase supabase package.json package-lock.json
            exit 1
          fi
          if ! git diff --quiet -- .github/workflows scripts/phase22-implement-cohesion.py; then
            echo "::error::Executor left workflow/staging mutations in the Actions-owned commit."
            git diff -- .github/workflows scripts/phase22-implement-cohesion.py
            exit 1
          fi

      - name: Commit and push durable implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Phase 22 system cohesion surfaces"
          git push origin HEAD:work/phase-22-system-cohesion

      - name: Remove temporary setup branches
        if: success()
        shell: bash
        run: |
          git push origin --delete tmp/phase22-noop || true
          git push origin --delete work/phase-22-system-cohesion-run || true

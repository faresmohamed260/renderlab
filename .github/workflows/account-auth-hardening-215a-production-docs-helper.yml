name: Account Auth Hardening 215A Production Docs Helper

on:
  push:
    branches:
      - docs/account-auth-hardening-215a-production-rollout
    paths:
      - ".github/workflows/account-auth-hardening-215a-production-docs-helper.yml"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch authoritative production records
        run: node scripts/reconcile-215a-production-rollout.mjs

      - name: Validate and commit docs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm scripts/reconcile-215a-production-rollout.mjs
          rm .github/workflows/account-auth-hardening-215a-production-docs-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/architecture/ACCOUNT_SETTINGS_CAPABILITY_ROADMAP.md docs/architecture/AUTH_EMAIL_SECURITY_HARDENING_IMPLEMENTATION_CONTRACT.md docs/architecture/INFRASTRUCTURE.md scripts/reconcile-215a-production-rollout.mjs .github/workflows/account-auth-hardening-215a-production-docs-helper.yml
          git diff --cached --check
          git commit -m "docs: record #215A production rollout"
          git push origin HEAD:docs/account-auth-hardening-215a-production-rollout

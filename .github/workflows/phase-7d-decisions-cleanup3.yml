name: Phase 7D Contract Cleanup 3

on:
  push:
    branches:
      - plan/phase-7d-video-resolution-contract

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact decision history and finalize post-merge handoff wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          base = subprocess.check_output(
              ["git", "show", "origin/main:docs/ui/UI_DECISIONS.md"],
              text=True,
          ).rstrip()
          addition = '''### UI-048 — Video resolution is contextual and 480p remains the default
          **Status:** Accepted
          **Decision:** Phase 7D exposes exactly `480p`, `720p`, `1080p` and `2K` as a Video-only **Resolution** setting inside the existing compact Video settings Dropdown Menu. `480p` remains the default; disabled `4K` stays hidden and server-rejected. Canonical Video intent carries `output.resolution` and persists it explicitly after server normalization. Video Steps/Guidance are removed from the product surface and rejected on new Video requests because the deployed REDGraft contract does not expose `steps`/`cfg`; Image Steps/Guidance remain unchanged.
          **Reason:** Live audit `33266905978` verifies the four enabled resolution classes, a live `480p` gateway default, and no active Video `steps`/`cfg`. Phase 6 proved one bounded 720p generation, but higher-mode latency/capacity/cost evidence is not exhaustive and provider cost/deployment-wide capacity are not reliably observable. Calling the control `Quality` or silently raising the default would imply guarantees the product cannot currently support.
          **Consequences:** The Video settings trigger summarizes the current resolution + duration, while the menu orders Resolution, Duration, Audio and Advanced. Video Advanced retains only negative prompt, seed and frame rate. Resolution composes with all curated fixed Video ratios and source-backed Animate `Original`, duration, 24/25/30 fps and Audio without changing durable source media. The existing maintained Button/DropdownMenu/Collapsible/Field/Input/NativeSelect layer is reused; no new generic primitive, route, model/provider selector, schema or infrastructure surface is introduced. Historical jobs are not backfilled; future Retry revalidates current capability, treats legacy missing Video resolution as 480p and does not replay legacy inactive Video Steps/Guidance. Implementation requires the exact configured server/live/output/responsive/reduced-motion matrix recorded in `UI_MIGRATION.md`. This decision does not authorize deployment and does not close the separate Phase 7A premium-interaction exit item.'''
          if any(line.endswith(" ") for line in addition.splitlines()):
              raise SystemExit("UI-048 addition contains trailing whitespace")
          Path("docs/ui/UI_DECISIONS.md").write_text(base + "\n\n" + addition + "\n")

          migration = Path("docs/ui/UI_MIGRATION.md")
          text = migration.read_text()
          old_execution = '**Execution status:** `NOT STARTED` — this contract must merge before implementation begins. Contract acceptance does not authorize deployment.'
          new_execution = '**Execution status:** `NOT STARTED` — this contract merge establishes the Phase 7D implementation boundary; no Phase 7D code or deployment is included.'
          if text.count(old_execution) != 1:
              raise SystemExit("Phase 7D execution-status marker changed")
          text = text.replace(old_execution, new_execution)

          old_gate = '**Current gate:** Merge this Phase 7D execution-ready contract before implementation. After merge, implementation must follow UI-048 exactly: Resolution (not Quality), 480p default, verified 480p/720p/1080p/2K only, canonical `output.resolution`, inactive Video Steps/Guidance removed/rejected, bounded contextual live-output review, and no provider/ComfyUI/deployment scope drift.'
          new_gate = '**Current gate:** With the Phase 7D contract merged, the next authorized work is Phase 7D implementation from UI-048: Resolution (not Quality), 480p default, verified 480p/720p/1080p/2K only, canonical `output.resolution`, inactive Video Steps/Guidance removed/rejected, bounded contextual live-output review, and no provider/ComfyUI/deployment scope drift.'
          if text.count(old_gate) != 1:
              raise SystemExit("Phase 7D current-gate marker changed")
          text = text.replace(old_gate, new_gate)
          migration.write_text(text)
          PY

      - name: Commit final docs-only contract candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "renderlab-doc-bot"
          git config user.email "renderlab-doc-bot@users.noreply.github.com"
          git rm .github/workflows/phase-7d-decisions-cleanup.yml .github/workflows/phase-7d-decisions-cleanup2.yml .github/workflows/phase-7d-decisions-cleanup3.yml
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/PRODUCT_CAPABILITIES.md
          git diff --cached --check origin/main -- PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/PRODUCT_CAPABILITIES.md
          git diff --cached --stat origin/main -- PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/architecture/PRODUCT_CAPABILITIES.md
          git commit -m "Finalize Phase 7D contract candidate"
          git push origin HEAD:plan/phase-7d-video-resolution-contract

name: Upscale Worker Validation

on:
  pull_request:
    paths:
      - "workers/image-upscale/**"
      - ".github/workflows/upscale-worker-validation.yml"
  push:
    branches:
      - main
      - work/phase-18-image-upscale
    paths:
      - "workers/image-upscale/**"
      - ".github/workflows/upscale-worker-validation.yml"

permissions:
  contents: read

concurrency:
  group: renderlab-upscale-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify worker syntax and contract
        run: python3 workers/image-upscale/verify_worker.py

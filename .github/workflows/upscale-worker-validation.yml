name: Upscale Worker Validation

on:
  pull_request:
    paths:
      - "workers/image-upscale/**"
      - ".github/workflows/upscale-worker-validation.yml"
  push:
    branches:
      - main
      - work/phase-18-image-upscale
    paths:
      - "workers/image-upscale/**"
      - ".github/workflows/upscale-worker-validation.yml"

permissions:
  contents: read

concurrency:
  group: renderlab-upscale-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify worker syntax and contract
        run: python3 workers/image-upscale/verify_worker.py

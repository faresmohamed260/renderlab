name: Admin v0.2 shell icon fix

on:
  push:
    branches:
      - rd/phase-28-admin-system-continuity-v02
    paths:
      - '.github/workflows/admin-v02-shell-icon-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rd/phase-28-admin-system-continuity-v02
      - name: Reuse the production Activity glyph and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('design/prototypes/admin-system-continuity-v02/index.html')
          s = p.read_text()
          old = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/><path d="M12 7v5l3 2"/></svg>'
          new = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>'
          if old not in s:
              raise SystemExit('expected Activity glyph fixture not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/admin-v02-shell-icon-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- design/prototypes/admin-system-continuity-v02/index.html .github/workflows/admin-v02-shell-icon-fix.yml
          git commit -m "design: reuse production Activity glyph in Admin R&D"
          git push origin HEAD:rd/phase-28-admin-system-continuity-v02

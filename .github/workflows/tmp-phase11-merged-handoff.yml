name: Phase 11 merged handoff

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-phase11-merged-handoff.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply handoff patch
        run: python scripts/tmp-phase11-merged-handoff.py
      - name: Validate and commit
        shell: bash
        run: |
          rm scripts/tmp-phase11-merged-handoff.py
          rm .github/workflows/tmp-phase11-merged-handoff.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-phase11-merged-handoff.yml PROJECT.md design/penpot/README.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/ui/COMPONENT_CATALOG.md docs/ui/SCREEN_REGISTRY.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md scripts/tmp-phase11-merged-handoff.py | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record verified Phase 11 merge"
          git push origin HEAD:main

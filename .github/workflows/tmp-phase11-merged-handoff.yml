name: Temporary Phase 11 merged handoff finalizer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-phase11-merged-handoff.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile Phase 11 merged-main documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          MERGE = "46c5daa2866c6758907ee9be219bcb3cb274ca83"
          FINAL = "773251734dbd5c5f32770699a57b1ade653604b5"
          UI_SHELL = "33323421285"
          ART = "9734984885"
          DIG = "sha256:8d9929fb5f6d85da4710184ec7bbe756f782593f58525ec2ae660729ad3b32a9"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def regex_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 replacement, got {count}")
              return updated

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 literal match, got {count}")
              return text.replace(old, new, 1)

          # PROJECT.md
          path = "PROJECT.md"
          text = read(path)
          text = regex_once(
              text,
              r"## Current Priority\n\*\*.*?\*\*\n\n### Cycle 2 objective",
              f"""## Current Priority
**Cycle 2 — Creative Productivity & Beta Maturity. Phases 6–11 are complete and verified. Phase 11 Brand & Launch Experience merged through PR #73 as `{MERGE}` under UI-052. Final exact PR head `{FINAL}` passed all 19 affected workflows; the reviewed Brand / Launch artifact `{ART}` was human-reviewed clean; merged-main UI Shell `{UI_SHELL}` passed; and the live Supabase fixture audit returned zero RenderLab fixture Auth/access/generation/media/upload/invitation rows. Phase 12 is the next roadmap slice but has not started. Broader-beta Auth email/template/leaked-password blockers remain explicitly open. No deployment is authorized.**

### Cycle 2 objective""",
              "PROJECT current priority",
              re.S,
          )
          text = regex_once(
              text,
              r"^- \*\*Phase 11 — Brand & Launch Experience:.*$",
              f"- **Phase 11 — Brand & Launch Experience: COMPLETE / VERIFIED under UI-052.** PR #73 merged as `{MERGE}`. Final exact PR head `{FINAL}` passed 19/19 affected workflows; Brand / Launch artifact `{ART}` (`{DIG}`) was human-reviewed clean; merged-main UI Shell `{UI_SHELL}` passed; live Supabase fixture residue audit returned zero across Auth/access/generation/admission/media/upload/invitation fixtures. No deployment occurred or is authorized.",
              "PROJECT Phase 11 roadmap",
              re.M,
          )
          text = regex_once(
              text,
              r"(### Phase 11 execution contract — expanded 2026-08-30\n)\*\*Status:.*?\*\*",
              r"\1**Status: `COMPLETE / VERIFIED` under UI-052. PR #73 merged to `main`; exact-head PR validation, required human rendered review, merged-main regression, and live fixture-residue audit are complete. No deployment occurred.**",
              "PROJECT Phase 11 status",
              re.S,
          )
          handoff = f"""**Verified merged-main handoff — 2026-08-30**
- PR #73 merged to authoritative `main` as `{MERGE}` from exact final PR head `{FINAL}`.
- Final PR head `{FINAL}` passed **19/19 affected workflows**, including Library Lifecycle `33323168930`, Generation Admission `33323168949`, Account/Admin Operations `33323168964`, UI Shell `33323168937` and Brand / Launch Visual `33323168926`.
- Reviewed implementation artifact `{ART}` (`renderlab-brand-launch-screenshots`, `{DIG}`) remains the human-approved Brand / Launch checkpoint: desktop/narrow landing hierarchy, `/create` AppShell, legacy continuation and small-scale mark were clean.
- Merged-main push regression UI Shell `{UI_SHELL}` passed on `{MERGE}`. GitHub scheduled no other push workflow for that merge SHA.
- Live Supabase residue audit after merge returned **0** fixture Auth users, RenderLab account-access rows, generation jobs, generation sources, admission reservations, media assets, media collections/items, media upload sessions and invitations.
- `main` now authoritatively serves public Brand / Landing at `/`, Create at `/create`, and the remaining application routes under `(app)` / `AppShell`, with legacy root continuation preserved.
- Phase 11 changed no Supabase schema/Auth policy/admission default/R2/provider/billing/deployment boundary. Production Closed Beta enforcement and Phase 10 broader-beta Auth blockers remain as separately documented.
- Phase 12 implementation has **not** started. No deployment is authorized by this Phase 11 completion.

**Goal / user value**"""
          text = regex_once(
              text,
              r"\*\*Current verified implementation handoff — 2026-08-30\*\*.*?\*\*Goal / user value\*\*",
              handoff,
              "PROJECT merged handoff",
              re.S,
          )
          write(path, text)

          # UI_MIGRATION.md
          path = "docs/ui/UI_MIGRATION.md"
          text = read(path)
          text = regex_once(
              text,
              r"(### Phase 11 — Brand & Launch Experience\n)\*\*Contract status:\*\*.*$",
              f"\\1**Contract status:** `COMPLETE / VERIFIED` under UI-052. Contract merged as `37c0ee922792244ffdf2e3887db08cecc3eab97d`; implementation PR #73 merged as `{MERGE}` after final exact head `{FINAL}` passed 19/19 affected workflows and required human review. Merged-main UI Shell `{UI_SHELL}` and zero-residue Supabase audit passed. No deployment occurred.",
              "UI_MIGRATION Phase 11 status",
              re.M,
          )
          migration_handoff = f"""#### Verified merged-main handoff — 2026-08-30
- [x] PR #73 merged to `main` as `{MERGE}` from exact final head `{FINAL}`.
- [x] Final exact head `{FINAL}` passed all **19/19 affected PR workflows**, including Library Lifecycle `33323168930`, Generation Admission `33323168949` and Account/Admin Operations `33323168964`.
- [x] Brand / Launch artifact `{ART}` (`{DIG}`) was human-reviewed clean for desktop/narrow landing, `/create` AppShell, small-scale brand treatment and legacy continuation.
- [x] Merged-main UI Shell `{UI_SHELL}` passed on merge SHA `{MERGE}`; no other push workflow was scheduled for that merge SHA.
- [x] Live Supabase post-merge residue audit returned zero fixture Auth users, account-access rows, generation jobs/sources/admission reservations, media assets/collections/items/upload sessions and invitations.
- [x] `/` is now the authoritative public Brand / Landing route on `main`; `/create` is the authoritative Create workspace under `AppShell`; other application public URLs remain unchanged.
- [x] No schema/Auth policy/admission-default/R2/provider/billing/deployment change occurred in Phase 11.
- [x] Phase 11 is complete/verified. Phase 12 remains unstarted and requires its own execution-ready contract/validation sequence before implementation or any separately authorized production rollout.

#### Locked product / IA boundary"""
          text = regex_once(
              text,
              r"#### Current verified implementation handoff — 2026-08-30.*?#### Locked product / IA boundary",
              migration_handoff,
              "UI_MIGRATION merged handoff",
              re.S,
          )
          current_work = f"""## Current Work
**Current cycle:** Cycle 2 — Creative Productivity & Beta Maturity is in progress; Phases 6–11 are complete/verified.
**Current phase status:** Phase 11 — Brand & Launch Experience is `COMPLETE / VERIFIED` under UI-052 and merged to `main` as `{MERGE}`.
**Next sequence:** Phase 12 — Cycle 2 Release Validation is the next roadmap slice, but implementation has not started. Before substantial Phase 12 work, expand/verify its execution-ready contract from current `main` and current production/infrastructure evidence.
**Verified Phase 11 gate:** exact PR head `{FINAL}` passed 19/19 affected workflows; Brand / Launch artifact `{ART}` was human-reviewed clean; merged-main UI Shell `{UI_SHELL}` passed; live Supabase fixture residue audit returned zero.
**Completed Cycle 2:** Phase 6 baseline/hardening → Phase 7 Create v2 → Phase 8 Library v2 → Phase 9 Activity Retry v0.1 → Phase 10 Account/Admin/Closed-Beta Operations → Phase 11 Brand & Launch Experience.
**Deployment boundary:** no deployment occurred or is authorized by Phase 11 completion. Any production rollout remains a separate explicit user-authorized operation.
**Post-Cycle-2 accepted direction:** LoRA/model-adapter library and selection from external ecosystems such as Civitai/Hugging Face, with compatibility/source/license/cache/admin/safety/strength contracts defined before implementation.
**Persistent scope boundary:** Models/Workflows remain non-destinations for ordinary users; ComfyUI nodes/provider routing stay internal. Trash/restore, safe cancellation productization, billing and cross-page selection still require their own evidence/decisions.

## Session Handoff Rule"""
          text = regex_once(
              text,
              r"## Current Work\n.*?## Session Handoff Rule",
              current_work,
              "UI_MIGRATION Current Work",
              re.S,
          )
          write(path, text)

          # SCREEN_REGISTRY.md
          path = "docs/ui/SCREEN_REGISTRY.md"
          text = read(path)
          text = replace_once(
              text,
              "Cycle 2 includes the privileged Admin surface at `/admin` under UI-051. PR #73 implements UI-052's public **Brand/Landing** at `/` and authoritative Create workspace at `/create`; `main` adopts that routing when the verified PR merges.",
              f"Cycle 2 includes the privileged Admin surface at `/admin` under UI-051. UI-052's public **Brand/Landing** at `/` and authoritative Create workspace at `/create` are merged on `main` through PR #73 / `{MERGE}`.",
              "SCREEN_REGISTRY IA",
          )
          text = replace_once(
              text,
              "**Status:** APPROVED on validated PR #73 implementation; pending merge to `main`",
              "**Status:** APPROVED and merged on `main`",
              "SCREEN_REGISTRY Brand status",
          )
          text = replace_once(
              text,
              f"**Approval evidence:** validated head `8975b7b42b518eea0a462b28528ddd41d90ad986` passed 19/19 affected workflows. Brand / Launch Visual `33321365147` artifact `{ART}` (`{DIG}`) was human-reviewed clean at 1440×1100, 390×844, `/create` shell and legacy-continuation states.",
              f"**Approval evidence:** validated implementation head `8975b7b42b518eea0a462b28528ddd41d90ad986` and final PR head `{FINAL}` each closed the 19-workflow affected gate; artifact `{ART}` (`{DIG}`) was human-reviewed clean at 1440×1100, 390×844, `/create` shell and legacy-continuation states. PR #73 merged as `{MERGE}` and merged-main UI Shell `{UI_SHELL}` passed.",
              "SCREEN_REGISTRY Brand evidence",
          )
          write(path, text)

          # FRONTEND_ARCHITECTURE.md
          path = "docs/architecture/FRONTEND_ARCHITECTURE.md"
          text = read(path)
          text = replace_once(
              text,
              "PR #73 implements the UI-052 routing boundary shown above; the application branch is verified and `main` adopts it when the PR merges:",
              f"PR #73 merged the verified UI-052 routing boundary shown above to `main` as `{MERGE}`:",
              "FRONTEND Phase 11 intro",
          )
          text = replace_once(
              text,
              "On validated PR #73 head `8975b7b42b518eea0a462b28528ddd41d90ad986`, `/` is Landing and `/create` is Create; all 19 affected workflows and required rendered review passed. `main` retains its pre-merge route state only until the guarded PR merge. No deployment follows from that merge.",
              f"On `main` merge `{MERGE}`, `/` is Landing and `/create` is Create. Final PR head `{FINAL}` passed all 19 affected workflows, required rendered review passed, and merged-main UI Shell `{UI_SHELL}` passed. No deployment followed from the merge.",
              "FRONTEND Phase 11 conclusion",
          )
          write(path, text)

          # COMPONENT_CATALOG.md
          path = "docs/ui/COMPONENT_CATALOG.md"
          text = read(path)
          text = replace_once(
              text,
              "**Notes:** Production build + Playwright desktop/mobile rendering approved; not locked. UI-052 / PR #73 moves shell ownership from the global root layout to `src/app/(app)/layout.tsx`; validated head `8975b7b42b518eea0a462b28528ddd41d90ad986` preserves the established application composition while public `/` renders without `AppShell`.",
              f"**Notes:** Production build + Playwright desktop/mobile rendering approved; not locked. UI-052 / PR #73 moved shell ownership from the global root layout to `src/app/(app)/layout.tsx`; merge `{MERGE}` preserves the established application composition while public `/` renders without `AppShell`. Final PR head `{FINAL}` passed 19/19 affected workflows and merged-main UI Shell `{UI_SHELL}` passed.",
              "COMPONENT AppShell evidence",
          )
          text = replace_once(
              text,
              f"**Notes:** UI-052 validated head `8975b7b42b518eea0a462b28528ddd41d90ad986` passed Brand / Launch Visual `33321365147` and all 19 affected workflows. Artifact `{ART}` (`{DIG}`) was human-reviewed clean.",
              f"**Notes:** UI-052 validated implementation head `8975b7b42b518eea0a462b28528ddd41d90ad986` and final PR head `{FINAL}` closed the 19-workflow affected gate. Artifact `{ART}` (`{DIG}`) was human-reviewed clean. PR #73 merged as `{MERGE}` and merged-main UI Shell `{UI_SHELL}` passed.",
              "COMPONENT Brand evidence",
          )
          write(path, text)

          # UI_DECISIONS.md
          path = "docs/ui/UI_DECISIONS.md"
          text = read(path)
          old = f"**Implementation evidence — UI-052 (2026-08-30):** PR #73 implements the accepted `/` Landing → `/create` Create route/layout split without changing the other public application URLs. Validated implementation head `8975b7b42b518eea0a462b28528ddd41d90ad986` passed all 19 affected PR workflows, led by UI Shell `33321365126`, Account/Admin Operations `33321365154`, Library Lifecycle `33321365125`, Create Lifecycle `33321365191`, Library Drag Drop `33321365146`, Generation Admission `33321365155` and Brand / Launch Visual `33321365147`. Brand artifact `{ART}` (`{DIG}`) was human-reviewed clean at desktop/narrow plus `/create` shell and legacy-continuation states. No schema/Auth/admission/R2/provider/billing/deployment change occurred."
          new = old + f" PR #73 subsequently merged as `{MERGE}` from exact final head `{FINAL}`, which passed 19/19 affected workflows; merged-main UI Shell `{UI_SHELL}` passed and the live post-merge fixture audit returned zero RenderLab fixture Auth/access/generation/admission/media/upload/invitation rows. Phase 11 is complete/verified; no deployment occurred."
          text = replace_once(text, old, new, "UI_DECISIONS merged evidence")
          write(path, text)

          # Penpot README
          path = "design/penpot/README.md"
          text = read(path)
          text = replace_once(
              text,
              "The rendered implementation is approved for merge under UI-052 without changing the design-artifact authority order.",
              f"The rendered implementation merged through PR #73 as `{MERGE}` after final head `{FINAL}` passed 19/19 affected workflows; merged-main UI Shell `{UI_SHELL}` also passed. The design-artifact authority order is unchanged.",
              "Penpot Phase 11 merge evidence",
          )
          write(path, text)
          PY

      - name: Remove temporary workflow and validate docs-only diff
        shell: bash
        run: |
          rm .github/workflows/tmp-phase11-merged-handoff.yml
          git diff --check
          git status --short
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' PROJECT.md design/penpot/README.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/ui/COMPONENT_CATALOG.md docs/ui/SCREEN_REGISTRY.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md | sort)"
          test "$changed" = "$expected"

      - name: Commit verified Phase 11 merged handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record verified Phase 11 merge"
          git push origin HEAD:main

name: Phase 17 documentation patch

on:
  push:
    branches:
      - plan/phase-17-observability-quality
    paths:
      - .github/workflows/phase17-doc-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: plan/phase-17-observability-quality
          fetch-depth: 0

      - name: Patch authoritative governance docs
        run: python .github/phase17-doc-patch.py

      - name: Validate documentation patch
        run: |
          git diff --check
          git diff -- PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md

      - name: Commit planning docs and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md
          git rm .github/workflows/phase17-doc-patch.yml
          git rm .github/phase17-doc-patch.py
          git rm .github/phase17-project-append.md
          git rm .github/phase17-migration-append.md
          git rm .github/phase17-ui057.md
          git diff --cached --check
          git commit -m "Plan Phase 17 observability and engineering quality"
          git push origin HEAD:plan/phase-17-observability-quality

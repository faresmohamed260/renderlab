name: Phase 20 settled mobile evidence

on:
  push:
    branches:
      - work/phase-20-create-instrument
    paths:
      - .github/workflows/phase20-settle-mobile-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-20-create-instrument
          fetch-depth: 0
      - name: Apply settled-state mobile verifier timing
        run: python .github/scripts/phase20-settle-mobile-evidence.py
      - name: Commit verifier correction and remove helper
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/phase20-settle-mobile-evidence.yml .github/scripts/phase20-settle-mobile-evidence.py
          git add scripts/verify-create-lifecycle.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: capture settled Phase 20 mobile states"
          git push origin HEAD:work/phase-20-create-instrument

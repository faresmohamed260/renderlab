name: Finalize RenderLab Modal Project Isolation

on:
  push:
    branches:
      - work/modal-project-isolation
    paths:
      - .github/workflows/modal-project-isolation-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/modal-project-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Finalize non-workflow repository authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['verify:modal-project-ownership'] = 'node scripts/verify-modal-project-ownership.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text(encoding='utf-8')
          if '## Modal Project Ownership Rule' not in agents:
              agents_path.write_text(agents.rstrip() + '''\n\n## Modal Project Ownership Rule\n\nModal account ownership is a locked cross-project infrastructure boundary. RenderLab owns only `modal-01`, `modal-02`, and `modal-42` through `modal-47`. S.A.G.A. owns `modal-03` through `modal-41`.\n\nPossession of an omnibus credential roster does not authorize use of every Modal credential. Any RenderLab script or workflow that selects Modal credentials must pass the checked-in ownership helper before exporting or using them and must fail closed for S.A.G.A.-owned labels. Do not change this partition unless the owner explicitly changes the decision in both repositories.\n\nPublic gateway names may retain historical `saga-` resource names; naming does not transfer ownership. Worker redeployment, reset, token rotation and secret-store changes remain separately authorized infrastructure operations.\n''', encoding='utf-8')

          infra_path = Path('docs/architecture/INFRASTRUCTURE.md')
          infra = infra_path.read_text(encoding='utf-8')
          if '## Modal Project Ownership Isolation' not in infra:
              infra_path.write_text(infra.rstrip() + '''\n\n## Modal Project Ownership Isolation\n\nRenderLab and S.A.G.A. use a locked, non-overlapping Modal account allocation. RenderLab owns `modal-01`, `modal-02`, and `modal-42` through `modal-47`; S.A.G.A. owns `modal-03` through `modal-41`. The checked-in authority is `config/modal-project-ownership.json`, with reusable fail-closed selection in `scripts/lib/modal-project-ownership.mjs`.\n\nThe verified RenderLab mapping is: `modal-01` → active `ltx-primary-02` (`faresmohamed260` gateway); `modal-02` → active `ltx-standby-02` (`bplay2086` gateway); `modal-42` / `modal-43` → Qwen primary/standby; `modal-44` / `modal-45` → historical FLUX primary / active FLUX standby; `modal-46` / `modal-47` → historical LTX primary/standby. `modal-45` also hosts the RenderLab-owned `renderlab-image-upscale` app. Disabled historical identities remain reserved because durable generation jobs retain worker identity.\n\nRenderLab normal generation requests call configured gateway URLs and do not authenticate to Modal. Modal credentials are deployment/maintenance authority only. A future RenderLab Modal mutation workflow must use project-scoped secret material where possible and must apply the ownership helper before credential selection. Public gateway names that contain the historical `saga-` prefix are resource identities and are not renamed solely for project branding.\n\nRepository guards prevent accidental cross-project credential use even if an omnibus secret is temporarily present. They are not a cryptographic substitute for least privilege: the strongest operational state is a RenderLab secret/environment containing only the eight RenderLab credentials and a S.A.G.A. secret/environment containing only its 39 credentials. Secret rotation/splitting, worker redeployment/reset and production deployment are not performed by the isolation implementation itself.\n''', encoding='utf-8')
          PY

          node scripts/verify-modal-project-ownership.mjs
          node --test tests/unit/modal-project-ownership.test.mjs
          git diff --check
      - name: Commit finalized non-workflow changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/architecture/INFRASTRUCTURE.md package.json
          git commit -m "Document RenderLab Modal project isolation"
          git push origin HEAD:work/modal-project-isolation

          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def insert_before_once(path, anchor, insertion):
              p = Path(path)
              text = p.read_text()
              if insertion.strip().splitlines()[0] in text:
                  raise SystemExit(f"{path}: insertion already present")
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {anchor!r}")
              p.write_text(text.replace(anchor, insertion.rstrip() + "\n\n" + anchor, 1))

          def append_once(path, marker, addition):
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  raise SystemExit(f"{path}: marker already present: {marker}")
              p.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n")


          phase11_project = f'''### Phase 11 execution contract — expanded 2026-08-30
**Status: `EXPANDED / IMPLEMENTATION NOT STARTED` under UI-052. This contract must merge before any Phase 11 design or implementation change.**

**Goal / user value**
- Give RenderLab a credible public identity and launch surface that explains the product before a visitor enters the creative workspace.
- Separate marketing/navigation chrome from the dense application shell so each surface can optimize for its job without contaminating the other.
- Preserve closed-beta honesty: invited users can sign in and active users can work, while the public surface does not imply public self-service access or solved broader-beta Auth operations.

**Verified starting state**
- Authoritative starting `main` is `{start_sha}`. Phase 10A–10D is complete/verified; no deployment or production access-enforcement change is authorized by Phase 11 planning.
- Current routing is Create `/`, Library `/library`, Viewer `/library/[assetId]`, Activity `/activity`, Settings `/settings`, Admin `/admin`. Root `src/app/layout.tsx` wraps every page in `AppShell`; shell Create links and the shell wordmark currently point to `/`.
- Current Create `/` is intentionally draftable while signed out, but durable upload/generation/private product operations require verified account state. Account sign-in/recovery stays in `/settings`; there is no public product sign-up affordance.
- Existing Viewer continuation links use root Create query intent (`source` + `action`) and the Create server reloads/validates owner media before continuation. Those links must not silently break when Create moves.
- No production brand asset set or `public/` directory exists. Root metadata is only `RenderLab` / `AI image and video creation workspace`; the shell currently uses a text-only RenderLab wordmark.
- Verified marketing-safe product capability is limited to Create Image, Edit Image, Create Video, Animate Image, durable reference/media reuse, Library organization, Activity history/failed-job Retry and closed-beta account/admin controls. Provider/model/worker details remain internal product implementation.
- `docs/ui/UI_SYSTEM.md` already defines the dark-first RenderLab palette, Inter/system typography, violet accent, accessibility baseline, premium-quality bar and strict boundary between application chrome and feature surfaces. `docs/ui/DESIGN_WORKFLOW.md` makes Penpot/open SVG handoff + remote GitHub rendered review the approved design loop.

**Locked route / information-architecture decision — UI-052**
1. **Landing owns `/`.** Phase 11 implementation makes `/` the public Brand / Launch surface.
2. **Create moves to `/create`.** `/create` becomes the application Create destination; `/library`, `/library/[assetId]`, `/activity`, `/settings` and `/admin` keep their existing URLs.
3. **Split marketing from application layout.** The root layout becomes global document/theme/metadata plumbing only. A marketing route group owns the landing surface without `AppShell`; an application route group owns Create/Library/Viewer/Activity/Settings/Admin under the existing `AppShell`. Route groups must not change the public URLs except the deliberate Create move.
4. **Preserve continuation compatibility.** A request to legacy root `/` containing `source` or `action` query intent redirects same-origin to `/create` with the full query string preserved; the existing Create server boundary remains responsible for UUID/action/owner/media validation. Bare `/` intentionally becomes the landing page.
5. **Application navigation remains task-first.** Shell Create navigation and the shell wordmark/mobile brand affordance point to `/create`, preserving their existing "return to workspace" behavior. The marketing wordmark points to `/`.
6. **Authentication stays where it is.** Landing `Sign in` points to `/settings`. Do not create a second credential form, public registration route, waitlist database or automatic admission path. `Open Create` points to `/create`; signed-out Create remains draftable under UI-030 and persistent actions continue to enforce account/admission rules.

**Brand / visual design contract**
- Begin implementation with a visual-design checkpoint before coding the landing composition: use Penpot when available, otherwise versioned open SVG handoff in `design/penpot/` per `DESIGN_WORKFLOW.md`. Review desktop and narrow/mobile states before treating the design as implementation-ready.
- Establish one project-owned RenderLab mark and wordmark system, not a collection of unrelated logos. The mark must remain recognizable at favicon/small-navigation scale, work in one-color treatment, and avoid relying on glow, gradients or a generic AI-sparkle glyph for identity.
- Keep the established dark-first canvas/surface/text foundation and semantic violet accent so marketing and application feel related. Marketing may use more expressive display scale, spatial composition and motion than the app, but must not redefine application control density/tokens or push decorative marketing mechanics into `AppShell`/Create/Library.
- Required brand outputs for the implementation slice: reusable mark/wordmark treatment, app/favicon icon, social/Open Graph launch image/banner, and repository-owned vector/raster exports needed by Next metadata or external launch use. Record only useful handoff assets; do not duplicate every design exploration.
- Motion may support hierarchy and product-story continuity, but no autoplay background video, cursor gimmicks, constant glow/parallax, heavy WebGL, or essential information hidden behind motion. `prefers-reduced-motion` gets a static equivalent.

**Landing content / messaging contract**
- Keep the page concise and product-led: hero/value proposition; a proof section for the four verified creative operations; durable references/Library/reuse; Activity/recovery continuity; and a closed-beta access CTA/footer. A product-workspace preview/montage may be used only if it represents real RenderLab UI/capability rather than fabricated controls.
- Primary CTA: **Open Create** → `/create`. Secondary account CTA: **Sign in** → `/settings`. Closed-beta language must make invitation/access status clear without exposing internal admission mechanics.
- Marketing claims may describe only verified RenderLab capability. Do not claim public availability, guaranteed quality, deterministic prompt obedience, render-time SLAs, pricing/cost savings, customer/user counts, model/provider superiority, collaboration, mobile apps, Director controls, cancellation, billing/credits or other unverified capability.
- Do not add pricing, testimonials, fake logos/customer badges, newsletter/waitlist capture, public registration, blog/CMS, analytics/tracking pixels or third-party marketing cookies in this slice.

**Implementation / architecture boundary**
- Prefer Server Components and static/project-owned assets for the landing page. Add Client Components only for interactions/motion that materially benefit the page; do not create a marketing client store.
- Reuse maintained RenderLab primitives for conventional interactive controls. Marketing-specific composition may be custom, but generic mechanics still follow the approved component-source order and accessibility requirements.
- Metadata should become launch-ready (descriptive title/description and project-owned Open Graph/Twitter visual) without hard-coding an unverified production hostname or implying deployment. Search-indexing/canonical-domain rollout remains a Phase 12/deployment decision if it depends on production origin state.
- No Supabase schema/migration, R2 contract, generation/provider contract, Auth policy, admission default, service-role exposure or production environment mutation is expected.

**Validation / review**
- Add a dedicated configured **Brand / Launch Visual** workflow/verifier that production-builds the app, verifies `/` landing semantics and `/create` application semantics, captures at least desktop `1440x1100` and narrow `390x844` landing screenshots, checks no horizontal overflow, keyboard-reachable CTAs, focus visibility, reduced-motion behavior and truthful closed-beta copy, and validates metadata/brand asset availability.
- Extend/update UI Shell validation for `/create` active navigation and shell brand behavior. Update Create lifecycle/deep-link verification so `/create` is authoritative and legacy `/?source=...&action=...` redirects to `/create` without losing query intent or weakening server continuation validation.
- Run UI purity, TypeScript and production build plus every path-triggered affected workflow. Because route/layout movement touches shared app composition, expect at minimum UI Shell, Create Lifecycle, Account Identity/Settings coverage and owner/generation regressions whose paths are affected; do not suppress broad regressions to make the landing slice appear isolated.
- Human-review the final desktop/narrow landing, brand mark at small scale, application shell after route migration, and representative legacy continuation redirect result. Functional assertions alone do not approve the brand/launch surface.

**Documentation outputs / exit criteria**
- Update `PROJECT.md`, `docs/ui/UI_MIGRATION.md`, `docs/ui/UI_DECISIONS.md`, `docs/ui/UI_SYSTEM.md` if brand-system rules actually change, `docs/ui/COMPONENT_CATALOG.md` for adopted reusable brand/marketing components, `docs/ui/SCREEN_REGISTRY.md`, `docs/architecture/FRONTEND_ARCHITECTURE.md`, and `design/penpot/README.md` for accepted handoff artifacts.
- Phase 11 is complete only when the route migration, brand assets, landing page, truthful CTA/auth posture, legacy continuation compatibility, responsive/accessibility/reduced-motion checks, exact-head CI and human visual review all pass and authoritative docs match verified implementation.
- Broader-beta Auth email/template/leaked-password blockers from Phase 10 remain open unless separately resolved with operator evidence. Phase 11 completion does not authorize public self-admission, production enforcement or deployment.
- No Vercel deployment is authorized by this contract. Phase 12 owns final integrated release validation and any later explicitly authorized production rollout.'''

name: UI-074 Merge Closure Docs

on:
  push:
    branches:
      - docs/ui074-merge-closure
    paths:
      - .github/workflows/ui074-merge-closure.yml
      - scripts/ui074-merge-closure.py

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/ui074-merge-closure
          fetch-depth: 0

      - name: Synchronize merge closure records
        run: python3 scripts/ui074-merge-closure.py

      - name: Commit closure records and remove helpers
        run: |
          rm .github/workflows/ui074-merge-closure.yml
          rm scripts/ui074-merge-closure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/SCREEN_REGISTRY.md docs/ui/COMPONENT_CATALOG.md docs/ui/CREATE_CLEAR_COMPOSER_IMPLEMENTATION_CONTRACT.md .github/workflows/ui074-merge-closure.yml scripts/ui074-merge-closure.py
          git diff --cached --check
          git commit -m "Document UI-074 merge closure"
          git push origin HEAD:docs/ui074-merge-closure

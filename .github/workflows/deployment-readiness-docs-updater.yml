name: Deployment Readiness Docs Updater

on:
  push:
    branches:
      - work/deployment-readiness-v0-1

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.event.head_commit.message == 'Apply deployment readiness doc updater'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/deployment-readiness-v0-1
          fetch-depth: 0

      - name: Apply asserted documentation updates
        run: node scripts/update-deployment-readiness-docs.mjs

      - name: Verify patch
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"

      - name: Commit synchronized handoff and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/ui/SCREEN_REGISTRY.md
          git rm scripts/update-deployment-readiness-docs.mjs .github/workflows/deployment-readiness-docs-updater.yml
          git commit -m "Sync deployment readiness handoff"
          git push origin HEAD:work/deployment-readiness-v0-1

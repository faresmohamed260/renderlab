name: Create Interaction R&D

on:
  push:
    branches:
      - rd/create-interaction-language
    paths:
      - design/prototypes/create-instrument-continuum-v0.1/**
      - docs/ui/CREATE_INTERACTION_RD.md
      - scripts/verify-create-interaction-rd.mjs
      - .github/workflows/create-interaction-rd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve repository prototype
        run: |
          python3 -m http.server 4173 --directory . > /tmp/renderlab-rd-server.log 2>&1 &
          echo $! > /tmp/renderlab-rd-server.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/design/prototypes/create-instrument-continuum-v0.1/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderlab-rd-server.log
          exit 1
      - name: Verify responsive and temporal R&D evidence
        run: node scripts/verify-create-interaction-rd.mjs
      - name: Upload R&D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-create-interaction-rd
          path: artifacts/create-interaction-rd
          if-no-files-found: warn
          retention-days: 14

name: UI-033 Final Documentation Sync

on:
  pull_request:
    paths:
      - ".github/workflows/ui033-final-doc-sync.yml"
      - "scripts/ui033-fix-doc-headings.mjs"

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'tmp/ui033-final-doc-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Checkout UI-033 work branch
        uses: actions/checkout@v4
        with:
          ref: work/media-delete-v0-1
          path: target
          fetch-depth: 0

      - name: Correct duplicate documentation headings
        run: node helper/scripts/ui033-fix-doc-headings.mjs target

      - name: Validate and push docs fix
        shell: bash
        run: |
          cd target
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md
          if git diff --cached --quiet; then
            echo "No heading correction needed."
            exit 0
          fi
          git commit -m "Fix UI-033 handoff headings"
          git push origin HEAD:work/media-delete-v0-1

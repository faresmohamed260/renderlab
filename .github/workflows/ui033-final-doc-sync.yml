name: UI-033 Final Documentation Sync

on:
  pull_request:
    paths:
      - ".github/workflows/ui033-final-doc-sync.yml"
      - "scripts/ui033-finalize-docs.mjs"

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'tmp/ui033-final-doc-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Checkout UI-033 work branch
        uses: actions/checkout@v4
        with:
          ref: work/media-delete-v0-1
          path: target
          fetch-depth: 0

      - name: Patch authoritative UI-033 handoff docs
        run: node helper/scripts/ui033-finalize-docs.mjs target

      - name: Validate and push docs commit
        shell: bash
        run: |
          cd target
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/ui/COMPONENT_CATALOG.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/INFRASTRUCTURE.md
          if git diff --cached --quiet; then
            echo "No UI-033 documentation changes needed."
            exit 0
          fi
          git commit -m "Finalize UI-033 pre-merge handoff"
          git push origin HEAD:work/media-delete-v0-1

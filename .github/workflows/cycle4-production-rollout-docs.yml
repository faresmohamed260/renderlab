name: Cycle 4 production rollout docs closure

on:
  push:
    branches:
      - docs/cycle4-production-rollout-closure
    paths:
      - .github/workflows/cycle4-production-rollout-docs.yml

permissions:
  contents: write

jobs:
  close-rollout-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: cf3923097fce62edbee643df9b2883bd09210046
      BRANCH: docs/cycle4-production-rollout-closure
    steps:
      - name: Check out closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/cycle4-production-rollout-closure
          fetch-depth: 0

      - name: Guard temporary-only staging state
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual.txt
          printf '%s\n' .github/scripts/cycle4-production-rollout-docs.py .github/workflows/cycle4-production-rollout-docs.yml | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Write verified rollout closure
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/dpl_6htPrpLMysfqZ7wQ5btwejXPA/dpl_6htPrpLMysfqZycZ7wQ5btwejXPA/' .github/scripts/cycle4-production-rollout-docs.py
          python .github/scripts/cycle4-production-rollout-docs.py
          rm .github/scripts/cycle4-production-rollout-docs.py
          rm .github/workflows/cycle4-production-rollout-docs.yml
          git diff --check
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual.txt
          printf '%s\n' PROJECT.md docs/architecture/INFRASTRUCTURE.md docs/ui/UI_MIGRATION.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit self-removing docs closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Cycle 4 production rollout"
          git push origin HEAD:"$BRANCH"

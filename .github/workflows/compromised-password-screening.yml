name: Compromised Password Screening

on:
  pull_request:
    paths:
      - "src/features/account/compromised-password-screening.ts"
      - "src/features/account/account-password-form.tsx"
      - "scripts/verify-pwned-passwords-reachability.mjs"
      - "scripts/verify-account-identity.mjs"
      - ".github/workflows/compromised-password-screening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify free Pwned Passwords range API
        run: node scripts/verify-pwned-passwords-reachability.mjs

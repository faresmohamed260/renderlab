name: Temporary #218 Settings entry patch

on:
  push:
    branches:
      - account/218-email-identity
    paths:
      - ".github/workflows/tmp-218-settings-entry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/218-email-identity
          fetch-depth: 0
      - name: Patch Settings sign-in email row
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/features/account/account-settings.tsx")
          text = path.read_text()
          identity_start = text.index("  if (identity) {")
          row_start = text.index('<RegisterRow index="01" title="Account">', identity_start)
          row_end = text.index("</RegisterRow>", row_start) + len("</RegisterRow>")
          indent = "          "
          new = "\n".join([
              f'{indent}<RegisterRow index="01" title="Account">',
              f'{indent}  <div className={{styles.actionRow}}>',
              f'{indent}    <div className={{styles.valueStack}}>',
              f'{indent}      <p className={{styles.valueLabel}}>Sign-in email</p>',
              f'{indent}      <p className={{styles.emailValue}}>{{identity.email ?? "RenderLab account"}}</p>',
              f'{indent}      <p className={{styles.helper}}>Used to sign in. Changing it keeps the same RenderLab account, access and ownership.</p>',
              f'{indent}    </div>',
              f'{indent}    <Button asChild variant="secondary" size="lg">',
              f'{indent}      <Link href="/settings/email">Change email</Link>',
              f'{indent}    </Button>',
              f'{indent}  </div>',
              f'{indent}</RegisterRow>',
          ])
          text = text[:row_start] + new + text[row_end:]
          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/account/account-settings.tsx
          git commit -m "feat: expose sign-in email change from Settings"
          git push origin HEAD:account/218-email-identity

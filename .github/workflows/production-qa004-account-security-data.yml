name: QA-004 Production Account Security Data Audit\n\non:\n  workflow_dispatch:\n    inputs:\n      expected_production_sha:\n        description: Exact 40-character Git SHA independently verified as production-live\n        required: true\n        type: string\n      confirm_production_sha_verified:\n        description: Confirm the supplied SHA was independently verified as the live RenderLab application source\n        required: true\n        type: boolean\n        default: false\n      confirm_fixture_only_destructive_work:\n        description: Confirm all destructive work is limited to run-owned QA-004 Auth/DB/R2 fixtures\n        required: true\n        type: boolean\n        default: false\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: renderlab-production-qa004-account-security-data\n  cancel-in-progress: false\n\njobs:\n  production-qa004:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 55\n    env:\n      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co\n      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}\n      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw\n      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co\n      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw\n      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}\n      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}\n      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}\n      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}\n      RENDERLAB_TEST_BASE_URL: https://renderlab.faresuniform.uk\n      RENDERLAB_EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}\n      RENDERLAB_CONFIRM_PRODUCTION_SHA_VERIFIED: ${{ inputs.confirm_production_sha_verified }}\n      RENDERLAB_CONFIRM_FIXTURE_ONLY_DESTRUCTIVE_WORK: ${{ inputs.confirm_fixture_only_destructive_work }}\n      RENDERLAB_TEST_ACCOUNT_SCOPE: qa004-${{ github.run_id }}\n      RENDERLAB_TEST_MFA_NAMESPACE: profile-mfa\n      RENDERLAB_PROFILE_CREDENTIAL_ARTIFACT_DIR: artifacts/qa004-production-account-security-data/profile-credential\n      RENDERLAB_ACCOUNT_PREFERENCES_ARTIFACT_DIR: artifacts/qa004-production-account-security-data/preferences\n      RENDERLAB_SESSION_ARTIFACT_DIR: artifacts/qa004-production-account-security-data/sessions\n      RENDERLAB_QA004_ARTIFACT_DIR: artifacts/qa004-production-account-security-data\n\n    steps:\n      - name: Checkout audit harness head\n        uses: actions/checkout@v4\n\n      - name: Validate manual production-audit dispatch\n        shell: bash\n        run: |\n          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then\n            echo "::error::QA-004 is manual production-audit only."\n            exit 1\n          fi\n          if [ "$RENDERLAB_CONFIRM_PRODUCTION_SHA_VERIFIED" != "true" ]; then\n            echo "::error::QA-004 requires explicit independent production-SHA verification."\n            exit 1\n          fi\n          if [ "$RENDERLAB_CONFIRM_FIXTURE_ONLY_DESTRUCTIVE_WORK" != "true" ]; then\n            echo "::error::QA-004 requires explicit fixture-only destructive-work confirmation."\n            exit 1\n          fi\n          if ! printf "%s" "$RENDERLAB_EXPECTED_PRODUCTION_SHA" | grep -Eq "^[0-9a-fA-F]{40}$"; then\n            echo "::error::expected_production_sha must be an exact 40-character Git SHA."\n            exit 1\n          fi\n\n      - name: Validate shared-resource secrets\n        shell: bash\n        run: |\n          missing=0\n          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do\n            if [ -z "${!name}" ]; then\n              echo "::error::$name is not configured for RenderLab."\n              missing=1\n            fi\n          done\n          exit "$missing"\n\n      - name: Set up Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: 24\n          cache: npm\n          cache-dependency-path: package.json\n\n      - name: Install dependencies\n        run: npm install --no-audit --no-fund\n\n      - name: Install Chromium\n        run: npx playwright install --with-deps chromium\n\n      - name: Validate QA-004 audit harness\n        run: |\n          node --check scripts/verify-production-qa004-account-security-data.mjs\n          node --check scripts/verify-account-profile-credential.mjs\n          node --check scripts/verify-account-preferences.mjs\n          node --check scripts/verify-session-controls.mjs\n          node --test tests/unit/production-qa004-audit-contract.test.mjs\n\n      - name: Clean exact QA-004 fixtures before audit\n        run: node scripts/verify-production-qa004-account-security-data.mjs --cleanup-only\n\n      - name: Run production account security data audit\n        run: node scripts/verify-production-qa004-account-security-data.mjs\n\n      - name: Clean exact QA-004 fixtures after audit\n        if: always()\n        run: node scripts/verify-production-qa004-account-security-data.mjs --cleanup-only\n\n      - name: Upload QA-004 evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: production-qa004-account-security-data-${{ github.run_id }}-${{ github.run_attempt }}\n          path: artifacts/qa004-production-account-security-data\n          if-no-files-found: warn\n          retention-days: 30\n
name: Phase 18A Documentation Closure

on:
  push:
    branches:
      - work/phase-18-image-upscale
    paths:
      - .github/workflows/phase18a-doc-closure.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase-18-image-upscale
          fetch-depth: 0

      - name: Record Phase 18A live verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # PROJECT.md — current Cycle 3 state and durable 18A evidence.
          replace_exact(
              "PROJECT.md",
              "**Status: `IN PROGRESS — PHASE 18A PREDEPLOY PREPARATION VERIFIED / WORKER DEPLOYMENT + LIVE PROOF PENDING`.**",
              "**Status: `IN PROGRESS — PHASE 18A COMPLETE / LIVE VERIFIED; PHASE 18B NEXT`.**",
          )
          replace_exact(
              "PROJECT.md",
              "- **Phase 18 — Image Upscale v0.1: `IMPLEMENTATION IN PROGRESS — 18A PREDEPLOY PREPARATION VERIFIED / UNDEPLOYED`.** Fresh read-only deployed-worker audit `33995223659` / artifact `9977854297` (`sha256:3490b81b9229e048d78829848b8f1c4061aa0082859dd005481604f3881febef`) selected fixed 2× durable-image Upscale. Repository preparation now excludes the verified-disabled FLUX/REDGraft primaries from new routing while preserving historical lookup, pins an undeployed RenderLab-owned SwinIR 2× worker candidate, and adds a permanent offline worker-contract gate. 18A is not complete: no new worker has been deployed, live geometry/alpha behavior has not been proved, and no Upscale product/schema/UI coupling has started. Restore, Inpainting/Outpainting, LoRA/model adapters and Director remain deferred.",
              "- **Phase 18 — Image Upscale v0.1: `IMPLEMENTATION IN PROGRESS — 18A COMPLETE / LIVE VERIFIED; 18B NEXT`.** Fresh read-only deployed-worker audit `33995223659` / artifact `9977854297` (`sha256:3490b81b9229e048d78829848b8f1c4061aa0082859dd005481604f3881febef`) selected fixed 2× durable-image Upscale. Repository preparation excludes the verified-disabled FLUX/REDgraft primaries from new routing while preserving historical lookup and pins the RenderLab-owned SwinIR 2× worker contract. With explicit user authorization, exact RenderLab source `3b7f4a4dcc27a64e1423cbd2c6d0993b24ceb3e8` was deployed as Modal app `renderlab-image-upscale` in healthy workspace `modal-45`; corrected full live proof `34000980137` passed all 10 acceptance cases and uploaded artifact `9979491468` (artifact ZIP digest `sha256:4a8f2a06b0bcf305eaa9b270bbfbe5937e0f8b5abeb004f5ab57c2665e7e6d04`; evidence JSON `sha256:0ad85f892357f1e6d611b32b27a03fa030eef8df3ffe7afb3dae2950919a1dab`). 18A is complete. No Upscale product/schema/UI coupling has started; 18B must begin with the accepted pre-DDL audit rather than assuming a migration. Restore, Inpainting/Outpainting, LoRA/model adapters and Director remain deferred.",
          )
          replace_exact(
              "PROJECT.md",
              "**Status: `CONTRACT ACCEPTED / IMPLEMENTATION NOT STARTED`.**\n**UI decision:** UI-058.",
              "**Status: `IMPLEMENTATION IN PROGRESS — 18A COMPLETE / LIVE VERIFIED; 18B NOT STARTED`.**\n**UI decision:** UI-058.",
          )
          anchor = "## Product selection and v0.1 boundaries\n"
          insertion = """## Phase 18A live worker verification — 2026-09-06\nPhase 18A is `COMPLETE / LIVE VERIFIED`. This does **not** mean Phase 18 is complete and does not authorize a production RenderLab application deployment.\n\n- Explicit user authorization covered the new Upscale worker deployment only; application/schema/UI coupling remained blocked until live proof succeeded.\n- Exact RenderLab source `3b7f4a4dcc27a64e1423cbd2c6d0993b24ceb3e8` was deployed as Modal app `renderlab-image-upscale` in the verified healthy `modal-45` workspace, with worker identity `renderlab-upscale-01`.\n- The first live deployment proved health/provenance but exposed a real FastAPI multipart bug: `from __future__ import annotations` turned the route-local `UploadFile` annotation into an unresolved forward reference, so multipart POST requests failed before route execution. The RenderLab worker source was corrected and the permanent offline verifier was strengthened before redeployment.\n- Corrected live smoke then proved invalid `scale=4` returns `400` and a real 8×8 RGB request completes through async submit/poll to a 16×16 PNG.\n- Corrected full live proof run `34000980137` passed 10 acceptance cases: health/provenance, fixed-scale rejection, geometry-ceiling rejection, RGB exact 2× PNG, alpha exact 2× RGBA PNG, EXIF-orientation normalization, animated/multi-frame rejection, async cancellation with no image result, accepted 4096×1024 → 8192×2048 boundary result transport, and final healthy/sleeping worker state.\n- The full proof recorded zero persistent Supabase fixtures and zero R2 fixtures. Evidence artifact `9979491468` has GitHub artifact ZIP digest `sha256:4a8f2a06b0bcf305eaa9b270bbfbe5937e0f8b5abeb004f5ab57c2665e7e6d04`; its `evidence.json` hash is `sha256:0ad85f892357f1e6d611b32b27a03fa030eef8df3ffe7afb3dae2950919a1dab`.\n- A later temporary proof-harness health assertion was corrected to read the worker state from the gateway's nested `worker` object; the corrected v2 matrix above is the authoritative acceptance evidence.\n- No production RenderLab application deployment, Supabase migration, product routing, scheduler activation, `pg_cron`/`pg_net`, or later capability deployment followed 18A.\n\n**Handoff boundary:** Phase 18B may now start, but only from a fresh pre-DDL audit of current `generation_jobs.operation` rows/constraints and related domain contracts. The accepted contract still requires the smallest compatible `upscale-image` schema/domain change and forbids masquerading Upscale as Edit.\n\n"""
          p = Path("PROJECT.md")
          text = p.read_text(encoding="utf-8")
          if anchor not in text:
              raise SystemExit("PROJECT.md: Phase 18 insertion anchor missing")
          if "## Phase 18A live worker verification — 2026-09-06" in text:
              raise SystemExit("PROJECT.md: Phase 18A live section already exists")
          p.write_text(text.replace(anchor, insertion + anchor, 1), encoding="utf-8")

          # UI_MIGRATION.md — mark 18A complete and 18B as the next allowed slice.
          replace_exact(
              "docs/ui/UI_MIGRATION.md",
              "**Post-Phase-17 governance:** completed by read-only worker audit `33995223659` and the accepted Phase 18 Image Upscale v0.1 contract below. Phase 18A repository preparation has now started and is verified offline; worker/application deployment remains separately authorized.",
              "**Post-Phase-17 governance:** completed by read-only worker audit `33995223659` and the accepted Phase 18 Image Upscale v0.1 contract below. Phase 18A is now complete/live-verified after the explicitly authorized worker-only deployment; production application deployment remains separate and unauthorized.",
          )
          replace_exact(
              "docs/ui/UI_MIGRATION.md",
              "**Status: `IMPLEMENTATION IN PROGRESS — 18A PREDEPLOY PREPARATION VERIFIED / UNDEPLOYED` under UI-058.**",
              "**Status: `IMPLEMENTATION IN PROGRESS — 18A COMPLETE / LIVE VERIFIED; 18B NEXT` under UI-058.**",
          )
          replace_exact(
              "docs/ui/UI_MIGRATION.md",
              "### 18A predeployment preparation — verified / deployment pending",
              "### 18A fleet/worker prerequisite — COMPLETE / LIVE VERIFIED",
          )
          replace_exact(
              "docs/ui/UI_MIGRATION.md",
              "- [x] Prepare undeployed RenderLab-owned `workers/image-upscale/modal_app.py` with lightweight gateway/heavy runtime separation, fixed 2× async lifecycle, exact limits, rectangular tiling and alpha path.\n- [x] Permanent offline `Upscale Worker Validation` run `33997784521` passed.\n- [ ] Deploy the worker only after explicit authorization, then prove live RGB + alpha exact-2× geometry, PNG output, polling/cancellation and cleanup before 18A can complete.",
              "- [x] Prepare RenderLab-owned `workers/image-upscale/modal_app.py` with lightweight gateway/heavy runtime separation, fixed 2× async lifecycle, exact limits, rectangular tiling and alpha path.\n- [x] Permanent offline `Upscale Worker Validation` run `33997784521` passed; after live POST exposed the route-local `UploadFile` forward-reference bug, the annotation scope was corrected and the verifier strengthened before redeployment.\n- [x] Explicitly authorized worker-only deployment completed from exact RenderLab source `3b7f4a4dcc27a64e1423cbd2c6d0993b24ceb3e8` as Modal app `renderlab-image-upscale` in healthy workspace `modal-45` (`renderlab-upscale-01`).\n- [x] Corrected smoke proved invalid scale → `400` and real 8×8 RGB → 16×16 PNG through submit/poll. Corrected full live proof `34000980137` then passed 10 cases covering health/provenance, fixed-scale + geometry rejection, RGB, alpha, EXIF normalization, animated rejection, cancellation, accepted 4096×1024 → 8192×2048 result transport and final healthy/sleeping state.\n- [x] Full proof artifact `9979491468` has ZIP digest `sha256:4a8f2a06b0bcf305eaa9b270bbfbe5937e0f8b5abeb004f5ab57c2665e7e6d04`; `evidence.json` is `sha256:0ad85f892357f1e6d611b32b27a03fa030eef8df3ffe7afb3dae2950919a1dab`. Persistent proof fixtures: Supabase `0`, R2 `0`. No application/schema/UI rollout followed.",
          )
          replace_exact(
              "docs/ui/UI_MIGRATION.md",
              "- [ ] **18A Fleet/worker prerequisite:** repository-side reconciliation/runtime/worker preparation is verified; live deployment + contract proof remain. Any worker deployment requires separate explicit authorization.",
              "- [x] **18A Fleet/worker prerequisite:** registry hygiene, pinned SwinIR runtime, worker deployment and complete live contract proof are verified. The deployment authorization was worker-only and does not authorize RenderLab application rollout.",
          )
          replace_exact(
              "docs/ui/UI_MIGRATION.md",
              "**Phase 18 implementation is in progress and must remain inside the accepted 18A→18F sequence above. 18B must not begin until 18A live worker proof is complete.**",
              "**Phase 18 implementation is in progress and must remain inside the accepted 18A→18F sequence above. 18A is complete/live-verified; 18B is the next slice and must start with the accepted fresh pre-DDL audit before any schema mutation.**",
          )

          # INFRASTRUCTURE.md — change worker reality from undeployed to live-verified.
          replace_exact(
              "docs/architecture/INFRASTRUCTURE.md",
              "#### Phase 18A predeployment repository state — verified / no worker deployment",
              "#### Phase 18A Upscale worker deployment — COMPLETE / LIVE VERIFIED",
          )
          replace_exact(
              "docs/architecture/INFRASTRUCTURE.md",
              "- `workers/image-upscale/modal_app.py` is RenderLab-owned undeployed worker source. It uses Modal Python SDK `1.4.2`; a lightweight Debian/FastAPI gateway image is separate from the CUDA 12.8 / PyTorch 2.7.1 / torchvision 0.22.1 / timm 1.0.19 / Pillow 11.2.1 / NumPy 2.2.6 inference image. The runtime clones the exact SwinIR commit, downloads/hash-checks the exact release weight, exposes fixed scale 2 only, enforces the accepted byte/geometry ceilings, normalizes EXIF orientation, rejects animated/multi-frame sources, returns PNG, uses rectangular 256px tiled inference with 32px bounded overlap, and preserves alpha through a separately resized channel pending live proof.",
              "- `workers/image-upscale/modal_app.py` is the RenderLab-owned deployed worker source. It uses Modal Python SDK `1.4.2`; a lightweight Debian/FastAPI gateway image is separate from the CUDA 12.8 / PyTorch 2.7.1 / torchvision 0.22.1 / timm 1.0.19 / Pillow 11.2.1 / NumPy 2.2.6 inference image. The runtime clones the exact SwinIR commit, downloads/hash-checks the exact release weight, exposes fixed scale 2 only, enforces the accepted byte/geometry ceilings, normalizes EXIF orientation, rejects animated/multi-frame sources, returns PNG, uses rectangular 256px tiled inference with 32px bounded overlap, and preserves alpha through a separately resized channel; RGB, alpha and EXIF behavior are now live-proved.",
          )
          replace_exact(
              "docs/architecture/INFRASTRUCTURE.md",
              "**Hard boundary:** none of the above is a Modal deployment or live-worker verification. There is no deployed RenderLab Upscale endpoint yet. 18A remains incomplete until an explicitly authorized deployment is followed by live `/health`, fixed `POST /jobs/upscale`, GET/DELETE lifecycle, exact RGB/alpha 2× geometry, PNG and cleanup proof. No production application deployment, scheduler activation, schema change or product routing follows from this repository preparation.",
              "**Live 18A evidence:** with explicit user authorization limited to the new Upscale worker, exact RenderLab source `3b7f4a4dcc27a64e1423cbd2c6d0993b24ceb3e8` was deployed as Modal app `renderlab-image-upscale` in verified healthy workspace `modal-45`, worker identity `renderlab-upscale-01`. The first live POST exposed a FastAPI annotation-scope defect (`UploadFile` was route-local while postponed annotations required global resolution); the source and offline verifier were corrected before redeployment. Corrected smoke passed invalid-scale `400` plus a real 8×8 → 16×16 PNG lifecycle. Corrected full proof run `34000980137` passed all 10 accepted cases, including exact RGB/alpha/EXIF geometry, animated rejection, cancellation with no result, and 4096×1024 → 8192×2048 PNG transport. Artifact `9979491468` ZIP digest is `sha256:4a8f2a06b0bcf305eaa9b270bbfbe5937e0f8b5abeb004f5ab57c2665e7e6d04`; `evidence.json` is `sha256:0ad85f892357f1e6d611b32b27a03fa030eef8df3ffe7afb3dae2950919a1dab`; persistent Supabase/R2 fixtures are both zero. Phase 18A is therefore complete/live-verified. No production RenderLab application deployment, scheduler activation, schema change, product routing, `pg_cron` or `pg_net` activation followed this worker deployment. Phase 18B remains a separate domain/schema slice and must start with its accepted pre-DDL audit.",
          )

          # Guard against stale status language surviving in the final authoritative files.
          stale = {
              "PROJECT.md": ["PHASE 18A PREDEPLOY PREPARATION VERIFIED / WORKER DEPLOYMENT + LIVE PROOF PENDING"],
              "docs/ui/UI_MIGRATION.md": ["18A PREDEPLOY PREPARATION VERIFIED / UNDEPLOYED", "18B must not begin until 18A live worker proof is complete"],
              "docs/architecture/INFRASTRUCTURE.md": ["There is no deployed RenderLab Upscale endpoint yet"],
          }
          for path, needles in stale.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f"{path}: stale Phase 18A language remains: {needle}")
          PY

          git diff --check
          git diff -- PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md

      - name: Commit docs and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git rm .github/workflows/phase18a-doc-closure.yml
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/architecture/INFRASTRUCTURE.md
          git diff --cached --check
          git commit -m "docs: record Phase 18A live worker proof"
          git push origin HEAD:work/phase-18-image-upscale

name: Phase 12 Release Validation

on:
  push:
    branches: [work/phase-12-release-validation]
    paths:
      - "scripts/verify-release-integrated.mjs"
      - ".github/workflows/release-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-phase12-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate whitespace and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          temporary="$(git ls-files '.github/workflows/tmp-*' 'scripts/tmp-*')"
          if [ -n "$temporary" ]; then
            echo "::error::Temporary helper files remain in the release candidate:"
            printf '%s\n' "$temporary"
            exit 1
          fi
          git diff --name-only origin/main...HEAD

  deployment-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Verify explicit Vercel deployment contract
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
          if (config.framework !== "nextjs") throw new Error(`Expected framework=nextjs, got ${JSON.stringify(config.framework)}`);
          if (config.git?.deploymentEnabled !== false) throw new Error("Automatic Vercel Git deployments must remain disabled.");
          if (Object.hasOwn(config, "outputDirectory")) throw new Error("Do not force outputDirectory for Next.js.");
          EOF
      - name: Verify Vercel environment preflight
        env:
          VERCEL: "1"
          SUPABASE_URL: "https://rashyleshocuvpgcooxy.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "test-publishable-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          CLOUDFLARE_R2_ACCOUNT_ID: "test-account"
          CLOUDFLARE_R2_ACCESS_KEY_ID: "test-access-key"
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: "test-secret-key"
          CLOUDFLARE_R2_BUCKET: "test-bucket"
        run: node scripts/verify-vercel-env.mjs
      - name: Production build under Vercel contract
        env:
          VERCEL: "1"
          SUPABASE_URL: "https://rashyleshocuvpgcooxy.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "test-publishable-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          CLOUDFLARE_R2_ACCOUNT_ID: "test-account"
          CLOUDFLARE_R2_ACCESS_KEY_ID: "test-access-key"
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: "test-secret-key"
          CLOUDFLARE_R2_BUCKET: "test-bucket"
        run: npm run build

  ui-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run verify:ui-purity
      - run: npx tsc --noEmit
      - run: node --check scripts/verify-release-integrated.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1
      - run: npm run test:ui
      - name: Upload shell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-ui-shell
          path: |
            artifacts/*.png
            test-results/**
          if-no-files-found: warn
          retention-days: 14

  integrated-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_GENERATION_BACKEND_URL: http://127.0.0.1:3030
      RENDERLAB_GENERATION_BACKEND_TOKEN: phase12-release-integrated-token
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Validate configured secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured."; missing=1; fi
          done
          exit "$missing"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run verify:ui-purity
      - run: npx tsc --noEmit
      - run: node --check scripts/verify-release-integrated.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start configured application
        run: |
          npm run start -- -p 3000 > /tmp/renderlab-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/renderlab-next.log
          exit 1
      - name: Verify integrated release continuity
        run: node scripts/verify-release-integrated.mjs
      - name: Cleanup integrated release fixtures
        if: always()
        run: node scripts/verify-release-integrated.mjs --cleanup-only
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/renderlab-next.log || true
      - name: Upload integrated release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-integrated-release
          path: artifacts/release-integrated-*.png
          if-no-files-found: warn
          retention-days: 14

  configured-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ github.ref_name }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch exact-candidate configured workflows
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            account-identity-visual.yml
            account-ownership.yml
            activity-visual.yml
            admin-operations.yml
            brand-launch-visual.yml
            create-durable-upload.yml
            create-lifecycle-visual.yml
            generation-admission.yml
            generation-bridge-integration.yml
            library-batch-delete-visual.yml
            library-collections-visual.yml
            library-drag-drop-visual.yml
            library-favorites-visual.yml
            library-history-visual.yml
            library-lifecycle-visual.yml
            library-search-visual.yml
            media-delete-visual.yml
            media-download-visual.yml
            media-rename-visual.yml
            reference-upload-integration.yml
            video-generation-integration.yml
          )
          printf '%s\n' "${workflows[@]}" > /tmp/phase12-workflows.txt
          for workflow in "${workflows[@]}"; do
            echo "Dispatching $workflow on $REF ($CANDIDATE_SHA)"
            gh api --method POST "repos/$REPO/actions/workflows/$workflow/dispatches" -f ref="$REF"
          done
      - name: Wait for exact-candidate workflow results
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 6600))
          while IFS= read -r workflow; do
            echo "Waiting for $workflow"
            run_id=""
            while [ -z "$run_id" ]; do
              if (( SECONDS > deadline )); then echo "::error::Timed out waiting for $workflow"; exit 1; fi
              runs="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=$REF&per_page=20")"
              run_id="$(jq -r --arg sha "$CANDIDATE_SHA" '.workflow_runs | map(select(.head_sha == $sha)) | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$runs")"
              [ -n "$run_id" ] || sleep 8
            done
            while true; do
              run="$(gh api "repos/$REPO/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              if [ "$status" = "completed" ]; then
                echo "$workflow run=$run_id conclusion=$conclusion"
                if [ "$conclusion" != "success" ]; then exit 1; fi
                break
              fi
              if (( SECONDS > deadline )); then echo "::error::Timed out waiting for run $run_id"; exit 1; fi
              sleep 12
            done
          done < /tmp/phase12-workflows.txt

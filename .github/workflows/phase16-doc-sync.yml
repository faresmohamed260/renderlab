name: Phase 16 Documentation Sync

on:
  push:
    branches: [noop]
    paths:
      - ".github/workflows/phase16-doc-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: work/phase-16-creative-iteration
      EXPECTED_HEAD: 5c9008c974c9b096fd484b3e5546c613880ff79a
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0

      - name: Update verified Phase 16 repository record
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          project = Path('PROJECT.md')
          text = project.read_text()
          text = text.replace(
              '**Status: `IN PROGRESS — PHASE 15 COMPLETE / VERIFIED; PHASE 16 CONTRACT ACCEPTED / IMPLEMENTATION NOT STARTED`.**',
              '**Status: `IN PROGRESS — PHASE 16A/16B/16C IMPLEMENTED / VERIFIED; PHASE 16D DESIGN CHECKPOINT PENDING`.**',
              1,
          )
          text = text.replace(
              '- **Phase 16 — Creative Iteration: `CONTRACT ACCEPTED / IMPLEMENTATION NOT STARTED`.** Build current-valid recipe reuse into Create, successful-job Run Again from Activity, and conditional durable source/result comparison in Viewer. Variations is explicitly deferred: Phase 14 made multi-output storage safe, but current worker/product execution still returns one output per job and has no approved output-count semantics.',
              '- **Phase 16 — Creative Iteration: `IN PROGRESS — 16A/16B/16C IMPLEMENTED / VERIFIED; 16D DESIGN CHECKPOINT PENDING`.** Shared current-valid recipe reconstruction, Create Reuse Settings and successful Activity Run Again are implemented and configured-verified. Conditional durable source/result comparison remains unimplemented until its required desktop+narrow visual design checkpoint is reviewed. Variations remains explicitly deferred: Phase 14 made multi-output storage safe, but current worker/product execution still returns one output per job and has no approved output-count semantics.',
              1,
          )
          text = text.replace(
              'Phase 16 planning is now captured by the accepted execution contract below. Implementation has not started, and the contract itself does not authorize production deployment or scheduler activation.',
              'Phase 16 planning is captured by the accepted execution contract below. Implementation is in progress: 16A shared recipe reconstruction, 16B Reuse Settings and 16C successful Run Again are implemented and verified; 16D comparison remains blocked on its required visual design checkpoint. The contract and this implementation evidence do not authorize production deployment or scheduler activation.',
              1,
          )
          marker = '# Phase 16 Execution Contract — Creative Iteration\n**Status: `ACCEPTED / IMPLEMENTATION NOT STARTED`.**'
          replacement = '''# Phase 16 Execution Contract — Creative Iteration
**Status: `IN PROGRESS — 16A/16B/16C IMPLEMENTED / VERIFIED; 16D DESIGN CHECKPOINT PENDING`.**

## Verified implementation progress — 2026-09-05
- **16A shared recipe reconstruction:** owner-scoped historical intent is reconstructed through the current generation contract, including the already-approved narrow legacy Video compatibility, and current input ownership/readiness is revalidated before reuse.
- **16B Reuse Settings:** successful current-valid history can open `/create?recipe=<job-id>` with persisted prompt, output settings, Advanced values, stable input aliases/roles and exact source identity prefilled. Opening the recipe never dispatches generation; edits submit through the ordinary Create boundary.
- **Historical temporary references:** still-ready same-owner `temporary-source` inputs remain reusable through a narrow authenticated product content redirect; R2/storage identity stays server-only and temporary sources are not promoted into a parallel durable-media model.
- **16C Run Again:** successful current-valid Activity rows can submit a distinct new ordinary generation attempt through current admission/routing. Failed Retry, successful Run Again and active Cancel remain separate semantics; the historical successful job is immutable and worker/provider/workflow/model/failover metadata is never replayed.
- **Focused configured verification:** exact head `5c9008c974c9b096fd484b3e5546c613880ff79a` passed Creative Iteration run `33959979016`, including signed-out/foreign privacy, zero implicit dispatch, editable Image/Video/Advanced recipe prefill, stable aliases, ready temporary-source reuse, unavailable-input fail-closed behavior, distinct immutable Run Again attempts, admission denial, exact fixture cleanup and four desktop/narrow screenshots. Artifact `9967633913` has SHA-256 `7fb2906c915390c0b23ae102e2dd06bdbde46736c503d80b0e554d398f660716` and was visually reviewed clean for the implemented 16B/16C surfaces.
- **Full affected regression matrix:** the same exact head passed all 26 affected workflows. Library Collections run `33959978965` completed its product assertions on attempt 1 but hit a Playwright in-flight-route teardown race after success; unchanged attempt 2 passed with cleanup. Key gates include Create Lifecycle `33959978960`, Activity `33959978980`, Generation Admission `33959978976`, Generation Integration `33959978997`, Video Generation `33959978972`, UI Shell `33959978999` and Integrated Release `33959978983`.
- **16D remains unimplemented:** UI-056 and this contract require a reviewed desktop+narrow Media Viewer comparison design checkpoint before code. No comparison layout has been self-approved or inferred merely because direct Penpot automation is unavailable.
- **No rollout implication:** no schema migration, production deployment, production scheduler activation, provider-routing redesign or historical data rewrite is part of 16A–16C.
'''
          if marker not in text:
              raise SystemExit('Phase 16 contract status marker not found in PROJECT.md')
          project.write_text(text.replace(marker, replacement, 1))

          Path('docs/ui/UI_MIGRATION.md').write_text(Path('docs/ui/UI_MIGRATION.md').read_text() + '''

## Cycle 3 — Phase 16 Creative Iteration — partial verified implementation
**Status: `IN PROGRESS — 16A/16B/16C IMPLEMENTED / VERIFIED; 16D DESIGN CHECKPOINT PENDING`**

- [x] **16A shared recipe reconstruction:** centralize owner-scoped historical job loading, current-contract reconstruction, operation/output revalidation and current source availability so failed Retry and successful reuse share one truthful boundary.
- [x] **16B Reuse Settings:** successful current-valid history can open the existing Create workspace with prompt, Image/Video output settings, Advanced values, stable `@imageN` aliases/roles and exact historical input source identity prefilled. Opening a recipe performs no generation dispatch.
- [x] Preserve still-ready same-owner historical `temporary-source` inputs without cloning or silently converting them to durable media. Their preview uses a narrow authenticated short-lived product redirect; storage identity remains server-only.
- [x] **16C Run Again:** successful current-valid Activity rows expose a compact Run again action that creates a distinct ordinary current generation attempt. Failed Retry and active Cancel remain separate product semantics; provider/worker/workflow/model/failover state is not replayed.
- [x] Add dedicated configured `Creative Iteration` GitHub verification using real run-owned Supabase/R2 fixtures plus a local mock generation backend. Exact head `5c9008c974c9b096fd484b3e5546c613880ff79a` passed run `33959979016`; artifact `9967633913` (`sha256:7fb2906c915390c0b23ae102e2dd06bdbde46736c503d80b0e554d398f660716`) contains desktop+narrow Create recipe and Activity Run Again screenshots reviewed clean.
- [x] Exact head `5c9008c974c9b096fd484b3e5546c613880ff79a` passed all 26 affected workflows. Library Collections `33959978965` had one post-success Playwright teardown race and passed unchanged on attempt 2; configured cleanup succeeded.
- [ ] **16D Compare source:** not implemented. UI-056 requires a reviewed desktop+narrow Media Viewer visual design checkpoint first; lack of direct Penpot automation does not waive that checkpoint.
- [ ] **Phase 16 completion:** remains open until 16D is legitimately designed, implemented, rendered/keyboard/reduced-motion reviewed and the final repository record is verified.

No schema migration, production deployment, scheduler activation, provider-routing redesign or Variations implementation is authorized or implied by this progress.
''')

          Path('docs/ui/SCREEN_REGISTRY.md').write_text(Path('docs/ui/SCREEN_REGISTRY.md').read_text() + '''

## Cycle 3 Phase 16 screen extensions — implementation in progress

### Create — successful recipe prefill extension
The approved `/create` workspace now accepts an untrusted `recipe=<generation-job-uuid>` navigation intent for successful current-valid history. The server reloads the job under the verified owner, reconstructs only current product intent and revalidates source availability before passing an initial recipe to the existing Create composition. Prompt, output settings, Advanced values and stable reference aliases/roles/sources are editable after prefill. Opening the recipe never dispatches generation. Invalid, foreign, mixed recipe/media continuation and unavailable-source navigation fails closed without partial private prefill. This is an extension of the approved Create surface, not a new Recipe mode or top-level destination.

### Activity — successful Run Again extension
Successful current-valid rows may expose **Run again** beside **View result**. The server derives eligibility; the browser sends only the historical job ID and receives a new ordinary generation attempt. Failed rows keep **Retry** and active rows keep **Cancel** where supported. The narrow rendered state allows the successful action pair to wrap without hiding controls. Exact configured Activity/Creative Iteration validation passed on head `5c9008c974c9b096fd484b3e5546c613880ff79a`.

### Media Viewer — Reuse Settings implemented; Compare source pending design
Generated Viewer results with a current-valid producing recipe may expose **Reuse settings** in the existing Continue hierarchy and navigate to `/create?recipe=<job-id>`. Existing media-primary layout, continuation and Actions hierarchy remain authoritative. UI-056's conditional **Compare source** extension is **not implemented**: before comparison code is written, the required desktop+narrow visual design checkpoint must be reviewed for image→image and image→video cases while keeping the result primary and existing Viewer actions intact.
''')

          Path('docs/architecture/PRODUCT_CAPABILITIES.md').write_text(Path('docs/architecture/PRODUCT_CAPABILITIES.md').read_text() + '''

### Phase 16 Creative Iteration — 16A–16C verified in RenderLab
Successful durable generation history can now be reused as **current-valid product intent** without claiming historical provider replay.

- `src/server/generation/generation-recipe.ts` is the shared server boundary for historical request reconstruction. It reloads the job under owner scope, parses persisted prompt/output/inputs/Advanced state through the current request contract, verifies operation/output consistency and revalidates current image input ownership/readiness.
- Existing narrow legacy Video compatibility remains deliberate: obsolete historical Video `steps`/`guidance` are removed before current validation rather than resurfaced as controls or replayed to workers.
- **Reuse Settings** resolves a successful current-valid recipe into editable Create state. Stable aliases, semantic roles and the exact current-valid source identity are preserved. Opening the recipe creates no new job and sends no backend generation request.
- Ready same-owner historical `temporary-source` inputs remain valid compatibility inputs when their current row/object is still available. They are previewed through an authenticated product redirect and remain temporary; the browser never receives their R2 key.
- **Run Again** is succeeded-only and server-owned. It reconstructs the same current-valid product request and calls ordinary `submitGeneration`, so current admission, routing and defaults apply. Each explicit request creates a distinct attempt; the historical row is immutable and worker/provider/workflow/model/failover metadata is excluded.
- Failed-job **Retry** remains recovery-only, successful **Run Again** remains iteration, and active **Cancel** remains lifecycle control. These are intentionally separate product actions.
- Exact configured verification head `5c9008c974c9b096fd484b3e5546c613880ff79a` passed the dedicated Creative Iteration run `33959979016` and all 26 affected workflows. The focused run verified privacy, no implicit dispatch, editable Image/Video/Advanced prefill, ready temporary references, fail-closed unavailable references, distinct immutable Run Again attempts and admission denial with exact cleanup.
- Conditional Viewer **Compare source** remains unimplemented pending the UI-056 desktop+narrow design checkpoint. Variations remains deferred because current product/worker execution still has one-output semantics.
''')

          Path('docs/architecture/FRONTEND_ARCHITECTURE.md').write_text(Path('docs/architecture/FRONTEND_ARCHITECTURE.md').read_text() + '''

### Phase 16 successful-history recipe boundary — 16A–16C implemented / verified
Phase 16 extends existing routes without introducing a recipe store, global client job store or new top-level surface. `/create?recipe=<job-id>` is untrusted navigation intent: the Create Server Component resolves it only after verified account lookup and delegates owner-scoped/current-valid reconstruction to `src/server/generation/generation-recipe.ts`. The Client Component receives already-sanitized product recipe state and remains responsible only for editable composer interaction; loading recipe state never submits generation.

Historical input identity remains opaque and exact. Durable inputs continue through ordinary `media-asset` product URLs. Still-ready historical `temporary-source` compatibility inputs can render through `/api/assets/reference/[sourceId]/content`, which re-authenticates the account, reloads the owner-scoped ready source and issues only a short-lived signed redirect. R2 keys never become browser product identity.

Activity keeps server-rendered history and derives `canRunAgain` server-side. `POST /api/generation/jobs/[jobId]/run-again` accepts only the opaque job ID, reconstructs the current-valid product request server-side and calls the ordinary submission/admission path. `ActivityRunAgainButton` owns only transient mutation feedback and refresh; it does not become a job store. Failed Retry, successful Run Again and active Cancel retain separate routes/eligibility.

No routing hierarchy, schema, provider contract or production deployment boundary changed. Viewer Compare source remains outside implemented architecture until its required UI-056 design checkpoint is reviewed.
''')

          Path('docs/architecture/INFRASTRUCTURE.md').write_text(Path('docs/architecture/INFRASTRUCTURE.md').read_text() + '''

### Phase 16 Creative Iteration configured verification
Phase 16A–16C add no production infrastructure, schema migration, scheduler or provider-routing change. Their dedicated `.github/workflows/creative-iteration.yml` is development/verification infrastructure only. It builds the production app, runs UI purity, starts a local mock external generation backend, and exercises authenticated browser/API behavior against run-owned rows/objects in the approved shared Supabase/R2 resources.

The workflow owns real mutable fixtures, so its concurrency group is serialized per PR/ref with `cancel-in-progress: false`; a superseding commit must not interrupt cleanup and strand shared database/R2 state merely to save hosted minutes. `scripts/verify-creative-iteration.mjs` uses deterministic configured test-account namespaces, records no production user data, and always deletes the run-owned Auth/database/R2 fixtures. Exact run `33959979016` cleaned owner assets/sources/objects plus the foreign-owner fixture and then passed a separate cleanup-only step. This CI workflow does not authorize production generation, a Vercel deployment or scheduler activation.
''')
          PY

          git diff --check
          grep -Fq 'PHASE 16A/16B/16C IMPLEMENTED / VERIFIED; PHASE 16D DESIGN CHECKPOINT PENDING' PROJECT.md
          grep -Fq '16D Compare source' docs/ui/UI_MIGRATION.md
          grep -Fq 'Compare source pending design' docs/ui/SCREEN_REGISTRY.md
          grep -Fq 'Phase 16 Creative Iteration — 16A–16C verified in RenderLab' docs/architecture/PRODUCT_CAPABILITIES.md
          grep -Fq 'Phase 16 successful-history recipe boundary' docs/architecture/FRONTEND_ARCHITECTURE.md
          grep -Fq 'Phase 16 Creative Iteration configured verification' docs/architecture/INFRASTRUCTURE.md

          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/architecture/PRODUCT_CAPABILITIES.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/INFRASTRUCTURE.md
          git commit -m "Record verified Phase 16 creative iteration progress"
          git push origin HEAD:"$TARGET_BRANCH"

name: Phase 16 Documentation Sync

on:
  push:
    branches: [noop]
    paths:
      - ".github/workflows/phase16-doc-sync.yml"
      - ".github/phase16-doc-sync.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: work/phase-16-creative-iteration
      EXPECTED_HEAD: 5c9008c974c9b096fd484b3e5546c613880ff79a
    steps:
      - name: Checkout helper source
        uses: actions/checkout@v4
        with:
          ref: noop
          fetch-depth: 0

      - name: Preserve patch helper
        shell: bash
        run: cp .github/phase16-doc-sync.py /tmp/phase16-doc-sync.py

      - name: Update verified Phase 16 repository record
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python /tmp/phase16-doc-sync.py
          git diff --check
          grep -Fq 'PHASE 16A/16B/16C IMPLEMENTED / VERIFIED; PHASE 16D DESIGN CHECKPOINT PENDING' PROJECT.md
          grep -Fq '16D Compare source' docs/ui/UI_MIGRATION.md
          grep -Fq 'Compare source pending design' docs/ui/SCREEN_REGISTRY.md
          grep -Fq 'Phase 16 Creative Iteration — 16A–16C verified in RenderLab' docs/architecture/PRODUCT_CAPABILITIES.md
          grep -Fq 'Phase 16 successful-history recipe boundary' docs/architecture/FRONTEND_ARCHITECTURE.md
          grep -Fq 'Phase 16 Creative Iteration configured verification' docs/architecture/INFRASTRUCTURE.md
          git config user.name "RenderLab Automation"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/SCREEN_REGISTRY.md docs/architecture/PRODUCT_CAPABILITIES.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/architecture/INFRASTRUCTURE.md
          git commit -m "Record verified Phase 16 creative iteration progress"
          git push origin HEAD:"$TARGET_BRANCH"

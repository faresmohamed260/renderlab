name: Plan Cycle 4 kinetic visual experience

on:
  push:
    branches:
      - plan/cycle4-kinetic-visual-experience

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/cycle4-kinetic-visual-experience
          fetch-depth: 0

      - name: Apply planning documentation
        run: python .github/scripts/plan-cycle4-kinetic.py

      - name: Validate documentation diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "PROJECT.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md docs/ui/UI_SYSTEM.md "

      - name: Commit plan and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/plan-cycle4-kinetic-visual-experience.yml .github/scripts/plan-cycle4-kinetic.py
          git add PROJECT.md docs/ui/UI_MIGRATION.md docs/ui/UI_DECISIONS.md docs/ui/UI_SYSTEM.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Plan Cycle 4 kinetic visual experience"
          git push origin HEAD:plan/cycle4-kinetic-visual-experience

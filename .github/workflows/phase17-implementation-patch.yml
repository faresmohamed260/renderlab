name: Phase 17 implementation patch

on:
  push:
    branches:
      - work/phase-17-observability-quality
    paths:
      - .github/phase17-implementation-patch.py
      - .github/workflows/phase17-implementation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-17-observability-quality
          fetch-depth: 0

      - name: Apply Phase 17 implementation patch
        run: python .github/phase17-implementation-patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit implementation and remove patch helpers
        shell: bash
        run: |
          git config user.name "Fares Mohamed"
          git config user.email "121525183+faresmohamed260@users.noreply.github.com"
          git rm .github/phase17-implementation-patch.py .github/workflows/phase17-implementation-patch.yml
          git add -A
          git diff --cached --check
          git commit -m "Implement Phase 17 observability and engineering quality"
          git push origin HEAD:work/phase-17-observability-quality

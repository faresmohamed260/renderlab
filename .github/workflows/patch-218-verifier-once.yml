name: Patch #218 verifier once

on:
  push:
    branches:
      - account/218-email-identity
    paths:
      - .github/workflows/patch-218-verifier-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account/218-email-identity
          fetch-depth: 0
      - name: Remove destructive provider-direct preflight
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/verify-email-identity-change.mjs")
          text = path.read_text()
          replacements = [
              (
                  '''  mfa: {\n    id: fixtureUuid("mfa-user"),\n  },\n  directProbe: {\n    id: fixtureUuid("direct-probe-user"),\n  },\n};''',
                  '''  mfa: {\n    id: fixtureUuid("mfa-user"),\n  },\n};''',
              ),
              (
                  '''  for (const userId of [fixtures.nonMfa.id, fixtures.mfa.id, fixtures.directProbe.id]) {''',
                  '''  for (const userId of [fixtures.nonMfa.id, fixtures.mfa.id]) {''',
              ),
              (
                  '''    mfaOld: gmailAlias(ownedInbox, "rl218-mfa-old"),\n    mfaNew: gmailAlias(ownedInbox, "rl218-mfa-new"),\n    directOld: gmailAlias(ownedInbox, "rl218-direct-old"),\n    directNew: gmailAlias(ownedInbox, "rl218-direct-new"),\n  };\n  const nonMfaPassword = makePassword("non-mfa");\n  const mfaPassword = makePassword("mfa");\n  const directPassword = makePassword("direct");''',
                  '''    mfaOld: gmailAlias(ownedInbox, "rl218-mfa-old"),\n    mfaNew: gmailAlias(ownedInbox, "rl218-mfa-new"),\n  };\n  const nonMfaPassword = makePassword("non-mfa");\n  const mfaPassword = makePassword("mfa");''',
              ),
              (
                  '''  // Provider-direct non-MFA initiation is intentionally documented as bypassing\n  // RenderLab's current-password defense-in-depth while still requiring the\n  // provider's Secure Email Change confirmations.\n  await createAuthUser(fixtures.directProbe.id, emails.directOld, directPassword, "email-identity-direct-probe");\n  const directClient = createUserClient();\n  await signIn(directClient, emails.directOld, directPassword);\n  const directStart = await directClient.auth.updateUser({ email: emails.directNew });\n  assert(!directStart.error, "Direct provider AAL1 email-change initiation unexpectedly failed for a non-MFA user.");\n  assert((await readAuthUser(fixtures.directProbe.id)).email?.toLowerCase() === emails.directOld.toLowerCase(), "Direct provider initiation changed canonical email before confirmations.");\n  await deleteRawUser(fixtures.directProbe.id);\n  console.log("RENDERLAB_218_NON_MFA_DIRECT_AAL1_INITIATION_CONFIRMED=true");\n\n''',
                  '''  // The provider-direct non-MFA bypass is a documented Supabase limitation.\n  // Do not initiate it in this configured verifier: doing so consumes the same\n  // hosted Auth email quota needed by the actual RenderLab acceptance flow.\n\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one source match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text)
      - name: Commit verifier correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-email-identity-change.mjs
          git diff --cached --check
          git commit -m "test: isolate email identity acceptance quota"
          git push origin HEAD:account/218-email-identity

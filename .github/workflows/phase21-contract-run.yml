name: Phase 21 contract helper

on:
  push:
    branches:
      - plan/phase-21-library-viewer-spatial
    paths:
      - ".github/workflows/phase21-contract-run.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Guard exact planning baseline and helper-only staging
        shell: bash
        run: |
          base="6c57a21514d58924f59623177891b98fff925a8c"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' .github/phase21-contract.py .github/workflows/phase21-contract-docs.yml .github/workflows/phase21-contract-run.yml | sort)"
          test "$changed" = "$expected"

      - name: Apply Phase 21 contract patch
        id: patch
        shell: bash
        run: |
          python .github/phase21-contract.py
          git diff --check
          git status --short

      - name: Commit diagnostic on patch failure
        if: failure()
        shell: bash
        run: |
          if [ -f .github/phase21-contract-error.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/phase21-contract-error.txt
            git commit -m "chore: record Phase 21 contract helper error" || true
            git push origin HEAD:plan/phase-21-library-viewer-spatial || true
          fi

      - name: Commit contract and remove helpers
        if: success()
        shell: bash
        run: |
          rm -f .github/phase21-contract.py .github/phase21-contract-error.txt .github/workflows/phase21-contract-docs.yml .github/workflows/phase21-contract-run.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' PROJECT.md docs/architecture/FRONTEND_ARCHITECTURE.md docs/ui/SCREEN_REGISTRY.md docs/ui/UI_DECISIONS.md docs/ui/UI_MIGRATION.md docs/ui/UI_SYSTEM.md | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: accept Phase 21 spatial media contract"
          git push origin HEAD:plan/phase-21-library-viewer-spatial

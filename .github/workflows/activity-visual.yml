name: Activity Visual

on:
  pull_request:
    paths:
      - "scripts/lib/configured-test-account.mjs"
      - "scripts/verify-activity.mjs"
      - ".github/workflows/activity-visual.yml"
      - ".github/actions/setup-node-project/action.yml"
      - "scripts/start-ci-app.mjs"
      - "components.json"
      - "package.json"
      - "src/app/globals.css"
      - "src/components/ui/**"
      - "src/lib/utils.ts"
      - "src/lib/supabase/**"
      - "src/lib/capabilities/generation.ts"
      - "src/lib/api/generation-contract.ts"
      - "src/lib/api/generation-activity-contract.ts"
      - "src/lib/api/generation-retry-contract.ts"
      - "src/app/(app)/activity/**"
      - "src/app/api/generation/jobs/**"
      - "src/features/activity/**"
      - "src/server/data/**"
      - "src/server/media/media-assets.ts"
      - "src/server/generation/generation-activity.ts"
      - "src/server/generation/retry-generation.ts"
      - "src/server/generation/submit-generation.ts"
      - "src/server/generation/generation-admission.ts"
      - "src/server/generation/poll-generation.ts"
      - "src/server/generation/native-generation.ts"
      - "src/server/observability/**"
      - "supabase/migrations/0002_generation_jobs_media_assets.sql"
      - "supabase/migrations/0004_core_account_ownership_prepare.sql"
      - "supabase/migrations/0005_core_account_ownership_enforce.sql"
      - "supabase/migrations/0009_media_asset_deletion.sql"
      - "supabase/migrations/0012_renderlab_generation_admission.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Erz_UUs49DgHHDkFoXfztA_m6CbHTqw
      RENDERLAB_TEST_BASE_URL: http://127.0.0.1:3000
      RENDERLAB_GENERATION_BACKEND_URL: http://127.0.0.1:3010
      RENDERLAB_GENERATION_BACKEND_TOKEN: renderlab-activity-retry-ci-token
      RENDERLAB_TEST_GENERATION_ADMISSION_BYPASS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required shared-resource secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured for RenderLab."
            exit 1
          fi

      - name: Set up Node project
        uses: ./.github/actions/setup-node-project

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start configured application
        shell: bash
        run: >-
          node scripts/start-ci-app.mjs
          --port 3000
          --health-url http://127.0.0.1:3000/activity
          --log-file "$RUNNER_TEMP/renderlab-next.log"
          --pid-file "$RUNNER_TEMP/renderlab-next.pid"
          --timeout-ms 60000

      - name: Render configured Activity lifecycle
        run: node scripts/verify-activity.mjs

      - name: Cleanup Activity fixtures
        if: always()
        run: node scripts/verify-activity.mjs --cleanup-only

      - name: Print server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/renderlab-next.log" || true

      - name: Upload Activity screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderlab-activity-screenshots
          path: artifacts/activity-*.png
          if-no-files-found: warn
          retention-days: 14

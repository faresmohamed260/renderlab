name: Phase 13C Email Templates

on:
  push:
    branches: [work/phase-13c-email-templates]
    paths:
      - ".github/workflows/phase-13c-email-templates.yml"

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SUPABASE_PROJECT_REF: rashyleshocuvpgcooxy
      SUPABASE_URL: https://rashyleshocuvpgcooxy.supabase.co
      SITE_URL: https://renderlab.faresuniform.uk
      INVITE_REDIRECT: https://renderlab.faresuniform.uk/settings
      RECOVERY_REDIRECT: https://renderlab.faresuniform.uk/auth/confirm?type=recovery&next=/settings/password
      SENDER_DOMAIN: mail.renderlab.faresuniform.uk
      FROM_EMAIL: noreply@mail.renderlab.faresuniform.uk
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "587"
      AUTH_EMAIL_RATE_LIMIT: "30"
      INVITE_SUBJECT: "You're invited to RenderLab"
      RECOVERY_SUBJECT: "Reset your RenderLab password"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify provider and production Auth baseline
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY; do
            test -n "${!name:-}" || { echo "${name}_PRESENT=false"; exit 1; }
            echo "${name}_PRESENT=true"
          done
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            'https://api.resend.com/domains' -o /tmp/resend-domains.json
          python - <<'PY'
          import json, os
          rows=json.load(open('/tmp/resend-domains.json')).get('data') or []
          target=os.environ['SENDER_DOMAIN'].lower().rstrip('.')
          exact=[r for r in rows if str(r.get('name') or '').lower().rstrip('.')==target]
          if len(exact)!=1: raise SystemExit('Expected one exact Resend domain')
          domain_id=str(exact[0]['id'])
          open('/tmp/resend-domain-id','w').write(domain_id)
          PY
          domain_id="$(cat /tmp/resend-domain-id)"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            "https://api.resend.com/domains/${domain_id}" -o /tmp/resend-domain.json
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          curl --fail-with-body --silent --show-error --user-agent 'RenderLab-Phase13C-Templates/1.0' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$endpoint" -o /tmp/auth-before.json
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/resend-domain.json'))
          if r.get('status')!='verified': raise SystemExit('Resend domain is not verified')
          if r.get('open_tracking') is not False or r.get('click_tracking') is not False:
              raise SystemExit('Resend tracking is not disabled')
          a=json.load(open('/tmp/auth-before.json'))
          expected={
            'site_url':os.environ['SITE_URL'],
            'smtp_host':os.environ['SMTP_HOST'],
            'smtp_admin_email':os.environ['FROM_EMAIL'],
          }
          for k,v in expected.items():
              if str(a.get(k) or '')!=v: raise SystemExit(f'Unexpected Auth baseline: {k}')
          if str(a.get('smtp_port'))!=os.environ['SMTP_PORT']: raise SystemExit('Unexpected SMTP port')
          if int(a.get('rate_limit_email_sent') or -1)!=int(os.environ['AUTH_EMAIL_RATE_LIMIT']): raise SystemExit('Unexpected email rate limit')
          allow=a.get('uri_allow_list'); allow=[x.strip() for x in allow.split(',')] if isinstance(allow,str) else list(allow or [])
          for u in (os.environ['INVITE_REDIRECT'],os.environ['RECOVERY_REDIRECT']):
              if u not in allow: raise SystemExit('Required production redirect missing')
          print('RESEND_DOMAIN_VERIFIED=true')
          print('RESEND_OPEN_TRACKING=false')
          print('RESEND_CLICK_TRACKING=false')
          print('SUPABASE_RESEND_SMTP_BASELINE_OK=true')
          print('SUPABASE_REQUIRED_REDIRECTS_PRESERVED=true')
          print('INVITE_TEMPLATE_CONFIRMATION_URL_BEFORE=' + str('{{ .ConfirmationURL }}' in str(a.get('mailer_templates_invite_content') or '')).lower())
          print('RECOVERY_TEMPLATE_CONFIRMATION_URL_BEFORE=' + str('{{ .ConfirmationURL }}' in str(a.get('mailer_templates_recovery_content') or '')).lower())
          PY

      - name: Verify approved production brand mark is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/renderlab-mark.svg --dump-header /tmp/renderlab-mark.headers \
            "${SITE_URL}/renderlab-mark.svg"
          grep -q '<svg' /tmp/renderlab-mark.svg
          grep -qi '^content-type:.*svg' /tmp/renderlab-mark.headers
          echo 'RENDERLAB_EMAIL_MARK_REACHABLE=true'

      - name: Build and install professional invite and recovery templates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os

          invite_url='{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/settings'
          recovery_url='{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/settings/password'

          def shell(*, eyebrow, title, lead, cta, url, security):
              safe_url=url.replace('&','&amp;')
              return f'''<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#090a0c;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#090a0c;margin:0;padding:0;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;border-collapse:separate;background:#111318;border:1px solid #2b303a;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="height:5px;background:#7c6cf2;font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:30px 32px 10px 32px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td valign="middle" style="padding-right:12px;">
                      <img src="{{{{ .SiteURL }}}}/renderlab-mark.svg" width="42" height="42" alt="RenderLab logo" style="display:block;width:42px;height:42px;border:0;outline:none;text-decoration:none;border-radius:11px;" />
                    </td>
                    <td valign="middle" style="font-size:20px;line-height:26px;font-weight:700;letter-spacing:-0.3px;color:#f4f5f7;">RenderLab</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px 32px;">
                <div style="font-size:12px;line-height:18px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#9ca3af;">{eyebrow}</div>
                <h1 style="margin:10px 0 14px 0;font-size:30px;line-height:37px;font-weight:700;letter-spacing:-0.7px;color:#f4f5f7;">{title}</h1>
                <p style="margin:0 0 24px 0;font-size:16px;line-height:25px;color:#c7cbd2;">{lead}</p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 26px 0;">
                  <tr>
                    <td bgcolor="#7c6cf2" style="border-radius:10px;background:#7c6cf2;">
                      <a href="{safe_url}" style="display:inline-block;padding:13px 20px;font-size:15px;line-height:20px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">{cta}</a>
                    </td>
                  </tr>
                </table>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#171a20;border:1px solid #2b303a;border-radius:12px;">
                  <tr>
                    <td style="padding:15px 16px;font-size:13px;line-height:20px;color:#9ca3af;">{security}</td>
                  </tr>
                </table>
                <p style="margin:24px 0 7px 0;font-size:12px;line-height:18px;color:#737b88;">If the button does not work, copy and paste this secure link into your browser:</p>
                <p style="margin:0;font-size:12px;line-height:18px;word-break:break-all;color:#a9a2ff;"><a href="{safe_url}" style="color:#a9a2ff;text-decoration:underline;word-break:break-all;">{safe_url}</a></p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #2b303a;font-size:12px;line-height:18px;color:#737b88;">RenderLab &nbsp;&middot;&nbsp; Secure account email<br />This automated message contains no marketing or tracking links.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>'''

          invite=shell(
              eyebrow='Private beta invitation',
              title='Your RenderLab invitation is ready',
              lead='You have been invited to join RenderLab. Accept the invitation to finish setting up your account and enter the private beta.',
              cta='Accept invitation',
              url=invite_url,
              security='This invitation is intended only for the recipient. The secure link is time-limited and can only be used once. If you were not expecting this invitation, you can ignore this email.',
          )
          recovery=shell(
              eyebrow='Account security',
              title='Reset your RenderLab password',
              lead='We received a request to reset the password for your RenderLab account. Use the secure link below to choose a new password.',
              cta='Reset password',
              url=recovery_url,
              security='For your security, this reset link is time-limited and can only be used once. If you did not request a password reset, you can safely ignore this email.',
          )

          patch={
              'mailer_subjects_invite':os.environ['INVITE_SUBJECT'],
              'mailer_templates_invite_content':invite,
              'mailer_subjects_recovery':os.environ['RECOVERY_SUBJECT'],
              'mailer_templates_recovery_content':recovery,
          }
          json.dump(patch,open('/tmp/template-patch.json','w'))
          open('/tmp/invite-template.html','w').write(invite)
          open('/tmp/recovery-template.html','w').write(recovery)
          print('INVITE_TEMPLATE_BYTES=' + str(len(invite.encode())))
          print('RECOVERY_TEMPLATE_BYTES=' + str(len(recovery.encode())))
          PY

          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          code="$(curl --silent --show-error --user-agent 'RenderLab-Phase13C-Templates/1.0' \
            --output /tmp/template-patch-response.json --write-out '%{http_code}' --request PATCH \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" --header 'content-type: application/json' \
            --data-binary @/tmp/template-patch.json "$endpoint")"
          echo "SUPABASE_TEMPLATE_PATCH_HTTP=${code}"
          test "$code" = 200

      - name: Read back exact template and link contract
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          curl --fail-with-body --silent --show-error --user-agent 'RenderLab-Phase13C-Templates/1.0' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$endpoint" -o /tmp/auth-after.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/auth-after.json'))
          invite=str(d.get('mailer_templates_invite_content') or '')
          recovery=str(d.get('mailer_templates_recovery_content') or '')
          if d.get('mailer_subjects_invite')!=os.environ['INVITE_SUBJECT']: raise SystemExit('Invite subject mismatch')
          if d.get('mailer_subjects_recovery')!=os.environ['RECOVERY_SUBJECT']: raise SystemExit('Recovery subject mismatch')
          expected_invite='{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite&amp;next=/settings'
          expected_recovery='{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/settings/password'
          for name,body,want in [('invite',invite,expected_invite),('recovery',recovery,expected_recovery)]:
              if want not in body: raise SystemExit(f'{name} exact token-hash URL missing')
              if '{{ .ConfirmationURL }}' in body: raise SystemExit(f'{name} still contains ConfirmationURL')
              if '{{ .TokenHash }}' not in body or '{{ .SiteURL }}' not in body: raise SystemExit(f'{name} token variables missing')
              if '{{ .SiteURL }}/renderlab-mark.svg' not in body: raise SystemExit(f'{name} approved brand mark missing')
              for forbidden in ('resend.com','brevo.com','supabase.co/auth/v1/verify'):
                  if forbidden in body.lower(): raise SystemExit(f'{name} contains forbidden provider link: {forbidden}')
              for required in ('RenderLab','role="presentation"','#7c6cf2','copy and paste this secure link'):
                  if required not in body: raise SystemExit(f'{name} shell requirement missing: {required}')
          if str(d.get('smtp_host') or '')!=os.environ['SMTP_HOST']: raise SystemExit('SMTP host changed during template patch')
          if str(d.get('smtp_port'))!=os.environ['SMTP_PORT']: raise SystemExit('SMTP port changed during template patch')
          if str(d.get('smtp_admin_email') or '')!=os.environ['FROM_EMAIL']: raise SystemExit('From identity changed during template patch')
          if int(d.get('rate_limit_email_sent') or -1)!=int(os.environ['AUTH_EMAIL_RATE_LIMIT']): raise SystemExit('Email rate limit changed')
          if d.get('site_url')!=os.environ['SITE_URL']: raise SystemExit('Site URL changed')
          print('INVITE_TEMPLATE_READBACK_OK=true')
          print('RECOVERY_TEMPLATE_READBACK_OK=true')
          print('CONFIRMATION_URL_REMOVED=true')
          print('TOKEN_HASH_LINK_CONTRACT_OK=true')
          print('RENDERLAB_EMAIL_SHELL_OK=true')
          print('SUPABASE_RESEND_SMTP_PRESERVED=true')
          PY

      - name: Set up Node for no-send generate-link verification
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate invite and recovery tokens without sending, then clean fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto'
          import { createClient } from '@supabase/supabase-js'

          const url=process.env.SUPABASE_URL
          const key=process.env.SUPABASE_SERVICE_ROLE_KEY
          const run=`${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`
          const inviteEmail=`renderlab-phase13c-invite-${run}@example.com`
          const recoveryEmail=`renderlab-phase13c-recovery-${run}@example.com`
          const supabase=createClient(url,key,{auth:{autoRefreshToken:false,persistSession:false}})
          const owned=new Set()
          try {
            const invite=await supabase.auth.admin.generateLink({type:'invite',email:inviteEmail})
            if (invite.error) throw invite.error
            if (!invite.data?.properties?.hashed_token || !invite.data?.properties?.action_link) throw new Error('Invite generateLink missing token properties')
            if (invite.data.user?.id) owned.add(invite.data.user.id)

            const password=crypto.randomBytes(32).toString('base64url')+'!Aa9'
            const created=await supabase.auth.admin.createUser({email:recoveryEmail,password,email_confirm:true})
            if (created.error) throw created.error
            if (!created.data?.user?.id) throw new Error('Recovery fixture user missing')
            owned.add(created.data.user.id)
            const recovery=await supabase.auth.admin.generateLink({type:'recovery',email:recoveryEmail})
            if (recovery.error) throw recovery.error
            if (!recovery.data?.properties?.hashed_token || !recovery.data?.properties?.action_link) throw new Error('Recovery generateLink missing token properties')

            for (const [name,result] of [['invite',invite.data],['recovery',recovery.data]]) {
              const action=String(result.properties.action_link||'')
              if (!action.startsWith(`${url}/auth/v1/verify?`)) throw new Error(`${name} unexpected generated action-link origin`)
              if (action.includes('renderlab.faresuniform.uk')) throw new Error(`${name} generateLink unexpectedly rendered app template`)
            }
            console.log('SUPABASE_GENERATE_LINK_INVITE_OK=true')
            console.log('SUPABASE_GENERATE_LINK_RECOVERY_OK=true')
            console.log('SUPABASE_GENERATE_LINK_SENT_EMAIL=false')
          } finally {
            for (const id of owned) {
              const deleted=await supabase.auth.admin.deleteUser(id)
              if (deleted.error) throw deleted.error
            }
            const listed=await supabase.auth.admin.listUsers({page:1,perPage:1000})
            if (listed.error) throw listed.error
            const residue=(listed.data?.users||[]).filter(u=>u.email===inviteEmail||u.email===recoveryEmail)
            if (residue.length) throw new Error('Phase 13C Auth fixture cleanup failed')
            console.log('PHASE13C_AUTH_FIXTURE_RESIDUE=0')
          }
          NODE

      - name: Verify invalid and hostile confirmation links fail closed on production
        shell: bash
        run: |
          set -euo pipefail
          for test_url in \
            "${SITE_URL}/auth/confirm?token_hash=invalid-phase13c&type=invite&next=https://evil.example" \
            "${SITE_URL}/auth/confirm?token_hash=invalid-phase13c&type=recovery&next=https://evil.example" \
            "${SITE_URL}/auth/confirm?token_hash=invalid-phase13c&type=magiclink&next=https://evil.example"; do
            curl --silent --show-error --output /dev/null --dump-header /tmp/confirm.headers "$test_url"
            status="$(awk 'NR==1{print $2}' /tmp/confirm.headers | tr -d '\r')"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/confirm.headers)"
            test "$status" = 307
            case "$location" in
              /settings?auth=link_invalid) ;;
              *) echo "Unexpected fail-closed location: $location"; exit 1;;
            esac
            case "$location" in *evil.example*) exit 1;; esac
          done
          echo 'PRODUCTION_INVALID_AUTH_LINKS_FAIL_CLOSED=true'
          echo 'PRODUCTION_HOSTILE_NEXT_REJECTED=true'
          echo 'PHASE13C_REAL_AUTH_EMAIL_SENT=false'

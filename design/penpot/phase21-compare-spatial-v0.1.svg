<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
  <defs>
    <radialGradient id="bg" cx="50%" cy="10%" r="90%"><stop offset="0" stop-color="#221848"/><stop offset=".38" stop-color="#0a0b14"/><stop offset="1" stop-color="#050609"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".085"/><stop offset="1" stop-color="#fff" stop-opacity=".018"/></linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#335f97"/><stop offset=".58" stop-color="#1c355c"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63463f"/><stop offset=".55" stop-color="#35251f"/><stop offset="1" stop-color="#18120f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ac91ff"/><stop offset=".58" stop-color="#766fff"/><stop offset="1" stop-color="#58d3ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".5"/></filter>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f7f7fb}.muted{fill:#989aaa}.dim{fill:#6d7080}.title{font-size:30px;font-weight:650}.h2{font-size:22px;font-weight:640}.body{font-size:13px}.small{font-size:11px}.label{font-size:11px;font-weight:700;letter-spacing:.08em}.chip{font-size:11px;font-weight:620}</style>
  </defs>
  <rect width="1900" height="1280" fill="#050609"/>
  <text x="44" y="52" class="title">Phase 21 — Viewer Compare Spatial Choreography v0.1</text>
  <text x="44" y="78" class="body muted">UI-064 checkpoint · Result stays primary, Source remains contextual, reduced motion keeps the same complete layout</text>

  <!-- DESKTOP ACTIVE COMPARISON -->
  <g transform="translate(44 110)">
    <rect width="1320" height="1020" rx="28" fill="url(#bg)" stroke="#fff" stroke-opacity=".10"/>
    <ellipse cx="680" cy="340" rx="450" ry="260" fill="#6b54ff" opacity=".11" filter="url(#glow)"/>
    <rect x="18" y="18" width="176" height="984" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".10"/>
    <text x="40" y="58" class="label">RENDERLAB</text><text x="48" y="112" class="body muted">✦  Create</text><rect x="32" y="132" width="148" height="42" rx="13" fill="#9680ff" opacity=".15"/><text x="48" y="158" class="body">▦  Library</text>
    <rect x="216" y="18" width="1086" height="58" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity=".09"/><text x="242" y="52" class="small muted">Media Viewer · Comparison</text>
    <g transform="translate(238 104)">
      <text x="0" y="24" class="small muted">← Back to Library</text>
      <rect x="880" y="0" width="154" height="38" rx="12" fill="#fff" opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="905" y="24" class="chip">Close comparison</text>
      <!-- comparison stage -->
      <g transform="translate(0 54)" filter="url(#soft)">
        <rect width="1038" height="584" rx="25" fill="#0b0d14" fill-opacity=".78" stroke="#fff" stroke-opacity=".09"/>
        <!-- result 60% -->
        <g transform="translate(18 18)">
          <rect width="602" height="548" rx="20" fill="#07080d" stroke="#ad98ff" stroke-opacity=".28"/>
          <text x="18" y="30" class="label">RESULT</text><circle cx="574" cy="25" r="4" fill="#a88fff"/>
          <rect x="18" y="48" width="566" height="438" rx="17" fill="url(#result)"/>
          <ellipse cx="302" cy="268" rx="146" ry="112" fill="#7db9ff" opacity=".58"/><ellipse cx="256" cy="223" rx="54" ry="30" fill="#d9edff" opacity=".30"/>
          <text x="18" y="520" class="small muted">Generated image · 1536 × 1536</text><text x="450" y="520" class="small">Current media</text>
        </g>
        <!-- source 40% -->
        <g transform="translate(638 18)">
          <rect width="382" height="548" rx="20" fill="#0a0b10" stroke="#fff" stroke-opacity=".08"/>
          <text x="18" y="30" class="label muted">SOURCE</text>
          <rect x="18" y="48" width="346" height="346" rx="17" fill="url(#source)"/>
          <circle cx="190" cy="220" r="84" fill="#d49b79" opacity=".50"/><rect x="128" y="135" width="124" height="176" rx="62" fill="#432925" opacity=".36"/>
          <text x="18" y="426" class="body">Editorial ember portrait</text><text x="18" y="450" class="small muted">Source image · 1024 × 1024</text>
          <rect x="18" y="474" width="132" height="42" rx="13" fill="#fff" opacity=".055" stroke="#fff" stroke-opacity=".10"/><text x="48" y="500" class="chip">Open source</text>
          <text x="18" y="536" class="small dim">No management actions here.</text>
        </g>
      </g>
      <!-- result-owned rail beneath -->
      <g transform="translate(0 664)">
        <rect width="1038" height="214" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity=".09"/>
        <g transform="translate(22 24)"><text class="label">RESULT DETAILS</text><text y="30" class="small">A matte cobalt sphere suspended in spectral studio light…</text><text y="54" class="small muted">Image · 1536 × 1536 · FLUX</text></g>
        <line x1="384" y1="22" x2="384" y2="192" stroke="#fff" stroke-opacity=".08"/>
        <g transform="translate(410 24)"><text class="label">CONTINUE</text><rect y="20" width="120" height="42" rx="13" fill="url(#accent)" opacity=".76"/><text x="48" y="46" class="chip">Edit</text><rect x="132" y="20" width="120" height="42" rx="13" fill="#fff" opacity=".05"/><text x="164" y="46" class="chip">Animate</text><rect y="74" width="252" height="38" rx="12" fill="#fff" opacity=".035"/><text x="90" y="98" class="chip muted">Reuse settings</text></g>
        <line x1="694" y1="22" x2="694" y2="192" stroke="#fff" stroke-opacity=".08"/>
        <g transform="translate(720 24)"><text class="label">ACTIONS</text><text y="34" class="small muted">♡ Favorite · Collections</text><text y="62" class="small muted">Rename · Download</text><text y="90" class="small" fill="#ff8798">Delete</text><text y="132" class="small dim">All remain Result-owned.</text></g>
      </g>
      <g transform="translate(0 902)"><text class="label muted">OPEN/CLOSE MOTION</text><text x="142" class="small muted">Result expands/contracts from the default media stage while Source reveals beside it · 260–380ms bounded layout motion · no persistent animation.</text></g>
    </g>
  </g>

  <!-- MOBILE ACTIVE COMPARISON -->
  <g transform="translate(1400 110)">
    <rect width="390" height="1020" rx="30" fill="url(#bg)" stroke="#fff" stroke-opacity=".10"/>
    <ellipse cx="190" cy="205" rx="170" ry="135" fill="#6d56ff" opacity=".10" filter="url(#glow)"/>
    <text x="20" y="42" class="label">MEDIA VIEWER</text><text x="20" y="82" class="small muted">← Library</text><rect x="232" y="62" width="138" height="38" rx="12" fill="#fff" opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="252" y="86" class="chip">Close comparison</text>
    <!-- result full width first -->
    <rect x="18" y="116" width="354" height="404" rx="21" fill="#0b0d14" stroke="#ae98ff" stroke-opacity=".22"/>
    <text x="34" y="146" class="label">RESULT</text><rect x="32" y="164" width="326" height="306" rx="17" fill="url(#result)"/><ellipse cx="195" cy="316" rx="86" ry="66" fill="#7bb8ff" opacity=".58"/><text x="32" y="498" class="small muted">Image · 1536 × 1536</text>
    <!-- source compact contextual card -->
    <rect x="18" y="538" width="354" height="180" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".08"/>
    <text x="34" y="568" class="label muted">SOURCE</text><rect x="34" y="584" width="112" height="112" rx="14" fill="url(#source)"/><circle cx="90" cy="640" r="28" fill="#d49a78" opacity=".50"/>
    <text x="164" y="608" class="body">Editorial ember portrait</text><text x="164" y="632" class="small muted">Source image</text><text x="164" y="653" class="small muted">1024 × 1024</text><rect x="164" y="670" width="116" height="34" rx="11" fill="#fff" opacity=".055"/><text x="187" y="692" class="chip">Open source</text>
    <!-- result owned info/actions -->
    <text x="20" y="754" class="label">RESULT DETAILS</text><text x="20" y="780" class="small">A matte cobalt sphere suspended in spectral light…</text>
    <text x="20" y="820" class="label">CONTINUE</text><rect x="20" y="836" width="168" height="42" rx="13" fill="url(#accent)" opacity=".76"/><text x="86" y="862" class="chip">Edit</text><rect x="202" y="836" width="168" height="42" rx="13" fill="#fff" opacity=".05"/><text x="257" y="862" class="chip">Animate</text>
    <rect x="20" y="892" width="350" height="48" rx="14" fill="url(#glass)" stroke="#fff" stroke-opacity=".08"/><text x="34" y="918" class="small muted">♡ Favorite · Collections · Rename · Download</text>
    <rect x="58" y="958" width="274" height="42" rx="16" fill="#10121a" fill-opacity=".94" stroke="#fff" stroke-opacity=".09"/><text x="84" y="984" class="small muted">Create</text><text x="177" y="984" class="small">Library</text><text x="269" y="984" class="small muted">Activity</text>
  </g>

  <!-- REDUCED MOTION RULE -->
  <g transform="translate(44 1160)">
    <text class="label">REDUCED MOTION</text><text x="126" class="small muted">Same 60/40 desktop and Result-first mobile layouts switch immediately with opacity-only or no transition. Source/Result labels, hierarchy and actions do not rely on spatial movement.</text>
  </g>
</svg>

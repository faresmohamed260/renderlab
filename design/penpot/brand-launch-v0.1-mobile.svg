<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1510" viewBox="0 0 390 1510">
  <rect width="390" height="1510" fill="#090A0C"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .text { fill:#F4F5F7; } .muted { fill:#9CA3AF; }
    .eyebrow { fill:#B9B0FF; font-weight:650; letter-spacing:1.2px; }
  </style>
  <g transform="translate(20 22)" stroke="#7C6CF2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 0V28"/><path d="M0 3H13C21 3 26 7 26 13S21 22 13 22H0"/><path d="M13 22L26 28"/>
  </g>
  <rect x="31.5" y="33.5" width="5.3" height="5.3" rx="1.7" fill="#F4F5F7"/>
  <text x="57" y="43" class="text" font-size="17" font-weight="650">RenderLab</text>
  <rect x="284" y="17" width="86" height="38" rx="9" fill="#171A20" stroke="#2B303A"/>
  <text x="308" y="41" class="text" font-size="13" font-weight="600">Sign in</text>
  <text x="20" y="108" class="eyebrow" font-size="11">AI IMAGE + VIDEO WORKSPACE</text>
  <text x="20" y="159" class="text" font-size="42" font-weight="680" letter-spacing="-1.6">Create. Refine.</text>
  <text x="20" y="204" class="text" font-size="42" font-weight="680" letter-spacing="-1.6">Keep the thread.</text>
  <text x="20" y="248" class="muted" font-size="15">Generate images and video, edit with durable</text>
  <text x="20" y="270" class="muted" font-size="15">references, and keep your work in one loop.</text>
  <rect x="20" y="302" width="350" height="48" rx="11" fill="#7C6CF2"/>
  <text x="151" y="333" fill="#fff" font-size="15" font-weight="650">Open Create</text>
  <text x="20" y="378" class="muted" font-size="12">Closed beta · invited accounts sign in from Settings</text>
  <rect x="20" y="416" width="350" height="360" rx="20" fill="#111318" stroke="#2B303A"/>
  <text x="40" y="449" class="muted" font-size="11">CREATE</text>
  <rect x="281" y="432" width="66" height="25" rx="7" fill="#20242C"/>
  <text x="299" y="449" class="text" font-size="11">Image</text>
  <rect x="40" y="478" width="310" height="104" rx="14" fill="#0D0F13" stroke="#2B303A"/>
  <text x="56" y="504" class="muted" font-size="10">PROMPT</text>
  <text x="56" y="532" class="text" font-size="13">Refine @image1 with soft window light</text>
  <text x="56" y="552" class="text" font-size="13">and preserve the subject.</text>
  <text x="40" y="615" class="muted" font-size="10">REFERENCE</text>
  <rect x="40" y="630" width="82" height="82" rx="12" fill="#20242C"/>
  <path d="M49 688L67 670L81 680L94 662L112 688Z" fill="#7C6CF2" fill-opacity=".65"/>
  <text x="52" y="703" class="text" font-size="10">@image1</text>
  <rect x="135" y="630" width="215" height="38" rx="9" fill="#171A20"/>
  <text x="151" y="654" class="muted" font-size="11">4:5 · Advanced</text>
  <rect x="135" y="677" width="215" height="45" rx="10" fill="#7C6CF2"/>
  <text x="213" y="705" fill="#fff" font-size="13" font-weight="650">Generate</text>
  <text x="40" y="750" class="muted" font-size="10">Durable reference stays reusable in Library</text>
  <text x="20" y="835" class="eyebrow" font-size="11">FOUR VERIFIED OPERATIONS</text>
  <text x="20" y="872" class="text" font-size="27" font-weight="650">One workspace.</text>
  <text x="20" y="904" class="text" font-size="27" font-weight="650">Different creative intents.</text>
  <rect x="20" y="930" width="170" height="112" rx="15" fill="#111318" stroke="#2B303A"/>
  <text x="36" y="958" fill="#B9B0FF" font-size="10">01</text><text x="36" y="989" class="text" font-size="16" font-weight="650">Create Image</text><text x="36" y="1015" class="muted" font-size="11">prompt → result</text>
  <rect x="200" y="930" width="170" height="112" rx="15" fill="#111318" stroke="#2B303A"/>
  <text x="216" y="958" fill="#B9B0FF" font-size="10">02</text><text x="216" y="989" class="text" font-size="16" font-weight="650">Edit Image</text><text x="216" y="1015" class="muted" font-size="11">reference-aware</text>
  <rect x="20" y="1052" width="170" height="112" rx="15" fill="#111318" stroke="#2B303A"/>
  <text x="36" y="1080" fill="#B9B0FF" font-size="10">03</text><text x="36" y="1111" class="text" font-size="16" font-weight="650">Create Video</text><text x="36" y="1137" class="muted" font-size="11">prompt → video</text>
  <rect x="200" y="1052" width="170" height="112" rx="15" fill="#111318" stroke="#2B303A"/>
  <text x="216" y="1080" fill="#B9B0FF" font-size="10">04</text><text x="216" y="1111" class="text" font-size="16" font-weight="650">Animate Image</text><text x="216" y="1137" class="muted" font-size="11">image → motion</text>
  <rect x="20" y="1202" width="350" height="232" rx="18" fill="#111318" stroke="#2B303A"/>
  <text x="40" y="1234" class="eyebrow" font-size="10">KEEP THE CREATIVE LOOP</text>
  <text x="40" y="1270" class="text" font-size="22" font-weight="650">Create → Library → Activity</text>
  <text x="40" y="1297" class="muted" font-size="12">Durable media stays reusable. Real job history</text>
  <text x="40" y="1316" class="muted" font-size="12">keeps failed-job Retry within reach.</text>
  <rect x="40" y="1350" width="310" height="48" rx="10" fill="#171A20"/>
  <text x="71" y="1380" class="text" font-size="12">Closed beta · no public self-service signup</text>
  <text x="20" y="1470" class="muted" font-size="11">RenderLab · create, keep, continue</text>

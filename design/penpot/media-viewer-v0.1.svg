<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1080" viewBox="0 0 1740 1080">
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill:#F4F5F7 }
    .muted { fill:#9CA3AF }
    .title { font-size:28px; font-weight:600 }
    .body { font-size:14px }
    .label { font-size:12px; font-weight:600 }
    .small { font-size:11px }
  </style>
  <rect width="1740" height="1080" fill="#090A0C"/>
  <text x="54" y="54" class="title">Media Viewer v0.1 — contextual durable asset workspace</text>
  <text x="54" y="82" class="body muted">Media stays primary. Metadata is secondary. Continuation actions appear only after a stable cross-route Create handoff exists.</text>

  <g transform="translate(54,120)">
    <rect width="1170" height="900" rx="22" fill="#090A0C" stroke="#2B303A"/>
    <rect width="206" height="900" rx="22" fill="#111318"/>
    <text x="28" y="48" class="label">RenderLab</text>
    <rect x="16" y="78" width="174" height="40" rx="8" fill="#171A20"/>
    <text x="48" y="103" class="body muted">Create</text>
    <rect x="16" y="126" width="174" height="40" rx="8" fill="#20242C"/>
    <text x="48" y="151" class="body">Library</text>

    <rect x="206" width="964" height="56" fill="#0D0F13"/>
    <text x="230" y="35" class="label">Media Viewer</text>

    <g transform="translate(238,88)">
      <text x="0" y="24" class="small muted">← Back to Library</text>
      <g transform="translate(0,52)">
        <rect width="642" height="690" rx="16" fill="#111318" stroke="#2B303A"/>
        <rect x="22" y="22" width="598" height="646" rx="12" fill="#32465A"/>
        <circle cx="321" cy="338" r="138" fill="#536F8A"/>
      </g>
      <g transform="translate(670,52)">
        <text x="0" y="26" class="small muted">IMAGE</text>
        <text x="0" y="66" style="font-size:22px;font-weight:600">A blue sphere in soft studio light</text>
        <text x="0" y="94" class="small muted">Created today at 2:00 AM</text>

        <rect x="0" y="130" width="244" height="1" fill="#2B303A"/>
        <text x="0" y="162" class="label">Prompt</text>
        <text x="0" y="188" class="small">A clean studio photograph of a matte cobalt-blue</text>
        <text x="0" y="207" class="small">sphere centered on a warm gray background, soft even light…</text>

        <rect x="0" y="238" width="244" height="1" fill="#2B303A"/>
        <text x="0" y="270" class="label">Details</text>
        <text x="0" y="298" class="small muted">Type</text><text x="126" y="298" class="small">Image</text>
        <text x="0" y="324" class="small muted">Dimensions</text><text x="126" y="324" class="small">Shown when available</text>
        <text x="0" y="350" class="small muted">Model</text><text x="126" y="350" class="small">Optional metadata</text>

        <rect x="0" y="392" width="244" height="1" fill="#2B303A"/>
        <text x="0" y="424" class="label">Continue</text>
        <rect x="0" y="442" width="112" height="42" rx="9" fill="#7C6CF2"/>
        <text x="41" y="468" class="label">Edit</text>
        <rect x="124" y="442" width="120" height="42" rx="9" fill="#171A20" stroke="#2B303A"/>
        <text x="157" y="468" class="label">Animate</text>
        <text x="0" y="510" class="small muted">Action buttons are only enabled once the route-to-Create</text>
        <text x="0" y="529" class="small muted">durable media handoff contract is implemented.</text>
      </g>
    </g>
  </g>

  <g transform="translate(1280,120)">
    <rect width="390" height="844" rx="28" fill="#090A0C" stroke="#2B303A"/>
    <rect width="390" height="56" rx="28" fill="#0D0F13"/>
    <text x="20" y="35" class="label">Media Viewer</text>
    <text x="18" y="88" class="small muted">← Library</text>
    <rect x="18" y="110" width="354" height="354" rx="14" fill="#32465A"/>
    <circle cx="195" cy="287" r="84" fill="#536F8A"/>
    <text x="18" y="502" class="small muted">IMAGE</text>
    <text x="18" y="532" style="font-size:20px;font-weight:600">A blue sphere in soft studio light</text>
    <text x="18" y="558" class="small muted">Created today at 2:00 AM</text>
    <text x="18" y="601" class="label">Prompt</text>
    <text x="18" y="625" class="small">A clean studio photograph of a matte cobalt-blue</text>
    <text x="18" y="644" class="small">sphere centered on a warm gray background…</text>
    <rect x="18" y="680" width="171" height="44" rx="9" fill="#7C6CF2"/>
    <text x="91" y="707" class="label">Edit</text>
    <rect x="201" y="680" width="171" height="44" rx="9" fill="#171A20" stroke="#2B303A"/>
    <text x="258" y="707" class="label">Animate</text>
    <rect x="0" y="780" width="390" height="64" fill="#111318"/>
    <text x="49" y="818" class="small muted">Create</text>
    <text x="160" y="818" class="small">Library</text>
    <text x="279" y="818" class="small muted">Activity</text>
  </g>
</svg>

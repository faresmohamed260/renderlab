<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2100" viewBox="0 0 1920 2100">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050609"/><stop offset="0.62" stop-color="#080912"/><stop offset="1" stop-color="#0b0910"/></linearGradient>
    <radialGradient id="cool" cx="74%" cy="0%" r="90%"><stop stop-color="#6e58ff" stop-opacity=".14"/><stop offset=".48" stop-color="#556bff" stop-opacity=".035"/><stop offset="1" stop-color="#050609" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm" cx="100%" cy="0%" r="90%"><stop stop-color="#ff8a65" stop-opacity=".10"/><stop offset=".52" stop-color="#a24b56" stop-opacity=".025"/><stop offset="1" stop-color="#050609" stop-opacity="0"/></radialGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f5f5f7}.muted{fill:#989aa7}.dim{fill:#6e7180}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em}.micro{font-size:10px;font-weight:600;letter-spacing:.08em}.small{font-size:12px}.body{font-size:13px}.body14{font-size:14px}.h1{font-size:32px;font-weight:650;letter-spacing:-.03em}.h2{font-size:20px;font-weight:620;letter-spacing:-.015em}.id{font-size:22px;font-weight:600;letter-spacing:-.02em}.button{font-size:12px;font-weight:650}.nav{font-size:12px;font-weight:580}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.05em}.state{font-size:11px;font-weight:700;letter-spacing:.04em}
    </style>
  </defs>

  <rect width="1920" height="2100" fill="url(#canvas)"/>
  <text x="40" y="46" class="h2">Phase 27 — Settings / Account Security Trust Register v0.1</text>
  <text x="40" y="72" class="body muted">Desktop review checkpoint · UI-074 horizontal shell · Settings 1/4 expressiveness · synthetic identity data only</text>

  <!-- ACTIVE SETTINGS -->
  <g transform="translate(40 104)">
    <rect width="1840" height="700" rx="18" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="1840" height="700" rx="18" fill="url(#cool)"/>
    <line x1="0" y1="58" x2="1840" y2="58" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="26" y="36" class="eyebrow">RENDERLAB</text>
    <text x="174" y="36" class="nav muted">Create</text><text x="246" y="36" class="nav muted">Library</text><text x="318" y="36" class="nav muted">Activity</text>
    <rect x="382" y="14" width="72" height="30" rx="9" fill="#ffffff" fill-opacity=".055" stroke="#9b8cff" stroke-opacity=".18"/><text x="397" y="34" class="nav">Settings</text>
    <text x="1745" y="36" class="mono muted">ACCOUNT</text>

    <g transform="translate(198 105)">
      <text x="0" y="14" class="eyebrow muted">ACCOUNT / SETTINGS</text>
      <text x="0" y="57" class="h1">Settings</text>
      <text x="0" y="86" class="body muted">Identity, access and account security.</text>
      <path d="M1368 0a84 84 0 0 1 84 84" fill="none" stroke="#9384ff" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="1452" cy="84" r="3" fill="#9a8dff"/>

      <g transform="translate(0 130)">
        <line x1="0" y1="0" x2="1450" y2="0" stroke="#ffffff" stroke-opacity=".10"/>
        <text x="0" y="31" class="micro muted">01 · IDENTITY</text>
        <text x="190" y="34" class="id">maker@renderlab.test</text>
        <text x="190" y="61" class="small dim">Verified account identity</text>
      </g>

      <g transform="translate(0 224)">
        <line x1="0" y1="0" x2="1450" y2="0" stroke="#ffffff" stroke-opacity=".10"/>
        <text x="0" y="31" class="micro muted">02 · CLOSED BETA ACCESS</text>
        <circle cx="196" cy="28" r="5" fill="#77d9b4"/><text x="211" y="32" class="state">ACTIVE</text>
        <text x="190" y="61" class="body muted">This account has active access to private RenderLab work.</text>
        <text x="190" y="84" class="small dim">Access is verified by the server and cannot be edited here.</text>
      </g>

      <g transform="translate(0 344)">
        <line x1="0" y1="0" x2="1450" y2="0" stroke="#ffffff" stroke-opacity=".10"/>
        <text x="0" y="31" class="micro muted">03 · SECURITY</text>
        <text x="190" y="31" class="h2">Password</text>
        <text x="190" y="59" class="body muted">Change your password through the protected account flow.</text>
        <rect x="190" y="82" width="154" height="44" rx="11" fill="#8777ff" fill-opacity=".16" stroke="#aa9eff" stroke-opacity=".32"/><text x="215" y="109" class="button">Change password</text>
        <rect x="360" y="82" width="102" height="44" rx="11" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".10"/><text x="385" y="109" class="button">Sign out</text>
      </g>

      <g transform="translate(0 505)">
        <line x1="0" y1="0" x2="1450" y2="0" stroke="#ffffff" stroke-opacity=".10"/>
        <text x="0" y="31" class="micro muted">04 · PRIVILEGED CONTINUATION</text>
        <text x="190" y="31" class="body14">Admin operations</text>
        <text x="190" y="58" class="small muted">Shown only after a fresh active-admin identity check.</text>
        <text x="1302" y="35" class="button">Open Admin →</text>
      </g>
    </g>
    <text x="26" y="675" class="mono dim">ACTIVE / ADMIN-ELIGIBLE VARIANT · ordinary Settings remains primary; privileged continuation is subordinate</text>
  </g>

  <!-- SIGNED OUT -->
  <g transform="translate(40 842)">
    <rect width="890" height="570" rx="18" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="890" height="570" rx="18" fill="url(#cool)"/>
    <line x1="0" y1="54" x2="890" y2="54" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="22" y="33" class="eyebrow">RENDERLAB</text><text x="180" y="33" class="nav muted">Create</text><text x="250" y="33" class="nav muted">Library</text><text x="320" y="33" class="nav muted">Activity</text><text x="390" y="33" class="nav">Settings</text>
    <g transform="translate(124 94)">
      <text x="0" y="14" class="eyebrow muted">ACCOUNT / SETTINGS</text><text x="0" y="53" class="h1">Sign in</text>
      <text x="0" y="80" class="body muted">Access private RenderLab work with your invited account.</text>
      <line x1="0" y1="108" x2="642" y2="108" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="145" class="micro muted">EMAIL</text>
      <rect x="0" y="160" width="642" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="14" y="187" class="small dim">you@example.test</text>
      <text x="0" y="236" class="micro muted">PASSWORD</text>
      <rect x="0" y="251" width="642" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="14" y="278" class="small dim">••••••••••••</text>
      <rect x="0" y="321" width="642" height="44" rx="10" fill="#8a79ff" fill-opacity=".18" stroke="#b2a6ff" stroke-opacity=".34"/><text x="299" y="348" class="button">Sign in</text>
      <text x="0" y="398" class="button">Forgot password</text>
      <text x="642" y="398" text-anchor="end" class="small dim">Closed Beta · invitation only</text>
    </g>
    <text x="22" y="544" class="mono dim">SIGNED OUT · focused credentials; no public signup or request-access invention</text>
  </g>

  <!-- SUSPENDED -->
  <g transform="translate(990 842)">
    <rect width="890" height="570" rx="18" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="890" height="570" rx="18" fill="url(#warm)"/>
    <line x1="0" y1="54" x2="890" y2="54" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="22" y="33" class="eyebrow">RENDERLAB</text><text x="180" y="33" class="nav muted">Create</text><text x="250" y="33" class="nav muted">Library</text><text x="320" y="33" class="nav muted">Activity</text><text x="390" y="33" class="nav">Settings</text>
    <g transform="translate(106 94)">
      <text x="0" y="14" class="eyebrow muted">ACCOUNT / SETTINGS</text><text x="0" y="53" class="h1">Settings</text>
      <line x1="0" y1="82" x2="678" y2="82" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="119" class="micro muted">01 · IDENTITY</text><text x="172" y="122" class="h2">maker@renderlab.test</text>
      <line x1="0" y1="156" x2="678" y2="156" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="193" class="micro muted">02 · CLOSED BETA ACCESS</text><circle cx="178" cy="189" r="5" fill="#ff9c78"/><text x="193" y="193" class="state">SUSPENDED</text>
      <text x="172" y="222" class="body muted">Create, Library and Activity are currently paused for this account.</text><text x="172" y="245" class="small dim">Password recovery and sign out remain available.</text>
      <line x1="0" y1="280" x2="678" y2="280" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="317" class="micro muted">03 · SECURITY</text><text x="172" y="317" class="body14">Password</text>
      <rect x="172" y="344" width="154" height="44" rx="11" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/><text x="197" y="371" class="button">Change password</text>
      <rect x="342" y="344" width="102" height="44" rx="11" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".10"/><text x="367" y="371" class="button">Sign out</text>
    </g>
    <text x="22" y="544" class="mono dim">SUSPENDED · same geometry, truthful warm state; recovery controls stay available</text>
  </g>

  <!-- NORMAL PASSWORD -->
  <g transform="translate(40 1450)">
    <rect width="890" height="604" rx="18" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="890" height="604" rx="18" fill="url(#cool)" opacity=".72"/>
    <line x1="0" y1="54" x2="890" y2="54" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="22" y="33" class="eyebrow">RENDERLAB</text><text x="390" y="33" class="nav">Settings</text>
    <g transform="translate(124 90)">
      <text x="0" y="14" class="eyebrow muted">SETTINGS / PASSWORD</text><text x="0" y="54" class="h1">Change password</text>
      <text x="0" y="81" class="body muted">Confirm your current password before setting a new one.</text>
      <line x1="0" y1="108" x2="642" y2="108" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="142" class="micro muted">CURRENT PASSWORD</text><rect x="0" y="156" width="642" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/>
      <text x="0" y="230" class="micro muted">NEW PASSWORD</text><rect x="0" y="244" width="642" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="642" y="312" text-anchor="end" class="small dim">8 characters minimum</text>
      <text x="0" y="337" class="micro muted">CONFIRM NEW PASSWORD</text><rect x="0" y="351" width="642" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/>
      <rect x="0" y="425" width="158" height="44" rx="10" fill="#8978ff" fill-opacity=".18" stroke="#b2a6ff" stroke-opacity=".34"/><text x="26" y="452" class="button">Update password</text><text x="642" y="452" text-anchor="end" class="button">Back to Settings</text>
    </g>
    <text x="22" y="578" class="mono dim">NORMAL CHANGE · current-password reauthentication remains explicit</text>
  </g>

  <!-- RECOVERY PASSWORD -->
  <g transform="translate(990 1450)">
    <rect width="890" height="604" rx="18" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="890" height="604" rx="18" fill="url(#cool)" opacity=".72"/>
    <line x1="0" y1="54" x2="890" y2="54" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="22" y="33" class="eyebrow">RENDERLAB</text><text x="390" y="33" class="nav">Settings</text>
    <g transform="translate(124 90)">
      <text x="0" y="14" class="eyebrow muted">SETTINGS / PASSWORD · VERIFIED RECOVERY</text><text x="0" y="54" class="h1">Set a new password</text>
      <text x="0" y="81" class="body muted">This recovery link was verified for the signed-in account.</text>
      <g transform="translate(0 108)"><rect width="642" height="54" rx="10" fill="#7061e8" fill-opacity=".07" stroke="#9b8cff" stroke-opacity=".18"/><circle cx="18" cy="27" r="4" fill="#9b8cff"/><text x="32" y="31" class="small">Verified recovery context · current password is not requested in this mode.</text></g>
      <text x="0" y="204" class="micro muted">NEW PASSWORD</text><rect x="0" y="218" width="642" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="642" y="286" text-anchor="end" class="small dim">8 characters minimum</text>
      <text x="0" y="311" class="micro muted">CONFIRM NEW PASSWORD</text><rect x="0" y="325" width="642" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/>
      <rect x="0" y="399" width="158" height="44" rx="10" fill="#8978ff" fill-opacity=".18" stroke="#b2a6ff" stroke-opacity=".34"/><text x="24" y="426" class="button">Set new password</text><text x="642" y="426" text-anchor="end" class="button">Back to Settings</text>
    </g>
    <text x="22" y="578" class="mono dim">RECOVERY · old-password-free form only after valid server marker; expired links remain fail-closed</text>
  </g>
</svg>
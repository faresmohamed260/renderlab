<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1840" viewBox="0 0 1320 1840">
  <defs>
    <linearGradient id="canvasM" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050609"/><stop offset=".62" stop-color="#080912"/><stop offset="1" stop-color="#0b0910"/></linearGradient>
    <radialGradient id="coolM" cx="80%" cy="0%" r="82%"><stop stop-color="#6d58ff" stop-opacity=".14"/><stop offset=".48" stop-color="#526cff" stop-opacity=".03"/><stop offset="1" stop-color="#050609" stop-opacity="0"/></radialGradient>
    <radialGradient id="warmM" cx="100%" cy="0%" r="82%"><stop stop-color="#ff8e69" stop-opacity=".10"/><stop offset=".52" stop-color="#9f4e59" stop-opacity=".024"/><stop offset="1" stop-color="#050609" stop-opacity="0"/></radialGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f5f5f7}.muted{fill:#9699a6}.dim{fill:#6e7180}.eyebrow{font-size:9px;font-weight:700;letter-spacing:.14em}.micro{font-size:9px;font-weight:650;letter-spacing:.07em}.small{font-size:11px}.body{font-size:12px}.h1{font-size:27px;font-weight:650;letter-spacing:-.03em}.h2{font-size:17px;font-weight:620}.id{font-size:18px;font-weight:610;letter-spacing:-.018em}.button{font-size:11px;font-weight:650}.nav{font-size:10px;font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;letter-spacing:.045em}.state{font-size:10px;font-weight:700;letter-spacing:.04em}
    </style>
  </defs>
  <rect width="1320" height="1840" fill="url(#canvasM)"/>
  <text x="38" y="44" class="h2">Phase 27 — 390px Settings Trust Register v0.1</text>
  <text x="38" y="68" class="body muted">Five representative narrow states · same product hierarchy · no rail or fixed bottom dock</text>

  <!-- ACTIVE -->
  <g transform="translate(38 96)">
    <rect width="390" height="790" rx="22" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="390" height="790" rx="22" fill="url(#coolM)"/>
    <line x1="0" y1="52" x2="390" y2="52" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="16" y="31" class="eyebrow">RENDERLAB</text><text x="248" y="31" class="nav muted">Activity</text><rect x="300" y="12" width="74" height="28" rx="8" fill="#ffffff" fill-opacity=".05"/><text x="316" y="30" class="nav">Settings</text>
    <g transform="translate(20 82)">
      <text x="0" y="11" class="eyebrow muted">ACCOUNT / SETTINGS</text><text x="0" y="48" class="h1">Settings</text><text x="0" y="72" class="body muted">Identity, access and account security.</text>
      <path d="M306 0a42 42 0 0 1 42 42" fill="none" stroke="#9486ff" stroke-opacity=".45" stroke-width="2"/>
      <line x1="0" y1="104" x2="350" y2="104" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="132" class="micro muted">01 · IDENTITY</text><text x="0" y="162" class="id">maker@renderlab.test</text><text x="0" y="183" class="small dim">Verified account identity</text>
      <line x1="0" y1="211" x2="350" y2="211" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="239" class="micro muted">02 · CLOSED BETA ACCESS</text><circle cx="5" cy="267" r="4" fill="#77d9b4"/><text x="18" y="270" class="state">ACTIVE</text><text x="0" y="296" class="small muted">Private RenderLab access is active.</text><text x="0" y="316" class="small dim">Verified server-side; not editable here.</text>
      <line x1="0" y1="344" x2="350" y2="344" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="372" class="micro muted">03 · SECURITY</text><text x="0" y="402" class="h2">Password</text><text x="0" y="426" class="small muted">Use the protected password-change flow.</text>
      <rect x="0" y="448" width="350" height="44" rx="10" fill="#8777ff" fill-opacity=".16" stroke="#aa9eff" stroke-opacity=".32"/><text x="124" y="475" class="button">Change password</text>
      <rect x="0" y="504" width="350" height="44" rx="10" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".10"/><text x="154" y="531" class="button">Sign out</text>
      <line x1="0" y1="578" x2="350" y2="578" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="606" class="micro muted">04 · PRIVILEGED CONTINUATION</text><text x="0" y="636" class="small">Admin operations</text><text x="0" y="657" class="small dim">Only after a fresh active-admin check.</text><text x="0" y="687" class="button">Open Admin →</text>
    </g>
    <text x="16" y="768" class="mono dim">390PX · ACTIVE / ADMIN VARIANT</text>
  </g>

  <!-- SIGNED OUT -->
  <g transform="translate(465 96)">
    <rect width="390" height="790" rx="22" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="390" height="790" rx="22" fill="url(#coolM)"/>
    <line x1="0" y1="52" x2="390" y2="52" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="16" y="31" class="eyebrow">RENDERLAB</text><rect x="300" y="12" width="74" height="28" rx="8" fill="#ffffff" fill-opacity=".05"/><text x="316" y="30" class="nav">Settings</text>
    <g transform="translate(20 82)">
      <text x="0" y="11" class="eyebrow muted">ACCOUNT / SETTINGS</text><text x="0" y="48" class="h1">Sign in</text><text x="0" y="73" class="body muted">Access private RenderLab work with your invited account.</text>
      <line x1="0" y1="105" x2="350" y2="105" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="139" class="micro muted">EMAIL</text><rect x="0" y="153" width="350" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="13" y="180" class="small dim">you@example.test</text>
      <text x="0" y="230" class="micro muted">PASSWORD</text><rect x="0" y="244" width="350" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="13" y="271" class="small dim">••••••••••••</text>
      <rect x="0" y="318" width="350" height="44" rx="10" fill="#8878ff" fill-opacity=".18" stroke="#b2a6ff" stroke-opacity=".34"/><text x="154" y="345" class="button">Sign in</text>
      <rect x="0" y="374" width="350" height="44" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/><text x="131" y="401" class="button">Forgot password</text>
      <line x1="0" y1="450" x2="350" y2="450" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="481" class="micro muted">CLOSED BETA</text><text x="0" y="509" class="small muted">Invitation-only access. There is no public signup flow.</text>
      <g transform="translate(0 547)"><rect width="350" height="64" rx="10" fill="#7564e6" fill-opacity=".055" stroke="#998bff" stroke-opacity=".14"/><text x="14" y="25" class="small">Recovery request feedback stays here.</text><text x="14" y="45" class="small dim">Messages do not reveal whether an account exists.</text></g>
    </g>
    <text x="16" y="768" class="mono dim">390PX · SIGNED OUT / RECOVERY FEEDBACK</text>
  </g>

  <!-- SUSPENDED -->
  <g transform="translate(892 96)">
    <rect width="390" height="790" rx="22" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="390" height="790" rx="22" fill="url(#warmM)"/>
    <line x1="0" y1="52" x2="390" y2="52" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="16" y="31" class="eyebrow">RENDERLAB</text><rect x="300" y="12" width="74" height="28" rx="8" fill="#ffffff" fill-opacity=".05"/><text x="316" y="30" class="nav">Settings</text>
    <g transform="translate(20 82)">
      <text x="0" y="11" class="eyebrow muted">ACCOUNT / SETTINGS</text><text x="0" y="48" class="h1">Settings</text><text x="0" y="72" class="body muted">Identity, access and account security.</text>
      <line x1="0" y1="104" x2="350" y2="104" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="132" class="micro muted">01 · IDENTITY</text><text x="0" y="162" class="id">maker@renderlab.test</text>
      <line x1="0" y1="194" x2="350" y2="194" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="222" class="micro muted">02 · CLOSED BETA ACCESS</text><circle cx="5" cy="250" r="4" fill="#ff9d79"/><text x="18" y="253" class="state">SUSPENDED</text><text x="0" y="281" class="small muted">Create, Library and Activity are currently paused.</text><text x="0" y="301" class="small dim">Password recovery and sign out remain available.</text>
      <line x1="0" y1="330" x2="350" y2="330" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="358" class="micro muted">03 · SECURITY</text><text x="0" y="389" class="h2">Password</text><text x="0" y="414" class="small muted">Security actions stay available while suspended.</text>
      <rect x="0" y="440" width="350" height="44" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/><text x="124" y="467" class="button">Change password</text>
      <rect x="0" y="496" width="350" height="44" rx="10" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".10"/><text x="154" y="523" class="button">Sign out</text>
      <g transform="translate(0 575)"><rect width="350" height="72" rx="10" fill="#aa5147" fill-opacity=".055" stroke="#ff9d79" stroke-opacity=".14"/><text x="14" y="27" class="small">Access state is informational here.</text><text x="14" y="48" class="small dim">No request-access or role-edit control is invented.</text></g>
    </g>
    <text x="16" y="768" class="mono dim">390PX · SUSPENDED / RECOVERY PRESERVED</text>
  </g>

  <!-- NORMAL PASSWORD -->
  <g transform="translate(251 930)">
    <rect width="390" height="790" rx="22" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="390" height="790" rx="22" fill="url(#coolM)"/>
    <line x1="0" y1="52" x2="390" y2="52" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="16" y="31" class="eyebrow">RENDERLAB</text><rect x="300" y="12" width="74" height="28" rx="8" fill="#ffffff" fill-opacity=".05"/><text x="316" y="30" class="nav">Settings</text>
    <g transform="translate(20 82)">
      <text x="0" y="11" class="eyebrow muted">SETTINGS / PASSWORD</text><text x="0" y="48" class="h1">Change password</text><text x="0" y="73" class="body muted">Confirm your current password before setting a new one.</text>
      <line x1="0" y1="105" x2="350" y2="105" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="139" class="micro muted">CURRENT PASSWORD</text><rect x="0" y="153" width="350" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/>
      <text x="0" y="230" class="micro muted">NEW PASSWORD</text><rect x="0" y="244" width="350" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="350" y="311" text-anchor="end" class="small dim">8 characters minimum</text>
      <text x="0" y="342" class="micro muted">CONFIRM NEW PASSWORD</text><rect x="0" y="356" width="350" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/>
      <rect x="0" y="430" width="350" height="44" rx="10" fill="#8878ff" fill-opacity=".18" stroke="#b2a6ff" stroke-opacity=".34"/><text x="125" y="457" class="button">Update password</text>
      <rect x="0" y="486" width="350" height="44" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/><text x="132" y="513" class="button">Back to Settings</text>
      <line x1="0" y1="565" x2="350" y2="565" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="595" class="small muted">Ordinary changes require current-password reauthentication.</text><text x="0" y="617" class="small dim">Provider errors remain sanitized.</text>
    </g>
    <text x="16" y="768" class="mono dim">390PX · NORMAL PASSWORD CHANGE</text>
  </g>

  <!-- RECOVERY -->
  <g transform="translate(679 930)">
    <rect width="390" height="790" rx="22" fill="#07080c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect width="390" height="790" rx="22" fill="url(#coolM)"/>
    <line x1="0" y1="52" x2="390" y2="52" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="16" y="31" class="eyebrow">RENDERLAB</text><rect x="300" y="12" width="74" height="28" rx="8" fill="#ffffff" fill-opacity=".05"/><text x="316" y="30" class="nav">Settings</text>
    <g transform="translate(20 82)">
      <text x="0" y="11" class="eyebrow muted">SETTINGS / PASSWORD</text><text x="0" y="48" class="h1">Set a new password</text><text x="0" y="73" class="body muted">Continue from the verified recovery link.</text>
      <g transform="translate(0 105)"><rect width="350" height="72" rx="10" fill="#7061e8" fill-opacity=".065" stroke="#9b8cff" stroke-opacity=".18"/><circle cx="16" cy="25" r="4" fill="#9b8cff"/><text x="30" y="29" class="small">Verified recovery context</text><text x="16" y="51" class="small dim">Current password is not requested in this mode.</text></g>
      <text x="0" y="220" class="micro muted">NEW PASSWORD</text><rect x="0" y="234" width="350" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/><text x="350" y="302" text-anchor="end" class="small dim">8 characters minimum</text>
      <text x="0" y="333" class="micro muted">CONFIRM NEW PASSWORD</text><rect x="0" y="347" width="350" height="44" rx="10" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".13"/>
      <rect x="0" y="421" width="350" height="44" rx="10" fill="#8878ff" fill-opacity=".18" stroke="#b2a6ff" stroke-opacity=".34"/><text x="126" y="448" class="button">Set new password</text>
      <rect x="0" y="477" width="350" height="44" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/><text x="132" y="504" class="button">Back to Settings</text>
      <line x1="0" y1="556" x2="350" y2="556" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="0" y="586" class="small muted">Old-password-free replacement requires a valid server marker.</text><text x="0" y="608" class="small dim">Invalid or expired recovery remains fail-closed.</text>
    </g>
    <text x="16" y="768" class="mono dim">390PX · VERIFIED RECOVERY MODE</text>
  </g>

  <text x="38" y="1792" class="body muted">Reduced motion: all five compositions are complete as static states; no meaning depends on animation or color alone.</text>
  <text x="38" y="1816" class="mono dim">REVIEW CHECKPOINT ONLY · no signup · no profile editing · no role editing · no auth/schema/API/deployment change</text>
</svg>
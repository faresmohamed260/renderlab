<text x="72" y="178" fill="#7C6CF2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">THE CREATIVE WORKSPACE</text>
<text x="72" y="246" fill="#F4F5F7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="650">Create images.</text><text x="72" y="316" fill="#F4F5F7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="650">Shape them.</text><text x="72" y="386" fill="#F4F5F7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="650">Put them in motion.</text>
<text x="74" y="482" fill="#9CA3AF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">RenderLab brings image and video creation, reference-driven edits,</text><text x="74" y="511" fill="#9CA3AF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">reusable media, and retryable generation history into one focused workspace.</text>
<rect x="72" y="566" width="148" height="46" rx="12" fill="#7C6CF2"/><text x="146" y="595" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Open Create →</text>

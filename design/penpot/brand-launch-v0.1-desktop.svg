<text x="72" y="744" fill="#7C6CF2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">FOUR VERIFIED OPERATIONS</text><text x="72" y="784" fill="#F4F5F7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="650">Move from first idea to a reusable creative thread.</text>
<g fill="#111318" stroke="#2B303A"><rect x="72" y="828" width="309" height="192" rx="18"/><rect x="397" y="828" width="309" height="192" rx="18"/><rect x="722" y="828" width="309" height="192" rx="18"/><rect x="1047" y="828" width="309" height="192" rx="18"/></g>
<g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="94" y="862" fill="#7C6CF2" font-size="11" font-weight="700">01</text><text x="94" y="902" fill="#F4F5F7" font-size="17" font-weight="650">Create Image</text><text x="94" y="936" fill="#9CA3AF" font-size="13">Start from a prompt and build a</text><text x="94" y="956" fill="#9CA3AF" font-size="13">durable image result.</text><text x="94" y="994" fill="#9CA3AF" font-size="10" font-weight="600">Create → Library → Activity</text>
<text x="419" y="862" fill="#7C6CF2" font-size="11" font-weight="700">02</text><text x="419" y="902" fill="#F4F5F7" font-size="17" font-weight="650">Edit Image</text><text x="419" y="936" fill="#9CA3AF" font-size="13">Guide a new result with one or two</text><text x="419" y="956" fill="#9CA3AF" font-size="13">owned image references.</text><text x="419" y="994" fill="#9CA3AF" font-size="10" font-weight="600">Create → Library → Activity</text>
<text x="744" y="862" fill="#7C6CF2" font-size="11" font-weight="700">03</text><text x="744" y="902" fill="#F4F5F7" font-size="17" font-weight="650">Create Video</text><text x="744" y="936" fill="#9CA3AF" font-size="13">Create video with curated aspect,</text><text x="744" y="956" fill="#9CA3AF" font-size="13">duration and resolution.</text><text x="744" y="994" fill="#9CA3AF" font-size="10" font-weight="600">Create → Library → Activity</text>
<text x="1069" y="862" fill="#7C6CF2" font-size="11" font-weight="700">04</text><text x="1069" y="902" fill="#F4F5F7" font-size="17" font-weight="650">Animate Image</text><text x="1069" y="936" fill="#9CA3AF" font-size="13">Turn an owned image into motion</text><text x="1069" y="956" fill="#9CA3AF" font-size="13">while preserving the source.</text><text x="1069" y="994" fill="#9CA3AF" font-size="10" font-weight="600">Create → Library → Activity</text></g>

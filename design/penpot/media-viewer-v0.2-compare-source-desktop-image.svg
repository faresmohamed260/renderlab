<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#F4F5F7}.muted{fill:#9CA3AF}.title{font-size:26px;font-weight:600}.body{font-size:14px}.label{font-size:12px;font-weight:600}.small{font-size:11px}
  </style>
  <rect width="1440" height="1100" fill="#090A0C"/>
  <text x="40" y="42" class="title">Media Viewer v0.2 — Compare source — Image → Image</text>
  <text x="40" y="68" class="body muted">EXPERIMENTAL checkpoint candidate · result remains primary · media geometry is preserved</text>

  <g transform="translate(40,96)">
    <rect width="1360" height="960" rx="22" fill="#090A0C" stroke="#2B303A"/>
    <rect width="206" height="960" rx="22" fill="#111318"/>
    <text x="28" y="48" class="label">RenderLab</text>
    <rect x="16" y="78" width="174" height="40" rx="8" fill="#171A20"/>
    <text x="48" y="103" class="body muted">Create</text>
    <rect x="16" y="126" width="174" height="40" rx="8" fill="#20242C"/>
    <text x="48" y="151" class="body">Library</text>
    <rect x="206" width="1154" height="56" fill="#0D0F13"/>
    <text x="230" y="35" class="label">Media Viewer</text>

    <g transform="translate(238,84)">
      <text x="0" y="22" class="small muted">← Back to Library</text>
      <g transform="translate(0,46)">
        <rect width="812" height="610" rx="18" fill="#111318" stroke="#2B303A"/>
        <text x="20" y="34" class="label">COMPARE SOURCE</text>
        <text x="790" y="34" text-anchor="end" class="small muted">Result stays primary</text>

        <g transform="translate(20,56)">
          <text x="0" y="18" class="label muted">SOURCE</text>
          <rect x="0" y="34" width="286" height="354" rx="12" fill="#171A20" stroke="#2B303A"/>
          <rect x="14" y="48" width="258" height="258" rx="10" fill="#273544"/>
          <circle cx="143" cy="177" r="74" fill="#536F8A"/>
          <text x="14" y="332" class="small muted">Original durable primary image</text>
          <rect x="0" y="408" width="132" height="34" rx="8" fill="#171A20" stroke="#2B303A"/>
          <text x="66" y="429" text-anchor="middle" class="small">Open source</text>
        </g>

        <g transform="translate(326,56)">
          <text x="0" y="18" class="label">RESULT</text>
          <rect x="0" y="34" width="466" height="506" rx="12" fill="#171A20" stroke="#7C6CF2" stroke-opacity=".35"/>
          <rect x="14" y="48" width="438" height="438" rx="10" fill="#423D54"/>
          <circle cx="233" cy="267" r="126" fill="#7C6CF2" opacity=".72"/>
          <circle cx="272" cy="231" r="48" fill="#A59AF8" opacity=".7"/>
        </g>
      </g>

      <g transform="translate(838,46)">
        <text x="0" y="24" class="small muted">IMAGE</text>
        <text x="0" y="60" style="font-size:20px;font-weight:600">Lavender sphere edit</text>
        <text x="0" y="86" class="small muted">Created today at 10:10 AM</text>
        <rect x="0" y="116" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="146" class="label">Prompt</text>
        <text x="0" y="170" class="small">Make @image1 lavender with a soft reflective</text>
        <text x="0" y="189" class="small">highlight while preserving the studio composition.</text>
        <rect x="0" y="220" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="250" class="label">Details</text>
        <text x="0" y="276" class="small muted">Dimensions</text><text x="116" y="276" class="small">1536 × 1536</text>
        <rect x="0" y="314" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="344" class="label">Continue</text>
        <rect x="0" y="362" width="122" height="40" rx="9" fill="#7C6CF2"/><text x="61" y="387" text-anchor="middle" class="label">Edit</text>
        <rect x="134" y="362" width="122" height="40" rx="9" fill="#171A20" stroke="#2B303A"/><text x="195" y="387" text-anchor="middle" class="label">Animate</text>
        <rect x="0" y="414" width="122" height="40" rx="9" fill="#171A20" stroke="#2B303A"/><text x="61" y="439" text-anchor="middle" class="small">Reuse settings</text>
        <rect x="134" y="414" width="122" height="40" rx="9" fill="#20242C" stroke="#7C6CF2" stroke-opacity=".45"/><text x="195" y="439" text-anchor="middle" class="small">Close comparison</text>
        <rect x="0" y="486" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="516" class="label">Actions</text>
        <rect x="0" y="534" width="256" height="40" rx="9" fill="#171A20" stroke="#2B303A"/><text x="128" y="559" text-anchor="middle" class="small">Favorite · Collection · More</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2380" viewBox="0 0 1920 2380">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050609"/><stop offset=".62" stop-color="#080912"/><stop offset="1" stop-color="#0d0910"/></linearGradient>
  <radialGradient id="cool" cx="77%" cy="2%" r="78%"><stop stop-color="#755cff" stop-opacity=".15"/><stop offset=".52" stop-color="#5269ff" stop-opacity=".025"/><stop offset="1" stop-color="#050609" stop-opacity="0"/></radialGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78cff"/><stop offset="1" stop-color="#6b75ff"/></linearGradient>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f4f8}.muted{fill:#999baa}.dim{fill:#6f7282}.violet{fill:#b7a8ff}.warm{fill:#ffc18a}.danger{fill:#ff9ba7}
    .title{font-size:31px;font-weight:680;letter-spacing:-.025em}.hero{font-size:38px;font-weight:690;letter-spacing:-.035em}.h2{font-size:21px;font-weight:650}.h3{font-size:16px;font-weight:650}.body{font-size:13px}.small{font-size:11px}.label{font-size:10px;font-weight:720;letter-spacing:.12em}.chip{font-size:11px;font-weight:650}
  </style>
</defs>
<rect width="1920" height="2380" fill="#050609"/>
<text x="48" y="54" class="title">Phase 27 — Settings / Account Security v0.2</text>
<text x="48" y="80" class="body muted">Convention audit revision · supported account logic made explicit; unsupported security capabilities remain out of the live candidate</text>

<g transform="translate(48 116)">
  <rect width="1824" height="780" rx="24" fill="url(#bg)" stroke="#fff" stroke-opacity=".10"/><rect width="1824" height="780" rx="24" fill="url(#cool)"/>
  <rect x="22" y="20" width="1780" height="58" rx="12" fill="#0b0c12" stroke="#fff" stroke-opacity=".08"/>
  <text x="48" y="55" class="label">RENDERLAB</text><text x="1290" y="55" class="small muted">Create</text><text x="1360" y="55" class="small muted">Library</text><text x="1435" y="55" class="small muted">Activity</text>
  <rect x="1505" y="33" width="88" height="31" rx="9" fill="#8c72ff" fill-opacity=".12"/><text x="1523" y="54" class="small">Settings</text><text x="1616" y="55" class="small muted">creator@renderlab.test</text>
  <g transform="translate(212 124)">
    <text x="0" y="14" class="label muted">ACCOUNT / SECURITY</text><text x="0" y="62" class="hero">Settings</text><text x="0" y="91" class="body muted">Manage your account, access and security.</text>
    <path d="M1320 4h26a44 44 0 0 1 44 44v26" fill="none" stroke="#a98fff" stroke-width="2" opacity=".5"/>
    <g transform="translate(0 132)"><line x1="0" y1="0" x2="1394" y2="0" stroke="#fff" stroke-opacity=".10"/><text x="0" y="34" class="label muted">ACCOUNT</text><text x="220" y="37" class="small muted">SIGN-IN EMAIL</text><text x="220" y="71" class="h2">creator@renderlab.test</text><text x="220" y="96" class="small muted">Used to sign in. Email changes are not currently available.</text></g>
    <g transform="translate(0 262)"><line x1="0" y1="0" x2="1394" y2="0" stroke="#fff" stroke-opacity=".10"/><text x="0" y="34" class="label muted">ACCESS</text><text x="220" y="36" class="small muted">CLOSED BETA</text><rect x="220" y="50" width="83" height="28" rx="9" fill="#55d8ad" fill-opacity=".11" stroke="#70e1bd" stroke-opacity=".22"/><circle cx="236" cy="64" r="4" fill="#70dcb7"/><text x="249" y="68" class="small">Active</text><text x="220" y="105" class="small muted">This account has active RenderLab closed-beta access.</text></g>
    <g transform="translate(0 396)"><line x1="0" y1="0" x2="1394" y2="0" stroke="#fff" stroke-opacity=".10"/><text x="0" y="34" class="label muted">SECURITY</text><text x="220" y="36" class="h3">Password</text><text x="220" y="64" class="small muted">8+ characters. Changing it keeps this browser signed in and revokes other sessions.</text><rect x="1180" y="21" width="170" height="42" rx="11" fill="#8d74ff" fill-opacity=".14" stroke="#b29fff" stroke-opacity=".26"/><text x="1210" y="47" class="chip">Change password</text></g>
    <g transform="translate(0 494)"><line x1="0" y1="0" x2="1394" y2="0" stroke="#fff" stroke-opacity=".10"/><text x="0" y="34" class="label muted">SESSIONS</text><text x="220" y="36" class="h3">Global sign-out</text><text x="220" y="64" class="small muted">Ends RenderLab sessions on every device and browser.</text><rect x="1172" y="18" width="178" height="44" rx="11" fill="#8a2631" fill-opacity=".11" stroke="#ff8997" stroke-opacity=".26"/><text x="1200" y="46" class="chip danger">Sign out everywhere</text></g>
    <g transform="translate(0 592)"><line x1="0" y1="0" x2="1394" y2="0" stroke="#fff" stroke-opacity=".10"/><text x="0" y="34" class="label muted">PRIVILEGED</text><text x="220" y="36" class="h3">Admin</text><text x="220" y="64" class="small muted">Shown only after a fresh active-admin authorization check.</text><text x="1242" y="44" class="chip violet">Open Admin →</text></g>
  </g>
</g>
<text x="62" y="925" class="label muted">SIGNED IN / ACTIVE — convention-complete for today: identity, access, password and session scope are distinct; Admin remains subordinate</text>

<g transform="translate(48 974)">
  <rect width="892" height="650" rx="24" fill="url(#bg)" stroke="#fff" stroke-opacity=".09"/><rect width="892" height="650" rx="24" fill="url(#cool)" opacity=".8"/>
  <rect x="22" y="20" width="848" height="54" rx="12" fill="#0b0c12" stroke="#fff" stroke-opacity=".08"/><text x="44" y="53" class="label">RENDERLAB</text><text x="748" y="53" class="small muted">Settings</text>
  <g transform="translate(98 112)"><text x="0" y="14" class="label muted">ACCOUNT / SIGN IN</text><text x="0" y="58" class="hero">Settings</text><text x="0" y="87" class="body muted">Sign in to your invited RenderLab account.</text><line x1="0" y1="119" x2="696" y2="119" stroke="#fff" stroke-opacity=".10"/>
    <text x="0" y="154" class="small muted">EMAIL</text><rect x="0" y="169" width="696" height="48" rx="10" fill="#0b0c12" stroke="#fff" stroke-opacity=".13"/><text x="16" y="199" class="body muted">name@example.test</text>
    <text x="0" y="257" class="small muted">PASSWORD</text><text x="606" y="257" class="small violet">Forgot password?</text><rect x="0" y="272" width="696" height="48" rx="10" fill="#0b0c12" stroke="#fff" stroke-opacity=".13"/><text x="16" y="302" class="body muted">••••••••••••</text><text x="642" y="302" class="small">Show</text>
    <rect x="0" y="350" width="696" height="46" rx="11" fill="url(#violet)" opacity=".86"/><text x="330" y="378" class="chip">Sign in</text><line x1="0" y1="433" x2="696" y2="433" stroke="#fff" stroke-opacity=".07"/>
    <text x="0" y="468" class="label muted">INVITATION-ONLY CLOSED BETA</text><text x="0" y="493" class="small muted">No public account creation. Recovery uses the sign-in email above.</text>
  </g>
</g>

<g transform="translate(980 974)">
  <rect width="892" height="650" rx="24" fill="url(#bg)" stroke="#fff" stroke-opacity=".09"/><rect x="22" y="20" width="848" height="54" rx="12" fill="#0b0c12" stroke="#fff" stroke-opacity=".08"/><text x="44" y="53" class="label">RENDERLAB</text><text x="748" y="53" class="small muted">Settings</text>
  <g transform="translate(98 112)"><text x="0" y="14" class="label muted">ACCOUNT / ACCESS</text><text x="0" y="58" class="hero">Settings</text><text x="0" y="87" class="body muted">Manage your account, access and security.</text><line x1="0" y1="119" x2="696" y2="119" stroke="#fff" stroke-opacity=".10"/>
    <text x="0" y="154" class="label muted">ACCESS</text><rect x="150" y="134" width="104" height="29" rx="9" fill="#92582f" fill-opacity=".18" stroke="#ffb17b" stroke-opacity=".25"/><text x="170" y="154" class="small warm">Suspended</text><text x="150" y="192" class="small muted">Creation, Library and Activity are paused.</text><text x="150" y="214" class="small muted">Password recovery and global sign-out remain available.</text>
    <line x1="0" y1="247" x2="696" y2="247" stroke="#fff" stroke-opacity=".08"/><text x="0" y="282" class="label muted">SECURITY</text><text x="150" y="283" class="h3">Password</text><text x="566" y="283" class="chip violet">Change password</text>
    <line x1="0" y1="329" x2="696" y2="329" stroke="#fff" stroke-opacity=".08"/><text x="0" y="364" class="label muted">SESSIONS</text><text x="150" y="365" class="h3">Global sign-out</text><text x="150" y="391" class="small muted">Ends sessions on every device and browser.</text><rect x="500" y="342" width="196" height="44" rx="11" fill="#8a2631" fill-opacity=".11" stroke="#ff8997" stroke-opacity=".26"/><text x="528" y="370" class="chip danger">Sign out everywhere</text><text x="0" y="454" class="small dim">Suspension changes access—not the ability to secure or leave the account.</text>
  </g>
</g>
<text x="62" y="1655" class="label muted">SIGNED OUT / SUSPENDED — recovery hierarchy is conventional; access denial never hides security controls</text>

<g transform="translate(48 1702)">
  <rect width="1824" height="580" rx="24" fill="#090a0f" stroke="#fff" stroke-opacity=".08"/><text x="28" y="44" class="h2">Password states</text><text x="28" y="70" class="body muted">Ordinary change and verified recovery share one grammar, but the authentication requirement stays explicit.</text>
  <g transform="translate(28 104)"><rect width="854" height="432" rx="18" fill="#0c0d13" stroke="#fff" stroke-opacity=".08"/><text x="24" y="34" class="label muted">NORMAL CHANGE</text><text x="24" y="69" class="h2">Change password</text><text x="24" y="95" class="small muted">Confirm your current password before replacing it.</text>
    <text x="24" y="134" class="small muted">CURRENT PASSWORD</text><rect x="24" y="147" width="806" height="43" rx="9" fill="#07080c" stroke="#fff" stroke-opacity=".13"/><text x="40" y="174" class="small muted">••••••••••</text><text x="780" y="174" class="small">Show</text>
    <text x="24" y="222" class="small muted">NEW PASSWORD</text><rect x="24" y="235" width="390" height="43" rx="9" fill="#07080c" stroke="#fff" stroke-opacity=".13"/><text x="40" y="262" class="small muted">••••••••••••</text><text x="364" y="262" class="small">Show</text>
    <text x="438" y="222" class="small muted">CONFIRM NEW PASSWORD</text><rect x="438" y="235" width="392" height="43" rx="9" fill="#07080c" stroke="#fff" stroke-opacity=".13"/><text x="454" y="262" class="small muted">••••••••••••</text><text x="780" y="262" class="small">Show</text>
    <text x="24" y="304" class="small muted">8+ characters · passwords match</text><rect x="24" y="326" width="806" height="48" rx="10" fill="#5c4a15" fill-opacity=".12" stroke="#e8c069" stroke-opacity=".16"/><text x="40" y="355" class="small muted">This browser stays signed in. Other RenderLab sessions are revoked after the change.</text><text x="24" y="407" class="chip violet">Update password →</text>
  </g>
  <g transform="translate(914 104)"><rect width="882" height="432" rx="18" fill="#0c0d13" stroke="#fff" stroke-opacity=".08"/><text x="24" y="34" class="label violet">VERIFIED RECOVERY LINK</text><text x="24" y="69" class="h2">Set a new password</text><text x="24" y="95" class="small muted">The server verified this short-lived recovery context.</text>
    <text x="24" y="142" class="small muted">NEW PASSWORD</text><rect x="24" y="155" width="406" height="43" rx="9" fill="#07080c" stroke="#fff" stroke-opacity=".13"/><text x="40" y="182" class="small muted">••••••••••••</text><text x="378" y="182" class="small">Show</text>
    <text x="452" y="142" class="small muted">CONFIRM NEW PASSWORD</text><rect x="452" y="155" width="406" height="43" rx="9" fill="#07080c" stroke="#fff" stroke-opacity=".13"/><text x="468" y="182" class="small muted">••••••••••••</text><text x="806" y="182" class="small">Show</text>
    <text x="24" y="231" class="small muted">8+ characters · passwords match</text><rect x="24" y="254" width="834" height="62" rx="10" fill="#40325f" fill-opacity=".18" stroke="#ab91ff" stroke-opacity=".20"/><text x="40" y="280" class="small muted">No Current password field appears because the recovery marker is valid.</text><text x="40" y="300" class="small muted">This recovery session stays usable; older sessions are revoked.</text><text x="24" y="357" class="chip violet">Set new password →</text><text x="24" y="397" class="small dim">Invalid or expired recovery returns to the fail-closed Settings recovery path.</text>
  </g>
</g>
<g transform="translate(48 2312)"><text x="0" y="20" class="label muted">DEFERRED CAPABILITY GAPS — NOT LIVE CONTROLS IN THIS CANDIDATE</text><text x="570" y="20" class="small muted">MFA / passkeys · active session/device inventory + selective revoke · change sign-in email · self-service account deletion / data export</text></g>
</svg>
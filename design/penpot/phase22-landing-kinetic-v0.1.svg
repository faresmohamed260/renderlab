<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1780" viewBox="0 0 1900 1780">
  <defs>
    <radialGradient id="bg" cx="58%" cy="6%" r="90%">
      <stop offset="0" stop-color="#25194d"/>
      <stop offset=".34" stop-color="#0c0b16"/>
      <stop offset="1" stop-color="#06070a"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#aa8cff"/>
      <stop offset=".54" stop-color="#717dff"/>
      <stop offset="1" stop-color="#58d3ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".46"/></filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f7f7fb}
      .muted{fill:#9b9dae}.dim{fill:#6f7282}.title{font-size:30px;font-weight:650}
      .hero{font-size:56px;font-weight:680;letter-spacing:-.035em}.h2{font-size:22px;font-weight:640}
      .h3{font-size:16px;font-weight:650}.body{font-size:13px}.small{font-size:11px}
      .label{font-size:11px;font-weight:720;letter-spacing:.09em}.chip{font-size:11px;font-weight:640}
      .micro{font-size:9px;font-weight:630;letter-spacing:.06em}
    </style>
  </defs>

  <rect width="1900" height="1780" fill="#050609"/>
  <text x="44" y="52" class="title">Phase 22 — Landing Kinetic Expression v0.1</text>
  <text x="44" y="78" class="body muted">Public first impression aligned with the verified product; no fake live state, public signup, metrics, provider or SLA claims.</text>

  <g transform="translate(44 110)">
    <rect width="1280" height="790" rx="28" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".10"/>
    <ellipse cx="690" cy="84" rx="460" ry="150" fill="#7355ff" opacity=".15" filter="url(#glow)"/>
    <ellipse cx="1030" cy="360" rx="250" ry="210" fill="#39b9ff" opacity=".07" filter="url(#glow)"/>

    <text x="44" y="58" class="label">RENDERLAB</text>
    <text x="1092" y="58" class="small muted">Closed beta</text>
    <rect x="1160" y="31" width="88" height="38" rx="12" fill="#ffffff" opacity=".04"/>
    <text x="1186" y="55" class="chip">Sign in</text>

    <g transform="translate(58 160)">
      <rect width="206" height="32" rx="12" fill="#8f79ff" opacity=".12" stroke="#b39fff" stroke-opacity=".19"/>
      <circle cx="18" cy="16" r="4" fill="#a990ff"/>
      <text x="31" y="20" class="chip">Closed beta · invitation only</text>
      <text x="0" y="104" class="hero">Create with intent.</text>
      <text x="0" y="166" class="hero">Keep what matters.</text>
      <text x="0" y="214" class="body muted">Image and video creation with durable media, reusable references,</text>
      <text x="0" y="238" class="body muted">truthful generation state and a focused continuation loop.</text>
      <rect x="0" y="282" width="128" height="48" rx="15" fill="url(#accent)" opacity=".24" stroke="#baa8ff" stroke-opacity=".30"/>
      <text x="32" y="312" class="chip">Open Create</text>
      <rect x="142" y="282" width="104" height="48" rx="15" fill="#ffffff" opacity=".04"/>
      <text x="173" y="312" class="chip">Sign in</text>
      <text x="0" y="366" class="small dim">No public registration. Existing invited accounts can sign in.</text>
    </g>

    <g transform="translate(620 128) rotate(-1.2 296 260)" filter="url(#soft)">
      <rect width="590" height="510" rx="28" fill="#0c0e15" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="20" y="20" width="550" height="52" rx="16" fill="url(#glass)"/>
      <text x="42" y="52" class="small muted">Create · product preview</text>

      <g transform="translate(28 96)">
        <rect width="534" height="214" rx="22" fill="#11131c" stroke="#9c85ff" stroke-opacity=".20"/>
        <text x="22" y="40" class="micro muted">IMAGE</text>
        <text x="22" y="78" class="h3">Describe the frame you want to make</text>
        <text x="22" y="110" class="small muted">A monolithic glass pavilion at blue hour...</text>
        <rect x="22" y="144" width="74" height="34" rx="11" fill="#ffffff" opacity=".04"/>
        <text x="43" y="166" class="small">16:9</text>
        <rect x="106" y="144" width="82" height="34" rx="11" fill="#ffffff" opacity=".04"/>
        <text x="128" y="166" class="small">1 image</text>
        <rect x="396" y="138" width="116" height="44" rx="14" fill="url(#accent)" opacity=".24"/>
        <text x="425" y="165" class="chip">Generate</text>
      </g>

      <g transform="translate(28 332)">
        <text x="0" y="22" class="micro muted">DURABLE RESULT / CONTINUE</text>
        <rect x="0" y="38" width="250" height="120" rx="18" fill="#223759"/>
        <ellipse cx="128" cy="98" rx="70" ry="38" fill="#7eb5ff" opacity=".55"/>
        <rect x="270" y="38" width="264" height="120" rx="18" fill="#0e1119" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="292" y="70" class="h3">Saved to Library</text>
        <text x="292" y="98" class="small muted">Edit · Animate · Download</text>
        <text x="292" y="126" class="small dim">Preview only — not live runtime state</text>
      </g>
    </g>

    <g transform="translate(720 596) rotate(1.4 220 90)" opacity=".92">
      <rect width="444" height="140" rx="22" fill="#11131b" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="20" y="33" class="micro muted">LIBRARY / PRODUCT PREVIEW</text>
      <g transform="translate(20 50)">
        <rect width="82" height="70" rx="12" fill="#2c486c"/>
        <rect x="94" width="82" height="70" rx="12" fill="#603c45"/>
        <rect x="188" width="82" height="70" rx="12" fill="#315847"/>
        <rect x="282" width="82" height="70" rx="12" fill="#55406d"/>
        <rect x="376" width="48" height="70" rx="12" fill="#23313c"/>
      </g>
    </g>

    <text x="58" y="748" class="small dim">Native scrolling · bounded entrance only · preview describes verified product surfaces, not fabricated account/job state.</text>
  </g>
  <text x="56" y="932" class="label muted">DESKTOP LANDING · atmosphere is strongest here, but copy stays concrete and closed-beta truthful</text>

  <g transform="translate(1370 110)">
    <rect width="390" height="790" rx="30" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".10"/>
    <ellipse cx="214" cy="86" rx="190" ry="105" fill="#7355ff" opacity=".14" filter="url(#glow)"/>
    <text x="20" y="44" class="label">RENDERLAB</text>
    <text x="328" y="44" class="small muted">Sign in</text>
    <rect x="20" y="88" width="190" height="30" rx="11" fill="#8f79ff" opacity=".12"/>
    <text x="36" y="108" class="small">Closed beta · invitation only</text>
    <text x="20" y="174" class="h2">Create with intent.</text>
    <text x="20" y="207" class="h2">Keep what matters.</text>
    <text x="20" y="241" class="small muted">Image + video creation, durable media and focused continuation.</text>
    <rect x="20" y="274" width="124" height="44" rx="14" fill="url(#accent)" opacity=".24"/>
    <text x="50" y="302" class="chip">Open Create</text>
    <rect x="154" y="274" width="92" height="44" rx="14" fill="#ffffff" opacity=".04"/>
    <text x="181" y="302" class="chip">Sign in</text>

    <g transform="translate(20 352)" filter="url(#soft)">
      <rect width="350" height="328" rx="22" fill="#0c0e15" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="18" y="32" class="micro muted">PRODUCT PREVIEW</text>
      <rect x="18" y="52" width="314" height="126" rx="17" fill="#11131c" stroke="#9c85ff" stroke-opacity=".18"/>
      <text x="34" y="80" class="small muted">IMAGE</text>
      <text x="34" y="108" class="h3">Describe the frame</text>
      <text x="34" y="135" class="small dim">A glass pavilion at blue hour...</text>
      <rect x="232" y="132" width="80" height="30" rx="10" fill="url(#accent)" opacity=".22"/>
      <text x="250" y="152" class="small">Generate</text>
      <g transform="translate(18 198)">
        <rect width="94" height="88" rx="14" fill="#2c486c"/>
        <rect x="106" width="94" height="88" rx="14" fill="#603c45"/>
        <rect x="212" width="102" height="88" rx="14" fill="#315847"/>
      </g>
      <text x="18" y="312" class="small dim">Static preview · no fake live status</text>
    </g>
    <text x="20" y="728" class="small dim">No public registration or pricing claims.</text>
  </g>
  <text x="1382" y="932" class="label muted">390PX · hero remains concise; preview follows CTA rather than competing with it</text>

  <g transform="translate(44 1010)">
    <rect width="1716" height="666" rx="28" fill="#090a0f" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="30" y="46" class="h2">Landing motion + truth contract</text>

    <g transform="translate(30 84)">
      <rect width="526" height="190" rx="20" fill="#11131b" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="22" y="35" class="label">ENTRANCE</text>
      <text x="22" y="69" class="body">Hero / preview settle once, 260–420 ms.</text>
      <text x="22" y="97" class="small muted">No scroll phase, parallax dependency or pointer-following field.</text>
      <text x="22" y="125" class="small muted">Reduced motion → immediate/static composition.</text>
      <text x="22" y="154" class="small">Native browser scrolling remains authoritative.</text>
    </g>

    <g transform="translate(576 84)">
      <rect width="526" height="190" rx="20" fill="#11131b" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="22" y="35" class="label">PREVIEW TRUTH</text>
      <text x="22" y="69" class="body">Use verified product vocabulary and shapes.</text>
      <text x="22" y="97" class="small muted">Do not imply an active generation, user count or SLA.</text>
      <text x="22" y="125" class="small muted">No provider/model logos as marketing authority.</text>
      <text x="22" y="154" class="small">Preview is clearly decorative/product illustration.</text>
    </g>

    <g transform="translate(1122 84)">
      <rect width="564" height="190" rx="20" fill="#11131b" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="22" y="35" class="label">CTA HIERARCHY</text>
      <text x="22" y="69" class="body">Open Create primary · Sign in secondary.</text>
      <text x="22" y="97" class="small muted">Preserve `/create` and `/settings` destinations.</text>
      <text x="22" y="125" class="small muted">Root continuation query still redirects to Create.</text>
      <text x="22" y="154" class="small">Closed-beta truth stays visible before action.</text>
    </g>

    <g transform="translate(30 304)">
      <rect width="1656" height="292" rx="20" fill="#0c0e14" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="22" y="38" class="label muted">REVIEW REJECTS</text>
      <text x="22" y="76" class="body">Public signup · waitlist invention · pricing/testimonials/fake metrics · provider/model/SLA claims · scroll hijacking · shader/particle field · perpetual decorative motion · mobile preview before the core CTA</text>
      <line x1="22" y1="112" x2="1630" y2="112" stroke="#ffffff" stroke-opacity=".06"/>
      <text x="22" y="150" class="label muted">SYSTEM ROLE</text>
      <text x="22" y="187" class="body">Landing may carry the strongest atmosphere in Cycle 4, while Create remains intent-dominant and Library remains media-dominant.</text>
      <text x="22" y="220" class="small muted">The goal is family resemblance through type, depth, spectral edge and spacing—not identical layouts or copied feature controls.</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#F4F5F7}.muted{fill:#9CA3AF}.title{font-size:26px;font-weight:600}.body{font-size:14px}.label{font-size:12px;font-weight:600}.small{font-size:11px}
  </style>
  <rect width="1440" height="1100" fill="#090A0C"/>
  <text x="40" y="42" class="title">Media Viewer v0.2 — Compare source — Image → Video</text>
  <text x="40" y="68" class="body muted">EXPERIMENTAL checkpoint candidate · source is contextual · result video keeps controls and visual priority</text>

  <g transform="translate(40,96)">
    <rect width="1360" height="960" rx="22" fill="#090A0C" stroke="#2B303A"/>
    <rect width="206" height="960" rx="22" fill="#111318"/>
    <text x="28" y="48" class="label">RenderLab</text>
    <rect x="16" y="78" width="174" height="40" rx="8" fill="#171A20"/>
    <text x="48" y="103" class="body muted">Create</text>
    <rect x="16" y="126" width="174" height="40" rx="8" fill="#20242C"/>
    <text x="48" y="151" class="body">Library</text>
    <rect x="206" width="1154" height="56" fill="#0D0F13"/>
    <text x="230" y="35" class="label">Media Viewer</text>

    <g transform="translate(238,84)">
      <text x="0" y="22" class="small muted">← Back to Library</text>
      <g transform="translate(0,46)">
        <rect width="812" height="786" rx="18" fill="#111318" stroke="#2B303A"/>
        <text x="20" y="34" class="label">COMPARE SOURCE</text>
        <text x="790" y="34" text-anchor="end" class="small muted">Source image → Result video</text>

        <g transform="translate(20,56)">
          <text x="0" y="18" class="label muted">SOURCE</text>
          <rect x="0" y="34" width="286" height="606" rx="12" fill="#171A20" stroke="#2B303A"/>
          <rect x="14" y="48" width="258" height="578" rx="10" fill="#263B38"/>
          <path d="M45 500 L125 286 L184 392 L232 260 L258 500 Z" fill="#4F7A70"/>
          <circle cx="208" cy="146" r="34" fill="#D8C98B" opacity=".8"/>
          <text x="0" y="670" class="small muted">Durable first-frame image</text>
          <rect x="0" y="686" width="132" height="34" rx="8" fill="#171A20" stroke="#2B303A"/>
          <text x="66" y="707" text-anchor="middle" class="small">Open source</text>
        </g>

        <g transform="translate(326,56)">
          <text x="0" y="18" class="label">RESULT VIDEO</text>
          <rect x="0" y="34" width="466" height="666" rx="12" fill="#171A20" stroke="#7C6CF2" stroke-opacity=".55"/>
          <rect x="14" y="48" width="438" height="586" rx="10" fill="#2E334A"/>
          <path d="M22 552 L146 286 L245 436 L342 252 L444 552 Z" fill="#535C83"/>
          <circle cx="354" cy="166" r="58" fill="#978BE9" opacity=".8"/>
          <circle cx="233" cy="340" r="42" fill="#F4F5F7" opacity=".15"/>
          <polygon points="219,315 219,365 261,340" fill="#F4F5F7" opacity=".9"/>
          <rect x="14" y="648" width="438" height="38" rx="8" fill="#0D0F13"/>
          <polygon points="30,660 30,676 44,668" fill="#F4F5F7"/>
          <rect x="58" y="666" width="318" height="4" rx="2" fill="#2B303A"/>
          <rect x="58" y="666" width="116" height="4" rx="2" fill="#7C6CF2"/>
          <text x="398" y="673" class="small muted">0:04 / 0:10</text>
        </g>
      </g>

      <g transform="translate(838,46)">
        <text x="0" y="24" class="small muted">VIDEO</text>
        <text x="0" y="60" style="font-size:20px;font-weight:600">Slow mountain camera drift</text>
        <text x="0" y="86" class="small muted">Created today at 10:18 AM</text>
        <rect x="0" y="116" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="146" class="label">Prompt</text>
        <text x="0" y="170" class="small">Animate @image1 with a slow forward camera move,</text>
        <text x="0" y="189" class="small">subtle clouds and natural landscape motion.</text>
        <rect x="0" y="220" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="250" class="label">Details</text>
        <text x="0" y="276" class="small muted">Resolution</text><text x="116" y="276" class="small">1080p</text>
        <text x="0" y="300" class="small muted">Duration</text><text x="116" y="300" class="small">10 seconds</text>
        <rect x="0" y="338" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="368" class="label">Continue</text>
        <rect x="0" y="386" width="122" height="40" rx="9" fill="#171A20" stroke="#2B303A"/><text x="61" y="411" text-anchor="middle" class="small">Reuse settings</text>
        <rect x="134" y="386" width="122" height="40" rx="9" fill="#20242C" stroke="#7C6CF2" stroke-opacity=".6"/><text x="195" y="411" text-anchor="middle" class="small">Hide source</text>
        <rect x="0" y="458" width="256" height="1" fill="#2B303A"/>
        <text x="0" y="488" class="label">Actions</text>
        <rect x="0" y="506" width="256" height="40" rx="9" fill="#171A20" stroke="#2B303A"/><text x="128" y="531" text-anchor="middle" class="small">Favorite · Collection · More</text>
      </g>
    </g>
  </g>
</svg>

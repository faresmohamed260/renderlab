<text x="0" y="368" class="label muted">SECURITY</text><text x="0" y="396" class="h2">Password</text><text x="0" y="418" class="small muted">Changing it revokes other sessions.</text><rect x="0" y="438" width="350" height="44" rx="10" fill="#8d74ff" fill-opacity=".14" stroke="#b29fff" stroke-opacity=".23"/><text x="126" y="465" class="chip">Change password</text><line x1="0" y1="508" x2="350" y2="508" stroke="#fff" stroke-opacity=".08"/>
<text x="0" y="534" class="label muted">SESSIONS</text><text x="0" y="562" class="h2">Global sign-out</text><text x="0" y="584" class="small muted">Ends sessions on every device and browser.</text><rect x="0" y="604" width="350" height="44" rx="10" fill="#8a2631" fill-opacity=".11" stroke="#ff8997" stroke-opacity=".25"/><text x="114" y="631" class="chip danger">Sign out everywhere</text><line x1="0" y1="674" x2="350" y2="674" stroke="#fff" stroke-opacity=".08"/>
<text x="0" y="700" class="label muted">PRIVILEGED</text><text x="0" y="729" class="h2">Admin</text><text x="0" y="751" class="small muted">Only after a fresh active-admin check.</text><text x="0" y="785" class="chip violet">Open Admin →</text></g></g>


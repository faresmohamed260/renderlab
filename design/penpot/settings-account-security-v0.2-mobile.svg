<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1980" viewBox="0 0 1320 1980">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050609"/><stop offset=".72" stop-color="#090a12"/><stop offset="1" stop-color="#0c0910"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78cff"/><stop offset="1" stop-color="#6b75ff"/></linearGradient>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f4f8}.muted{fill:#999baa}.dim{fill:#6f7282}.violet{fill:#b7a8ff}.warm{fill:#ffc18a}.danger{fill:#ff9ba7}.h1{font-size:28px;font-weight:690;letter-spacing:-.03em}.h2{font-size:17px;font-weight:650}.body{font-size:12px}.small{font-size:10px}.label{font-size:9px;font-weight:720;letter-spacing:.11em}.chip{font-size:10px;font-weight:650}</style>
</defs>
<rect width="1320" height="1980" fill="#050609"/><text x="34" y="42" class="h2">Phase 27 v0.2 — 390px trust register</text><text x="34" y="64" class="small muted">Same account/security logic at narrow width · no left rail · no fixed bottom dock · no fake future controls</text>

<g transform="translate(34 94)"><rect width="390" height="860" rx="25" fill="url(#bg)" stroke="#fff" stroke-opacity=".10"/><rect x="14" y="14" width="362" height="52" rx="11" fill="#0b0c12" stroke="#fff" stroke-opacity=".08"/><text x="30" y="46" class="label">R</text><text x="281" y="46" class="small muted">Activity</text><text x="332" y="46" class="small">Settings</text>

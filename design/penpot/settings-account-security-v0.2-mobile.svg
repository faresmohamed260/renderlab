<g transform="translate(34 1000)"><rect width="390" height="720" rx="25" fill="url(#bg)" stroke="#fff" stroke-opacity=".10"/><rect x="14" y="14" width="362" height="52" rx="11" fill="#0b0c12" stroke="#fff" stroke-opacity=".08"/><text x="30" y="46" class="label">R</text><text x="330" y="46" class="small">Settings</text>
<g transform="translate(20 94)"><text x="0" y="12" class="label violet">VERIFIED RECOVERY LINK</text><text x="0" y="50" class="h1">Set a new password</text><text x="0" y="75" class="body muted">This short-lived recovery context was verified.</text><line x1="0" y1="103" x2="350" y2="103" stroke="#fff" stroke-opacity=".10"/>
<text x="0" y="135" class="small muted">NEW PASSWORD</text><rect x="0" y="149" width="350" height="46" rx="10" fill="#08090d" stroke="#fff" stroke-opacity=".13"/><text x="14" y="178" class="body muted">••••••••••••</text><text x="306" y="178" class="small">Show</text><text x="0" y="234" class="small muted">CONFIRM NEW PASSWORD</text><rect x="0" y="248" width="350" height="46" rx="10" fill="#08090d" stroke="#fff" stroke-opacity=".13"/><text x="14" y="277" class="body muted">••••••••••••</text><text x="306" y="277" class="small">Show</text><text x="0" y="323" class="small muted">8+ characters · passwords match</text><rect x="0" y="349" width="350" height="100" rx="10" fill="#40325f" fill-opacity=".14" stroke="#ab91ff" stroke-opacity=".18"/><text x="14" y="376" class="small muted">No Current password field appears because</text><text x="14" y="396" class="small muted">the recovery marker is valid.</text><text x="14" y="421" class="small muted">Older sessions are revoked after update.</text><rect x="0" y="482" width="350" height="46" rx="10" fill="url(#violet)" opacity=".86"/><text x="118" y="510" class="chip">Set new password</text></g></g>

<g transform="translate(465 1000)"><rect width="390" height="720" rx="25" fill="url(#bg)" stroke="#fff" stroke-opacity=".10"/><rect x="14" y="14" width="362" height="52" rx="11" fill="#0b0c12" stroke="#fff" stroke-opacity=".08"/><text x="30" y="46" class="label">R</text><text x="330" y="46" class="small">Settings</text>
<g transform="translate(20 94)"><text x="0" y="12" class="label muted">ACCOUNT / ACCESS</text><text x="0" y="50" class="h1">Settings</text><text x="0" y="75" class="body muted">Manage your account, access and security.</text><line x1="0" y1="103" x2="350" y2="103" stroke="#fff" stroke-opacity=".10"/><text x="0" y="134" class="label muted">ACCESS</text><rect x="0" y="151" width="102" height="27" rx="8" fill="#92582f" fill-opacity=".18"/><text x="18" y="169" class="small warm">Suspended</text><text x="0" y="204" class="small muted">Private product access is paused.</text><text x="0" y="224" class="small muted">Security controls remain available.</text><line x1="0" y1="252" x2="350" y2="252" stroke="#fff" stroke-opacity=".08"/><text x="0" y="281" class="label muted">SECURITY</text><text x="0" y="310" class="h2">Password</text><rect x="0" y="329" width="350" height="44" rx="10" fill="#8d74ff" fill-opacity=".14"/><text x="126" y="356" class="chip">Change password</text><line x1="0" y1="400" x2="350" y2="400" stroke="#fff" stroke-opacity=".08"/><text x="0" y="429" class="label muted">SESSIONS</text><text x="0" y="458" class="h2">Global sign-out</text><text x="0" y="480" class="small muted">Ends sessions on every device and browser.</text><rect x="0" y="501" width="350" height="44" rx="10" fill="#8a2631" fill-opacity=".11" stroke="#ff8997" stroke-opacity=".25"/><text x="114" y="528" class="chip danger">Sign out everywhere</text></g></g>

<g transform="translate(896 1000)"><rect width="390" height="720" rx="25" fill="#090a0f" stroke="#fff" stroke-opacity=".08"/><g transform="translate(20 38)"><text x="0" y="0" class="label muted">DEFERRED CAPABILITY GAPS</text><text x="0" y="43" class="h2">Not fake controls</text><text x="0" y="77" class="body muted">Common in mature account security, but</text><text x="0" y="97" class="body muted">they need real product/security contracts first.</text><line x1="0" y1="126" x2="350" y2="126" stroke="#fff" stroke-opacity=".09"/><text x="0" y="160" class="h2">MFA / passkeys</text><text x="0" y="184" class="small muted">Highest-priority security follow-up.</text><text x="0" y="222" class="h2">Session / device list</text><text x="0" y="246" class="small muted">Selective revoke; no fabricated telemetry.</text><text x="0" y="284" class="h2">Change sign-in email</text><text x="0" y="308" class="small muted">Requires identity + verification semantics.</text><text x="0" y="346" class="h2">Delete / export account data</text><text x="0" y="370" class="small muted">Requires durable-media retention semantics.</text><line x1="0" y1="405" x2="350" y2="405" stroke="#fff" stroke-opacity=".09"/><text x="0" y="440" class="small muted">Intentionally absent for now:</text><text x="0" y="464" class="small muted">profile avatar/name · notifications · billing</text><text x="0" y="484" class="small muted">API keys · theme/language-only filler</text><text x="0" y="540" class="label violet">PHASE 27 RULE</text><text x="0" y="568" class="small muted">Make existing capability feel complete.</text><text x="0" y="588" class="small muted">Do not pretend missing capability exists.</text></g></g>

<text x="34" y="1772" class="label muted">NARROW ACCEPTANCE</text><text x="34" y="1802" class="small muted">44px practical targets · no horizontal overflow · Show/Hide keyboard reachable · global sign-out scope explicit · same server-owned truth · reduced-motion static equivalent</text>
</svg>
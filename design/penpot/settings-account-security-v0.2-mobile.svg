<g transform="translate(896 94)"><rect width="390" height="860" rx="25" fill="url(#bg)" stroke="#fff" stroke-opacity=".10"/><rect x="14" y="14" width="362" height="52" rx="11" fill="#0b0c12" stroke="#fff" stroke-opacity=".08"/><text x="30" y="46" class="label">R</text><text x="330" y="46" class="small">Settings</text>
<g transform="translate(20 94)"><text x="0" y="12" class="small violet">← Settings</text><text x="0" y="55" class="h1">Change password</text><text x="0" y="80" class="body muted">Confirm your current password first.</text><line x1="0" y1="107" x2="350" y2="107" stroke="#fff" stroke-opacity=".10"/>

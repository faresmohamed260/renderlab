<svg xmlns="http://www.w3.org/2000/svg" width="4520" height="1100" viewBox="0 0 4520 1100">
  <defs>
    <style><![CDATA[
      .t{font-family:Inter,Arial,sans-serif;fill:#F4F5F7}.m{font-family:Inter,Arial,sans-serif;fill:#9CA3AF}.b{font-weight:600}.small{font-size:14px}.body{font-size:16px}.title{font-size:30px;font-weight:600}.brand{font-size:20px;font-weight:600}.nav{font-size:15px}.chip{font-size:13px}.cap{font-size:12px}
    ]]></style>
  </defs>

  <!-- ARTBOARD 1: Create Image -->
  <g id="create-image" transform="translate(20 20)">
    <rect width="1440" height="1024" rx="18" fill="#090A0C"/>
    <rect width="208" height="1024" fill="#111318"/>
    <line x1="208" x2="1440" y1="56" y2="56" stroke="#2B303A"/>
    <text class="t brand" x="20" y="36">RenderLab</text>
    <rect x="20" y="70" width="84" height="40" rx="10" fill="#20242C"/>
    <rect x="32" y="82" width="18" height="18" rx="5" fill="#7C6CF2"/><text class="t nav b" x="58" y="96">Create</text>
    <rect x="32" y="128" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="142">Library</text>
    <rect x="32" y="866" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="880">Activity</text>
    <rect x="32" y="912" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="926">Settings</text>
    <text class="t body b" x="232" y="36">Create</text>
    <rect x="1324" y="12" width="36" height="36" rx="10" fill="#171A20"/><circle cx="1386" cy="30" r="18" fill="#20242C"/>
    <text class="t title" x="432" y="258">What do you want to create?</text>
    <text class="m body" x="432" y="290">Start with an idea. Add a reference only when you need one.</text>
    <rect x="432" y="544" width="780" height="170" rx="18" fill="#111318" stroke="#2B303A"/>
    <text class="m body" x="450" y="576">Describe what you want to create...</text>
    <rect x="446" y="662" width="40" height="40" rx="10" fill="#171A20"/><text class="m title" x="458" y="692">+</text>
    <rect x="494" y="662" width="172" height="40" rx="10" fill="#171A20"/>
    <rect x="500" y="667" width="80" height="30" rx="8" fill="#20242C"/><text class="t chip b" x="526" y="687">Image</text><text class="m chip" x="603" y="687">Video</text>
    <rect x="676" y="662" width="76" height="40" rx="10" fill="#171A20"/><text class="m chip" x="695" y="687">1:1</text>
    <rect x="760" y="662" width="40" height="40" rx="10" fill="#171A20"/><text class="m body b" x="772" y="686">•••</text>
    <rect x="1080" y="662" width="116" height="40" rx="10" fill="#7C6CF2"/><text class="t chip b" x="1105" y="687">Generate</text>
  </g>

  <!-- ARTBOARD 2: Edit Image -->
  <g id="edit-image" transform="translate(1540 20)">
    <rect width="1440" height="1024" rx="18" fill="#090A0C"/>
    <rect width="208" height="1024" fill="#111318"/><line x1="208" x2="1440" y1="56" y2="56" stroke="#2B303A"/>
    <text class="t brand" x="20" y="36">RenderLab</text><rect x="20" y="70" width="84" height="40" rx="10" fill="#20242C"/><rect x="32" y="82" width="18" height="18" rx="5" fill="#7C6CF2"/><text class="t nav b" x="58" y="96">Create</text><rect x="32" y="128" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="142">Library</text><rect x="32" y="866" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="880">Activity</text><rect x="32" y="912" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="926">Settings</text><text class="t body b" x="232" y="36">Create</text><rect x="1324" y="12" width="36" height="36" rx="10" fill="#171A20"/><circle cx="1386" cy="30" r="18" fill="#20242C"/>
    <text class="t title" x="432" y="238">Edit an image</text><text class="m body" x="432" y="270">Your reference sets the context automatically.</text>
    <rect x="432" y="464" width="780" height="214" rx="18" fill="#111318" stroke="#2B303A"/><text class="m body" x="450" y="497">Describe what you want to change...</text>
    <rect x="450" y="522" width="72" height="72" rx="12" fill="#171A20" stroke="#2B303A"/><text class="m cap" x="470" y="563">Image</text><text class="t chip b" x="534" y="550" fill="#7C6CF2">Editing this image</text><text class="m cap" x="534" y="572">Remove or replace reference</text>
    <rect x="446" y="616" width="40" height="40" rx="10" fill="#171A20"/><text class="m title" x="458" y="646">+</text><rect x="494" y="616" width="172" height="40" rx="10" fill="#171A20"/><rect x="500" y="621" width="80" height="30" rx="8" fill="#20242C"/><text class="t chip b" x="526" y="641">Image</text><text class="m chip" x="603" y="641">Video</text><rect x="676" y="616" width="76" height="40" rx="10" fill="#171A20"/><text class="m chip" x="695" y="641">1:1</text><rect x="760" y="616" width="40" height="40" rx="10" fill="#171A20"/><text class="m body b" x="772" y="640">•••</text><rect x="1080" y="616" width="116" height="40" rx="10" fill="#7C6CF2"/><text class="t chip b" x="1105" y="641">Generate</text>
  </g>

  <!-- ARTBOARD 3: Create Video -->
  <g id="create-video" transform="translate(3060 20)">
    <rect width="1440" height="1024" rx="18" fill="#090A0C"/>
    <rect width="208" height="1024" fill="#111318"/><line x1="208" x2="1440" y1="56" y2="56" stroke="#2B303A"/>
    <text class="t brand" x="20" y="36">RenderLab</text><rect x="20" y="70" width="84" height="40" rx="10" fill="#20242C"/><rect x="32" y="82" width="18" height="18" rx="5" fill="#7C6CF2"/><text class="t nav b" x="58" y="96">Create</text><rect x="32" y="128" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="142">Library</text><rect x="32" y="866" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="880">Activity</text><rect x="32" y="912" width="18" height="18" rx="5" fill="#20242C"/><text class="m nav" x="58" y="926">Settings</text><text class="t body b" x="232" y="36">Create</text><rect x="1324" y="12" width="36" height="36" rx="10" fill="#171A20"/><circle cx="1386" cy="30" r="18" fill="#20242C"/>
    <text class="t title" x="432" y="238">Create a video</text><text class="m body" x="432" y="270">Only the essentials stay visible. More control is available when you ask for it.</text>
    <rect x="432" y="464" width="780" height="174" rx="18" fill="#111318" stroke="#2B303A"/><text class="m body" x="450" y="497">Describe what you want to create...</text>
    <rect x="446" y="576" width="40" height="40" rx="10" fill="#171A20"/><text class="m title" x="458" y="606">+</text><rect x="494" y="576" width="172" height="40" rx="10" fill="#171A20"/><text class="m chip" x="520" y="601">Image</text><rect x="580" y="581" width="80" height="30" rx="8" fill="#20242C"/><text class="t chip b" x="606" y="601">Video</text><rect x="676" y="576" width="76" height="40" rx="10" fill="#171A20"/><text class="m chip" x="693" y="601">16:9</text><rect x="760" y="576" width="64" height="40" rx="10" fill="#171A20"/><text class="m chip" x="780" y="601">5 s</text><rect x="832" y="576" width="40" height="40" rx="10" fill="#171A20"/><text class="m body b" x="844" y="600">•••</text><rect x="1080" y="576" width="116" height="40" rx="10" fill="#7C6CF2"/><text class="t chip b" x="1105" y="601">Generate</text>
  </g>
</svg>
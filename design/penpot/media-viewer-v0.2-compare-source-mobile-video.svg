  </g>

  <g transform="translate(18,440)">
    <text x="0" y="18" class="label muted">SOURCE</text>
    <rect x="0" y="32" width="354" height="144" rx="14" fill="#171A20" stroke="#2B303A"/>
    <rect x="12" y="44" width="138" height="78" rx="10" fill="#263B38"/>
    <path d="M18 112 L54 78 L82 98 L112 66 L144 112 Z" fill="#4F7A70"/>

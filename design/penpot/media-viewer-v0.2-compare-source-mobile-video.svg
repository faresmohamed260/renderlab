    <rect x="0" y="32" width="354" height="242" rx="14" fill="#171A20" stroke="#7C6CF2" stroke-opacity=".35"/>
    <rect x="12" y="44" width="330" height="186" rx="11" fill="#2E334A"/>
    <path d="M18 214 L106 126 L176 174 L254 112 L336 214 Z" fill="#535C83"/>

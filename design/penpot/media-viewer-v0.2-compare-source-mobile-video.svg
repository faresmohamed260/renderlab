    <circle cx="177" cy="137" r="28" fill="#F4F5F7" opacity=".15"/>
    <polygon points="168,121 168,153 196,137" fill="#F4F5F7" opacity=".9"/>
    <rect x="12" y="238" width="330" height="38" rx="8" fill="#0D0F13"/>
    <polygon points="28,249 28,265 42,257" fill="#F4F5F7"/>
    <rect x="54" y="255" width="226" height="4" rx="2" fill="#2B303A"/>
    <rect x="54" y="255" width="90" height="4" rx="2" fill="#7C6CF2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1260" viewBox="0 0 390 1260">
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#F4F5F7}.muted{fill:#9CA3AF}.title{font-size:19px;font-weight:600}.body{font-size:13px}.label{font-size:12px;font-weight:600}.small{font-size:11px}
  </style>
  <rect width="390" height="1260" fill="#090A0C"/>
  <rect width="390" height="56" fill="#0D0F13"/>
  <text x="20" y="35" class="label">Media Viewer</text>
  <text x="18" y="88" class="small muted">← Library</text>
  <text x="18" y="116" class="small muted">EXPERIMENTAL · Compare source · Image → Video</text>

  <g transform="translate(18,138)">
    <text x="0" y="18" class="label">RESULT VIDEO</text>
    <rect x="0" y="32" width="354" height="354" rx="14" fill="#171A20" stroke="#7C6CF2" stroke-opacity=".55"/>
    <rect x="12" y="44" width="330" height="282" rx="11" fill="#2E334A"/>
    <path d="M18 286 L106 150 L176 238 L254 132 L336 286 Z" fill="#535C83"/>
    <circle cx="273" cy="112" r="42" fill="#978BE9" opacity=".82"/>
    <polygon points="163,173 163,211 197,192" fill="#F4F5F7" opacity=".9"/>
    <rect x="12" y="334" width="330" height="40" rx="8" fill="#0D0F13"/>
    <polygon points="28,346 28,362 42,354" fill="#F4F5F7"/>
    <rect x="54" y="352" width="226" height="4" rx="2" fill="#2B303A"/>
    <rect x="54" y="352" width="90" height="4" rx="2" fill="#7C6CF2"/>
    <text x="292" y="359" class="small muted">0:04 / 0:10</text>
  </g>

  <g transform="translate(18,554)">
    <text x="0" y="18" class="label muted">SOURCE</text>
    <rect x="0" y="32" width="354" height="188" rx="14" fill="#171A20" stroke="#2B303A"/>
    <rect x="12" y="44" width="330" height="164" rx="11" fill="#263B38"/>
    <path d="M18 178 L108 96 L178 150 L252 82 L336 178 Z" fill="#4F7A70"/>
    <circle cx="278" cy="82" r="25" fill="#D8C98B" opacity=".8"/>
    <text x="0" y="244" class="small muted">Durable first-frame image</text>
    <rect x="222" y="228" width="132" height="34" rx="8" fill="#171A20" stroke="#2B303A"/>
    <text x="288" y="249" text-anchor="middle" class="small">Open source</text>
  </g>

  <g transform="translate(18,842)">
    <text x="0" y="18" class="small muted">VIDEO</text>
    <text x="0" y="48" class="title">Slow mountain camera drift</text>
    <text x="0" y="72" class="small muted">Created today at 10:18 AM</text>
    <rect x="0" y="96" width="354" height="1" fill="#2B303A"/>
    <text x="0" y="124" class="label">Prompt</text>
    <text x="0" y="148" class="small">Animate @image1 with a slow forward camera move,</text>
    <text x="0" y="167" class="small">subtle clouds and natural landscape motion.</text>
    <rect x="0" y="194" width="354" height="1" fill="#2B303A"/>
    <text x="0" y="222" class="label">Details</text>
    <text x="0" y="246" class="small muted">Resolution</text><text x="108" y="246" class="small">1080p</text>
    <text x="0" y="266" class="small muted">Duration</text><text x="108" y="266" class="small">10 seconds</text>
    <rect x="0" y="294" width="354" height="1" fill="#2B303A"/>
    <text x="0" y="322" class="label">Continue</text>
    <rect x="0" y="340" width="171" height="42" rx="9" fill="#171A20" stroke="#2B303A"/><text x="85.5" y="366" text-anchor="middle" class="small">Reuse settings</text>
    <rect x="183" y="340" width="171" height="42" rx="9" fill="#20242C" stroke="#7C6CF2" stroke-opacity=".6"/><text x="268.5" y="366" text-anchor="middle" class="small">Hide source</text>
    <rect x="0" y="410" width="354" height="1" fill="#2B303A"/>
    <text x="0" y="438" class="label">Actions</text>
    <rect x="0" y="456" width="354" height="42" rx="9" fill="#171A20" stroke="#2B303A"/><text x="177" y="482" text-anchor="middle" class="small">Favorite · Collection · More</text>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library — phone inspector</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.root{position:relative;width:390px;height:844px;overflow:hidden;background:#07060b;color:#f5f5f7;font-family:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;letter-spacing:-0.01em}
.atm{position:absolute;inset:0;background:radial-gradient(70% 32% at 80% 6%,rgba(117,94,210,.42),rgba(117,94,210,0) 70%),radial-gradient(60% 30% at 6% 86%,rgba(217,100,160,.20),rgba(217,100,160,0) 70%)}
.act{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-radius:18px;border:0;background:rgba(255,255,255,.09);color:#f5f5f7;font:500 15px/1 inherit;text-align:left;cursor:pointer;width:100%}
.act.primary{background:linear-gradient(135deg,#6d50d1,#9841bd);color:#fff;font-weight:600}
.act.danger{color:#ffb4b4}
h2,h3,p{margin:0}
</style>
</helmet>
<div class="root">
<div class="atm" aria-hidden="true"></div>
<div aria-hidden="true" style="position:absolute;left:12px;right:12px;top:64px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;opacity:.5">
<span style="aspect-ratio:1/1;border-radius:22px;background:linear-gradient(160deg,#6f8196,#d9a98a 60%,#c07f5d)"></span><span style="aspect-ratio:1/1;border-radius:22px;background:linear-gradient(160deg,#2c3e63,#7a6cc2 60%,#d98fb0)"></span>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(7,6,11,.55)"></div>

<section aria-label="Image details" style="position:absolute;left:0;top:70px;width:390px;height:774px;box-sizing:border-box;padding:8px 16px 0;border-radius:34px 34px 0 0;background:rgba(26,21,46,.92);backdrop-filter:blur(40px) saturate(1.5);border-top:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px;overflow:hidden">
<div aria-hidden="true" style="align-self:center;width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:40px"><h2 style="font-size:20px;font-weight:700">Sandstone arch</h2><button type="button" style="height:44px;padding:0 6px;border:0;background:transparent;color:#b5a9ff;font:600 16px/1 inherit;cursor:pointer">Done</button></div>

<div style="position:relative;height:300px;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,#6f8196,#d9a98a 60%,#c07f5d);flex:none">
<button type="button" aria-label="Compare with source" style="position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,16,14,.42);backdrop-filter:blur(24px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="7" height="14" rx="2"/><rect x="13" y="5" width="7" height="14" rx="2"/></svg></button>
</div>

<div style="flex:none"><p style="font-size:13px;font-weight:500;color:rgba(245,245,247,.72)">Prompt</p><p style="margin-top:4px;font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">A quiet architectural study of a sandstone arch in a wide desert, warm evening light</p><p style="margin-top:6px;font-size:12px;color:rgba(245,245,247,.72)">4:3 · Created today</p></div>

<div style="display:flex;flex-direction:column;gap:8px">
<button type="button" class="act primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/></svg>Open in Create</button>
<button type="button" class="act"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Favorite</button>
<button type="button" class="act"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Download</button>
<button type="button" class="act danger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>Delete</button>
</div>
</section>
</div>
</x-dc>

</body>
</html>

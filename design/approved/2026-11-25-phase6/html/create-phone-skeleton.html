<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading skeleton — phone app</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
@keyframes sh{0%{background-position:-420px 0}100%{background-position:420px 0}}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.06) 0,rgba(255,255,255,.13) 50%,rgba(255,255,255,.06) 100%);background-size:840px 100%;animation:sh 1.5s linear infinite}
@media (prefers-reduced-motion:reduce){.sk{animation:none;background:rgba(255,255,255,.08)}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#07060b;color:#f5f5f7;font-family:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;letter-spacing:-0.01em">

<div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(70% 32% at 80% 6%,rgba(117,94,210,.42),rgba(117,94,210,0) 70%),radial-gradient(60% 30% at 6% 86%,rgba(217,100,160,.20),rgba(217,100,160,0) 70%)"></div>

<button type="button" aria-label="Open navigation menu" style="position:absolute;left:12px;top:8px;height:44px;display:flex;align-items:center;gap:10px;padding:0 16px 0 8px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(28px) saturate(1.6);color:#f5f5f7;font:600 16px/1 -apple-system,'SF Pro Display','Inter',system-ui,sans-serif;cursor:pointer"><span aria-hidden="true" style="width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#a89bff,#6251c7)"></span>RenderLab</button>
<div aria-hidden="true" class="sk" style="position:absolute;right:12px;top:8px;width:44px;height:44px;border-radius:50%"></div>

<div role="status" aria-label="Loading your session" class="sk" style="position:absolute;left:12px;top:64px;width:366px;height:560px;border-radius:34px"></div>

<div aria-hidden="true" style="position:absolute;left:0;right:0;top:636px;display:flex;justify-content:center;gap:6px"><span class="sk" style="width:18px;height:6px;border-radius:3px"></span><span class="sk" style="width:6px;height:6px;border-radius:3px"></span><span class="sk" style="width:6px;height:6px;border-radius:3px"></span></div>

<div style="position:absolute;left:12px;top:662px;width:366px;height:150px;box-sizing:border-box;padding:12px 14px 12px 18px;border-radius:32px;background:rgba(255,255,255,.08);backdrop-filter:blur(32px) saturate(1.7);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:space-between">
<label for="pM5" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Describe your image</label>
<textarea id="pM5" rows="3" placeholder="Describe your image…" style="width:100%;height:68px;resize:none;border:0;outline:0;background:transparent;color:#f5f5f7;font:400 17px/1.35 -apple-system,'SF Pro Display','Inter',system-ui,sans-serif;padding:0"></textarea>
<div style="display:flex;align-items:center;gap:8px">
<span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12)"></span>
<span aria-hidden="true" style="flex:none;width:76px;height:44px;border-radius:22px;background:rgba(255,255,255,.12)"></span>
<span aria-hidden="true" style="flex:none;width:56px;height:44px;border-radius:22px;background:rgba(255,255,255,.12)"></span>
<span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12)"></span>
<div style="flex:1"></div>
<button type="button" aria-label="Generate" disabled style="flex:none;width:52px;height:52px;border-radius:50%;border:0;background:rgba(124,108,242,.35);color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>
</div>

</div>
</x-dc>

</body>
</html>

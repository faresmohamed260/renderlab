<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History sheet — phone app</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#07060b;color:#f5f5f7;font-family:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;letter-spacing:-0.01em">

<div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(70% 32% at 80% 6%,rgba(117,94,210,.42),rgba(117,94,210,0) 70%),radial-gradient(60% 30% at 6% 86%,rgba(217,100,160,.20),rgba(217,100,160,0) 70%)"></div>
<div aria-hidden="true" style="position:absolute;left:12px;top:64px;width:366px;height:500px;border-radius:34px;background:linear-gradient(160deg,#6f8196,#d9a98a 60%,#c07f5d)"></div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(7,6,11,.55)"></div>

<section aria-label="History" style="position:absolute;left:0;top:84px;width:390px;height:760px;box-sizing:border-box;padding:8px 16px 0;border-radius:34px 34px 0 0;background:rgba(26,21,46,.9);backdrop-filter:blur(40px) saturate(1.5);border-top:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px;overflow:hidden">
<div aria-hidden="true" style="align-self:center;width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:40px"><h2 style="margin:0;font-size:22px;font-weight:700">History</h2><button type="button" style="height:44px;padding:0 6px;border:0;background:transparent;color:#b5a9ff;font:600 16px/1 -apple-system,'Inter',sans-serif;cursor:pointer">Done</button></div>

<div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px"><h3 style="margin:0;font-size:13px;font-weight:500;color:rgba(245,245,247,.7)">Jobs</h3><span style="font-size:12px;color:rgba(245,245,247,.62)">Status, retry and settings</span></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.07)"><span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:#8575f5"></span></span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">Running</div><div style="font-size:12px;color:rgba(245,245,247,.62)">Started a moment ago</div></div><button type="button" style="height:44px;padding:0 10px;border:0;background:transparent;color:#b5a9ff;font:600 14px/1 -apple-system,'Inter',sans-serif;cursor:pointer">Cancel</button></div>
<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.07)"><span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:12px;background:rgba(240,128,128,.14);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f08080" stroke-width="2.2" stroke-linecap="round"><path d="M12 7v6M12 17h0"/></svg></span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">Didn't finish</div><div style="font-size:12px;color:rgba(245,245,247,.62)">Timed out · 18 min ago</div></div><button type="button" style="height:44px;padding:0 10px;border:0;background:transparent;color:#b5a9ff;font:600 14px/1 -apple-system,'Inter',sans-serif;cursor:pointer">Retry</button><button type="button" style="height:44px;padding:0 6px;border:0;background:transparent;color:rgba(245,245,247,.82);font:500 14px/1 -apple-system,'Inter',sans-serif;cursor:pointer">Reuse</button></div>
</div>
</div>

<div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px"><h3 style="margin:0;font-size:13px;font-weight:500;color:rgba(245,245,247,.7)">This session</h3><span style="font-size:13px;color:rgba(245,245,247,.62)">4 results</span></div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
<button type="button" aria-current="true" aria-label="Sandstone arch, just now" style="aspect-ratio:1/1;padding:0;border-radius:18px;border:2px solid #fff;background:linear-gradient(160deg,#6f8196,#d9a98a 60%,#c07f5d);cursor:pointer"></button>
<button type="button" aria-label="Twilight skyline, 12 minutes ago" style="aspect-ratio:1/1;padding:0;border-radius:18px;border:0;background:linear-gradient(160deg,#2c3e63,#7a6cc2 60%,#d98fb0);cursor:pointer"></button>
<button type="button" aria-label="Misty pine forest, 31 minutes ago" style="aspect-ratio:1/1;padding:0;border-radius:18px;border:0;background:linear-gradient(160deg,#17332e,#3f8f7b 60%,#c4e2b4);cursor:pointer"></button>
<button type="button" aria-label="Studio portrait, 48 minutes ago" style="aspect-ratio:1/1;padding:0;border-radius:18px;border:0;background:linear-gradient(160deg,#3b1f2b,#a8445a 60%,#f0a98a);cursor:pointer"></button>
</div>
</div>

<div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px"><h3 style="margin:0;font-size:13px;font-weight:500;color:rgba(245,245,247,.7)">Prompt history</h3><span style="font-size:12px;color:rgba(245,245,247,.62)">Tap to reuse</span></div>
<div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:rgba(255,255,255,.07);margin-bottom:4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(245,245,247,.62)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input aria-label="Search prompts" placeholder="Search prompts" style="flex:1;min-width:0;border:0;outline:0;background:transparent;color:#f5f5f7;font:400 15px/1 -apple-system,'Inter',sans-serif"></div>
<ul style="list-style:none;margin:0;padding:0">
<li style="border-bottom:1px solid rgba(255,255,255,.07)"><button type="button" style="width:100%;min-height:52px;padding:10px 6px;border:0;background:transparent;color:rgba(245,245,247,.9);font:400 14px/1.4 -apple-system,'Inter',sans-serif;text-align:left;cursor:pointer"><span class="clamp2">A quiet architectural study of a sandstone arch in a wide desert, warm evening light</span></button></li>
<li style="border-bottom:1px solid rgba(255,255,255,.07)"><button type="button" style="width:100%;min-height:52px;padding:10px 6px;border:0;background:transparent;color:rgba(245,245,247,.9);font:400 14px/1.4 -apple-system,'Inter',sans-serif;text-align:left;cursor:pointer"><span class="clamp2">Twilight skyline over a calm harbor, soft violet haze and distant lights</span></button></li>
<li><button type="button" style="width:100%;min-height:52px;padding:10px 6px;border:0;background:transparent;color:rgba(245,245,247,.9);font:400 14px/1.4 -apple-system,'Inter',sans-serif;text-align:left;cursor:pointer"><span class="clamp2">Misty pine forest at dawn, shafts of light through the trees</span></button></li>
</ul>
</div>
</section>

</div>
</x-dc>

</body>
</html>
